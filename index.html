    <nav id="bottom-nav" class="fixed inset-x-0 bottom-0 z-30 grid grid-cols-4 border-t border-line bg-panel lg:hidden" data-i18n-aria="nav.bottom" aria-label="Điều hướng nhanh"></nav>
    <dialog id="side-drawer" class="m-0 h-dvh max-h-none w-[290px] max-w-[85vw] rounded-none rounded-r-(--r-card) p-0" aria-labelledby="side-drawer-title"></dialog>
    <!-- v4 §B.2 layer 1 (Plan 7): welcome screen during the DB download, and the static tour replay; filled by src/ui/welcome.ts. -->
    <dialog id="welcome-dialog" class="w-[min(640px,calc(100vw-2rem))]" aria-labelledby="welcome-title"></dialog>
    <dialog id="inbox-dialog" aria-labelledby="inbox-title">
      <h2 id="inbox-title" class="text-lg" data-i18n="top.inbox">Hộp thư</h2>
      <div id="inbox-list" class="max-h-[60dvh] overflow-auto"></div>
      <form method="dialog" class="mt-3 flex justify-end"><button data-i18n="app.close">Đóng</button></form>
    </dialog>
    <!-- ui-ux-v7 W2 (D-U3): 480 px from 1024 px so it covers less of the result; a task's dock folds to one line once its motion ends (data-mini, ui/stage.ts). -->
    <div id="stage" class="pointer-events-none fixed inset-x-4 bottom-4 z-40 max-lg:bottom-18 sm:left-auto sm:w-[480px]" hidden>
      <div class="overflow-hidden rounded-(--r-card) bg-panel shadow-(--shadow-2) ring-1 ring-line">
        <div id="stage-art" class="relative" aria-hidden="true"></div>
        <div class="stage-row flex items-center gap-3 border-t border-line px-4 py-2">
          <span class="stage-mini-icon hidden size-6 shrink-0 place-items-center rounded-full bg-good-soft text-body-sm font-black text-good" aria-hidden="true">✓</span>
          <p id="stage-text" class="m-0 flex-1 text-body-sm"></p>
          <button id="stage-replay" type="button" class="pointer-events-auto shrink-0 px-3 py-1 text-body-sm" data-i18n="anim.replay" hidden>Xem lại</button>
          <button id="stage-skip" type="button" class="pointer-events-auto shrink-0 px-3 py-1 text-body-sm"></button>
        </div>
      </div>
    </div>
    <!-- ui-ux-v4 §3: the route map without leaving the task; filled by src/ui/mapStrip.ts. Padding sits on the inner box so a click on the dialog itself is the backdrop. Below sm: bottom sheet. -->
    <dialog id="map-dialog" class="max-h-[calc(100dvh-4rem)] w-[min(960px,calc(100vw-2rem))] overflow-auto rounded-(--r-card) p-0 max-sm:mb-0 max-sm:max-h-[85dvh] max-sm:w-full max-sm:max-w-none max-sm:rounded-b-none" aria-labelledby="map-dialog-title"></dialog>
    <!-- product-design-v4 §C.3: a quick lesson opened from a skill chip or the handbook; filled by src/ui/lessonCard.ts. L140: tall and wide, p-0 so its header sticks while the body scrolls; below sm a near full-screen sheet. -->
    <dialog id="lesson-dialog" class="max-h-[min(92dvh,1100px)] w-[min(900px,calc(100vw-2rem))] max-w-none overflow-auto p-0 max-sm:mb-0 max-sm:max-h-[96dvh] max-sm:w-full max-sm:rounded-b-none" aria-labelledby="lesson-dialog-title"></dialog>
    <dialog id="notebook-dialog" class="fixed inset-auto top-16 right-4 z-30 m-0 max-h-[calc(100dvh-6rem)] w-[min(380px,calc(100vw-2rem))] overflow-auto max-sm:inset-x-4 max-sm:top-auto max-sm:bottom-4 max-sm:max-h-[60dvh] max-sm:w-auto" aria-labelledby="notebook-title"></dialog>
    <!-- L42: replaces part of L11; holds only Export / Import progress. Outside <header> so focus uses --accent. -->
    <div id="more-menu" popover class="m-0 min-w-52 rounded-(--r-ctl) border-0 bg-panel p-1 text-ink shadow-lg ring-1 ring-line [inset:3.5rem_1rem_auto_auto]">
      <div class="flex flex-col">
        <!-- v12.0 U1: below 640 px the bar keeps one line; these copy the bar's Inbox / Review / Notebook and settings. v6 F1 (D-V9): from 1024 to 1439 px the bar folds VI|EN and theme in here. -->
        <div data-menu-prefs class="mb-1 flex flex-col border-b border-line pb-1 sm:max-lg:hidden min-[1440px]:hidden">
          <div data-menu-proxies class="flex flex-col sm:hidden">
          <button type="button" data-proxy="inbox-btn" popovertarget="more-menu" popovertargetaction="hide" class="flex w-full items-center gap-2 rounded-(--r-inset) border-0 bg-transparent px-3 py-2 text-left hover:bg-code"><span data-icon="inbox" data-icon-class="size-4"></span><span data-label data-i18n="top.inbox">Hộp thư</span></button>
          <button type="button" data-proxy="review-btn" popovertarget="more-menu" popovertargetaction="hide" class="flex w-full items-center gap-2 rounded-(--r-inset) border-0 bg-transparent px-3 py-2 text-left hover:bg-code" hidden><span data-icon="repeat" data-icon-class="size-4"></span><span data-label data-i18n="top.review">Ôn tập</span></button>
          <button type="button" data-proxy="notebook-btn" popovertarget="more-menu" popovertargetaction="hide" class="flex w-full items-center gap-2 rounded-(--r-inset) border-0 bg-transparent px-3 py-2 text-left hover:bg-code"><span data-icon="book" data-icon-class="size-4"></span><span data-label data-i18n="nb.open">Sổ tay</span></button>
          </div>
          <div class="flex items-center gap-1 px-3 py-2">
            <div class="flex gap-0.5" role="group" data-i18n-aria="top.lang" aria-label="Ngôn ngữ">
              <button type="button" data-lang="vi" aria-pressed="true" class="rounded-full border-0 bg-transparent px-2 py-0.5 text-body-sm text-ink hover:bg-code aria-pressed:bg-code aria-pressed:font-bold">VI</button>
              <button type="button" data-lang="en" aria-pressed="false" class="rounded-full border-0 bg-transparent px-2 py-0.5 text-body-sm text-ink hover:bg-code aria-pressed:bg-code aria-pressed:font-bold">EN</button>
            </div>
            <span class="mx-1 h-5 w-px bg-line" aria-hidden="true"></span>
            <div class="flex gap-0.5" role="group" data-i18n-aria="top.theme" aria-label="Giao diện">
              <button type="button" data-theme-pref="light" aria-pressed="false" class="grid size-7 place-items-center rounded-full border-0 bg-transparent p-0 text-ink hover:bg-code aria-pressed:bg-code" data-i18n-aria="theme.light" aria-label="Sáng"><span data-icon="sun" data-icon-class="size-4"></span></button>
              <button type="button" data-theme-pref="system" aria-pressed="true" class="grid size-7 place-items-center rounded-full border-0 bg-transparent p-0 text-ink hover:bg-code aria-pressed:bg-code" data-i18n-aria="theme.system" aria-label="Theo hệ thống"><span data-icon="monitor" data-icon-class="size-4"></span></button>
              <button type="button" data-theme-pref="dark" aria-pressed="false" class="grid size-7 place-items-center rounded-full border-0 bg-transparent p-0 text-ink hover:bg-code aria-pressed:bg-code" data-i18n-aria="theme.dark" aria-label="Tối"><span data-icon="moon" data-icon-class="size-4"></span></button>
            </div>
          </div>
        </div>
        <button id="replay-btn" type="button" popovertarget="more-menu" popovertargetaction="hide" class="flex w-full items-center gap-2 rounded-(--r-inset) border-0 bg-transparent px-3 py-2 text-left hover:bg-code"><span data-icon="info" data-icon-class="size-4"></span><span data-i18n="tour.replay">Xem lại hướng dẫn</span></button>
        <button id="guides-btn" type="button" popovertarget="more-menu" popovertargetaction="hide" class="flex w-full items-center gap-2 rounded-(--r-inset) border-0 bg-transparent px-3 py-2 text-left hover:bg-code"><span data-icon="info" data-icon-class="size-4"></span><span data-i18n="guide.reset">Bật lại hướng dẫn của Boon</span></button>
        <button id="diag-btn" type="button" popovertarget="more-menu" popovertargetaction="hide" class="flex w-full items-center gap-2 rounded-(--r-inset) border-0 bg-transparent px-3 py-2 text-left hover:bg-code"><span data-icon="copy" data-icon-class="size-4"></span><span data-i18n="diag.copy">Sao chép thông tin chẩn đoán</span></button>
        <button id="export-btn" type="button" popovertarget="more-menu" popovertargetaction="hide" class="flex w-full items-center gap-2 rounded-(--r-inset) border-0 bg-transparent px-3 py-2 text-left hover:bg-code"><span data-icon="download" data-icon-class="size-4"></span><span data-i18n="top.export">Xuất tiến độ</span></button>
        <button id="import-btn" type="button" popovertarget="more-menu" popovertargetaction="hide" class="flex w-full items-center gap-2 rounded-(--r-inset) border-0 bg-transparent px-3 py-2 text-left hover:bg-code"><span data-icon="upload" data-icon-class="size-4"></span><span data-i18n="top.import">Nhập tiến độ</span></button>
      </div>
    </div>
    <!-- v5 §B.2: domain switch; Finance and E-commerce open their "Coming soon" page (filled by src/ui/topbar.ts). -->
    <div id="domain-menu" popover class="m-0 min-w-64 rounded-(--r-card) border-0 bg-panel p-1 text-ink shadow-lg ring-1 ring-line [inset:3.5rem_auto_auto_1rem]"></div>
    <input id="import-input" type="file" accept="application/json" hidden />
    <p id="announce" class="sr-only" aria-live="polite"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
