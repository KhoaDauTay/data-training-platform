# Đồng nghiệp ở Tín dụng Hũ Bạc (Plan 11, product-design-v9 §2.2). Cùng định dạng content/people.yml (src/people.ts parsePeople).
# employee: null (domain Finance không có bảng nhân viên). tables: bảng trong schema finance (src/db/fin/schema.sql).
# Tên không trùng người nào của Logistics hay E-com (personOf tìm theo tên). Mọi chuỗi đặt trong nháy kép; EN không dấu.

- name: "Lương Bảo Châu"
  dept: Management
  employee: null
  role: { vi: "Tổng giám đốc", en: "CEO" }
  bio: { vi: "Mở Hũ Bạc từ một quầy nhỏ ở Đà Nẵng; chỉ gửi các buổi đánh giá thăng tiến, và luôn hỏi \"vì sao\".", en: "Started Silver Jar from one small counter in Da Nang; only sends the promotion reviews, and always asks \"why\"." }
  tables: [loans, branches]
  look: { skin: light, hair: black, style: bun, accessory: none }

- name: "Tạ Minh Nhật"
