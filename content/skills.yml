# Danh mục kỹ năng. id là khóa dùng trong requires/grants của ticket.
# Mỗi kỹ năng được đúng một ticket grant, ở đúng chương ghi ở đây.
# Thẻ kỹ năng (syntax/when/trap) hiện trong Sổ tay; tổng cộng ≤ 6 dòng.
# Kỹ năng chương 4–6 thêm vào đây TRƯỚC khi viết ticket của chương đó (Plan 2/3).
# Mọi chuỗi đặt trong nháy kép (dấu phẩy trong { … } sẽ cắt chuỗi nếu không có nháy).

- id: select
  chapter: 1
  label: { vi: "Chọn cột (SELECT)", en: "Select columns (SELECT)" }
  syntax: "SELECT name, price_vnd FROM products"
  when: { vi: "Chỉ lấy những cột cần cho câu hỏi.", en: "Pull only the columns the question needs." }
  trap: { vi: "SELECT * kéo cả cột thừa và làm sai số cột khi nộp.", en: "SELECT * drags in extra columns and fails the column count." }

- id: where
  chapter: 1
  label: { vi: "Lọc dòng (WHERE)", en: "Filter rows (WHERE)" }
  syntax: "WHERE category = 'Drinks' AND price_vnd < 20000"
  when: { vi: "Giữ lại các dòng thỏa điều kiện.", en: "Keep only the rows that match a condition." }
  trap: { vi: "Chuỗi dùng nháy đơn, nháy kép là tên cột. Trộn AND với OR thì đặt ngoặc.", en: "Strings take single quotes, double quotes mean a column name. Mixing AND with OR needs parentheses." }

- id: order_by
  chapter: 1
  label: { vi: "Sắp xếp (ORDER BY)", en: "Sort (ORDER BY)" }
  syntax: "ORDER BY price_vnd DESC, name"
  when: { vi: "Đề yêu cầu thứ tự hoặc xếp hạng.", en: "The question asks for an order or a ranking." }
  trap: { vi: "Thiếu tiêu chí sắp xếp phụ thì các dòng trùng giá trị có thể đổi chỗ giữa các lần chạy.", en: "Without a tie-breaker column, rows with equal values can come back in any order." }

- id: limit
  chapter: 1
  label: { vi: "Lấy top N (LIMIT)", en: "Top N (LIMIT)" }
  syntax: "ORDER BY price_vnd DESC, name LIMIT 3"
  when: { vi: "Chỉ cần N dòng đầu sau khi sắp xếp.", en: "You only need the first N rows after sorting." }
  trap: { vi: "LIMIT không có ORDER BY trả về N dòng bất kỳ.", en: "LIMIT without ORDER BY returns any N rows." }

- id: aggregate
  chapter: 2
  label: { vi: "COUNT/SUM/AVG/MIN/MAX, ROUND", en: "COUNT/SUM/AVG/MIN/MAX, ROUND" }
  syntax: "SELECT count(*), ROUND(AVG(price_vnd), 2) FROM products"
  when: { vi: "Gộp nhiều dòng thành một con số.", en: "Collapse many rows into one number." }
  trap: { vi: "count(cột) bỏ qua NULL, còn count(*) đếm mọi dòng.", en: "count(column) skips NULLs, count(*) counts every row." }

- id: group_by
  chapter: 2
  label: { vi: "Gom nhóm (GROUP BY)", en: "Group by" }
  syntax: "SELECT city, count(*) FROM stores GROUP BY city"
  when: { vi: "Cần một con số cho mỗi nhóm: mỗi khách, mỗi tháng, mỗi loại.", en: "You need one number per group: per customer, month or category." }
  trap: { vi: "Cột trong SELECT không nằm trong hàm gộp thì phải có trong GROUP BY.", en: "Every SELECT column outside an aggregate must be in GROUP BY." }

- id: having
  chapter: 2
  label: { vi: "Lọc nhóm (HAVING)", en: "Filter groups" }
  syntax: "GROUP BY city HAVING count(*) > 50"
  when: { vi: "Lọc theo kết quả của hàm gộp.", en: "Filter on the result of an aggregate." }
  trap: { vi: "WHERE lọc dòng trước khi nhóm, HAVING lọc nhóm sau khi gộp.", en: "WHERE filters rows before grouping, HAVING filters groups after." }

- id: join
  chapter: 3
  label: { vi: "Nối 2 bảng (JOIN)", en: "Inner join" }
  syntax: "FROM orders o JOIN stores s ON s.id = o.store_id"
  when: { vi: "Cần cột của bảng khác qua khóa ngoại.", en: "You need columns from another table through a foreign key." }
  trap: { vi: "Thiếu hoặc sai ON thì số dòng bị nhân lên.", en: "A missing or wrong ON multiplies the rows." }

- id: multi_join
  chapter: 3
  label: { vi: "Nối nhiều bảng", en: "Multi-table join" }
  syntax: "FROM orders o JOIN order_items i ON i.order_id = o.id JOIN products p ON p.id = i.product_id"
  when: { vi: "Dữ liệu cần nằm cách nhau từ 2 khóa ngoại trở lên.", en: "The data you need is two or more foreign keys apart." }
  trap: { vi: "Mỗi JOIN cần ON riêng. Dùng alias để biết cột thuộc bảng nào.", en: "Every JOIN needs its own ON. Use aliases to tell columns apart." }

- id: left_join
  chapter: 3
  label: { vi: "Giữ dòng không khớp (LEFT JOIN)", en: "Left join" }
  syntax: "FROM stores s LEFT JOIN orders o ON o.store_id = s.id"
  when: { vi: "Phải giữ mọi dòng bên trái, kể cả dòng không có cặp.", en: "Keep every left-hand row, even without a match." }
  trap: { vi: "Điều kiện trên bảng bên phải đặt ở WHERE sẽ biến LEFT JOIN thành JOIN thường. Đặt nó vào ON.", en: "A WHERE condition on the right-hand table turns it back into an inner join. Put it in ON." }

- id: anti_join
  chapter: 3
  label: { vi: "Tìm dòng không có cặp (anti-join)", en: "Anti-join" }
  syntax: "LEFT JOIN orders o ON o.store_id = s.id WHERE o.id IS NULL"
  when: { vi: "Tìm khách chưa có đơn nào, mục không có dòng nào ở bảng kia…", en: "Find customers with no orders, items with no rows in the other table…" }
  trap: { vi: "NOT IN trên danh sách có NULL trả về rỗng. Dùng LEFT JOIN … IS NULL hoặc NOT EXISTS.", en: "NOT IN over a list containing NULL returns nothing. Use LEFT JOIN … IS NULL or NOT EXISTS." }

- id: date_math
  chapter: 4
  label: { vi: "Tính trên ngày", en: "Date arithmetic" }
  syntax: "shipped_on - order_date AS wait_days, order_date + 7, DATE '2026-10-31' - order_date"
  when: { vi: "Cần số ngày giữa hai mốc, hoặc một ngày cách mốc N ngày.", en: "You need the days between two dates, or the date N days after one." }
  trap: { vi: "Ngày trừ ngày ra số ngày (số nguyên). Ngày cộng interval ra timestamp, không còn là ngày; cộng số nguyên thì vẫn là ngày.", en: "A date minus a date gives a number of days. A date plus an interval becomes a timestamp; plus an integer it stays a date." }

- id: date_bucket
  chapter: 4
  label: { vi: "Gom theo ngày, tuần, tháng", en: "Group by day, week or month" }
  syntax: "SELECT date_trunc('month', order_date), count(*) ... GROUP BY 1 ORDER BY 1"
  when: { vi: "Cần một con số cho mỗi tháng, mỗi tuần, mỗi ngày.", en: "You need one number per month, week or day." }
  trap: { vi: "date_trunc('week', …) bắt đầu tuần từ thứ Hai; extract(month …) chỉ ra số tháng, gộp lẫn tháng 10 của hai năm.", en: "date_trunc('week', …) starts weeks on Monday; extract(month …) only gives the month number and merges October of two years." }

- id: null_logic
  chapter: 4
  label: { vi: "Giá trị trống (NULL)", en: "Missing values (NULL)" }
  syntax: "WHERE shipped_on IS NULL AND status <> 'CANCELLED'"
  when: { vi: "Tìm thứ chưa được ghi: ngày đến thực tế, ngày thông quan…", en: "Find what has not been recorded yet: actual arrival, clearance date…" }
  trap: { vi: "= NULL không bao giờ đúng, phải viết IS NULL. Ô trống có thể vì nhiều lý do (đơn hủy cũng không có ngày giao).", en: "= NULL is never true; write IS NULL. A value can be empty for several reasons (a cancelled order is never delivered either)." }

- id: case_when
  chapter: 5
  label: { vi: "Phân loại bằng CASE", en: "Classify with CASE" }
  syntax: "CASE WHEN birth_year < 1980 THEN 1 WHEN birth_year < 1995 THEN 2 ELSE 3 END"
  when: { vi: "Đặt mỗi dòng vào một nhóm theo điều kiện.", en: "Put each row into a group by a condition." }
  trap: { vi: "CASE dừng ở điều kiện đúng đầu tiên, nên xếp điều kiện hẹp lên trước. Thiếu ELSE thì ra NULL.", en: "CASE stops at the first true condition, so put the narrow ones first. Without ELSE you get NULL." }

- id: conditional_agg
  chapter: 5
  label: { vi: "Đếm có điều kiện", en: "Conditional aggregates" }
  syntax: "count(*) FILTER (WHERE channel = 'ONLINE'), SUM(CASE WHEN price_vnd >= 50000 THEN 1 ELSE 0 END)"
  when: { vi: "Cần nhiều con số theo điều kiện trên cùng một dòng, mỗi điều kiện một cột.", en: "You need several conditional counts side by side, one column per condition." }
  trap: { vi: "Lọc ở WHERE thì mất các dòng khác cho cột kia. Đặt điều kiện vào FILTER hoặc CASE của từng cột.", en: "A WHERE filter drops the rows the other columns need. Put each condition in that column's FILTER or CASE." }

- id: coalesce
  chapter: 5
  label: { vi: "Thay giá trị trống (COALESCE)", en: "Fill in missing values" }
  syntax: "COALESCE(birth_year, 0), NULLIF(x, 0)"
  when: { vi: "Dùng một giá trị mặc định khi dữ liệu còn trống.", en: "Use a default when the data is missing." }
  trap: { vi: "Phép tính với NULL ra NULL, và SUM bỏ qua NULL mà không báo. COALESCE trước khi tính.", en: "Arithmetic with NULL gives NULL, and SUM skips NULLs silently. COALESCE before you calculate." }

- id: self_join
  chapter: 5
  label: { vi: "Nối bảng với chính nó (self-join)", en: "Self-join" }
  syntax: "FROM staff e JOIN staff m ON m.id = e.manager_id"
  when: { vi: "Một dòng trỏ tới dòng khác cùng bảng: tờ khai sửa, khách trùng, quản lý của nhân viên.", en: "A row points to another row of the same table: amendments, duplicates, an employee's manager." }
  trap: { vi: "Đặt hai alias khác nhau và nhớ chuỗi có thể dài hơn một bước (sửa rồi lại sửa).", en: "Use two different aliases, and remember a chain can be longer than one step (amended, then amended again)." }

- id: string_fn
  chapter: 6
  label: { vi: "Hàm chuỗi", en: "String functions" }
  syntax: "upper(name), trim(full_name), replace(email, ' at ', '@'), regexp_replace(phone, '[^0-9]', '', 'g'), a || b"
  when: { vi: "Chuẩn hóa hoặc ghép chữ trước khi in, so sánh hay gom nhóm.", en: "Normalise or build text before printing, comparing or grouping." }
  trap: { vi: "replace chỉ thay một chuỗi cố định, và thay mọi chỗ khớp kể cả giữa câu. Muốn bỏ một trong nhiều tiền tố thì dùng regexp_replace với ^ neo đầu chuỗi và | cho các lựa chọn.", en: "replace swaps one fixed string, everywhere it appears, even mid-text. To drop one of several prefixes, use regexp_replace with ^ to anchor the start and | between the options." }

- id: pattern_match
  chapter: 6
  label: { vi: "Tìm theo mẫu chữ (LIKE, ILIKE)", en: "Pattern matching" }
  syntax: "WHERE name ILIKE '%tea%'"
  when: { vi: "Tìm chữ nằm đâu đó trong một ô gõ tay.", en: "Find a word somewhere inside free text." }
  trap: { vi: "LIKE phân biệt hoa thường; ILIKE thì không. Thiếu % ở hai đầu thì chỉ khớp nguyên ô.", en: "LIKE is case-sensitive; ILIKE is not. Without % on both sides it only matches the whole value." }

- id: distinct
  chapter: 6
  label: { vi: "Giá trị khác nhau (DISTINCT)", en: "Distinct values" }
  syntax: "SELECT DISTINCT city FROM customers; count(DISTINCT customer_id)"
  when: { vi: "Hỏi \"bao nhiêu loại\" hay \"bao nhiêu nơi\", không phải bao nhiêu dòng.", en: "The question is \"how many kinds\" or \"how many places\", not how many rows." }
  trap: { vi: "count(city) đếm cả lần lặp; count(DISTINCT city) mới đếm thành phố khác nhau.", en: "count(city) counts repeats too; count(DISTINCT city) counts different cities." }

- id: cast
  chapter: 6
  label: { vi: "Ép kiểu, chia ra số thập phân", en: "Casts and decimal division" }
  syntax: "ROUND(count(*) FILTER (WHERE status = 'CANCELLED')::numeric * 100 / count(*), 2)"
  when: { vi: "Tính tỷ lệ, phần trăm, hay đổi chữ thành số hoặc ngày.", en: "Compute a rate or a percentage, or turn text into a number or a date." }
  trap: { vi: "Số nguyên chia số nguyên bỏ phần lẻ: 3 / 4 = 0. Ép một vế sang numeric trước khi chia.", en: "Integer divided by integer drops the decimals: 3 / 4 = 0. Cast one side to numeric before dividing." }

- id: scalar_subquery
  chapter: 7
  label: { vi: "Truy vấn con trả một giá trị", en: "Scalar subquery" }
  syntax: "WHERE birth_year = (SELECT MIN(birth_year) FROM customers)"
  when: { vi: "So từng dòng hay từng nhóm với một con số tính từ cả bảng: trung bình, mức cao nhất.", en: "Compare each row or group with one number computed over the whole table: an average, a maximum." }
  trap: { vi: "Truy vấn con phải tự lọc lại đúng tập dữ liệu; điều kiện của câu ngoài không áp vào nó.", en: "The subquery has to filter the same data again; the outer query's conditions do not apply inside it." }

- id: in_subquery
  chapter: 7
  label: { vi: "IN với truy vấn con", en: "IN with a subquery" }
  syntax: "WHERE id IN (SELECT store_id FROM orders WHERE order_date = '2026-10-26')"
  when: { vi: "Lọc theo một danh sách mà chính danh sách đó phải tính ra.", en: "Filter by a list that has to be computed first." }
  trap: { vi: "NOT IN với danh sách có NULL không trả dòng nào. Lọc IS NOT NULL trong truy vấn con, hoặc dùng NOT EXISTS.", en: "NOT IN against a list that contains NULL returns no rows. Filter IS NOT NULL inside the subquery, or use NOT EXISTS." }

- id: exists
  chapter: 7
  label: { vi: "EXISTS và NOT EXISTS", en: "EXISTS and NOT EXISTS" }
  syntax: "WHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id AND o.store_id = 3)"
  when: { vi: "Hỏi có hay chưa có bản ghi liên quan, kể cả khi điều kiện so ngày hay so khoảng.", en: "Ask whether a related record exists, even when the match compares dates or ranges." }
  trap: { vi: "Quên điều kiện nối với câu ngoài (s.customer_id = q.customer_id) thì EXISTS hỏi cả bảng, đúng hoặc sai cho mọi dòng.", en: "Without the link to the outer row (s.customer_id = q.customer_id), EXISTS asks about the whole table and is true or false for every row." }

- id: correlated_value
  chapter: 7
  label: { vi: "Tra giá trị theo từng dòng (truy vấn con tương quan)", en: "Correlated lookup" }
  syntax: "(SELECT count(*) FROM staff e WHERE e.store_id = s.id)"
  when: { vi: "Mỗi dòng cần một giá trị từ bảng khác, đúng tại ngày của dòng đó: giá đang hiệu lực, tỷ giá ngày đó.", en: "Each row needs one value from another table as of its own date: the rate in force, that day's price." }
  trap: { vi: "Thiếu điều kiện ngày hiệu lực thì truy vấn con trả nhiều dòng và báo lỗi, hoặc lấy nhầm giá của kỳ khác.", en: "Without the validity-date condition the subquery returns several rows and fails, or picks the price of another period." }

- id: cte
  chapter: 8
  label: { vi: "CTE (WITH)", en: "CTE (WITH)" }
  syntax: "WITH per_store AS (SELECT store_id, count(*) AS n FROM orders GROUP BY store_id) SELECT ... JOIN stores s ON s.id = per_store.store_id"
  when: { vi: "Cộng riêng một bảng trước khi nối, hoặc đặt tên cho một bước tính để đọc dễ.", en: "Total one table before joining it, or give a calculation step a name so it reads clearly." }
  trap: { vi: "Nối thẳng đơn hàng với thanh toán rồi mới cộng thì đơn trả hai lần bị cộng hai lần. Cộng thanh toán theo đơn trước.", en: "Joining orders to payments and then summing counts an order paid twice twice. Total the payments per order first." }

- id: multi_cte
  chapter: 8
  label: { vi: "Nhiều CTE nối tiếp", en: "Chained CTEs" }
  syntax: "WITH per_city AS (...), a AS (SELECT AVG(n) AS avg_n FROM per_city) SELECT ... WHERE per_city.n > a.avg_n"
  when: { vi: "Phép tính nhiều bước: bước sau dùng kết quả bước trước.", en: "A calculation in several steps, each step using the one before." }
  trap: { vi: "Các CTE cách nhau bằng dấu phẩy, chỉ một chữ WITH ở đầu. Một CTE dùng được nhiều lần trong câu chính.", en: "CTEs are separated by commas, with one WITH at the start. A CTE can be used several times in the main query." }

- id: distinct_on
  chapter: 8
  label: { vi: "Dòng mới nhất mỗi nhóm (DISTINCT ON)", en: "Latest row per group (DISTINCT ON)" }
  syntax: "SELECT DISTINCT ON (city) city, name FROM stores ORDER BY city, opened_on DESC"
  when: { vi: "Cần một dòng mới nhất cho mỗi khách, mỗi hóa đơn: tỷ giá gần nhất trước ngày hóa đơn.", en: "You need one latest row per customer or per bill: the most recent rate before the bill date." }
  trap: { vi: "ORDER BY phải bắt đầu bằng đúng các cột trong DISTINCT ON, rồi mới đến cột chọn dòng giữ lại; thiếu DESC là lấy dòng cũ nhất.", en: "ORDER BY must start with exactly the DISTINCT ON columns, then the column that picks the row; without DESC you keep the oldest row." }

- id: union
  chapter: 9
  label: { vi: "Gộp danh sách (UNION)", en: "Combine lists (UNION)" }
  syntax: "SELECT name, 'STORE' FROM stores WHERE ... UNION ALL SELECT name, 'STAFF' FROM staff WHERE ..."
  when: { vi: "Hai nguồn cùng loại thông tin cần nằm trong một danh sách.", en: "Two sources of the same kind of information belong in one list." }
  trap: { vi: "UNION bỏ dòng trùng, UNION ALL giữ lại. Mỗi câu SELECT có WHERE riêng; ORDER BY chỉ viết một lần ở cuối.", en: "UNION drops duplicate rows, UNION ALL keeps them. Each SELECT has its own WHERE; ORDER BY is written once, at the end." }

- id: except
  chapter: 9
  label: { vi: "Hiệu và giao (EXCEPT, INTERSECT)", en: "Difference and intersection (EXCEPT, INTERSECT)" }
  syntax: "SELECT store_id FROM orders WHERE ... EXCEPT SELECT store_id FROM orders WHERE ..."
  when: { vi: "Thứ có ở sổ này mà sổ kia chưa có (EXCEPT), hoặc có ở cả hai (INTERSECT).", en: "What one book has and the other does not (EXCEPT), or what both have (INTERSECT)." }
  trap: { vi: "So cả dòng: hai bên phải cùng số cột, cùng ý nghĩa. Thêm một cột lệch nhau (ví dụ ngày) thì dòng nào cũng thành khác.", en: "Whole rows are compared: both sides need the same columns with the same meaning. One extra column that differs (a date) makes every row different." }

- id: full_join
  chapter: 9
  label: { vi: "Đối soát hai phía (FULL JOIN)", en: "Two-sided reconciliation (FULL JOIN)" }
  syntax: "WITH o AS (...), p AS (...) SELECT COALESCE(o.id, p.order_id), o.status, p.amount_vnd FROM o FULL JOIN p ON p.order_id = o.id WHERE o.id IS NULL OR p.order_id IS NULL"
  when: { vi: "Đối soát hai sổ mà dòng lệch có thể nằm ở bất kỳ bên nào.", en: "Reconcile two books when a mismatch can sit on either side." }
  trap: { vi: "Lọc tháng ở WHERE sau FULL JOIN là bỏ mất dòng chỉ có ở một bên. Lọc mỗi sổ trước, trong CTE hoặc truy vấn con, rồi mới nối.", en: "A month filter in WHERE after the FULL JOIN throws away the one-sided rows. Filter each book first, in a CTE or subquery, then join." }

- id: window_rank
  chapter: 10
  label: { vi: "Xếp hạng trong nhóm (RANK, ROW_NUMBER)", en: "Ranking within groups (RANK, ROW_NUMBER)" }
  syntax: "RANK() OVER (PARTITION BY category ORDER BY price_vnd DESC)"
  when: { vi: "Cần mấy dòng đứng đầu trong mỗi nhóm, hoặc dòng mới nhất của từng khách, mà vẫn giữ nguyên từng dòng.", en: "You need the top rows in each group, or each customer's latest row, while keeping every row as it is." }
  trap: { vi: "Không lọc hạng ở WHERE của chính câu đó: tính hạng trong CTE rồi lọc ở câu ngoài. ROW_NUMBER xếp các dòng bằng nhau theo thứ tự tùy ý; muốn bằng nhau cùng hạng thì dùng RANK (1, 1, 3) hoặc DENSE_RANK (1, 1, 2).", en: "Do not filter on the rank in that query's own WHERE: rank in a CTE and filter outside. ROW_NUMBER breaks ties arbitrarily; for equal values to share a rank use RANK (1, 1, 3) or DENSE_RANK (1, 1, 2)." }

- id: window_lag
  chapter: 10
  label: { vi: "So với dòng trước (LAG, LEAD)", en: "Compare with the previous row (LAG, LEAD)" }
  syntax: "n - LAG(n) OVER (ORDER BY order_date)"
  when: { vi: "So tháng này với tháng trước, quý này với quý trước, đơn này với đơn kế tiếp của cùng khách.", en: "Compare this month with last month, this quarter with the previous one, an order with the customer's next one." }
  trap: { vi: "Dòng đầu không có dòng trước nên ra NULL. Dòng trước là theo ORDER BY trong OVER, không theo ORDER BY cuối câu; thiếu PARTITION BY thì khách này bị so với khách khác.", en: "The first row has no previous row, so it gets NULL. The previous row follows the ORDER BY inside OVER, not the one at the end of the query; without PARTITION BY one customer is compared with another." }

- id: window_agg
  chapter: 10
  label: { vi: "Cộng dồn trong nhóm (SUM OVER)", en: "Running totals (SUM OVER)" }
  syntax: "SUM(n) OVER (PARTITION BY store_id ORDER BY order_date)"
  when: { vi: "Tổng lũy kế từ đầu kỳ, hoặc trung bình trượt mấy tháng gần nhất, trên từng dòng.", en: "A running total since the start of the period, or a moving average over the last few months, on every row." }
  trap: { vi: "Thiếu ORDER BY trong OVER thì dòng nào cũng nhận tổng cả nhóm, không phải lũy kế; thiếu PARTITION BY thì cộng dồn chạy qua mọi khách. Trung bình trượt 3 tháng: AVG(x) OVER (ORDER BY month ROWS BETWEEN 2 PRECEDING AND CURRENT ROW).", en: "Without ORDER BY inside OVER every row gets the whole group's total, not a running total; without PARTITION BY the total runs across every customer. A 3-month moving average: AVG(x) OVER (ORDER BY month ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)." }

- id: explain_read
  chapter: 11
  label: { vi: "Đọc kế hoạch thực thi (EXPLAIN)", en: "Reading an execution plan (EXPLAIN)" }
  syntax: "EXPLAIN SELECT id FROM orders WHERE customer_id = 7"
  when: { vi: "Một báo cáo chạy chậm: xem bước nào đọc nhiều dòng nhất trước khi đoán nguyên nhân.", en: "A report runs slowly: see which step reads the most rows before guessing why." }
  trap: { vi: "Chi phí (cost) là ước tính tương đối của Postgres, không phải mili-giây. So chi phí của hai kế hoạch cho cùng một câu hỏi, đừng so với một câu khác.", en: "Cost is Postgres' relative estimate, not milliseconds. Compare the cost of two plans for the same question, never with another query." }

- id: sargable
  chapter: 11
  label: { vi: "Điều kiện dùng được chỉ mục", en: "Index-friendly conditions" }
  syntax: "WHERE order_date >= '2026-10-01' AND order_date < '2026-10-08'"
  when: { vi: "Cột có chỉ mục (index) mà câu lọc vẫn đọc cả bảng: viết lại điều kiện sao cho cột đứng một mình (điều kiện sargable).", en: "A column has an index but the filter still reads the whole table: rewrite the condition so the column stands alone." }
  trap: { vi: "Bọc cột trong hàm hay ép kiểu (to_char, date_trunc, upper, ::text) là chỉ mục thường không dùng được. Biến đổi giá trị bên kia dấu bằng, hoặc đổi thành khoảng nửa mở.", en: "Wrapping the column in a function or a cast (to_char, date_trunc, upper, ::text) stops a plain index from being used. Transform the value on the other side, or use a half-open range." }

- id: index_design
  chapter: 11
  label: { vi: "Thiết kế chỉ mục", en: "Designing an index" }
  syntax: "CREATE INDEX ON payments (order_id, paid_at)"
  when: { vi: "Một câu tra cứu hay dùng phải đọc cả bảng lớn: đề xuất chỉ mục trên cột nó lọc hoặc nối.", en: "A frequent lookup has to read a whole big table: propose an index on the column it filters or joins on." }
  trap: { vi: "Cột đầu tiên của chỉ mục phải là cột được lọc hoặc nối; chỉ mục (event_time, container_id) không giúp tra theo container. Mỗi chỉ mục làm ghi dữ liệu chậm hơn, nên chỉ đặt cho câu tra cứu thật sự cần.", en: "The first column of the index must be the one filtered or joined on; an index on (event_time, container_id) does not help a lookup by container. Every index slows down writes, so add one only where a lookup really needs it." }
