  en: "One set per day; SINTER returns the visitors found in both, in no particular order."
alt:
  vi: "Set giữ mỗi khách một lần, nên số khách khác nhau là SCARD, và khách quay lại là giao của hai set. Kết quả: ngày 30 có an, boon, lily; ngày 31 có boon, lily, minh; cả hai ngày là boon và lily."
  en: "A set holds each visitor once, so the number of distinct visitors is SCARD, and returning visitors are the intersection of two sets. Result: 30 Oct has an, boon, lily; 31 Oct has boon, lily, minh; both days are boon and lily."
