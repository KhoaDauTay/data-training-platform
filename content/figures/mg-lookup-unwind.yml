# MG-4 (tools/v39/diagram-plan.md): $lookup keeps everyone, $unwind drops the empty. Lesson: e-mg-l2-17 (Ý chính).
# Data (lab.setup, run on mingo): customers c1 An, c2 Binh, c3 Chi, c4 Dung; orders 1, 2 (c1), 3 (c2), 4 (c3).
# $lookup → An [1, 2], Binh [3], Chi [4], Dung []; + $unwind "$orders" → 4 documents (An×2, Binh, Chi);
# + preserveNullAndEmptyArrays: true → 5, Dung without an orders field. One row per output document (R1).
# R3 (E21): Dung's lost row is a dead cell saying "không ra tài liệu", not struck through.
# Not placed in e-mg-l2-07/-08: their labs use other data (9 orders with stores; 6 customers). Sources:
# https://www.mongodb.com/docs/manual/reference/operator/aggregation/unwind/, https://www.mongodb.com/docs/manual/reference/operator/aggregation/lookup/
title: { vi: "$lookup giữ mọi người, $unwind bỏ mảng rỗng", en: "$lookup keeps everyone, $unwind drops the empty" }
caption:
  vi: "$lookup là left outer join: mọi khách còn lại, mảng orders có thể rỗng. Thêm $unwind mà không để ý thì thành inner join: khách không có đơn biến mất, không báo lỗi. Mỗi dòng của bảng bên phải là một tài liệu đầu ra."
  en: "$lookup is a left outer join: every customer stays and the orders array may be empty. Add $unwind without care and it becomes an inner join: a customer with no order vanishes, with no error. Each row of the right-hand table is one output document."
alt:
  vi: "$lookup là left outer join: khách không có đơn vẫn còn, chỉ có mảng orders rỗng. $unwind không tạo tài liệu cho mảng rỗng, nên nó lặng lẽ biến phép nối thành inner join, trừ khi bật preserveNullAndEmptyArrays."
  en: "$lookup is a left outer join: a customer with no order stays, just with an empty orders array. $unwind makes no document for an empty array, so it quietly turns the join into an inner join, unless preserveNullAndEmptyArrays is on."
nodes:
  - id: lk
    shape: grid
    label: $lookup
    sub: { vi: "4 tài liệu", en: "4 documents" }
    head: [name, orders]
    cells: [[An, "[1, 2]"], [Binh, "[3]"], [Chi, "[4]"], [Dung, "[ ]"]]
    cellTone: { "3:1": warm }
  - id: uw
    shape: grid
    label: $unwind
    sub: { vi: "4 tài liệu, mất Dung", en: "4 documents, no Dung" }
    head: [name, orders]
    cells: [[An, "1"], [An, "2"], [Binh, "3"], [Chi, "4"], [Dung, { vi: "không ra tài liệu", en: "no document" }]]
    cellTone: { "4:1": dead }
rows:
  - [lk, uw]
edges:
  - { from: lk, to: uw, label: $unwind }
steps:
  - say: { vi: "$lookup là left outer join: ai cũng còn, mảng có thể rỗng.", en: "$lookup is a left outer join: everyone stays, the array may be empty." }
    alt: { vi: "Sau $lookup cả 4 khách đều còn, mỗi người kèm mảng orders của mình; Dung chưa mua gì nên mảng rỗng.", en: "After $lookup all 4 customers remain, each with their own orders array; Dung has bought nothing, so the array is empty." }
    show: [lk]
  - say: { vi: "$unwind không tạo tài liệu cho mảng rỗng: Dung biến mất, không báo lỗi.", en: "$unwind makes no document for an empty array: Dung vanishes without an error." }
    alt: { vi: "$unwind tách mỗi đơn thành một tài liệu (4 tài liệu), còn mảng rỗng của Dung không cho ra tài liệu nào, nên Dung biến mất mà không báo lỗi.", en: "$unwind turns each order into its own document (4 documents), and Dung's empty array gives none, so Dung vanishes without an error." }
  - say: { vi: "Giữ lại bằng preserveNullAndEmptyArrays.", en: "Keep it with preserveNullAndEmptyArrays." }
    alt: { vi: "Bật preserveNullAndEmptyArrays: true thì Dung quay lại thành tài liệu thứ 5 không có trường orders, giống LEFT JOIN trong SQL.", en: "Turn on preserveNullAndEmptyArrays: true and Dung comes back as a 5th document with no orders field, like a LEFT JOIN in SQL." }
    set:
      uw: { label: { vi: "$unwind + preserve", en: "$unwind + preserve" }, sub: { vi: "5 tài liệu, có Dung", en: "5 documents, Dung kept" }, cells: [[An, "1"], [An, "2"], [Binh, "3"], [Chi, "4"], [Dung, { vi: "(không có trường)", en: "(no field)" }]], cellTone: { "4:1": live } }
