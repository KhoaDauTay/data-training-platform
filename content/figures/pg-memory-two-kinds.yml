# PG-9 (tools/v39/diagram-plan.md): shared buffers vs work_mem. Lesson: e-pg-l3-14 (Ý chính); e-pg-l3-18 has its own pg-buffer-hit-read (R3 E12).
# Data (lesson setup): big 20,000 rows; UPDATE big … WHERE id = 1 leaves page 0 dirty; sort_plan('64kB') spills (external
# merge Disk), a larger work_mem sorts in memory; defaults shared_buffers 128 MB, work_mem 4 MB (lesson text).
# The page cells are an illustration (6 pages). R2 lesson 5: the read path and the checkpoint are their own labelled keys in
# the gap between memory and disk. Sources: https://www.postgresql.org/docs/current/runtime-config-resource.html,
# https://www.postgresql.org/docs/current/wal-configuration.html. R3 (E1/E14): stacked on a phone, read and checkpoint take lanes inside
# the frame (read up the left, checkpoint down the right); the dirty page is a highlighted p0 named in the sub, so cells keep their width.
title: { vi: "Hai loại bộ nhớ: shared buffers và work_mem", en: "Two kinds of memory: shared buffers and work_mem" }
caption:
  vi: "Shared buffers là các trang 8 kB dùng chung cho mọi kết nối; mọi lần đọc ghi bảng đi qua đây, và checkpoint mới ghi trang bẩn xuống đĩa. work_mem là bộ nhớ riêng của từng nút sort hay hash; vượt quá thì tràn ra file tạm. Tăng shared_buffers không cứu được một sort tràn đĩa."
  en: "Shared buffers are 8 kB pages shared by every connection; every table read and write goes through them, and a checkpoint, not COMMIT, writes dirty pages to disk. work_mem is the private memory of each sort or hash node; past it, the node spills to temp files. Raising shared_buffers never fixes a spilling sort."
alt:
  vi: "Postgres có hai loại bộ nhớ khác nhau: shared buffers dùng chung cho mọi kết nối để giữ trang bảng, còn work_mem là phần riêng của từng nút sort hay hash. Vì vậy tăng shared_buffers không cứu được một sort tràn ra đĩa; chỉ work_mem mới cứu được."
  en: "Postgres has two different kinds of memory: shared buffers, used by every connection to hold table pages, and work_mem, the private memory of each sort or hash node. So raising shared_buffers never fixes a sort that spills to disk; only work_mem does."
groups:
  - { id: sh, label: { vi: "bộ nhớ chung", en: "shared memory" }, nodes: [sb, rd, ck] }
  - { id: pr, label: { vi: "riêng từng kết nối", en: "per connection" }, nodes: [c1, c2, srt] }
nodes:
  - { id: sb, shape: grid, label: shared_buffers, sub: { vi: "128 MB, minh họa 6 trang", en: "128 MB, 6 pages shown" }, cells: [[p0, p1, p2], [p3, p4, p5]] }
  - { id: rd, shape: key, label: { vi: "đọc: hit / read", en: "read: hit / read" }, tone: new }
  - { id: ck, shape: key, label: { vi: "checkpoint ghi", en: "checkpoint writes" }, tone: ghost }
  - { id: tf, shape: table, label: { vi: "file bảng", en: "table files" }, sub: { vi: "trên đĩa", en: "on disk" } }
  - { id: c1, label: { vi: "kết nối 1", en: "connection 1" }, sub: work_mem 4 MB }
  - { id: c2, label: { vi: "kết nối 2", en: "connection 2" }, sub: work_mem 4 MB }
  - { id: srt, shape: key, label: Sort > work_mem, tone: ghost }
  - { id: tmp, shape: table, label: { vi: "file tạm", en: "temp files" }, sub: { vi: "trên đĩa", en: "on disk" } }
rows:
  - [sb]
  - [rd, ck]
  - [tf]
  - [c1, c2]
  - [srt]
  - [tmp]
edges:
  - { from: rd, to: sb }
  - { from: sb, to: ck }
  - { from: tf, to: rd }
  - { from: ck, to: tf }
  - { from: c2, to: srt }
  - { from: srt, to: tmp, label: { vi: "tràn đĩa", en: "spills" } }
steps:
  - say: { vi: "Mọi đọc ghi bảng đi qua shared buffers.", en: "Every table read and write goes through shared buffers." }
    alt: { vi: "Mọi lần đọc bảng đều đi qua shared buffers: trang có sẵn là hit, trang chưa có phải nạp từ file bảng trên đĩa và là read.", en: "Every table read goes through shared buffers: a page already there is a hit, a page that is not must be loaded from the table files on disk and is a read." }
  - say: { vi: "COMMIT không ghi trang; checkpoint mới ghi.", en: "COMMIT does not write the page; a checkpoint does." }
    alt: { vi: "UPDATE chỉ sửa trang p0 trong bộ nhớ nên p0 thành trang bẩn; COMMIT không ghi nó xuống đĩa, phải đợi checkpoint mới ghi vào file bảng.", en: "UPDATE only changes page p0 in memory, so p0 becomes dirty; COMMIT does not write it to disk, it waits for a checkpoint to write it to the table files." }
    set:
      rd: { tone: plain }
      ck: { tone: new }
      sb: { sub: { vi: "p0: trang bẩn", en: "p0: dirty page" }, cellTone: { "0:0": warm } }
  - say: { vi: "Sort dùng work_mem riêng, không dùng shared buffers.", en: "A sort uses private work_mem, not shared buffers." }
    alt: { vi: "Sort của kết nối 2 cần nhiều hơn work_mem 4 MB riêng của nó nên tràn ra file tạm trên đĩa (external merge Disk), dù shared buffers còn trống bao nhiêu đi nữa.", en: "Connection 2's sort needs more than its own 4 MB of work_mem, so it spills to temp files on disk (external merge Disk), however much room shared buffers has." }
    set:
      rd: { tone: plain }
      sb: { sub: { vi: "p0: trang bẩn", en: "p0: dirty page" }, cellTone: { "0:0": warm } }
      c2: { tone: warm }
      srt: { tone: warm }
