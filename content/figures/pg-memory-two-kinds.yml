# PG-9 (tools/v39/diagram-plan.md): shared buffers vs work_mem. Lessons: e-pg-l3-14 (Ý chính), e-pg-l3-18 variant `hit`.
# Data (lesson setup): big 20,000 rows; UPDATE big … WHERE id = 1 leaves page 0 dirty; sort_plan('64kB') spills (external
# merge Disk), a larger work_mem sorts in memory; defaults shared_buffers 128 MB, work_mem 4 MB (lesson text).
# The page cells are an illustration (6 pages). R2 lesson 5: the read path and the checkpoint are their own labelled keys in
# the gap between memory and disk. Sources: https://www.postgresql.org/docs/current/runtime-config-resource.html,
# https://www.postgresql.org/docs/current/wal-configuration.html
title: { vi: "Hai loại bộ nhớ: shared buffers và work_mem", en: "Two kinds of memory: shared buffers and work_mem" }
caption:
  vi: "Shared buffers là các trang 8 kB dùng chung cho mọi kết nối; mọi lần đọc ghi bảng đi qua đây, và checkpoint mới ghi trang bẩn xuống đĩa. work_mem là bộ nhớ riêng của từng nút sort hay hash; vượt quá thì tràn ra file tạm. Tăng shared_buffers không cứu được một sort tràn đĩa."
  en: "Shared buffers are 8 kB pages shared by every connection; every table read and write goes through them, and a checkpoint, not COMMIT, writes dirty pages to disk. work_mem is the private memory of each sort or hash node; past it, the node spills to temp files. Raising shared_buffers never fixes a spilling sort."
alt:
  vi: "Ở trên, nhóm dùng chung: một vùng chung 128 MB gồm các trang 8 kB (minh họa 6 trang). Một lần đọc tìm trang trong bộ nhớ (hit) hoặc nạp nó từ file bảng trên đĩa (read)."
  en: "At the top, the shared group: one shared area of 128 MB made of 8 kB pages (6 pages shown as an illustration). A read finds the page in memory (hit) or loads it from the table files on disk (read)."
groups:
  - { id: sh, label: { vi: "bộ nhớ chung", en: "shared memory" }, nodes: [sb, rd, ck] }
  - { id: pr, label: { vi: "riêng từng kết nối", en: "per connection" }, nodes: [c1, c2, srt] }
nodes:
  - { id: sb, shape: grid, label: shared_buffers, sub: { vi: "128 MB, 8 kB/ô", en: "128 MB, 8 kB/cell" }, cells: [[p0, p1, p2], [p3, p4, p5]] }
  - { id: rd, shape: key, label: { vi: "đọc: hit / read", en: "read: hit / read" }, tone: new }
  - { id: ck, shape: key, label: { vi: "checkpoint ghi", en: "checkpoint writes" }, tone: ghost }
  - { id: tf, shape: table, label: { vi: "file bảng", en: "table files" }, sub: { vi: "trên đĩa", en: "on disk" } }
  - { id: c1, label: { vi: "kết nối 1", en: "connection 1" }, sub: work_mem 4 MB }
  - { id: c2, label: { vi: "kết nối 2", en: "connection 2" }, sub: work_mem 4 MB }
  - { id: srt, shape: key, label: Sort > work_mem, tone: ghost }
  - { id: tmp, shape: table, label: { vi: "file tạm", en: "temp files" }, sub: { vi: "trên đĩa", en: "on disk" } }
rows:
  - [sb]
  - [rd, ck]
  - [tf]
  - [c1, c2]
  - [srt]
  - [tmp]
edges:
  - { from: rd, to: sb }
  - { from: sb, to: ck }
  - { from: tf, to: rd }
  - { from: ck, to: tf }
  - { from: c2, to: srt }
  - { from: srt, to: tmp, label: { vi: "tràn đĩa", en: "spills" } }
steps:
  - say: { vi: "Mọi đọc ghi bảng đi qua shared buffers.", en: "Every table read and write goes through shared buffers." }
  - say: { vi: "COMMIT không ghi trang; checkpoint mới ghi.", en: "COMMIT does not write the page; a checkpoint does." }
    alt: { vi: "UPDATE big … WHERE id = 1 sửa trang p0 trong bộ nhớ: p0 thành trang bẩn D. COMMIT không ghi nó xuống đĩa; checkpoint mới ghi trang bẩn vào file bảng.", en: "UPDATE big … WHERE id = 1 changes page p0 in memory: p0 becomes dirty, D. COMMIT does not write it to disk; a checkpoint writes the dirty page to the table files." }
    set:
      rd: { tone: plain }
      ck: { tone: new }
      sb: { cells: [[p0 D, p1, p2], [p3, p4, p5]], cellTone: { "0:0": warm } }
  - say: { vi: "Sort dùng work_mem riêng, không dùng shared buffers.", en: "A sort uses private work_mem, not shared buffers." }
    alt: { vi: "Bên dưới, nhóm riêng: mỗi kết nối có work_mem 4 MB cho mỗi nút sort hay hash. Sort của kết nối 2 lớn hơn work_mem nên tràn ra file tạm trên đĩa (external merge Disk), không đụng tới shared buffers.", en: "Below, the private group: each connection has 4 MB of work_mem per sort or hash node. Connection 2's sort is larger than work_mem, so it spills to temp files on disk (external merge Disk) without touching shared buffers." }
    set:
      rd: { tone: plain }
      sb: { cells: [[p0 D, p1, p2], [p3, p4, p5]], cellTone: { "0:0": warm } }
      c2: { tone: warm }
      srt: { tone: warm }
variants:
  hit:
    step: 0
    title: { vi: "Shared buffers: hit hay read", en: "Shared buffers: hit or read" }
    caption:
      vi: "Dòng Buffers của EXPLAIN đếm trang tìm thấy trong shared buffers (hit) và trang phải nạp từ đĩa (read)."
      en: "EXPLAIN's Buffers line counts pages found in shared buffers (hit) and pages loaded from disk (read)."
    alt:
      vi: "Shared buffers là vùng chung 128 MB gồm các trang 8 kB (minh họa 6 trang). Một lần đọc tìm trang trong bộ nhớ, đếm là hit, hoặc nạp từ file bảng trên đĩa, đếm là read. Checkpoint ghi trang bẩn ngược xuống đĩa. Mỗi kết nối còn có work_mem 4 MB riêng cho sort."
      en: "Shared buffers are one shared 128 MB area of 8 kB pages (6 pages shown as an illustration). A read finds the page in memory, counted as hit, or loads it from the table files on disk, counted as read. A checkpoint writes dirty pages back to disk. Each connection also has its own 4 MB of work_mem for sorts."
