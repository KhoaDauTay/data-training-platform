# v48 Graph R2 (L1180–L1189): fewest legs vs fewest days. Lesson: e-gr-l3-01 (Ý chính). Data: the lab's legs (PGlite 0.5.16,
# PostgreSQL 18.6): VNDAD→SGSIN 6.0, VNDAD→HKHKG 2.5, HKHKG→SGSIN 2.0 (two routes to SGSIN); routes to NLRTM = step 1 (3 rows): DAD>SIN>RTM 33.0,
# DAD>HKG>SIN>RTM 31.5, DAD>HKG>PUS>RTM 41.4. Codes shortened to three letters in the grid.
# Sources: https://www.postgresql.org/docs/18/queries-with.html,
# https://neo4j.com/docs/graph-data-science/current/algorithms/dijkstra-source-target/
title: { vi: "Ít chặng không phải ít ngày", en: "Fewest legs is not fewest days" }
caption:
  vi: "Chặng thẳng VNDAD tới SGSIN mất 6 ngày; đi vòng qua HKHKG chỉ 4,5 ngày. Bảng là mọi đường đơn tới NLRTM mà CTE sinh ra trước khi lấy nhỏ nhất."
  en: "The direct leg VNDAD to SGSIN takes 6 days; going round through HKHKG takes only 4.5. The table is every simple route to NLRTM the CTE produces before taking the smallest."
alt:
  vi: "Khi chặng có trọng số, đường nhiều chặng hơn có thể nhanh hơn, nên phải cộng trọng số dọc mọi đường rồi lấy nhỏ nhất. Kết quả: tới NLRTM, đường ba chặng qua HKHKG và SGSIN mất 31,5 ngày, nhanh hơn đường hai chặng 33,0 ngày."
  en: "When legs carry a weight, a route with more legs can be faster, so the weight is summed along every route and the smallest kept. Result: to NLRTM, the three-leg route through HKHKG and SGSIN takes 31.5 days, faster than the two-leg route of 33.0 days."
nodes:
  - id: sin
    shape: grid
    label: { vi: "đường tới SGSIN", en: "routes to SGSIN" }
    head: [route, { vi: "ngày", en: days }]
    cells:
      - [DAD>SIN, { vi: "6,0", en: "6.0" }]
      - [DAD>HKG>SIN, { vi: "4,5", en: "4.5" }]
    rowTone: [null, new]
  - id: routes
    shape: grid
    label: { vi: "đường tới NLRTM", en: "routes to NLRTM" }
    head: [route, { vi: "ngày", en: days }]
    cells:
      - [DAD>SIN>RTM, { vi: "33,0", en: "33.0" }]
      - [DAD>HKG>SIN>RTM, { vi: "31,5", en: "31.5" }]
      - [DAD>HKG>PUS>RTM, { vi: "41,4", en: "41.4" }]
    rowTone: [null, new, null]
rows:
  - [sin, routes]
