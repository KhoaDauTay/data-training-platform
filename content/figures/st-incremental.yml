# ST-8 (tools/v43/de-tools-plan.md §4): an incremental model's first run and a later run, 2 steps. Lesson: e-st-l2-03 (Ý chính).
# Data = the lab: 4 rows on the first run; the 06:00 sync updates order 2 and adds order 5; unique_key order_id → 5 rows.
# Source: https://docs.getdbt.com/docs/build/incremental-models
title: { vi: "Chạy incremental hai lần", en: "An incremental model, run twice" }
caption:
  vi: "Lần đầu is_incremental() sai nên cả bảng được dựng; lần sau chỉ dòng mới hơn mức trong {{ this }} được xử lý, và unique_key thay dòng trùng khóa."
  en: "On the first run is_incremental() is false, so the whole table is built; later only rows newer than the mark in {{ this }} are processed, and unique_key replaces rows with the same key."
alt:
  vi: "Model incremental dựng cả bảng ở lần đầu, rồi các lần sau chỉ xử lý dòng về sau mức thời gian đã nạp, nên rẻ hơn nhiều khi bảng lớn. Nhờ unique_key, một đơn đổi trạng thái được thay chứ không bị nhân đôi."
  en: "An incremental model builds the whole table on its first run, then later runs process only rows that arrived after the loaded time mark, which is far cheaper on a big table. Thanks to unique_key, an order that changes status is replaced rather than doubled."
nodes:
  - { id: raw, shape: table, mono: true, label: raw_shop.orders, sub: { vi: "nguồn", en: "source" } }
  - { id: first, label: { vi: "lần chạy đầu", en: "first run" }, sub: { vi: "cả bảng", en: "whole table" } }
  - { id: later, label: { vi: "lần chạy sau", en: "later run" }, sub: { vi: "chỉ dòng mới", en: "new rows only" }, tone: ghost }
  - { id: tbl, shape: table, mono: true, label: marts.fct_orders, sub: { vi: "4 dòng", en: "4 rows" } }
  - { id: key, shape: note, label: { vi: "unique_key = order_id", en: "unique_key = order_id" } }
rows:
  - [raw]
  - [first, later]
  - [tbl]
  - [key]
edges:
  - { from: raw, to: first }
  - { from: raw, to: later }
  - { from: first, to: tbl }
  - { from: later, to: tbl }
steps:
  - say: { vi: "Lần đầu: model chưa có, cả câu được dựng thành bảng.", en: "First run: the model does not exist, so the whole query becomes a table." }
    alt: { vi: "Vì model chưa tồn tại nên is_incremental() sai, khối lọc bị bỏ qua và cả bốn đơn được dựng thành bảng.", en: "Because the model does not exist yet, is_incremental() is false, the filter block is skipped and all four orders are built into the table." }
    set:
      first: { tone: live }
  - say: { vi: "Lần sau: chỉ hai dòng mới, đơn 2 được thay.", en: "Later run: only two new rows, order 2 replaced." }
    alt: { vi: "Lần sau, bộ lọc chỉ giữ hai dòng về sau mức đã nạp, và unique_key xóa bản cũ của đơn 2 trước khi thêm bản mới, nên bảng có năm dòng chứ không phải sáu.", en: "On the later run the filter keeps only the two rows that arrived after the loaded mark, and unique_key deletes order 2's old version before inserting the new one, so the table has five rows, not six." }
    set:
      first: { tone: ghost }
      later: { tone: new }
      tbl: { sub: { vi: "5 dòng", en: "5 rows" }, tone: new }
      key: { tone: new }
