# GA-2 (tools/v39/diagram-plan.md): written order vs run order. Lesson: having (Ý chính); group_by, order_by, limit link to it.
# The lesson's query: SELECT category, count(*) FROM products WHERE price_vnd < 50000 GROUP BY category HAVING count(*) >= 4
# (30 products; 22 under 50k in 5 categories; 4 categories keep ≥ 4, checked in PGlite).
# Order: https://www.postgresql.org/docs/current/sql-select.html#SQL-SELECT-DESCRIPTION
title: { vi: "Thứ tự viết và thứ tự chạy", en: "Written order and run order" }
caption:
  vi: "Bạn viết SELECT đầu tiên, Postgres chạy nó gần cuối; số thứ tự là thứ tự chạy."
  en: "You write SELECT first, Postgres runs it near the end; the numbers are the run order."
alt:
  vi: "Thứ tự bạn viết câu lệnh không phải thứ tự Postgres chạy: nó lấy dữ liệu (FROM) trước, lọc dòng, gộp nhóm, lọc nhóm, rồi mới tính cột ở SELECT. Vì vậy một mệnh đề chỉ dùng được những gì các mệnh đề chạy trước nó đã tạo ra."
  en: "The order you write a query in is not the order Postgres runs it: it takes the data (FROM) first, filters rows, groups, filters groups, and only then computes the columns in SELECT. So a clause can only use what the clauses that run before it have made."
nodes:
  - id: w
    shape: grid
    label: { vi: "Thứ tự viết", en: "Written order" }
    cells: [[SELECT], [FROM], [WHERE], [GROUP BY], [HAVING], [ORDER BY], [LIMIT]]
  - id: r
    shape: grid
    label: { vi: "Thứ tự chạy", en: "Run order" }
    cells:
      - ["1", FROM, { vi: "30 dòng", en: "30 rows" }]
      - ["2", WHERE, { vi: "bỏ món ≥ 50k", en: "drop items ≥ 50k" }]
      - ["3", GROUP BY, { vi: "5 nhóm", en: "5 groups" }]
      - ["4", HAVING, { vi: "giữ 4 nhóm", en: "keep 4 groups" }]
      - ["5", SELECT, { vi: "tính cột", en: "compute cols" }]
      - ["6", ORDER BY, { vi: "sắp xếp", en: "sort" }]
      - ["7", LIMIT, { vi: "cắt N dòng", en: "cut N rows" }]
rows:
  - [w, r]
edges:
  - { from: "w#0", to: "r#4", link: true }
  - { from: "w#1", to: "r#0", link: true }
  - { from: "w#2", to: "r#1", link: true }
  - { from: "w#3", to: "r#2", link: true }
  - { from: "w#4", to: "r#3", link: true }
  - { from: "w#5", to: "r#5", link: true }
  - { from: "w#6", to: "r#6", link: true }
steps:
  - say: { vi: "Bạn viết SELECT trước, nhưng Postgres chạy FROM trước.", en: "You write SELECT first, but Postgres runs FROM first." }
    alt: { vi: "SELECT đứng đầu khi viết, nhưng Postgres chạy FROM đầu tiên, vì phải có bảng thì mới có dòng để làm việc.", en: "SELECT comes first when you write, but Postgres runs FROM first, because there must be a table before there are rows to work on." }
    set:
      w: { rowTone: [new] }
      r: { rowTone: [new] }
  - say: { vi: "WHERE lọc từng dòng trước khi có nhóm.", en: "WHERE filters single rows before any group exists." }
    alt: { vi: "WHERE chạy thứ hai, ngay sau FROM, nên nó xét từng dòng lẻ khi chưa có nhóm nào và không dùng được count(*).", en: "WHERE runs second, right after FROM, so it judges single rows before any group exists and cannot use count(*)." }
    set:
      w: { rowTone: [null, new, new] }
      r: { rowTone: [new, new] }
  - say: { vi: "HAVING lọc cả nhóm, sau khi đếm xong.", en: "HAVING filters whole groups, after counting." }
    alt: { vi: "GROUP BY gộp dòng thành 5 nhóm, rồi HAVING mới lọc, giữ 4 nhóm, vì điều kiện count(*) >= 4 chỉ có nghĩa khi nhóm đã đếm xong.", en: "GROUP BY folds the rows into 5 groups, then HAVING filters and keeps 4, because count(*) >= 4 only means something once each group is counted." }
    set:
      w: { rowTone: [null, null, null, new, new] }
      r: { rowTone: [null, null, new, new] }
  - say:
      vi: "Bí danh đặt ở SELECT không dùng được trong WHERE hay HAVING, vì chúng chạy trước SELECT."
      en: "An alias made in SELECT cannot be used in WHERE or HAVING: they run before SELECT."
    alt: { vi: "SELECT chạy thứ năm, sau WHERE và HAVING, nên bí danh đặt ở SELECT chưa tồn tại khi hai mệnh đề đó chạy; chỉ ORDER BY và LIMIT, chạy sau, mới dùng được nó.", en: "SELECT runs fifth, after WHERE and HAVING, so an alias made in SELECT does not exist yet when they run; only ORDER BY and LIMIT, which run later, can use it." }
    set:
      w: { rowTone: [new, null, null, null, null, new, new] }
      r: { rowTone: [null, null, null, null, new, new, new] }
variants:
  # v40: order_by and limit show only the last step (L630): the two clauses that run after SELECT.
  tail:
    step: 3
    title: { vi: "ORDER BY và LIMIT chạy sau cùng", en: "ORDER BY and LIMIT run last" }
    caption:
      vi: "Sắp xếp và cắt dòng là hai bước cuối, sau khi SELECT đã tính xong các cột."
      en: "Sorting and cutting rows are the last two steps, after SELECT has computed the columns."
    alt:
      vi: "ORDER BY và LIMIT là hai bước chạy cuối cùng: SELECT tính cột xong, ORDER BY mới sắp xếp kết quả, rồi LIMIT giữ N dòng đầu. Vì chạy sau SELECT, ORDER BY dùng được bí danh đặt ở SELECT; WHERE và HAVING thì không."
      en: "ORDER BY and LIMIT are the last two steps: once SELECT has computed the columns, ORDER BY sorts the result, then LIMIT keeps the first N rows. Because it runs after SELECT, ORDER BY can use an alias made in SELECT; WHERE and HAVING cannot."
