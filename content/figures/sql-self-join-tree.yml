# GA-10 (tools/v39/diagram-plan.md): one table, two roles. Lesson: self_join (Ý chính).
# Data (lab `staff`, checked in PGlite): Ha Minh (CEO, manager_id NULL) → Do Lan, Ly Quan, Ong Lan; Do Lan → 3 store managers;
# Ly Quan → Ta Vy (Store manager, store 3) → Vu Giang, Phan Khanh (Cashiers) → Lam Phuong (Stock clerk). Only that branch is drawn.
# Source: https://www.postgresql.org/docs/current/queries-table-expressions.html#QUERIES-JOIN (table aliases)
# R1 E10: Do Lan's and Ly Quan's arrows land at a third and two thirds of Ha Minh (the builder spreads arrows into one side).
title: { vi: "Một bảng, hai vai", en: "One table, two roles" }
caption:
  vi: "Mỗi mũi tên là manager_id: nó trỏ về một dòng khác của chính bảng staff. Bí danh e (nhân viên) và m (quản lý) cho bảng đóng hai vai."
  en: "Every arrow is manager_id: it points back to another row of the same staff table. Aliases e (employee) and m (manager) let the table play both roles."
alt:
  vi: "Cây quản lý trong bảng staff. Ha Minh (CEO) ở trên cùng; manager_id của Ha Minh là NULL, nên cần LEFT JOIN để giữ dòng này. Do Lan (cùng 3 người dưới quyền) và Ly Quan (quản lý vùng) trỏ tới Ha Minh. Ta Vy (quản lý cửa hàng) trỏ tới Ly Quan. Hai thu ngân Vu Giang và Phan Khanh trỏ tới Ta Vy. Lam Phuong (kho) trỏ tới Phan Khanh. Bên dưới, cùng một bảng dưới hai bí danh: staff e có dòng Ta Vy, manager_id 3; staff m có dòng id 3, Ly Quan; hai dòng ghép với nhau qua ON m.id = e.manager_id."
  en: "The management tree inside the staff table. Ha Minh (CEO) is at the top; Ha Minh's manager_id is NULL, so a LEFT JOIN is needed to keep that row. Do Lan (with 3 more people) and Ly Quan (regional manager) point to Ha Minh. Ta Vy (store manager) points to Ly Quan. Two cashiers, Vu Giang and Phan Khanh, point to Ta Vy. Lam Phuong (stock clerk) points to Phan Khanh. Below, the same table under two aliases: staff e has the row Ta Vy, manager_id 3; staff m has the row id 3, Ly Quan; the two rows pair up through ON m.id = e.manager_id."
nodes:
  - { id: ha, label: Ha Minh, sub: CEO }
  - { id: nul, mono: true, label: "manager_id NULL", sub: { vi: "LEFT JOIN để giữ", en: "LEFT JOIN to keep" }, tone: warm }
  - { id: dl, label: Do Lan, sub: { vi: "+3 người", en: "+3 people" }, tone: ghost }
  - { id: lq, label: Ly Quan, sub: { vi: "QL vùng", en: "Reg. mgr" } }
  - { id: tv, label: Ta Vy, sub: { vi: "QL cửa hàng", en: "Store mgr" }, tone: new }
  - { id: vg, label: Vu Giang, sub: { vi: "Thu ngân", en: "Cashier" } }
  - { id: pk, label: Phan Khanh, sub: { vi: "Thu ngân", en: "Cashier" } }
  - { id: lp, label: Lam Phuong, sub: { vi: "Kho", en: "Stock clerk" } }
  - { id: se, shape: grid, label: staff e, head: [name, manager_id], cells: [[Ta Vy, "3"]], tone: new }
  - { id: sm, shape: grid, label: staff m, head: [id, name], cells: [["3", Ly Quan]] }
  - { id: on, shape: note, mono: true, label: "ON m.id = e.manager_id" }
