# GB-6 (tools/v39/diagram-plan.md): ROW_NUMBER, RANK, DENSE_RANK on a tie. Lesson: window_rank (Ví dụ, "Ba cách xử lý đồng hạng").
# Data (lab, checked in PGlite): Hue customers born 1998 or later, ORDER BY birth_year DESC: Le Khanh 2004 1/1/1, Vo Lan 1999 2/2/2,
# Bui Trang 1998 3/3/3, Bui Hoa 1998 4/3/3. The last row (5/5/4) is an illustration of "the next person": no such row in this filter.
# Column heads rn/rk/drk keep the table inside 264 units at a 320 phone; the keys under it spell them out.
# Source: https://www.postgresql.org/docs/current/functions-window.html
title: { vi: "Ba cách xếp hạng khi đồng hạng", en: "Three rankings on a tie" }
caption:
  vi: "Khách Hue sinh từ năm 1998 trở đi, năm sinh giảm dần. Ba hàm chỉ khác nhau ở chỗ đồng hạng và ở số đứng sau nó; dòng cuối là minh họa người kế tiếp, không có trong dữ liệu."
  en: "Hue customers born 1998 or later, by birth year descending. The three functions differ only on a tie and on the number after it; the last row illustrates the next person and is not in the data."
alt:
  vi: "Ba hàm chỉ khác nhau khi có đồng hạng: hai người cùng sinh 1998 nhận số 3 và 4 với ROW_NUMBER (ai trước là tùy), còn RANK và DENSE_RANK cho cả hai hạng 3. Sau chỗ đồng hạng, RANK bỏ qua một số và nhảy sang 5, còn DENSE_RANK đi tiếp sang 4."
  en: "The three functions differ only on a tie: the two people born in 1998 get 3 and 4 from ROW_NUMBER (which one first is arbitrary), while RANK and DENSE_RANK give both rank 3. After the tie, RANK skips a number and jumps to 5, while DENSE_RANK goes on to 4."
nodes:
  - id: t
    shape: grid
    label: { vi: "Hue, theo năm sinh", en: "Hue, by birth year" }
    head: [{ vi: "tên", en: name }, { vi: "năm", en: year }, rn, rk, drk]
    cells:
      - [Le Khanh, "2004", "1", "1", "1"]
      - [Vo Lan, "1999", "2", "2", "2"]
      - [Bui Trang, "1998", "3", "3", "3"]
      - [Bui Hoa, "1998", "4", "3", "3"]
      - [{ vi: "minh họa", en: example }, "1997", "5", "5", "4"]
    rowTone: [null, null, warm, warm, ghost]
    cellTone: { "4:3": new, "4:4": new }
    sub: { vi: "đồng hạng: hai người sinh 1998", en: "tie: two born in 1998" }
  - { id: rn, shape: key, mono: true, label: "rn = ROW_NUMBER", sub: { vi: "3 và 4, tùy thứ tự", en: "3 and 4, any order" } }
  - { id: rk, shape: key, mono: true, label: "rk = RANK", sub: { vi: "3, 3, rồi nhảy 5", en: "3, 3, then jumps 5" }, tone: new }
  - { id: drk, shape: key, mono: true, label: "drk = DENSE_RANK", sub: { vi: "3, 3, rồi 4", en: "3, 3, then 4" }, tone: new }
rows:
  - [t]
  - [rn, rk, drk]
