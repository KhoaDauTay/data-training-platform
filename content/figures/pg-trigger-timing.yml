  - { id: r1, label: pen, sub: "10.00 → 11.00", tone: new }
  - { id: r2, label: book, sub: "50.00 → 51.00", tone: new }
  - { id: r3, label: bag, sub: "120.00 → 121.00", tone: new }
  - { id: ar, label: AFTER ROW ×3, sub: { vi: "ghi price_audit", en: "writes price_audit" }, tone: live }
  - { id: as, label: AFTER STATEMENT, sub: "×1 · NEW TABLE", tone: live }
  - { id: old, shape: key, label: { vi: "OLD = giá cũ", en: "OLD = old price" } }
  - { id: new, shape: key, label: { vi: "NEW: sửa được ở BEFORE ROW", en: "NEW: editable in BEFORE ROW" } }
