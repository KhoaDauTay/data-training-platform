# PG-4 (tools/v39/diagram-plan.md): read the first n entries and stop. Lesson: e-pg-l1-11 (Ý chính).
# Data (PGlite, lesson setup): orders 20,000 rows, created_at = 2026-01-01 00:00 + g·7 min, so 01-01 00:07 … 04-08 05:20 (UTC);
# index orders_created_idx; EXPLAIN … ORDER BY created_at DESC LIMIT 5 = Limit over Index Scan Backward.
# Deviation: the plan's leaf strip is a column of entries (one row each; a strip of timestamps does not fit 280 wide), the
# "…" row says how many entries it hides. R3 (E5): Seq Scan + Sort is a separate plan, in its own frame "Kế hoạch khác" under the
# index (shown in step 3 only, the frame with it), never beside the index rows. Source: https://www.postgresql.org/docs/current/indexes-ordering.html
title: { vi: "Đọc n mục đầu của index rồi dừng", en: "Read the first n index entries and stop" }
caption:
  vi: "B-tree giữ created_at theo thứ tự, nên ORDER BY created_at DESC LIMIT 5 chỉ đọc ngược 5 mục cuối rồi dừng. Một index tăng dần đọc được cả hai chiều."
  en: "The B-tree keeps created_at in order, so ORDER BY created_at DESC LIMIT 5 reads the last 5 entries backwards and stops. An ascending index can be read in both directions."
alt:
  vi: "Index B-tree đã giữ created_at theo thứ tự, nên ORDER BY created_at DESC LIMIT 5 chỉ cần đọc ngược 5 mục cuối rồi dừng. Không có index đó, Postgres phải đọc cả 20 000 dòng và sắp xếp chỉ để lấy 5 dòng."
  en: "The B-tree index already keeps created_at in order, so ORDER BY created_at DESC LIMIT 5 only reads the last 5 entries backwards and stops. Without that index, Postgres must read all 20,000 rows and sort them just to get 5."
groups:
  - { id: other, label: { vi: "Kế hoạch khác", en: "Another plan" }, nodes: [alt] }
nodes:
  - { id: lim, label: Limit 5, sub: { vi: "đủ 5 thì dừng", en: "stops at 5" }, tone: ghost }
  - { id: scan, label: Index Scan Backward, tone: ghost }
  - id: idx
    shape: grid
    label: orders_created_idx
    sub: { vi: "20 000 mục, tăng dần", en: "20,000 entries, ascending" }
    head: [created_at, ""]
    cells: [["01-01 00:07", ""], ["01-01 00:14", ""], [{ vi: "… 19 993 mục", en: "… 19,993 more" }, ""], ["04-08 04:52", ""], ["04-08 04:59", ""], ["04-08 05:06", ""], ["04-08 05:13", ""], ["04-08 05:20", ""]]
    colTone: [null, new]
  - { id: alt, label: Seq Scan + Sort, sub: { vi: "đọc 20 000 dòng", en: "reads 20,000 rows" }, tone: ghost }
rows:
  - [lim]
  - [scan]
  - [idx]
  - [alt]
edges:
  - { from: scan, to: lim }
  - { from: idx, to: scan }
steps:
  - say: { vi: "B-tree giữ created_at theo thứ tự.", en: "The B-tree keeps created_at in order." }
    show: [lim, scan, idx]
    alt: { vi: "Index orders_created_idx lưu 20 000 mục created_at đã xếp tăng dần, nên mục mới nhất luôn nằm ở cuối.", en: "Index orders_created_idx stores 20,000 created_at entries already sorted ascending, so the newest entry is always at the end." }
  - say: { vi: "DESC: đọc ngược từ cuối, đủ 5 thì Limit dừng.", en: "DESC: read backwards from the end; Limit stops at 5." }
    show: [lim, scan, idx]
    alt: { vi: "Index Scan Backward đọc ngược từ mục cuối và Limit dừng ngay khi đủ 5 mục, nên 19 995 mục còn lại không bao giờ được đọc.", en: "Index Scan Backward reads backwards from the last entry and Limit stops as soon as it has 5, so the other 19,995 entries are never read." }
    set:
      lim: { tone: live }
      scan: { tone: live }
      idx: { head: [created_at, { vi: "đọc", en: "read" }], cells: [["01-01 00:07", ""], ["01-01 00:14", ""], [{ vi: "… 19 993 mục", en: "… 19,993 more" }, ""], ["04-08 04:52", "5"], ["04-08 04:59", "4"], ["04-08 05:06", "3"], ["04-08 05:13", "2"], ["04-08 05:20", "1"]] }
  - say: { vi: "Không index (hoặc sắp theo biểu thức): đọc hết rồi sắp.", en: "No index (or sorting by an expression): read everything, then sort." }
    alt: { vi: "Khi không có index khớp, hoặc khi sắp theo biểu thức như created_at::date, Seq Scan phải đọc cả 20 000 dòng rồi Sort mới chọn ra 5 dòng.", en: "With no matching index, or when sorting by an expression such as created_at::date, Seq Scan must read all 20,000 rows and Sort then picks 5." }
    set:
      alt: { tone: warm }
      lim: { tone: live }
      scan: { tone: live }
      idx: { head: [created_at, { vi: "đọc", en: "read" }], cells: [["01-01 00:07", ""], ["01-01 00:14", ""], [{ vi: "… 19 993 mục", en: "… 19,993 more" }, ""], ["04-08 04:52", "5"], ["04-08 04:59", "4"], ["04-08 05:06", "3"], ["04-08 05:13", "2"], ["04-08 05:20", "1"]] }
