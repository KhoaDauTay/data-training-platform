# PG-4 (tools/v39/diagram-plan.md): read the first n entries and stop. Lesson: e-pg-l1-11 (Ý chính).
# Data (PGlite, lesson setup): orders 20,000 rows, created_at = 2026-01-01 00:00 + g·7 min, so 01-01 00:07 … 04-08 05:20 (UTC);
# index orders_created_idx; EXPLAIN … ORDER BY created_at DESC LIMIT 5 = Limit over Index Scan Backward.
# Deviation: the plan's leaf strip is a column of entries (one row each; a strip of timestamps does not fit 280 wide), the
# "…" row says how many entries it hides. Source: https://www.postgresql.org/docs/current/indexes-ordering.html
title: { vi: "Đọc n mục đầu của index rồi dừng", en: "Read the first n index entries and stop" }
caption:
  vi: "B-tree giữ created_at theo thứ tự, nên ORDER BY created_at DESC LIMIT 5 chỉ đọc ngược 5 mục cuối rồi dừng. Một index tăng dần đọc được cả hai chiều."
  en: "The B-tree keeps created_at in order, so ORDER BY created_at DESC LIMIT 5 reads the last 5 entries backwards and stops. An ascending index can be read in both directions."
alt:
  vi: "Index orders_created_idx giữ 20 000 mục created_at theo thứ tự tăng: 01-01 00:07, 01-01 00:14, rồi 19 993 mục nữa, rồi 04-08 04:52, 04:59, 05:06, 05:13 và cuối cùng 05:20."
  en: "Index orders_created_idx holds 20,000 created_at entries in ascending order: 01-01 00:07, 01-01 00:14, then 19,993 more, then 04-08 04:52, 04:59, 05:06, 05:13 and finally 05:20."
nodes:
  - { id: lim, label: Limit 5, sub: { vi: "đủ 5 thì dừng", en: "stops at 5" }, tone: ghost }
  - { id: scan, label: Index Scan Backward, tone: ghost }
  - id: idx
    shape: grid
    label: orders_created_idx
    sub: { vi: "20 000 mục, tăng dần", en: "20,000 entries, ascending" }
    head: [created_at, ""]
    cells: [["01-01 00:07", ""], ["01-01 00:14", ""], [{ vi: "… 19 993 mục", en: "… 19,993 more" }, ""], ["04-08 04:52", ""], ["04-08 04:59", ""], ["04-08 05:06", ""], ["04-08 05:13", ""], ["04-08 05:20", ""]]
    colTone: [null, new]
  - { id: alt, label: Seq Scan + Sort, sub: { vi: "đọc 20 000 dòng", en: "reads 20,000 rows" }, tone: ghost }
rows:
  - [lim]
  - [scan]
  - [idx, alt]
edges:
  - { from: scan, to: lim }
  - { from: idx, to: scan }
steps:
  - say: { vi: "B-tree giữ created_at theo thứ tự.", en: "The B-tree keeps created_at in order." }
    show: [lim, scan, idx]
  - say: { vi: "DESC: đọc ngược từ cuối, đủ 5 thì Limit dừng.", en: "DESC: read backwards from the end; Limit stops at 5." }
    show: [lim, scan, idx]
    alt: { vi: "Index Scan Backward đọc ngược từ mục cuối: 05:20 là mục thứ 1, rồi 05:13, 05:06, 04:59, và 04:52 là mục thứ 5. Limit 5 dừng ngay đó, không đọc 19 995 mục còn lại.", en: "Index Scan Backward reads from the last entry: 05:20 is entry 1, then 05:13, 05:06, 04:59, and 04:52 is entry 5. Limit 5 stops right there and never reads the other 19,995 entries." }
    set:
      lim: { tone: live }
      scan: { tone: live }
      idx: { head: [created_at, { vi: "đọc", en: "read" }], cells: [["01-01 00:07", ""], ["01-01 00:14", ""], [{ vi: "… 19 993 mục", en: "… 19,993 more" }, ""], ["04-08 04:52", "5"], ["04-08 04:59", "4"], ["04-08 05:06", "3"], ["04-08 05:13", "2"], ["04-08 05:20", "1"]] }
  - say: { vi: "Không index (hoặc sắp theo biểu thức): đọc hết rồi sắp.", en: "No index (or sorting by an expression): read everything, then sort." }
    alt: { vi: "Cách khác, khi không có index phù hợp hoặc khi sắp theo một biểu thức như created_at::date: Seq Scan đọc cả 20 000 dòng rồi Sort (top-N heapsort) mới đưa 5 dòng lên Limit.", en: "The other way, with no matching index or when sorting by an expression such as created_at::date: Seq Scan reads all 20,000 rows, then Sort (top-N heapsort) hands 5 rows to Limit." }
    set:
      alt: { tone: warm }
      lim: { tone: live }
      scan: { tone: live }
      idx: { head: [created_at, { vi: "đọc", en: "read" }], cells: [["01-01 00:07", ""], ["01-01 00:14", ""], [{ vi: "… 19 993 mục", en: "… 19,993 more" }, ""], ["04-08 04:52", "5"], ["04-08 04:59", "4"], ["04-08 05:06", "3"], ["04-08 05:13", "2"], ["04-08 05:20", "1"]] }
