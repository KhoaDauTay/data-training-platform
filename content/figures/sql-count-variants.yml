# GA-3 (tools/v39/diagram-plan.md): count(*), count(col), count(DISTINCT col). Lesson: aggregate (Ý chính).
# Data (lab, checked in PGlite): customers 300 rows; city NULL on 17 → count(city) 283; 5 distinct non-NULL cities.
# R1 E7 (L625): the big numbers count the 8 sample rows drawn (8 / 6 / 5); the whole table's counts sit under them.
# R1 E16: `align` puts the three function boxes in one column at every width. Source: functions-aggregate.html
title: { vi: "Ba kiểu count trên cùng một cột", en: "Three counts on one column" }
caption:
  vi: "Số lớn đếm 8 dòng mẫu; dòng nhỏ là kết quả trên cả bảng 300 khách. Hàm gộp bỏ qua ô NULL; chỉ count(*) đếm mọi dòng."
  en: "The big numbers count the 8 sample rows; the small line is the result on the whole 300-customer table. Aggregates skip NULL cells; only count(*) counts every row."
alt:
  vi: "Ba kiểu count trả lời ba câu hỏi khác nhau trên cùng một cột: count(*) đếm dòng, count(city) chỉ đếm ô có giá trị vì hàm gộp bỏ qua NULL, còn count(DISTINCT city) đếm mỗi giá trị một lần. Trên 8 dòng mẫu: 8, 6 và 5; trên cả bảng: 300, 283 và 5."
  en: "The three counts answer three different questions on one column: count(*) counts rows, count(city) counts only filled cells because aggregates skip NULL, and count(DISTINCT city) counts each value once. On the 8 sample rows: 8, 6 and 5; on the whole table: 300, 283 and 5."
align: true
nodes:
  - id: city
    shape: grid
    label: { vi: "customers.city: 8 dòng mẫu", en: "customers.city: 8 sample rows" }
    head: [city]
    cells: [[Da Nang], [HCM City], ["NULL"], [Hue], [Da Nang], [Hanoi], ["NULL"], [Can Tho]]
    toneOf: { "NULL": ghost }
  - { id: star, mono: true, label: "count(*)", sub: { vi: "mọi dòng", en: "every row" } }
  - { id: col, mono: true, label: "count(city)", sub: { vi: "bỏ ô NULL", en: "skips NULL cells" } }
  - { id: dist, mono: true, label: "count(DISTINCT city)" }
  - { id: n300, label: "8", sub: { vi: "cả bảng: 300", en: "whole table: 300" }, tone: new }
  - { id: n283, label: "6", sub: { vi: "cả bảng: 283", en: "whole table: 283" }, tone: new }
  - { id: n5, label: "5", sub: { vi: "cả bảng: 5", en: "whole table: 5" }, tone: new }
rows:
  - [city]
  - [star, n300]
  - [col, n283]
  - [dist, n5]
edges:
  - { from: star, to: n300 }
  - { from: col, to: n283 }
  - { from: dist, to: n5 }
