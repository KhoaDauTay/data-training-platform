  - { id: d, label: { vi: "khối 15–23", en: "ranges 15–23" }, sub: { vi: "bỏ qua", en: "skipped" }, tone: ghost }
  - { id: q, label: { vi: "ngày 10/10", en: "10 Oct" }, sub: { vi: "1.440 dòng", en: "1,440 rows" }, tone: new }
rows:
