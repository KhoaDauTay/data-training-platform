# GA-9 (tools/v39/diagram-plan.md): INNER, LEFT, FULL on the same data (rows, not a Venn diagram). Lesson: full_join (Ý chính).
# R1 E2 (L625): two days of orders, so each side has a store the other lacks (the February targets/sales pair was a subset, which
# made LEFT = INNER). Data (lab, checked in PGlite: SELECT order_date, array_agg(DISTINCT store_id) FROM orders GROUP BY 1):
# 23 Oct has orders from stores 1 2 3 5, 24 Oct from 1 2 3 4 → INNER 3 rows, LEFT (23) 4 rows, FULL 5 rows with NULL on both sides.
# Same shape as the lesson's "two days, every store with orders" example. Source: queries-table-expressions.html#QUERIES-JOIN
title: { vi: "INNER, LEFT, FULL trên cùng dữ liệu", en: "INNER, LEFT, FULL on the same data" }
caption:
  vi: "Cửa hàng có đơn ngày 23/10 (d23) và ngày 24/10 (d24). Loại JOIN quyết định dòng không có cặp của bên nào được giữ."
  en: "Stores with orders on 23 Oct (d23) and on 24 Oct (d24). The join type decides whose unmatched rows survive."
alt:
  vi: "Cùng hai ngày đơn, loại JOIN quyết định dòng không có cặp của bên nào được giữ: INNER chỉ giữ cửa hàng có đơn cả hai ngày, LEFT giữ thêm cửa hàng chỉ có ở d23, FULL giữ cả hai phía và điền NULL vào chỗ thiếu. Kết quả: 3, 4 rồi 5 dòng."
  en: "On the same two days of orders, the join type decides whose unmatched rows survive: INNER keeps only stores with orders on both days, LEFT also keeps stores only in d23, FULL keeps both sides and fills gaps with NULL. Result: 3, then 4, then 5 rows."
nodes:
  - { id: kt, mono: true, label: "d23: 1 2 3 5", sub: { vi: "đơn ngày 23/10", en: "orders on 23 Oct" } }
  - { id: ka, mono: true, label: "d24: 1 2 3 4", sub: { vi: "đơn ngày 24/10", en: "orders on 24 Oct" } }
  - id: inner
    shape: grid
    label: INNER
    head: [d23, d24]
    cells: [["1", "1"], ["2", "2"], ["3", "3"]]
    sub: { vi: "3 dòng: chỉ cặp", en: "3 rows: pairs only" }
  - id: left
    shape: grid
    label: LEFT (d23)
    head: [d23, d24]
    cells: [["1", "1"], ["2", "2"], ["3", "3"], ["5", "NULL"]]
    toneOf: { "NULL": warm }
    sub: { vi: "mất cửa hàng 4", en: "store 4 lost" }
  - id: full
    shape: grid
    label: FULL
    head: [d23, d24]
    cells: [["1", "1"], ["2", "2"], ["3", "3"], ["5", "NULL"], ["NULL", "4"]]
    toneOf: { "NULL": warm }
    sub: { vi: "5 dòng: đủ hai bên", en: "5 rows: both sides" }
rows:
  - [kt, ka]
  - [inner, left, full]
