  - { id: alo, mono: true, label: at-least-once, sub: { vi: "lưu sau", en: "save after" } }
  - { id: eo, mono: true, label: effectively-once, sub: { vi: "+ idempotent", en: "+ idempotence" }, tone: live }
  - { id: r1, label: { vi: "offset 3 bị mất", en: "offset 3 lost" }, tone: warm }
  - { id: r2, label: { vi: "2 và 3 hai lần", en: "2 and 3 twice" }, tone: warm }
  - { id: r3, label: { vi: "mỗi offset một lần", en: "each offset once" }, tone: new }
