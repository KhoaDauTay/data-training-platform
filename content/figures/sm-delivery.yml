# v47 SM: three delivery guarantees and what a crash leaves behind. Lesson: e-sm-l2-01 (Ý chính).
# Data = the lab's deliveries: at_most_once lost offset 3; at_least_once ran offsets 2 and 3 twice.
# Sources: https://kafka.apache.org/41/design/design/ (message delivery semantics) ; https://debezium.io/documentation/faq/
title: { vi: "Lưu vị trí lúc nào?", en: "When is the position saved?" }
caption:
  vi: "Lưu trước khi xử lý thì có thể mất; lưu sau thì có thể trùng; lưu sau cộng một khóa bỏ trùng thì mỗi kết quả chỉ một lần."
  en: "Saving before processing can lose events; saving after can repeat them; saving after plus a dedupe key gives each result once."
alt:
  vi: "Khi consumer sập giữa hai việc xử lý và lưu vị trí, thứ tự của hai việc quyết định sự kiện bị mất hay bị lặp. Kết quả: at-most-once mất offset 3, at-least-once xử lý offset 2 và 3 hai lần, còn at-least-once có consumer idempotent cho mỗi offset một kết quả."
  en: "When a consumer crashes between processing and saving its position, the order of the two decides whether events are lost or repeated. Result: at-most-once loses offset 3, at-least-once processes offsets 2 and 3 twice, and at-least-once with an idempotent consumer gives one result per offset."
nodes:
