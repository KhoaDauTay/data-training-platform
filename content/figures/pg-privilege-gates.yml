# PG-6 (tools/v39/diagram-plan.md): CONNECT → USAGE → SELECT, and role membership. Lesson: e-pg-l2-22 (Ý chính).
# Data (lesson setup): roles readers (NOLOGIN) and linh (LOGIN); schema sales; sales.orders An 120, Binh 80.50, Chi 310 (3 rows);
# GRANT SELECT ON sales.orders TO readers; the lab grants readers TO linh; readers has no USAGE on sales until a step grants it.
# Deviation: the plan's padlock is the word "thiếu USAGE"; the long GRANT statements live in the caption. Not placed in
# e-pg-l2-21 (its lab uses role support on public.orders, a different picture). Sources: https://www.postgresql.org/docs/current/ddl-schemas.html,
# https://www.postgresql.org/docs/current/ddl-priv.html
title: { vi: "Ba cửa quyền: database, schema, bảng", en: "Three privilege doors: database, schema, table" }
caption:
  vi: "GRANT readers TO linh cho linh dùng quyền của nhóm readers. Muốn đọc sales.orders phải qua cả ba cửa: CONNECT vào database (PUBLIC có sẵn), USAGE trên schema sales, SELECT trên bảng. GRANT USAGE ON SCHEMA sales TO readers mở cửa giữa."
  en: "GRANT readers TO linh lets linh use the group readers' privileges. Reading sales.orders takes all three doors: CONNECT on the database (PUBLIC has it), USAGE on schema sales, SELECT on the table. GRANT USAGE ON SCHEMA sales TO readers opens the middle door."
alt:
  vi: "Muốn đọc một bảng phải qua đủ ba cửa theo thứ tự: CONNECT vào database, USAGE trên schema, SELECT trên bảng; thiếu một cửa là bị chặn dù các cửa kia đã mở. Vai trò linh có các quyền đó nhờ là thành viên của nhóm readers."
  en: "Reading a table takes three doors in order: CONNECT on the database, USAGE on the schema, SELECT on the table; one missing door blocks you even when the others are open. The role linh gets these privileges as a member of the group readers."
nodes:
  - { id: linh, label: linh, sub: LOGIN }
  - { id: rd, label: readers, sub: { vi: "nhóm, NOLOGIN", en: "group, NOLOGIN" } }
  - { id: g1, label: database, sub: { vi: "CONNECT ✓ (PUBLIC)", en: "CONNECT ✓ (PUBLIC)" }, tone: live }
  - { id: g2, label: schema sales, sub: { vi: "thiếu USAGE", en: "USAGE missing" }, tone: dead }
  - { id: g3, label: sales.orders, sub: SELECT ✓, tone: live }
rows:
  - [linh, rd]
  - [g1, g2, g3]
edges:
  - { from: linh, to: rd, label: { vi: "thành viên", en: "member of" } }
  - { from: rd, to: g1 }
  - { from: g1, to: g2 }
  - { from: g2, to: g3 }
steps:
  - say: { vi: "Quyền trên bảng chưa đủ: phải qua được schema.", en: "A table grant is not enough: the schema must let you in." }
    alt: { vi: "readers có CONNECT (PUBLIC có sẵn) và SELECT trên bảng, nhưng thiếu USAGE trên schema sales nên bị chặn ở cửa giữa và quyền SELECT chưa dùng được.", en: "readers has CONNECT (PUBLIC has it) and SELECT on the table, but lacks USAGE on schema sales, so it is stopped at the middle door and the SELECT cannot be used yet." }
  - say: { vi: "Thêm USAGE trên schema: đủ ba cửa, đọc được.", en: "Add USAGE on the schema: all three doors open, the read works." }
    alt: { vi: "GRANT USAGE ON SCHEMA sales TO readers mở cửa giữa, nên cả ba cửa đều mở và linh, qua nhóm readers, đọc được sales.orders.", en: "GRANT USAGE ON SCHEMA sales TO readers opens the middle door, so all three doors are open and linh, through the group readers, can read sales.orders." }
    set:
      g2: { sub: USAGE ✓, tone: live }
      g3: { sub: { vi: "SELECT ✓ · 3 dòng", en: "SELECT ✓ · 3 rows" } }
