# GB-8 (tools/v39/diagram-plan.md): leave the column bare. Lessons: sargable (Ý chính), cast (Lỗi hay gặp, the `customer_id::text = '42'` pitfall).
# Plans (lab, checked in PGlite with EXPLAIN): order_date >= '2026-10-01' AND order_date < '2026-11-01' → Bitmap Index Scan on
# orders_order_date_idx; date_trunc('month', order_date) = '2026-10-01' → Seq Scan (customer_id::text = '42' → Seq Scan too).
# Sources: https://www.postgresql.org/docs/current/indexes-types.html#INDEXES-TYPES-BTREE ,
# https://www.postgresql.org/docs/current/indexes-expressional.html
title: { vi: "Để cột trần thì chỉ mục mới cắt được", en: "Leave the column bare so the index can cut" }
caption:
  vi: "Chỉ mục xếp theo giá trị gốc của cột, nên chỉ điều kiện trên cột trần mới chọn được một đoạn liền."
  en: "An index is sorted by the column's raw value, so only a condition on the bare column can pick one contiguous stretch."
alt:
  vi: "Chỉ mục orders_order_date_idx xếp các ngày theo thứ tự: 09-30, 10-01, …, 10-31, 11-01. Điều kiện order_date >= '2026-10-01' AND order_date < '2026-11-01' để cột trần: Postgres nhảy tới 10-01 và đọc một đoạn liền tới hết 10-31, kế hoạch là Bitmap Index Scan. Điều kiện date_trunc('month', order_date) = '2026-10-01' bọc cột trong một hàm: chỉ mục không xếp theo kết quả của hàm, nên phải tính hàm cho mọi dòng, kế hoạch là Seq Scan. Cách sửa: đổi phía hằng số, đừng đổi cột."
  en: "The index orders_order_date_idx keeps the dates in order: 09-30, 10-01, …, 10-31, 11-01. The condition order_date >= '2026-10-01' AND order_date < '2026-11-01' leaves the column bare: Postgres jumps to 10-01 and reads one stretch to the end of 10-31, and the plan is a Bitmap Index Scan. The condition date_trunc('month', order_date) = '2026-10-01' wraps the column in a function: the index is not sorted by the function's result, so the function runs on every row, and the plan is a Seq Scan. The fix: change the constant side, not the column."
