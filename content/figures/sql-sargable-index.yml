# GB-8 (tools/v39/diagram-plan.md): leave the column bare. Lessons: sargable (Ý chính), cast (Lỗi hay gặp, pitfall `price_vnd::text > '50000'`).
# Plans (lab, checked in PGlite with EXPLAIN): order_date >= '2026-10-01' AND order_date < '2026-11-01' → Bitmap Index Scan on
# orders_order_date_idx; date_trunc('month', order_date) = '2026-10-01' → Seq Scan. The last order is on 10-31, so the strip ends there.
# Sources: https://www.postgresql.org/docs/current/indexes-types.html#INDEXES-TYPES-BTREE ,
# https://www.postgresql.org/docs/current/indexes-expressional.html
title: { vi: "Để cột trần thì chỉ mục mới cắt được", en: "Leave the column bare so the index can cut" }
caption:
  vi: "Chỉ mục xếp theo giá trị gốc của cột, nên chỉ điều kiện trên cột trần mới chọn được một đoạn liền."
  en: "An index is sorted by the column's raw value, so only a condition on the bare column can pick one contiguous stretch."
alt:
  vi: "Chỉ mục xếp theo giá trị gốc của order_date, nên điều kiện để cột trần (order_date >= '2026-10-01' AND order_date < '2026-11-01') cho Postgres nhảy thẳng tới một đoạn liền: Bitmap Index Scan. Bọc cột trong date_trunc thì chỉ mục không biết kết quả của hàm, nên phải tính hàm cho mọi dòng (Seq Scan); vì vậy hãy đổi phía hằng số, đừng đổi cột."
  en: "The index is sorted by order_date's raw value, so a condition on the bare column (order_date >= '2026-10-01' AND order_date < '2026-11-01') lets Postgres jump straight to one stretch: a Bitmap Index Scan. Wrap the column in date_trunc and the index knows nothing about the function's result, so the function runs on every row (a Seq Scan); so change the constant side, not the column."
nodes:
  - { id: idx, shape: grid, mono: true, label: { vi: "chỉ mục order_date", en: "order_date index" }, cells: [["09-29", "09-30", "10-01", "…", "10-31"]], sub: { vi: "đã xếp theo ngày", en: "sorted by date" } }
  - { id: good, shape: grid, mono: true, label: { vi: "cột để trần", en: "bare column" }, cells: [["09-29", "09-30", "10-01", "…", "10-31"]], colTone: [ghost, ghost, new, new, new], sub: { vi: "đọc 1 đoạn liền", en: "reads 1 stretch" } }
  - { id: gplan, shape: key, mono: true, label: Bitmap Index Scan, tone: live }
  - { id: bad, shape: grid, mono: true, label: { vi: "hàm bọc cột", en: "function on column" }, cells: [["f()", "f()", "f()", "f()", "f()"]], colTone: [warm, warm, warm, warm, warm], sub: { vi: "tính f() mọi dòng", en: "f() on every row" } }
  - { id: bplan, shape: key, mono: true, label: Seq Scan, tone: dead }
  - { id: rule, shape: note, label: { vi: "đổi phía hằng\u00a0số, đừng đổi cột", en: "move the constant, not the column" } }
