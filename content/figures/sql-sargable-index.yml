  - { id: bad, shape: grid, mono: true, label: { vi: "hàm bọc cột", en: "function on column" }, cells: [["f()", "f()", "f()", "f()", "f()"]], colTone: [warm, warm, warm, warm, warm], sub: { vi: "tính f() mọi dòng", en: "f() on every row" } }
