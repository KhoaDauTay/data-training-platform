  - { id: good, shape: grid, mono: true, label: { vi: "cột để trần", en: "bare column" }, cells: [["09-30", "10-01", "…", "10-31", "11-01"]], colTone: [ghost, new, new, new, ghost], sub: { vi: "đọc 1 đoạn liền", en: "reads 1 stretch" } }
