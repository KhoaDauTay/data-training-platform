# TS-8 (v47 L972): readings measured at 07:30–07:50 arrive at 09:20, after the 09:05 summary; the 07:00 hour must be recomputed.
# Lesson: e-ts-l2-03 (Ý chính). Data = the lab: sensor 2, three late readings; hourly 07:00 has 3 readings at 09:05, 6 after the recompute.
title: { vi: "Giờ cũ nhận thêm số đo", en: "An old hour gets more readings" }
caption:
  vi: "Bảng hourly chạy lúc 09:05 chỉ thấy 3 số đo của giờ 07:00; ba số đo trễ về lúc 09:20, nên giờ đó được tính lại thành 6."
  en: "The hourly table built at 09:05 sees only 3 readings for the 07:00 hour; three late readings arrive at 09:20, so that hour is recomputed with 6."
alt:
  vi: "Số đo về trễ thuộc về giờ lúc nó được đo, không phải giờ nó về. Vì vậy lần chạy sau phải chọn việc theo thời điểm nhận, rồi tính lại những giờ đo của các số đo đó."
  en: "A late reading belongs to the hour it was measured, not the hour it arrived. So the next run must choose its work by arrival time, then recompute the measurement hours of those readings."
