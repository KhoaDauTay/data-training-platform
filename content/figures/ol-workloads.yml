    cells: [["2040", "VNSGN", "1", "…"], ["2041", "VNHPH", "2", "…"], ["2042", "VNDAD", "3", "…"]]
    cellTone: { "1:0": new, "0:1": warm, "0:2": warm, "1:1": warm, "1:2": warm, "2:1": warm, "2:2": warm }
rows:
