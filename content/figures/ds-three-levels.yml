# DS-1 (tools/v39/diagram-plan.md): external, conceptual, internal. Lesson: e-ds-l1-01 (Ý chính).
# Data: the lesson's own objects: table products (id, name, price; PK, NOT NULL), views price_list (Example) and cheap_products (lab,
# "the sales team"), the column stock (lab step 2), the index products_price_idx (Example), 8 kB pages.
# The sales team (lab step 1: cheap_products) is named in a sub. v40 R2 (E-05): each independence is a pill in the gap between the two
# levels it separates, lit on its step; the levels stay bands with no arrows (arrows into a wrapped band left no room for its label on a
# 320 phone). Sources: the lesson's (ANSI/SPARC); https://www.postgresql.org/docs/current/storage-page-layout.html
title: { vi: "Ba tầng và hai kiểu độc lập", en: "Three levels, two kinds of independence" }
caption:
  vi: "Mỗi tầng có schema riêng; đổi tầng dưới không bắt tầng trên đổi theo. Đó là độc lập dữ liệu: logic giữa tầng ngoài và tầng khái niệm, vật lý giữa tầng khái niệm và tầng trong."
  en: "Each level has its own schema; changing a lower level does not force the level above to change. That is data independence: logical between the external and conceptual levels, physical between the conceptual and internal levels."
alt:
  vi: "Cơ sở dữ liệu có ba tầng, mỗi tầng một schema riêng: tầng ngoài là các view người dùng thấy, tầng khái niệm là bảng, tầng trong là file và index. Đổi tầng dưới không bắt tầng trên đổi theo, và đó là độc lập dữ liệu."
  en: "A database has three levels, each with its own schema: the external level is the views users see, the conceptual level the tables, the internal level the files and indexes. Changing a lower level does not force the level above to change, and that is data independence."
groups:
  - { id: ext, label: { vi: "Tầng ngoài", en: "External level" }, nodes: [v1, v2] }
  - { id: con, label: { vi: "Tầng khái niệm", en: "Conceptual level" }, nodes: [tbl] }
  - { id: int, label: { vi: "Tầng trong", en: "Internal level" }, nodes: [file, idx] }
nodes:
  - { id: v1, mono: true, label: price_list, sub: view }
  - { id: v2, mono: true, label: cheap_products, sub: { vi: "view, bán hàng", en: "view, sales" } }
  - { id: tbl, shape: table, mono: true, label: products, sub: "PK · NOT NULL" }
  - { id: file, shape: doc, label: file, sub: { vi: "trang 8 kB", en: "8 kB pages" } }
  - { id: idx, mono: true, label: products_price_idx, sub: { vi: "chưa có", en: "not yet" }, tone: ghost }
  - { id: lg, shape: key, label: { vi: "độc lập logic", en: "logical independence" }, tone: ghost }
  - { id: ph, shape: key, label: { vi: "độc lập vật lý", en: "physical independence" }, tone: ghost }
rows:
  - [v1, v2]
  - [lg]
  - [tbl]
  - [ph]
  - [file, idx]
steps:
  - say: { vi: "Mỗi tầng có schema riêng; người dùng chỉ thấy tầng ngoài.", en: "Each level has its own schema; users only see the external level." }
    alt: { vi: "Người dùng chỉ làm việc với các view ở tầng ngoài, nên họ không cần biết bảng products hay file bên dưới được tổ chức thế nào.", en: "Users only work with the views at the external level, so they need not know how the table products or the files below are organised." }
  - say: { vi: "Thêm cột stock: view cũ vẫn chạy. Đó là độc lập logic.", en: "Add the column stock: old views still run. That is logical independence." }
    alt: { vi: "Thêm cột stock vào bảng products mà hai view vẫn chạy không cần sửa, vì chúng chỉ gọi tên các cột cũ: đó là độc lập logic.", en: "Adding the column stock to products leaves both views running with no edit, because they only name the old columns: that is logical independence." }
    set:
      tbl: { sub: "+ stock", tone: new }
      lg: { tone: new }
      v1: { sub: { vi: "vẫn chạy", en: "still runs" }, tone: live }
      v2: { sub: { vi: "vẫn chạy", en: "still runs" }, tone: live }
  - say: { vi: "Thêm index: câu SQL không đổi một ký tự. Đó là độc lập vật lý.", en: "Add an index: the SQL does not change one character. That is physical independence." }
    alt: { vi: "Thêm index products_price_idx ở tầng trong chỉ đổi cách đọc dữ liệu, còn câu SQL không đổi một ký tự: đó là độc lập vật lý.", en: "Adding the index products_price_idx at the internal level only changes how data is read, while the SQL does not change one character: that is physical independence." }
    set:
      idx: { sub: { vi: "index mới", en: "new index" }, tone: new }
      tbl: { sub: "+ stock" }
      ph: { tone: new }
      v1: { sub: { vi: "SQL không đổi", en: "same SQL" }, tone: live }
      v2: { sub: { vi: "SQL không đổi", en: "same SQL" }, tone: live }
