# PG-8 (tools/v39/diagram-plan.md): compress first, then move out. Lessons: e-pg-l3-03 (Ý chính), e-ds-l4-07 variant `out`.
# Data (PGlite, lesson setup): pg_column_size: id 1 repeat('a',100) = 101 B inline; id 3 repeat('b',100000) = 1156 B (pglz,
# inline); id 2 = 200 md5 strings, 6400 chars, 6400 B, moved out to 4 chunks (chunk_seq 0–2 = 1996 B, 3 = 412 B); heap 1 page.
# The 18-byte pointer is the docs' figure. R2 lesson 2: the arrow to the TOAST table leaves from row 2's cells.
# R3 (E17): the steps follow the decisions (no compression, compression, TOAST: ids 1, 3, 2), so the page lists its rows in id
# order 1, 2, 3 and fills each in when a step reaches it; the TOAST table is named pg_toast_<oid>; the top note reads as the threshold. Source: https://www.postgresql.org/docs/current/storage-toast.html
title: { vi: "TOAST: nén trước, rồi mới ra ngoài", en: "TOAST: compress first, then move out" }
caption:
  vi: "Dòng rộng quá khoảng 2 kB thì Postgres nén giá trị dài tại chỗ trước; vẫn quá rộng mới cắt nó thành chunk khoảng 2000 B trong bảng TOAST, trên trang chỉ còn con trỏ 18 B. Cỡ giá trị không nói trước nó nằm đâu."
  en: "When a row is wider than about 2 kB, Postgres first compresses the long value in place; only if it is still too wide does it cut the value into chunks of about 2000 B in the TOAST table, leaving an 18 B pointer on the page. A value's size does not tell you where it lives."
alt:
  vi: "Khi một dòng rộng quá khoảng 2 kB, Postgres thử nén giá trị dài tại chỗ trước; chỉ khi nén xong vẫn quá rộng mới cắt nó ra bảng TOAST và để lại con trỏ 18 B. Vì vậy cỡ ban đầu của giá trị không nói trước được nó nằm ở đâu."
  en: "When a row is wider than about 2 kB, Postgres first tries to compress the long value in place; only if it is still too wide does it move the value to the TOAST table and leave an 18 B pointer. So a value's original size does not tell you where it ends up."
nodes:
  - { id: thr, shape: note, label: { vi: "ngưỡng TOAST ~2 kB", en: "TOAST threshold ~2 kB" } }
  - { id: val, label: { vi: "id 1: 100 ký tự", en: "id 1: 100 chars" }, sub: { vi: "nhỏ hơn 2 kB", en: "under 2 kB" } }
  - { id: cmp, shape: key, label: { vi: "không cần nén", en: "no compression" }, tone: ghost }
  - { id: res, shape: key, label: { vi: "ở lại trang", en: "stays on page" }, tone: live }
  - id: page
    shape: grid
    label: { vi: "trang heap 8 kB", en: "8 kB heap page" }
    head: [id, { vi: "lưu", en: "stored" }, { vi: "cỡ", en: "size" }]
    cells: [["1", { vi: "tại chỗ", en: "inline" }, "101 B"], ["2", "", ""], ["3", "", ""]]
    cellTone: { "0:1": live }
  - { id: toast, shape: grid, label: pg_toast_<oid>, sub: { vi: "~2000 B mỗi chunk", en: "~2000 B per chunk" }, head: [chunk_seq, len], cells: [["0", "1996"], ["1", "1996"], ["2", "1996"], ["3", "412"]], tone: warm }
rows:
  - [thr]
  - [val]
  - [cmp, res]
  - [page, toast]
edges:
  - { from: val, to: cmp }
  - { from: cmp, to: res }
  - { from: "page#1", to: toast }
steps:
  - say: { vi: "Dòng 1: nhỏ, ở lại trang.", en: "Row 1: small, it stays." }
    alt: { vi: "Dòng 1 chỉ 101 B, dưới ngưỡng 2 kB, nên Postgres không nén và để nó ở lại trang.", en: "Row 1 is only 101 B, under the 2 kB threshold, so Postgres does not compress it and leaves it on the page." }
    show: [thr, val, cmp, res, page]
  - say: { vi: "Dòng 3: lớn nhưng lặp lại, nén còn 1156 B và ở lại.", en: "Row 3: big but repetitive, it compresses to 1156 B and stays." }
    show: [thr, val, cmp, res, page]
    alt: { vi: "Dòng 3 có 100 000 chữ b, quá ngưỡng nhưng lặp lại nên pglz nén còn 1156 B, vừa trang, và nó ở lại tại chỗ.", en: "Row 3 holds 100,000 letters b, over the threshold but repetitive, so pglz compresses it to 1156 B, which fits, and it stays inline." }
    set:
      val: { label: { vi: "id 3: 100 000 'b'", en: "id 3: 100,000 'b'" }, sub: { vi: "lặp lại, quá 2 kB", en: "repeats, over 2 kB" } }
      cmp: { label: { vi: "nén pglz → 1156 B", en: "pglz → 1156 B" }, tone: new }
      page: { cells: [["1", { vi: "tại chỗ", en: "inline" }, "101 B"], ["2", "", ""], ["3", { vi: "nén pglz", en: "pglz" }, "1156 B"]], cellTone: { "2:1": new } }
  - say: { vi: "Dòng 2: gần ngẫu nhiên, nén không được: cắt ra TOAST, để lại con trỏ 18 B.", en: "Row 2: near random, it does not compress: chunked into TOAST, an 18 B pointer stays." }
    alt: { vi: "Dòng 2 có 6400 ký tự md5 gần ngẫu nhiên nên nén không giảm được, và Postgres cắt nó thành 4 chunk trong bảng TOAST, trên trang chỉ còn con trỏ 18 B.", en: "Row 2 holds 6400 near-random md5 characters that do not compress, so Postgres cuts it into 4 chunks in the TOAST table and the page keeps only an 18 B pointer." }
    set:
      val: { label: { vi: "id 2: 6400 ký tự", en: "id 2: 6400 chars" }, sub: { vi: "gần như ngẫu nhiên", en: "md5, near random" } }
      cmp: { label: { vi: "nén: không giảm", en: "barely shrinks" }, tone: warm }
      res: { label: { vi: "ra bảng TOAST", en: "moves to TOAST" }, tone: warm }
      page: { cells: [["1", { vi: "tại chỗ", en: "inline" }, "101 B"], ["2", { vi: "con trỏ", en: "pointer" }, "18 B"], ["3", { vi: "nén pglz", en: "pglz" }, "1156 B"]], cellTone: { "1:1": warm } }
variants:
  out:
    step: 2
    title: { vi: "TOAST: giá trị dài ra bảng riêng", en: "TOAST: a long value moves to its own table" }
    caption:
      vi: "Postgres tự làm một kiểu tách dọc: giá trị dài không nén được ra bảng TOAST, trang chỉ giữ con trỏ 18 B; giá trị nén vừa thì ở lại."
      en: "Postgres does a kind of vertical split by itself: a long value that does not compress moves to the TOAST table and the page keeps an 18 B pointer; a value that compresses enough stays."
    alt:
      vi: "Postgres tự tách dọc giá trị dài: giá trị không nén được ra bảng TOAST và trang chỉ giữ con trỏ 18 B, còn giá trị nén đủ nhỏ thì ở lại. Nhờ vậy dòng trên trang heap luôn hẹp, dù cột có chứa văn bản dài."
      en: "Postgres splits long values off by itself: a value that does not compress moves to the TOAST table and the page keeps an 18 B pointer, while one that compresses enough stays. So rows on the heap page stay narrow even when a column holds long text."
