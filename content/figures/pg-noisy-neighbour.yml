# B5-13 (v46 Batch 5, L845; plan v42 Appendix B candidate `pg-noisy-neighbour`): count real work, not queries, to find the noisy
# tenant. Lesson: e-pg-l5-22 (Ý chính). Data: the lab's usage_log for October (31 days × 4 sellers), PGlite
# (tools/v46-b5/check1.log): sum(queries) 6975 · 7285 · 7595 · 7905; sum(rows_read) 697500 · 28365000 · 759500 · 790500 for
# sellers 1–4. Bars are in thousands of queries and in millions of rows read (one decimal), the notes carry the real sums;
# seller 2 reads about 37 times seller 1 with about the same number of queries. Sources:
# https://www.postgresql.org/docs/18/monitoring-stats.html, https://www.postgresql.org/docs/18/runtime-config-client.html
title: { vi: "Hàng xóm ồn ào: đếm việc, đừng đếm câu", en: "A noisy neighbour: count work, not queries" }
caption:
  vi: "Bảng usage_log của lab, cộng cả tháng 10 cho bốn người bán chung bảng."
  en: "The lab's usage_log, summed over October for the four sellers sharing the tables."
alt:
  vi: "Đếm số câu thì bốn người bán gần như ngang nhau, nhưng đếm số dòng đọc thì người bán 2 nặng gấp khoảng 37 lần. Vì vậy hãy đo tải theo việc làm thật, rồi mới đặt hạn mức cho đúng người."
  en: "Counted by queries the four sellers are almost equal, but counted by rows read seller 2 is about 37 times heavier. So measure load by real work before you put a limit on the right tenant."
nodes:
  - id: q
    shape: bars
    label: { vi: "số câu, tháng 10", en: "queries, October" }
    sub: { vi: "câu gửi tới", en: "queries sent" }
    head: [{ vi: "người bán", en: seller }, { vi: "số câu", en: queries }]
    items:
      - { label: "1", value: 7.0, note: "6975" }
      - { label: "2", value: 7.3, note: "7285", tone: warm }
      - { label: "3", value: 7.6, note: "7595" }
      - { label: "4", value: 7.9, note: "7905" }
  - id: r
    shape: bars
    label: { vi: "số dòng đọc, tháng 10", en: "rows read, October" }
    sub: { vi: "dòng đọc", en: "rows read" }
    head: [{ vi: "người bán", en: seller }, { vi: "dòng đọc", en: rows read }]
    items:
      - { label: "1", value: 0.35, note: "697500" }
      - { label: "2", value: 14.2, note: "28365000", tone: dead }
      - { label: "3", value: 0.38, note: "759500" }
      - { label: "4", value: 0.4, note: "790500" }
rows:
  - [q, r]
steps:
  - say: { vi: "Đếm số câu: bốn người bán gần như ngang nhau.", en: "Counting queries: the four sellers look alike." }
    alt: { vi: "Cả tháng mỗi người bán gửi từ 6975 tới 7905 câu, nên nhìn số câu thì không ai nổi bật.", en: "Over the month each seller sends between 6975 and 7905 queries, so by query count nobody stands out." }
    set:
      r:
        items:
          - { label: "1", value: 0, note: "?", tone: ghost }
          - { label: "2", value: 0, note: "?", tone: ghost }
          - { label: "3", value: 0, note: "?", tone: ghost }
          - { label: "4", value: 0, note: "?", tone: ghost }
  - say: { vi: "Đếm dòng đọc: người bán 2 gấp khoảng 37 lần.", en: "Counting rows read: seller 2 is about 37 times more." }
    alt: { vi: "Người bán 2 đọc 28365000 dòng trong khi những người khác đọc dưới 800000, nên chính họ là hàng xóm ồn ào dù số câu không hơn ai.", en: "Seller 2 reads 28365000 rows while the others read under 800000, so they are the noisy neighbour although they send no more queries than anyone." }
