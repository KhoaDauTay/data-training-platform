# DS-4 (tools/v39/diagram-plan.md): three mapping rules, one per step. Lessons: e-ds-l2-03 (Ý chính), e-ds-l2-02 (Ví dụ, variant `weak` = step 3).
# v42 (L695): the ER side is drawn (two entities and their relationship, crow's-foot ends patched per step through the edge id `rel`),
# never written as text. The entities show only their own attributes: the column the rule adds appears in the table below.
# Data: 1:N = the Example ex_dept / ex_emp (dept_id NOT NULL REFERENCES ex_dept; Lan 1, Minh 1, Nga 2) of e-ds-l2-03;
# M:N = the lab's order_items (order_id, product_id, qty, PRIMARY KEY (order_id, product_id)) of e-ds-l2-03; the lab table starts
# empty, so its three rows are an illustration (v40 R2 E-04: the two key columns tinted, as in the other steps);
# weak entity = the Example ex_invoice_line (invoice_id REFERENCES ex_invoice ON DELETE CASCADE, line_no, amount; (1,1,100), (1,2,40),
# (2,1,75)) of e-ds-l2-02. Source: https://www.postgresql.org/docs/current/ddl-constraints.html#DDL-CONSTRAINTS-FK
title: { vi: "Từ sơ đồ ER sang bảng: ba luật", en: "From an ER diagram to tables: three rules" }
caption:
  vi: "Mỗi dạng quan hệ ER có một dạng bảng chuẩn; cột tô màu là cột luật đó thêm vào."
  en: "Each ER shape has one standard table shape; the highlighted columns are the ones the rule adds."
alt:
  vi: "Mỗi dạng quan hệ trên sơ đồ ER có một cách lên bảng; mỗi bước là một luật."
  en: "Each kind of ER relationship has one way to become tables; each step is one rule."
groups:
  - { id: er, label: { vi: "sơ đồ ER", en: "ER diagram" }, nodes: [ea, eb] }
nodes:
  - { id: rule, label: { vi: "1:N → FK bên N", en: "1:N → FK on N side" }, tone: new }
  - { id: ea, shape: entity, label: ex_dept, fields: [{ name: id, pk: true }, name] }
  - { id: eb, shape: entity, label: ex_emp, fields: [{ name: id, pk: true }, name] }
  - id: tbl
    shape: grid
    label: ex_emp
    head: [id, name, dept_id]
    cells: [["1", Lan, "1"], ["2", Minh, "1"], ["3", Nga, "2"]]
    colTone: [null, null, new]
    sub: "dept_id → ex_dept.id"
  - { id: chip, shape: key, label: { vi: "NOT NULL = bắt buộc", en: "NOT NULL = total" } }
rows:
  - [rule]
  - [ea, eb]
  - [tbl, chip]
edges:
  - { id: rel, from: ea, to: eb, link: true, ends: [one, one-many], label: { vi: "có", en: "has" } }
  - { from: er, to: tbl }
steps:
  - say: { vi: "1:N: khóa ngoại đặt ở bảng bên N.", en: "1:N: the foreign key goes in the table on the N side." }
    alt: { vi: "Mỗi phòng có 1..n nhân viên, nên bảng ex_emp, phía nhiều, nhận cột khóa ngoại dept_id; NOT NULL vì nhân viên nào cũng phải có phòng.", en: "Each department has 1..n employees, so the table on the many side, ex_emp, gets the foreign key column dept_id; NOT NULL because every employee must have a department." }
  - say: { vi: "M:N: thêm một bảng nối, khóa là cặp hai khóa.", en: "M:N: add a junction table keyed by the pair of keys." }
    alt: { vi: "Đơn và sản phẩm gặp nhau 0..n lần mỗi phía, nên không bên nào giữ được khóa ngoại: một bảng nối order_items mới lấy cặp (order_id, product_id) làm khóa và giữ qty của chính quan hệ.", en: "Orders and products meet 0..n times on each side, so neither can hold the foreign key: a new junction table order_items is keyed by the pair (order_id, product_id) and holds the relationship's own qty." }
    set:
      rule: { label: { vi: "M:N → bảng nối", en: "M:N → junction table" } }
      ea: { label: orders, fields: [{ name: id, pk: true }, { name: customer_id, fk: true }] }
      eb: { label: products, fields: [{ name: id, pk: true }, name] }
      rel: { ends: [zero-many, zero-many], label: { vi: "chứa", en: "contains" } }
      tbl: { label: order_items, head: [order_id, product_id, qty], cells: [["1", "10", "2"], ["1", "11", "1"], ["2", "10", "5"]], colTone: [new, new, null], sub: "PK (order_id, product_id)" }
      chip: { label: { vi: "qty: thuộc tính của quan hệ", en: "qty: the link's own data" } }
  - say: { vi: "Thực thể yếu: khóa ghép với khóa của cha, xóa theo cha.", en: "Weak entity: a composite key with the parent's key, deleted with the parent." }
    alt: { vi: "Dòng hóa đơn chỉ có số dòng, không đủ làm khóa, nên khóa của nó ghép khóa hóa đơn với số dòng, và ON DELETE CASCADE xóa nó theo hóa đơn.", en: "An invoice line has only its line number, not enough for a key, so its key combines the invoice's key with the line number, and ON DELETE CASCADE deletes it with its invoice." }
    set:
      rule: { label: { vi: "thực thể yếu → khóa ghép", en: "weak entity → composite key" } }
      ea: { label: ex_invoice, fields: [{ name: id, pk: true }, issued_on] }
      eb: { label: ex_invoice_line, fields: [line_no, amount] }
      rel: { ends: [one, one-many], label: { vi: "gồm", en: "has" } }
      tbl: { label: ex_invoice_line, head: [invoice_id, line_no, amount], cells: [["1", "1", "100"], ["1", "2", "40"], ["2", "1", "75"]], colTone: [new, new, null], sub: "PK (invoice_id, line_no)" }
      chip: { label: ON DELETE CASCADE }
variants:
  weak:
    step: 2
    title: { vi: "Thực thể yếu thành khóa ghép", en: "A weak entity becomes a composite key" }
    caption:
      vi: "Dòng hóa đơn không có khóa riêng: khóa của nó là khóa hóa đơn cộng số dòng, và nó bị xóa theo hóa đơn."
      en: "An invoice line has no key of its own: its key is the invoice's key plus a line number, and it is deleted with the invoice."
    alt:
      vi: "Mỗi hóa đơn gồm 1..n dòng, mỗi dòng thuộc đúng một hóa đơn. Dòng hóa đơn không có khóa riêng nên khóa của nó ghép khóa hóa đơn với số dòng, và nó bị xóa theo hóa đơn."
      en: "Each invoice has 1..n lines, and each line belongs to exactly one invoice. A line has no key of its own, so its key combines the invoice's key with the line number, and it is deleted with its invoice."
