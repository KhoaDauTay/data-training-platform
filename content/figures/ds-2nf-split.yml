# DS-8 (tools/v39/diagram-plan.md): a lossless split. Lessons: e-ds-l4-02 (Ví dụ), e-ds-l4-06 (Thực hành).
# Data: the Example ex_enrol (student_id, course_id, course_title; PK (student_id, course_id)): (1, 10, SQL), (2, 10, SQL), (3, 10, SQL),
# (1, 20, Stats); ex_course AS SELECT DISTINCT course_id, course_title (10 SQL, 20 Stats) + PRIMARY KEY (course_id); the join back on
# course_id gives the 4 rows again. v40 R2 (E-01): the two arrow kinds differ: solid arrows from the old table into the frame
# "tách thành 2 bảng" (the one to ex_course is 
ear: on a phone, where the tables stack, it is left to the text alternative), and
# a dashed arrow labelled "khóa ngoại" for the foreign key. Source: https://www.postgresql.org/docs/current/sql-createtableas.html
title: { vi: "Tách bảng không mất gì", en: "A split that loses nothing" }
caption:
  vi: "Chuyển cột phụ thuộc sang một bảng có khóa là cột quyết định nó: sự thật lưu một lần, nối lại vẫn đủ dòng."
  en: "Move the dependent column into a table keyed by the column that determines it: the fact is stored once, and joining back gives every row."
alt:
  vi: "course_title chỉ phụ thuộc vào course_id, một phần của khóa (student_id, course_id), nên tên khóa học bị lặp ở mỗi lượt đăng ký. Chuyển nó sang ex_course có khóa course_id thì mỗi tên chỉ lưu một lần, và nối hai bảng lại vẫn ra đúng 4 dòng ban đầu."
  en: "course_title depends only on course_id, part of the key (student_id, course_id), so the course name repeats on every enrolment. Moving it to ex_course, keyed by course_id, stores each name once, and joining the two tables back still gives exactly the 4 original rows."
nodes:
  - { id: dep, shape: key, mono: true, label: "course_id → course_title", tone: warm }
  - { id: part, shape: note, label: { vi: "phụ thuộc một phần khóa", en: "depends on part of the key" } }
  - id: wide
    shape: grid
    label: { vi: "ex_enrol (trước)", en: "ex_enrol (before)" }
    head: [student_id, course_id, course_title]
    cells: [["1", "10", SQL], ["2", "10", SQL], ["3", "10", SQL], ["1", "20", Stats]]
    cellTone: { "0:2": warm, "1:2": warm, "2:2": warm }
    sub: { vi: "SQL lặp 3 lần", en: "SQL repeated 3 times" }
  - { id: enrol, shape: grid, label: { vi: "ex_enrol (sau)", en: "ex_enrol (after)" }, head: [student_id, course_id], cells: [["1", "10"], ["2", "10"], ["3", "10"], ["1", "20"]], colTone: [null, ptr], sub: "PK (student_id, course_id)" }
  - { id: course, shape: grid, label: ex_course, head: [course_id, course_title], cells: [["10", SQL], ["20", Stats]], colTone: [ptr, live], sub: "PK (course_id)" }
  - { id: back, shape: key, label: { vi: "nối lại: đúng 4 dòng", en: "join back: exactly 4 rows" }, tone: live }
groups:
  - { id: after, label: { vi: "tách thành 2 bảng", en: "split: 2 tables" }, nodes: [enrol, course] }
rows:
  - [dep, part]
  - [wide]
  - [enrol, course]
  - [back]
edges:
  - { from: wide, to: enrol }
  - { from: wide, to: course, near: true }
  - { from: enrol, to: course, dash: true, label: { vi: "khóa ngoại", en: "foreign key" } }
