# RD-6 (v47 R1, L958): a sorted set read as a leaderboard. Lesson: e-rd-l1-06 (Ý chính).
# Data = the lab after step 2: sales:2026-10 store:2 340, store:3 310, store:1 120, store:4 105 (90 + ZINCRBY 15).
# ZRANGE … REV ranks from the top; ZREVRANK store:1 = 2.
title: { vi: "Bảng doanh số tháng 10", en: "October's sales board" }
