# B5-2 (v46 Batch 5, L840): every write passes the table's constraints in order, and CHECK lets NULL through. Lesson: e-pg-l1-04
# (Ý chính). Data: the lesson's own Common-mistakes table stock (id int PRIMARY KEY, qty int CHECK (qty >= 0)), PGlite
# (tools/v46-b5/check1.log): (1, -3) → 23514 stock_qty_check; (2, NULL) is accepted; after DELETE … IS NULL and SET NOT NULL,
# (3, NULL) → 23502; a repeated id → 23505 stock_pkey. Order of the doors = the executor's: NOT NULL, then CHECK, then the unique
# index of the primary key. Sources: https://www.postgresql.org/docs/18/ddl-constraints.html,
# https://www.postgresql.org/docs/18/errcodes-appendix.html
title: { vi: "Mỗi dòng ghi vào phải qua mọi ràng buộc", en: "Every row written passes every constraint" }
caption:
  vi: "Bảng stock của mục Lỗi hay gặp: id là khóa chính, qty có CHECK (qty >= 0). Một cửa từ chối là cả lệnh lỗi với mã SQLSTATE của cửa đó."
  en: "The stock table from Common mistakes: id is the primary key, qty has CHECK (qty >= 0). One door saying no fails the whole statement with that door's SQLSTATE."
alt:
  vi: "Ràng buộc là các cửa mà database tự kiểm ở mỗi lần ghi, nên dữ liệu sai không vào được dù ứng dụng nào ghi. CHECK chỉ chặn khi điều kiện là false, nên NULL lọt qua; muốn cấm NULL phải thêm NOT NULL."
  en: "Constraints are doors the database checks on every write, so bad data cannot get in whichever application writes it. CHECK only blocks when the condition is false, so NULL slips through; to forbid NULL you must add NOT NULL."
nodes:
  - { id: r, shape: key, label: { vi: "dòng mới", en: "new row" }, sub: "(1, -3)", tone: new }
  - { id: nn, label: NOT NULL qty, sub: { vi: "chưa có", en: "not there yet" }, tone: ghost }
  - { id: ck, label: CHECK qty >= 0, sub: { vi: "-3 >= 0: false", en: "-3 >= 0: false" }, tone: dead }
  - { id: pk, label: PRIMARY KEY id, sub: { vi: "id không trùng", en: "id not taken" } }
  - { id: t, shape: table, label: stock, sub: { vi: "từ chối: 23514", en: "refused: 23514" }, tone: dead }
rows:
  - [r, nn, ck, pk]
  - [t]
phone:
  rows: [[r], [nn], [ck], [pk], [t]]
edges:
  - { from: r, to: nn }
  - { from: nn, to: ck }
  - { from: ck, to: pk }
  - { from: pk, to: t }
steps:
  - say: { vi: "(1, -3): CHECK ra false, lệnh bị từ chối.", en: "(1, -3): CHECK is false, the statement is refused." }
    alt: { vi: "Với qty là -3, điều kiện qty >= 0 là false nên CHECK từ chối và lệnh lỗi với mã 23514, không dòng nào được ghi.", en: "With qty -3 the condition qty >= 0 is false, so CHECK refuses and the statement fails with code 23514, writing no row." }
  - say: { vi: "(2, NULL): CHECK ra NULL, dòng vẫn vào.", en: "(2, NULL): CHECK gives NULL, the row gets in." }
    alt: { vi: "Với qty là NULL, NULL >= 0 cho NULL chứ không phải false, nên CHECK không chặn và dòng (2, NULL) vào bảng.", en: "With qty NULL, NULL >= 0 gives NULL, not false, so CHECK does not block and the row (2, NULL) enters the table." }
    set:
      r: { sub: "(2, NULL)" }
      ck: { sub: "NULL >= 0: NULL", tone: warm }
      pk: { tone: live }
      t: { sub: { vi: "đã nhận (2, NULL)", en: "took (2, NULL)" }, tone: warm }
  - say: { vi: "Thêm NOT NULL: NULL bị chặn ở cửa đầu.", en: "Add NOT NULL: NULL is stopped at the first door." }
    alt: { vi: "Sau khi xóa dòng NULL và thêm NOT NULL cho qty, dòng (3, NULL) bị chặn ngay cửa đầu với mã 23502.", en: "After deleting the NULL row and adding NOT NULL to qty, the row (3, NULL) is stopped at the first door with code 23502." }
    set:
      r: { sub: "(3, NULL)" }
      nn: { sub: { vi: "NULL: từ chối", en: "NULL: refused" }, tone: dead }
      ck: { sub: { vi: "không tới đây", en: "never reached" }, tone: ghost }
      pk: { sub: { vi: "không tới đây", en: "never reached" }, tone: ghost }
      t: { sub: { vi: "từ chối: 23502", en: "refused: 23502" }, tone: dead }
