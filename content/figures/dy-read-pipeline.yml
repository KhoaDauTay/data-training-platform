# DY-2 (tools/v39/diagram-plan.md): key condition, then filter, then projection. Lessons: e-dy-l2-02 (Ý chính), e-dy-l2-13 (Ý chính).
# Data (lab.setup of e-dy-l2-02, run on dynoxide): Query customerId = C-01, FilterExpression status = DELIVERED,
# ProjectionExpression total → ScannedCount 4, Count 3 (O-101, O-102, O-104; totals 770000, 770000, 120000).
# R3 (E7): the three steps are boxes with their counts in words (the old equal-width bars read as empty fields and hid 4 vs 3),
# joined in order; the money note sits on the read step.
# Sources: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Query.Pagination.html, …/read-write-operations.html
title: { vi: "Ba bước của một Query", en: "The three steps of a Query" }
caption:
  vi: "Chỉ điều kiện khóa làm giảm số item đọc, tức giảm tiền. Bộ lọc bỏ item sau khi đã đọc, projection chỉ cắt thuộc tính trả về. Limit đếm item ở bước đọc, trước bộ lọc."
  en: "Only the key condition lowers the items read, and so the cost. The filter drops items after they were read, the projection only trims the attributes returned. Limit counts items at the read step, before the filter."
alt:
  vi: "Một Query đi qua ba bước theo thứ tự: điều kiện khóa chọn item để đọc, bộ lọc bỏ item sau khi đã đọc, projection chỉ cắt bớt thuộc tính trả về. Chỉ bước đầu làm giảm tiền, nên item bị lọc vẫn tính phí: ScannedCount 4, Count 3."
  en: "A Query goes through three steps in order: the key condition picks the items to read, the filter drops items after they were read, the projection only trims the attributes returned. Only the first step lowers the cost, so filtered items are still billed: ScannedCount 4, Count 3."
nodes:
