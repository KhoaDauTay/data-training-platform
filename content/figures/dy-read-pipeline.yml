  - { id: kc, label: KeyCondition, sub: { vi: "đọc 4 · tính tiền", en: "reads 4 · billed" }, tone: warm }
  - { id: fl, label: Filter, sub: { vi: "còn 3, bỏ 1 đã đọc", en: "3 left, 1 dropped" } }
  - { id: pj, label: Projection, sub: { vi: "3 item, chỉ total", en: "3, total only" } }
  - { id: g, label: ScannedCount 4, sub: Count 3, tone: live }
  - { id: lim, shape: key, label: { vi: "Limit đếm ở bước 1", en: "Limit counts at step 1" } }
rows:
