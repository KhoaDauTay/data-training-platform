# DY-5 (tools/v39/diagram-plan.md): write only if, checked atomically. Lesson: e-dy-l2-04 (Ý chính).
# Data (lab.setup, run on dynoxide): Books 978-0-02 "Keys and Values", stock 3; UpdateItem SET stock = stock - :q with
# ConditionExpression stock >= :q, :q = 2 → stock 1, 1 WCU. The two desks are an illustration of the lesson's "stay within a
# limit" pattern on its own item; the second call fails its condition (1 >= 2 is false) and still uses WCU (lesson text, AWS).
# R3 (E8): each result sits on its own desk's path (desk → result → item); step 3 is desk B's write done as a PutItem with no
# condition, from the stock 3 it read before A wrote: it lands on the item and overwrites A's change (4 copies sold, stock 1).
# The exception name is in the caption and the alt (too long for 2 × 18).
# Sources: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/read-write-operations.html, …/Expressions.ConditionExpressions.html
title: { vi: "Ghi nếu điều kiện đúng, kiểm và ghi một bước", en: "Write only if, checked and written in one step" }
caption:
  vi: "Hai quầy cùng lấy 2 cuốn bằng SET stock = stock - :q với ConditionExpression stock >= :q. DynamoDB kiểm và ghi trong một bước nguyên tử, nên không bán lố; lần bị từ chối nhận ConditionalCheckFailedException và vẫn tốn WCU. PutItem không điều kiện thì ghi đè lặng lẽ."
  en: "Two desks each take 2 copies with SET stock = stock - :q and ConditionExpression stock >= :q. DynamoDB checks and writes in one atomic step, so nothing is oversold; the refused call gets ConditionalCheckFailedException and still uses WCU. A PutItem with no condition overwrites silently."
alt:
  vi: "Hai quầy cùng muốn lấy 2 cuốn sách 978-0-02, đang còn 3 cuốn, bằng một lần ghi có điều kiện stock ≥ 2. Mỗi quầy trỏ tới kết quả lần ghi của mình rồi tới item; cách khác là PutItem không điều kiện, ghi thẳng vào item."
  en: "Two desks each want to take 2 copies of book 978-0-02, which has 3, with a write conditioned on stock ≥ 2. Each desk points to the result of its write, then to the item; the other way is a PutItem with no condition, written straight onto the item."
nodes:
  - { id: a, label: { vi: "Quầy A: lấy 2", en: "Desk A: takes 2" }, sub: { vi: "nếu stock ≥ 2", en: "if stock ≥ 2" }, tone: new }
  - { id: b, label: { vi: "Quầy B: lấy 2", en: "Desk B: takes 2" }, sub: { vi: "nếu stock ≥ 2", en: "if stock ≥ 2" }, tone: ghost }
  - { id: ok, label: { vi: "3 ≥ 2: ghi", en: "3 ≥ 2: written" }, sub: "stock 3 → 1", tone: live }
  - { id: no, label: { vi: "1 ≥ 2: từ chối", en: "1 ≥ 2: refused" }, sub: { vi: "vẫn tốn WCU", en: "still uses WCU" }, tone: dead }
  - { id: item, mono: true, label: 978-0-02, sub: "stock 3 → 1", tone: new }
  - { id: put, label: { vi: "Quầy B: PutItem", en: "Desk B: PutItem" }, sub: { vi: "không điều kiện", en: "no condition" }, tone: warm }
rows:
  - [a, b]
  - [ok, no]
  - [item]
  - [put]
edges:
  - { from: a, to: ok }
  - { from: b, to: no }
  - { from: ok, to: item }
  - { from: no, to: item, dash: true }
  - { from: put, to: item, label: { vi: "ghi đè 3 → 1", en: "overwrites 3 → 1" } }
steps:
  - say: { vi: "Kiểm tra và ghi trong cùng một bước nguyên tử.", en: "Check and write in one atomic step." }
    alt: { vi: "Quầy A gửi lệnh trước. Stock đang là 3, điều kiện 3 ≥ 2 đúng, nên stock thành 1.", en: "Desk A sends first. Stock is 3, the condition 3 ≥ 2 holds, so stock becomes 1." }
    show: [a, ok, item]
  - say: { vi: "Điều kiện sai: lỗi, item giữ nguyên, không bán lố.", en: "Condition false: an error, item unchanged, no overselling." }
    show: [a, b, ok, no, item]
    alt: { vi: "Quầy B gửi cùng lệnh. Stock giờ là 1, điều kiện 1 ≥ 2 sai: DynamoDB từ chối với ConditionalCheckFailedException, nét đứt tới item nghĩa là không ghi gì, item giữ stock 1, và lần ghi bị từ chối vẫn tốn WCU.", en: "Desk B sends the same command. Stock is now 1, the condition 1 ≥ 2 is false: DynamoDB refuses with ConditionalCheckFailedException, the dashed line to the item means nothing is written, the item keeps stock 1, and the refused write still uses WCU." }
    set:
      a: { tone: ghost }
      ok: { tone: ghost }
      b: { tone: new }
      item: { sub: { vi: "stock 1, không đổi", en: "stock 1, unchanged" }, tone: plain }
  - say: { vi: "Không có điều kiện, lần ghi sau đè lần trước.", en: "Without a condition, the later write overwrites the earlier one." }
    alt: { vi: "Cách khác: quầy B đã đọc stock 3 trước khi A ghi, rồi dùng PutItem không điều kiện ghi cả item với stock 1. Lần ghi đè lên thay đổi của A mà không kiểm gì, không báo gì: đã bán 4 cuốn mà stock vẫn ghi 1.", en: "The other way: desk B read stock 3 before A wrote, then a PutItem with no condition writes the whole item with stock 1. It overwrites A's change, checks nothing and says nothing: 4 copies are sold and stock still says 1." }
    show: [a, ok, item, put]
    set:
      a: { tone: ghost }
      ok: { tone: ghost }
      item: { sub: { vi: "bán 4, còn 1", en: "4 sold, stock 1" }, tone: warm }