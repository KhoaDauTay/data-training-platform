# v48 Graph R2 (L1180–L1189): PageRank after 1 round vs after 20. Lesson: e-gr-l3-03 (Ý chính). Data: the lab's 7 legs, damping
# 0.85, start 0.2 (PGlite 0.5.16, PostgreSQL 18.6): round 1 = step 2 (SGSIN 0.370, HKHKG 0.285, VNDAD 0.200, KRPUS 0.115,
# VNSGN 0.030); round 20 = step 3 (HKHKG 0.341, SGSIN 0.276, VNDAD 0.179, KRPUS 0.175, VNSGN 0.030). Bar values are score × 30.
# Sources: https://neo4j.com/docs/graph-data-science/current/algorithms/page-rank/, https://www.postgresql.org/docs/18/queries-with.html
title: { vi: "Vòng 1 và vòng 20", en: "Round 1 and round 20" }
caption:
  vi: "Sau vòng 1, SGSIN dẫn đầu vì có nhiều cạnh vào nhất. SGSIN chuyển hết điểm cho HKHKG, nên sau 20 vòng HKHKG đứng đầu."
  en: "After round 1, SGSIN leads because it has the most incoming edges. SGSIN passes all of its score to HKHKG, so after 20 rounds HKHKG is on top."
alt:
  vi: "PageRank dồn điểm theo cả mạng chứ không chỉ đếm cạnh vào, nên thứ hạng sau một vòng có thể đổi khi lặp đủ vòng. Kết quả: sau vòng 1 SGSIN 0,370 dẫn đầu; sau vòng 20 HKHKG 0,341, SGSIN 0,276."
  en: "PageRank pours scores along the whole network instead of just counting incoming edges, so the ranking after one round can change once enough rounds run. Result: after round 1 SGSIN leads with 0.370; after round 20 HKHKG has 0.341 and SGSIN 0.276."
