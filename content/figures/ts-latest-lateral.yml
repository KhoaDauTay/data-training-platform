  - { id: e20, mono: true, label: "20 · 00:59", sub: { vi: "mục cuối", en: "last entry" }, tone: live }
  - { id: out, label: { vi: "20 dòng", en: "20 rows" }, sub: { vi: "20 lần đọc", en: "20 reads" }, tone: new }
