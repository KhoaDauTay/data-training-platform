# DS-3 (tools/v39/diagram-plan.md), v42 ER mode (L690–L694): the shop model of e-ds-l2-01 (Ví dụ) drawn as entities with their
# attribute rows; each relationship line leaves the key row and lands on the row that holds the foreign key, with a crow's-foot
# mark at each end next to the entity it counts. EMPLOYEE manages EMPLOYEE is a loop on its own box (id → manager_id).
# Legend row: the four marks with a minimum. Notation: crow's foot (Mermaid erDiagram's marks, drawn).
title: { vi: "Đọc chân chim: mỗi đầu đếm một bên", en: "Reading crow's foot: each end counts one side" }
caption:
  vi: "Dấu ở mỗi đầu đường nói phía thực thể bên cạnh nó có bao nhiêu dòng: dấu sát thực thể là tối đa (vạch: 1, chân chim: nhiều), dấu xa hơn là tối thiểu (vạch: 1, vòng: 0)."
  en: "The mark at each end says how many rows of the entity beside it take part: the mark touching the entity is the maximum (bar: 1, foot: many), the one further out the minimum (bar: 1, circle: 0)."
alt:
  vi: "Mỗi khách đặt 0..n đơn và mỗi đơn thuộc đúng một khách; mỗi đơn gồm 1..n dòng. Mỗi nhân viên có 0..1 người quản lý, một người quản lý 0..n nhân viên."
  en: "Each customer places 0..n orders and each order belongs to exactly one customer; each order contains 1..n lines. Each employee has 0..1 manager, and a manager manages 0..n employees."
nodes:
  - { id: c, shape: entity, label: CUSTOMER, fields: [{ name: id, pk: true }, name] }
  - { id: o, shape: entity, label: ORDER, fields: [{ name: id, pk: true }, { name: customer_id, fk: true }, ordered_at] }
  - { id: l, shape: entity, label: ORDER_LINE, fields: [{ name: order_id, pk: true, fk: true }, { name: line_no, pk: true }, qty] }
  - { id: e, shape: entity, label: EMPLOYEE, fields: [{ name: id, pk: true }, name, { name: manager_id, fk: true }] }
  - { id: k1, shape: key, card: one, label: { vi: "đúng 1", en: "exactly 1" } }
  - { id: k2, shape: key, card: zero-one, label: { vi: "0 hoặc 1", en: "zero or one" } }
  - { id: k3, shape: key, card: one-many, label: { vi: "1 hoặc nhiều", en: "one or more" } }
  - { id: k4, shape: key, card: zero-many, label: { vi: "0 hoặc nhiều", en: "zero or more" } }
rows:
  - [c, o, l]
  - [e]
  - [k1, k2, k3, k4]
edges:
  - { from: "c#0", to: "o#1", link: true, ends: [one, zero-many], label: { vi: "đặt", en: "places" } }
  - { from: "o#0", to: "l#0", link: true, ends: [one, one-many], label: { vi: "gồm", en: "contains" } }
  - { from: "e#0", to: "e#2", link: true, ends: [zero-one, zero-many], label: { vi: "quản lý", en: "manages" } }
