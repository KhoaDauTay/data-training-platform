# DS-3 (tools/v39/diagram-plan.md): reading crow's foot. Lesson: e-ds-l2-01 (Ví dụ), the lesson's own lines:
# CUSTOMER ||--o{ ORDER : places / ORDER ||--|{ ORDER_LINE : contains / EMPLOYEE |o--o{ EMPLOYEE : manages
# Each end mark sits next to the entity it counts. The self-relationship is drawn as EMPLOYEE twice, one per role (as GA-10 does),
# since the grammar has no self-loop; the legend is folded into the marks' own words. Notation: Mermaid erDiagram (not fetched).
title: { vi: "Đọc chân chim: mỗi đầu đếm một bên", en: "Reading crow's foot: each end counts one side" }
caption:
  vi: "Ký hiệu ở mỗi đầu đường nói phía thực thể bên cạnh nó có bao nhiêu dòng: dấu trong (o hay |) là tối thiểu, dấu ngoài là tối đa."
  en: "The mark at each end says how many rows of the entity beside it take part: the inner mark (o or |) is the minimum, the outer one the maximum."
alt:
  vi: "Ba quan hệ. CUSTOMER đặt ORDER: đầu phía CUSTOMER là ||, đúng 1 khách; đầu phía ORDER là o{, 0 hoặc nhiều đơn. ORDER gồm ORDER_LINE: đầu phía ORDER là ||, đúng 1; đầu phía ORDER_LINE là |{, 1 hoặc nhiều dòng. EMPLOYEE quản lý EMPLOYEE, cùng một bảng đóng hai vai: đầu phía người quản lý là |o, 0 hoặc 1; đầu phía nhân viên là o{, 0 hoặc nhiều."
  en: "Three relationships. CUSTOMER places ORDER: the CUSTOMER end is ||, exactly 1 customer; the ORDER end is o{, zero or more orders. ORDER contains ORDER_LINE: the ORDER end is ||, exactly 1; the ORDER_LINE end is |{, one or more lines. EMPLOYEE manages EMPLOYEE, one table in two roles: the manager end is |o, zero or one; the employee end is o{, zero or more."
