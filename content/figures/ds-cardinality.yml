# DS-3 (tools/v39/diagram-plan.md): reading crow's foot. Lesson: e-ds-l2-01 (Ví dụ), the lesson's own lines:
# CUSTOMER ||--o{ ORDER : places / ORDER ||--|{ ORDER_LINE : contains / EMPLOYEE |o--o{ EMPLOYEE : manages
# Each end mark sits next to the entity it counts. The self-relationship is drawn as EMPLOYEE twice, one per role (as GA-10 does),
# since the grammar has no self-loop. v40 R2 (E-03): the marks are drawn at the line ends (edge ends:), with a legend row of the four marks;
# no tint. Notation: Mermaid erDiagram / crow's foot (not fetched).
title: { vi: "Đọc chân chim: mỗi đầu đếm một bên", en: "Reading crow's foot: each end counts one side" }
caption:
  vi: "Dấu ở mỗi đầu đường nói phía thực thể bên cạnh nó có bao nhiêu dòng: dấu sát thực thể là tối đa (vạch: 1, chân chim: nhiều), dấu xa hơn là tối thiểu (vạch: 1, vòng: 0)."
  en: "The mark at each end says how many rows of the entity beside it take part: the mark touching the entity is the maximum (bar: 1, foot: many), the one further out the minimum (bar: 1, circle: 0)."
alt:
  vi: "Ba quan hệ, mỗi đầu đường có một dấu chân chim. CUSTOMER đặt ORDER: đầu phía CUSTOMER là hai vạch, đúng 1 khách; đầu phía ORDER là vòng và chân chim, 0 hoặc nhiều đơn. ORDER gồm ORDER_LINE: đầu phía ORDER là hai vạch, đúng 1; đầu phía ORDER_LINE là vạch và chân chim, 1 hoặc nhiều dòng. EMPLOYEE quản lý EMPLOYEE, cùng một bảng đóng hai vai: đầu phía người quản lý là vạch và vòng, 0 hoặc 1; đầu phía nhân viên là vòng và chân chim, 0 hoặc nhiều. Chú giải bên dưới vẽ bốn dấu: đúng 1, 0 hoặc 1, 1 hoặc nhiều, 0 hoặc nhiều."
  en: "Three relationships, a crow's-foot mark at each line end. CUSTOMER places ORDER: the CUSTOMER end has two bars, exactly 1 customer; the ORDER end a circle and a foot, zero or more orders. ORDER contains ORDER_LINE: the ORDER end has two bars, exactly 1; the ORDER_LINE end a bar and a foot, one or more lines. EMPLOYEE manages EMPLOYEE, one table in two roles: the manager end has a bar and a circle, zero or one; the employee end a circle and a foot, zero or more. The legend below draws the four marks: exactly 1, zero or one, one or more, zero or more."
