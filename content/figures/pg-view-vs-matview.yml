# PG-3 (tools/v39/diagram-plan.md): a stored query vs stored rows. Lesson: e-pg-l1-08 (Ý chính).
# Data (PGlite, lesson setup): orders 2000 rows, 1800 paid (id % 10 <> 0); the lesson's Example materialized view paid_count
# = 1800 (1801 after one INSERT, frozen until REFRESH). The view side is the Example big_orders (amount >= 900).
# Deviation: the plan's two columns are two groups (stacked rows read on a phone); "có thể có index" is the grid's sub.
# Sources: https://www.postgresql.org/docs/current/rules-materializedviews.html, https://www.postgresql.org/docs/current/sql-refreshmaterializedview.html
title: { vi: "View lưu câu lệnh, materialized view lưu dòng", en: "A view stores a query, a materialized view stores rows" }
caption:
  vi: "View không chứa dòng nào: mỗi lần đọc là chạy lại câu gốc, nên luôn mới. Materialized view chứa kết quả của lần chạy gần nhất: đọc nhanh, nhưng đứng yên tới REFRESH. REFRESH … CONCURRENTLY cần một UNIQUE index."
  en: "A view holds no rows: every read runs its query again, so it is always fresh. A materialized view holds the result of its last run: fast to read, but frozen until REFRESH. REFRESH … CONCURRENTLY needs a UNIQUE index."
alt:
  vi: "View chỉ lưu câu SELECT nên mỗi lần đọc là chạy lại câu đó trên orders: luôn mới, nhưng tốn bằng chạy câu. Materialized view lưu sẵn kết quả của lần chạy gần nhất: đọc rất nhanh và tạo index được, nhưng đứng yên cho tới khi REFRESH."
  en: "A view stores only its SELECT, so every read runs that query on orders again: always fresh, but as costly as the query. A materialized view stores the result of its last run: very fast to read and it can be indexed, but it stays frozen until REFRESH."
groups:
  - { id: v, label: VIEW, nodes: [vq, o1, b1, b2] }
  - { id: m, label: MATERIALIZED VIEW, nodes: [mv, o2, b3, b4] }
nodes:
