  - { id: o1, shape: table, label: orders, sub: { vi: "2000 dòng", en: "2000 rows" } }
  - { id: b1, shape: key, label: { vi: "luôn mới", en: "always fresh" }, tone: live }
  - { id: b2, shape: key, label: { vi: "giá = chạy câu lệnh", en: "cost = the query" } }
  - { id: mv, shape: grid, label: paid_count, head: [n], cells: [["1800"]], tone: new, sub: { vi: "có thể có index", en: "can be indexed" } }
  - { id: o2, shape: table, label: orders, sub: { vi: "2000 dòng", en: "2000 rows" } }
