# B3-12 (tools/v42/diagram-plan-v42.md): follow the foreign keys, one JOIN per hop. Lesson: multi_join (Ý chính, "Hãy vẽ đường đi").
# Data (lab, PGlite; tools/v42/b3check.log): FKs order_items.order_id → orders.id, order_items.product_id → products.id,
# orders.customer_id → customers.id, orders.store_id → stores.id (lab columns; order_items' key is (order_id, line_no));
# order 1416 = 3 lines (Dish soap, Laundry powder 3kg, Trash bags), store Hoan Kiem, customer Pham Nam;
# Ben Thanh, October 2026: orders ⋈ order_items ⋈ stores = 228 rows, count(DISTINCT o.id) = 76. Bars to scale (3 = 228, 1 = 76).
# Source: https://www.postgresql.org/docs/current/queries-table-expressions.html#QUERIES-JOIN
title: { vi: "Nối theo chuỗi khóa ngoại", en: "Joining along the foreign keys" }
caption:
  vi: "Mỗi đường là một khóa ngoại, và mỗi JOIN đi đúng một đường. Muốn tới stores từ order_items phải qua orders."
  en: "Each line is one foreign key, and each JOIN follows exactly one line. To reach stores from order_items you go through orders."
alt:
  vi: "Khi dữ liệu cần nằm cách nhau vài khóa ngoại, nối từng bảng một theo chuỗi khóa, và nối xuống bảng chi tiết thì số dòng bằng số dòng chi tiết. Kết quả: 228 dòng nhưng 76 đơn."
  en: "When the data you need is several foreign keys apart, join one table at a time along the chain, and joining down to a detail table gives as many rows as details. Result: 228 rows but 76 orders."
nodes:
  - { id: p, shape: entity, label: PRODUCTS, fields: [{ name: id, pk: true }, name] }
  - { id: oi, shape: entity, label: ORDER_ITEMS, fields: [{ name: order_id, pk: true, fk: true }, { name: line_no, pk: true }, { name: product_id, fk: true }, qty] }
  - { id: o, shape: entity, label: ORDERS, fields: [{ name: id, pk: true }, { name: customer_id, fk: true }, { name: store_id, fk: true }, order_date] }
  - { id: c, shape: entity, label: CUSTOMERS, fields: [{ name: id, pk: true }, name] }
  - { id: s, shape: entity, label: STORES, fields: [{ name: id, pk: true }, name] }
  - { id: fan, shape: note, label: { vi: "1 đơn × 3 dòng hàng = 3 dòng", en: "1 order × 3 lines = 3 rows" } }
  - id: cnt
    shape: bars
    label: { vi: "Ben Thanh, tháng 10", en: "Ben Thanh, October" }
    items:
      - { label: count(*), value: 3, note: "228" }
      - { label: count(DISTINCT), value: 1, note: "76", tone: live }
rows:
  - [p, oi]
  - [c, o, s]
  - [fan, cnt]
phone: { rows: [[p], [oi], [o], [c, s], [fan], [cnt]] }
edges:
  - { from: "p#0", to: "oi#2", link: true, ends: [one, zero-many] }
  - { from: "o#0", to: "oi#0", link: true, ends: [one, one-many] }
  - { from: "c#0", to: "o#1", link: true, ends: [one, zero-many] }
  - { from: "s#0", to: "o#2", link: true, ends: [one, zero-many] }
steps:
  - say: { vi: "Mỗi JOIN đi một khóa ngoại.", en: "Each JOIN follows one foreign key." }
    show: [p, oi, o, c, s]
    alt: { vi: "stores không nối thẳng vào order_items, nên đường đi phải qua orders, nơi có store_id.", en: "stores does not join order_items directly, so the path goes through orders, which has store_id." }
  - say: { vi: "Nối xuống bảng chi tiết nhân số dòng.", en: "Joining down to the detail table multiplies rows." }
    show: [p, oi, o, c, s, fan, cnt]
    alt: { vi: "Một đơn có ba dòng hàng nên xuất hiện ba lần sau khi nối, và count(*) đếm dòng chứ không đếm đơn.", en: "An order with three lines appears three times after the join, so count(*) counts rows, not orders." }
