  - { id: stg, mono: true, label: stg_orders, sub: { vi: "ép số, bỏ đơn xóa", en: "cast, drop deleted" }, tone: warm }
  - { id: fct, mono: true, label: fct_orders, sub: { vi: "chép qua", en: "passed through" } }
  - { id: rev, mono: true, label: revenue_by_tier, sub: { vi: "cộng: revenue_vnd", en: "sum: revenue_vnd" } }
  - { id: dash, shape: doc, label: { vi: "Dashboard hạng", en: "Tier dashboard" }, sub: exposure, tone: live }
rows:
