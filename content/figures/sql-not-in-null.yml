# GB-2 (tools/v39/diagram-plan.md): one NULL empties NOT IN. Lessons: exists (Lỗi hay gặp), in_subquery (Ví dụ, "NOT IN an toàn").
# Data (lab, checked in PGlite): SELECT customer_id FROM orders WHERE order_date >= '2026-10-20' → 87 rows, 5 NULL (walk-ins),
# smallest ids 2, 4, 5, 6; customer 3 is not in it. customers NOT IN (…) → 0 rows; NOT EXISTS (…) → 235 rows.
# Source: https://www.postgresql.org/docs/current/functions-subquery.html#FUNCTIONS-SUBQUERY-NOTIN
title: { vi: "Một NULL làm NOT IN rỗng", en: "One NULL empties NOT IN" }
caption:
  vi: "x NOT IN (danh sách) là một chuỗi phép <> nối bằng AND. Một phép so với NULL ra NULL, nên cả chuỗi không bao giờ TRUE."
  en: "x NOT IN (list) is a chain of <> joined by AND. A comparison with NULL gives NULL, so the whole chain is never TRUE."
alt:
  vi: "x NOT IN (danh sách) là một chuỗi phép <> nối bằng AND, và chỉ cần danh sách có một NULL thì phép x <> NULL ra NULL, kéo cả chuỗi thành NULL chứ không bao giờ TRUE. Vì vậy NOT IN trả 0 dòng, kể cả cho khách 3 không có trong danh sách; NOT EXISTS xét từng cặp nên không bị NULL ảnh hưởng và trả 235 dòng."
  en: "x NOT IN (list) is a chain of <> joined by AND, and one NULL in the list is enough: x <> NULL gives NULL, which makes the whole chain NULL, never TRUE. So NOT IN returns 0 rows, even for customer 3 who is not in the list; NOT EXISTS checks pairs, is not affected by the NULL, and returns 235 rows."
nodes:
  - id: list
    shape: grid
    mono: true
    label: { vi: "mã khách có đơn từ 20/10", en: "customer ids since 20 Oct" }
    cells: [["2", "4", "5", "6", "…", "NULL"]]
    toneOf: { "NULL": warm }
    sub: { vi: "87 dòng, 5\u00a0dòng NULL", en: "87 rows, 5 of them NULL" }
  - id: test
    shape: grid
    mono: true
    label: { vi: "khách 3 NOT IN …", en: "customer 3 NOT IN …" }
    cells: [["3 <> 2", "TRUE"], ["3 <> 4", "TRUE"], ["…", "…"], ["3 <> NULL", "NULL"]]
    toneOf: { "TRUE": live, "NULL": warm }
  - { id: and, mono: true, label: "TRUE AND NULL", sub: { vi: "= NULL, không TRUE", en: "= NULL, not TRUE" }, tone: warm }
  - { id: notin, label: NOT IN, sub: { vi: "0 dòng", en: "0 rows" }, tone: dead }
  - { id: notex, label: NOT EXISTS, sub: { vi: "235 dòng", en: "235 rows" }, tone: live }
  - { id: pairs, shape: note, label: { vi: "NOT EXISTS xét từng cặp", en: "NOT EXISTS checks pairs" } }
rows:
  - [list]
  - [test]
  - [and]
  - [notin, notex]
  - [pairs]
edges:
  - { from: list, to: test }
  - { from: test, to: and }
  - { from: and, to: notin }
