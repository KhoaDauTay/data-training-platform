title: { vi: "Việc nào để ở đâu", en: "Which job goes where" }
caption:
  vi: "Giao dịch và ràng buộc ở PostgreSQL; báo cáo trên bản chép ở kho lưu theo cột."
  en: "Transactions and constraints in PostgreSQL; reports on a copy in a column store."
alt:
  vi: "Sửa từng dòng, chèn từng đơn và khóa ngoại thuộc về PostgreSQL, nơi chúng được kiểm trong một giao dịch. Dữ liệu được chép theo lô sang ClickHouse, nơi các câu gộp trên nhiều dòng chạy."
  en: "Single-row updates, one-order inserts and foreign keys belong in PostgreSQL, where they are checked inside a transaction. Data is copied in batches to ClickHouse, where aggregates over many rows run."
