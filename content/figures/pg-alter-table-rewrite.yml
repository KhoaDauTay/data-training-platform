# B3-1 (tools/v42/diagram-plan-v42.md): some ALTERs only touch the catalog, some rewrite the file. Lesson: e-pg-l1-13 (Ý chính),
# the three commands of its Example. Data (PGlite, lesson setup; tools/v42/b3check.log): pg_relation_filenode('orders') is the same
# after ADD COLUMN channel text NOT NULL DEFAULT 'web' (true), new after ALTER COLUMN customer_ref TYPE bigint USING (false), the
# same after note varchar(40) → varchar(80) (true). "file A" / "file B" stand for the two filenodes (no fake number).
# Source: https://www.postgresql.org/docs/18/sql-altertable.html
title: { vi: "ALTER chỉ sửa catalog hay ghi lại bảng", en: "Does an ALTER touch only the catalog or rewrite the table" }
caption:
  vi: "Ba lệnh của phần Ví dụ trên orders (20000 dòng). pg_relation_filenode cho biết bảng còn ở file cũ hay đã được ghi sang file mới."
  en: "The Example's three commands on orders (20000 rows). pg_relation_filenode tells whether the table is still in its old file or was written to a new one."
alt:
  vi: "Thời gian bảng bị khóa phụ thuộc vào việc ALTER có phải ghi lại bảng hay không. pg_relation_filenode đổi đúng khi bảng bị ghi sang file mới."
  en: "How long the table stays locked depends on whether the ALTER rewrites it. pg_relation_filenode changes exactly when the table moves to a new file."
nodes:
  - { id: cmd, shape: key, mono: true, label: "ADD COLUMN … DEFAULT 'web'" }
  - { id: cat, shape: table, label: pg_catalog, sub: { vi: "lưu DEFAULT", en: "keeps the DEFAULT" } }
  - { id: f1, shape: doc, label: file A, sub: orders }
  - { id: f2, shape: doc, label: file B, sub: { vi: "+ index mới", en: "+ new indexes" }, tone: new }
  - { id: res, shape: note, label: { vi: "cùng file", en: "same file" }, tone: live }
rows:
  - [cmd, cat]
  - [f1, f2]
  - [res]
edges:
  - { from: cmd, to: cat, label: { vi: "chỉ catalog", en: "catalog only" } }
  - { from: f1, to: f2, label: { vi: "ghi mọi dòng", en: "every row" } }
steps:
  - say: { vi: "DEFAULT hằng: lưu một lần trong catalog.", en: "Constant DEFAULT: stored once in the catalog." }
    show: [cmd, cat, f1, res]
    alt: { vi: "Postgres trả giá trị mặc định cho dòng cũ khi đọc, nên không dòng nào phải ghi lại.", en: "Postgres hands old rows the default when they are read, so no row is rewritten." }
  - say: { vi: "Đổi kiểu cách lưu: ghi sang file mới.", en: "A storage change: a new file." }
    show: [cmd, f1, f2, res]
    alt: { vi: "text sang bigint đổi cách lưu từng giá trị, nên mọi dòng và mọi index được ghi lại dưới khóa cao nhất.", en: "text to bigint changes how every value is stored, so all rows and indexes are rewritten under the strongest lock." }
    set:
      cmd: { label: "TYPE bigint" }
      res: { label: { vi: "ghi lại + dựng index", en: "rewrite + reindex" }, tone: dead }
  - say: { vi: "Nới varchar: không ghi lại.", en: "Widen a varchar: no rewrite." }
    show: [cmd, cat, f1, res]
    alt: { vi: "Nới giới hạn độ dài không đổi byte nào trên đĩa.", en: "Raising a length limit changes no byte on disk." }
    set:
      cmd: { label: "varchar(40→80)" }
      cat: { sub: { vi: "lưu giới hạn mới", en: "new limit stored" } }
