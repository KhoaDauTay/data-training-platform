# GB-1 (tools/v39/diagram-plan.md): the inner query runs once per outer row. Lesson: correlated_value (Ý chính).
# Query: SELECT s.name, (SELECT max(o.order_date) FROM orders o WHERE o.store_id = s.id) FROM stores s
# Data (lab, checked in PGlite): Hai Chau 2026-10-31, Son Tra 2026-10-30, Ben Thanh, Thao Dien, Hoan Kiem 2026-10-31.
# Source: https://www.postgresql.org/docs/current/sql-expressions.html#SQL-SYNTAX-SCALAR-SUBQUERIES
title: { vi: "Truy vấn con chạy lại cho từng dòng", en: "The subquery runs again for each row" }
caption:
  vi: "Truy vấn con nhắc tới s.id của dòng ngoài, nên mỗi cửa hàng có một lần chạy riêng, với giá trị của chính nó."
  en: "The subquery names s.id of the outer row, so each store gets a run of its own, with its own value."
alt:
  vi: "Truy vấn con tương quan nhắc tới s.id của dòng ngoài, nên nó không chạy một lần cho cả bảng mà chạy lại cho từng cửa hàng, mỗi lần với id của chính cửa hàng đó. Kết quả: 5 cửa hàng, 5 lần chạy, mỗi dòng một ngày đơn cuối."
  en: "A correlated subquery names s.id of the outer row, so it does not run once for the whole table but again for each store, each time with that store's own id. Result: 5 stores, 5 runs, one last-order date per row."
nodes:
  - id: s
    shape: grid
    label: stores s
    head: [id, name]
    cells: [["1", Hai Chau], ["2", Son Tra], ["3", Ben Thanh], ["4", Thao Dien], ["5", Hoan Kiem]]
  - { id: q, mono: true, label: "max(order_date)", sub: "WHERE store_id = 1", tone: new }
  - id: r
    shape: grid
    mono: true
    label: { vi: "kết quả", en: "result" }
    head: [last_order]
    cells: [["?"], ["?"], ["?"], ["?"], ["?"]]
    toneOf: { "?": ghost }
  - { id: n, shape: key, label: { vi: "chạy 5 lần", en: "ran 5 times" }, tone: live }
rows:
  - [s, q, r]
  - [n]
edges:
  - { from: s, to: q }
  - { from: q, to: r }
steps:
  - say: { vi: "Với cửa hàng 1, truy vấn con chạy với s.id = 1.", en: "For store 1 the subquery runs with s.id = 1." }
    alt: { vi: "Với cửa hàng đầu tiên, truy vấn con thay s.id bằng 1 và chỉ tìm đơn của cửa hàng 1, nên chỉ ô kết quả của dòng đó có giá trị.", en: "For the first store the subquery puts 1 in place of s.id and looks only at store 1's orders, so only that row's result cell gets a value." }
    show: [s, q, r]
    set:
      s: { rowTone: [new] }
      r: { cells: [["2026-10-31"], ["?"], ["?"], ["?"], ["?"]], cellTone: { "0:0": new } }
  - say: { vi: "Dòng tiếp theo, chạy lại với s.id = 2.", en: "Next row, run again with s.id = 2." }
    alt: { vi: "Sang dòng Son Tra, truy vấn con chạy lại từ đầu với store_id = 2, nên ra ngày riêng của cửa hàng này chứ không dùng lại kết quả trước.", en: "On the Son Tra row the subquery runs again from scratch with store_id = 2, so it gives this store's own date instead of reusing the last result." }
    show: [s, q, r]
    set:
      s: { rowTone: [null, new] }
      q: { sub: "WHERE store_id = 2" }
      r: { cells: [["2026-10-31"], ["2026-10-30"], ["?"], ["?"], ["?"]], cellTone: { "1:0": new } }
  - say: { vi: "Một lần cho mỗi dòng ngoài; Postgres có thể tối ưu, nhưng ý nghĩa là vậy.", en: "Once per outer row; Postgres may optimise it, but that is the meaning." }
    alt: { vi: "Hết bảng, truy vấn con đã chạy 5 lần, mỗi dòng ngoài một lần; Postgres có thể tối ưu cách chạy, nhưng kết quả luôn đúng như vậy.", en: "By the end of the table the subquery has run 5 times, once per outer row; Postgres may optimise how it runs, but the result always means exactly this." }
    set:
      q: { sub: { vi: "mỗi s.id một lần", en: "once per s.id" } }
      r: { cells: [["2026-10-31"], ["2026-10-30"], ["2026-10-31"], ["2026-10-31"], ["2026-10-31"]] }
