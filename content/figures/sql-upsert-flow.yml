# GB-4 (tools/v39/diagram-plan.md): ON CONFLICT decides per row. Lessons: upsert (Ý chính), e-pg-l1-16 (Ý chính).
# The lesson's second example: INSERT INTO store_targets VALUES (5, '2026-06-01', 8000000), (5, '2026-12-01', 9500000)
# ON CONFLICT (store_id, month) DO UPDATE SET target_vnd = EXCLUDED.target_vnd RETURNING … → 2 rows.
# Data (lab, checked in PGlite): store 5 has no June 2026 row; its December 2026 row holds 9,000,000.
# v40 R2 (E-08): DO NOTHING stands beside DO UPDATE on a dashed "hoặc" link (an alternative, not a next step); on a phone it wraps
# under it and the link turns vertical. Source: https://www.postgresql.org/docs/current/sql-insert.html#SQL-ON-CONFLICT
title: { vi: "ON CONFLICT quyết định từng dòng", en: "ON CONFLICT decides row by row" }
caption:
  vi: "Mỗi dòng đề xuất được so với khóa duy nhất: chưa có thì thêm, đã có thì sửa (hoặc bỏ qua, nếu viết DO NOTHING). EXCLUDED là dòng đề xuất."
  en: "Each proposed row is checked against the unique key: missing means insert, present means update (or skip, with DO NOTHING). EXCLUDED is the proposed row."
alt:
  vi: "ON CONFLICT quyết định riêng cho từng dòng đề xuất, dựa vào khóa duy nhất (store_id, month): khóa chưa có thì thêm dòng mới, đã có thì DO UPDATE sửa dòng cũ bằng số lấy từ EXCLUDED, tức dòng đề xuất. Viết DO NOTHING thay cho DO UPDATE thì dòng trùng khóa chỉ bị bỏ qua, không báo lỗi."
  en: "ON CONFLICT decides separately for each proposed row, by the unique key (store_id, month): a missing key means a new row, an existing one means DO UPDATE sets the old row to the number from EXCLUDED, the proposed row. Write DO NOTHING instead of DO UPDATE and a row with a clashing key is simply skipped, with no error."
