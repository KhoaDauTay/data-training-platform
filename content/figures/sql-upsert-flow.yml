# GB-4 (tools/v39/diagram-plan.md): ON CONFLICT decides per row. Lessons: upsert (Ý chính), e-pg-l1-16 (Ý chính).
# The lesson's second example: INSERT INTO store_targets VALUES (5, '2026-06-01', 8000000), (5, '2026-12-01', 9500000)
# ON CONFLICT (store_id, month) DO UPDATE SET target_vnd = EXCLUDED.target_vnd RETURNING … → 2 rows.
# Data (lab, checked in PGlite): store 5 has no June 2026 row; its December 2026 row holds 9,000,000.
# Source: https://www.postgresql.org/docs/current/sql-insert.html#SQL-ON-CONFLICT
title: { vi: "ON CONFLICT quyết định từng dòng", en: "ON CONFLICT decides row by row" }
caption:
  vi: "Mỗi dòng đề xuất được so với khóa duy nhất: chưa có thì thêm, đã có thì sửa (hoặc bỏ qua, nếu viết DO NOTHING). EXCLUDED là dòng đề xuất."
  en: "Each proposed row is checked against the unique key: missing means insert, present means update (or skip, with DO NOTHING). EXCLUDED is the proposed row."
alt:
  vi: "Hai dòng đề xuất cho cửa hàng 5: tháng 06/2026 với 8 triệu, tháng 12/2026 với 9,5 triệu. Mỗi dòng đi qua câu hỏi: khóa (store_id, month) đã có chưa? Tháng 6 chưa có, nên INSERT thêm dòng mới. Tháng 12 đã có 9 triệu, nên DO UPDATE sửa thành 9,5 triệu, lấy số từ EXCLUDED, tức dòng đề xuất. Nếu câu viết DO NOTHING thay cho DO UPDATE, dòng tháng 12 bị bỏ qua. RETURNING trả 2 dòng."
  en: "Two proposed rows for store 5: June 2026 with 8 million, December 2026 with 9.5 million. Each row meets one question: does the key (store_id, month) exist? June does not, so INSERT adds a new row. December already holds 9 million, so DO UPDATE changes it to 9.5 million, taking the number from EXCLUDED, the proposed row. Had the statement said DO NOTHING instead of DO UPDATE, the December row would be skipped. RETURNING gives 2 rows."
