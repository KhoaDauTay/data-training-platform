# v43 R2 (extensions-plan §b, lesson e-pg-ext-11): pg_stat_statements folds calls that differ only in their constants into one
# row; since PostgreSQL 18 it also folds IN lists that differ only in length. Data (lesson setup, checked in PGlite 0.5.16):
# id = 1, 2, 3 → "… WHERE id = $1", calls 3; IN (1, 2) and IN (4, 5, 6, 7) → "… IN ($1 /*, ... */)", calls 2.
# Source: https://www.postgresql.org/docs/18/pgstatstatements.html
title: { vi: "Ba lần gọi, một dòng thống kê", en: "Three calls, one statistics row" }
caption:
  vi: "Hằng số được thay bằng $1, nên các câu chỉ khác hằng số gộp thành một dòng và cộng dồn calls."
  en: "Constants are replaced with $1, so queries that differ only in constants fold into one row and add up their calls."
alt:
  vi: "pg_stat_statements lưu khung câu sau khi thay hằng số bằng $1, nên mọi lần tra theo id chỉ là một dòng với tổng số lần gọi. Từ PostgreSQL 18, danh sách IN dài ngắn khác nhau cũng gộp vào một dòng."
  en: "pg_stat_statements stores the shape of a query after replacing constants with $1, so every lookup by id is one row with the total number of calls. Since PostgreSQL 18, IN lists of different lengths also fold into one row."
nodes:
  - { id: a, label: id = 1 }
  - { id: b, label: id = 2 }
  - { id: c, label: id = 3 }
  - id: row
    shape: grid
    label: pg_stat_statements
    head: [query, calls]
    cells: [["… WHERE id = $1", "3"]]
    cellTone: { "0:1": new }
rows:
  - [a, b, c]
  - [row]
edges:
  - { from: a, to: row }
  - { from: b, to: row }
  - { from: c, to: row }
steps:
  - say: { vi: "Ba hằng số khác nhau, một khung câu.", en: "Three different constants, one query shape." }
    alt: { vi: "Ba lần tra với id 1, 2 và 3 cùng thành khung WHERE id = $1, nên dòng đó có calls là 3.", en: "Three lookups with id 1, 2 and 3 all become the shape WHERE id = $1, so that row has calls 3." }
  - say: { vi: "PostgreSQL 18: danh sách IN cũng gộp.", en: "PostgreSQL 18: IN lists fold too." }
    show: [a, b, row]
    alt: { vi: "Hai câu IN với 2 và 4 phần tử cùng thành IN ($1 /*, ... */), nên dòng đó có calls là 2.", en: "Two IN queries with 2 and 4 elements both become IN ($1 /*, ... */), so that row has calls 2." }
    set:
      a: { label: "IN (1, 2)" }
      b: { label: "IN (4, 5, 6, 7)" }
      row: { cells: [["… IN ($1 /*, ... */)", "2"]] }
