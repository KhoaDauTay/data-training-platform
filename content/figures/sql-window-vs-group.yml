# GB-5 (tools/v39/diagram-plan.md): GROUP BY collapses, OVER keeps every row. Lessons: window_agg (Ý chính), window_rank (Ý chính).
# Data (lab, checked in PGlite): Ben Thanh (store 3) orders per day 25–31 Oct: 25: 4, 27: 2, 28: 6, 29: 4, 30: 4, 31: 2 (22; no row on 26).
# Running total 4, 6, 12, 16, 20, 22. Source: https://www.postgresql.org/docs/current/tutorial-window.html
title: { vi: "GROUP BY gộp dòng, OVER giữ mọi dòng", en: "GROUP BY folds rows, OVER keeps every row" }
caption:
  vi: "Hàm cửa sổ thêm một cột tính trên một tập dòng mà không bỏ dòng nào."
  en: "A window function adds a column computed over a set of rows without removing any row."
alt:
  vi: "GROUP BY và hàm cửa sổ cùng tính tổng, nhưng GROUP BY gộp các dòng thành một, còn OVER đặt kết quả cạnh từng dòng nên không mất chi tiết nào. Thêm ORDER BY vào OVER thì cửa sổ chỉ tới dòng hiện tại, cho tổng lũy kế."
  en: "GROUP BY and a window function both compute a sum, but GROUP BY folds the rows into one, while OVER puts the result next to each row, so no detail is lost. Add ORDER BY inside OVER and the window stops at the current row, giving a running total."
nodes:
  - id: t
    shape: grid
    label: { vi: "Ben Thanh, mỗi ngày", en: "Ben Thanh, per day" }
    head: [order_date, n]
    cells:
      - [{ vi: "25/10", en: "25 Oct" }, "4"]
      - [{ vi: "27/10", en: "27 Oct" }, "2"]
      - [{ vi: "28/10", en: "28 Oct" }, "6"]
      - [{ vi: "29/10", en: "29 Oct" }, "4"]
      - [{ vi: "30/10", en: "30 Oct" }, "4"]
      - [{ vi: "31/10", en: "31 Oct" }, "2"]
  - id: x
    shape: grid
    label: GROUP BY
    head: ["sum(n)"]
    cells: [["22"]]
    tone: new
    sub: { vi: "6 dòng thành 1", en: "6 rows into 1" }
rows:
  - [t, x]
steps:
  - say: { vi: "GROUP BY gộp 6 dòng thành 1: mất chi tiết từng ngày.", en: "GROUP BY folds 6 rows into 1: the per-day detail is gone." }
    alt: { vi: "sum(n) với GROUP BY gộp 6 ngày thành một dòng tổng 22, nên không còn biết từng ngày bán bao nhiêu.", en: "sum(n) with GROUP BY folds the 6 days into one row with the total 22, so you can no longer see what each day sold." }
  - say: { vi: "OVER () tính trên cả bảng nhưng đặt kết quả cạnh từng dòng.", en: "OVER () computes over all rows but puts the result next to each row." }
    alt: { vi: "SUM(n) OVER () vẫn tính tổng trên cả bảng nhưng đặt số 22 cạnh từng dòng, nên vẫn đủ 6 dòng.", en: "SUM(n) OVER () still sums over all rows but puts 22 next to each row, so all 6 rows remain." }
    set:
      x: { label: "OVER ()", cells: [["22"], ["22"], ["22"], ["22"], ["22"], ["22"]], sub: { vi: "cả bảng, mỗi dòng", en: "all rows, each row" } }
  - say: { vi: "Có ORDER BY, cửa sổ chỉ tới dòng hiện tại: tổng lũy kế.", en: "With ORDER BY, the window stops at the current row: a running total." }
    alt: { vi: "Với OVER (ORDER BY order_date), cửa sổ của mỗi dòng chỉ gồm các dòng tới nó, nên dòng 28/10 cộng ba ngày đầu thành 12: tổng lũy kế.", en: "With OVER (ORDER BY order_date) each row's window holds only the rows up to it, so the 28 Oct row adds the first three days to 12: a running total." }
    set:
      t: { rowTone: [new, new, new] }
      x:
        label: OVER (ORDER BY)
        cells: [["4"], ["6"], ["12"], ["16"], ["20"], ["22"]]
        tone: plain
        rowTone: [new, new, new]
        cellTone: { "2:0": new }
        sub: { vi: "cửa sổ của 28/10: 3 dòng", en: "28 Oct's window: 3 rows" }
