  - { id: orders, shape: table, mono: true, label: raw_shop.orders, sub: { vi: "0,3 giờ: qua", en: "0.3 h: pass" }, tone: new }
  - { id: pay, shape: table, mono: true, label: raw_pay.payments, sub: { vi: "9,8 giờ: cảnh báo", en: "9.8 h: warn" }, tone: warm }
  - { id: ads, shape: table, mono: true, label: raw_ads.spend, sub: { vi: "50 giờ: lỗi", en: "50 h: error" }, tone: dead }
  - { id: rule, shape: note, label: { vi: "cảnh báo > 6 giờ, lỗi > 24 giờ", en: "warn > 6 h, error > 24 h" } }
rows:
