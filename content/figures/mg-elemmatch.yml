# MG-1 (tools/v39/diagram-plan.md): same element or any elements. Lesson: e-mg-l1-08 (Lỗi hay gặp).
# Data (lab.setup, run on mingo): order 1 lines {p1, qty 2}, {p4, qty 1}; order 5 lines {p6, qty 2}, {p4, qty 2}.
# find({"lines.sku": "p4", "lines.qty": {$gte: 2}}) → 1, 5; find({lines: {$elemMatch: {sku: "p4", qty: {$gte: 2}}}}) → 5.
# Deviation: the plan's ticks are tinted cells named in each table's sub; the filters are in the caption (too long to draw).
# Source: https://www.mongodb.com/docs/manual/tutorial/query-array-of-documents/
title: { vi: "Cùng một phần tử hay phần tử bất kỳ", en: "The same element or any elements" }
caption:
  vi: "Điều kiện: sku là p4 và qty ≥ 2. Dấu chấm ({\"lines.sku\": \"p4\", \"lines.qty\": {$gte: 2}}) cho mỗi điều kiện tìm phần tử riêng, nên đơn 1 khớp nhờ hai dòng khác nhau. $elemMatch đòi cả hai điều kiện trên cùng một phần tử. Ô được tô màu là ô mà lần khớp dựa vào."
  en: "The condition: sku is p4 and qty ≥ 2. Dot notation ({\"lines.sku\": \"p4\", \"lines.qty\": {$gte: 2}}) lets each condition find its own element, so order 1 matches through two different lines. $elemMatch needs both conditions on one element. A tinted cell is one the match relies on."
alt:
  vi: "Với dấu chấm, mỗi điều kiện được tìm trên một phần tử bất kỳ, nên đơn 1 khớp dù sku p4 và qty 2 nằm ở hai dòng khác nhau. $elemMatch đòi cả hai điều kiện trên cùng một phần tử, nên chỉ đơn 5 khớp. Kết quả: 2 đơn so với 1 đơn."
  en: "With dot notation each condition may be met by any element, so order 1 matches even though sku p4 and qty 2 sit on two different lines. $elemMatch needs both conditions on one element, so only order 5 matches. Result: 2 orders against 1."
groups:
  - { id: dot, label: { vi: "dấu chấm", en: "dot notation" }, nodes: [a1, a5, ar] }
  - { id: em, label: $elemMatch, nodes: [b1, b5, br] }
nodes:
  - { id: a1, shape: grid, label: { vi: "đơn 1", en: "order 1" }, head: [sku, qty], cells: [[p1, "2"], [p4, "1"]], cellTone: { "0:1": warm, "1:0": warm }, sub: { vi: "khớp: 2 phần tử", en: "2 elements match" } }
  - { id: a5, shape: grid, label: { vi: "đơn 5", en: "order 5" }, head: [sku, qty], cells: [[p6, "2"], [p4, "2"]], cellTone: { "1:0": new, "1:1": new }, sub: { vi: "khớp: dòng 2", en: "line 2 matches" } }
  - { id: ar, shape: key, label: { vi: "kết quả: 1, 5", en: "result: 1, 5" }, tone: warm }
  - { id: b1, shape: grid, label: { vi: "đơn 1", en: "order 1" }, head: [sku, qty], cells: [[p1, "2"], [p4, "1"]], sub: { vi: "không dòng nào đủ", en: "no line has both" } }
  - { id: b5, shape: grid, label: { vi: "đơn 5", en: "order 5" }, head: [sku, qty], cells: [[p6, "2"], [p4, "2"]], cellTone: { "1:0": new, "1:1": new }, sub: { vi: "khớp: dòng 2", en: "line 2 matches" } }
  - { id: br, shape: key, label: { vi: "kết quả: 5", en: "result: 5" }, tone: live }
rows:
  - [a1, a5]
  - [ar]
  - [b1, b5]
  - [br]
