# ST-3 (tools/v43/de-tools-plan.md §4): a day's numbers receive a row after the report was sent. Lesson: e-st-l1-03 (Ý chính).
# Data = the lab's raw_shop.orders: order 203 (30 Oct, 200,000) synced 30 Oct 23:00; order 204 (30 Oct, 50,000) synced 31 Oct 11:00;
# the report closes at 06:00 on 31 Oct (the lab's 30-hour cut-off).
title: { vi: "Một dòng về trễ", en: "A row that arrives late" }
caption:
  vi: "Báo cáo ngày 30/10 chốt lúc 06:00 ngày 31; đơn 204 của ngày 30 chỉ về ở lần đồng bộ 11:00, nên ngày 30 phải tính lại."
  en: "The 30 Oct report closes at 06:00 on 31 Oct; order 204 of 30 Oct only arrives with the 11:00 sync, so 30 Oct must be recomputed."
alt:
  vi: "Công cụ nạp chạy theo lịch, nên một đơn của ngày 30/10 có thể về kho sau khi báo cáo ngày đó đã chốt. Vì số được gom theo ngày đặt hàng, dòng trễ làm thay đổi ngày cũ, và ngày đó phải được tính lại."
  en: "The ingestion tool runs on a schedule, so an order from 30 Oct can reach the warehouse after that day's report has closed. Because numbers are grouped by order date, the late row changes the old day, and that day must be recomputed."
nodes:
  - { id: s1, label: { vi: "đồng bộ 30/10", en: "sync 30 Oct" }, sub: { vi: "23:00 · đơn 203", en: "23:00 · order 203" } }
  - { id: s2, label: { vi: "đồng bộ 31/10", en: "sync 31 Oct" }, sub: { vi: "11:00 · đơn 204", en: "11:00 · order 204" }, tone: ghost }
  - { id: day, label: { vi: "ngày 30/10", en: "30 Oct" }, sub: { vi: "1 đơn", en: "1 order" } }
  - { id: rep, shape: doc, label: { vi: "báo cáo ngày 30", en: "30 Oct report" }, sub: { vi: "chốt 06:00", en: "closed 06:00" } }
rows:
  - [s1, s2]
  - [day]
  - [rep]
edges:
  - { from: s1, to: day }
  - { from: s2, to: day }
  - { from: day, to: rep }
steps:
  - say: { vi: "06:00: báo cáo chốt với một đơn của ngày 30.", en: "06:00: the report closes with one order for 30 Oct." }
    alt: { vi: "Lúc báo cáo chốt, kho mới có đơn 203 của ngày 30, vì lần đồng bộ kế tiếp chưa chạy.", en: "When the report closes the warehouse holds only order 203 for 30 Oct, because the next sync has not run yet." }
    set:
      s1: { tone: live }
      rep: { tone: live }
  - say: { vi: "11:00: đơn 204 về, ngày 30 đổi số.", en: "11:00: order 204 arrives and 30 Oct changes." }
    alt: { vi: "Lần đồng bộ 11:00 mang đơn 204 thuộc ngày 30, nên tổng ngày 30 đổi và báo cáo đã gửi không còn đúng.", en: "The 11:00 sync brings order 204, which belongs to 30 Oct, so that day's total changes and the report already sent is no longer right." }
    set:
      s2: { tone: new }
      day: { sub: { vi: "2 đơn", en: "2 orders" }, tone: new }
      rep: { sub: { vi: "cần tính lại", en: "recompute" }, tone: warm }
