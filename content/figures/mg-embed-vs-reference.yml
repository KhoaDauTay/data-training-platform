# MG-5 (tools/v39/diagram-plan.md): one document or two. Lesson: e-mg-l2-11 (Ý chính).
# Data: the lesson's own two cases: an order with a few lines (embed, order 1's lines p1 and p4 from the shared shop data);
# a product with tens of thousands of reviews (reference, plus a small array of the latest reviews).
# Deviation: the plan's question strip is in the caption (three questions do not fit 2 × 18). R2 lesson 1: the one arrow is
# the reference, labelled product_id. Source: https://www.mongodb.com/docs/manual/reference/limits/#mongodb-limit-BSON-Document-Size
title: { vi: "Nhúng hay tham chiếu", en: "Embed or reference" }
caption:
  vi: "Chọn theo cách đọc, không theo luật cứng. Màn hình nào đọc dữ liệu này? Đọc bao nhiêu lần so với ghi? Phía \"nhiều\" lớn tới đâu sau một năm?"
  en: "Choose by how the data is read, not by a fixed rule. Which screen reads it? How often is it read compared with written? How big is the \"many\" side after a year?"
alt:
  vi: "Bên nhúng: tài liệu đơn 1 chứa luôn mảng lines với p1 và p4; đọc cùng nhau trong một lần, và một lần ghi trên một tài liệu là nguyên tử. Bên tham chiếu: tài liệu sản phẩm p6 chỉ giữ mảng latest_reviews gồm 3 đánh giá mới nhất; mọi đánh giá nằm trong collection reviews riêng, mỗi cái có product_id trỏ về p6; phía nhiều không giới hạn, và một tài liệu tối đa 16 MiB."
  en: "Embed side: the document order 1 holds its lines array with p1 and p4; it is read together in one go, and one write on one document is atomic. Reference side: the product document p6 keeps only a latest_reviews array of the 3 newest reviews; every review lives in its own collection reviews, each with a product_id pointing back to p6; the many side is unbounded, and a document is at most 16 MiB."
groups:
  - { id: em, label: { vi: "Nhúng", en: "Embed" }, nodes: [od, e1, e2] }
  - { id: rf, label: { vi: "Tham chiếu", en: "Reference" }, nodes: [pr, rv, r1, r2] }
nodes:
  - { id: od, shape: doc, label: { vi: "đơn 1", en: "order 1" }, sub: "lines: [p1, p4]" }
  - { id: e1, shape: key, label: { vi: "đọc cùng nhau", en: "read together" }, tone: live }
  - { id: e2, shape: key, label: { vi: "ghi nguyên tử 1 tài liệu", en: "atomic on one doc" }, tone: live }
  - { id: pr, shape: doc, label: p6, sub: "latest_reviews: 3" }
  - { id: rv, shape: table, label: reviews, sub: "product_id: p6" }
  - { id: r1, shape: key, label: { vi: "nhiều vô hạn", en: "unbounded many" }, tone: warm }
  - { id: r2, shape: key, label: { vi: "16 MiB / tài liệu", en: "16 MiB per doc" }, tone: warm }
rows:
  - [od]
  - [e1, e2]
  - [pr, rv]
  - [r1, r2]
edges:
  - { from: rv, to: pr, label: product_id }
