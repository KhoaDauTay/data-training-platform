# MG-5 (tools/v39/diagram-plan.md): one document or two. Lesson: e-mg-l2-11 (Ý chính).
# Data: the lesson's own two cases: an order with a few lines (embed, order 1's lines p1 and p4 from the shared shop data);
# a product with tens of thousands of reviews (reference, plus a small array of the latest reviews).
# Deviation: the plan's question strip is in the caption (three questions do not fit 2 × 18). R2 lesson 1: the one arrow is
# the reference, labelled product_id. R3 (E10): order 1 is a table whose rows are its embedded lines (documents inside the
# document); the 16 MiB limit is the embed side's risk; p6's small array is labelled as a copy of the 3 newest reviews. Source: https://www.mongodb.com/docs/manual/reference/limits/#mongodb-limit-BSON-Document-Size
title: { vi: "Nhúng hay tham chiếu", en: "Embed or reference" }
caption:
  vi: "Chọn theo cách đọc, không theo luật cứng. Màn hình nào đọc dữ liệu này? Đọc bao nhiêu lần so với ghi? Phía \"nhiều\" lớn tới đâu sau một năm?"
  en: "Choose by how the data is read, not by a fixed rule. Which screen reads it? How often is it read compared with written? How big is the \"many\" side after a year?"
alt:
  vi: "Nhúng khi phần con ít và luôn đọc cùng phần cha: các dòng của đơn nằm trong tài liệu đơn, đọc một lần và ghi nguyên tử. Tham chiếu khi phía “nhiều” lớn không giới hạn: đánh giá nằm ở collection reviews riêng với product_id, vì một tài liệu không vượt quá 16 MiB."
  en: "Embed when the children are few and always read with their parent: an order's lines live inside the order document, read in one go and written atomically. Reference when the “many” side grows without limit: reviews live in their own reviews collection with a product_id, because one document cannot pass 16 MiB."
groups:
  - { id: em, label: { vi: "Nhúng", en: "Embed" }, nodes: [od, e1, e2, lim] }
  - { id: rf, label: { vi: "Tham chiếu", en: "Reference" }, nodes: [pr, rv, r1] }
nodes:
  - { id: od, shape: grid, label: { vi: "đơn 1: một tài liệu", en: "order 1: one doc" }, head: [lines.sku, qty], cells: [[p1, "2"], [p4, "1"]] }
  - { id: e1, shape: key, label: { vi: "đọc cùng nhau", en: "read together" }, tone: live }
  - { id: e2, shape: key, label: { vi: "ghi nguyên tử", en: "atomic write" }, tone: live }
  - { id: lim, shape: key, label: { vi: "trần 16 MiB", en: "16 MiB ceiling" }, tone: warm }
  - { id: pr, shape: doc, label: p6, sub: { vi: "3 review mới nhất", en: "3 newest reviews" } }
  - { id: rv, shape: table, label: reviews, sub: "product_id: p6" }
  - { id: r1, shape: key, label: { vi: "nhiều vô hạn", en: "unbounded many" }, tone: warm }
rows:
  - [od]
  - [e1, e2, lim]
  - [pr, rv]
  - [r1]
edges:
  - { from: rv, to: pr, label: product_id }