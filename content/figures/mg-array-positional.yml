# MG-3 (tools/v39/diagram-plan.md): $, $[], $[id] + arrayFilters. Lesson: e-mg-l2-01 (Ý chính).
# Data (lab.setup, run on mingo, each from the pristine data): order 5 lines {p6, qty 2}, {p4, qty 2};
# updateOne({_id: 5, "lines.qty": {$gte: 2}}, {$inc: {"lines.$.qty": 1}}) → 3, 2; {$inc: {"lines.$[].qty": 1}} → 3, 3;
# {$inc: {"lines.$[elem].qty": 1}}, {arrayFilters: [{"elem.sku": "p4"}]} → 2, 3.
# R3 (E9): the filtered identifier is `elem` (the docs' name), in the figure and in the lesson's code alike; `l` read as 1 or I.
# Sources: https://www.mongodb.com/docs/manual/reference/operator/update/positional/, …/positional-all/, …/positional-filtered/
title: { vi: "$, $[] và $[elem]: sửa phần tử nào", en: "$, $[] and $[elem]: which element changes" }
caption:
  vi: "Cả ba lệnh tăng qty thêm 1 trong đơn 5. $ sửa phần tử đầu tiên khớp điều kiện mảng trong filter, $[] sửa mọi phần tử, $[elem] sửa mọi phần tử thỏa điều kiện elem trong arrayFilters. Ô được tô màu là ô được sửa."
  en: "All three commands add 1 to qty in order 5. $ changes the first element that matches the array condition in the filter, $[] changes every element, $[elem] changes every element that meets condition elem in arrayFilters. A tinted cell is a changed one."
alt:
  vi: "Ba toán tử vị trí trả lời câu hỏi “sửa phần tử nào của mảng”. $ sửa phần tử khớp đầu tiên, $[] sửa tất cả, $[elem] sửa mọi phần tử thỏa điều kiện trong arrayFilters."
  en: "The three positional operators answer “which element of the array changes”. $ changes the first match, $[] changes them all, $[elem] changes every element that meets its condition in arrayFilters."
nodes:
  - { id: op, mono: true, label: lines.$.qty, sub: { vi: "khớp đầu tiên", en: "first match" }, tone: new }
  - { id: f, shape: key, label: { vi: "filter: qty ≥ 2", en: "filter: qty ≥ 2" } }
  - { id: doc, shape: grid, label: { vi: "đơn 5", en: "order 5" }, head: [sku, qty], cells: [[p6, "2 → 3"], [p4, "2"]], cellTone: { "0:1": new } }
rows:
  - [op]
  - [doc, f]
edges:
  - { from: op, to: doc, label: "$inc qty +1" }
steps:
  - say: { vi: "$: phần tử khớp đầu tiên.", en: "$: the first matching element." }
    alt: { vi: "Với lines.$.qty, cả hai dòng đều thỏa qty ≥ 2 nhưng $ chỉ nhớ vị trí khớp đầu tiên, nên chỉ p6 tăng lên 3.", en: "With lines.$.qty both lines meet qty ≥ 2, but $ only remembers the first matching position, so only p6 goes up to 3." }
  - say: { vi: "$[]: mọi phần tử.", en: "$[]: every element." }
    alt: { vi: "Với lines.$[].qty, $[] nghĩa là “mọi phần tử” và không cần điều kiện mảng, nên cả hai dòng cùng tăng lên 3.", en: "With lines.$[].qty, $[] means “every element” and needs no array condition, so both lines go up to 3." }
    set:
      op: { label: "lines.$[].qty", sub: { vi: "mọi phần tử", en: "every element" } }
      f: { label: { vi: "không cần điều kiện", en: "no condition needed" }, tone: ghost }
      doc: { cells: [[p6, "2 → 3"], [p4, "2 → 3"]], cellTone: { "0:1": new, "1:1": new } }
  - say: { vi: "$[elem] với arrayFilters: mọi phần tử thỏa elem.", en: "$[elem] with arrayFilters: every element meeting elem." }
    alt: { vi: "Với lines.$[elem].qty và arrayFilters elem.sku = p4, chỉ phần tử thỏa elem được sửa, nên p4 tăng lên 3 còn p6 giữ nguyên.", en: "With lines.$[elem].qty and arrayFilters elem.sku = p4, only the element that meets elem changes, so p4 goes up to 3 and p6 stays as it was." }
    set:
      op: { label: "lines.$[elem].qty", sub: { vi: "thỏa elem", en: "each elem match" } }
      f: { label: "arrayFilters: elem.sku = p4" }
      doc: { cells: [[p6, "2"], [p4, "2 → 3"]], cellTone: { "1:1": new } }
