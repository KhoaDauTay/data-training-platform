# DY-4 (tools/v39/diagram-plan.md): where the 4 KB rounding happens. Lesson: e-dy-l2-09 (Ý chính).
# Data: the lesson's Example (1500 items × 64 B by one Query = 96000 B = 93.75 KB → 96 KB → 24 RCU strong, 12 eventual; by
# GetItem 1500 × 0.5 = 750 RCU eventual) and its predict (BatchGetItem 1.5 KB + 6.5 KB → 4 + 8 = 12 KB = 3 RCU strong).
# Deviation: e-dy-l2-08 / -10 are not given the figure (their own examples carry the item size and the 1 KB write rule; the
# write rule is a footnote here). Source: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/read-write-operations.html
title: { vi: "Làm tròn 4 KB ở đâu", en: "Where the 4 KB rounding happens" }
caption:
  vi: "Query cộng cỡ mọi item đã đọc rồi làm tròn một lần; GetItem và BatchGetItem làm tròn từng item. Vì thế item hay đọc cùng nhau nên chung một partition key. 1 RCU = một lần đọc nhất quán mạnh tới 4 KB, nhất quán cuối tốn một nửa."
  en: "Query adds up the size of every item read and rounds once; GetItem and BatchGetItem round each item. That is why items read together should share a partition key. 1 RCU = one strongly consistent read of up to 4 KB; an eventually consistent read costs half."
alt:
  vi: "Ba cách đọc. Query 1500 item 64 B: cộng được 96 000 B, làm tròn một lần thành 96 KB, tốn 24 RCU nhất quán mạnh hay 12 RCU nhất quán cuối. GetItem 1500 lần: mỗi item làm tròn lên 4 KB, tốn 1500 × 0,5 = 750 RCU nhất quán cuối. BatchGetItem hai item 1,5 KB và 6,5 KB: làm tròn thành 4 KB và 8 KB, tổng 12 KB, không phải 8. Ghi chú: ghi làm tròn theo 1 KB; projection và COUNT không làm rẻ hơn."
  en: "Three ways to read. Query 1500 items of 64 B: they add up to 96,000 B, rounded once to 96 KB, costing 24 RCU strongly consistent or 12 RCU eventually consistent. GetItem 1500 times: each item rounds up to 4 KB, costing 1500 × 0.5 = 750 RCU eventually consistent. BatchGetItem of two items, 1.5 KB and 6.5 KB: rounded to 4 KB and 8 KB, 12 KB in all, not 8. Notes: writes round to 1 KB; a projection and COUNT are no cheaper."
