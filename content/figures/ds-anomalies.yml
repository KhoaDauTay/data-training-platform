# DS-7 (tools/v39/diagram-plan.md): one fact stored three times. Lesson: e-ds-l4-01 (Ý chính).
# Data (checked in PGlite): the Example ex_orders (order_id, customer_id, customer_city, product; product is not drawn, 4 columns are 313 > 264 at 320): (1, 1, Hue, pen), (2, 1, Hue, ink), (3, 1, Hue, paper),
# (4, 2, Hoi An, bag). Update: UPDATE … SET customer_city = 'Da Nang' WHERE order_id = 1 → customer 1 has 2 cities. Delete: DELETE …
# WHERE customer_id = 2 → no row about customer 2. Insert: a customer with no order has no row (Common mistakes: 23502 on order_id).
title: { vi: "Một sự thật lưu ba lần", en: "One fact stored three times" }
caption:
  vi: "Thành phố là của khách, không phải của đơn. Lưu nó ở mỗi đơn sinh ra ba kiểu hỏng: sửa, xóa và thêm."
  en: "The city belongs to the customer, not to the order. Storing it on every order causes three kinds of damage: update, delete and insert."
alt:
  vi: "Thành phố là của khách chứ không phải của đơn, nên lưu nó ở mỗi đơn làm một sự thật có nhiều bản sao. Từ đó sinh ra ba kiểu hỏng: sửa sót bản sao, xóa đơn mất luôn thành phố, và khách chưa có đơn thì không có chỗ ghi."
  en: "The city belongs to the customer, not to the order, so storing it on every order turns one fact into many copies. That causes three kinds of damage: an update misses a copy, deleting an order loses the city, and a customer with no order has nowhere to be stored."
nodes:
  - id: t
    shape: grid
    label: ex_orders
    head: [order_id, customer_id, customer_city]
    cells: [["1", "1", Hue], ["2", "1", Hue], ["3", "1", Hue], ["4", "2", Hoi An]]
    cellTone: { "0:2": warm, "1:2": warm, "2:2": warm }
    sub: { vi: "thành phố khách 1: 3 bản sao", en: "customer 1's city: 3 copies" }
  - { id: badge, shape: key, label: { vi: "2 thành phố", en: "2 cities" }, sub: { vi: "của khách 1", en: "for customer 1" }, tone: dead }
rows:
  - [t]
  - [badge]
steps:
  - say: { vi: "Sửa một bản sao, quên hai bản kia.", en: "Fix one copy, forget the other two." }
    alt: { vi: "Sửa thành phố ở đơn 1 sang Da Nang mà quên hai bản còn lại, nên khách 1 giờ có hai thành phố mâu thuẫn nhau.", en: "Changing the city on order 1 to Da Nang but not the other two copies leaves customer 1 with two conflicting cities." }
    set:
      t: { cells: [["1", "1", Da Nang], ["2", "1", Hue], ["3", "1", Hue], ["4", "2", Hoi An]], cellTone: { "0:2": new, "1:2": warm, "2:2": warm } }
  - say: { vi: "Xóa đơn cuối của khách 2: thành phố của khách cũng mất.", en: "Delete customer 2's last order: the customer's city is gone too." }
    alt: { vi: "Xóa đơn 4, đơn duy nhất của khách 2, thì thành phố Hoi An của khách cũng mất theo vì nó chỉ được lưu trên đơn đó.", en: "Deleting order 4, customer 2's only order, also loses the city Hoi An, because it was stored only on that order." }
    set:
      t: { strike: [3], rowTone: [null, null, null, dead] }
      badge: { label: { vi: "mất Hoi An", en: "Hoi An lost" }, sub: { vi: "thành phố khách 2", en: "customer 2's city" } }
  - say: { vi: "Khách mới chưa có đơn: không có chỗ ghi thành phố, vì order_id là khóa.", en: "A new customer with no order: no place to store the city, because order_id is the key." }
    alt: { vi: "Khách 3 ở Hue chưa có đơn nào thì không thêm được dòng, vì order_id là khóa và không được để trống.", en: "Customer 3 in Hue has no order yet, so no row can be added, because order_id is the key and cannot be empty." }
    set:
      t: { cells: [["1", "1", Hue], ["2", "1", Hue], ["3", "1", Hue], ["4", "2", Hoi An], ["—", "3", Hue]], rowTone: [null, null, null, null, dead], cellTone: { "4:0": dead } }
      badge: { label: { vi: "không có chỗ", en: "no place" }, sub: { vi: "cho khách 3", en: "for customer 3" } }
