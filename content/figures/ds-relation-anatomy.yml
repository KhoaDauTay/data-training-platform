# DS-2 (tools/v39/diagram-plan.md): relation, tuple, attribute, domain, and the 4 integrity kinds. Lesson: e-ds-l1-02 (Ý chính).
# Data: the lab setup: staff (1 An 1 900, 2 Binh 2 750, 3 Chi 3 1200, 4 Dung 9 680, 5 Giang 1 820), departments (1 sales, 2 ops, 3 it).
# v40 R2 (E-02): dept_id is drawn last so the lines leave its cells (edge ends staff#r.3); the caption no longer says the words point.
# Setup has no FK yet; Dung's dept_id 9 has no parent, so the lab's ADD FOREIGN KEY fails with 23503 until it is fixed (lab steps 3–4).
# Sources: https://www.postgresql.org/docs/current/ddl-constraints.html , https://www.postgresql.org/docs/current/errcodes-appendix.html
title: { vi: "Từ ngữ hình thức trên một bảng quen", en: "The formal words on a familiar table" }
caption:
  vi: "Bốn từ hình thức là tên khác của bảng, dòng, cột và kiểu; bốn loại luật toàn vẹn, mỗi loại có một mã lỗi. Cột dept_id của staff trỏ tới id của departments."
  en: "The four formal words are other names for table, row, column and type; four kinds of integrity rule, each with an error code. Column dept_id of staff refers to the id of departments."
alt:
  vi: "Bốn từ hình thức chỉ là tên khác của thứ quen thuộc: quan hệ là bảng, bộ là dòng, thuộc tính là cột, miền là kiểu cộng luật. Mỗi loại luật toàn vẹn có mã lỗi riêng; ví dụ Dung trỏ tới phòng 9 không tồn tại, nên thêm khóa ngoại sẽ bị từ chối với 23503."
  en: "The four formal words are other names for familiar things: a relation is a table, a tuple a row, an attribute a column, a domain a type plus rules. Each kind of integrity rule has its own error code; for example Dung points at department 9, which does not exist, so adding the foreign key is refused with 23503."
nodes:
  - { id: c1, shape: key, label: { vi: "quan hệ = bảng", en: "relation = table" }, tone: ptr }
  - { id: c2, shape: key, label: { vi: "bộ = dòng", en: "tuple = row" }, tone: ptr }
  - { id: c3, shape: key, label: { vi: "thuộc tính = cột", en: "attribute = column" }, tone: ptr }
  - { id: c4, shape: key, label: { vi: "miền = kiểu + luật", en: "domain = type + rules" }, tone: ptr }
  - id: staff
    shape: grid
    label: staff
    head: [id, name, salary, dept_id]
    cells: [["1", An, "900", "1"], ["2", Binh, "750", "2"], ["3", Chi, "1200", "3"], ["4", Dung, "680", "9"], ["5", Giang, "820", "1"]]
    rowTone: [null, null, null, dead]
    cellTone: { "3:3": dead }
  - { id: dept, shape: grid, label: departments, head: [id, name], cells: [["1", sales], ["2", ops], ["3", it]] }
  - { id: bad, shape: key, label: { vi: "Dung: phòng 9", en: "Dung: dept 9" }, sub: { vi: "không cha: 23503", en: "no parent: 23503" }, tone: dead }
  - { id: i1, label: { vi: "Miền", en: "Domain" }, sub: "CHECK → 23514" }
  - { id: i2, label: { vi: "Khóa", en: "Key" }, sub: "UNIQUE → 23505" }
  - { id: i3, label: { vi: "Thực thể", en: "Entity" }, sub: "PK → 23502, 23505" }
  - { id: i4, label: { vi: "Tham chiếu", en: "Referential" }, sub: "FK → 23503" }
rows:
  - [c1, c2]
  - [c3, c4]
  - [staff, dept]
  - [bad]
  - [i1, i2]
  - [i3, i4]
edges:
  - { from: "staff#0.3", to: "dept#0.0", link: true }
  - { from: "staff#1.3", to: "dept#1.0", link: true }
  - { from: "staff#2.3", to: "dept#2.0", link: true }
  - { from: "staff#4.3", to: "dept#0.0", link: true }
