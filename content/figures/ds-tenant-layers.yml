# B2-8 (tools/v42/diagram-plan-v42.md): three layers, each catching one kind of mistake, in the order they are built. Lesson:
# e-ds-l4-09 (Ý chính). Data (run, tools/v42/b2check.log): the lab's invoices hold 3 tenants × 4, and joining payments on both
# columns for tenant 2 gives 4 rows; the figure draws no table. One row per layer, the mistake beside the layer that stops it
# (no group frame: a group must cover whole rows, and the phone keeps each pair on one row).
# Source: https://www.postgresql.org/docs/18/ddl-rowsecurity.html
title: { vi: "Ba lớp giữ các khách tách nhau", en: "Three layers keep tenants apart" }
caption:
  vi: "Theo thứ tự dựng: khóa chặn ghi chéo, câu lọc chặn đọc nhầm, chính sách theo dòng làm lưới cho câu quên lọc."
  en: "In build order: keys refuse cross writes, filters stop wrong reads, and the row policy is the net for a query that forgets its filter."
alt:
  vi: "Trong pool, ba lớp giữ khách tách nhau: khóa chặn ghi sai, câu lọc chặn đọc nhầm, chính sách theo dòng làm lưới khi một câu quên lọc. Mỗi lớp có một phép kiểm tự động trong CI."
  en: "In a pool, three layers keep tenants apart: keys refuse wrong writes, filters prevent wrong reads, and row-level policies catch a query that forgot to filter. Each layer has an automatic CI check."
nodes:
  - { id: m2, shape: key, label: { vi: "ghi chéo: bị chặn", en: "cross write: refused" }, tone: dead }
  - { id: k, label: { vi: "1. khóa", en: "1. keys" }, sub: "FK (tenant_id, …)", tone: new }
  - { id: m1, shape: key, label: { vi: "quên lọc: đọc nhầm", en: "no filter: wrong read" }, tone: dead }
  - { id: q, label: { vi: "2. câu lọc", en: "2. query filter" }, sub: "tenant_id = 2", tone: new }
  - { id: m3, shape: key, label: { vi: "câu quên: lưới RLS", en: "forgot: RLS net" }, tone: dead }
  - { id: rls, label: { vi: "3. chính sách", en: "3. policy" }, sub: RLS, tone: new }
rows:
  - [m2, k]
  - [m1, q]
  - [m3, rls]
align: true
edges:
  - { from: m2, to: k }
  - { from: m1, to: q }
  - { from: m3, to: rls }
steps:
  - say: { vi: "Khóa trước.", en: "Keys first." }
    alt: { vi: "Sửa khóa khi bảng đã đầy là việc lớn nhất, nên tenant_id vào khóa ngay từ đầu.", en: "Changing keys on a full table is the biggest job, so tenant_id goes into the keys from the start." }
    show: [m2, k]
  - say: { vi: "Câu lọc đi cùng từng câu SQL.", en: "Filters ride with every query." }
    alt: { vi: "Mỗi câu nhắc tenant_id, kể cả trong điều kiện nối, nên dòng của người khác không lọt vào.", en: "Every query names tenant_id, even in join conditions, so other tenants' rows cannot slip in." }
    show: [m2, k, m1, q]
  - say: { vi: "Chính sách bật sau cùng.", en: "The policy goes on last." }
    alt: { vi: "RLS bật khi ứng dụng đã đặt ngữ cảnh khách ở mọi yêu cầu, nếu không câu thiếu ngữ cảnh trả 0 dòng khó dò.", en: "RLS goes on once the app sets the tenant on every request; otherwise a request without it returns 0 rows that are hard to trace." }
