# Drill phần Chung theo kỹ năng (Plan 8a): 4 mỗi kỹ năng (faded, open, trap; review từ v19, L168: id g-<kỹ năng>-4, không starter, chỉ cho hàng ôn). Dữ liệu: schema `lab` (src/db/lab.sql).

# ---- select (ch1)
- id: g-select-1
  skill: select
  kind: faded
  task: { vi: "Lấy tên và danh mục của mọi sản phẩm.", en: "Get the name and the category of every product." }
  starter: "SELECT ___, ___ FROM products"
  solution: "SELECT name, category FROM products"
  hint: { vi: "Hai cột cần lấy là `name` và `category`, cách nhau bằng dấu phẩy.", en: "The two columns are `name` and `category`, separated by a comma." }
- id: g-select-2
  skill: select
  kind: open
  task: { vi: "Mỗi cửa hàng: tên, thành phố và ngày khai trương, theo đúng thứ tự cột đó.", en: "For each store: the name, the city and the opening date, in that column order." }
  solution: "SELECT name, city, opened_on FROM stores"
  hint: { vi: "Bảng `stores` có cột `opened_on` là ngày khai trương.", en: "The `stores` table has `opened_on` for the opening date." }
- id: g-select-3
  skill: select
  kind: trap
  task: { vi: "Lấy mã và tên của mọi khách hàng, chỉ hai cột đó.", en: "Get the id and the name of every customer, only those two columns." }
  solution: "SELECT id, name FROM customers"
  hint: { vi: "Liệt kê đúng hai cột `id`, `name`.", en: "List exactly the two columns `id`, `name`." }
  wrong:
    - { sql: "SELECT * FROM customers", vi: "`*` lấy mọi cột của bảng, nên kết quả thừa cột so với yêu cầu.", en: "`*` takes every column of the table, so the result has more columns than asked." }
- id: g-select-4
  skill: select
  kind: review
  task: { vi: "Mỗi nhân viên: tên, vai trò và ngày vào làm, theo đúng thứ tự cột đó.", en: "Each staff member: the name, the role and the hire date, in that column order." }
  solution: "SELECT name, role, hired_on FROM staff"
  hint: { vi: "Bảng `staff` có cột `role` và `hired_on`.", en: "The `staff` table has `role` and `hired_on`." }

# ---- where (ch1)
- id: g-where-1
  skill: where
  kind: faded
  task: { vi: "Sản phẩm nào giá trên 100.000 đồng? Lấy tên và giá.", en: "Which products cost more than 100,000 VND? Get the name and the price." }
  starter: "SELECT name, price_vnd FROM products WHERE ___"
  solution: "SELECT name, price_vnd FROM products WHERE price_vnd > 100000"
  hint: { vi: "So sánh `price_vnd` với một con số.", en: "Compare `price_vnd` with a number." }
- id: g-where-2
  skill: where
  kind: open
  task: { vi: "Khách ở `Hanoi` có năm sinh lớn hơn 1990 (từ 1991 trở đi): lấy tên và năm sinh, theo thứ tự cột đó. Khách không rõ năm sinh không tính.", en: "Customers in `Hanoi` with a birth year greater than 1990 (1991 or later): get the name and the birth year, in that column order. Customers with an unknown birth year are left out." }
  solution: "SELECT name, birth_year FROM customers WHERE city = 'Hanoi' AND birth_year > 1990"
  hint: { vi: "Hai điều kiện trên `city` và `birth_year` phải cùng đúng.", en: "Both conditions, on `city` and on `birth_year`, must hold." }
- id: g-where-3
  skill: where
  kind: trap
  task: { vi: "Đơn bán qua kênh `ONLINE` của cửa hàng 1 hoặc cửa hàng 2: lấy mã đơn và mã cửa hàng.", en: "Orders sold through the `ONLINE` channel at store 1 or store 2: get the order id and the store id." }
  solution: "SELECT id, store_id FROM orders WHERE channel = 'ONLINE' AND (store_id = 1 OR store_id = 2)"
  hint: { vi: "Khi trộn AND với OR, đặt phần \"cửa hàng 1 hoặc 2\" trong ngoặc.", en: "When mixing AND with OR, put the \"store 1 or 2\" part in parentheses." }
  wrong:
    - { sql: "SELECT id, store_id FROM orders WHERE channel = 'ONLINE' AND store_id = 1 OR store_id = 2", vi: "Không có ngoặc thì AND được tính trước: bạn lấy mọi đơn của cửa hàng 2, kể cả đơn bán tại quầy.", en: "Without parentheses AND is evaluated first: you get every order of store 2, in-store ones included." }
- id: g-where-4
  skill: where
  kind: review
  task: { vi: "Đồ uống (danh mục `Drinks`) nào giá dưới 20.000 đồng? Lấy tên và giá.", en: "Which drinks (category `Drinks`) cost less than 20,000 VND? Get the name and the price." }
  solution: "SELECT name, price_vnd FROM products WHERE category = 'Drinks' AND price_vnd < 20000"
  hint: { vi: "Hai điều kiện, trên `category` và `price_vnd`, phải cùng đúng.", en: "Two conditions, on `category` and on `price_vnd`, must both hold." }

# ---- order_by (ch1)
- id: g-order-by-1
  skill: order_by
  kind: faded
  task: { vi: "Mọi sản phẩm: tên và giá, đắt nhất lên đầu; cùng giá thì theo tên A→Z.", en: "Every product: name and price, most expensive first; on the same price, by name A→Z." }
  starter: "SELECT name, price_vnd FROM products ORDER BY ___"
  solution: "SELECT name, price_vnd FROM products ORDER BY price_vnd DESC, name"
  ordered: true
  hint: { vi: "Sắp theo `price_vnd` giảm dần (DESC), rồi theo `name`.", en: "Sort by `price_vnd` descending (DESC), then by `name`." }
- id: g-order-by-2
  skill: order_by
  kind: open
  task: { vi: "Mọi nhân viên: tên và ngày vào làm, người vào sớm nhất lên đầu; cùng ngày thì mã nhân viên nhỏ hơn trước.", en: "Every staff member: name and hire date, earliest first; on the same date, the smaller staff id first." }
  solution: "SELECT name, hired_on FROM staff ORDER BY hired_on, id"
  ordered: true
  hint: { vi: "Ngày sớm hơn là nhỏ hơn, nên sắp tăng dần theo `hired_on`, rồi `id`.", en: "An earlier date is smaller, so sort ascending by `hired_on`, then `id`." }
- id: g-order-by-3
  skill: order_by
  kind: trap
  task: { vi: "Mọi sản phẩm: danh mục, tên, giá; xếp theo danh mục A→Z, trong mỗi danh mục thì đắt nhất lên đầu.", en: "Every product: category, name, price; sorted by category A→Z, and within each category the most expensive first." }
  solution: "SELECT category, name, price_vnd FROM products ORDER BY category, price_vnd DESC"
  ordered: true
  hint: { vi: "Mỗi cột trong ORDER BY có chiều riêng: DESC chỉ áp cho cột đứng ngay trước nó.", en: "Each column in ORDER BY has its own direction: DESC applies only to the column right before it." }
  wrong:
    - { sql: "SELECT category, name, price_vnd FROM products ORDER BY category, price_vnd", vi: "Thiếu DESC sau `price_vnd`: trong mỗi danh mục, rẻ nhất lại lên đầu.", en: "DESC is missing after `price_vnd`: within each category the cheapest comes first." }
- id: g-order-by-4
  skill: order_by
  kind: review
  task: { vi: "Mọi cửa hàng: tên và thành phố, theo thành phố A→Z; cùng thành phố thì cửa hàng khai trương gần đây nhất lên trước.", en: "Every store: the name and the city, by city A→Z; within a city, the most recently opened store first." }
  solution: "SELECT name, city FROM stores ORDER BY city, opened_on DESC"
  ordered: true
  hint: { vi: "Sắp theo `city` trước, rồi theo `opened_on` giảm dần; cột dùng để sắp không cần có trong kết quả.", en: "Sort by `city` first, then by `opened_on` descending; a sort column does not have to be in the result." }

# ---- limit (ch1)
- id: g-limit-1
  skill: limit
  kind: faded
  task: { vi: "5 sản phẩm đắt nhất: tên và giá, đắt nhất lên đầu.", en: "The 5 most expensive products: name and price, most expensive first." }
  starter: |-
    SELECT name, price_vnd
    FROM products
    ORDER BY price_vnd DESC
    LIMIT ___
  solution: "SELECT name, price_vnd FROM products ORDER BY price_vnd DESC LIMIT 5"
  ordered: true
  hint: { vi: "Sắp xếp đã có sẵn; chỉ cần nói giữ bao nhiêu dòng đầu.", en: "The sort is already there; just say how many top rows to keep." }
- id: g-limit-2
  skill: limit
  kind: open
  task: { vi: "3 khách đăng ký sớm nhất: tên và ngày đăng ký; cùng ngày thì mã khách nhỏ hơn trước.", en: "The 3 earliest customers to sign up: name and signup date; on the same date, the smaller customer id first." }
  solution: "SELECT name, signup_date FROM customers ORDER BY signup_date, id LIMIT 3"
  ordered: true
  hint: { vi: "Sắp theo `signup_date` rồi `id`, sau đó chỉ giữ 3 dòng.", en: "Sort by `signup_date` then `id`, then keep only 3 rows." }
- id: g-limit-3
  skill: limit
  kind: trap
  task: { vi: "10 đơn mới nhất: mã đơn và ngày đặt, mới nhất lên đầu; cùng ngày thì mã đơn lớn hơn trước.", en: "The 10 latest orders: order id and order date, latest first; on the same date, the larger order id first." }
  solution: "SELECT id, order_date FROM orders ORDER BY order_date DESC, id DESC LIMIT 10"
  ordered: true
  hint: { vi: "\"Mới nhất\" chỉ có nghĩa sau khi đã sắp xếp theo ngày.", en: "\"Latest\" only means something after sorting by date." }
  wrong:
    - { sql: "SELECT id, order_date FROM orders LIMIT 10", vi: "LIMIT không có ORDER BY lấy 10 dòng bất kỳ, không phải 10 đơn mới nhất.", en: "LIMIT without ORDER BY takes any 10 rows, not the 10 latest orders." }
- id: g-limit-4
  skill: limit
  kind: review
  task: { vi: "Ba món văn phòng phẩm (danh mục `Stationery`) rẻ nhất: tên và giá, rẻ nhất lên đầu; cùng giá thì theo tên A→Z.", en: "The three cheapest stationery items (category `Stationery`): the name and the price, cheapest first; on the same price, by name A→Z." }
  solution: "SELECT name, price_vnd FROM products WHERE category = 'Stationery' ORDER BY price_vnd, name LIMIT 3"
  ordered: true
  hint: { vi: "Lọc danh mục, sắp theo giá tăng dần rồi tên, giữ lại ba dòng đầu.", en: "Filter the category, sort by price ascending then name, keep the first three rows." }

# ---- aggregate (ch2)
- id: g-aggregate-1
  skill: aggregate
  kind: faded
  task: { vi: "Có tất cả bao nhiêu đơn, ngày đặt đầu tiên và ngày đặt gần nhất là ngày nào? Một dòng, ba con số.", en: "How many orders are there, and what are the first and the latest order dates? One row, three values." }
  starter: "SELECT ___(*), min(order_date), ___(order_date) FROM orders"
  solution: "SELECT count(*), min(order_date), max(order_date) FROM orders"
  hint: { vi: "Một hàm đếm dòng, một hàm lấy giá trị lớn nhất.", en: "One function counts rows, one takes the largest value." }
- id: g-aggregate-2
  skill: aggregate
  kind: open
  task: { vi: "Với các sản phẩm danh mục `Snacks`: một dòng gồm giá trung bình (làm tròn tới đồng, không còn chữ số thập phân) và giá cao nhất, theo thứ tự đó.", en: "For the products in the `Snacks` category: one row with the average price (rounded to the whole dong, no decimals) and the highest price, in that order." }
  solution: "SELECT round(avg(price_vnd)), max(price_vnd) FROM products WHERE category = 'Snacks'"
  hint: { vi: "Lọc danh mục trước, rồi dùng hàm trung bình (bọc trong `round`) và hàm lớn nhất.", en: "Filter the category first, then use the average (wrapped in `round`) and the maximum." }
- id: g-aggregate-3
  skill: aggregate
  kind: trap
  task: { vi: "Có bao nhiêu khách hàng đã để lại email? Khách chưa để lại email có ô `email` trống (NULL). Lấy một con số.", en: "How many customers have left an email? A customer without one has an empty (NULL) `email`. Get one number." }
  solution: "SELECT count(email) FROM customers"
  hint: { vi: "Hàm đếm trên một cột bỏ qua ô trống của cột đó.", en: "Counting a column skips the empty values of that column." }
  wrong:
    - { sql: "SELECT count(*) FROM customers", vi: "`count(*)` đếm mọi dòng, kể cả khách chưa có email.", en: "`count(*)` counts every row, customers without an email included." }
- id: g-aggregate-4
  skill: aggregate
  kind: review
  task: { vi: "Trên mọi dòng hàng đã bán: tổng số lượng và đơn giá cao nhất từng bán. Một dòng, hai con số.", en: "Over every order line sold: the total quantity and the highest unit price ever sold. One row, two numbers." }
  solution: "SELECT SUM(qty), MAX(unit_price_vnd) FROM order_items"
  hint: { vi: "Hai hàm gộp trên `order_items`: một cộng `qty`, một lấy lớn nhất của `unit_price_vnd`.", en: "Two aggregate functions on `order_items`: one adds up `qty`, one takes the largest `unit_price_vnd`." }

# ---- group_by (ch2)
- id: g-group-by-1
  skill: group_by
  kind: faded
  task: { vi: "Mỗi danh mục có bao nhiêu sản phẩm? Lấy danh mục và số sản phẩm.", en: "How many products does each category have? Get the category and the product count." }
  starter: "SELECT category, count(*) FROM products GROUP BY ___"
  solution: "SELECT category, count(*) FROM products GROUP BY category"
  hint: { vi: "Gom theo đúng cột đứng ngoài hàm gộp trong SELECT.", en: "Group by the column that sits outside the aggregate in SELECT." }
- id: g-group-by-2
  skill: group_by
  kind: open
  task: { vi: "Mỗi cửa hàng có bao nhiêu đơn đã thanh toán (`PAID`)? Lấy mã cửa hàng và số đơn.", en: "How many paid (`PAID`) orders does each store have? Get the store id and the order count." }
  solution: "SELECT store_id, count(*) FROM orders WHERE status = 'PAID' GROUP BY store_id"
  hint: { vi: "Lọc trạng thái trước, rồi gom theo `store_id`.", en: "Filter the status first, then group by `store_id`." }
- id: g-group-by-3
  skill: group_by
  kind: trap
  task: { vi: "Số đơn cho mỗi cặp kênh bán và trạng thái: lấy kênh, trạng thái, số đơn.", en: "The order count for each pair of channel and status: get the channel, the status and the count." }
  solution: "SELECT channel, status, count(*) FROM orders GROUP BY channel, status"
  hint: { vi: "Mọi cột trong SELECT nằm ngoài hàm gộp đều phải có trong GROUP BY.", en: "Every SELECT column outside an aggregate must be in GROUP BY." }
  wrong:
    - { sql: "SELECT channel, status, count(*) FROM orders GROUP BY channel", vi: "`status` không có trong GROUP BY, nên Postgres báo lỗi: nó không biết lấy trạng thái nào cho mỗi kênh.", en: "`status` is not in GROUP BY, so Postgres raises an error: it cannot tell which status to show for each channel." }
- id: g-group-by-4
  skill: group_by
  kind: review
  task: { vi: "Mỗi thành phố có bao nhiêu cửa hàng? Lấy thành phố và số cửa hàng.", en: "How many stores does each city have? Get the city and the store count." }
  solution: "SELECT city, COUNT(*) FROM stores GROUP BY city"
  hint: { vi: "Một nhóm mỗi `city` trong bảng `stores`, đếm số dòng của nhóm.", en: "One group per `city` in `stores`, count the rows of each group." }

# ---- having (ch2)
- id: g-having-1
  skill: having
  kind: faded
  task: { vi: "Sản phẩm nào đã bán tổng cộng hơn 480 đơn vị? Lấy mã sản phẩm và tổng số lượng.", en: "Which products have sold more than 480 units in total? Get the product id and the total quantity." }
  starter: |-
    SELECT product_id, sum(qty)
    FROM order_items
    GROUP BY product_id
    HAVING ___
  solution: "SELECT product_id, sum(qty) FROM order_items GROUP BY product_id HAVING sum(qty) > 480"
  hint: { vi: "Điều kiện đặt trên tổng `sum(qty)` của mỗi nhóm.", en: "The condition is on each group's total `sum(qty)`." }
- id: g-having-2
  skill: having
  kind: open
  task: { vi: "Danh mục nào có giá trung bình trên 50.000 đồng? Lấy danh mục và giá trung bình (làm tròn tới đồng).", en: "Which categories have an average price above 50,000 VND? Get the category and the average price (rounded to the whole dong)." }
  solution: "SELECT category, round(avg(price_vnd)) FROM products GROUP BY category HAVING avg(price_vnd) > 50000"
  hint: { vi: "Lọc nhóm sau khi gom, bằng điều kiện trên `avg(price_vnd)`.", en: "Filter the groups after grouping, with a condition on `avg(price_vnd)`." }
- id: g-having-3
  skill: having
  kind: trap
  task: { vi: "Cửa hàng nào có hơn 250 đơn? Lấy mã cửa hàng và số đơn.", en: "Which stores have more than 250 orders? Get the store id and the order count." }
  solution: "SELECT store_id, count(*) FROM orders GROUP BY store_id HAVING count(*) > 250"
  hint: { vi: "Điều kiện trên số đơn của nhóm không đặt được ở bước lọc dòng.", en: "A condition on a group's count cannot go in the row filter." }
  wrong:
    - { sql: "SELECT store_id, count(*) FROM orders WHERE count(*) > 250 GROUP BY store_id", vi: "WHERE lọc từng dòng trước khi gom, lúc đó chưa có số đếm: Postgres báo lỗi. Điều kiện trên nhóm đặt ở HAVING.", en: "WHERE filters single rows before grouping, when there is no count yet: Postgres raises an error. A condition on groups goes in HAVING." }
- id: g-having-4
  skill: having
  kind: review
  task: { vi: "Ngày nào trong tháng 10/2026 có từ 8 đơn trở lên (mọi trạng thái)? Lấy ngày và số đơn.", en: "Which days of October 2026 had 8 or more orders (any status)? Get the date and the order count." }
  solution: "SELECT order_date, COUNT(*) FROM orders WHERE order_date >= '2026-10-01' AND order_date < '2026-11-01' GROUP BY order_date HAVING COUNT(*) >= 8"
  hint: { vi: "Tháng 10 là điều kiện trên từng đơn; \"từ 8 đơn\" là điều kiện trên cả ngày, sau khi đếm.", en: "October is a condition on each order; \"8 or more\" is a condition on the whole day, after counting." }

# ---- join (ch3)
- id: g-join-1
  skill: join
  kind: faded
  task: { vi: "Các dòng hàng của đơn số 100: tên sản phẩm và số lượng.", en: "The lines of order 100: product name and quantity." }
  starter: |-
    SELECT p.name, i.qty
    FROM order_items i
    JOIN products p ON ___
    WHERE i.order_id = 100
  solution: "SELECT p.name, i.qty FROM order_items i JOIN products p ON p.id = i.product_id WHERE i.order_id = 100"
  hint: { vi: "Dòng hàng trỏ tới sản phẩm qua `product_id`.", en: "An order line points to its product through `product_id`." }
- id: g-join-2
  skill: join
  kind: open
  task: { vi: "Nhân viên làm tại một cửa hàng: tên nhân viên và tên cửa hàng, theo thứ tự đó. Người ở văn phòng (có `store_id` trống) không tính.", en: "Staff who work at a store: staff name and store name, in that order. Office staff (with an empty `store_id`) are left out." }
  solution: "SELECT e.name, s.name FROM staff e JOIN stores s ON s.id = e.store_id"
  hint: { vi: "Nối `staff` với `stores` qua `store_id`; phép nối thường tự bỏ người không có cửa hàng.", en: "Join `staff` to `stores` through `store_id`; a plain join drops people with no store." }
- id: g-join-3
  skill: join
  kind: trap
  task: { vi: "Đơn đặt ngày 2026-10-31 của khách thành viên (đơn có `customer_id`; đơn khách vãng lai có `customer_id` trống và không tính), mọi trạng thái: mã đơn và tên khách, theo thứ tự đó.", en: "Orders placed on 2026-10-31 by member customers (the order has a `customer_id`; walk-in orders have an empty `customer_id` and are left out), every status: order id and customer name, in that order." }
  solution: "SELECT o.id, c.name FROM orders o JOIN customers c ON c.id = o.customer_id WHERE o.order_date = '2026-10-31'"
  hint: { vi: "Điều kiện nối phải ghép đúng cột khóa: khách của đơn nằm ở `customer_id`.", en: "The join condition must match the right key: an order's customer is in `customer_id`." }
  wrong:
    - { sql: "SELECT o.id, c.name FROM orders o JOIN customers c ON c.id = o.store_id WHERE o.order_date = '2026-10-31'", vi: "ON ghép nhầm cột (`store_id`): Postgres không báo lỗi, nhưng mỗi đơn gắn với một khách sai.", en: "ON matches the wrong column (`store_id`): Postgres does not complain, but each order gets the wrong customer." }
- id: g-join-4
  skill: join
  kind: review
  task: { vi: "Các đơn ngày 31/10/2026: mã đơn và tên cửa hàng bán đơn đó. Bài có thanh hiệu năng: câu đúng mà tốn hơn hẳn lời giải (như làm mất chỉ mục trên `orders`) chưa được tính là đạt.", en: "The orders of 2026-10-31: the order id and the name of the store that sold it. This drill has a performance bar: a right answer that costs far more than the Solution (such as losing the index on `orders`) does not pass." }
  solution: "SELECT o.id, s.name FROM orders o JOIN stores s ON s.id = o.store_id WHERE o.order_date = '2026-10-31'"
  perf: { table: orders } # v25 R1 (L360): right but slow is not passed
  slow: "SELECT o.id, s.name FROM orders o JOIN stores s ON s.id = o.store_id WHERE o.order_date::text = '2026-10-31'"
  hint: { vi: "Nối `orders` với `stores` qua `store_id`.", en: "Join `orders` to `stores` through `store_id`." }

# ---- multi_join (ch3)
- id: g-multi-join-1
  skill: multi_join
  kind: faded
  task: { vi: "Các dòng hàng của đơn số 200: tên sản phẩm, số lượng và tên cửa hàng bán.", en: "The lines of order 200: product name, quantity and the name of the selling store." }
  starter: |-
    SELECT p.name, i.qty, s.name
    FROM order_items i
    JOIN products p ON ___
    JOIN orders o ON ___
    JOIN stores s ON s.id = o.store_id
    WHERE i.order_id = 200
  solution: "SELECT p.name, i.qty, s.name FROM order_items i JOIN products p ON p.id = i.product_id JOIN orders o ON o.id = i.order_id JOIN stores s ON s.id = o.store_id WHERE i.order_id = 200"
  hint: { vi: "Mỗi JOIN có ON riêng: sản phẩm qua `product_id`, đơn qua `order_id`.", en: "Each JOIN has its own ON: the product through `product_id`, the order through `order_id`." }
- id: g-multi-join-2
  skill: multi_join
  kind: open
  task: { vi: "Đơn đặt ngày 2026-10-30 của khách thành viên (đơn có `customer_id`; đơn khách vãng lai có `customer_id` trống và không tính), mọi trạng thái: mã đơn, tên khách, tên cửa hàng, theo thứ tự đó.", en: "Orders placed on 2026-10-30 by member customers (the order has a `customer_id`; walk-in orders have an empty `customer_id` and are left out), every status: order id, customer name, store name, in that order." }
  solution: "SELECT o.id, c.name, s.name FROM orders o JOIN customers c ON c.id = o.customer_id JOIN stores s ON s.id = o.store_id WHERE o.order_date = '2026-10-30'"
  hint: { vi: "Từ `orders` nối hai lần: tới `customers` và tới `stores`.", en: "Join twice from `orders`: to `customers` and to `stores`." }
- id: g-multi-join-3
  skill: multi_join
  kind: trap
  task: { vi: "Dòng hàng của các đơn đặt ngày 2026-10-29: mã đơn, tên sản phẩm, tên cửa hàng.", en: "Lines of the orders placed on 2026-10-29: order id, product name, store name." }
  solution: "SELECT i.order_id, p.name, s.name FROM order_items i JOIN products p ON p.id = i.product_id JOIN orders o ON o.id = i.order_id JOIN stores s ON s.id = o.store_id WHERE o.order_date = '2026-10-29'"
  hint: { vi: "Hai bảng cùng có cột `name`: ghi bí danh trước mỗi cột.", en: "Two tables both have a `name` column: put the alias before each column." }
  wrong:
    - { sql: "SELECT order_id, name, name FROM order_items i JOIN products p ON p.id = i.product_id JOIN orders o ON o.id = i.order_id JOIN stores s ON s.id = o.store_id WHERE o.order_date = '2026-10-29'", vi: "`name` có ở cả `products` lẫn `stores`, nên Postgres báo cột mơ hồ. Viết `p.name`, `s.name`.", en: "`name` exists in both `products` and `stores`, so Postgres says the column is ambiguous. Write `p.name`, `s.name`." }
- id: g-multi-join-4
  skill: multi_join
  kind: review
  task: { vi: "Các dòng hàng đồ gia dụng (danh mục `Household`) trong những đơn ngày 31/10/2026: tên sản phẩm, số lượng và tên cửa hàng.", en: "The household lines (category `Household`) in the orders of 2026-10-31: the product name, the quantity and the store name." }
  solution: "SELECT p.name, i.qty, s.name FROM order_items i JOIN products p ON p.id = i.product_id JOIN orders o ON o.id = i.order_id JOIN stores s ON s.id = o.store_id WHERE p.category = 'Household' AND o.order_date = '2026-10-31'"
  hint: { vi: "Đi từ `order_items` tới `products` (danh mục), tới `orders` (ngày), rồi tới `stores` (tên cửa hàng).", en: "Go from `order_items` to `products` (category), to `orders` (date), then to `stores` (store name)." }

# ---- left_join (ch3)
- id: g-left-join-1
  skill: left_join
  kind: faded
  task: { vi: "Mọi nhân viên: tên nhân viên và tên cửa hàng; người ở văn phòng (có `store_id` trống) vẫn hiện, tên cửa hàng để trống.", en: "Every staff member: staff name and store name; office staff (with an empty `store_id`) still show, with an empty store name." }
  starter: |-
    SELECT e.name, s.name
    FROM staff e ___
    JOIN stores s ON s.id = e.store_id
  solution: "SELECT e.name, s.name FROM staff e LEFT JOIN stores s ON s.id = e.store_id"
  hint: { vi: "Phép nối giữ mọi dòng của bảng bên trái, kể cả dòng không ghép được.", en: "The join that keeps every row of the left table, even the unmatched ones." }
- id: g-left-join-2
  skill: left_join
  kind: open
  task: { vi: "Khách đăng ký từ 2026-10-01 (tính cả ngày đó): tên khách và mã từng đơn của họ (mọi đơn, mọi trạng thái), mỗi đơn một dòng; khách chưa có đơn vẫn hiện một dòng, mã đơn để trống.", en: "Customers who signed up on or after 2026-10-01: customer name and the id of each of their orders (every order, every status), one row per order; a customer without orders still shows one row, with an empty order id." }
  solution: "SELECT c.name, o.id FROM customers c LEFT JOIN orders o ON o.customer_id = c.id WHERE c.signup_date >= '2026-10-01'"
  hint: { vi: "Bắt đầu từ `customers` để giữ mọi khách, điều kiện lọc là trên bảng bên trái.", en: "Start from `customers` to keep every customer; the filter is on the left table." }
- id: g-left-join-3
  skill: left_join
  kind: trap
  task: { vi: "Mọi cửa hàng và mục tiêu doanh thu tháng 2026-06-01; cửa hàng chưa đặt mục tiêu vẫn hiện, mục tiêu để trống.", en: "Every store and its revenue target for month 2026-06-01; a store with no target still shows, with an empty target." }
  solution: "SELECT s.name, t.target_vnd FROM stores s LEFT JOIN store_targets t ON t.store_id = s.id AND t.month = '2026-06-01'"
  hint: { vi: "Điều kiện về tháng thuộc bảng bên phải, nên đặt nó trong ON.", en: "The month condition is about the right-hand table, so put it in ON." }
  wrong:
    - { sql: "SELECT s.name, t.target_vnd FROM stores s LEFT JOIN store_targets t ON t.store_id = s.id WHERE t.month = '2026-06-01'", vi: "Điều kiện trên bảng bên phải đặt ở WHERE loại mất cửa hàng không có mục tiêu: phép nối thành nối thường.", en: "A condition on the right table in WHERE drops the store with no target: the join turns back into an inner join." }
- id: g-left-join-4
  skill: left_join
  kind: review
  task: { vi: "Mọi khách ở `Hue` kèm mã các đơn họ đặt trong tháng 10/2026. Khách không đặt đơn nào trong tháng đó vẫn có mặt, mã đơn để trống. Lấy tên khách và mã đơn.", en: "Every customer in `Hue` with the ids of the orders they placed in October 2026. Customers with no order that month still appear, with an empty order id. Get the customer name and the order id." }
  solution: "SELECT c.name, o.id FROM customers c LEFT JOIN orders o ON o.customer_id = c.id AND o.order_date >= '2026-10-01' AND o.order_date < '2026-11-01' WHERE c.city = 'Hue'"
  hint: { vi: "Điều kiện tháng thuộc về phép nối (đặt cạnh điều kiện nối); điều kiện thành phố lọc khách.", en: "The month condition belongs to the join (next to the join condition); the city condition filters the customers." }

# ---- anti_join (ch3)
- id: g-anti-join-1
  skill: anti_join
  kind: faded
  task: { vi: "Khách nào không có đơn nào từ ngày 2026-07-01 trở đi? Lấy mã và tên.", en: "Which customers have no orders from 2026-07-01 onwards? Get the id and the name." }
  starter: |-
    SELECT c.id, c.name
    FROM customers c
    LEFT JOIN orders o ON o.customer_id = c.id AND o.order_date >= '2026-07-01'
    WHERE ___ IS NULL
  solution: "SELECT c.id, c.name FROM customers c LEFT JOIN orders o ON o.customer_id = c.id AND o.order_date >= '2026-07-01' WHERE o.id IS NULL"
  hint: { vi: "Khách không ghép được đơn nào thì mọi cột của `orders` đều trống; kiểm khóa của đơn.", en: "A customer with no matching order has every `orders` column empty; check the order's key." }
- id: g-anti-join-2
  skill: anti_join
  kind: open
  task: { vi: "Cửa hàng nào chưa có mục tiêu doanh thu cho tháng 2026-02-01? Lấy tên cửa hàng.", en: "Which stores have no revenue target for month 2026-02-01? Get the store name." }
  solution: "SELECT s.name FROM stores s LEFT JOIN store_targets t ON t.store_id = s.id AND t.month = '2026-02-01' WHERE t.store_id IS NULL"
  hint: { vi: "Nối giữ mọi cửa hàng với điều kiện tháng trong ON, rồi giữ dòng không ghép được.", en: "Join keeping every store with the month in ON, then keep the rows that did not match." }
- id: g-anti-join-3
  skill: anti_join
  kind: trap
  task: { vi: "Khách hàng nào chưa từng có đơn ở cửa hàng 3? Xét mọi dòng của `customers`, kể cả khách chưa có đơn nào. Lấy mã và tên khách.", en: "Which customers have never had an order at store 3? Consider every row of `customers`, including customers with no orders at all. Get the customer id and name." }
  solution: "SELECT c.id, c.name FROM customers c LEFT JOIN orders o ON o.customer_id = c.id AND o.store_id = 3 WHERE o.id IS NULL"
  hint: { vi: "Đơn của cửa hàng 3 có cả khách vãng lai (khách trống), nên tránh so \"không nằm trong danh sách\".", en: "Store 3's orders include walk-ins (no customer), so avoid a \"not in the list\" comparison." }
  wrong:
    - { sql: "SELECT id, name FROM customers WHERE id NOT IN (SELECT customer_id FROM orders WHERE store_id = 3)", vi: "Danh sách có giá trị trống (đơn khách vãng lai), nên NOT IN không bao giờ đúng: kết quả rỗng.", en: "The list contains an empty value (walk-in orders), so NOT IN is never true: the result is empty." }
- id: g-anti-join-4
  skill: anti_join
  kind: review
  task: { vi: "Cửa hàng nào không có đơn nào trong ngày 29/10/2026? Lấy tên cửa hàng.", en: "Which stores had no order on 2026-10-29? Get the store name." }
  solution: "SELECT s.name FROM stores s LEFT JOIN orders o ON o.store_id = s.id AND o.order_date = '2026-10-29' WHERE o.id IS NULL"
  hint: { vi: "Giữ mọi cửa hàng, ghép với đơn của đúng ngày đó, rồi chỉ giữ cửa hàng không ghép được đơn nào.", en: "Keep every store, match it with that day's orders, then keep only the stores that matched no order." }

# ---- date_math (ch4)
- id: g-date-math-1
  skill: date_math
  kind: faded
  task: { vi: "Đơn giao trong tháng 10/2026 (`delivered_on` từ 2026-10-01 tới hết 2026-10-31): mã đơn và số ngày từ ngày đặt (`order_date`) tới ngày giao, dạng số nguyên. Hai cột ngày đều kiểu `date` (không có giờ).", en: "Orders delivered in October 2026 (`delivered_on` from 2026-10-01 through 2026-10-31): order id and the number of days from the order date (`order_date`) to delivery, as a whole number. Both date columns are of type `date` (no time)." }
  starter: |-
    SELECT id, ___
    FROM orders
    WHERE delivered_on >= '2026-10-01' AND delivered_on < '2026-11-01'
  solution: "SELECT id, delivered_on - order_date FROM orders WHERE delivered_on >= '2026-10-01' AND delivered_on < '2026-11-01'"
  hint: { vi: "Ngày trừ ngày ra số ngày.", en: "A date minus a date gives a number of days." }
- id: g-date-math-2
  skill: date_math
  kind: open
  task: { vi: "Khách đăng ký từ 2026-10-01 (tính cả ngày đó): tên và hạn dùng mã chào mừng, là ngày đăng ký cộng 30 ngày (đăng ký 2026-10-01 thì hạn là 2026-10-31).", en: "Customers who signed up on or after 2026-10-01: name and the expiry of their welcome code, which is the signup date plus 30 days (signed up on 2026-10-01 means expiry 2026-10-31)." }
  solution: "SELECT name, signup_date + 30 FROM customers WHERE signup_date >= '2026-10-01'"
  hint: { vi: "Ngày cộng một số nguyên ra một ngày mới.", en: "A date plus an integer gives a new date." }
- id: g-date-math-3
  skill: date_math
  kind: trap
  task: { vi: "Tính đến ngày 2026-10-31, mỗi cửa hàng đã mở được bao nhiêu ngày? Lấy tên và số ngày (số dương).", en: "As of 2026-10-31, how many days has each store been open? Get the name and the number of days (a positive number)." }
  solution: "SELECT name, DATE '2026-10-31' - opened_on FROM stores"
  hint: { vi: "Lấy ngày sau trừ ngày trước.", en: "Subtract the earlier date from the later one." }
  wrong:
    - { sql: "SELECT name, opened_on - DATE '2026-10-31' FROM stores", vi: "Trừ ngược chiều: ngày trước trừ ngày sau ra số âm.", en: "Subtracted the wrong way round: the earlier date minus the later one is negative." }
- id: g-date-math-4
  skill: date_math
  kind: review
  task: { vi: "Mỗi đơn kênh `ONLINE` đặt từ 2026-10-01: mã đơn và số ngày từ lúc đặt tới lúc giao (đơn chưa giao thì ô số ngày để trống). Bài có thanh hiệu năng: câu đúng mà tốn hơn hẳn lời giải (như làm mất chỉ mục trên `orders`) chưa được tính là đạt.", en: "Each `ONLINE` order placed from 2026-10-01: the order id and the number of days from ordering to delivery (an order not delivered yet leaves the days empty). This drill has a performance bar: a right answer that costs far more than the Solution (such as losing the index on `orders`) does not pass." }
  solution: "SELECT id, delivered_on - order_date FROM orders WHERE channel = 'ONLINE' AND order_date >= '2026-10-01'"
  perf: { table: orders } # v25 R1 (L360): right but slow is not passed
  slow: "SELECT id, delivered_on - order_date FROM orders WHERE channel = 'ONLINE' AND date_trunc('month', order_date) = '2026-10-01'"
  hint: { vi: "Hiệu hai cột kiểu `date` là một số ngày: `delivered_on` trừ `order_date`; ngày trống thì hiệu cũng trống.", en: "The difference of two `date` columns is a number of days: `delivered_on` minus `order_date`; an empty date gives an empty difference." }

# ---- date_bucket (ch4)
- id: g-date-bucket-1
  skill: date_bucket
  kind: faded
  task: { vi: "Số đơn mỗi tháng của năm 2026, xếp theo tháng.", en: "The number of orders in each month of 2026, sorted by month." }
  starter: |-
    SELECT date_trunc(___, order_date), count(*)
    FROM orders
    WHERE order_date >= '2026-01-01'
    GROUP BY 1
    ORDER BY 1
  solution: "SELECT date_trunc('month', order_date), count(*) FROM orders WHERE order_date >= '2026-01-01' GROUP BY 1 ORDER BY 1"
  ordered: true
  hint: { vi: "Đơn vị cắt ngày viết trong nháy đơn, bằng tiếng Anh.", en: "The unit to cut the date to goes in single quotes, in English." }
- id: g-date-bucket-2
  skill: date_bucket
  kind: open
  task: { vi: "Số khách đăng ký mỗi tháng của năm 2025: tháng (ghi bằng ngày đầu tháng) và số khách, xếp theo tháng.", en: "The number of customers who signed up in each month of 2025: the month (shown as its first day) and the count, sorted by month." }
  solution: "SELECT date_trunc('month', signup_date), count(*) FROM customers WHERE signup_date >= '2025-01-01' AND signup_date < '2026-01-01' GROUP BY 1 ORDER BY 1"
  ordered: true
  hint: { vi: "Lọc năm 2025 bằng khoảng nửa mở, rồi gom theo đầu tháng.", en: "Filter 2025 with a half-open range, then group by the start of the month." }
- id: g-date-bucket-3
  skill: date_bucket
  kind: trap
  task: { vi: "Số đơn (mọi trạng thái) mỗi tháng từ 01/2025 tới 10/2026, tức mọi đơn trong bảng: mỗi tháng một dòng gồm tháng (ghi bằng ngày đầu tháng) và số đơn, xếp theo tháng. Tháng nào cũng có đơn.", en: "The number of orders (every status) in each month from January 2025 to October 2026, i.e. every order in the table: one row per month with the month (shown as its first day) and the count, sorted by month. Every month has orders." }
  solution: "SELECT date_trunc('month', order_date), count(*) FROM orders GROUP BY 1 ORDER BY 1"
  ordered: true
  hint: { vi: "Một tháng ở đây gồm cả năm: tháng 3/2025 khác tháng 3/2026.", en: "A month here includes its year: March 2025 is not March 2026." }
  wrong:
    - { sql: "SELECT extract(month FROM order_date), count(*) FROM orders GROUP BY 1 ORDER BY 1", vi: "`extract(month …)` chỉ ra số tháng, nên tháng 3 của hai năm bị gộp: chỉ còn 12 dòng.", en: "`extract(month …)` only gives the month number, so March of two years is merged: only 12 rows are left." }
- id: g-date-bucket-4
  skill: date_bucket
  kind: review
  task: { vi: "Từ tháng 1/2026, mỗi tháng cửa hàng 3 có bao nhiêu đơn đã thanh toán (`PAID`)? Lấy ngày đầu tháng và số đơn, tháng sớm nhất lên đầu.", en: "From January 2026, how many paid orders (`PAID`) did store 3 have each month? Get the first day of the month and the order count, earliest month first." }
  solution: "SELECT date_trunc('month', order_date), COUNT(*) FROM orders WHERE store_id = 3 AND status = 'PAID' AND order_date >= '2026-01-01' GROUP BY 1 ORDER BY 1"
  ordered: true
  hint: { vi: "Cắt `order_date` về đầu tháng rồi đếm theo tháng.", en: "Truncate `order_date` to the start of the month, then count per month." }

# ---- null_logic (ch4)
- id: g-null-logic-1
  skill: null_logic
  kind: faded
  task: { vi: "Khách nào chưa có thành phố? Lấy mã và tên.", en: "Which customers have no city? Get the id and the name." }
  starter: "SELECT id, name FROM customers WHERE city ___"
  solution: "SELECT id, name FROM customers WHERE city IS NULL"
  hint: { vi: "Ô trống không so bằng dấu `=` được.", en: "An empty value cannot be compared with `=`." }
- id: g-null-logic-2
  skill: null_logic
  kind: open
  task: { vi: "Đơn đã gửi đi (có ngày gửi `shipped_on`) nhưng chưa giao tới khách (chưa có ngày giao `delivered_on`), mọi trạng thái: mã đơn và ngày gửi.", en: "Orders that have shipped (they have a ship date `shipped_on`) but are not delivered yet (no delivery date `delivered_on`), every status: order id and ship date." }
  solution: "SELECT id, shipped_on FROM orders WHERE shipped_on IS NOT NULL AND delivered_on IS NULL"
  hint: { vi: "Một cột phải có giá trị, cột kia phải trống.", en: "One column must have a value, the other must be empty." }
- id: g-null-logic-3
  skill: null_logic
  kind: trap
  task: { vi: "Khách nào chưa có email? Lấy mã và tên.", en: "Which customers have no email? Get the id and the name." }
  solution: "SELECT id, name FROM customers WHERE email IS NULL"
  hint: { vi: "Hỏi \"có trống không\" bằng IS, không bằng dấu bằng.", en: "Ask \"is it empty\" with IS, not with an equals sign." }
  wrong:
    - { sql: "SELECT id, name FROM customers WHERE email = NULL", vi: "`= NULL` không bao giờ đúng, nên kết quả rỗng. Viết `IS NULL`.", en: "`= NULL` is never true, so the result is empty. Write `IS NULL`." }
- id: g-null-logic-4
  skill: null_logic
  kind: review
  task: { vi: "Lượt đăng ký nào trong `raw_signups` không có số điện thoại? Lấy mã và họ tên như đã nhập.", en: "Which sign-ups in `raw_signups` have no phone number? Get the id and the full name as typed." }
  solution: "SELECT id, full_name FROM raw_signups WHERE phone IS NULL"
  hint: { vi: "Ô trống không bằng gì cả, kể cả chính nó: cần phép thử riêng cho ô trống.", en: "An empty cell equals nothing, not even itself: it needs its own test." }

# ---- case_when (ch5)
- id: g-case-when-1
  skill: case_when
  kind: faded
  task: { vi: "Mỗi sản phẩm: tên và hạng giá: 1 nếu dưới 20.000 đồng, 2 nếu từ 20.000 đến dưới 100.000, 3 nếu từ 100.000 trở lên.", en: "Each product: name and price band: 1 if under 20,000 VND, 2 from 20,000 to under 100,000, 3 from 100,000 up." }
  starter: |-
    SELECT name, CASE WHEN price_vnd < 20000 THEN 1 WHEN ___ THEN 2 ELSE ___ END
    FROM products
  solution: "SELECT name, CASE WHEN price_vnd < 20000 THEN 1 WHEN price_vnd < 100000 THEN 2 ELSE 3 END FROM products"
  hint: { vi: "Điều kiện thứ hai chỉ được xét khi điều kiện đầu sai, nên chỉ cần mốc trên.", en: "The second condition is only checked when the first is false, so it only needs the upper bound." }
- id: g-case-when-2
  skill: case_when
  kind: open
  task: { vi: "Đơn `ONLINE` đặt từ 2026-10-01 (tính cả ngày đó), bỏ đơn `CANCELLED` (đơn `REFUNDED` vẫn tính): mã đơn và nhóm giao hàng: 1 nếu `delivered_on` sau `order_date` tối đa 2 ngày (0, 1 hoặc 2 ngày), 2 nếu hơn 2 ngày, 3 nếu chưa giao (`delivered_on` trống).", en: "`ONLINE` orders placed on or after 2026-10-01, leaving out `CANCELLED` ones (`REFUNDED` ones still count): order id and delivery group: 1 if `delivered_on` is at most 2 days after `order_date` (0, 1 or 2 days), 2 if more than 2 days, 3 if not delivered yet (`delivered_on` empty)." }
  solution: "SELECT id, CASE WHEN delivered_on IS NULL THEN 3 WHEN delivered_on - order_date <= 2 THEN 1 ELSE 2 END FROM orders WHERE channel = 'ONLINE' AND order_date >= '2026-10-01' AND status <> 'CANCELLED'"
  hint: { vi: "Xét trường hợp chưa giao trước, rồi tới số ngày giao.", en: "Handle the not-delivered case first, then the delivery days." }
- id: g-case-when-3
  skill: case_when
  kind: trap
  task: { vi: "Mỗi khách: mã khách và nhóm tuổi: 1 nếu sinh từ năm 1995, 2 nếu sinh từ 1980 đến 1994, 3 nếu trước 1980, 0 nếu không rõ năm sinh.", en: "Each customer: customer id and age group: 1 if born in 1995 or later, 2 if born 1980 to 1994, 3 if before 1980, 0 if the birth year is unknown." }
  solution: "SELECT id, CASE WHEN birth_year >= 1995 THEN 1 WHEN birth_year >= 1980 THEN 2 WHEN birth_year < 1980 THEN 3 ELSE 0 END FROM customers"
  hint: { vi: "CASE dừng ở điều kiện đúng đầu tiên: đặt điều kiện hẹp nhất lên trước.", en: "CASE stops at the first true condition: put the narrowest one first." }
  wrong:
    - { sql: "SELECT id, CASE WHEN birth_year >= 1980 THEN 2 WHEN birth_year >= 1995 THEN 1 WHEN birth_year < 1980 THEN 3 ELSE 0 END FROM customers", vi: "Người sinh 1995 cũng thỏa `>= 1980`, nên CASE dừng ở nhóm 2 và nhóm 1 không bao giờ xuất hiện.", en: "Someone born in 1995 also matches `>= 1980`, so CASE stops at group 2 and group 1 never appears." }
- id: g-case-when-4
  skill: case_when
  kind: review
  task: { vi: "Mỗi nhân viên: tên và nhóm thâm niên: 1 nếu vào làm trước năm 2024, 2 nếu vào làm trong năm 2024, 3 nếu từ năm 2025 trở đi.", en: "Each staff member: the name and a seniority group: 1 if hired before 2024, 2 if hired during 2024, 3 if hired in 2025 or later." }
  solution: "SELECT name, CASE WHEN hired_on < '2024-01-01' THEN 1 WHEN hired_on < '2025-01-01' THEN 2 ELSE 3 END FROM staff"
  hint: { vi: "Xét các mốc từ sớm tới muộn; nhánh đầu tiên đúng sẽ thắng.", en: "Check the cut-offs from earliest to latest; the first true branch wins." }

# ---- conditional_agg (ch5)
- id: g-conditional-agg-1
  skill: conditional_agg
  kind: faded
  task: { vi: "Mỗi cửa hàng: mã cửa hàng, tổng số đơn và số đơn bán qua kênh `ONLINE`.", en: "Each store: store id, total orders and the number of orders sold through the `ONLINE` channel." }
  starter: |-
    SELECT store_id, count(*), count(*) FILTER (WHERE ___)
    FROM orders
    GROUP BY store_id
  solution: "SELECT store_id, count(*), count(*) FILTER (WHERE channel = 'ONLINE') FROM orders GROUP BY store_id"
  hint: { vi: "Điều kiện của riêng cột thứ ba nằm trong FILTER.", en: "The third column's own condition goes inside FILTER." }
- id: g-conditional-agg-2
  skill: conditional_agg
  kind: open
  task: { vi: "Mỗi tháng của năm 2026: tháng (ghi bằng ngày đầu tháng), số đơn `PAID`, số đơn `CANCELLED`, số đơn `REFUNDED` (ba cột đếm, theo thứ tự đó).", en: "Each month of 2026: the month (shown as its first day), the number of `PAID`, `CANCELLED` and `REFUNDED` orders (three count columns, in that order)." }
  solution: "SELECT date_trunc('month', order_date), count(*) FILTER (WHERE status = 'PAID'), count(*) FILTER (WHERE status = 'CANCELLED'), count(*) FILTER (WHERE status = 'REFUNDED') FROM orders WHERE order_date >= '2026-01-01' GROUP BY 1"
  hint: { vi: "Một nhóm mỗi tháng, mỗi trạng thái một cột đếm có điều kiện riêng.", en: "One group per month, one conditional count column per status." }
- id: g-conditional-agg-3
  skill: conditional_agg
  kind: trap
  task: { vi: "Mỗi kênh bán: kênh, tổng số đơn và số đơn bị hủy (`CANCELLED`).", en: "Each channel: the channel, total orders and the number of cancelled (`CANCELLED`) orders." }
  solution: "SELECT channel, count(*) AS orders, count(*) FILTER (WHERE status = 'CANCELLED') AS cancelled FROM orders GROUP BY channel"
  hint: { vi: "Cột tổng cần mọi đơn, nên điều kiện \"bị hủy\" không được nằm ở WHERE.", en: "The total column needs every order, so the \"cancelled\" condition must not be in WHERE." }
  wrong:
    - { sql: "SELECT channel, count(*) AS orders, count(*) AS cancelled FROM orders WHERE status = 'CANCELLED' GROUP BY channel", vi: "WHERE bỏ mọi đơn không bị hủy trước khi đếm, nên cột tổng cũng chỉ đếm đơn hủy.", en: "WHERE drops every order that is not cancelled before counting, so the total column only counts cancelled orders too." }
- id: g-conditional-agg-4
  skill: conditional_agg
  kind: review
  task: { vi: "Mỗi danh mục sản phẩm: số sản phẩm giá dưới 30.000 đồng và số sản phẩm giá từ 100.000 đồng trở lên. Lấy danh mục và hai con số.", en: "Each product category: the number of products under 30,000 VND and the number at 100,000 VND or more. Get the category and the two numbers." }
  solution: "SELECT category, COUNT(*) FILTER (WHERE price_vnd < 30000), COUNT(*) FILTER (WHERE price_vnd >= 100000) FROM products GROUP BY category"
  hint: { vi: "Một nhóm mỗi danh mục, hai phép đếm, mỗi phép chỉ đếm những dòng thỏa điều kiện riêng của nó.", en: "One group per category, two counts, each counting only the rows that meet its own condition." }

# ---- coalesce (ch5)
- id: g-coalesce-1
  skill: coalesce
  kind: faded
  task: { vi: "Mỗi đơn kênh `ONLINE` đặt từ 2026-10-25: mã đơn và ngày gửi hàng; đơn chưa gửi thì ghi ngày đặt.", en: "Each `ONLINE` order placed from 2026-10-25: the order id and the ship date; an order not shipped yet shows its order date." }
  starter: |-
    SELECT id, COALESCE(___, ___)
    FROM orders
    WHERE channel = 'ONLINE' AND order_date >= '2026-10-25'
  solution: "SELECT id, COALESCE(shipped_on, order_date) FROM orders WHERE channel = 'ONLINE' AND order_date >= '2026-10-25'"
  hint: { vi: "Giá trị đầu tiên không trống thắng: ngày gửi, rồi tới ngày đặt.", en: "The first non-empty value wins: the ship date, then the order date." }
- id: g-coalesce-2
  skill: coalesce
  kind: open
  task: { vi: "Đơn `ONLINE` đặt từ 2026-10-20 (tính cả ngày đó), bỏ đơn `CANCELLED`: mã đơn và số ngày giao = ngày giao trừ ngày đặt (`order_date`); đơn chưa giao (`delivered_on` trống) thì lấy 2026-10-31 thay cho ngày giao. Bài có thanh hiệu năng: câu đúng mà tốn hơn hẳn lời giải (như làm mất chỉ mục trên `orders`) chưa được tính là đạt.", en: "`ONLINE` orders placed on or after 2026-10-20, leaving out `CANCELLED` ones: order id and delivery days = delivery date minus order date (`order_date`); for an order not delivered yet (`delivered_on` empty), use 2026-10-31 as the delivery date. This drill has a performance bar: a right answer that costs far more than the Solution (such as losing the index on `orders`) does not pass." }
  solution: "SELECT id, COALESCE(delivered_on, DATE '2026-10-31') - order_date FROM orders WHERE channel = 'ONLINE' AND order_date >= '2026-10-20' AND status <> 'CANCELLED'"
  perf: { table: orders } # v25 R1 (L360): right but slow is not passed
  slow: "SELECT id, COALESCE(delivered_on, DATE '2026-10-31') - order_date FROM orders WHERE channel = 'ONLINE' AND COALESCE(order_date, DATE '2026-10-20') >= '2026-10-20' AND status <> 'CANCELLED'"
  hint: { vi: "Thay ngày giao trống bằng ngày 2026-10-31 trước khi trừ.", en: "Replace an empty delivery date with 2026-10-31 before subtracting." }
- id: g-coalesce-3
  skill: coalesce
  kind: trap
  task: { vi: "Khách đăng ký từ 2026-09-01 (tính cả ngày đó): mã khách và tuổi năm 2026 = 2026 trừ năm sinh; khách không rõ năm sinh (`birth_year` trống) thì cột tuổi ghi 0.", en: "Customers who signed up on or after 2026-09-01: customer id and age in 2026 = 2026 minus the birth year; for a customer with an unknown birth year (`birth_year` empty) the age column shows 0." }
  solution: "SELECT id, COALESCE(2026 - birth_year, 0) FROM customers WHERE signup_date >= '2026-09-01'"
  hint: { vi: "Phép tính với ô trống ra ô trống; thay kết quả trống bằng 0.", en: "Arithmetic with an empty value gives an empty value; replace the empty result with 0." }
  wrong:
    - { sql: "SELECT id, 2026 - birth_year FROM customers WHERE signup_date >= '2026-09-01'", vi: "Khách không rõ năm sinh ra tuổi trống thay vì 0: phép tính với NULL ra NULL.", en: "Customers with no birth year get an empty age instead of 0: arithmetic with NULL gives NULL." }
- id: g-coalesce-4
  skill: coalesce
  kind: review
  task: { vi: "Khách có mã từ 1 đến 40: tên và năm sinh; khách không rõ năm sinh thì ghi 0.", en: "Customers with ids 1 to 40: the name and the birth year; for a customer with an unknown birth year, show 0." }
  solution: "SELECT name, COALESCE(birth_year, 0) FROM customers WHERE id BETWEEN 1 AND 40"
  hint: { vi: "Một hàm lấy giá trị đầu tiên không trống trong danh sách: `birth_year`, rồi 0.", en: "One function takes the first non-empty value of a list: `birth_year`, then 0." }

# ---- cross_join (v25 R1, General only: content/general/skills-general.yml)
- id: g-cross-join-1
  skill: cross_join
  kind: faded
  task: { vi: "Lịch trực cho các cửa hàng ở `Da Nang`: mỗi cửa hàng với mỗi ngày từ 2026-10-29 tới 2026-10-31 (bảng lịch `dim_date`). Lấy tên cửa hàng và ngày, mọi cặp.", en: "A duty roster for the stores in `Da Nang`: each store with each day from 2026-10-29 to 2026-10-31 (calendar table `dim_date`). Get the store name and the date, every pair." }
  starter: |-
    SELECT s.name, d.date_key
    FROM stores s
    ___ dim_date d
    WHERE s.city = 'Da Nang' AND d.date_key BETWEEN '2026-10-29' AND '2026-10-31'
  solution: "SELECT s.name, d.date_key FROM stores s CROSS JOIN dim_date d WHERE s.city = 'Da Nang' AND d.date_key BETWEEN '2026-10-29' AND '2026-10-31'"
  hint: { vi: "Phép ghép không có điều kiện, đưa mỗi cửa hàng gặp mọi ngày.", en: "The join with no condition, which makes every store meet every day." }
- id: g-cross-join-2
  skill: cross_join
  kind: open
  task: { vi: "Mỗi cửa hàng ở `Da Nang` và mỗi ngày từ 2026-10-25 tới 2026-10-31: ngày, tên cửa hàng và số đơn (mọi trạng thái) của cửa hàng đó trong ngày đó. Ngày không có đơn vẫn có một dòng với số 0.", en: "Each store in `Da Nang` and each day from 2026-10-25 to 2026-10-31: the date, the store name and that store's number of orders (any status) that day. A day with no order still has a row with 0." }
  solution: "SELECT d.date_key, s.name, count(o.id) FROM dim_date d CROSS JOIN stores s LEFT JOIN orders o ON o.store_id = s.id AND o.order_date = d.date_key WHERE d.date_key BETWEEN '2026-10-25' AND '2026-10-31' AND s.city = 'Da Nang' GROUP BY d.date_key, s.name"
  hint: { vi: "Dựng lưới ngày × cửa hàng trước, rồi gắn đơn vào lưới sao cho ô trống còn lại; đếm một cột của đơn.", en: "Build the day × store grid first, then attach the orders so empty cells stay; count a column of the orders." }
- id: g-cross-join-3
  skill: cross_join
  kind: trap
  task: { vi: "Mọi cửa hàng với mọi tháng 2026-01-01, 2026-02-01, 2026-03-01 (các ngày đó trong `dim_date`): tên cửa hàng, tháng và chỉ tiêu `target_vnd` của tháng đó (bảng `store_targets`). Ô chưa có chỉ tiêu vẫn hiện, chỉ tiêu để trống.", en: "Every store with every month 2026-01-01, 2026-02-01, 2026-03-01 (those days in `dim_date`): the store name, the month and that month's `target_vnd` (table `store_targets`). A cell with no target still shows, with an empty target." }
  solution: "SELECT s.name, d.date_key, t.target_vnd FROM stores s CROSS JOIN dim_date d LEFT JOIN store_targets t ON t.store_id = s.id AND t.month = d.date_key WHERE d.date_key IN ('2026-01-01', '2026-02-01', '2026-03-01')"
  hint: { vi: "Lưới 5 cửa hàng × 3 tháng phải còn đủ 15 ô sau khi gắn chỉ tiêu.", en: "The 5 stores × 3 months grid must keep all 15 cells after the targets are attached." }
  wrong:
    - sql: "SELECT s.name, d.date_key, t.target_vnd FROM stores s CROSS JOIN dim_date d JOIN store_targets t ON t.store_id = s.id AND t.month = d.date_key WHERE d.date_key IN ('2026-01-01', '2026-02-01', '2026-03-01')"
      vi: "Gắn chỉ tiêu bằng phép nối thường bỏ mất các ô không có chỉ tiêu (Thao Dien trước tháng 3): 13 dòng thay vì 15. Dùng `LEFT JOIN` sau lưới."
      en: "Attaching targets with a plain join drops the cells with no target (Thao Dien before March): 13 rows instead of 15. Use `LEFT JOIN` after the grid."
- id: g-cross-join-4
  skill: cross_join
  kind: review
  task: { vi: "Kế hoạch trưng bày: mỗi sản phẩm nhóm `Snacks` phải có mặt ở mỗi cửa hàng tại `Da Nang`. Liệt kê mọi cặp: tên sản phẩm và tên cửa hàng.", en: "A display plan: every product in the `Snacks` category must be on show in every store in `Da Nang`. List every pair: the product name and the store name." }
  solution: "SELECT p.name, s.name FROM products p CROSS JOIN stores s WHERE p.category = 'Snacks' AND s.city = 'Da Nang'"
  hint: { vi: "Lọc từng bảng rồi ghép mọi cặp; 6 món × 2 cửa hàng.", en: "Filter each table, then pair everything; 6 items × 2 stores." }

# ---- self_join (ch5)
- id: g-self-join-1
  skill: self_join
  kind: faded
  task: { vi: "Mỗi nhân viên có quản lý: tên nhân viên và tên quản lý trực tiếp.", en: "Each staff member who has a manager: staff name and direct manager's name." }
  starter: "SELECT e.name, m.name FROM staff e JOIN staff m ON ___"
  solution: "SELECT e.name, m.name FROM staff e JOIN staff m ON m.id = e.manager_id"
  hint: { vi: "Bảng `staff` dùng hai lần với hai bí danh; quản lý là dòng có `id` bằng `manager_id` của nhân viên.", en: "Use `staff` twice with two aliases; the manager is the row whose `id` equals the employee's `manager_id`." }
- id: g-self-join-2
  skill: self_join
  kind: open
  task: { vi: "Nhân viên nào vào làm trước quản lý trực tiếp của mình? Lấy tên nhân viên và tên quản lý.", en: "Which staff members were hired before their direct manager? Get the staff name and the manager's name." }
  solution: "SELECT e.name, m.name FROM staff e JOIN staff m ON m.id = e.manager_id WHERE e.hired_on < m.hired_on"
  hint: { vi: "Sau khi nối nhân viên với quản lý, so hai cột `hired_on`.", en: "After joining staff to manager, compare the two `hired_on` columns." }
- id: g-self-join-3
  skill: self_join
  kind: trap
  task: { vi: "Mỗi nhân viên: tên nhân viên và tên cấp trên hai bậc (quản lý của quản lý trực tiếp); ai không có cấp trên hai bậc thì không tính.", en: "Each staff member: staff name and the name of the manager two levels up (the direct manager's manager); people without one are left out." }
  solution: "SELECT e.name, g.name FROM staff e JOIN staff m ON m.id = e.manager_id JOIN staff g ON g.id = m.manager_id"
  hint: { vi: "Cần nối `staff` ba lần: nhân viên, quản lý, rồi quản lý của quản lý.", en: "Join `staff` three times: employee, manager, then the manager's manager." }
  wrong:
    - { sql: "SELECT e.name, m.name FROM staff e JOIN staff m ON m.id = e.manager_id", vi: "Mới đi lên một bậc: đó là quản lý trực tiếp, chưa phải cấp trên hai bậc.", en: "This only goes up one level: that is the direct manager, not the manager two levels up." }
- id: g-self-join-4
  skill: self_join
  kind: review
  task: { vi: "Cặp nhân viên làm cùng cửa hàng và cùng vai trò: tên hai người, mỗi cặp một lần, người có mã nhỏ hơn đứng trước.", en: "Pairs of staff members at the same store with the same role: the two names, each pair once, the one with the smaller id first." }
  solution: "SELECT a.name, b.name FROM staff a JOIN staff b ON b.store_id = a.store_id AND b.role = a.role AND a.id < b.id"
  hint: { vi: "Dùng `staff` hai lần với hai bí danh; so mã bằng dấu nhỏ hơn để không ghép một người với chính mình và không lặp cặp.", en: "Use `staff` twice with two aliases; compare ids with less-than so nobody pairs with themselves and no pair repeats." }

# ---- string_fn (ch6)
- id: g-string-fn-1
  skill: string_fn
  kind: faded
  task: { vi: "Mỗi sản phẩm: tên viết hoa toàn bộ và số ký tự của tên.", en: "Each product: the name in capital letters and the number of characters in the name." }
  starter: "SELECT ___(name), ___(name) FROM products"
  solution: "SELECT upper(name), length(name) FROM products"
  hint: { vi: "Một hàm đổi sang chữ hoa, một hàm đếm ký tự.", en: "One function turns text to capitals, one counts characters." }
- id: g-string-fn-2
  skill: string_fn
  kind: open
  task: { vi: "Mỗi tên miền email của khách (phần sau dấu `@`): tên miền và số khách dùng, theo thứ tự đó; bỏ khách không có email (`email` trống).", en: "Each customer email domain (the part after `@`): the domain and the number of customers using it, in that order; leave out customers without an email (`email` empty)." }
  solution: "SELECT split_part(email, '@', 2), count(*) FROM customers WHERE email LIKE '%@%' GROUP BY 1"
  hint: { vi: "`split_part` cắt chuỗi theo một ký tự và lấy phần thứ n.", en: "`split_part` cuts text at a character and takes the n-th piece." }
- id: g-string-fn-3
  skill: string_fn
  kind: trap
  task: { vi: "Các đăng ký có mã từ 1 đến 12 trong `raw_signups`: mã và tên đã bỏ khoảng trắng thừa ở hai đầu, viết hoa chữ cái đầu mỗi từ.", en: "Sign-ups with ids 1 to 12 in `raw_signups`: id and the name with extra spaces removed from both ends, each word capitalised." }
  solution: "SELECT id, initcap(trim(full_name)) FROM raw_signups WHERE id <= 12"
  hint: { vi: "Chỉ bỏ khoảng trắng ở hai đầu, khoảng trắng giữa các từ phải giữ.", en: "Only remove spaces at both ends; the spaces between words must stay." }
  wrong:
    - { sql: "SELECT id, initcap(replace(full_name, ' ', '')) FROM raw_signups WHERE id <= 12", vi: "`replace` thay mọi chỗ, kể cả khoảng trắng giữa các từ, nên họ và tên dính liền. Dùng `trim`.", en: "`replace` swaps every occurrence, the spaces between words too, so the names run together. Use `trim`." }
- id: g-string-fn-4
  skill: string_fn
  kind: review
  task: { vi: "Mỗi cửa hàng: tên viết hoa toàn bộ và ba ký tự đầu của tên thành phố.", en: "Each store: the name in upper case and the first three characters of the city name." }
  solution: "SELECT upper(name), left(city, 3) FROM stores"
  hint: { vi: "Một hàm đổi chữ hoa, một hàm cắt lấy phần bên trái của chuỗi.", en: "One function upper-cases, one cuts the left part of a string." }

# ---- pattern_match (ch6)
- id: g-pattern-match-1
  skill: pattern_match
  kind: faded
  task: { vi: "Sản phẩm nào có chữ `tea` trong tên, bất kể hoa thường? Lấy tên.", en: "Which products have `tea` in the name, in any letter case? Get the name." }
  starter: "SELECT name FROM products WHERE name ILIKE ___"
  solution: "SELECT name FROM products WHERE name ILIKE '%tea%'"
  hint: { vi: "Đặt `%` ở cả hai đầu để khớp ở bất kỳ vị trí nào.", en: "Put `%` on both sides to match anywhere." }
- id: g-pattern-match-2
  skill: pattern_match
  kind: open
  task: { vi: "Khách dùng email đuôi `@gmail.com`: mã và email.", en: "Customers whose email ends in `@gmail.com`: id and email." }
  solution: "SELECT id, email FROM customers WHERE email LIKE '%@gmail.com'"
  hint: { vi: "Chỉ đặt `%` ở đầu mẫu: email phải kết thúc bằng phần đó.", en: "Put `%` only at the start of the pattern: the email must end with that part." }
- id: g-pattern-match-3
  skill: pattern_match
  kind: trap
  task: { vi: "Trong `raw_signups`: đăng ký có email (giữ nguyên, không làm sạch) kết thúc bằng `gmail.com`, chữ hoa hay thường đều tính. Không cần kiểm `@`; email có khoảng trắng thừa ở cuối thì không kết thúc bằng `gmail.com` nên không tính. Lấy mã và email.", en: "In `raw_signups`: sign-ups whose email (as stored, not cleaned) ends in `gmail.com`, upper or lower case both count. No need to check the `@`; an email with a trailing space does not end in `gmail.com`, so it does not count. Get the id and email." }
  solution: "SELECT id, email FROM raw_signups WHERE email ILIKE '%gmail.com'"
  hint: { vi: "Có email được nhập bằng chữ hoa.", en: "Some emails were typed in capital letters." }
  wrong:
    - { sql: "SELECT id, email FROM raw_signups WHERE email LIKE '%gmail.com'", vi: "LIKE phân biệt hoa thường, nên bỏ sót email viết hoa. Dùng ILIKE.", en: "LIKE is case-sensitive, so it misses the emails in capitals. Use ILIKE." }
- id: g-pattern-match-4
  skill: pattern_match
  kind: review
  task: { vi: "Khách nào có tên gọi (phần sau họ, ở cuối) là `Lan`? Lấy mã và tên đầy đủ.", en: "Which customers have the given name (the part after the family name, at the end) `Lan`? Get the id and the full name." }
  solution: "SELECT id, name FROM customers WHERE name LIKE '% Lan'"
  hint: { vi: "Mẫu khớp: bất kỳ ký tự nào, rồi một dấu cách, rồi đúng `Lan` ở cuối.", en: "A pattern: any characters, then a space, then exactly `Lan` at the end." }

# ---- distinct (ch6)
- id: g-distinct-1
  skill: distinct
  kind: faded
  task: { vi: "Những thành phố nào có khách hàng? Mỗi thành phố một dòng; khách chưa có thành phố (`city` trống) cũng cho một dòng trống.", en: "Which cities have customers? One row per city; customers with no city (`city` empty) also give one empty row." }
  starter: "SELECT ___ city FROM customers"
  solution: "SELECT DISTINCT city FROM customers"
  hint: { vi: "Một từ khóa sau SELECT bỏ các dòng trùng nhau.", en: "One keyword after SELECT drops duplicate rows." }
- id: g-distinct-2
  skill: distinct
  kind: open
  task: { vi: "Mỗi cửa hàng có bao nhiêu khách thành viên khác nhau từng mua (khách thành viên = `customer_id` của đơn có giá trị; mọi trạng thái đơn đều tính)? Lấy mã cửa hàng và số khách.", en: "How many different member customers have bought at each store (a member customer = the order has a `customer_id`; every order status counts)? Get the store id and the customer count." }
  solution: "SELECT store_id, count(DISTINCT customer_id) FROM orders GROUP BY store_id"
  hint: { vi: "Đếm khách, không đếm đơn: một khách mua nhiều lần chỉ tính một.", en: "Count customers, not orders: a customer who bought many times counts once." }
- id: g-distinct-3
  skill: distinct
  kind: trap
  task: { vi: "Trong tháng 10/2026 (đơn mọi trạng thái), mỗi kênh bán có bao nhiêu khách thành viên khác nhau? Lấy kênh và số khách.", en: "In October 2026 (orders of every status), how many different member customers did each sales channel have? Get the channel and the customer count." }
  solution: "SELECT channel, count(DISTINCT customer_id) FROM orders WHERE order_date >= '2026-10-01' AND order_date < '2026-11-01' GROUP BY channel"
  hint: { vi: "Một khách có thể đặt nhiều đơn trong tháng; chỉ đếm mỗi khách một lần.", en: "A customer can place several orders in the month; count each customer once." }
  wrong:
    - { sql: "SELECT channel, count(customer_id) FROM orders WHERE order_date >= '2026-10-01' AND order_date < '2026-11-01' GROUP BY channel", vi: "`count(customer_id)` đếm cả lần lặp, tức số đơn có khách, không phải số khách khác nhau.", en: "`count(customer_id)` counts the repeats too, that is orders with a customer, not different customers." }
- id: g-distinct-4
  skill: distinct
  kind: review
  task: { vi: "Mỗi ngày từ 25/10 đến 31/10/2026: có bao nhiêu khách khác nhau đặt đơn? Khách vãng lai (không có mã khách) không tính. Lấy ngày và số khách. Bài có thanh hiệu năng: câu đúng mà tốn hơn hẳn lời giải (như làm mất chỉ mục trên `orders`) chưa được tính là đạt.", en: "Each day from 2026-10-25 to 2026-10-31: how many different customers placed an order? Walk-in customers (no customer id) do not count. Get the date and the customer count. This drill has a performance bar: a right answer that costs far more than the Solution (such as losing the index on `orders`) does not pass." }
  solution: "SELECT order_date, COUNT(DISTINCT customer_id) FROM orders WHERE order_date >= '2026-10-25' AND order_date < '2026-11-01' GROUP BY order_date"
  perf: { table: orders } # v25 R1 (L360): right but slow is not passed
  slow: "SELECT order_date, COUNT(DISTINCT customer_id) FROM orders WHERE order_date::text >= '2026-10-25' AND order_date::text < '2026-11-01' GROUP BY order_date"
  hint: { vi: "Đếm mã khách không lặp trong mỗi ngày; phép đếm theo cột tự bỏ ô trống.", en: "Count each customer id once per day; counting a column skips empty cells by itself." }

# ---- cast (ch6)
- id: g-cast-1
  skill: cast
  kind: faded
  task: { vi: "Mỗi cửa hàng: mã cửa hàng và tỉ lệ phần trăm đơn của khách thành viên (`customer_id` có giá trị) trên tổng số đơn, làm tròn 2 chữ số.", en: "Each store: store id and the percentage of orders from member customers (`customer_id` filled in) out of all orders, rounded to 2 decimals." }
  starter: |-
    SELECT store_id,
      round(count(customer_id)::___ * 100 / count(*), 2)
    FROM orders
    GROUP BY store_id
  solution: "SELECT store_id, round(count(customer_id)::numeric * 100 / count(*), 2) FROM orders GROUP BY store_id"
  hint: { vi: "Đổi một vế sang kiểu số có phần thập phân trước khi chia.", en: "Cast one side to a decimal number type before dividing." }
- id: g-cast-2
  skill: cast
  kind: open
  task: { vi: "Mỗi đơn có mã từ 1 đến 20: mã đơn và số lượng trung bình mỗi dòng hàng = tổng `qty` chia số dòng của đơn trong `order_items`, làm tròn 2 chữ số thập phân.", en: "Each order with an id from 1 to 20: order id and the average quantity per line = total `qty` divided by the order's number of lines in `order_items`, rounded to 2 decimals." }
  solution: "SELECT order_id, round(sum(qty)::numeric / count(*), 2) FROM order_items WHERE order_id <= 20 GROUP BY order_id"
  hint: { vi: "Tổng số lượng là số nguyên; đổi sang `numeric` trước khi chia.", en: "The total quantity is an integer; cast it to `numeric` before dividing." }
- id: g-cast-3
  skill: cast
  kind: trap
  task: { vi: "Mỗi cửa hàng: mã cửa hàng và tỉ lệ đơn đã gửi hàng (`shipped_on` có giá trị) trên tổng số đơn, dạng số từ 0 đến 1, làm tròn 2 chữ số.", en: "Each store: store id and the share of orders already shipped (`shipped_on` filled in) out of all orders, as a number from 0 to 1, rounded to 2 decimals." }
  solution: "SELECT store_id, round(count(shipped_on)::numeric / count(*), 2) FROM orders GROUP BY store_id"
  hint: { vi: "Số nguyên chia số nguyên bỏ phần thập phân.", en: "An integer divided by an integer drops the decimals." }
  wrong:
    - { sql: "SELECT store_id, round(count(shipped_on) / count(*), 2) FROM orders GROUP BY store_id", vi: "Hai số đếm đều là số nguyên, nên phép chia ra 0 cho mọi cửa hàng. Đổi một vế sang `numeric`.", en: "Both counts are integers, so the division gives 0 for every store. Cast one side to `numeric`." }

- id: g-cast-4
  skill: cast
  kind: review
  task: { vi: "Mỗi món ăn vặt (danh mục `Snacks`): tên và giá tính theo nghìn đồng, làm tròn 1 chữ số thập phân.", en: "Each snack (category `Snacks`): the name and the price in thousands of VND, rounded to 1 decimal." }
  solution: "SELECT name, ROUND(price_vnd::numeric / 1000, 1) FROM products WHERE category = 'Snacks'"
  hint: { vi: "`price_vnd` là số nguyên: đổi sang `numeric` trước khi chia, nếu không phần lẻ bị cắt.", en: "`price_vnd` is an integer: convert it to `numeric` before dividing, or the fraction is cut off." }

# ---- scalar_subquery (ch7)
- id: g-scalar-subquery-1
  skill: scalar_subquery
  kind: faded
  task: { vi: "Sản phẩm nào đắt hơn giá trung bình của mọi sản phẩm? Lấy tên và giá.", en: "Which products cost more than the average price of all products? Get the name and the price." }
  starter: |-
    SELECT name, price_vnd
    FROM products
    WHERE price_vnd > (
      SELECT ___
      FROM products
    )
  solution: "SELECT name, price_vnd FROM products WHERE price_vnd > (SELECT AVG(price_vnd) FROM products)"
  hint: { vi: "Truy vấn con trả về đúng một con số: trung bình của `price_vnd`.", en: "The subquery returns exactly one number: the average of `price_vnd`." }
- id: g-scalar-subquery-2
  skill: scalar_subquery
  kind: open
  task: { vi: "Những đơn hàng nào được đặt vào ngày gần nhất có đơn trong dữ liệu? Lấy mã đơn, mã cửa hàng và ngày đặt.", en: "Which orders were placed on the latest order date in the data? Get the order id, the store id and the order date." }
  solution: "SELECT id, store_id, order_date FROM orders WHERE order_date = (SELECT MAX(order_date) FROM orders)"
  hint: { vi: "Tìm ngày lớn nhất của `order_date` trong một truy vấn con, rồi so với nó.", en: "Find the largest `order_date` in a subquery, then compare with it." }
- id: g-scalar-subquery-3
  skill: scalar_subquery
  kind: trap
  task: { vi: "Món ăn vặt (`Snacks`) nào rẻ hơn giá trung bình của chính nhóm ăn vặt? Lấy tên và giá.", en: "Which snacks (`Snacks`) are cheaper than the average price of the snacks themselves? Get the name and the price." }
  solution: "SELECT name, price_vnd FROM products WHERE category = 'Snacks' AND price_vnd < (SELECT AVG(price_vnd) FROM products WHERE category = 'Snacks')"
  hint: { vi: "Điều kiện nhóm phải viết cả trong truy vấn con.", en: "The category condition must be written inside the subquery too." }
  wrong:
    - sql: "SELECT name, price_vnd FROM products WHERE category = 'Snacks' AND price_vnd < (SELECT AVG(price_vnd) FROM products)"
      vi: "Truy vấn con đang tính trung bình của mọi sản phẩm. Điều kiện `category = 'Snacks'` của câu ngoài không áp vào truy vấn con: phải lọc lại bên trong."
      en: "The subquery averages every product. The outer `category = 'Snacks'` condition does not apply inside the subquery: filter again inside it."
- id: g-scalar-subquery-4
  skill: scalar_subquery
  kind: review
  task: { vi: "Những dòng hàng có số lượng bằng số lượng lớn nhất từng có trong một dòng hàng: mã đơn, số thứ tự dòng và số lượng.", en: "The order lines whose quantity equals the largest quantity ever seen on one line: the order id, the line number and the quantity." }
  solution: "SELECT order_id, line_no, qty FROM order_items WHERE qty = (SELECT MAX(qty) FROM order_items)"
  hint: { vi: "Tính số lượng lớn nhất trong một câu con trả về đúng một giá trị, rồi so từng dòng với nó.", en: "Compute the largest quantity in a sub-query that returns exactly one value, then compare each line with it." }

# ---- in_subquery (ch7)
- id: g-in-subquery-1
  skill: in_subquery
  kind: faded
  task: { vi: "Khách nào đã từng mua ở cửa hàng số 4 (Thao Dien)? Lấy mã và tên khách.", en: "Which customers have ever bought at store 4 (Thao Dien)? Get the customer id and name." }
  starter: |-
    SELECT id, name
    FROM customers
    WHERE id IN (
      SELECT ___
      FROM orders
      WHERE store_id = 4
    )
  solution: "SELECT id, name FROM customers WHERE id IN (SELECT customer_id FROM orders WHERE store_id = 4)"
  hint: { vi: "Truy vấn con trả về một cột: mã khách của các đơn ở cửa hàng 4.", en: "The subquery returns one column: the customer id of the orders at store 4." }
- id: g-in-subquery-2
  skill: in_subquery
  kind: open
  task: { vi: "Khách ở `Hue` nào có ít nhất một đơn mua online (`ONLINE`, mọi trạng thái) trong tháng 10/2026? Lấy tên và email.", en: "Which customers in `Hue` placed at least one online (`ONLINE`, any status) order in October 2026? Get the name and the email." }
  solution: "SELECT name, email FROM customers WHERE city = 'Hue' AND id IN (SELECT customer_id FROM orders WHERE channel = 'ONLINE' AND order_date >= '2026-10-01' AND order_date < '2026-11-01')"
  hint: { vi: "Lọc đơn online của tháng 10 trong truy vấn con, rồi giữ khách có mã nằm trong danh sách đó.", en: "Filter October's online orders in the subquery, then keep the customers whose id is in that list." }
- id: g-in-subquery-3
  skill: in_subquery
  kind: trap
  task: { vi: "Khách nào chưa từng có đơn ở cửa hàng số 3 (Ben Thanh)? Xét mọi dòng của `customers`, kể cả khách chưa có đơn nào. Lấy mã và tên khách. Lưu ý: đơn khách vãng lai có `customer_id` trống.", en: "Which customers have never had an order at store 3 (Ben Thanh)? Consider every row of `customers`, including customers with no orders at all. Get the customer id and name. Note: walk-in orders have an empty `customer_id`." }
  solution: "SELECT id, name FROM customers WHERE id NOT IN (SELECT customer_id FROM orders WHERE store_id = 3 AND customer_id IS NOT NULL)"
  hint: { vi: "Danh sách trong truy vấn con có ô trống (NULL) thì phép phủ định không giữ dòng nào.", en: "If the subquery's list holds an empty value (NULL), the negated test keeps no rows." }
  wrong:
    - sql: "SELECT id, name FROM customers WHERE id NOT IN (SELECT customer_id FROM orders WHERE store_id = 3)"
      vi: "Ra 0 dòng: danh sách có `NULL` từ đơn khách vãng lai ở cửa hàng 3, và `NOT IN` với `NULL` không bao giờ đúng. Lọc `customer_id IS NOT NULL` trong truy vấn con, hoặc dùng `NOT EXISTS`."
      en: "0 rows: the list holds `NULL` from store 3's walk-in orders, and `NOT IN` against `NULL` is never true. Filter `customer_id IS NOT NULL` inside the subquery, or use `NOT EXISTS`."
- id: g-in-subquery-4
  skill: in_subquery
  kind: review
  task: { vi: "Sản phẩm nào có mặt trong một đơn của cửa hàng 4 ngày 31/10/2026? Lấy tên và danh mục.", en: "Which products appear in an order of store 4 on 2026-10-31? Get the name and the category." }
  solution: "SELECT name, category FROM products WHERE id IN (SELECT product_id FROM order_items WHERE order_id IN (SELECT id FROM orders WHERE store_id = 4 AND order_date = '2026-10-31'))"
  hint: { vi: "Đi từ trong ra: các đơn của cửa hàng 4 hôm đó, rồi các sản phẩm của những đơn ấy.", en: "Work from the inside out: store 4's orders that day, then the products of those orders." }

# ---- any_all (v25 R1, General only: content/general/skills-general.yml)
- id: g-any-all-1
  skill: any_all
  kind: faded
  task: { vi: "Món nào đắt hơn mọi món nhóm `Household`? Lấy tên và giá.", en: "Which items cost more than every item in the `Household` category? Get the name and the price." }
  starter: |-
    SELECT name, price_vnd
    FROM products
    WHERE price_vnd > ___ (SELECT price_vnd FROM products WHERE category = 'Household')
  solution: "SELECT name, price_vnd FROM products WHERE price_vnd > ALL (SELECT price_vnd FROM products WHERE category = 'Household')"
  hint: { vi: "\"Hơn mọi giá trị\" của danh sách, không phải \"hơn ít nhất một\".", en: "\"More than every value\" of the list, not \"more than at least one\"." }
- id: g-any-all-2
  skill: any_all
  kind: open
  task: { vi: "Món văn phòng phẩm (`Stationery`) nào đắt hơn ít nhất một món nhóm `Snacks`? Lấy tên và giá.", en: "Which stationery items (`Stationery`) cost more than at least one item in the `Snacks` category? Get the name and the price." }
  solution: "SELECT name, price_vnd FROM products WHERE category = 'Stationery' AND price_vnd > ANY (SELECT price_vnd FROM products WHERE category = 'Snacks')"
  hint: { vi: "So giá với cả danh sách giá ăn vặt; chỉ cần thắng một món.", en: "Compare the price with the whole list of snack prices; beating one item is enough." }
- id: g-any-all-3
  skill: any_all
  kind: trap
  task: { vi: "Trong các khách có mã từ 1 đến 60 ở `Can Tho`, ai sinh cùng năm hoặc muộn hơn mọi khách ở `Hanoi` đã biết năm sinh? Lấy mã, tên và năm sinh.", en: "Among the customers with an id from 1 to 60 in `Can Tho`, who was born in the same year as, or later than, every `Hanoi` customer whose birth year is known? Get the id, the name and the birth year." }
  solution: "SELECT id, name, birth_year FROM customers WHERE id <= 60 AND city = 'Can Tho' AND birth_year >= ALL (SELECT birth_year FROM customers WHERE city = 'Hanoi' AND birth_year IS NOT NULL)"
  hint: { vi: "Danh sách năm sinh ở Hà Nội có ô trống; một ô trống làm phép so với mọi giá trị không bao giờ đúng.", en: "The list of Hanoi birth years has empty cells; one empty cell keeps a comparison with every value from ever being true." }
  wrong:
    - sql: "SELECT id, name, birth_year FROM customers WHERE id <= 60 AND city = 'Can Tho' AND birth_year >= ALL (SELECT birth_year FROM customers WHERE city = 'Hanoi')"
      vi: "4 khách Hà Nội không có năm sinh, và so với ô trống là \"không biết\", nên `>= ALL` không đúng với ai: 0 dòng. Lọc `birth_year IS NOT NULL` trong truy vấn con."
      en: "4 Hanoi customers have no birth year, and comparing with an empty cell is \"unknown\", so `>= ALL` is true for nobody: 0 rows. Filter `birth_year IS NOT NULL` in the subquery."
- id: g-any-all-4
  skill: any_all
  kind: review
  task: { vi: "Nhân viên nào được tuyển sau ngày khai trương của mọi cửa hàng? Lấy tên và ngày tuyển (`hired_on`).", en: "Which staff were hired after the opening day of every store? Get the name and the hiring date (`hired_on`)." }
  solution: "SELECT name, hired_on FROM staff WHERE hired_on > ALL (SELECT opened_on FROM stores)"
  hint: { vi: "So ngày tuyển với cả danh sách ngày khai trương; phải sau tất cả.", en: "Compare the hiring date with the whole list of opening days; it must come after all of them." }

# ---- exists (ch7)
- id: g-exists-1
  skill: exists
  kind: faded
  task: { vi: "Khách nào có ít nhất một đơn bị hoàn tiền (`REFUNDED`)? Lấy mã và tên khách.", en: "Which customers have at least one refunded (`REFUNDED`) order? Get the customer id and name." }
  starter: |-
    SELECT c.id, c.name
    FROM customers c
    WHERE EXISTS (
      SELECT 1
      FROM orders o
      WHERE o.customer_id = ___ AND o.status = 'REFUNDED'
    )
  solution: "SELECT c.id, c.name FROM customers c WHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id AND o.status = 'REFUNDED')"
  hint: { vi: "Nối đơn trong truy vấn con với khách của câu ngoài qua mã khách.", en: "Link the order in the subquery to the outer customer by the customer id." }
- id: g-exists-2
  skill: exists
  kind: open
  task: { vi: "Khách nào chưa từng mua online (`ONLINE`)? Xét mọi dòng của `customers`, kể cả khách chưa có đơn nào. Lấy mã, tên và thành phố.", en: "Which customers have never bought online (`ONLINE`)? Consider every row of `customers`, including customers with no orders at all. Get the id, name and city." }
  solution: "SELECT c.id, c.name, c.city FROM customers c WHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id AND o.channel = 'ONLINE')"
  hint: { vi: "Hỏi \"không tồn tại đơn online nào của khách này\".", en: "Ask \"there is no online order of this customer\"." }
- id: g-exists-3
  skill: exists
  kind: trap
  task: { vi: "Khách nào đã từng mua ở cửa hàng số 2 (Son Tra)? Lấy mã và tên khách. Bài có thanh hiệu năng: câu đúng mà tốn hơn hẳn lời giải (như làm mất chỉ mục trên `orders`) chưa được tính là đạt.", en: "Which customers have ever bought at store 2 (Son Tra)? Get the customer id and name. This drill has a performance bar: a right answer that costs far more than the Solution (such as losing the index on `orders`) does not pass." }
  solution: "SELECT c.id, c.name FROM customers c WHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id AND o.store_id = 2)"
  perf: { table: orders } # v25 R1 (L360): right but slow is not passed
  slow: "SELECT c.id, c.name FROM customers c WHERE (SELECT count(*) FROM orders o WHERE o.customer_id = c.id AND o.store_id = 2) > 0"
  hint: { vi: "Truy vấn con phải hỏi về đúng khách đang xét ở câu ngoài.", en: "The subquery must ask about the very customer of the outer row." }
  wrong:
    - sql: "SELECT c.id, c.name FROM customers c WHERE EXISTS (SELECT 1 FROM orders o WHERE o.store_id = 2)"
      vi: "Thiếu điều kiện `o.customer_id = c.id`: truy vấn con hỏi cả bảng đơn, đúng cho mọi khách, nên ra cả 300 khách."
      en: "The `o.customer_id = c.id` link is missing: the subquery asks about the whole order table, true for every customer, so you get all 300 customers."
- id: g-exists-4
  skill: exists
  kind: review
  task: { vi: "Cửa hàng nào có ít nhất một nhân viên kho (vai trò `Stock clerk`)? Lấy tên cửa hàng.", en: "Which stores have at least one stock clerk (role `Stock clerk`)? Get the store name." }
  solution: "SELECT s.name FROM stores s WHERE EXISTS (SELECT 1 FROM staff e WHERE e.store_id = s.id AND e.role = 'Stock clerk')"
  hint: { vi: "Với mỗi cửa hàng, hỏi \"có dòng nào trong `staff` của cửa hàng này với vai trò đó không?\".", en: "For each store, ask \"is there a row in `staff` for this store with that role?\"." }

# ---- correlated_value (ch7)
- id: g-correlated-value-1
  skill: correlated_value
  kind: faded
  task: { vi: "Với mỗi cửa hàng, ngày đặt đơn gần nhất là ngày nào? Lấy tên cửa hàng và ngày đó.", en: "For each store, what is its latest order date? Get the store name and that date." }
  starter: |-
    SELECT s.name, (
      SELECT MAX(o.order_date)
      FROM orders o
      WHERE o.store_id = ___
    )
    FROM stores s
  solution: "SELECT s.name, (SELECT MAX(o.order_date) FROM orders o WHERE o.store_id = s.id) FROM stores s"
  hint: { vi: "Truy vấn con dùng mã của cửa hàng đang xét ở câu ngoài.", en: "The subquery uses the id of the store of the outer row." }
- id: g-correlated-value-2
  skill: correlated_value
  kind: open
  task: { vi: "Mỗi khách ở `Can Tho` có bao nhiêu đơn? Lấy tên khách và số đơn; khách chưa có đơn ghi 0.", en: "How many orders does each customer in `Can Tho` have? Get the customer name and the order count; a customer with no orders shows 0." }
  solution: "SELECT c.name, (SELECT COUNT(*) FROM orders o WHERE o.customer_id = c.id) FROM customers c WHERE c.city = 'Can Tho'"
  hint: { vi: "Một truy vấn con đếm đơn cho từng khách; đếm trên tập rỗng ra 0.", en: "A subquery counts the orders of each customer; counting an empty set gives 0." }
- id: g-correlated-value-3
  skill: correlated_value
  kind: trap
  task: { vi: "Các đơn tháng 10/2026 (mọi trạng thái) của khách số 14, 21, 28 và 35: mã đơn và thành phố của khách tại ngày đặt đơn, theo lịch sử `dim_customer` (một khách có thể có nhiều phiên bản; mỗi phiên bản có hiệu lực từ `valid_from`, tới trước `valid_to`; `valid_to` trống là hiện tại). Khách không có đơn trong tháng thì không có dòng.", en: "The October 2026 orders (every status) of customers 14, 21, 28 and 35: order id and the customer's city on the order date, from the `dim_customer` history (a customer can have several versions; each is valid from `valid_from` until before `valid_to`; an empty `valid_to` means current). A customer with no order that month has no row." }
  solution: "SELECT o.id, (SELECT d.city FROM dim_customer d WHERE d.customer_id = o.customer_id AND o.order_date >= d.valid_from AND (d.valid_to IS NULL OR o.order_date < d.valid_to)) FROM orders o WHERE o.customer_id IN (14, 21, 28, 35) AND o.order_date >= '2026-10-01' AND o.order_date < '2026-11-01'"
  hint: { vi: "Truy vấn con chỉ được trả một dòng: thêm điều kiện ngày đặt đơn nằm trong khoảng hiệu lực.", en: "The subquery may return only one row: add the condition that the order date falls in the validity range." }
  wrong:
    - sql: "SELECT o.id, (SELECT d.city FROM dim_customer d WHERE d.customer_id = o.customer_id) FROM orders o WHERE o.customer_id IN (14, 21, 28, 35) AND o.order_date >= '2026-10-01' AND o.order_date < '2026-11-01'"
      vi: "Thiếu điều kiện ngày hiệu lực: khách đã chuyển nhà có hai dòng lịch sử, truy vấn con trả hai dòng và Postgres báo lỗi more than one row returned by a subquery."
      en: "The validity-date condition is missing: a customer who moved has two history rows, the subquery returns two rows and Postgres reports more than one row returned by a subquery."
- id: g-correlated-value-4
  skill: correlated_value
  kind: review
  task: { vi: "Mỗi cửa hàng: tên và số nhân viên của cửa hàng đó, tính ngay trong danh sách cột.", en: "Each store: the name and its number of staff, computed right in the column list." }
  solution: "SELECT s.name, (SELECT COUNT(*) FROM staff e WHERE e.store_id = s.id) FROM stores s"
  hint: { vi: "Một câu con trong danh sách cột, đếm `staff` có `store_id` bằng mã của cửa hàng ở câu ngoài.", en: "A sub-query in the column list that counts the `staff` rows whose `store_id` equals the outer store's id." }

# ---- cte (ch8)
- id: g-cte-1
  skill: cte
  kind: faded
  task: { vi: "Đơn nào có tổng tiền đã thanh toán (cộng mọi dòng trong `payments`) trên 1.000.000 đồng? Lấy mã đơn và tổng đó.", en: "Which orders have total payments (all their rows in `payments` added up) above 1,000,000 VND? Get the order id and that total." }
  starter: |-
    WITH paid AS (
      SELECT order_id, SUM(amount_vnd) AS total
      FROM payments
      GROUP BY ___
    )
    SELECT order_id, total
    FROM paid
    WHERE total > 1000000
  solution: "WITH paid AS (SELECT order_id, SUM(amount_vnd) AS total FROM payments GROUP BY order_id) SELECT order_id, total FROM paid WHERE total > 1000000"
  hint: { vi: "Bước đặt tên cộng tiền theo từng đơn; câu chính chỉ lọc kết quả của bước đó.", en: "The named step totals the money per order; the main query only filters that step's result." }
- id: g-cte-2
  skill: cte
  kind: open
  task: { vi: "Cửa hàng nào có doanh số tháng 10/2026 (tổng số lượng × đơn giá của đơn `PAID`) trên 10.000.000 đồng? Lấy tên cửa hàng và doanh số.", en: "Which stores had October 2026 sales (sum of quantity × unit price over `PAID` orders) above 10,000,000 VND? Get the store name and the sales." }
  solution: "WITH sales AS (SELECT o.store_id, SUM(i.qty * i.unit_price_vnd) AS total FROM orders o JOIN order_items i ON i.order_id = o.id WHERE o.status = 'PAID' AND o.order_date >= '2026-10-01' AND o.order_date < '2026-11-01' GROUP BY o.store_id) SELECT s.name, sales.total FROM sales JOIN stores s ON s.id = sales.store_id WHERE sales.total > 10000000"
  hint: { vi: "Tính doanh số theo cửa hàng trong một bước có tên, rồi nối với `stores` để lấy tên.", en: "Compute sales per store in a named step, then join `stores` for the name." }
- id: g-cte-3
  skill: cte
  kind: trap
  task: { vi: "Với mỗi đơn đặt trong tháng 10/2026 (mọi trạng thái) có ít nhất một khoản trong `payments`: mã đơn, tổng giá trị hàng (cộng `qty` × `unit_price_vnd` mọi dòng hàng của đơn) và tổng tiền đã thanh toán (cộng mọi `amount_vnd` của đơn, kể cả khoản âm).", en: "For each order placed in October 2026 (every status) that has at least one row in `payments`: order id, the goods value (`qty` × `unit_price_vnd` added up over the order's lines) and the total paid (all of the order's `amount_vnd` added up, negative ones included)." }
  solution: "WITH items AS (SELECT order_id, SUM(qty * unit_price_vnd) AS goods FROM order_items GROUP BY order_id), paid AS (SELECT order_id, SUM(amount_vnd) AS paid FROM payments GROUP BY order_id) SELECT o.id, items.goods, paid.paid FROM orders o JOIN items ON items.order_id = o.id JOIN paid ON paid.order_id = o.id WHERE o.order_date >= '2026-10-01' AND o.order_date < '2026-11-01'"
  hint: { vi: "Cộng hàng theo đơn và cộng tiền theo đơn ở hai bước riêng, rồi mới nối.", en: "Total the goods per order and the payments per order in two separate steps, then join." }
  wrong:
    - sql: "SELECT o.id, SUM(i.qty * i.unit_price_vnd), SUM(p.amount_vnd) FROM orders o JOIN order_items i ON i.order_id = o.id JOIN payments p ON p.order_id = o.id WHERE o.order_date >= '2026-10-01' AND o.order_date < '2026-11-01' GROUP BY o.id"
      vi: "Nối thẳng dòng hàng với thanh toán rồi mới cộng: đơn có 3 dòng hàng thì tiền thanh toán bị cộng 3 lần, đơn có 2 khoản thanh toán thì giá trị hàng bị cộng 2 lần."
      en: "Joining goods lines to payments before adding up: an order with 3 lines has its payment counted 3 times, an order with 2 payments has its goods counted twice."
- id: g-cte-4
  skill: cte
  kind: review
  task: { vi: "Phân bố khách theo số đơn đã thanh toán (`PAID`): bao nhiêu khách có 1 đơn, bao nhiêu khách có 2 đơn, và cứ thế? Đơn của khách vãng lai không tính. Lấy số đơn và số khách.", en: "Customers by their number of paid orders (`PAID`): how many customers have 1 order, how many have 2, and so on? Walk-in orders do not count. Get the order count and the customer count." }
  solution: "WITH c AS (SELECT customer_id, COUNT(*) AS n FROM orders WHERE status = 'PAID' AND customer_id IS NOT NULL GROUP BY customer_id) SELECT n, COUNT(*) FROM c GROUP BY n"
  hint: { vi: "Bước 1 (đặt tên): số đơn của mỗi khách. Bước 2: gom bước 1 theo số đơn.", en: "Step 1 (give it a name): each customer's order count. Step 2: group step 1 by that count." }

# ---- multi_cte (ch8)
- id: g-multi-cte-1
  skill: multi_cte
  kind: faded
  task: { vi: "Tháng nào của năm 2026 có doanh số cao nhất (tổng số lượng × đơn giá của đơn `PAID`)? Lấy tháng và doanh số.", en: "Which month of 2026 had the highest sales (sum of quantity × unit price over `PAID` orders)? Get the month and the sales." }
  starter: |-
    WITH m AS (
      SELECT date_trunc('month', o.order_date) AS month,
        SUM(i.qty * i.unit_price_vnd) AS sales
      FROM orders o
      JOIN order_items i ON i.order_id = o.id
      WHERE o.status = 'PAID' AND o.order_date >= '2026-01-01'
      GROUP BY 1
    ), best AS (
      SELECT ___ AS sales
      FROM m
    )
    SELECT m.month, m.sales
    FROM m
    JOIN best ON best.sales = m.sales
  solution: "WITH m AS (SELECT date_trunc('month', o.order_date) AS month, SUM(i.qty * i.unit_price_vnd) AS sales FROM orders o JOIN order_items i ON i.order_id = o.id WHERE o.status = 'PAID' AND o.order_date >= '2026-01-01' GROUP BY 1), best AS (SELECT MAX(sales) AS sales FROM m) SELECT m.month, m.sales FROM m JOIN best ON best.sales = m.sales"
  hint: { vi: "Bước thứ hai đọc kết quả của bước thứ nhất và lấy giá trị lớn nhất.", en: "The second step reads the first step's result and takes the largest value." }
- id: g-multi-cte-2
  skill: multi_cte
  kind: open
  task: { vi: "Cửa hàng nào có doanh số tháng 10/2026 (cộng `qty` × `unit_price_vnd` của đơn `PAID`) cao hơn trung bình doanh số của các cửa hàng có bán trong tháng đó (tháng này cả 5 cửa hàng đều có bán)? Lấy mã cửa hàng và doanh số.", en: "Which stores had October 2026 sales (`qty` × `unit_price_vnd` added up over `PAID` orders) above the average sales of the stores that sold that month (all 5 stores sold that month)? Get the store id and the sales." }
  solution: "WITH sales AS (SELECT o.store_id, SUM(i.qty * i.unit_price_vnd) AS total FROM orders o JOIN order_items i ON i.order_id = o.id WHERE o.status = 'PAID' AND o.order_date >= '2026-10-01' AND o.order_date < '2026-11-01' GROUP BY o.store_id), avg_sales AS (SELECT AVG(total) AS a FROM sales) SELECT sales.store_id, sales.total FROM sales, avg_sales WHERE sales.total > avg_sales.a"
  hint: { vi: "Một bước tính doanh số mỗi cửa hàng, bước sau tính trung bình của bước đó.", en: "One step computes each store's sales, the next step averages that step." }
- id: g-multi-cte-3
  skill: multi_cte
  kind: trap
  task: { vi: "Mỗi nhóm hàng (`category`) chiếm bao nhiêu phần trăm doanh số năm 2026 (đơn `PAID` có `order_date` từ 2026-01-01; doanh số = `qty` × `unit_price_vnd`)? Mẫu số là tổng doanh số của mọi nhóm hàng. Lấy nhóm hàng và phần trăm (thang 0–100), chỉ làm tròn 1 chữ số thập phân ở kết quả cuối.", en: "What percentage of 2026 sales (`PAID` orders with `order_date` from 2026-01-01; sales = `qty` × `unit_price_vnd`) does each `category` make? The base is the total sales of all categories. Get the category and the percentage (0–100 scale), rounded to 1 decimal only on the final figure." }
  solution: "WITH by_cat AS (SELECT p.category, SUM(i.qty * i.unit_price_vnd) AS sales FROM orders o JOIN order_items i ON i.order_id = o.id JOIN products p ON p.id = i.product_id WHERE o.status = 'PAID' AND o.order_date >= '2026-01-01' GROUP BY p.category), total AS (SELECT SUM(sales) AS t FROM by_cat) SELECT by_cat.category, ROUND(100.0 * by_cat.sales / total.t, 1) FROM by_cat, total"
  hint: { vi: "Hai bước đặt tên, cách nhau bằng dấu phẩy, sau một chữ WITH duy nhất.", en: "Two named steps, separated by a comma, after a single WITH." }
  wrong:
    - sql: "WITH by_cat AS (SELECT p.category, SUM(i.qty * i.unit_price_vnd) AS sales FROM orders o JOIN order_items i ON i.order_id = o.id JOIN products p ON p.id = i.product_id WHERE o.status = 'PAID' AND o.order_date >= '2026-01-01' GROUP BY p.category) WITH total AS (SELECT SUM(sales) AS t FROM by_cat) SELECT by_cat.category, ROUND(100.0 * by_cat.sales / total.t, 1) FROM by_cat, total"
      vi: "Viết `WITH` hai lần là lỗi cú pháp. Chỉ một `WITH` ở đầu, các bước sau nối bằng dấu phẩy."
      en: "Writing `WITH` twice is a syntax error. One `WITH` at the start, the later steps joined with commas."
- id: g-multi-cte-4
  skill: multi_cte
  kind: review
  task: { vi: "Tháng 10/2026, danh mục nào có doanh thu đơn đã thanh toán (`PAID`) thấp nhất? Doanh thu một dòng hàng = số lượng × đơn giá. Lấy danh mục và doanh thu.", en: "In October 2026, which category had the lowest paid-order (`PAID`) revenue? The revenue of an order line = quantity × unit price. Get the category and the revenue." }
  solution: "WITH by_cat AS (SELECT p.category, SUM(i.qty * i.unit_price_vnd) AS sales FROM orders o JOIN order_items i ON i.order_id = o.id JOIN products p ON p.id = i.product_id WHERE o.status = 'PAID' AND o.order_date >= '2026-10-01' AND o.order_date < '2026-11-01' GROUP BY p.category), worst AS (SELECT MIN(sales) AS sales FROM by_cat) SELECT by_cat.category, by_cat.sales FROM by_cat JOIN worst ON worst.sales = by_cat.sales"
  hint: { vi: "Hai bước có tên: doanh thu mỗi danh mục, rồi mức thấp nhất của bước đó; cuối cùng ghép hai bước.", en: "Two named steps: revenue per category, then the lowest value of that step; finally join the two." }

# ---- distinct_on (ch8)
- id: g-distinct-on-1
  skill: distinct_on
  kind: faded
  task: { vi: "Với mỗi khách có mã từ 1 đến 20, đơn mới nhất là đơn nào? Lấy mã khách, mã đơn và ngày đặt; cùng ngày thì lấy mã đơn lớn hơn. Bài có thanh hiệu năng: câu đúng mà tốn hơn hẳn lời giải (như làm mất chỉ mục trên `orders`) chưa được tính là đạt.", en: "For each customer with id 1 to 20, which is their latest order? Get the customer id, order id and order date; on the same day take the larger order id. This drill has a performance bar: a right answer that costs far more than the Solution (such as losing the index on `orders`) does not pass." }
  starter: |-
    SELECT DISTINCT ON (customer_id) customer_id, id, order_date
    FROM orders
    WHERE customer_id BETWEEN 1 AND 20
    ORDER BY customer_id, ___
  solution: "SELECT DISTINCT ON (customer_id) customer_id, id, order_date FROM orders WHERE customer_id BETWEEN 1 AND 20 ORDER BY customer_id, order_date DESC, id DESC"
  perf: { table: orders } # v25 R1 (L360): right but slow is not passed
  slow: "SELECT customer_id, id, order_date FROM orders o WHERE customer_id BETWEEN 1 AND 20 AND id = (SELECT x.id FROM orders x WHERE x.customer_id = o.customer_id ORDER BY x.order_date DESC, x.id DESC LIMIT 1)"
  hint: { vi: "Sau cột của DISTINCT ON, sắp xếp sao cho dòng muốn giữ lên đầu mỗi nhóm.", en: "After the DISTINCT ON column, sort so the row you want to keep comes first in each group." }
- id: g-distinct-on-2
  skill: distinct_on
  kind: open
  task: { vi: "Mỗi nhóm hàng có sản phẩm đắt nhất là gì? Lấy nhóm hàng, tên và giá; bằng giá thì lấy tên đứng trước theo A→Z.", en: "What is the most expensive product in each category? Get the category, the name and the price; on equal prices, take the name that comes first A→Z." }
  solution: "SELECT DISTINCT ON (category) category, name, price_vnd FROM products ORDER BY category, price_vnd DESC, name"
  hint: { vi: "Một dòng cho mỗi nhóm hàng; dòng giữ lại là dòng giá cao nhất.", en: "One row per category; the row kept is the highest price." }
- id: g-distinct-on-3
  skill: distinct_on
  kind: trap
  task: { vi: "Mỗi cửa hàng có đơn online (`ONLINE`) gần đây nhất là đơn nào? Lấy mã cửa hàng, mã đơn và ngày đặt; cùng ngày thì lấy mã đơn lớn hơn.", en: "What is each store's most recent online (`ONLINE`) order? Get the store id, order id and order date; on the same day take the larger order id." }
  solution: "SELECT DISTINCT ON (store_id) store_id, id, order_date FROM orders WHERE channel = 'ONLINE' ORDER BY store_id, order_date DESC, id DESC"
  hint: { vi: "\"Gần đây nhất\" nghĩa là ngày lớn nhất phải lên đầu nhóm.", en: "\"Most recent\" means the largest date must come first in its group." }
  wrong:
    - sql: "SELECT DISTINCT ON (store_id) store_id, id, order_date FROM orders WHERE channel = 'ONLINE' ORDER BY store_id, order_date, id"
      vi: "Thiếu `DESC`: thứ tự tăng dần đưa đơn cũ nhất lên đầu, nên mỗi cửa hàng giữ đơn online đầu tiên chứ không phải gần nhất."
      en: "`DESC` is missing: ascending order puts the oldest order first, so each store keeps its first online order, not its latest."
- id: g-distinct-on-4
  skill: distinct_on
  kind: review
  task: { vi: "Mỗi cửa hàng: nhân viên vào làm sớm nhất (cùng ngày thì mã nhỏ hơn). Lấy mã cửa hàng, tên và ngày vào làm. Nhân viên không thuộc cửa hàng nào không tính.", en: "Each store: the staff member hired first (same day: the smaller id). Get the store id, the name and the hire date. Staff who belong to no store do not count." }
  solution: "SELECT DISTINCT ON (store_id) store_id, name, hired_on FROM staff WHERE store_id IS NOT NULL ORDER BY store_id, hired_on, id"
  hint: { vi: "Một dòng mỗi `store_id`: dòng đầu tiên theo `hired_on` tăng dần, rồi `id`.", en: "One row per `store_id`: the first row by `hired_on` ascending, then `id`." }

# ---- union (ch9)
- id: g-union-1
  skill: union
  kind: faded
  task: { vi: "Liệt kê mọi thành phố có cửa hàng hoặc có khách (mỗi thành phố một lần, bỏ thành phố trống).", en: "List every city that has a store or a customer (each city once, leave out empty cities)." }
  starter: |-
    SELECT city
    FROM stores
    UNION
    SELECT ___
    FROM customers
    WHERE city IS NOT NULL
  solution: "SELECT city FROM stores UNION SELECT city FROM customers WHERE city IS NOT NULL"
  hint: { vi: "Hai câu SELECT cần cùng số cột, cùng ý nghĩa.", en: "Both SELECTs need the same number of columns with the same meaning." }
- id: g-union-2
  skill: union
  kind: open
  task: { vi: "Một danh sách người cho buổi gặp ở `Ben Thanh`: tên nhân viên cửa hàng số 3 (loại 1) và tên khách ở `Ho Chi Minh City` đăng ký từ 01/10/2026 (loại 2). Lấy tên và loại; mỗi người một dòng, hai người trùng tên vẫn giữ cả hai.", en: "One guest list for a meeting at `Ben Thanh`: the names of store 3's staff (type 1) and of customers in `Ho Chi Minh City` who signed up from 2026-10-01 (type 2). Get the name and the type; one row per person, two people with the same name both stay." }
  solution: "SELECT name, 1 FROM staff WHERE store_id = 3 UNION ALL SELECT name, 2 FROM customers WHERE city = 'Ho Chi Minh City' AND signup_date >= '2026-10-01'"
  hint: { vi: "Mỗi câu SELECT có WHERE riêng và tự đặt cột loại bằng một con số.", en: "Each SELECT has its own WHERE and sets the type column with a number." }
- id: g-union-3
  skill: union
  kind: trap
  task: { vi: "Liệt kê nhóm hàng của từng dòng hàng bán ngày 30/10/2026 ở cửa hàng 1, nối tiếp bằng nhóm hàng của từng dòng hàng bán cùng ngày ở cửa hàng 3 (đơn mọi trạng thái). Mỗi dòng hàng một dòng, giữ cả các dòng lặp lại.", en: "List the category of every order line sold on 2026-10-30 at store 1, followed by the category of every line sold that day at store 3 (orders of every status). One row per order line, keep the repeats." }
  solution: "SELECT p.category FROM order_items i JOIN orders o ON o.id = i.order_id JOIN products p ON p.id = i.product_id WHERE o.store_id = 1 AND o.order_date = '2026-10-30' UNION ALL SELECT p.category FROM order_items i JOIN orders o ON o.id = i.order_id JOIN products p ON p.id = i.product_id WHERE o.store_id = 3 AND o.order_date = '2026-10-30'"
  hint: { vi: "Có một cách ghép bỏ dòng trùng và một cách giữ nguyên; đề cần giữ.", en: "One way of stacking drops duplicate rows and one keeps them; the task needs them kept." }
  wrong:
    - sql: "SELECT p.category FROM order_items i JOIN orders o ON o.id = i.order_id JOIN products p ON p.id = i.product_id WHERE o.store_id = 1 AND o.order_date = '2026-10-30' UNION SELECT p.category FROM order_items i JOIN orders o ON o.id = i.order_id JOIN products p ON p.id = i.product_id WHERE o.store_id = 3 AND o.order_date = '2026-10-30'"
      vi: "`UNION` bỏ dòng trùng: mỗi nhóm hàng chỉ còn một dòng, mất các dòng hàng lặp lại. Dùng `UNION ALL`."
      en: "`UNION` drops duplicate rows: each category is left once and the repeated lines are lost. Use `UNION ALL`."
- id: g-union-4
  skill: union
  kind: review
  task: { vi: "Một danh sách ngày không lặp: các ngày khai trương cửa hàng và các ngày bắt đầu thí nghiệm, gộp chung một cột.", en: "One list of dates with no repeats: the store opening dates and the experiment start dates, together in one column." }
  solution: "SELECT opened_on FROM stores UNION SELECT started_on FROM experiments"
  hint: { vi: "Hai câu cùng một cột kiểu ngày, chồng lên nhau, bỏ dòng trùng.", en: "Two queries with one date column each, stacked, with repeated rows removed." }

# ---- except (ch9)
- id: g-except-1
  skill: except
  kind: faded
  task: { vi: "Khách nào có đơn trong tháng 9/2026 nhưng không có đơn nào trong tháng 10/2026? Lấy mã khách.", en: "Which customers ordered in September 2026 but not in October 2026? Get the customer id." }
  starter: |-
    SELECT customer_id
    FROM orders
    WHERE order_date >= '2026-09-01' AND order_date < '2026-10-01' AND customer_id IS NOT NULL
    EXCEPT
    SELECT ___
    FROM orders
    WHERE order_date >= '2026-10-01' AND order_date < '2026-11-01'
  solution: "SELECT customer_id FROM orders WHERE order_date >= '2026-09-01' AND order_date < '2026-10-01' AND customer_id IS NOT NULL EXCEPT SELECT customer_id FROM orders WHERE order_date >= '2026-10-01' AND order_date < '2026-11-01'"
  hint: { vi: "Bên phải phép trừ cũng trả về mã khách, nhưng của tháng 10.", en: "The right side of the subtraction also returns customer ids, but for October." }
- id: g-except-2
  skill: except
  kind: open
  task: { vi: "Thành phố nào có khách nhưng chưa có cửa hàng? Lấy tên thành phố.", en: "Which cities have customers but no store yet? Get the city name." }
  solution: "SELECT city FROM customers WHERE city IS NOT NULL EXCEPT SELECT city FROM stores"
  hint: { vi: "Lấy thành phố của khách, trừ đi thành phố của cửa hàng.", en: "Take the customers' cities, minus the stores' cities." }
- id: g-except-3
  skill: except
  kind: trap
  task: { vi: "Khách nào đã mua ở cửa hàng số 1 nhưng chưa bao giờ mua ở cửa hàng số 2? Lấy mã khách.", en: "Which customers have bought at store 1 but never at store 2? Get the customer id." }
  solution: "SELECT customer_id FROM orders WHERE store_id = 1 AND customer_id IS NOT NULL EXCEPT SELECT customer_id FROM orders WHERE store_id = 2"
  hint: { vi: "Phép trừ so cả dòng: chỉ để cột mã khách ở hai bên.", en: "The subtraction compares whole rows: keep only the customer id column on both sides." }
  wrong:
    - sql: "SELECT customer_id, order_date FROM orders WHERE store_id = 1 AND customer_id IS NOT NULL EXCEPT SELECT customer_id, order_date FROM orders WHERE store_id = 2"
      vi: "Thêm `order_date` vào hai bên thì dòng nào cũng khác nhau (khác ngày), nên gần như mọi đơn ở cửa hàng 1 đều còn lại, kể cả của khách từng mua ở cửa hàng 2."
      en: "With `order_date` on both sides almost every row differs (another date), so nearly every store 1 order stays, even for customers who also bought at store 2."
- id: g-except-4
  skill: except
  kind: review
  task: { vi: "Khách nào từng đặt đơn qua kênh `ONLINE` nhưng chưa bao giờ mua tại quầy (`STORE`)? Lấy mã khách.", en: "Which customers have ordered through the `ONLINE` channel but never bought in store (`STORE`)? Get the customer id." }
  solution: "SELECT customer_id FROM orders WHERE channel = 'ONLINE' AND customer_id IS NOT NULL EXCEPT SELECT customer_id FROM orders WHERE channel = 'STORE'"
  hint: { vi: "Tập mã khách mua online, bỏ đi tập mã khách mua tại quầy.", en: "The set of customer ids buying online, minus the set buying in store." }

# ---- full_join (ch9)
- id: g-full-join-1
  skill: full_join
  kind: faded
  task: { vi: "So chỉ tiêu tháng 6/2026 (`store_targets`) với doanh số thật tháng đó (đơn `PAID`) cho mọi cửa hàng có ở một trong hai bên: lấy mã cửa hàng, chỉ tiêu và doanh số (bên nào thiếu thì để trống).", en: "Compare the June 2026 targets (`store_targets`) with that month's real sales (`PAID` orders) for every store found on either side: get the store id, the target and the sales (empty where a side is missing)." }
  starter: |-
    WITH t AS (
      SELECT store_id, target_vnd
      FROM store_targets
      WHERE month = '2026-06-01'
    ), a AS (
      SELECT o.store_id, SUM(i.qty * i.unit_price_vnd) AS sales
      FROM orders o
      JOIN order_items i ON i.order_id = o.id
      WHERE o.status = 'PAID' AND o.order_date >= '2026-06-01' AND o.order_date < '2026-07-01'
      GROUP BY o.store_id
    )
    SELECT COALESCE(t.store_id, a.store_id), t.target_vnd, a.sales
    FROM t ___ a ON a.store_id = t.store_id
  solution: "WITH t AS (SELECT store_id, target_vnd FROM store_targets WHERE month = '2026-06-01'), a AS (SELECT o.store_id, SUM(i.qty * i.unit_price_vnd) AS sales FROM orders o JOIN order_items i ON i.order_id = o.id WHERE o.status = 'PAID' AND o.order_date >= '2026-06-01' AND o.order_date < '2026-07-01' GROUP BY o.store_id) SELECT COALESCE(t.store_id, a.store_id), t.target_vnd, a.sales FROM t FULL JOIN a ON a.store_id = t.store_id"
  hint: { vi: "Cần giữ dòng chỉ có ở bên trái và dòng chỉ có ở bên phải.", en: "You need to keep rows found only on the left and rows found only on the right." }
- id: g-full-join-2
  skill: full_join
  kind: open
  task: { vi: "Trong năm 2026, cặp cửa hàng × tháng nào chỉ có ở một bên: có chỉ tiêu (`store_targets`) mà không có doanh số đơn `PAID`, hoặc có doanh số mà không có chỉ tiêu? Lấy mã cửa hàng, tháng (ngày đầu tháng, như cột `month` của `store_targets`), chỉ tiêu và doanh số (`qty` × `unit_price_vnd`); bên thiếu để trống.", en: "In 2026, which store × month pairs exist on one side only: a target (`store_targets`) with no `PAID` sales, or sales with no target? Get the store id, the month (its first day, like the `month` column of `store_targets`), the target and the sales (`qty` × `unit_price_vnd`); the missing side is empty." }
  solution: "WITH t AS (SELECT store_id, month, target_vnd FROM store_targets), a AS (SELECT o.store_id, date_trunc('month', o.order_date)::date AS month, SUM(i.qty * i.unit_price_vnd) AS sales FROM orders o JOIN order_items i ON i.order_id = o.id WHERE o.status = 'PAID' AND o.order_date >= '2026-01-01' GROUP BY 1, 2) SELECT COALESCE(t.store_id, a.store_id), COALESCE(t.month, a.month), t.target_vnd, a.sales FROM t FULL JOIN a ON a.store_id = t.store_id AND a.month = t.month WHERE t.store_id IS NULL OR a.store_id IS NULL"
  hint: { vi: "Nối theo cả cửa hàng lẫn tháng, rồi giữ dòng mà một bên trống.", en: "Join on both store and month, then keep the rows where one side is empty." }
- id: g-full-join-3
  skill: full_join
  kind: trap
  task: { vi: "Tháng 2/2026: với mọi cửa hàng có chỉ tiêu hoặc có doanh số (đơn `PAID`), lấy mã cửa hàng, chỉ tiêu, doanh số và phần chênh (doanh số trừ chỉ tiêu; thiếu bên nào thì chênh để trống).", en: "February 2026: for every store with a target or with sales (`PAID` orders), get the store id, the target, the sales and the gap (sales minus target; empty when a side is missing)." }
  solution: "WITH t AS (SELECT store_id, target_vnd FROM store_targets WHERE month = '2026-02-01'), a AS (SELECT o.store_id, SUM(i.qty * i.unit_price_vnd) AS sales FROM orders o JOIN order_items i ON i.order_id = o.id WHERE o.status = 'PAID' AND o.order_date >= '2026-02-01' AND o.order_date < '2026-03-01' GROUP BY o.store_id) SELECT COALESCE(t.store_id, a.store_id), t.target_vnd, a.sales, a.sales - t.target_vnd FROM t FULL JOIN a ON a.store_id = t.store_id"
  hint: { vi: "Lọc tháng của mỗi bên trước khi nối, không phải sau.", en: "Filter each side's month before the join, not after it." }
  wrong:
    - sql: "WITH a AS (SELECT o.store_id, SUM(i.qty * i.unit_price_vnd) AS sales FROM orders o JOIN order_items i ON i.order_id = o.id WHERE o.status = 'PAID' AND o.order_date >= '2026-02-01' AND o.order_date < '2026-03-01' GROUP BY o.store_id) SELECT COALESCE(t.store_id, a.store_id), t.target_vnd, a.sales, a.sales - t.target_vnd FROM store_targets t FULL JOIN a ON a.store_id = t.store_id WHERE t.month = '2026-02-01'"
      vi: "Lọc `t.month` ở WHERE sau khi nối thì dòng chỉ có doanh số (cửa hàng 4 chưa có chỉ tiêu tháng 2) có `t.month` trống và bị bỏ. Lọc chỉ tiêu trong CTE trước khi nối."
      en: "Filtering `t.month` in WHERE after the join drops the sales-only row (store 4 has no February target): its `t.month` is empty. Filter the targets in a CTE before the join."
- id: g-full-join-4
  skill: full_join
  kind: review
  task: { vi: "So số lượng bán của từng sản phẩm ngày 30/10/2026 với ngày 31/10/2026 (mọi trạng thái đơn). Sản phẩm chỉ bán một trong hai ngày vẫn có mặt, ngày kia để trống. Lấy mã sản phẩm, số lượng ngày 30 và số lượng ngày 31.", en: "Compare each product's quantity sold on 2026-10-30 with 2026-10-31 (any order status). A product sold on only one of the two days still appears, with the other day empty. Get the product id, the quantity on the 30th and the quantity on the 31st." }
  solution: "WITH a AS (SELECT i.product_id, SUM(i.qty) AS q FROM order_items i JOIN orders o ON o.id = i.order_id WHERE o.order_date = '2026-10-30' GROUP BY i.product_id), b AS (SELECT i.product_id, SUM(i.qty) AS q FROM order_items i JOIN orders o ON o.id = i.order_id WHERE o.order_date = '2026-10-31' GROUP BY i.product_id) SELECT COALESCE(a.product_id, b.product_id), a.q, b.q FROM a FULL JOIN b ON b.product_id = a.product_id"
  hint: { vi: "Tính riêng từng ngày, rồi ghép hai bên mà giữ dòng không có cặp ở cả hai phía; mã sản phẩm lấy từ phía nào có.", en: "Compute each day on its own, then join the two keeping unmatched rows on both sides; take the product id from whichever side has it." }

# ---- window_rank (ch10)
- id: g-window-rank-1
  skill: window_rank
  kind: faded
  task: { vi: "Xếp hạng sản phẩm theo giá trong từng nhóm hàng, đắt nhất hạng 1. Lấy nhóm hàng, tên, giá và hạng.", en: "Rank products by price within each category, the most expensive ranked 1. Get the category, name, price and rank." }
  starter: |-
    SELECT category,
      name,
      price_vnd,
      RANK() OVER (PARTITION BY ___ ORDER BY price_vnd DESC)
    FROM products
  solution: "SELECT category, name, price_vnd, RANK() OVER (PARTITION BY category ORDER BY price_vnd DESC) FROM products"
  hint: { vi: "Mỗi nhóm hàng xếp hạng riêng: chia nhóm theo cột nhóm hàng.", en: "Each category is ranked on its own: partition by the category column." }
- id: g-window-rank-2
  skill: window_rank
  kind: open
  task: { vi: "Với mỗi cửa hàng, 3 hạng sản phẩm có doanh số cao nhất trong quý 3/2026 (đơn `PAID`, tháng 7–9; doanh số = `qty` × `unit_price_vnd`). Lấy mã cửa hàng, mã sản phẩm, doanh số và hạng; bằng doanh số thì cùng hạng và bỏ qua hạng kế tiếp (1, 1, 3). Giữ mọi dòng có hạng 1 đến 3, nên một cửa hàng có thể có hơn 3 dòng.", en: "For each store, the top 3 ranks of products by sales in Q3 2026 (`PAID` orders, July–September; sales = `qty` × `unit_price_vnd`). Get the store id, product id, sales and rank; equal sales share a rank and skip the next one (1, 1, 3). Keep every row ranked 1 to 3, so a store can have more than 3 rows." }
  solution: "WITH s AS (SELECT o.store_id, i.product_id, SUM(i.qty * i.unit_price_vnd) AS sales FROM orders o JOIN order_items i ON i.order_id = o.id WHERE o.status = 'PAID' AND o.order_date >= '2026-07-01' AND o.order_date < '2026-10-01' GROUP BY 1, 2), r AS (SELECT store_id, product_id, sales, RANK() OVER (PARTITION BY store_id ORDER BY sales DESC) AS rk FROM s) SELECT store_id, product_id, sales, rk FROM r WHERE rk <= 3"
  hint: { vi: "Tính hạng trong một bước có tên, rồi lọc hạng ở câu ngoài.", en: "Compute the rank in a named step, then filter on it outside." }
- id: g-window-rank-3
  skill: window_rank
  kind: trap
  task: { vi: "Xếp hạng khách ở `Hue` theo số đơn (mọi trạng thái), nhiều nhất hạng 1; bằng số đơn thì cùng hạng và bỏ qua hạng kế tiếp (1, 1, 3). Lấy tên khách, số đơn và hạng. Khách chưa có đơn nào thì không có dòng.", en: "Rank the customers in `Hue` by number of orders (every status), the most ranked 1; equal counts share a rank and skip the next one (1, 1, 3). Get the customer name, order count and rank. A customer with no orders has no row." }
  solution: "SELECT c.name, COUNT(*), RANK() OVER (ORDER BY COUNT(*) DESC) FROM customers c JOIN orders o ON o.customer_id = c.id WHERE c.city = 'Hue' GROUP BY c.id, c.name"
  hint: { vi: "Khi số đơn bằng nhau, hai khách phải nhận cùng hạng.", en: "When order counts are equal, both customers must get the same rank." }
  wrong:
    - sql: "SELECT c.name, COUNT(*), ROW_NUMBER() OVER (ORDER BY COUNT(*) DESC) FROM customers c JOIN orders o ON o.customer_id = c.id WHERE c.city = 'Hue' GROUP BY c.id, c.name"
      vi: "`ROW_NUMBER` đánh số liền nhau và xếp các khách bằng số đơn theo thứ tự tùy ý. Muốn bằng nhau cùng hạng (1, 1, 3) thì dùng `RANK`."
      en: "`ROW_NUMBER` numbers rows one after another and orders tied customers arbitrarily. For ties to share a rank (1, 1, 3) use `RANK`."
- id: g-window-rank-4
  skill: window_rank
  kind: review
  task: { vi: "Xếp hạng các cửa hàng theo số đơn đã thanh toán (`PAID`) tháng 10/2026, nhiều nhất hạng 1; bằng nhau thì cùng hạng và hạng sau bị nhảy. Lấy mã cửa hàng, số đơn và hạng.", en: "Rank the stores by their number of paid orders (`PAID`) in October 2026, most orders = rank 1; ties share a rank and the next rank is skipped. Get the store id, the order count and the rank." }
  solution: "SELECT store_id, COUNT(*), RANK() OVER (ORDER BY COUNT(*) DESC) FROM orders WHERE status = 'PAID' AND order_date >= '2026-10-01' AND order_date < '2026-11-01' GROUP BY store_id"
  hint: { vi: "Đếm theo cửa hàng trước; hàm xếp hạng chạy trên kết quả đã gom, sắp theo số đơn giảm dần.", en: "Count per store first; the ranking function runs over the grouped result, sorted by count descending." }

# ---- window_lag (ch10)
- id: g-window-lag-1
  skill: window_lag
  kind: faded
  task: { vi: "Doanh số mỗi tháng năm 2026 (đơn `PAID`) và doanh số của tháng liền trước. Lấy tháng, doanh số tháng đó và doanh số tháng trước.", en: "Sales for each month of 2026 (`PAID` orders) and the previous month's sales. Get the month, that month's sales and the previous month's sales." }
  starter: |-
    WITH m AS (
      SELECT date_trunc('month', o.order_date) AS month,
        SUM(i.qty * i.unit_price_vnd) AS sales
      FROM orders o
      JOIN order_items i ON i.order_id = o.id
      WHERE o.status = 'PAID' AND o.order_date >= '2026-01-01'
      GROUP BY 1
    )
    SELECT month, sales, LAG(sales) OVER (ORDER BY ___)
    FROM m
  solution: "WITH m AS (SELECT date_trunc('month', o.order_date) AS month, SUM(i.qty * i.unit_price_vnd) AS sales FROM orders o JOIN order_items i ON i.order_id = o.id WHERE o.status = 'PAID' AND o.order_date >= '2026-01-01' GROUP BY 1) SELECT month, sales, LAG(sales) OVER (ORDER BY month) FROM m"
  hint: { vi: "\"Dòng trước\" theo thứ tự tháng.", en: "\"The previous row\" in month order." }
- id: g-window-lag-2
  skill: window_lag
  kind: open
  task: { vi: "Quý 3/2026 (tháng 7–9), doanh số mỗi cửa hàng mỗi tháng (đơn `PAID`, `qty` × `unit_price_vnd`) thay đổi bao nhiêu so với tháng trước của chính cửa hàng đó? Lấy mã cửa hàng, tháng (ngày đầu tháng), doanh số và phần thay đổi (tháng 7 để trống vì không xét tháng 6).", en: "In Q3 2026 (July–September), how much did each store's monthly sales (`PAID` orders, `qty` × `unit_price_vnd`) change from that same store's previous month? Get the store id, the month (its first day), the sales and the change (empty for July, since June is not included)." }
  solution: "WITH m AS (SELECT o.store_id, date_trunc('month', o.order_date) AS month, SUM(i.qty * i.unit_price_vnd) AS sales FROM orders o JOIN order_items i ON i.order_id = o.id WHERE o.status = 'PAID' AND o.order_date >= '2026-07-01' AND o.order_date < '2026-10-01' GROUP BY 1, 2) SELECT store_id, month, sales, sales - LAG(sales) OVER (PARTITION BY store_id ORDER BY month) FROM m"
  hint: { vi: "Mỗi cửa hàng chỉ so với chính nó: chia nhóm theo cửa hàng, sắp theo tháng.", en: "Each store compares only with itself: partition by store, order by month." }
- id: g-window-lag-3
  skill: window_lag
  kind: trap
  task: { vi: "Với các đơn (mọi trạng thái) của khách số 1 đến 5: lấy mã khách, mã đơn, ngày đặt và ngày đặt đơn liền trước của chính khách đó (xếp theo ngày, rồi theo mã đơn; đơn đầu tiên của khách để trống).", en: "For the orders (every status) of customers 1 to 5: get the customer id, order id, order date and the date of that same customer's previous order (ordered by date, then by order id; the customer's first order is empty)." }
  solution: "SELECT customer_id, id, order_date, LAG(order_date) OVER (PARTITION BY customer_id ORDER BY order_date, id) FROM orders WHERE customer_id BETWEEN 1 AND 5"
  hint: { vi: "Đơn trước phải là của cùng một khách.", en: "The previous order must belong to the same customer." }
  wrong:
    - sql: "SELECT customer_id, id, order_date, LAG(order_date) OVER (ORDER BY order_date, id) FROM orders WHERE customer_id BETWEEN 1 AND 5"
      vi: "Thiếu `PARTITION BY customer_id`: \"đơn trước\" là đơn liền trước của bất kỳ khách nào, nên khách này bị so với khách khác."
      en: "`PARTITION BY customer_id` is missing: \"the previous order\" is the previous order of any customer, so one customer is compared with another."
- id: g-window-lag-4
  skill: window_lag
  kind: review
  task: { vi: "Cửa hàng 3, từ ngày 15/10/2026: mỗi ngày có đơn, lấy ngày, số đơn (mọi trạng thái) và số đơn của ngày có đơn liền trước đó.", en: "Store 3, from 2026-10-15: for each day with orders, get the date, the order count (any status) and the order count of the previous day that had orders." }
  solution: "SELECT order_date, COUNT(*), LAG(COUNT(*)) OVER (ORDER BY order_date) FROM orders WHERE store_id = 3 AND order_date >= '2026-10-15' GROUP BY order_date"
  hint: { vi: "Đếm theo ngày, rồi nhìn lại một dòng theo thứ tự ngày.", en: "Count per day, then look back one row in date order." }

# ---- window_agg (ch10)
- id: g-window-agg-1
  skill: window_agg
  kind: faded
  task: { vi: "Doanh số cộng dồn từ đầu năm 2026 (đơn `PAID`): lấy tháng, doanh số tháng đó và tổng cộng dồn tới hết tháng đó.", en: "Year-to-date 2026 sales (`PAID` orders): get the month, that month's sales and the running total up to the end of that month." }
  starter: |-
    WITH m AS (
      SELECT date_trunc('month', o.order_date) AS month,
        SUM(i.qty * i.unit_price_vnd) AS sales
      FROM orders o
      JOIN order_items i ON i.order_id = o.id
      WHERE o.status = 'PAID' AND o.order_date >= '2026-01-01'
      GROUP BY 1
    )
    SELECT month, sales, SUM(sales) OVER (___)
    FROM m
  solution: "WITH m AS (SELECT date_trunc('month', o.order_date) AS month, SUM(i.qty * i.unit_price_vnd) AS sales FROM orders o JOIN order_items i ON i.order_id = o.id WHERE o.status = 'PAID' AND o.order_date >= '2026-01-01' GROUP BY 1) SELECT month, sales, SUM(sales) OVER (ORDER BY month) FROM m"
  hint: { vi: "Tổng cộng dồn cần thứ tự trong cửa sổ.", en: "A running total needs an order inside the window." }
- id: g-window-agg-2
  skill: window_agg
  kind: open
  task: { vi: "Tháng 10/2026, mỗi cửa hàng chiếm bao nhiêu phần trăm doanh số cả chuỗi (đơn `PAID`)? Lấy mã cửa hàng, doanh số và phần trăm, làm tròn 1 chữ số ở kết quả cuối.", en: "In October 2026, what percentage of the chain's sales (`PAID` orders) does each store make? Get the store id, the sales and the percentage, rounded to 1 decimal on the final figure." }
  solution: "WITH s AS (SELECT o.store_id, SUM(i.qty * i.unit_price_vnd) AS sales FROM orders o JOIN order_items i ON i.order_id = o.id WHERE o.status = 'PAID' AND o.order_date >= '2026-10-01' AND o.order_date < '2026-11-01' GROUP BY 1) SELECT store_id, sales, ROUND(100.0 * sales / SUM(sales) OVER (), 1) FROM s"
  hint: { vi: "Tổng cả chuỗi đặt cạnh mỗi dòng: một cửa sổ rỗng bao mọi dòng.", en: "The chain total next to every row: an empty window covers all rows." }
- id: g-window-agg-3
  skill: window_agg
  kind: trap
  task: { vi: "Quý 3/2026 (tháng 7–9), doanh số cộng dồn theo tháng của từng cửa hàng (đơn `PAID`): lấy mã cửa hàng, tháng, doanh số và tổng cộng dồn của cửa hàng đó tới hết tháng.", en: "Q3 2026 (July–September), each store's running monthly sales (`PAID` orders): get the store id, the month, the sales and that store's running total up to the end of the month." }
  solution: "WITH m AS (SELECT o.store_id, date_trunc('month', o.order_date) AS month, SUM(i.qty * i.unit_price_vnd) AS sales FROM orders o JOIN order_items i ON i.order_id = o.id WHERE o.status = 'PAID' AND o.order_date >= '2026-07-01' AND o.order_date < '2026-10-01' GROUP BY 1, 2) SELECT store_id, month, sales, SUM(sales) OVER (PARTITION BY store_id ORDER BY month) FROM m"
  hint: { vi: "Cộng dồn trong từng cửa hàng, theo thứ tự tháng.", en: "Run the total inside each store, in month order." }
  wrong:
    - sql: "WITH m AS (SELECT o.store_id, date_trunc('month', o.order_date) AS month, SUM(i.qty * i.unit_price_vnd) AS sales FROM orders o JOIN order_items i ON i.order_id = o.id WHERE o.status = 'PAID' AND o.order_date >= '2026-07-01' AND o.order_date < '2026-10-01' GROUP BY 1, 2) SELECT store_id, month, sales, SUM(sales) OVER (PARTITION BY store_id) FROM m"
      vi: "Thiếu `ORDER BY` trong `OVER`: tháng nào cũng nhận tổng cả quý của cửa hàng, không phải tổng cộng dồn."
      en: "`ORDER BY` is missing inside `OVER`: every month gets the store's whole-quarter total, not a running total."
- id: g-window-agg-4
  skill: window_agg
  kind: review
  task: { vi: "Mỗi đơn của khách số 7: mã đơn, ngày đặt và số đơn khách đã đặt tính tới đơn này (theo ngày, cùng ngày thì theo mã đơn).", en: "Each order of customer 7: the order id, the order date and how many orders the customer had placed up to and including this one (by date, then by order id)." }
  solution: "SELECT id, order_date, COUNT(*) OVER (ORDER BY order_date, id) FROM orders WHERE customer_id = 7"
  hint: { vi: "Một phép đếm chạy dồn theo thứ tự ngày rồi mã, giữ nguyên từng dòng đơn.", en: "A running count in date-then-id order that keeps every order row." }

# ---- explain_read (ch11)
- id: g-explain-read-1
  skill: explain_read
  kind: faded
  task: { vi: "Lấy mã đơn và ngày đặt của mọi đơn (mọi trạng thái) của khách số 42. Bảng `orders` có hai chỉ mục: `orders(customer_id)` và `orders(order_date)`. Bài chấm cả kết quả lẫn kế hoạch: `orders` phải được đọc qua chỉ mục. Chạy xong, mở tab EXPLAIN để xem nút nào đọc chỉ mục.", en: "Get the order id and order date of every order (every status) of customer 42. The `orders` table has two indexes: `orders(customer_id)` and `orders(order_date)`. Both the result and the plan are graded: `orders` must be read through an index. After running it, open the EXPLAIN tab to see which node reads the index." }
  starter: "SELECT id, order_date FROM orders WHERE ___ = 42"
  solution: "SELECT id, order_date FROM orders WHERE customer_id = 42"
  plan: { index: orders }
  hint: { vi: "Lọc theo cột có chỉ mục `orders(customer_id)`; trong kế hoạch tìm nút Index Scan hoặc Bitmap Index Scan.", en: "Filter on the column of the `orders(customer_id)` index; in the plan look for an Index Scan or Bitmap Index Scan node." }
- id: g-explain-read-2
  skill: explain_read
  kind: open
  task: { vi: "Mỗi ngày từ 01/10/2026 đến hết 07/10/2026 có bao nhiêu đơn (mọi trạng thái)? Lấy ngày và số đơn. Bài chấm cả kế hoạch: `orders` phải được đọc qua chỉ mục `orders(order_date)`, nên so sánh thẳng cột `order_date` với các mốc ngày, không bọc cột trong hàm hay phép đổi kiểu.", en: "How many orders (every status) were placed on each day from 2026-10-01 through 2026-10-07? Get the date and the count. The plan is graded too: `orders` must be read through the `orders(order_date)` index, so compare the `order_date` column directly with the date bounds, without wrapping it in a function or a type conversion." }
  solution: "SELECT order_date, COUNT(*) FROM orders WHERE order_date >= '2026-10-01' AND order_date < '2026-10-08' GROUP BY order_date"
  plan: { index: orders }
  hint: { vi: "So sánh trực tiếp cột ngày với hai mốc; đọc kế hoạch từ nút trong cùng ra ngoài.", en: "Compare the date column directly with two bounds; read the plan from the innermost node outwards." }
- id: g-explain-read-3
  skill: explain_read
  kind: trap
  task: { vi: "Khách số 42 có bao nhiêu đơn đã thanh toán (`PAID`)? Lấy một con số. Bài chấm cả kế hoạch: `orders` vẫn phải được đọc qua chỉ mục `orders(customer_id)`.", en: "How many paid (`PAID`) orders does customer 42 have? Get one number. The plan is graded too: `orders` must still be read through the `orders(customer_id)` index." }
  solution: "SELECT COUNT(*) FROM orders WHERE customer_id = 42 AND status = 'PAID'"
  plan: { index: orders }
  hint: { vi: "Hai điều kiện phải cùng đúng.", en: "Both conditions must hold." }
  wrong:
    - sql: "SELECT COUNT(*) FROM orders WHERE customer_id = 42 OR status = 'PAID'"
      vi: "`OR` đếm cả đơn `PAID` của mọi khách. Tab EXPLAIN cũng báo hiệu: kế hoạch chuyển sang Seq Scan đọc hết `orders`, vì không chỉ mục nào trả lời được vế `status`."
      en: "`OR` also counts every customer's `PAID` orders. The EXPLAIN tab gives it away too: the plan switches to a Seq Scan over all of `orders`, since no index answers the `status` side."
- id: g-explain-read-4
  skill: explain_read
  kind: review
  task: { vi: "Các đơn bán qua kênh `ONLINE` của khách số 11: mã đơn, ngày đặt và trạng thái. Bài chấm cả kế hoạch: `orders` phải được đọc qua chỉ mục `orders(customer_id)`.", en: "Customer 11's orders sold through the `ONLINE` channel: the order id, the order date and the status. The plan is graded too: `orders` must be read through the `orders(customer_id)` index." }
  solution: "SELECT id, order_date, status FROM orders WHERE customer_id = 11 AND channel = 'ONLINE'"
  plan: { index: orders }
  hint: { vi: "So bằng trên cột có chỉ mục; điều kiện kênh chỉ lọc thêm. Trong tab EXPLAIN, tìm nút đọc chỉ mục.", en: "Equality on the indexed column; the channel condition only filters further. In the EXPLAIN tab, find the node that reads the index." }

# ---- sargable (ch11)
- id: g-sargable-1
  skill: sargable
  kind: faded
  task: { vi: "Lấy mã đơn, mã cửa hàng và ngày đặt của các đơn trong tuần 05/10/2026–11/10/2026, viết điều kiện ngày dạng khoảng nửa mở để dùng được chỉ mục `orders(order_date)`.", en: "Get the order id, store id and order date of the orders in the week 2026-10-05 to 2026-10-11, writing the date condition as a half-open range so the `orders(order_date)` index can be used." }
  starter: |-
    SELECT id, store_id, order_date
    FROM orders
    WHERE order_date >= '2026-10-05' AND order_date < ___
  solution: "SELECT id, store_id, order_date FROM orders WHERE order_date >= '2026-10-05' AND order_date < '2026-10-12'"
  plan: { index: orders }
  perf: { table: orders }
  slow: "SELECT id, store_id, order_date FROM orders WHERE order_date::text BETWEEN '2026-10-05' AND '2026-10-11'"
  hint: { vi: "Mốc trên là ngày ngay sau ngày cuối, dùng dấu nhỏ hơn.", en: "The upper bound is the day right after the last day, with less-than." }
- id: g-sargable-2
  skill: sargable
  kind: open
  task: { vi: "Tháng 10/2026, mỗi kênh bán (`channel`) có bao nhiêu đơn (mọi trạng thái)? Lấy kênh và số đơn. Bài chấm cả kế hoạch: `orders` phải được đọc qua chỉ mục `orders(order_date)`, nên không bọc cột `order_date` trong hàm nào (như lấy tháng hay cắt ngày).", en: "In October 2026, how many orders (every status) did each sales channel (`channel`) get? Get the channel and the count. The plan is graded too: `orders` must be read through the `orders(order_date)` index, so do not wrap the `order_date` column in any function (such as taking the month or truncating the date)." }
  solution: "SELECT channel, COUNT(*) FROM orders WHERE order_date >= '2026-10-01' AND order_date < '2026-11-01' GROUP BY channel"
  plan: { index: orders }
  hint: { vi: "Không bọc cột ngày trong hàm; so nó với hai mốc ngày.", en: "Do not wrap the date column in a function; compare it with two dates." }
- id: g-sargable-3
  skill: sargable
  kind: trap
  task: { vi: "Lấy mã và ngày đặt của các đơn online (`ONLINE`, mọi trạng thái) tháng 10/2026. Bài chấm cả kế hoạch: `orders` phải được đọc qua chỉ mục `orders(order_date)`.", en: "Get the id and order date of the online (`ONLINE`, every status) orders of October 2026. The plan is graded too: `orders` must be read through the `orders(order_date)` index." }
  solution: "SELECT id, order_date FROM orders WHERE channel = 'ONLINE' AND order_date >= '2026-10-01' AND order_date < '2026-11-01'"
  plan: { index: orders }
  hint: { vi: "Lấy tháng ra khỏi cột vừa chậm vừa dễ sai: tháng 10 có ở cả hai năm.", en: "Pulling the month out of the column is both slow and easy to get wrong: October exists in two years." }
  wrong:
    - sql: "SELECT id, order_date FROM orders WHERE channel = 'ONLINE' AND extract(month FROM order_date) = 10"
      vi: "`extract(month …) = 10` lấy cả tháng 10/2025, và bọc cột trong hàm nên kế hoạch thành Seq Scan. Dùng khoảng nửa mở `>= '2026-10-01' AND < '2026-11-01'`."
      en: "`extract(month …) = 10` also takes October 2025, and wrapping the column in a function turns the plan into a Seq Scan. Use the half-open range `>= '2026-10-01' AND < '2026-11-01'`."
- id: g-sargable-4
  skill: sargable
  kind: review
  task: { vi: "Tuần 24/09–30/09/2026: mỗi trạng thái có bao nhiêu đơn? Lấy trạng thái và số đơn. Bài chấm cả kế hoạch: `orders` phải được đọc qua chỉ mục `orders(order_date)`, nên so thẳng cột ngày với hai mốc.", en: "The week of 2026-09-24 to 2026-09-30: how many orders per status? Get the status and the count. The plan is graded too: `orders` must be read through the `orders(order_date)` index, so compare the date column directly with two bounds." }
  solution: "SELECT status, COUNT(*) FROM orders WHERE order_date >= '2026-09-24' AND order_date < '2026-10-01' GROUP BY status"
  plan: { index: orders }
  hint: { vi: "Khoảng nửa mở: từ ngày đầu, tới trước ngày ngay sau ngày cuối.", en: "A half-open range: from the first day, up to before the day after the last one." }

# ---- index_design (ch11)
- id: g-index-design-1
  skill: index_design
  kind: faded
  task: { vi: "Các sự kiện của người dùng số 77 trong tháng 9/2026, tính trọn ngày 30/9 (`ts` kiểu `timestamp` không múi giờ: giờ ghi sao thì tính vậy): lấy tên sự kiện và thời điểm, theo thứ tự thời gian. Bài chấm cả kế hoạch: `app_events` phải được đọc qua chỉ mục `app_events(user_id, ts)`.", en: "User 77's events in September 2026, all of 30 September included (`ts` is a `timestamp` without time zone: take the time as stored): get the event name and the time, in time order. The plan is graded too: `app_events` must be read through the `app_events(user_id, ts)` index." }
  starter: |-
    SELECT event, ts
    FROM app_events
    WHERE user_id = 77 AND ts >= ___ AND ts < ___
    ORDER BY ts
  solution: "SELECT event, ts FROM app_events WHERE user_id = 77 AND ts >= '2026-09-01' AND ts < '2026-10-01' ORDER BY ts"
  ordered: true
  plan: { index: app_events }
  hint: { vi: "Cột đầu của chỉ mục là `user_id` (so bằng), cột sau là `ts` (một khoảng).", en: "The index's first column is `user_id` (equality), the next is `ts` (a range)." }
- id: g-index-design-2
  skill: index_design
  kind: open
  task: { vi: "Sự kiện gần đây nhất (`ts` lớn nhất) của người dùng số 120 là gì? Một dòng: tên sự kiện, thời điểm và thiết bị (khóa `device` trong cột `props`). Bài chấm cả kế hoạch: `app_events` phải được đọc qua chỉ mục `app_events(user_id, ts)`.", en: "What is user 120's most recent event (largest `ts`)? One row: the event name, the time and the device (the `device` key in the `props` column). The plan is graded too: `app_events` must be read through the `app_events(user_id, ts)` index." }
  solution: "SELECT event, ts, props->>'device' FROM app_events WHERE user_id = 120 ORDER BY ts DESC LIMIT 1"
  plan: { index: app_events }
  hint: { vi: "Lọc theo cột đầu của chỉ mục, sắp theo cột thứ hai giảm dần, lấy một dòng.", en: "Filter on the index's first column, sort by its second column descending, take one row." }
- id: g-index-design-3
  skill: index_design
  kind: trap
  task: { vi: "Người dùng số 77 có những sự kiện nào trong ngày 05/09/2026, từ 00:00 tới trước 00:00 ngày hôm sau (`ts` kiểu `timestamp` không múi giờ)? Lấy tên sự kiện và thời điểm. Bài chấm cả kế hoạch: `app_events` phải được đọc qua chỉ mục `app_events(user_id, ts)`, chỉ mục này chỉ giúp khi cột đầu của nó được lọc.", en: "Which events did user 77 have on 2026-09-05, from 00:00 until before 00:00 the next day (`ts` is a `timestamp` without time zone)? Get the event name and the time. The plan is graded too: `app_events` must be read through the `app_events(user_id, ts)` index, which only helps when its first column is filtered." }
  solution: "SELECT event, ts FROM app_events WHERE user_id = 77 AND ts >= '2026-09-05' AND ts < '2026-09-06'"
  plan: { index: app_events }
  hint: { vi: "Lọc theo cả người dùng lẫn thời gian.", en: "Filter on both the user and the time." }
  wrong:
    - sql: "SELECT event, ts FROM app_events WHERE ts >= '2026-09-05' AND ts < '2026-09-06'"
      vi: "Thiếu `user_id = 77`: ra sự kiện của mọi người dùng ngày đó, và vì cột đầu của chỉ mục không được lọc nên kế hoạch thành Seq Scan."
      en: "`user_id = 77` is missing: you get every user's events that day, and since the index's first column is not filtered the plan becomes a Seq Scan."
- id: g-index-design-4
  skill: index_design
  kind: review
  task: { vi: "Lần xem (`view`) đầu tiên của người dùng số 54 diễn ra lúc nào? Một dòng, một thời điểm. Bài chấm cả kế hoạch: `app_events` phải được đọc qua chỉ mục `app_events(user_id, ts)`.", en: "When did user 54's first view (`view`) happen? One row, one time. The plan is graded too: `app_events` must be read through the `app_events(user_id, ts)` index." }
  solution: "SELECT ts FROM app_events WHERE user_id = 54 AND event = 'view' ORDER BY ts LIMIT 1"
  plan: { index: app_events }
  hint: { vi: "So bằng trên cột đầu của chỉ mục, sắp theo cột thứ hai tăng dần, lấy một dòng.", en: "Equality on the index's first column, sort by its second column ascending, take one row." }
