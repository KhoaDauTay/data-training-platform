  options:
    - vi: "Số cửa hàng có chỉ tiêu ở bất kỳ tháng nào"
      en: "The stores that have a target in any month"
      sql: "SELECT count(*) AS n FROM stores s WHERE EXISTS (SELECT 1 FROM store_targets t WHERE t.store_id = s.id)"
      why:
        vi: "Truy vấn con có điều kiện `t.month = '2026-06-01'`, nên chỉ chỉ tiêu tháng 6/2026 được tính."
        en: "The subquery has the condition `t.month = '2026-06-01'`, so only June 2026 targets count."
    - vi: "Số cửa hàng không có chỉ tiêu tháng 6/2026"
      en: "The stores without a June 2026 target"
      sql: "SELECT count(*) AS n FROM stores s WHERE NOT EXISTS (SELECT 1 FROM store_targets t WHERE t.store_id = s.id AND t.month = '2026-06-01')"
      why:
        vi: "Đó là `NOT EXISTS`. `EXISTS` giữ cửa hàng khi truy vấn con tìm được ít nhất một dòng."
        en: "That is `NOT EXISTS`. `EXISTS` keeps a store when the subquery finds at least one row."
    - vi: "Số dòng chỉ tiêu của mọi cửa hàng trong năm 2026"
      en: "The target rows of every store in 2026"
      sql: "SELECT count(*) AS n FROM store_targets"
      why:
        vi: "Câu đếm dòng của `stores`, mỗi cửa hàng nhiều nhất một lần; `EXISTS` chỉ hỏi có hay không, không đếm dòng của `store_targets`."
        en: "The query counts rows of `stores`, each store at most once; `EXISTS` only asks yes or no and does not count `store_targets` rows."
    - vi: "Số cửa hàng có chỉ tiêu tháng 6/2026"
      en: "The stores that have a June 2026 target"
      sql: "SELECT count(DISTINCT store_id) AS n FROM store_targets WHERE month = '2026-06-01'"
      why:
        vi: "Với mỗi cửa hàng, `EXISTS` hỏi có dòng chỉ tiêu tháng 6/2026 nào khớp không. Hoan Kiem thiếu chỉ tiêu tháng đó, nên ra 4 chứ không phải 5."
        en: "For each store, `EXISTS` asks whether a June 2026 target row matches. Hoan Kiem has no target that month, so the answer is 4, not 5."

- id: x-12
  sql: |
    SELECT CASE WHEN price_vnd >= 50000 THEN 'high'
                WHEN price_vnd >= 100000 THEN 'premium'
                ELSE 'low' END AS band,
           count(*) AS products
    FROM products
    GROUP BY 1
  q: { vi: "Kết quả có những nhóm giá nào?", en: "Which price bands does the result hold?" }
  answer: 1
  options:
    - vi: "Ba nhóm: premium (từ 100 000), high (50 000–99 999) và low"
      en: "Three bands: premium (100,000 and up), high (50,000-99,999) and low"
      sql: "SELECT CASE WHEN price_vnd >= 100000 THEN 'premium' WHEN price_vnd >= 50000 THEN 'high' ELSE 'low' END AS band, count(*) AS products FROM products GROUP BY 1"
      why:
        vi: "Đó là khi nhánh `>= 100000` đứng trước. `CASE` dừng ở nhánh đúng đầu tiên, mà giá 129 000 đã khớp `>= 50000` rồi."
        en: "That is what you get with the `>= 100000` branch first. `CASE` stops at the first true branch, and a price of 129,000 already matches `>= 50000`."
    - vi: "Hai nhóm: high (từ 50 000) và low; không có premium"
      en: "Two bands: high (50,000 and up) and low; no premium"
      sql: "SELECT CASE WHEN price_vnd >= 50000 THEN 'high' ELSE 'low' END AS band, count(*) AS products FROM products GROUP BY 1"
      why:
        vi: "`CASE` chọn nhánh đúng đầu tiên. Mọi giá từ 100 000 cũng đã từ 50 000, nên rơi vào high, và nhánh premium không bao giờ tới lượt."
        en: "`CASE` takes the first true branch. Every price of 100,000 or more is also 50,000 or more, so it lands in high, and the premium branch never gets its turn."
    - vi: "Một dòng cho mỗi sản phẩm, kèm nhóm giá của nó"
      en: "One row per product, with its price band"
      sql: "SELECT CASE WHEN price_vnd >= 50000 THEN 'high' ELSE 'low' END AS band, 1 AS products FROM products"
      why:
        vi: "`GROUP BY 1` gom theo cột đầu là nhóm giá, nên mỗi nhóm một dòng, kèm số sản phẩm trong nhóm."
        en: "`GROUP BY 1` groups by the first column, the band, so there is one row per band with its product count."
    - vi: "Chỉ một nhóm high, vì mọi giá đều từ 50 000"
      en: "Only a high band, because every price is 50,000 or more"
      sql: "SELECT 'high' AS band, count(*) AS products FROM products"
      why:
        vi: "Phần lớn sản phẩm rẻ hơn 50 000 (nước, bánh, bút…), nên nhóm low có nhiều sản phẩm."
        en: "Most products cost less than 50,000 (drinks, snacks, pens...), so the low band holds many products."

- id: x-13
  sql: |
    SELECT round(avg(birth_year), 1) AS v
    FROM customers
  q: { vi: "`v` là trung bình của những gì?", en: "What is `v` the average of?" }
  answer: 2
  options:
    - vi: "Năm sinh của cả 300 khách, ai không khai tính là 0"
      en: "The birth years of all 300 customers, missing ones counted as 0"
      sql: "SELECT round(avg(coalesce(birth_year, 0)), 1) AS v FROM customers"
      why:
        vi: "`avg` bỏ qua NULL, không đổi NULL thành 0. Muốn tính là 0 phải viết `coalesce(birth_year, 0)`, và kết quả sẽ thấp vô lý."
        en: "`avg` skips NULL; it does not turn NULL into 0. Counting them as 0 needs `coalesce(birth_year, 0)`, and the result would be absurdly low."
    - vi: "Các năm sinh khác nhau, mỗi năm tính một lần"
      en: "The different birth years, each counted once"
      sql: "SELECT round(avg(DISTINCT birth_year), 1) AS v FROM customers"
      why:
        vi: "Đó là `avg(DISTINCT birth_year)`. Không có `DISTINCT`, hai khách cùng sinh năm 1990 được tính hai lần."
        en: "That is `avg(DISTINCT birth_year)`. Without `DISTINCT`, two customers born in 1990 count twice."
    - vi: "Năm sinh của những khách có khai năm sinh"
      en: "The birth years of the customers who gave one"
      sql: "SELECT round(sum(birth_year)::numeric / count(birth_year), 1) AS v FROM customers"
      why:
        vi: "`avg` bỏ qua NULL: nó chia tổng năm sinh cho số khách có khai (273), không cho 300."
        en: "`avg` skips NULL: it divides the sum of birth years by the customers who gave one (273), not by 300."
    - vi: "Năm sinh nằm giữa khi xếp mọi khách theo tuổi"
      en: "The middle birth year when all customers are lined up by age"
      sql: "SELECT round(percentile_cont(0.5) WITHIN GROUP (ORDER BY birth_year)::numeric, 1) AS v FROM customers"
      why:
        vi: "Giá trị nằm giữa là trung vị (median), tính bằng `percentile_cont(0.5)`. `avg` là trung bình cộng."
        en: "The middle value is the median, computed with `percentile_cont(0.5)`. `avg` is the arithmetic mean."

