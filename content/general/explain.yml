        vi: "Đếm sản phẩm khác nhau cần `count(DISTINCT i.product_id)`; ở đây một sản phẩm bán ở 10 dòng được đếm 10 lần."
        en: "Different products need `count(DISTINCT i.product_id)`; here a product sold on 10 lines counts 10 times."