- id: x-15
  sql: |
    SELECT m.name, count(*) AS n
    FROM staff e
    JOIN staff m ON m.id = e.manager_id
    GROUP BY m.name
  q: { vi: "Mỗi dòng cho biết gì?", en: "What does each row tell you?" }
  answer: 3
  options:
    - vi: "Mỗi nhân viên và tên quản lý của họ"
      en: "Each employee and their manager's name"
      sql: "SELECT e.name, m.name AS n FROM staff e JOIN staff m ON m.id = e.manager_id"
      why:
        vi: "Câu gom theo `m.name` và đếm, nên mỗi dòng là một quản lý với một con số, không phải một cặp nhân viên và quản lý."
        en: "The query groups by `m.name` and counts, so each row is one manager with a number, not an employee and manager pair."
    - vi: "Mỗi người quản lý và số người dưới quyền ở mọi cấp"
      en: "Each manager and the number of people under them at every level"
      sql: "WITH RECURSIVE down AS (SELECT id AS top, id FROM staff UNION ALL SELECT d.top, s.id FROM down d JOIN staff s ON s.manager_id = d.id) SELECT m.name, count(*) - 1 AS n FROM down d JOIN staff m ON m.id = d.top GROUP BY m.name HAVING count(*) > 1"
      why:
        vi: "Phép nối chỉ đi một bậc: `m.id = e.manager_id` ghép mỗi người với quản lý trực tiếp. Đếm mọi cấp cần truy vấn đệ quy."
        en: "The join goes one level only: `m.id = e.manager_id` pairs each person with their direct manager. Counting every level needs a recursive query."
    - vi: "Mỗi nhân viên và số người quản lý họ"
      en: "Each employee and how many people manage them"
      sql: "SELECT e.name, count(*) AS n FROM staff e JOIN staff m ON m.id = e.manager_id GROUP BY e.name"
      why:
        vi: "Câu gom theo `m.name`, tên ở phía quản lý của phép nối, không theo `e.name`; và mỗi người chỉ có một `manager_id`."
        en: "The query groups by `m.name`, the manager side of the join, not by `e.name`; and each person has only one `manager_id`."
    - vi: "Mỗi quản lý và số người họ quản lý trực tiếp"
      en: "Each manager and how many people they manage directly"
      sql: "SELECT m.name, (SELECT count(*) FROM staff e WHERE e.manager_id = m.id) AS n FROM staff m WHERE EXISTS (SELECT 1 FROM staff e WHERE e.manager_id = m.id)"
      why:
        vi: "Mỗi nhân viên `e` được ghép với quản lý trực tiếp `m`, rồi `GROUP BY m.name` đếm số nhân viên của từng quản lý."
        en: "Each employee `e` is paired with their direct manager `m`, then `GROUP BY m.name` counts the employees of each manager."

- id: x-16
