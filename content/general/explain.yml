        en: "`UNION` removes duplicate rows, and when comparing for duplicates it treats two NULLs as equal, so the 17 customers without a city leave exactly one empty row."
    - vi: "5: chỉ những thành phố có tên rõ ràng"
      en: "5: only the cities that have a name"
