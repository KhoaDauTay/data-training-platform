        en: "Units are `sum(i.qty)`. `count(*)` counts rows, so a line with `qty` = 4 still counts as 1."
    - vi: "Số sản phẩm khác nhau cửa hàng 2 đã bán"
      en: "The different products store 2 has sold"
      sql: "SELECT count(DISTINCT i.product_id) AS n FROM orders o JOIN order_items i ON i.order_id = o.id WHERE o.store_id = 2"
