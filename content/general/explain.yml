      why:
        vi: "Mỗi dòng sau phép nối là một dòng hàng (`order_items`) kèm đơn của nó, nên `count(*)` đếm dòng hàng."
        en: "Each row after the join is one item line (`order_items`) with its order, so `count(*)` counts item lines."
    - vi: "Số đơn vị hàng cửa hàng 2 đã bán"
