# Lộ trình MongoDB: danh mục các Phần theo thứ tự (product-design-db-engine §3.3).
# Nội dung nằm ở hai bộ file (Phần 1–6 và Phần 7–12), cùng khuôn: skills / lessons / drills.
# Mọi file dùng chung một bộ dữ liệu `dataset` (ngày lưu dạng chuỗi ISO, liệt kê ở `_meta.dateFields`;
# loader: src/engine/mongo/pathDataset.ts đổi sang Date UTC).
# Drill id: `e-mg-d-<kỹ năng bỏ "mg.", "_" thành "-">-<n>` (khớp ENGINE_ID). Kiểm bởi tests/mongoPath.test.ts.
dataset: dataset.json
files:
  - { parts: [1, 6], skills: skills-p1-6.yml, lessons: lessons-p1-6.yml, drills: drills-p1-6.yml }
  - { parts: [7, 12], skills: skills-p7-12.yml, lessons: lessons-p7-12.yml, drills: drills-p7-12.yml }
parts:
