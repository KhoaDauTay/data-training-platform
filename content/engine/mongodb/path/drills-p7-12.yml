# ---- mg.esr (Phần 11, chấm theo luật Equality → Sort → Range trên `query`)
- id: e-mg-d-esr-1
  skill: mg.esr
  kind: faded
  grade: esr
  task: { vi: "Tạo index ghép phục vụ truy vấn: đơn `PAID` từ 2026-10-01, sắp theo ngày mới nhất trước.", en: "Create a compound index for the query: `PAID` orders from 2026-10-01, sorted newest first." }
  query: "db.orders.find({ status: 'PAID', order_date: { $gte: ISODate('2026-10-01') } }).sort({ order_date: -1 })"
  starter: "db.orders.createIndex({ status: 1, ___: ___ })"
  solution: "db.orders.createIndex({ status: 1, order_date: -1 })"
  hint: { vi: "Trường bằng trước; trường ngày vừa sắp vừa lọc khoảng, theo chiều giảm của phép sắp.", en: "The equality field first; the date field is both sorted and range-filtered, in the sort's descending direction." }
- id: e-mg-d-esr-2
  skill: mg.esr
  kind: open
  grade: esr
  task: { vi: "Tạo index ghép phục vụ truy vấn: đơn của cửa hàng 3 qua kênh `ONLINE` từ 2026-09-01, sắp theo mã khách tăng dần.", en: "Create a compound index for the query: store 3 orders through `ONLINE` from 2026-09-01, sorted by customer id ascending." }
  query: "db.orders.find({ store_id: 3, channel: 'ONLINE', order_date: { $gte: ISODate('2026-09-01') } }).sort({ customer_id: 1 })"
  solution: "db.orders.createIndex({ store_id: 1, channel: 1, customer_id: 1, order_date: 1 })"
  hint: { vi: "Hai trường bằng, rồi trường sắp, cuối cùng trường khoảng.", en: "Two equality fields, then the sort field, then the range field last." }
- id: e-mg-d-esr-3
  skill: mg.esr
  kind: trap
  grade: esr
  task: { vi: "Tạo index ghép phục vụ truy vấn: sản phẩm danh mục `Snacks` giá trên 20.000 đồng, sắp theo tên A→Z.", en: "Create a compound index for the query: `Snacks` products priced above 20,000 VND, sorted by name A→Z." }
  query: "db.products.find({ category: 'Snacks', price_vnd: { $gt: 20000 } }).sort({ name: 1 })"
  solution: "db.products.createIndex({ category: 1, name: 1, price_vnd: 1 })"
  hint: { vi: "Đừng đặt trường khoảng trước trường sắp.", en: "Do not put the range field before the sort field." }
  wrong:
    - query: "db.products.createIndex({ category: 1, price_vnd: 1, name: 1 })"
      vi: "Thứ tự viết trong truy vấn không phải thứ tự index: `price_vnd` là khoảng, đứng trước `name` thì kết quả phải sắp lại trong bộ nhớ."
      en: "The order in the query is not the index order: `price_vnd` is a range, and before `name` it forces an in-memory sort."
- id: e-mg-d-esr-4
  skill: mg.esr
  kind: review
  grade: esr
  task: { vi: "Tạo index ghép phục vụ truy vấn: khách ở `Da Nang` sinh từ năm 1990, sắp theo ngày đăng ký mới nhất trước.", en: "Create a compound index for the query: customers in `Da Nang` born in 1990 or later, sorted by signup date newest first." }
  query: "db.customers.find({ city: 'Da Nang', birth_year: { $gte: 1990 } }).sort({ signup_date: -1 })"
  solution: "db.customers.createIndex({ city: 1, signup_date: -1, birth_year: 1 })"
  hint: { vi: "Equality → Sort → Range.", en: "Equality → Sort → Range." }

