    - { vi: "Truy vấn phủ: mọi trường cần đều có trong index, không phải đọc tài liệu", en: "A covered query: every needed field is in the index, no document is read" }
    - { vi: "Kết quả lấy từ bộ nhớ đệm của lần chạy trước", en: "The result comes from the previous run's cache" }
  answer: 1
