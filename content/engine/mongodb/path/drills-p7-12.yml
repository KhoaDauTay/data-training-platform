- id: e-mg-d-full-like-2
  skill: mg.full_like
  kind: open
  task: { vi: "Mỗi cửa hàng (`_id` là mã cửa hàng): số đơn `CANCELLED` (`cancelled`) và số đơn `REFUNDED` (`refunded`) trong tháng 9 và 10/2026, cửa hàng có ít nhất một trong hai loại; thiếu thì 0.", en: "Each store (`_id` is the store id): the number of `CANCELLED` orders (`cancelled`) and of `REFUNDED` orders (`refunded`) in September and October 2026, for stores with at least one of either; 0 when missing." }
  solution: |-
