    { winningPlan: { stage: 'SORT', sortPattern: { store_id: 1 },
        inputStage: { stage: 'FETCH', inputStage: { stage: 'IXSCAN', keyPattern: { status: 1, order_date: 1 } } } },
      executionStats: { nReturned: 740, totalKeysExamined: 740, totalDocsExamined: 740 } }
  options:
    - { vi: "Tốt: có `IXSCAN` và số tài liệu đọc bằng số trả về", en: "Good: there is an `IXSCAN` and documents read equal documents returned" }
    - { vi: "Chưa: stage `SORT` là sắp trong bộ nhớ; index theo ESR `{ status: 1, store_id: 1, order_date: 1 }` bỏ được nó", en: "Not yet: the `SORT` stage is an in-memory sort; the ESR index `{ status: 1, store_id: 1, order_date: 1 }` removes it" }
    - { vi: "Chưa: phải thêm `hint()` để ép dùng `_id`", en: "Not yet: add a `hint()` to force the `_id` index" }
  answer: 1
