# ---- mg.array_ops (Phần 12)
- id: e-mg-d-array-ops-1
  skill: mg.array_ops
  kind: faded
  task: { vi: "Những đơn có một dòng hàng vừa là sản phẩm 21 vừa có số lượng từ 4 trở lên: chỉ mã đơn (`_id`).", en: "The orders with one line that is product 21 and has a quantity of 4 or more: the order id (`_id`) only." }
  starter: "db.orders.find({ items: { ___: { product_id: 21, qty: { $gte: 4 } } } }, { _id: 1 })"
  solution: "db.orders.find({ items: { $elemMatch: { product_id: 21, qty: { $gte: 4 } } } }, { _id: 1 })"
  hint: { vi: "Toán tử buộc mọi điều kiện khớp cùng một phần tử mảng là `$elemMatch`.", en: "The operator that makes every condition match the same array element is `$elemMatch`." }
- id: e-mg-d-array-ops-2
  skill: mg.array_ops
  kind: open
  task: { vi: "Các đơn ngày 2026-10-31: mã đơn (`_id`) và `big_lines`, chỉ gồm các dòng hàng có số lượng từ 3 trở lên (giữ nguyên thứ tự dòng).", en: "Orders of 2026-10-31: the order id (`_id`) and `big_lines`, holding only the lines with a quantity of 3 or more (keep the line order)." }
  solution: |-
    db.orders.aggregate([
      { $match: { order_date: ISODate('2026-10-31') } },
      { $project: { big_lines: { $filter: { input: '$items', as: 'i', cond: { $gte: ['$$i.qty', 3] } } } } }
    ])
  hint: { vi: "Lọc phần tử ngay trong mảng: `input` là `'$items'`, điều kiện đọc phần tử qua biến `as`.", en: "Filter elements inside the array: `input` is `'$items'`, the condition reads the element through the `as` variable." }
- id: e-mg-d-array-ops-3
  skill: mg.array_ops
  kind: trap
  task: { vi: "Những đơn có một dòng hàng là sản phẩm 9 với số lượng từ 5 trở lên trên chính dòng đó: chỉ mã đơn (`_id`).", en: "The orders with a line that is product 9 with a quantity of 5 or more on that same line: the order id (`_id`) only." }
  solution: "db.orders.find({ items: { $elemMatch: { product_id: 9, qty: { $gte: 5 } } } }, { _id: 1 })"
  hint: { vi: "\"Trên chính dòng đó\": hai điều kiện phải khớp cùng một phần tử.", en: "\"On that same line\": both conditions must match the same element." }
  wrong:
    - query: "db.orders.find({ 'items.product_id': 9, 'items.qty': { $gte: 5 } }, { _id: 1 })"
      vi: "Hai điều kiện trên `items.product_id` và `items.qty` được khớp riêng: đơn có sản phẩm 9 số lượng 1 và một dòng khác số lượng 5 cũng lọt."
      en: "The conditions on `items.product_id` and `items.qty` match separately: an order with product 9 at quantity 1 and another line at quantity 5 slips in."
- id: e-mg-d-array-ops-4
  skill: mg.array_ops
  kind: review
  task: { vi: "Các đơn ngày 2026-10-31: mã đơn (`_id`), số dòng hàng (`n_lines`) và giá trị đơn (`total`, tổng số lượng × đơn giá của các dòng), không trải mảng ra.", en: "Orders of 2026-10-31: the order id (`_id`), the number of lines (`n_lines`) and the order value (`total`, sum of quantity × unit price over the lines), without spreading the array." }
  solution: |-
    db.orders.aggregate([
      { $match: { order_date: ISODate('2026-10-31') } },
      { $project: {
        n_lines: { $size: '$items' },
        total: { $sum: { $map: { input: '$items', in: { $multiply: ['$$this.qty', '$$this.unit_price_vnd'] } } } }
      } }
    ])
  hint: { vi: "Đếm phần tử mảng; biến mỗi dòng thành số lượng × đơn giá rồi cộng mảng đó.", en: "Count the array's elements; turn each line into quantity × unit price, then sum that array." }

# ---- mg.schema_validation (Phần 12)
- id: e-mg-d-schema-validation-1
  skill: mg.schema_validation
  kind: faded
  task: { vi: "Sắp bật luật \"`email` phải là chuỗi\" cho `customers`. Những khách nào đang phạm luật? Mã khách (`_id`) và tên (`name`).", en: "A rule \"`email` must be a string\" is about to go on `customers`. Which customers break it today? The customer id (`_id`) and the name (`name`)." }
  starter: "db.customers.find({ email: { $not: { ___: 'string' } } }, { name: 1 })"
  solution: "db.customers.find({ email: { $not: { $type: 'string' } } }, { name: 1 })"
  hint: { vi: "Toán tử kiểm kiểu BSON của một trường là `$type`.", en: "The operator that checks a field's BSON type is `$type`." }
- id: e-mg-d-schema-validation-2
  skill: mg.schema_validation
  kind: open
  task: { vi: "Luật mới: mỗi đơn phải có `customer_id` là số nguyên. Mỗi kênh (`_id` là kênh): số đơn đang phạm luật (`n`).", en: "New rule: every order must have an integer `customer_id`. Per channel (`_id` is the channel): the number of orders breaking it today (`n`)." }
  solution: |-
    db.orders.aggregate([
      { $match: { customer_id: { $not: { $type: 'int' } } } },
      { $group: { _id: '$channel', n: { $sum: 1 } } }
    ])
  hint: { vi: "Lọc đơn có `customer_id` không phải kiểu `'int'`, rồi đếm theo kênh.", en: "Keep orders whose `customer_id` is not of type `'int'`, then count per channel." }
- id: e-mg-d-schema-validation-3
  skill: mg.schema_validation
  kind: trap
  task: { vi: "Hai luật cho `customers`: `email` phải là chuỗi, và `city` phải là chuỗi. Những khách phạm ít nhất một luật: mã khách (`_id`) và tên (`name`).", en: "Two rules for `customers`: `email` must be a string, and `city` must be a string. The customers breaking at least one rule: the customer id (`_id`) and the name (`name`)." }
  solution: "db.customers.find({ $or: [{ email: { $not: { $type: 'string' } } }, { city: { $not: { $type: 'string' } } }] }, { name: 1 })"
  hint: { vi: "\"Ít nhất một luật\": nối hai điều kiện bằng \"hoặc\".", en: "\"At least one rule\": join the two conditions with \"or\"." }
  wrong:
    - query: "db.customers.find({ email: { $not: { $type: 'string' } }, city: { $not: { $type: 'string' } } }, { name: 1 })"
      vi: "Hai điều kiện trong cùng một tài liệu lọc là AND: chỉ ra khách phạm cả hai luật cùng lúc."
      en: "Two conditions in one filter document are an AND: you only get customers breaking both rules at once."
- id: e-mg-d-schema-validation-4
  skill: mg.schema_validation
  kind: review
  task: { vi: "Luật cho `customers`: `birth_year` phải là số nguyên. Có bao nhiêu khách đang phạm luật? Trả một tài liệu `{ n }`.", en: "A rule for `customers`: `birth_year` must be an integer. How many customers break it today? Return one document `{ n }`." }
  solution: |-
    db.customers.aggregate([
      { $match: { birth_year: { $not: { $type: 'int' } } } },
      { $count: 'n' }
    ])
  hint: { vi: "Phủ định của phép kiểm kiểu `'int'`, rồi đếm.", en: "The negation of the `'int'` type check, then count." }

# ---- mg.bucket_pattern (Phần 12)
- id: e-mg-d-bucket-pattern-1
  skill: mg.bucket_pattern
  kind: faded
  task: { vi: "Cửa hàng 1, tháng 10/2026: gom đơn thành một bucket mỗi ngày (`_id` là ngày), với số đơn tính sẵn (`count`) và mảng mã đơn tăng dần (`ids`).", en: "Store 1, October 2026: put the orders into one bucket per day (`_id` is the day), with a precomputed order count (`count`) and an ascending array of order ids (`ids`)." }
  starter: |-
    db.orders.aggregate([
      { $match: { store_id: 1, order_date: { $gte: ISODate('2026-10-01'), $lt: ISODate('2026-11-01') } } },
      { $sort: { _id: 1 } },
      { $group: { _id: '$order_date', count: { $sum: ___ }, ids: { ___: '$_id' } } }
    ])
  solution: |-
    db.orders.aggregate([
      { $match: { store_id: 1, order_date: { $gte: ISODate('2026-10-01'), $lt: ISODate('2026-11-01') } } },
      { $sort: { _id: 1 } },
      { $group: { _id: '$order_date', count: { $sum: 1 }, ids: { $push: '$_id' } } }
    ])
  hint: { vi: "Đếm bằng cộng 1; gom mã đơn theo thứ tự đã sắp bằng `$push`.", en: "Count by adding 1; collect order ids in the sorted order with `$push`." }
- id: e-mg-d-bucket-pattern-2
  skill: mg.bucket_pattern
  kind: open
  task: { vi: "Mẫu tính sẵn: mỗi sản phẩm (`_id` là mã sản phẩm) có tổng số lượng đã bán (`sold_qty`) và doanh thu (`revenue`, số lượng × đơn giá) của các đơn `PAID` năm 2026.", en: "Computed pattern: each product (`_id` is the product id) with the total quantity sold (`sold_qty`) and the revenue (`revenue`, quantity × unit price) of `PAID` orders in 2026." }
  solution: |-
    db.orders.aggregate([
      { $match: { status: 'PAID', order_date: { $gte: ISODate('2026-01-01'), $lt: ISODate('2027-01-01') } } },
      { $unwind: '$items' },
      { $group: { _id: '$items.product_id', sold_qty: { $sum: '$items.qty' }, revenue: { $sum: { $multiply: ['$items.qty', '$items.unit_price_vnd'] } } } }
    ])
  hint: { vi: "Trải dòng hàng ra, rồi gộp theo sản phẩm hai con số.", en: "Spread the lines, then group two numbers per product." }
- id: e-mg-d-bucket-pattern-3
  skill: mg.bucket_pattern
  kind: trap
  task: { vi: "Đơn từ 2025-10-01 đến hết 2026-10-31: một bucket mỗi cửa hàng mỗi tháng (`_id` gồm `store` và `month`, `month` là ngày đầu tháng) với số đơn (`count`).", en: "Orders from 2025-10-01 through 2026-10-31: one bucket per store per month (`_id` holds `store` and `month`, `month` being the first day of the month) with the order count (`count`)." }
  solution: |-
    db.orders.aggregate([
      { $match: { order_date: { $gte: ISODate('2025-10-01'), $lt: ISODate('2026-11-01') } } },
      { $group: { _id: { store: '$store_id', month: { $dateTrunc: { date: '$order_date', unit: 'month' } } }, count: { $sum: 1 } } }
    ])
  hint: { vi: "Khóa tháng phải giữ cả năm: cắt ngày về đầu tháng.", en: "The month key must keep the year: truncate the date to the month start." }
  wrong:
    - query: "db.orders.aggregate([{ $match: { order_date: { $gte: ISODate('2025-10-01'), $lt: ISODate('2026-11-01') } } }, { $group: { _id: { store: '$store_id', month: { $month: '$order_date' } }, count: { $sum: 1 } } }])"
      vi: "`$month` chỉ trả 1–12: tháng 10/2025 và tháng 10/2026 rơi vào cùng một bucket."
      en: "`$month` only returns 1–12: October 2025 and October 2026 land in the same bucket."
- id: e-mg-d-bucket-pattern-4
  skill: mg.bucket_pattern
  kind: review
  task: { vi: "Năm 2026: một bucket mỗi cửa hàng mỗi tháng (`_id` gồm `store` và `month`, `month` là ngày đầu tháng) với số đơn (`count`) và doanh thu (`revenue`, tổng số lượng × đơn giá).", en: "Year 2026: one bucket per store per month (`_id` holds `store` and `month`, `month` being the first day of the month) with the order count (`count`) and the revenue (`revenue`, sum of quantity × unit price)." }
  solution: |-
    db.orders.aggregate([
      { $match: { order_date: { $gte: ISODate('2026-01-01'), $lt: ISODate('2027-01-01') } } },
      { $group: {
        _id: { store: '$store_id', month: { $dateTrunc: { date: '$order_date', unit: 'month' } } },
        count: { $sum: 1 },
        revenue: { $sum: { $sum: { $map: { input: '$items', in: { $multiply: ['$$this.qty', '$$this.unit_price_vnd'] } } } } }
      } }
    ])
  hint: { vi: "Giá trị mỗi đơn tính ngay trên mảng của nó, rồi cộng theo bucket; đếm bằng cộng 1.", en: "Compute each order's value on its own array, then sum per bucket; count by adding 1." }
