# Drill lộ trình MongoDB, Phần 7–12: 4 mỗi kỹ năng (faded, open, trap, review; L168), id `e-mg-d-<kỹ năng>-<n>` (khớp ENGINE_ID)
# (tên kỹ năng bỏ tiền tố `mg.`, `_` thành `-`). Dữ liệu: content/engine/mongodb/path/dataset.json.
# Lời giải là tập con mongosh (product-design-db-engine §4.2): db.<coll>.find(...)[.sort/.limit/.skip], .countDocuments(...), .aggregate([...]),
# .distinct(...), .createIndex(...). Ngày là ISODate('YYYY-MM-DD') (trường *_date, *_on là Date UTC nửa đêm).
# Chấm theo §3.5: khớp theo tên trường, multiset trừ khi `ordered: true`; `wrong: [{ query, vi, en }]`.
# Định dạng ngoài kết quả tài liệu (Phần 11–12, vì mingo không có index/explain):
#   format: choice  -> `shown` (đoạn để đọc; faded có `___` trong đó), `options`, `answer` (vị trí, từ 0), `why`;
#                      trap có `wrong: [{ option, vi, en }]`. Đoạn explain là MINH HỌA (`illustrative: true`), không phải bản ghi mongod.
#   grade: esr      -> lời giải là createIndex; chấm theo luật Equality → Sort → Range trên `query`.
#   grade: covered  -> chạy và so kết quả (tính cả `_id`), rồi kiểm luật phủ trên `index`.
# Đề không nêu toán tử là đáp án (D8a-7); tên trường trong backtick được phép.

# ---- mg.lookup_pipeline (Phần 7)
- id: e-mg-d-lookup-pipeline-1
  skill: mg.lookup_pipeline
  kind: faded
  task: { vi: "Mỗi cửa hàng: tên (`name`) và số đơn bán qua kênh `ONLINE` (`online_orders`), kể cả cửa hàng không có đơn nào như vậy.", en: "Each store: the name (`name`) and the number of orders sold through the `ONLINE` channel (`online_orders`), including stores with none." }
  starter: |-
    db.stores.aggregate([
      { $lookup: { from: 'orders', let: { sid: '$_id' }, pipeline: [
        { $match: { $expr: { $and: [{ $eq: ['$store_id', ___] }, { $eq: ['$channel', ___] }] } } }
      ], as: 'online' } },
      { $project: { _id: 0, name: 1, online_orders: { $size: '$online' } } }
    ])
  solution: |-
    db.stores.aggregate([
      { $lookup: { from: 'orders', let: { sid: '$_id' }, pipeline: [
        { $match: { $expr: { $and: [{ $eq: ['$store_id', '$$sid'] }, { $eq: ['$channel', 'ONLINE'] }] } } }
      ], as: 'online' } },
      { $project: { _id: 0, name: 1, online_orders: { $size: '$online' } } }
    ])
  hint: { vi: "Biến `sid` khai trong `let` được đọc là `'$$sid'`; kênh là chuỗi `'ONLINE'`.", en: "The `sid` variable declared in `let` is read as `'$$sid'`; the channel is the string `'ONLINE'`." }
- id: e-mg-d-lookup-pipeline-2
  skill: mg.lookup_pipeline
  kind: open
  task: { vi: "Mỗi sản phẩm: tên (`name`) và số đơn trong tháng 10/2026 có chứa sản phẩm đó (`orders_oct`), kể cả sản phẩm không có đơn nào.", en: "Each product: the name (`name`) and the number of October 2026 orders that contain it (`orders_oct`), including products with none." }
  solution: |-
    db.products.aggregate([
      { $lookup: { from: 'orders', let: { pid: '$_id' }, pipeline: [
        { $match: { order_date: { $gte: ISODate('2026-10-01'), $lt: ISODate('2026-11-01') } } },
        { $match: { $expr: { $in: ['$$pid', '$items.product_id'] } } }
      ], as: 'o' } },
      { $project: { _id: 0, name: 1, orders_oct: { $size: '$o' } } }
    ])
  hint: { vi: "Trong pipeline của `$lookup`, lọc tháng bằng một `$match` thường, rồi kiểm `'$$pid'` có nằm trong `'$items.product_id'` bằng `$expr`.", en: "Inside the `$lookup` pipeline, filter the month with a plain `$match`, then check that `'$$pid'` is in `'$items.product_id'` with `$expr`." }
- id: e-mg-d-lookup-pipeline-3
  skill: mg.lookup_pipeline
  kind: trap
  task: { vi: "Mỗi cửa hàng: tên (`name`) và số đơn đã thanh toán (trạng thái `PAID`) (`paid_orders`), kể cả cửa hàng không có đơn nào như vậy.", en: "Each store: the name (`name`) and the number of paid orders (status `PAID`) (`paid_orders`), including stores with none." }
  solution: |-
    db.stores.aggregate([
      { $lookup: { from: 'orders', let: { sid: '$_id' }, pipeline: [
        { $match: { status: 'PAID', $expr: { $eq: ['$store_id', '$$sid'] } } }
      ], as: 'paid' } },
      { $project: { _id: 0, name: 1, paid_orders: { $size: '$paid' } } }
    ])
  hint: { vi: "Phép nối chỉ theo khóa thì không lọc được trạng thái; đưa điều kiện `status` vào pipeline của `$lookup`.", en: "A key-only join cannot filter the status; put the `status` condition into the `$lookup` pipeline." }
  wrong:
    - query: "db.stores.aggregate([{ $lookup: { from: 'orders', localField: '_id', foreignField: 'store_id', as: 'paid' } }, { $project: { _id: 0, name: 1, paid_orders: { $size: '$paid' } } }])"
      vi: "`localField`/`foreignField` gắn mọi đơn của cửa hàng, kể cả đơn hủy và hoàn tiền, nên con số là tổng số đơn."
      en: "`localField`/`foreignField` attaches every order of the store, cancelled and refunded ones included, so the number is the total order count."
- id: e-mg-d-lookup-pipeline-4
  skill: mg.lookup_pipeline
  kind: review
  task: { vi: "Mỗi khách ở `Hue`: tên (`name`) và ngày của đơn gần đây nhất (`last_order`).", en: "Each customer in `Hue`: the name (`name`) and the date of their most recent order (`last_order`)." }
  solution: |-
    db.customers.aggregate([
      { $match: { city: 'Hue' } },
      { $lookup: { from: 'orders', let: { cid: '$_id' }, pipeline: [
        { $match: { $expr: { $eq: ['$customer_id', '$$cid'] } } },
        { $sort: { order_date: -1 } },
        { $limit: 1 }
      ], as: 'last' } },
      { $project: { _id: 0, name: 1, last_order: { $arrayElemAt: ['$last.order_date', 0] } } }
    ])
  hint: { vi: "Trong pipeline của `$lookup`: lọc đơn của khách, sắp ngày giảm dần, giữ 1 đơn; rồi lấy phần tử đầu của mảng.", en: "Inside the `$lookup` pipeline: keep the customer's orders, sort by date descending, keep 1; then take the array's first element." }

# ---- mg.in_other (Phần 7)
- id: e-mg-d-in-other-1
  skill: mg.in_other
  kind: faded
  task: { vi: "Những sản phẩm đã từng được bán ở cửa hàng 4: chỉ tên (`name`).", en: "The products ever sold at store 4: the name (`name`) only." }
  starter: |-
    db.products.aggregate([
      { $lookup: { from: 'orders', let: { pid: '$_id' }, pipeline: [
        { $match: { store_id: 4, $expr: { $in: ['$$pid', '$items.product_id'] } } },
        { $limit: 1 }
      ], as: 'hit' } },
      { $match: { hit: { ___: [] } } },
      { $project: { _id: 0, name: 1 } }
    ])
  solution: |-
    db.products.aggregate([
      { $lookup: { from: 'orders', let: { pid: '$_id' }, pipeline: [
        { $match: { store_id: 4, $expr: { $in: ['$$pid', '$items.product_id'] } } },
        { $limit: 1 }
      ], as: 'hit' } },
      { $match: { hit: { $ne: [] } } },
      { $project: { _id: 0, name: 1 } }
    ])
  hint: { vi: "Giữ sản phẩm mà mảng `hit` không rỗng: so `hit` với mảng rỗng bằng phép \"khác\".", en: "Keep products whose `hit` array is not empty: compare `hit` with the empty array using \"not equal\"." }
- id: e-mg-d-in-other-2
  skill: mg.in_other
  kind: open
  task: { vi: "Những khách đã đặt ít nhất một đơn kênh `ONLINE` trong tháng 10/2026: chỉ tên (`name`), mỗi khách một lần.", en: "The customers who placed at least one `ONLINE` order in October 2026: the name (`name`) only, each customer once." }
  solution: |-
    db.customers.aggregate([
      { $lookup: { from: 'orders', let: { cid: '$_id' }, pipeline: [
        { $match: { channel: 'ONLINE', order_date: { $gte: ISODate('2026-10-01'), $lt: ISODate('2026-11-01') }, $expr: { $eq: ['$customer_id', '$$cid'] } } },
        { $limit: 1 }
      ], as: 'hit' } },
      { $match: { hit: { $ne: [] } } },
      { $project: { _id: 0, name: 1 } }
    ])
  hint: { vi: "Đi từ `customers`; pipeline của `$lookup` lọc kênh, tháng và khách; giữ khách có `hit` không rỗng.", en: "Start from `customers`; the `$lookup` pipeline filters channel, month and customer; keep customers whose `hit` is not empty." }
- id: e-mg-d-in-other-3
  skill: mg.in_other
  kind: trap
  task: { vi: "Những khách đã từng mua sản phẩm 21 (`Sunscreen`): mã khách (`_id`) và tên (`name`), mỗi khách đúng một lần.", en: "The customers who ever bought product 21 (`Sunscreen`): the customer id (`_id`) and the name (`name`), each customer exactly once." }
  solution: |-
    db.customers.aggregate([
      { $lookup: { from: 'orders', let: { cid: '$_id' }, pipeline: [
        { $match: { 'items.product_id': 21, $expr: { $eq: ['$customer_id', '$$cid'] } } },
        { $limit: 1 }
      ], as: 'hit' } },
      { $match: { hit: { $ne: [] } } },
      { $project: { name: 1 } }
    ])
  hint: { vi: "Chỉ cần biết có hay không: giữ khách có `hit` không rỗng, đừng trải mảng ra.", en: "You only need to know whether a match exists: keep customers whose `hit` is not empty, do not spread the array." }
  wrong:
    - query: "db.customers.aggregate([{ $lookup: { from: 'orders', localField: '_id', foreignField: 'customer_id', as: 'o' } }, { $unwind: '$o' }, { $match: { 'o.items.product_id': 21 } }, { $project: { name: 1 } }])"
      vi: "`$unwind` tạo một tài liệu cho mỗi đơn khớp, nên khách mua `Sunscreen` hai lần hiện hai lần."
      en: "`$unwind` makes one document per matching order, so a customer who bought `Sunscreen` twice shows up twice."
- id: e-mg-d-in-other-4
  skill: mg.in_other
  kind: review
  task: { vi: "Những cửa hàng có ít nhất một đơn hoàn tiền (trạng thái `REFUNDED`) từ 2026-01-01: chỉ tên (`name`).", en: "The stores with at least one refunded order (status `REFUNDED`) from 2026-01-01: the name (`name`) only." }
  solution: |-
    db.stores.aggregate([
      { $lookup: { from: 'orders', let: { sid: '$_id' }, pipeline: [
        { $match: { status: 'REFUNDED', order_date: { $gte: ISODate('2026-01-01') }, $expr: { $eq: ['$store_id', '$$sid'] } } },
        { $limit: 1 }
      ], as: 'hit' } },
      { $match: { hit: { $ne: [] } } },
      { $project: { _id: 0, name: 1 } }
    ])
  hint: { vi: "Pipeline của `$lookup` lọc trạng thái, ngày và cửa hàng; giữ cửa hàng có `hit` không rỗng.", en: "The `$lookup` pipeline filters status, date and store; keep stores whose `hit` is not empty." }

# ---- mg.facet (Phần 7)
- id: e-mg-d-facet-1
  skill: mg.facet
  kind: faded
  task: { vi: "Đơn tháng 10/2026, trả đúng một tài liệu có hai trường: `by_channel` (mỗi kênh `_id` và số đơn `n`, sắp theo kênh A→Z) và `total` (một phần tử `{ n }` là tổng số đơn).", en: "October 2026 orders, return exactly one document with two fields: `by_channel` (each channel `_id` with its order count `n`, sorted by channel A→Z) and `total` (one element `{ n }`, the overall order count)." }
  starter: |-
    db.orders.aggregate([
      { $match: { order_date: { $gte: ISODate('2026-10-01'), $lt: ISODate('2026-11-01') } } },
      { ___: {
        by_channel: [{ $group: { _id: '$channel', n: { $sum: 1 } } }, { $sort: { _id: 1 } }],
        total: [{ $count: ___ }]
      } }
    ])
  solution: |-
    db.orders.aggregate([
      { $match: { order_date: { $gte: ISODate('2026-10-01'), $lt: ISODate('2026-11-01') } } },
      { $facet: {
        by_channel: [{ $group: { _id: '$channel', n: { $sum: 1 } } }, { $sort: { _id: 1 } }],
        total: [{ $count: 'n' }]
      } }
    ])
  hint: { vi: "Stage chạy nhiều pipeline con trên cùng tập đã lọc tên là `$facet`; `$count` nhận tên trường kết quả `'n'`.", en: "The stage that runs several sub-pipelines on the same filtered set is `$facet`; `$count` takes the output field name `'n'`." }
- id: e-mg-d-facet-2
  skill: mg.facet
  kind: open
  task: { vi: "Sản phẩm, trả một tài liệu có `cheap` (một phần tử `{ n }`: số sản phẩm giá dưới 20.000 đồng) và `top3` (3 sản phẩm đắt nhất: `name`, `price_vnd`, không `_id`, đắt nhất trước; cùng giá thì tên A→Z).", en: "Products, return one document with `cheap` (one element `{ n }`: how many products cost under 20,000 VND) and `top3` (the 3 most expensive products: `name`, `price_vnd`, no `_id`, most expensive first; on the same price, name A→Z)." }
  solution: |-
    db.products.aggregate([
      { $facet: {
        cheap: [{ $match: { price_vnd: { $lt: 20000 } } }, { $count: 'n' }],
        top3: [{ $sort: { price_vnd: -1, name: 1 } }, { $limit: 3 }, { $project: { _id: 0, name: 1, price_vnd: 1 } }]
      } }
    ])
  hint: { vi: "Mỗi trường của kết quả là một pipeline con: một cái lọc rồi đếm, một cái sắp, cắt 3 và chọn trường.", en: "Each output field is a sub-pipeline: one filters then counts, one sorts, keeps 3 and picks fields." }
- id: e-mg-d-facet-3
  skill: mg.facet
  kind: trap
  task: { vi: "Đơn tháng 10/2026, trả một tài liệu có `by_status` (mỗi trạng thái `_id` và số đơn `n`, sắp theo trạng thái A→Z) và `total` (một phần tử `{ n }` là tổng số đơn).", en: "October 2026 orders, return one document with `by_status` (each status `_id` with its order count `n`, sorted by status A→Z) and `total` (one element `{ n }`, the overall order count)." }
  solution: |-
    db.orders.aggregate([
      { $match: { order_date: { $gte: ISODate('2026-10-01'), $lt: ISODate('2026-11-01') } } },
      { $facet: {
        by_status: [{ $group: { _id: '$status', n: { $sum: 1 } } }, { $sort: { _id: 1 } }],
        total: [{ $count: 'n' }]
      } }
    ])
  hint: { vi: "Hai phép tính phải cùng thấy các đơn đã lọc, nên chạy song song chứ không nối tiếp.", en: "Both computations must see the filtered orders, so they run side by side, not one after the other." }
  wrong:
    - query: "db.orders.aggregate([{ $match: { order_date: { $gte: ISODate('2026-10-01'), $lt: ISODate('2026-11-01') } } }, { $group: { _id: '$status', n: { $sum: 1 } } }, { $sort: { _id: 1 } }, { $group: { _id: null, by_status: { $push: '$$ROOT' }, total: { $sum: 1 } } }])"
      vi: "`$group` thứ hai chỉ thấy các nhóm trạng thái, nên `total` đếm số trạng thái chứ không phải số đơn."
      en: "The second `$group` only sees the status groups, so `total` counts statuses, not orders."
- id: e-mg-d-facet-4
  skill: mg.facet
  kind: review
  task: { vi: "Khách hàng, trả một tài liệu có `by_city` (mỗi thành phố `_id` và số khách `n`, sắp theo số khách giảm dần, cùng số thì tên thành phố A→Z; khách không rõ thành phố là một nhóm riêng) và `no_email` (một phần tử `{ n }`: số khách không có email).", en: "Customers, return one document with `by_city` (each city `_id` and its customer count `n`, sorted by count descending, then city A→Z; customers with no city form their own group) and `no_email` (one element `{ n }`: how many customers have no email)." }
  solution: |-
    db.customers.aggregate([
      { $facet: {
        by_city: [{ $group: { _id: '$city', n: { $sum: 1 } } }, { $sort: { n: -1, _id: 1 } }],
        no_email: [{ $match: { email: null } }, { $count: 'n' }]
      } }
    ])
  hint: { vi: "Hai pipeline con: một gộp theo `city` rồi sắp hai khóa, một lọc `email` trống rồi đếm.", en: "Two sub-pipelines: one groups by `city` then sorts on two keys, one keeps an empty `email` then counts." }

# ---- mg.stages (Phần 8)
- id: e-mg-d-stages-1
  skill: mg.stages
  kind: faded
  task: { vi: "Tháng 10/2026, mỗi cửa hàng (`_id` là mã cửa hàng): số đơn trung bình mỗi ngày có đơn (`avg_per_day`).", en: "October 2026, each store (`_id` is the store id): the average number of orders per day that had orders (`avg_per_day`)." }
  starter: |-
    db.orders.aggregate([
      { $match: { order_date: { $gte: ISODate('2026-10-01'), $lt: ISODate('2026-11-01') } } },
      { $group: { _id: { store: '$store_id', day: '$order_date' }, n: { $sum: 1 } } },
      { $group: { _id: ___, avg_per_day: { $avg: ___ } } }
    ])
  solution: |-
    db.orders.aggregate([
      { $match: { order_date: { $gte: ISODate('2026-10-01'), $lt: ISODate('2026-11-01') } } },
      { $group: { _id: { store: '$store_id', day: '$order_date' }, n: { $sum: 1 } } },
      { $group: { _id: '$_id.store', avg_per_day: { $avg: '$n' } } }
    ])
  hint: { vi: "Sau `$group` đầu, mã cửa hàng nằm ở `'$_id.store'` và số đơn mỗi ngày ở `'$n'`.", en: "After the first `$group`, the store id lives at `'$_id.store'` and the daily count at `'$n'`." }
- id: e-mg-d-stages-2
  skill: mg.stages
  kind: open
  task: { vi: "Có bao nhiêu khách (bỏ đơn vãng lai không có khách) đặt nhiều hơn 2 đơn `PAID` từ 2026-01-01? Trả một tài liệu `{ n }`.", en: "How many customers (skip walk-in orders with no customer) placed more than 2 `PAID` orders from 2026-01-01? Return one document `{ n }`." }
  solution: |-
    db.orders.aggregate([
      { $match: { status: 'PAID', customer_id: { $ne: null }, order_date: { $gte: ISODate('2026-01-01') } } },
      { $group: { _id: '$customer_id', orders: { $sum: 1 } } },
      { $match: { orders: { $gt: 2 } } },
      { $count: 'n' }
    ])
  hint: { vi: "Bốn bước: lọc đơn, gộp theo khách, lọc trên con số vừa tính, đếm.", en: "Four steps: filter orders, group by customer, filter on the number you just computed, count." }
- id: e-mg-d-stages-3
  skill: mg.stages
  kind: trap
  task: { vi: "Tháng 10/2026, đơn `PAID`, mỗi cửa hàng (`_id` là mã cửa hàng): giá trị trung bình một đơn (`avg_order`), giá trị đơn là tổng số lượng × đơn giá của các dòng.", en: "October 2026, `PAID` orders, each store (`_id` is the store id): the average value of one order (`avg_order`), where an order's value is the sum of quantity × unit price over its lines." }
  solution: |-
    db.orders.aggregate([
      { $match: { status: 'PAID', order_date: { $gte: ISODate('2026-10-01'), $lt: ISODate('2026-11-01') } } },
      { $unwind: '$items' },
      { $group: { _id: { order: '$_id', store: '$store_id' }, value: { $sum: { $multiply: ['$items.qty', '$items.unit_price_vnd'] } } } },
      { $group: { _id: '$_id.store', avg_order: { $avg: '$value' } } }
    ])
  hint: { vi: "Cộng giá trị từng đơn trước (một bước gộp theo đơn), rồi mới lấy trung bình theo cửa hàng.", en: "Sum each order's value first (one step grouped by order), then average per store." }
  wrong:
    - query: "db.orders.aggregate([{ $match: { status: 'PAID', order_date: { $gte: ISODate('2026-10-01'), $lt: ISODate('2026-11-01') } } }, { $unwind: '$items' }, { $group: { _id: '$store_id', avg_order: { $avg: { $multiply: ['$items.qty', '$items.unit_price_vnd'] } } } }])"
      vi: "Sau `$unwind` mỗi tài liệu là một dòng hàng, nên đây là trung bình một dòng, không phải một đơn."
      en: "After `$unwind` each document is one line, so this is the average of a line, not of an order."
- id: e-mg-d-stages-4
  skill: mg.stages
  kind: review
  task: { vi: "Tháng 9/2026, mỗi cửa hàng (`_id` là mã cửa hàng): số đơn của ngày đông nhất (`best_day`).", en: "September 2026, each store (`_id` is the store id): the order count of its busiest day (`best_day`)." }
  solution: |-
    db.orders.aggregate([
      { $match: { order_date: { $gte: ISODate('2026-09-01'), $lt: ISODate('2026-10-01') } } },
      { $group: { _id: { store: '$store_id', day: '$order_date' }, n: { $sum: 1 } } },
      { $group: { _id: '$_id.store', best_day: { $max: '$n' } } }
    ])
  hint: { vi: "Đếm theo cửa hàng và ngày, rồi lấy số lớn nhất theo cửa hàng.", en: "Count per store and day, then take the largest number per store." }

# ---- mg.first_per_group (Phần 8)
- id: e-mg-d-first-per-group-1
  skill: mg.first_per_group
  kind: faded
  task: { vi: "Mỗi danh mục (`_id`): sản phẩm rẻ nhất, tên (`name`) và giá (`price_vnd`); cùng giá thì tên A→Z.", en: "Each category (`_id`): the cheapest product, its name (`name`) and price (`price_vnd`); on the same price, name A→Z." }
  starter: |-
    db.products.aggregate([
      { $sort: { price_vnd: ___, name: 1 } },
      { $group: { _id: '$category', name: { ___: '$name' }, price_vnd: { ___: '$price_vnd' } } }
    ])
  solution: |-
    db.products.aggregate([
      { $sort: { price_vnd: 1, name: 1 } },
      { $group: { _id: '$category', name: { $first: '$name' }, price_vnd: { $first: '$price_vnd' } } }
    ])
  hint: { vi: "Sắp giá tăng dần (`1`), rồi trong mỗi nhóm lấy tài liệu đứng đầu bằng `$first`.", en: "Sort price ascending (`1`), then take each group's leading document with `$first`." }
- id: e-mg-d-first-per-group-2
  skill: mg.first_per_group
  kind: open
  task: { vi: "Mỗi trạng thái đơn (`_id` là trạng thái): đơn đầu tiên của năm 2026, mã đơn (`order_id`) và ngày (`order_date`); cùng ngày thì mã đơn nhỏ hơn.", en: "Each order status (`_id` is the status): the first order of 2026, the order id (`order_id`) and date (`order_date`); on the same date, the smaller order id." }
  solution: |-
    db.orders.aggregate([
      { $match: { order_date: { $gte: ISODate('2026-01-01') } } },
      { $sort: { order_date: 1, _id: 1 } },
      { $group: { _id: '$status', order_id: { $first: '$_id' }, order_date: { $first: '$order_date' } } }
    ])
  hint: { vi: "Lọc năm 2026, sắp ngày tăng dần rồi mã đơn tăng dần, sau đó lấy tài liệu đầu mỗi trạng thái.", en: "Keep 2026, sort by date ascending then order id ascending, then take the first document per status." }
- id: e-mg-d-first-per-group-3
  skill: mg.first_per_group
  kind: trap
  task: { vi: "Mỗi cửa hàng (`_id` là mã cửa hàng): đơn gần đây nhất, ngày (`order_date`) và mã đơn (`order_id`) của chính đơn đó; cùng ngày thì mã đơn lớn hơn.", en: "Each store (`_id` is the store id): its most recent order, the date (`order_date`) and the order id (`order_id`) of that same order; on the same date, the larger order id." }
  solution: |-
    db.orders.aggregate([
      { $sort: { order_date: -1, _id: -1 } },
      { $group: { _id: '$store_id', order_date: { $first: '$order_date' }, order_id: { $first: '$_id' } } }
    ])
  hint: { vi: "Hai trường phải đến từ cùng một đơn: sắp trước, rồi lấy cả hai từ tài liệu đầu.", en: "Both fields must come from the same order: sort first, then take both from the leading document." }
  wrong:
    - query: "db.orders.aggregate([{ $group: { _id: '$store_id', order_date: { $max: '$order_date' }, order_id: { $max: '$_id' } } }])"
      vi: "`$max` tính riêng từng trường: ngày lớn nhất và mã lớn nhất có thể thuộc hai đơn khác nhau."
      en: "`$max` works on each field separately: the latest date and the largest id can belong to two different orders."
- id: e-mg-d-first-per-group-4
  skill: mg.first_per_group
  kind: review
  task: { vi: "Mỗi thành phố có cửa hàng (`_id` là thành phố): tên cửa hàng mở sớm nhất (`name`) và ngày mở (`opened_on`).", en: "Each city with stores (`_id` is the city): the name of the earliest-opened store (`name`) and its opening date (`opened_on`)." }
  solution: |-
    db.stores.aggregate([
      { $sort: { opened_on: 1, _id: 1 } },
      { $group: { _id: '$city', name: { $first: '$name' }, opened_on: { $first: '$opened_on' } } }
    ])
  hint: { vi: "Sắp theo ngày mở tăng dần, rồi lấy tài liệu đầu mỗi thành phố.", en: "Sort by opening date ascending, then take the first document per city." }

# ---- mg.set_fields (Phần 8)
- id: e-mg-d-set-fields-1
  skill: mg.set_fields
  kind: faded
  task: { vi: "Mọi sản phẩm, giữ các trường khác nhưng bỏ `category` và thêm `price_k` = giá chia 1.000.", en: "Every product, keep the other fields but drop `category` and add `price_k` = the price divided by 1,000." }
  starter: |-
    db.products.aggregate([
      { $set: { price_k: { $divide: [___, 1000] } } },
      { $unset: ___ }
    ])
  solution: |-
    db.products.aggregate([
      { $set: { price_k: { $divide: ['$price_vnd', 1000] } } },
      { $unset: 'category' }
    ])
  hint: { vi: "Đọc giá bằng `'$price_vnd'`; tên trường cần bỏ là chuỗi `'category'`.", en: "Read the price as `'$price_vnd'`; the field to drop is the string `'category'`." }
- id: e-mg-d-set-fields-2
  skill: mg.set_fields
  kind: open
  task: { vi: "Đơn của cửa hàng 2 từ 2026-10-25 đến 2026-10-31: giữ mọi trường, thay mảng `items` bằng số dòng hàng `lines`.", en: "Store 2 orders from 2026-10-25 to 2026-10-31: keep every field, replace the `items` array with the number of lines `lines`." }
  solution: |-
    db.orders.aggregate([
      { $match: { store_id: 2, order_date: { $gte: ISODate('2026-10-25'), $lte: ISODate('2026-10-31') } } },
      { $set: { lines: { $size: '$items' } } },
      { $unset: 'items' }
    ])
  hint: { vi: "Thêm `lines` từ kích thước mảng trước, rồi mới bỏ `items`.", en: "Add `lines` from the array size first, then drop `items`." }
- id: e-mg-d-set-fields-3
  skill: mg.set_fields
  kind: trap
  task: { vi: "Khách ở `Hue`: giữ mọi trường trừ `email`, thêm `age_2026` = 2026 trừ năm sinh.", en: "Customers in `Hue`: keep every field except `email`, add `age_2026` = 2026 minus the birth year." }
  solution: |-
    db.customers.aggregate([
      { $match: { city: 'Hue' } },
      { $set: { age_2026: { $subtract: [2026, '$birth_year'] } } },
      { $unset: 'email' }
    ])
  hint: { vi: "Thêm trường mà vẫn giữ các trường cũ; bỏ đúng một trường.", en: "Add a field while keeping the old ones; drop exactly one field." }
  wrong:
    - query: "db.customers.aggregate([{ $match: { city: 'Hue' } }, { $project: { age_2026: { $subtract: [2026, '$birth_year'] } } }])"
      vi: "`$project` chỉ giữ những trường được nêu (cộng `_id`), nên tên, thành phố, ngày đăng ký đều mất."
      en: "`$project` keeps only the fields it names (plus `_id`), so the name, city and signup date are all lost."
- id: e-mg-d-set-fields-4
  skill: mg.set_fields
  kind: review
  task: { vi: "Mọi cửa hàng: giữ mọi trường, thay `opened_on` bằng năm mở cửa `opened_year`.", en: "Every store: keep every field, replace `opened_on` with the opening year `opened_year`." }
  solution: |-
    db.stores.aggregate([
      { $set: { opened_year: { $year: '$opened_on' } } },
      { $unset: 'opened_on' }
    ])
  hint: { vi: "Lấy năm của một ngày, thêm thành trường mới, rồi bỏ trường ngày.", en: "Take the year of a date, add it as a new field, then drop the date field." }

# ---- mg.union_with (Phần 9)
- id: e-mg-d-union-with-1
  skill: mg.union_with
  kind: faded
  task: { vi: "Một danh sách gồm tên mọi cửa hàng (`kind` là `'store'`) và tên sản phẩm danh mục `Stationery` (`kind` là `'product'`); mỗi tài liệu chỉ có `name` và `kind`.", en: "One list with the name of every store (`kind` is `'store'`) and the names of the `Stationery` products (`kind` is `'product'`); each document has only `name` and `kind`." }
  starter: |-
    db.stores.aggregate([
      { $project: { _id: 0, name: 1, kind: 'store' } },
      { ___: { coll: ___, pipeline: [
        { $match: { category: 'Stationery' } },
        { $project: { _id: 0, name: 1, kind: 'product' } }
      ] } }
    ])
  solution: |-
    db.stores.aggregate([
      { $project: { _id: 0, name: 1, kind: 'store' } },
      { $unionWith: { coll: 'products', pipeline: [
        { $match: { category: 'Stationery' } },
        { $project: { _id: 0, name: 1, kind: 'product' } }
      ] } }
    ])
  hint: { vi: "Stage ghép thêm tài liệu của collection khác là `$unionWith`; collection là `'products'`.", en: "The stage that appends another collection's documents is `$unionWith`; the collection is `'products'`." }
- id: e-mg-d-union-with-2
  skill: mg.union_with
  kind: open
  task: { vi: "Một danh sách sự kiện ngày 2026-10-31: mỗi đơn của ngày đó (`kind` là `'order'`, `ref` là mã đơn) và mỗi cửa hàng (`kind` là `'store'`, `ref` là mã cửa hàng) để làm bảng điểm danh; mỗi tài liệu chỉ có `kind` và `ref`.", en: "An event list for 2026-10-31: each order of that day (`kind` is `'order'`, `ref` is the order id) and each store (`kind` is `'store'`, `ref` is the store id) for a roll-call sheet; each document has only `kind` and `ref`." }
  solution: |-
    db.orders.aggregate([
      { $match: { order_date: ISODate('2026-10-31') } },
      { $project: { _id: 0, kind: 'order', ref: '$_id' } },
      { $unionWith: { coll: 'stores', pipeline: [{ $project: { _id: 0, kind: 'store', ref: '$_id' } }] } }
    ])
  hint: { vi: "Đổi `_id` của mỗi bên thành `ref` bằng `$project`, rồi ghép collection `stores` vào.", en: "Turn each side's `_id` into `ref` with `$project`, then append the `stores` collection." }
- id: e-mg-d-union-with-3
  skill: mg.union_with
  kind: trap
  task: { vi: "Những thành phố có cửa hàng hoặc có khách (bỏ khách không rõ thành phố), mỗi thành phố đúng một lần, `_id` là tên thành phố.", en: "The cities that have a store or a customer (skip customers with no city), each city exactly once, `_id` is the city name." }
  solution: |-
    db.stores.aggregate([
      { $project: { _id: 0, city: 1 } },
      { $unionWith: { coll: 'customers', pipeline: [{ $match: { city: { $ne: null } } }, { $project: { _id: 0, city: 1 } }] } },
      { $group: { _id: '$city' } }
    ])
  hint: { vi: "Ghép hai nguồn giữ cả bản trùng; gộp theo `city` để mỗi thành phố còn một tài liệu.", en: "Stacking two sources keeps duplicates; group on `city` so each city is one document." }
  wrong:
    - query: "db.stores.aggregate([{ $project: { _id: '$city' } }, { $unionWith: { coll: 'customers', pipeline: [{ $match: { city: { $ne: null } } }, { $project: { _id: '$city' } }] } }])"
      vi: "Ghép thẳng giống UNION ALL: mỗi khách ở `Da Nang` thêm một tài liệu `Da Nang` nữa."
      en: "Stacking alone works like UNION ALL: every customer in `Da Nang` adds one more `Da Nang` document."
- id: e-mg-d-union-with-4
  skill: mg.union_with
  kind: review
  task: { vi: "Một danh sách tên (`name`) của cửa hàng ở `Da Nang` và của khách ở `Da Nang` sinh từ năm 2000, kèm `kind` là `'store'` hoặc `'customer'`; không `_id`.", en: "One list of names (`name`) of the stores in `Da Nang` and of the customers in `Da Nang` born in 2000 or later, with `kind` set to `'store'` or `'customer'`; no `_id`." }
  solution: |-
    db.stores.aggregate([
      { $match: { city: 'Da Nang' } },
      { $project: { _id: 0, name: 1, kind: 'store' } },
      { $unionWith: { coll: 'customers', pipeline: [
        { $match: { city: 'Da Nang', birth_year: { $gte: 2000 } } },
        { $project: { _id: 0, name: 1, kind: 'customer' } }
      ] } }
    ])
  hint: { vi: "Mỗi bên lọc và chọn trường giống nhau, rồi ghép bên khách vào bên cửa hàng.", en: "Each side filters and picks the same fields, then the customer side is appended to the store side." }

# ---- mg.except_like (Phần 9)
- id: e-mg-d-except-like-1
  skill: mg.except_like
  kind: faded
  task: { vi: "Những sản phẩm không bán được ở cửa hàng 4 trong tháng 10/2026: chỉ tên (`name`).", en: "The products not sold at store 4 in October 2026: the name (`name`) only." }
  starter: |-
    db.products.aggregate([
      { $lookup: { from: 'orders', let: { pid: '$_id' }, pipeline: [
        { $match: { store_id: 4, order_date: { $gte: ISODate('2026-10-01'), $lt: ISODate('2026-11-01') }, $expr: { $in: ['$$pid', '$items.product_id'] } } },
        { $limit: 1 }
      ], as: 'hit' } },
      { $match: { hit: { $size: ___ } } },
      { $project: { _id: 0, name: 1 } }
    ])
  solution: |-
    db.products.aggregate([
      { $lookup: { from: 'orders', let: { pid: '$_id' }, pipeline: [
        { $match: { store_id: 4, order_date: { $gte: ISODate('2026-10-01'), $lt: ISODate('2026-11-01') }, $expr: { $in: ['$$pid', '$items.product_id'] } } },
        { $limit: 1 }
      ], as: 'hit' } },
      { $match: { hit: { $size: 0 } } },
      { $project: { _id: 0, name: 1 } }
    ])
  hint: { vi: "\"Không bán được\" nghĩa là mảng `hit` có 0 phần tử.", en: "\"Not sold\" means the `hit` array has 0 elements." }
- id: e-mg-d-except-like-2
  skill: mg.except_like
  kind: open
  task: { vi: "Những khách không có đơn nào từ 2026-01-01: mã khách (`_id`) và tên (`name`).", en: "The customers with no order from 2026-01-01: the customer id (`_id`) and the name (`name`)." }
  solution: |-
    db.customers.aggregate([
      { $lookup: { from: 'orders', let: { cid: '$_id' }, pipeline: [
        { $match: { order_date: { $gte: ISODate('2026-01-01') }, $expr: { $eq: ['$customer_id', '$$cid'] } } },
        { $limit: 1 }
      ], as: 'hit' } },
      { $match: { hit: { $size: 0 } } },
      { $project: { name: 1 } }
    ])
  hint: { vi: "Điều kiện ngày nằm trong pipeline của `$lookup`; giữ khách có mảng kết quả rỗng.", en: "The date condition goes inside the `$lookup` pipeline; keep customers with an empty result array." }
- id: e-mg-d-except-like-3
  skill: mg.except_like
  kind: trap
  task: { vi: "Những sản phẩm không bán được ở cửa hàng nào từ 2026-10-29 đến 2026-10-31: chỉ tên (`name`).", en: "The products not sold at any store from 2026-10-29 to 2026-10-31: the name (`name`) only." }
  solution: |-
    db.products.aggregate([
      { $lookup: { from: 'orders', let: { pid: '$_id' }, pipeline: [
        { $match: { order_date: { $gte: ISODate('2026-10-29'), $lt: ISODate('2026-11-01') }, $expr: { $in: ['$$pid', '$items.product_id'] } } },
        { $limit: 1 }
      ], as: 'hit' } },
      { $match: { hit: { $size: 0 } } },
      { $project: { _id: 0, name: 1 } }
    ])
  hint: { vi: "Khoảng ngày phải lọc bên trong pipeline của `$lookup`, trước khi xem mảng có rỗng không.", en: "The date range must be filtered inside the `$lookup` pipeline, before checking whether the array is empty." }
  wrong:
    - query: "db.products.aggregate([{ $lookup: { from: 'orders', localField: '_id', foreignField: 'items.product_id', as: 'hit' } }, { $match: { hit: { $size: 0 } } }, { $project: { _id: 0, name: 1 } }])"
      vi: "Không lọc ngày thì đây là \"chưa bán bao giờ\": sản phẩm bán trước đó nhưng không bán trong ba ngày này bị bỏ sót."
      en: "Without the date filter this means \"never sold\": a product sold earlier but not in these three days is missed."
- id: e-mg-d-except-like-4
  skill: mg.except_like
  kind: review
  task: { vi: "Những thành phố có khách nhưng chưa có cửa hàng (bỏ khách không rõ thành phố), mỗi thành phố một lần, `_id` là tên thành phố.", en: "The cities that have customers but no store yet (skip customers with no city), each city once, `_id` is the city name." }
  solution: |-
    db.customers.aggregate([
      { $match: { city: { $ne: null } } },
      { $lookup: { from: 'stores', localField: 'city', foreignField: 'city', as: 'st' } },
      { $match: { st: { $size: 0 } } },
      { $group: { _id: '$city' } }
    ])
  hint: { vi: "Nối khách với cửa hàng theo `city`, giữ khách không khớp cửa hàng nào, rồi gộp theo thành phố.", en: "Join customers to stores on `city`, keep customers matching no store, then group by city." }

# ---- mg.full_like (Phần 9)
- id: e-mg-d-full-like-1
  skill: mg.full_like
  kind: faded
  task: { vi: "Tháng 10/2026, mỗi sản phẩm bán ở cửa hàng 1 hoặc cửa hàng 2 (`_id` là mã sản phẩm): số lượng bán ở cửa hàng 1 (`s1`) và ở cửa hàng 2 (`s2`), bên nào không bán thì 0.", en: "October 2026, each product sold at store 1 or store 2 (`_id` is the product id): the quantity sold at store 1 (`s1`) and at store 2 (`s2`), 0 on the side that did not sell it." }
  starter: |-
    db.orders.aggregate([
      { $match: { store_id: 1, order_date: { $gte: ISODate('2026-10-01'), $lt: ISODate('2026-11-01') } } },
      { $unwind: '$items' },
      { $project: { _id: 0, p: '$items.product_id', s1: '$items.qty', s2: { $literal: 0 } } },
      { $unionWith: { coll: 'orders', pipeline: [
        { $match: { store_id: 2, order_date: { $gte: ISODate('2026-10-01'), $lt: ISODate('2026-11-01') } } },
        { $unwind: '$items' },
        { $project: { _id: 0, p: '$items.product_id', s1: { $literal: 0 }, s2: '$items.qty' } }
      ] } },
      { $group: { _id: ___, s1: { $sum: ___ }, s2: { $sum: ___ } } }
    ])
  solution: |-
    db.orders.aggregate([
      { $match: { store_id: 1, order_date: { $gte: ISODate('2026-10-01'), $lt: ISODate('2026-11-01') } } },
      { $unwind: '$items' },
      { $project: { _id: 0, p: '$items.product_id', s1: '$items.qty', s2: { $literal: 0 } } },
      { $unionWith: { coll: 'orders', pipeline: [
        { $match: { store_id: 2, order_date: { $gte: ISODate('2026-10-01'), $lt: ISODate('2026-11-01') } } },
        { $unwind: '$items' },
        { $project: { _id: 0, p: '$items.product_id', s1: { $literal: 0 }, s2: '$items.qty' } }
      ] } },
      { $group: { _id: '$p', s1: { $sum: '$s1' }, s2: { $sum: '$s2' } } }
