  shown: |-
    db.orders.find({ status: 'PAID' }, { _id: 0, status: 1, order_date: 1 }).explain('executionStats')
    { winningPlan: { stage: 'PROJECTION_COVERED', inputStage: { stage: 'IXSCAN', keyPattern: { status: 1, order_date: 1 } } },
      executionStats: { nReturned: 740, totalKeysExamined: 740, totalDocsExamined: 0 } }
  options:
