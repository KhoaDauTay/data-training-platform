  skill: mg.convert
  kind: review
  task: { vi: "Số sao trung bình (`avg_stars`) của mọi đánh giá nhập từ trang cũ (`source` là `import`) trong `reviews`, tính từ chuỗi `legacy.stars`; `_id` là null.", en: "The average star count (`avg_stars`) of all reviews imported from the old site (`source` is `import`) in `reviews`, computed from the `legacy.stars` string; `_id` is null." }
  solution: 'db.reviews.aggregate([{ $match: { source: "import" } }, { $group: { _id: null, avg_stars: { $avg: { $toInt: "$legacy.stars" } } } }])'
  hint: { vi: "`$avg` bỏ qua chuỗi; đổi sang số bên trong `$avg`.", en: "`$avg` skips strings; convert to a number inside `$avg`." }
