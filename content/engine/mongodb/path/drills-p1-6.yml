  solution: 'db.products.aggregate([{ $match: { category: "Household" } }, { $project: { _id: 0, name: 1, band: { $switch: { branches: [{ case: { $lt: ["$price_vnd", 30000] }, then: 1 }, { case: { $lt: ["$price_vnd", 60000] }, then: 2 }], default: 3 } } } }])'
