# Drill lộ trình MongoDB, Phần 1–6: đúng 4 drill mỗi kỹ năng (faded, open, trap, review; như content/general/sql.yml, L168).
# id: e-mg-d-<kỹ năng, `_` thành `-`>-<n> (khớp ENGINE_ID của product-design-db-engine). Dữ liệu: dataset.json.
# task nêu collection/trường trong backtick, không gọi tên toán tử là đáp án, không có `$`.
# solution: một câu mongosh (find/sort/limit/skip, aggregate, distinct). faded có `___` trong starter; review không starter.
# trap: wrong: [{ query, vi, en }], chạy được và ra kết quả khác solution theo luật chấm §3.5.
# dataset.json (dùng chung cho cả 12 Phần): stores 5, products 30, customers 300, staff 20, orders 811 (chỉ từ 2026-05-01, mảng `items` nhúng), reviews 197.
#   Ngày lưu dạng chuỗi ISO; `_meta.dateFields` liệt kê trường ngày, loader phải đổi sang Date (UTC) trước khi chạy, null giữ nguyên null.
#   Móc: khách vãng lai không có `customer_id`; đơn ONLINE luôn có `shipped_on`/`delivered_on` (null = chưa), đơn STORE không có hai trường đó;
#   khách: thiếu `email` (13), `city: null` (17), thiếu `birth_year` (27), 30 khách chưa có đơn; reviews: `comment` null (21) / thiếu (49),
#   21 đánh giá `source: "import"` có `legacy: { stars, posted }` dạng chữ (`rating` luôn là số).
# ordered: true khi thứ tự được chấm (có sort, đề nêu luật hòa). Mọi câu đã kiểm bằng mingo@7.2.6, kể cả khi đảo thứ tự dữ liệu.

# ---- mg.find (Phần 1)
- id: e-mg-d-find-1
  skill: mg.find
  kind: faded
  task: { vi: "Lấy mọi sản phẩm thuộc danh mục `Household` trong `products`.", en: "Get every product in the `Household` category from `products`." }
  starter: 'db.products.find({ ___: ___ })'
  solution: 'db.products.find({ category: "Household" })'
  hint: { vi: "Điều kiện là một object: tên trường, dấu hai chấm, rồi giá trị; chuỗi viết trong nháy kép.", en: "The condition is an object: the field name, a colon, then the value; strings go in double quotes." }
- id: e-mg-d-find-2
  skill: mg.find
  kind: open
  task: { vi: "Lấy mọi khách hàng ở thành phố `Hue` trong `customers`.", en: "Get every customer in the city `Hue` from `customers`." }
  solution: 'db.customers.find({ city: "Hue" })'
  hint: { vi: "Lọc trên trường `city`.", en: "Filter on the `city` field." }
- id: e-mg-d-find-3
  skill: mg.find
  kind: trap
  task: { vi: "Lấy mọi đơn của cửa hàng số 4 trong `orders` (`store_id` là số).", en: "Get every order of store number 4 from `orders` (`store_id` is a number)." }
  solution: 'db.orders.find({ store_id: 4 })'
  hint: { vi: "Số viết không có nháy.", en: "Numbers are written without quotes." }
  wrong:
    - { query: 'db.orders.find({ store_id: "4" })', vi: "`\"4\"` là chuỗi, còn `store_id` lưu số 4. MongoDB so cả kiểu, nên không đơn nào khớp: kết quả rỗng và không có lỗi nào báo. Viết số 4 không có nháy.", en: "`\"4\"` is a string while `store_id` holds the number 4. MongoDB compares types too, so no order matches: the result is empty and no error warns you. Write the number 4 without quotes." }
- id: e-mg-d-find-4
  skill: mg.find
  kind: review
  task: { vi: "Lấy mọi nhân viên có vai trò `Cashier` trong `staff`.", en: "Get every staff member whose role is `Cashier` from `staff`." }
  solution: 'db.staff.find({ role: "Cashier" })'
  hint: { vi: "Vai trò nằm ở trường `role`.", en: "The role is in the `role` field." }

# ---- mg.projection (Phần 1)
- id: e-mg-d-projection-1
  skill: mg.projection
  kind: faded
  task: { vi: "Từ `customers`, chỉ lấy `name` và `city` của mọi khách, không kèm `_id`.", en: "From `customers`, get only `name` and `city` of every customer, without `_id`." }
  starter: 'db.customers.find({}, { name: ___, city: ___, _id: ___ })'
  solution: 'db.customers.find({}, { name: 1, city: 1, _id: 0 })'
  hint: { vi: "`1` là giữ trường, `0` là bỏ.", en: "`1` keeps a field, `0` drops it." }
- id: e-mg-d-projection-2
  skill: mg.projection
  kind: open
  task: { vi: "Từ `staff`, lấy `name` và `role` của mọi nhân viên, không kèm `_id`.", en: "From `staff`, get `name` and `role` of every staff member, without `_id`." }
  solution: 'db.staff.find({}, { _id: 0, name: 1, role: 1 })'
  hint: { vi: "Object thứ hai của lệnh đọc chọn trường trả về.", en: "The second object of the read chooses the returned fields." }
- id: e-mg-d-projection-3
  skill: mg.projection
  kind: trap
  task: { vi: "Các đơn của cửa hàng 4 trong `orders`: giữ `_id` và, trong mỗi phần tử của `items`, chỉ `product_id`.", en: "The orders of store 4 in `orders`: keep `_id` and, inside each element of `items`, only `product_id`." }
  solution: 'db.orders.find({ store_id: 4 }, { "items.product_id": 1 })'
  hint: { vi: "Trường bên trong mảng viết bằng dấu chấm, trong nháy: `\"items.product_id\"`.", en: "A field inside an array uses a dot, in quotes: `\"items.product_id\"`." }
  wrong:
    - { query: 'db.orders.find({ store_id: 4 }, { items: 1 })', vi: "`items: 1` giữ nguyên mỗi dòng hàng, kèm cả `qty` và `unit_price_vnd`. Dùng đường dẫn có dấu chấm để chỉ giữ một trường bên trong.", en: "`items: 1` keeps every line whole, `qty` and `unit_price_vnd` included. Use a dotted path to keep one inner field only." }
- id: e-mg-d-projection-4
  skill: mg.projection
  kind: review
  task: { vi: "Sản phẩm danh mục `Personal care` trong `products`: chỉ `name` và `price_vnd`, không kèm `_id`.", en: "Products in the `Personal care` category of `products`: only `name` and `price_vnd`, without `_id`." }
  solution: 'db.products.find({ category: "Personal care" }, { _id: 0, name: 1, price_vnd: 1 })'
  hint: { vi: "Object thứ nhất lọc, object thứ hai chọn trường.", en: "The first object filters, the second picks fields." }

# ---- mg.filter (Phần 1)
- id: e-mg-d-filter-1
  skill: mg.filter
  kind: faded
  task: { vi: "Khách nào trong `customers` ở `Hue` hoặc sinh trước năm 1967? Lấy `name`, `city`, `birth_year`, không `_id`.", en: "Which customers in `customers` live in `Hue` or were born before 1967? Get `name`, `city`, `birth_year`, no `_id`." }
  starter: 'db.customers.find({ ___: [{ city: "Hue" }, { birth_year: { ___: 1967 } }] }, { _id: 0, name: 1, city: 1, birth_year: 1 })'
  solution: 'db.customers.find({ $or: [{ city: "Hue" }, { birth_year: { $lt: 1967 } }] }, { _id: 0, name: 1, city: 1, birth_year: 1 })'
  hint: { vi: "Một trong hai điều kiện là đủ: `$or` nhận một mảng điều kiện. Nhỏ hơn là `$lt`.", en: "Either condition is enough: `$or` takes an array of conditions. Less than is `$lt`." }
- id: e-mg-d-filter-2
  skill: mg.filter
  kind: open
  task: { vi: "Đơn đã hủy (`status` là `CANCELLED`) của cửa hàng 1 hoặc 2 trong `orders`: lấy `_id` và `store_id`.", en: "Cancelled orders (`status` is `CANCELLED`) of store 1 or 2 in `orders`: get `_id` and `store_id`." }
  solution: 'db.orders.find({ store_id: { $in: [1, 2] }, status: "CANCELLED" }, { store_id: 1 })'
  hint: { vi: "\"Thuộc danh sách\" là `$in: [1, 2]`; hai trường cạnh nhau là cùng đúng.", en: "\"One of a list\" is `$in: [1, 2]`; two fields side by side must both hold." }
- id: e-mg-d-filter-3
  skill: mg.filter
  kind: trap
  task: { vi: "Đồ ăn vặt (`Snacks`) trong `products` có `price_vnd` trên 20000 và dưới 40000: lấy `name` và `price_vnd`, không `_id`.", en: "Snacks (`Snacks`) in `products` with `price_vnd` above 20000 and below 40000: get `name` and `price_vnd`, no `_id`." }
  solution: 'db.products.find({ category: "Snacks", price_vnd: { $gt: 20000, $lt: 40000 } }, { _id: 0, name: 1, price_vnd: 1 })'
  hint: { vi: "Hai giới hạn của cùng một trường nằm chung một object: `{ $gt: …, $lt: … }`.", en: "Two bounds on one field share one object: `{ $gt: …, $lt: … }`." }
  wrong:
    - { query: 'db.products.find({ category: "Snacks", price_vnd: { $gt: 20000 }, price_vnd: { $lt: 40000 } }, { _id: 0, name: 1, price_vnd: 1 })', vi: "Viết `price_vnd` hai lần: khóa sau đè khóa trước, nên chỉ còn điều kiện dưới 40000 và các món rẻ hơn 20000 cũng lọt vào. Gộp hai giới hạn vào cùng một object của `price_vnd`.", en: "`price_vnd` written twice: the second key replaces the first, so only the below-40000 condition is left and items under 20000 slip in. Put both bounds in one object under `price_vnd`." }
- id: e-mg-d-filter-4
  skill: mg.filter
  kind: review
  task: { vi: "Đánh giá nào trong `reviews` có `rating` từ 2 trở xuống cho sản phẩm 4 hoặc 25? Lấy `_id`, `product_id`, `rating`.", en: "Which reviews in `reviews` have a `rating` of 2 or less for product 4 or 25? Get `_id`, `product_id`, `rating`." }
  solution: 'db.reviews.find({ rating: { $lte: 2 }, product_id: { $in: [4, 25] } }, { product_id: 1, rating: 1 })'
  hint: { vi: "Nhỏ hơn hoặc bằng là `$lte`; danh sách sản phẩm dùng `$in`.", en: "Less than or equal is `$lte`; the product list uses `$in`." }

# ---- mg.sort (Phần 1)
- id: e-mg-d-sort-1
  skill: mg.sort
  kind: faded
  task: { vi: "Khách ở `Hue` trong `customers`: `name` và `signup_date` (không `_id`), người đăng ký gần đây nhất trước; cùng ngày thì `_id` nhỏ trước.", en: "Customers in `Hue` from `customers`: `name` and `signup_date` (no `_id`), the most recent sign-up first; on the same day the smaller `_id` first." }
  starter: 'db.customers.find({ city: "Hue" }, { _id: 0, name: 1, signup_date: 1 }).sort({ signup_date: ___, _id: ___ })'
  solution: 'db.customers.find({ city: "Hue" }, { _id: 0, name: 1, signup_date: 1 }).sort({ signup_date: -1, _id: 1 })'
  ordered: true
  hint: { vi: "`-1` là giảm dần (mới nhất trước), `1` là tăng dần.", en: "`-1` is descending (newest first), `1` ascending." }
- id: e-mg-d-sort-2
  skill: mg.sort
  kind: open
  task: { vi: "Đồ uống (`Drinks`) trong `products`: `name` và `price_vnd` (không `_id`), rẻ nhất trước; cùng giá thì theo `name` A→Z.", en: "Drinks (`Drinks`) in `products`: `name` and `price_vnd` (no `_id`), cheapest first; at the same price by `name` A→Z." }
  solution: 'db.products.find({ category: "Drinks" }, { _id: 0, name: 1, price_vnd: 1 }).sort({ price_vnd: 1, name: 1 })'
  ordered: true
  hint: { vi: "Hai khóa sắp xếp: giá trước, tên sau.", en: "Two sort keys: price first, then name." }
- id: e-mg-d-sort-3
  skill: mg.sort
  kind: trap
  task: { vi: "Mọi sản phẩm trong `products`: `name`, `category`, `price_vnd` (không `_id`), theo `category` A→Z, trong mỗi danh mục đắt nhất trước.", en: "Every product in `products`: `name`, `category`, `price_vnd` (no `_id`), by `category` A→Z, and within a category the most expensive first." }
  solution: 'db.products.find({}, { _id: 0, name: 1, category: 1, price_vnd: 1 }).sort({ category: 1, price_vnd: -1 })'
  ordered: true
  hint: { vi: "Khóa viết trước được ưu tiên trước.", en: "The key written first has priority." }
  wrong:
    - { query: 'db.products.find({}, { _id: 0, name: 1, category: 1, price_vnd: 1 }).sort({ price_vnd: -1, category: 1 })', vi: "Đặt `price_vnd` lên trước thì giá quyết định thứ tự cho cả danh sách: món đắt nhất của mọi danh mục đứng đầu, danh mục chỉ còn phân xử khi giá bằng nhau. Đổi chỗ: `category` trước, `price_vnd` sau.", en: "With `price_vnd` first the price orders the whole list: the most expensive item of any category comes first, and the category only breaks ties. Swap them: `category` first, `price_vnd` second." }
- id: e-mg-d-sort-4
  skill: mg.sort
  kind: review
  task: { vi: "Mọi nhân viên trong `staff`: `name` và `hired_on` (không `_id`), người vào làm sớm nhất trước.", en: "Every staff member in `staff`: `name` and `hired_on` (no `_id`), the earliest hire first." }
  solution: 'db.staff.find({}, { _id: 0, name: 1, hired_on: 1 }).sort({ hired_on: 1 })'
  ordered: true
  hint: { vi: "Sắp tăng dần theo `hired_on`; không có hai người cùng ngày.", en: "Ascending by `hired_on`; no two people share a date." }

# ---- mg.limit (Phần 1)
- id: e-mg-d-limit-1
  skill: mg.limit
  kind: faded
  task: { vi: "2 cửa hàng mở gần đây nhất trong `stores`: `name` và `opened_on`, không `_id`, mới nhất trước.", en: "The 2 most recently opened stores in `stores`: `name` and `opened_on`, no `_id`, newest first." }
  starter: 'db.stores.find({}, { _id: 0, name: 1, opened_on: 1 }).sort({ opened_on: -1 }).___(___)'
  solution: 'db.stores.find({}, { _id: 0, name: 1, opened_on: 1 }).sort({ opened_on: -1 }).limit(2)'
  ordered: true
  hint: { vi: "Sau khi sắp, giữ 2 tài liệu đầu bằng `limit(2)`.", en: "After sorting, keep the first 2 documents with `limit(2)`." }
- id: e-mg-d-limit-2
  skill: mg.limit
  kind: open
  task: { vi: "5 sản phẩm rẻ nhất trong `products`: `name` và `price_vnd`, không `_id`, rẻ nhất trước; cùng giá thì theo `name` A→Z.", en: "The 5 cheapest products in `products`: `name` and `price_vnd`, no `_id`, cheapest first; at the same price by `name` A→Z." }
  solution: 'db.products.find({}, { _id: 0, name: 1, price_vnd: 1 }).sort({ price_vnd: 1, name: 1 }).limit(5)'
  ordered: true
  hint: { vi: "Sắp tăng theo giá rồi tên, rồi giữ 5.", en: "Sort ascending by price then name, then keep 5." }
- id: e-mg-d-limit-3
  skill: mg.limit
  kind: trap
  task: { vi: "3 đồ uống (`Drinks`) đắt nhất trong `products`: `name` và `price_vnd`, không `_id`, đắt nhất trước.", en: "The 3 most expensive drinks (`Drinks`) in `products`: `name` and `price_vnd`, no `_id`, most expensive first." }
  solution: 'db.products.find({ category: "Drinks" }, { _id: 0, name: 1, price_vnd: 1 }).sort({ price_vnd: -1 }).limit(3)'
  ordered: true
  hint: { vi: "Top N cần sắp xếp trước khi cắt.", en: "A top N needs a sort before the cut." }
  wrong:
    - { query: 'db.products.find({ category: "Drinks" }, { _id: 0, name: 1, price_vnd: 1 }).limit(3)', vi: "Không sắp xếp: bạn nhận 3 đồ uống nằm đầu collection theo thứ tự lưu, không phải 3 cái đắt nhất. Sắp giá giảm dần trước, rồi mới cắt 3.", en: "No sort: you get the first 3 drinks in storage order, not the 3 most expensive. Sort by price descending first, then cut 3." }
    - { query: 'db.products.find({ category: "Drinks" }, { _id: 0, name: 1, price_vnd: 1 }).sort({ price_vnd: 1 }).limit(3)', vi: "`1` là tăng dần, nên 3 tài liệu được giữ là 3 đồ uống rẻ nhất. Đề cần đắt nhất trước: dùng `-1`.", en: "`1` is ascending, so the 3 documents kept are the 3 cheapest drinks. The question wants the most expensive first: use `-1`." }
- id: e-mg-d-limit-4
  skill: mg.limit
  kind: review
  task: { vi: "Trang thứ hai (sản phẩm thứ 6 tới 10) của `products` theo `name` A→Z: lấy `name`, không `_id`.", en: "The second page (products 6 to 10) of `products` by `name` A→Z: get `name`, no `_id`." }
  solution: 'db.products.find({}, { _id: 0, name: 1 }).sort({ name: 1 }).skip(5).limit(5)'
  ordered: true
  hint: { vi: "Bỏ 5 tài liệu đầu bằng `skip(5)`, rồi giữ 5.", en: "Skip the first 5 documents with `skip(5)`, then keep 5." }

# ---- mg.group (Phần 2)
- id: e-mg-d-group-1
  skill: mg.group
  kind: faded
  task: { vi: "Số đơn (`orders`) theo từng kênh bán `channel` trong `orders`; kênh nằm ở `_id`.", en: "The number of orders (`orders`) for each sales `channel` in `orders`; the channel goes in `_id`." }
  starter: 'db.orders.aggregate([{ $group: { _id: ___, orders: { ___: 1 } } }])'
  solution: 'db.orders.aggregate([{ $group: { _id: "$channel", orders: { $sum: 1 } } }])'
  hint: { vi: "Khóa là `\"$channel\"` (có `$`); đếm bằng `$sum: 1`.", en: "The key is `\"$channel\"` (with `$`); count with `$sum: 1`." }
- id: e-mg-d-group-2
  skill: mg.group
  kind: open
  task: { vi: "Điểm trung bình (`avg_rating`, từ `rating`) của mỗi sản phẩm trong `reviews`; `_id` là `product_id`.", en: "The average score (`avg_rating`, from `rating`) for each product in `reviews`; `_id` is the `product_id`." }
  solution: 'db.reviews.aggregate([{ $group: { _id: "$product_id", avg_rating: { $avg: "$rating" } } }])'
  hint: { vi: "Trung bình là `$avg: \"$rating\"`.", en: "The average is `$avg: \"$rating\"`." }
- id: e-mg-d-group-3
  skill: mg.group
  kind: trap
  task: { vi: "Số đơn (`n`) theo từng trạng thái `status` trong `orders`; trạng thái nằm ở `_id`.", en: "The number of orders (`n`) for each `status` in `orders`; the status goes in `_id`." }
  solution: 'db.orders.aggregate([{ $group: { _id: "$status", n: { $sum: 1 } } }])'
  hint: { vi: "Giá trị của trường cần `$` đứng trước tên trường.", en: "A field's value needs a `$` before its name." }
  wrong:
    - { query: 'db.orders.aggregate([{ $group: { _id: "status", n: { $sum: 1 } } }])', vi: "Thiếu `$`: `\"status\"` là một chuỗi cố định chứ không phải giá trị của trường, nên cả 811 đơn rơi vào một nhóm duy nhất có `_id` là chữ `status`. Thêm `$` trước tên trường để mỗi trạng thái thành một nhóm.", en: "Missing `$`: `\"status\"` is a fixed string, not the field's value, so all 811 orders fall into one group whose `_id` is the text `status`. Add `$` before the field name so each status becomes a group." }
- id: e-mg-d-group-4
  skill: mg.group
  kind: review
  task: { vi: "Giá cao nhất (`max_price`, từ `price_vnd`) của mỗi `category` trong `products`; danh mục ở `_id`.", en: "The highest price (`max_price`, from `price_vnd`) of each `category` in `products`; the category goes in `_id`." }
  solution: 'db.products.aggregate([{ $group: { _id: "$category", max_price: { $max: "$price_vnd" } } }])'
  hint: { vi: "Lớn nhất là `$max`.", en: "The largest is `$max`." }

# ---- mg.group_keys (Phần 2)
- id: e-mg-d-group-keys-1
  skill: mg.group_keys
  kind: faded
  task: { vi: "Số đơn (`n`) cho mỗi cặp kênh và trạng thái trong `orders`; khóa là `_id: { channel, status }`.", en: "The number of orders (`n`) for each pair of channel and status in `orders`; the key is `_id: { channel, status }`." }
  starter: 'db.orders.aggregate([{ $group: { _id: { channel: ___, status: ___ }, n: { $sum: 1 } } }])'
  solution: 'db.orders.aggregate([{ $group: { _id: { channel: "$channel", status: "$status" }, n: { $sum: 1 } } }])'
  hint: { vi: "Mỗi trường của khóa lấy giá trị bằng dấu `$` trước tên trường, như `\"$channel\"`.", en: "Each key field takes its value with a `$` before the field name, like `\"$channel\"`." }
- id: e-mg-d-group-keys-2
  skill: mg.group_keys
  kind: open
  task: { vi: "Số nhân viên (`n`) cho mỗi cặp cửa hàng và vai trò trong `staff`; khóa là `_id: { store_id, role }`.", en: "The number of staff (`n`) for each pair of store and role in `staff`; the key is `_id: { store_id, role }`." }
  solution: 'db.staff.aggregate([{ $group: { _id: { store_id: "$store_id", role: "$role" }, n: { $sum: 1 } } }])'
