  starter: 'db.stores.aggregate([{ $project: { _id: 0, name: 1, old: { $cond: { if: ___, then: ___, else: ___ } } } }])'
  solution: 'db.stores.aggregate([{ $project: { _id: 0, name: 1, old: { $cond: { if: { $lt: ["$opened_on", ISODate("2024-01-01")] }, then: true, else: false } } } }])'
  hint: { vi: "`if` là phép so `{ $lt: [\"$opened_on\", ISODate(\"2024-01-01\")] }`.", en: "`if` is the comparison `{ $lt: [\"$opened_on\", ISODate(\"2024-01-01\")] }`." }
- id: e-mg-d-cond-2
  skill: mg.cond
  kind: open
  task: { vi: "Các đánh giá của sản phẩm 18 trong `reviews`: `_id` và `mood`: 1 nếu `rating` từ 4 trở lên, 0 nếu bằng 3, -1 nếu từ 2 trở xuống.", en: "The reviews of product 18 in `reviews`: `_id` and `mood`: 1 when `rating` is 4 or more, 0 when it is 3, -1 when it is 2 or less." }
  solution: 'db.reviews.aggregate([{ $match: { product_id: 18 } }, { $project: { mood: { $switch: { branches: [{ case: { $gte: ["$rating", 4] }, then: 1 }, { case: { $eq: ["$rating", 3] }, then: 0 }], default: -1 } } } }])'
  hint: { vi: "Ba khả năng: dùng `$switch` với hai nhánh và `default`.", en: "Three outcomes: use `$switch` with two branches and a `default`." }
