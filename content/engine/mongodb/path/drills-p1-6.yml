  solution: 'db.orders.aggregate([{ $match: { store_id: 2, channel: "ONLINE", delivered_on: { $ne: null } } }, { $project: { days: { $dateDiff: { startDate: "$order_date", endDate: "$delivered_on", unit: "day" } } } }])'
  hint: { vi: "Có một toán tử đếm khoảng cách hai ngày theo đơn vị bạn chọn.", en: "One operator counts the gap between two dates in the unit you choose." }
