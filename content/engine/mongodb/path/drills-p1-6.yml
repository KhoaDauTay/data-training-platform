  solution: 'db.orders.aggregate([{ $match: { channel: "ONLINE", delivered_on: null, status: "PAID" } }, { $project: { due: { $dateAdd: { startDate: "$order_date", unit: "day", amount: 14 } } } }])'
  hint: { vi: "Cộng ngày bằng `$dateAdd` với `unit: \"day\"` và `amount: 14`.", en: "Add days with `$dateAdd`, `unit: \"day\"` and `amount: 14`." }
- id: e-mg-d-date-math-3
  skill: mg.date_math
  kind: trap
