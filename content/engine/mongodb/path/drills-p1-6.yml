  starter: 'db.orders.aggregate([{ $match: { store_id: 3, channel: "ONLINE", delivered_on: { $ne: null } } }, { $project: { days: { $dateDiff: { startDate: ___, endDate: ___, unit: ___ } } } }])'
  solution: 'db.orders.aggregate([{ $match: { store_id: 3, channel: "ONLINE", delivered_on: { $ne: null } } }, { $project: { days: { $dateDiff: { startDate: "$shipped_on", endDate: "$delivered_on", unit: "day" } } } }])'
  hint: { vi: "Ngày bắt đầu là `\"$shipped_on\"`, ngày kết thúc `\"$delivered_on\"`, đơn vị `\"day\"`.", en: "The start is `\"$shipped_on\"`, the end `\"$delivered_on\"`, the unit `\"day\"`." }
