- id: types
  module: types
  level: L1
  vi: Kiểu dữ liệu và bảng
  en: Data types and tables
  title:
    vi: Kiểu dữ liệu và bảng
    en: Data types and tables
  after:
    vi: Chọn kiểu cho một bảng mới, dùng khóa identity hoặc uuidv7, và chỉ ra vì sao tiền không để float8.
    en: Choose the types for a new table, use an identity or uuidv7 key, and explain why money never goes in float8.
- id: constraints
  module: constraints
  level: L1
  vi: Ràng buộc, khóa và NULL
  en: Constraints, keys and NULL
  title:
    vi: Ràng buộc, khóa và NULL
    en: Constraints, keys and NULL
  after:
    vi: Thêm CHECK, khóa ngoại và UNIQUE để database tự từ chối dữ liệu sai ngay lúc ghi.
    en: Add CHECK, foreign key and UNIQUE constraints so the database itself rejects bad data at write time.
- id: transactions
  module: transactions
  level: L1
  vi: Schema và transaction
  en: Schemas and transactions
  title:
    vi: Schema và transaction
    en: Schemas and transactions
  after:
    vi: Tách bảng theo schema, gọi đúng bảng qua search_path, và gói nhiều thay đổi để chúng cùng thành công hoặc cùng không xảy ra.
    en: Split tables into schemas, reach the right table through search_path, and group changes so they all succeed or none happen.
- id: views
  module: views
  level: L1
  vi: View và materialized view
  en: Views and materialized views
  title:
    vi: View và materialized view
    en: Views and materialized views
  after:
    vi: Lưu một câu hỏi thành view, và biết khi nào cần materialized view cùng REFRESH.
    en: Save a query as a view, and know when you need a materialized view and REFRESH.
- id: first-index
  module: first-index
  level: L1
  vi: Index đầu tiên và EXPLAIN
  en: First index and EXPLAIN
  title:
    vi: Index đầu tiên và EXPLAIN
    en: First index and EXPLAIN
  after:
    vi: Tạo index B-tree cho một câu hay chạy, đọc một dòng EXPLAIN và biết câu có dùng index không.
    en: Create a B-tree index for a frequent query, read an EXPLAIN line and tell whether the query uses the index.
- id: capstone-l1
  module: capstone-l1
  level: L1
  vi: Kiểm tra cấp L1
  en: Level L1 check
  title:
    vi: Kiểm tra cấp L1
    en: Level L1 check
  after:
    vi: Đưa một bảng đang chạy về trạng thái an toàn và nhanh, chứng minh bằng EXPLAIN.
    en: Bring a live table to a safe and fast state, and prove it with EXPLAIN.
- id: btree-multi
  module: btree-multi
  level: L2
  vi: B-tree nhiều cột và index-only
  en: Multicolumn B-tree and index-only scans
  title:
    vi: B-tree nhiều cột và index-only
    en: Multicolumn B-tree and index-only scans
  after:
    vi: Thiết kế index nhiều cột đúng thứ tự cho một câu có lọc và sắp xếp, và thêm INCLUDE để khỏi về bảng.
    en: Design a multicolumn index in the right order for a query that filters and sorts, and add INCLUDE to skip the table.
- id: partial-expr
  module: partial-expr
  level: L2
  vi: Index partial, biểu thức và unique
  en: Partial, expression and unique indexes
  title:
    vi: Index partial, biểu thức và unique
    en: Partial, expression and unique indexes
  after:
    vi: Làm một index nhỏ chỉ phủ phần dữ liệu câu cần, và index theo biểu thức như lower(email).
    en: Build a small index that covers only the rows a query needs, and index an expression such as lower(email).
- id: index-types
  module: index-types
  level: L2
  vi: Các loại index
  en: Index types
  title:
    vi: Các loại index
    en: Index types
  after:
    vi: Chọn đúng Hash, GIN, SP-GiST, BRIN, bloom hay GiST cho mảng, khoảng thời gian, dữ liệu theo thứ tự ghi và lọc nhiều cột.
    en: Pick Hash, GIN, SP-GiST, BRIN, bloom or GiST correctly for arrays, time ranges, append-ordered data and many-column filters.
- id: search
  module: search
  level: L2
  vi: Tìm kiếm chữ và jsonb
  en: Text search and jsonb
  title:
    vi: Tìm kiếm chữ và jsonb
    en: Text search and jsonb
  after:
    vi: Làm tìm kiếm chữ và lọc jsonb có index, thay cho LIKE '%x%' quét cả bảng.
    en: Build indexed text search and jsonb filters instead of a LIKE '%x%' that scans the whole table.
- id: explain-analyze
  module: explain-analyze
  level: L2
  vi: EXPLAIN ANALYZE và thống kê
  en: EXPLAIN ANALYZE and statistics
  title:
    vi: EXPLAIN ANALYZE và thống kê
    en: EXPLAIN ANALYZE and statistics
  after:
    vi: Đọc ước lượng so với thực tế, dòng Buffers, và tìm trong pg_stats lý do planner đoán như vậy.
    en: Read estimated versus actual rows and the Buffers line, and find in pg_stats why the planner guessed that way.
- id: geo-lite
  module: geo-lite
  level: L2
  vi: Điểm, khoảng cách và GiST
  en: Points, distance and GiST
  title:
    vi: Điểm, khoảng cách và GiST
    en: Points, distance and GiST
  after:
    vi: Tìm 5 điểm gần nhất bằng index GiST thay vì sắp xếp cả bảng.
    en: Find the 5 nearest points with a GiST index instead of sorting the whole table.
- id: capstone-l2
  module: capstone-l2
  level: L2
  vi: Kiểm tra cấp L2
  en: Level L2 check
  title:
    vi: Kiểm tra cấp L2
    en: Level L2 check
  after:
    vi: Tìm câu chậm, chọn đúng loại index cho nó và chứng minh cải thiện bằng EXPLAIN.
    en: Find a slow query, pick the right index type for it and prove the gain with EXPLAIN.
- id: pages
  module: pages
  level: L3
  vi: Trang heap và TOAST
  en: Heap pages and TOAST
  title:
    vi: Trang heap và TOAST
    en: Heap pages and TOAST
  after:
    vi: nhìn một trang heap thật và nói dòng nào nằm ở đâu, kể cả giá trị lớn bị đẩy ra TOAST
    en: look at a real heap page and say which row lives where, including large values moved out to TOAST
- id: mvcc
  module: mvcc
  level: L3
  vi: MVCC và phiên bản dòng
  en: MVCC and row versions
  title:
    vi: MVCC và phiên bản dòng
    en: MVCC and row versions
  after:
    vi: giải thích vì sao UPDATE, DELETE và ROLLBACK làm bảng phình, bằng `xmin`/`xmax` đọc trên trang thật
    en: explain why UPDATE, DELETE and ROLLBACK make a table grow, using `xmin`/`xmax` read from a real page
- id: vacuum-hot
  module: vacuum-hot
  level: L3
  vi: HOT, VACUUM và freeze
  en: HOT, VACUUM and freeze
  title:
    vi: HOT, VACUUM và freeze
    en: HOT, VACUUM and freeze
  after:
    vi: chọn fillfactor cho bảng cập nhật nhiều, kiểm HOT bằng số đếm, đọc visibility map và tuổi `relfrozenxid`
    en: pick a fillfactor for an update-heavy table, check HOT with the counters, read the visibility map and the `relfrozenxid` age
- id: wal
  module: wal
  level: L3
  vi: WAL và checkpoint
  en: WAL and checkpoints
  title:
    vi: WAL và checkpoint
    en: WAL and checkpoints
  after:
    vi: đọc bản ghi WAL thật của một INSERT và thấy full-page image sau checkpoint
    en: read the real WAL records of an INSERT and spot the full-page image after a checkpoint
- id: memory
  module: memory
  level: L3
  vi: Bộ nhớ và kiểm tra cấp L3
  en: Memory and the L3 check
  title:
    vi: Bộ nhớ và kiểm tra cấp L3
    en: Memory and the L3 check
  after:
    vi: thấy `external merge Disk:` và sửa bằng `work_mem`, rồi chẩn đoán trọn một bảng phình vì HOT miss
    en: spot `external merge Disk:` and fix it with `work_mem`, then diagnose a table bloated by HOT misses end to end
- id: planner-stats
  module: planner-stats
  level: L4
  vi: Planner và thống kê
  en: Planner and statistics
  title:
    vi: Planner và thống kê
    en: Planner and statistics
  after:
    vi: Tính lại chi phí của một kế hoạch và sửa một ước lượng sai bằng `CREATE STATISTICS`.
    en: Recompute a plan's cost and fix a wrong estimate with `CREATE STATISTICS`.
- id: joins
  module: joins
  level: L4
  vi: Thuật toán và thứ tự nối
  en: Join algorithms and join order
  title:
    vi: Thuật toán và thứ tự nối
    en: Join algorithms and join order
  after:
    vi: Đọc vì sao planner chọn Hash Join, Nested Loop hay Merge Join, và viết câu đổi được lựa chọn đó.
    en: Read why the planner picks a Hash Join, Nested Loop or Merge Join, and write the query that changes that choice.
- id: prepared
  module: prepared
  level: L4
  vi: Câu đã chuẩn bị và bộ nhớ đệm kế hoạch
  en: Prepared statements and the plan cache
  title:
    vi: Câu đã chuẩn bị và bộ nhớ đệm kế hoạch
    en: Prepared statements and the plan cache
  after:
    vi: Nhận ra một câu đã chuẩn bị chậm vì kế hoạch chung và chọn cách sửa.
    en: Recognise a prepared statement made slow by its generic plan and choose the fix.
- id: partitioning
  module: partitioning
  level: L4
  vi: Phân vùng
  en: Partitioning
  title:
    vi: Phân vùng
    en: Partitioning
  after:
    vi: Thiết kế phân vùng và chứng minh pruning bằng `EXPLAIN`.
    en: Design partitions and prove pruning with `EXPLAIN`.
- id: locks
  module: locks
  level: L4
  vi: Khóa, mức cô lập và SSI
  en: Locks, isolation and SSI
  title:
    vi: Khóa, mức cô lập và SSI
    en: Locks, isolation and SSI
  after:
    vi: Nói trước một lệnh lấy khóa nào và chặn ai, chọn mức cô lập đúng và thử lại khi gặp `40001`.
    en: Say in advance which lock a command takes and whom it blocks, choose the right isolation level and retry on `40001`.
- id: parallel-jit
  module: parallel-jit
  level: L4
  vi: Truy vấn song song và JIT
  en: Parallel query and JIT
  title:
    vi: Truy vấn song song và JIT
    en: Parallel query and JIT
  after:
    vi: Đọc `Gather` và `JIT:` trong kế hoạch, và biết khi nào một câu không được chạy song song.
    en: Read `Gather` and `JIT:` in a plan, and know when a query cannot run in parallel.
- id: capstone-l4
  module: capstone-l4
  level: L4
  vi: 'Bài tổng kết L4: báo cáo chậm và migration làm treo'
  en: 'L4 capstone: a slow report and a migration that froze the app'
  title:
    vi: 'Bài tổng kết L4: báo cáo chậm và migration làm treo'
    en: 'L4 capstone: a slow report and a migration that froze the app'
  after:
    vi: Tách một hệ thống chậm thành ước lượng sai và chờ khóa, chứng minh từng cái bằng `pg_stats`, `EXPLAIN` và `pg_locks`.
    en: Split a slow system into a wrong estimate and a lock wait, and prove each with `pg_stats`, `EXPLAIN` and `pg_locks`.
- id: index-internals
  module: index-internals
  level: L5
  vi: Bên trong các loại index
  en: Index internals
  title:
    vi: Bên trong các loại index
    en: Index internals
  after:
    vi: Soi trang index thật (B-tree, GIN, BRIN, GiST), giải thích index phình và chọn đúng loại index.
    en: Inspect real index pages (B-tree, GIN, BRIN, GiST), explain index bloat and choose the right index type.
- id: integrity
  module: integrity
  level: L5
  vi: Toàn vẹn dữ liệu và WAL
  en: Integrity and WAL
  title:
    vi: Toàn vẹn dữ liệu và WAL
    en: Integrity and WAL
  after:
    vi: Kiểm index và heap bằng amcheck, và đo bản ghi WAL full-page sau checkpoint.
    en: Check indexes and heap with amcheck, and measure full-page WAL records after a checkpoint.
- id: security
  module: security
  level: L5
  vi: Bảo mật theo dòng (RLS)
  en: Row-level security
  title:
    vi: Bảo mật theo dòng (RLS)
    en: Row-level security
  after:
    vi: Viết policy để mỗi khách hàng chỉ thấy dòng của mình, và kiểm nó dưới đúng vai trò.
    en: Write policies so each tenant sees only its own rows, and test them under the right role.
- id: observe-tune
  module: observe-tune
  level: L5
  vi: Giám sát và tinh chỉnh
  en: Monitoring and tuning
  title:
    vi: Giám sát và tinh chỉnh
    en: Monitoring and tuning
  after:
    vi: Tìm câu tốn nhất bằng `pg_stat_statements` và đề xuất chỉnh bộ nhớ dựa trên kế hoạch thật.
    en: Find the costliest query with `pg_stat_statements` and propose memory tuning from the real plan.
- id: replication-ops
  module: replication-ops
  level: L5
  vi: Nhân bản và vận hành
  en: Replication and operations
  title:
    vi: Nhân bản và vận hành
    en: Replication and operations
  after:
    vi: Vẽ đường đi của WAL tới standby, đọc slot nhân bản, và chọn chiến lược backup/PITR.
    en: Trace WAL to a standby, read replication slots, and choose a backup/PITR strategy.
- id: capstone-l5
  module: capstone-l5
  level: L5
  vi: 'Bài tổng kết L5: bảng sự kiện chậm'
  en: 'L5 capstone: the slow events table'
  title:
    vi: 'Bài tổng kết L5: bảng sự kiện chậm'
    en: 'L5 capstone: the slow events table'
  after:
    vi: Chẩn đoán một bảng chậm từ thống kê, kế hoạch, phân vùng, index và RLS, rồi đưa ra kết luận.
    en: Diagnose a slow table from statistics, plans, partitions, indexes and RLS, then reach a conclusion.
