# Khu Best Practice (product-design-best-practice.md §4.2, ADD-8). Thứ tự trong file là thứ tự tab.
# areas = chữ đầu mã catalogue (docs/team/best-practice-catalogue.md) mà track nhận.
# gallery (v24, catalogue §13.4) = hàng "Lỗi hay gặp" đầu track: id thẻ theo thứ tự của bảng §13.4 (lớp lỗi có tần suất cao
# trong Taipalus & Perälä 2019 trước, rồi theo số nguồn hướng dẫn). Không thêm mục mới; chỉ id thẻ đã phát hành.
- id: sql
  areas: [q, a]
  title: { vi: "SQL", en: "SQL" }
  gallery: [e-bp-q07, e-bp-q01, e-bp-q02, e-bp-q12, e-bp-q09, e-bp-s01, e-bp-q16, e-bp-q08, e-bp-q10]
  after:
    vi: "Bạn tránh được những câu SQL sai âm thầm: NULL nuốt kết quả, join nhân đôi tổng, khoảng ngày cắt mất dòng."
    en: "You avoid SQL that is silently wrong: NULLs that swallow rows, joins that double totals, date ranges that drop rows."
- id: postgres
  areas: [s, i, p, x]
  title: { vi: "PostgreSQL", en: "PostgreSQL" }
  after:
    vi: "Bạn chọn kiểu dữ liệu, ràng buộc và index để database tự giữ dữ liệu đúng, và đọc kế hoạch để biết index có được dùng không."
    en: "You choose types, constraints and indexes so the database keeps data correct, and read the plan to see whether an index is used."
- id: mongodb
  areas: [m]
  title: { vi: "MongoDB", en: "MongoDB" }
  after:
    vi: "Bạn viết truy vấn MongoDB không âm thầm bỏ sót tài liệu: trường thiếu, null, mảng rỗng và điều kiện trên phần tử mảng."
    en: "You write MongoDB queries that never silently miss documents: missing fields, nulls, empty arrays and conditions on array elements."
- id: dynamodb
  areas: [d]
  title: { vi: "DynamoDB", en: "DynamoDB" }
  after:
    vi: "Bạn đọc DynamoDB bằng khóa thay vì quét cả bảng, và biết những lỗi request mà AWS sẽ từ chối trước khi chạy."
    en: "You read DynamoDB through keys instead of scanning the table, and know which requests AWS rejects before they run."
# v48 BP-C (L1150): one track per v47 engine (id = engine id). Letters: r Redis, t time-series, o OLAP, e search, l telemetry,
# c streaming/CDC, g graph. No gallery: the catalogue's §13.4 ranking covers SQL only.
- id: redis
  areas: [r]
  title: { vi: "Redis", en: "Redis" }
  after:
    vi: "Bạn dùng Redis như một bộ đệm có hạn: key luôn có thời gian sống, bộ đếm tăng nguyên tử, và không lệnh nào khóa cả máy chủ."
    en: "You use Redis as a cache with limits: keys always expire, counters increase atomically, and no command blocks the whole server."
- id: timeseries
  areas: [t]
  title: { vi: "Chuỗi thời gian", en: "Time-series" }
  after:
    vi: "Bạn lưu thời điểm thật, gom theo khung giờ không mất khung trống, và tính tốc độ từ counter mà không bị lệch khi thiết bị khởi động lại."
    en: "You store real instants, bucket by time without losing empty buckets, and compute rates from counters that survive restarts."
- id: olap
  areas: [o]
  title: { vi: "OLAP", en: "OLAP" }
  after:
    vi: "Bạn viết truy vấn phân tích không đếm trùng, chỉ đọc cột và ngày cần đọc, và biết khi nào một số gần đúng là đủ."
    en: "You write analytical queries that never double count, read only the columns and days they need, and know when an approximate number is enough."
- id: search
  areas: [e]
  title: { vi: "Tìm kiếm", en: "Search" }
  after:
    vi: "Bạn chọn đúng kiểu trường (text hay keyword), tách phần tính điểm khỏi phần lọc, và không phân trang sâu bằng from."
    en: "You pick the right field type (text or keyword), keep scoring apart from filtering, and never page deep with from."
- id: telemetry
  areas: [l]
  title: { vi: "Telemetry", en: "Telemetry" }
  after:
    vi: "Bạn đọc counter bằng rate, tính phân vị từ histogram đúng cách, và giữ số series trong tầm kiểm soát."
    en: "You read counters with rate, compute percentiles from histograms correctly, and keep the number of series under control."
- id: stream
  areas: [c]
  title: { vi: "Luồng sự kiện", en: "Streaming" }
  after:
    vi: "Bạn xử lý sự kiện đến hai lần hoặc sai thứ tự mà kết quả vẫn đúng, và ghi dữ liệu cùng sự kiện trong một transaction."
    en: "You handle events that arrive twice or out of order and still get the right result, and write the data and its event in one transaction."
- id: graph
  areas: [g]
  title: { vi: "Đồ thị", en: "Graph" }
  after:
    vi: "Bạn duyệt đồ thị bằng recursive CTE luôn dừng, không lặp vô tận trên vòng, và không nhân bản đường đi."
    en: "You traverse graphs with recursive CTEs that always stop, never loop on a cycle, and do not multiply paths."