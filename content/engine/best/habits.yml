# "Học SQL và NoSQL cho đúng: 8 thói quen" (catalogue §14.3), trang #/engine/best/habits (v24 BP-UI).
# cards = id thẻ; trang chỉ hiện chip của thẻ đã phát hành (track trong RELEASED và có file). Code span VI = EN, EN không dấu.
title:
  vi: "8 thói quen viết SQL cho đúng"
  en: "8 habits for writing correct SQL"
intro:
  vi: "Tám thói quen giúp bạn bắt lỗi sai âm thầm trước khi người khác thấy. Mỗi thói quen dẫn tới các thẻ để bạn thử ngay."
  en: "Eight habits that catch silently wrong queries before anyone else sees them. Each habit links to cards you can try now."
habits:
  - text: { vi: "Nói ra hình dạng kết quả trước khi gõ.", en: "Say the shape of the result before you type." }
    points:
      - { vi: "Mỗi dòng là gì (một đơn? một khách một tháng?) và khoảng bao nhiêu dòng.", en: "What one row is (one order? one customer per month?) and roughly how many rows." }
      - { vi: "Lệch so với dự đoán là dấu hiệu đầu tiên của lỗi.", en: "A gap from your guess is the first sign of a bug." }
    cards: [e-bp-a04, e-bp-a13]
  - text: { vi: "Đi từng bước nhỏ, đếm dòng sau mỗi join.", en: "Work in small steps and count rows after every join." }
    points:
      - { vi: "Chạy phần `FROM … JOIN` trước và xem số dòng.", en: "Run the `FROM … JOIN` part first and look at the row count." }
      - { vi: "Sau khi gộp, so tổng với bảng gốc (tổng kiểm).", en: "After aggregating, compare the total with the source table (a control total)." }
      - { vi: "Lỗi logic (câu chạy được nhưng số sai) là loại lỗi bền nhất ở người học SQL [1]; cú pháp thì database tự báo.", en: "Logic errors (the query runs but the numbers are wrong) are the most persistent errors of SQL learners [1]; the database reports syntax errors itself." }
    cards: [e-bp-q07, e-bp-a06]
  - text: { vi: "Hỏi \"còn NULL thì sao?\" ở mọi điều kiện.", en: "Ask \"what about NULL?\" for every condition." }
    points:
      - { vi: "`= NULL`, `NOT IN` gặp NULL, `LEFT JOIN` bị `WHERE` biến thành `INNER`.", en: "`= NULL`, `NOT IN` meeting a NULL, a `LEFT JOIN` that `WHERE` turns into an `INNER` one." }
      - { vi: "Bên NoSQL: trường thiếu khác trường null.", en: "In NoSQL: a missing field is not a null field." }
    cards: [e-bp-q01, e-bp-q02, e-bp-q06, e-bp-m16, e-bp-m17]
  - text: { vi: "Viết kiểm tra như một truy vấn phải trả 0 dòng.", en: "Write checks as queries that must return 0 rows." }
    points:
      - { vi: "Khóa không trùng, không có bản ghi mồ côi, giá trị nằm trong danh sách cho phép.", en: "No duplicate keys, no orphan records, values inside the allowed list." }
      - { vi: "Lưu lại, chạy lại mỗi lần dữ liệu đổi [2].", en: "Keep them and run them again whenever the data changes [2]." }
    cards: [e-bp-a12, e-bp-a24, e-bp-a11]
  - text: { vi: "Đọc kế hoạch, đừng đoán tốc độ.", en: "Read the plan; do not guess the speed." }
    points:
      - { vi: "PostgreSQL: `EXPLAIN`; so số dòng ước lượng với số thật, xem index có được dùng [3].", en: "PostgreSQL: `EXPLAIN`; compare estimated rows with actual rows, and check whether an index is used [3]." }
      - { vi: "MongoDB: `explain('executionStats')`; so số tài liệu đã xét với số trả về [4].", en: "MongoDB: `explain('executionStats')`; compare documents examined with documents returned [4]." }
      - { vi: "DynamoDB: so `ScannedCount` với `Count`, và đọc `ConsumedCapacity` [5].", en: "DynamoDB: compare `ScannedCount` with `Count`, and read `ConsumedCapacity` [5]." }
      - { vi: "Đo bằng số đọc và cost, không bằng mili giây trên máy mình.", en: "Measure with reads and cost, not with milliseconds on your own machine." }
    cards: [e-bp-p01, e-bp-i01, e-bp-m31, e-bp-d06]
  - text: { vi: "Đặt tên để người sau đọc được.", en: "Name things so the next person can read them." }
    points:
      - { vi: "Bảng và cột `snake_case` chữ thường, không trùng từ khóa.", en: "Tables and columns in lower-case `snake_case`, never a keyword." }
      - { vi: "Mọi cột tính toán có tên nói nghĩa và đơn vị (`revenue_vnd`).", en: "Every computed column gets a name that says its meaning and unit (`revenue_vnd`)." }
      - { vi: "Theo một bộ quy tắc có sẵn và giữ nhất quán [6].", en: "Follow an existing style guide and stay consistent [6]." }
    cards: [e-bp-s08, e-bp-s13, e-bp-s14, e-bp-q23, e-bp-q09]
  - text: { vi: "Ghim mọi thứ làm kết quả đổi theo ngày chạy.", en: "Pin everything that makes the result depend on the day it runs." }
    points:
      - { vi: "\"Hôm nay\" là tham số.", en: "\"Today\" is a parameter." }
      - { vi: "`ORDER BY` có tiebreaker trước `LIMIT`.", en: "`ORDER BY` has a tiebreaker before `LIMIT`." }
      - { vi: "Lấy mẫu có seed.", en: "Sampling uses a seed." }
      - { vi: "Khoảng ngày nửa mở.", en: "Date ranges are half-open." }
    cards: [e-bp-a05, e-bp-q10, e-bp-a14, e-bp-q12]
  - text: { vi: "Tự review trước khi gửi, rồi nhờ người khác review.", en: "Review your own query before sending it, then ask someone else to review it." }
    points:
      - { vi: "Grain là gì; NULL đi đâu; join có nhân dòng không.", en: "What is the grain; where do NULLs go; does a join multiply rows." }
      - { vi: "Lọc ở `WHERE` hay `HAVING`; tên cột có nói nghĩa không.", en: "Filter in `WHERE` or in `HAVING`; do the column names say what they mean." }
      - { vi: "Với NoSQL hỏi thêm: câu này dùng khóa hay index nào?", en: "For NoSQL also ask: which key or index does this query use?" }
    cards: [e-bp-q15, e-bp-q22, e-bp-d01, e-bp-m01]
after:
  vi: "Thói quen học đi kèm: làm lại bài từng sai sau vài ngày (hàng Ôn tập). Ở mỗi thẻ, hãy tự đoán kết quả bản Không nên trước khi bấm Chạy cả hai."
  en: "A study habit to go with them: redo the exercises you got wrong a few days later (the Review row). On each card, guess the result of the Avoid version before you press Run both."
