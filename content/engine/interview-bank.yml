# Ngân hàng câu phỏng vấn Database Engine (L215, L219): PostgreSQL, MongoDB, DynamoDB × junior | mid | senior | staff.
# Nội dung thuần, app nối sau. Chưa gì đọc file này; id `e-iv-…` không bao giờ vào Save (như `g-iv-…`, L144).
# Câu hỏi (`questions`): id `e-iv-<pg|mg|dy>-<band>-<nn>`, `engine` (postgres | mongodb | dynamodb), `band`, `kind`:
#   concept  -> `q`, `answer` (mẫu trả lời), `rubric` (3–5 tiêu chí tự chấm)
#   diagnose -> `q`, `exhibits` (đoạn để đọc), `answer`, `rubric`. Mỗi exhibit có `label`, `shown` và `source`:
#                 pglite-0.5.16  = chạy thật trên PGlite 0.5.16 (PostgreSQL 18.6) trong Node, từ `fixtures.<fixture>` + `setup` + `sql`
#                                  (EXPLAIN ANALYZE với COSTS/BUFFERS/TIMING/SUMMARY tắt trừ khi `sql` ghi khác; số dòng không phụ thuộc máy;
#                                  mỗi DB mới; `setup` tách theo `;` và chạy từng lệnh một, vì VACUUM không chạy được trong exec nhiều lệnh)
#                 mongodb-docs   = trích từ tài liệu MongoDB tại `url` (đã rút gọn bằng '...'), chưa chạy trong trình duyệt (D-E13)
#                 illustrative   = đoạn minh họa tự soạn theo cấu trúc explain trong tài liệu, không phải bản ghi mongod
#                 aws-rules      = số tính từ luật dung lượng của AWS; `calc` giữ đầu vào để kiểm lại
#   design   -> `q`, `answer` (thiết kế mẫu), `tradeoffs` (≥ 2), `rubric`
# Mọi câu có `doc` (trang tài liệu chính thức). Câu trả lời mẫu là để tự chấm, không phải đáp án duy nhất.
# Take-home (`takeHomes`): 2 mỗi engine, id `e-iv-<engine>-th-<n>`: `brief`, `deliverables`, `model`, `rubric`, `doc`.
# Viết lại hoàn toàn, không chép đề từ trang khác. EN không dấu; code span VI = EN.

