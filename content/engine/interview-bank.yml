    CREATE TABLE orders (id int PRIMARY KEY, customer_id int NOT NULL REFERENCES customers, status text NOT NULL, created_at date NOT NULL, total numeric(10,2) NOT NULL, attrs jsonb NOT NULL);
    INSERT INTO orders SELECT i, 1 + (i * 7) % 2000, CASE WHEN i % 100 = 0 THEN 'REFUNDED' WHEN i % 10 = 0 THEN 'CANCELLED' ELSE 'PAID' END, date '2026-01-01' + i / 70, 1 + i % 500, jsonb_build_object('channel', CASE WHEN i % 4 = 0 THEN 'app' ELSE 'web' END, 'gift', i % 50 = 0) FROM generate_series(1, 20000) i;
    ANALYZE;

questions:
  # ---------------- PostgreSQL · junior
  - id: e-iv-pg-junior-01
    engine: postgres
    band: junior
    kind: concept
    q: { vi: "Khóa chính và ràng buộc `UNIQUE` khác nhau thế nào? Một bảng có thể có mấy cái mỗi loại?", en: "How does a primary key differ from a `UNIQUE` constraint? How many of each can a table have?" }
    answer: { vi: "Khóa chính = `UNIQUE` + `NOT NULL`, mỗi bảng tối đa một, và là đích mặc định của khóa ngoại. `UNIQUE` thì có bao nhiêu cũng được và cho phép NULL: mặc định nhiều dòng NULL không bị coi là trùng (muốn coi là trùng thì dùng `NULLS NOT DISTINCT`, từ PG15). Cả hai đều tự tạo một chỉ mục B-tree duy nhất.", en: "A primary key = `UNIQUE` + `NOT NULL`, at most one per table, and it is the default target of foreign keys. A table can have any number of `UNIQUE` constraints and they allow NULL: by default several NULL rows do not count as duplicates (use `NULLS NOT DISTINCT`, PG15+, to make them clash). Both create a unique B-tree index automatically." }
    rubric:
      - { vi: "Nói PK = UNIQUE + NOT NULL, chỉ một mỗi bảng", en: "Says PK = UNIQUE + NOT NULL, only one per table" }
      - { vi: "Biết UNIQUE cho nhiều NULL (và cách đổi)", en: "Knows UNIQUE allows several NULLs (and how to change it)" }
      - { vi: "Biết cả hai tạo chỉ mục duy nhất", en: "Knows both create a unique index" }
    doc: https://www.postgresql.org/docs/18/ddl-constraints.html
  - id: e-iv-pg-junior-02
    engine: postgres
    band: junior
    kind: concept
    q: { vi: "Transaction là gì? Giải thích ngắn bốn chữ ACID và cho một ví dụ cần transaction.", en: "What is a transaction? Explain the four letters of ACID briefly and give an example that needs one." }
    answer: { vi: "Transaction gom nhiều câu thành một đơn vị: hoặc tất cả được ghi (`COMMIT`), hoặc không gì cả (`ROLLBACK`). A: nguyên khối; C: dữ liệu luôn thỏa ràng buộc; I: các transaction chạy song song không thấy trạng thái dở dang của nhau (mức độ tùy isolation level); D: đã commit thì còn sau khi sập máy, nhờ WAL. Ví dụ: chuyển tiền trừ tài khoản A và cộng tài khoản B phải cùng thành công.", en: "A transaction groups several statements into one unit: either all are written (`COMMIT`) or none (`ROLLBACK`). A: all or nothing; C: data always satisfies constraints; I: concurrent transactions do not see each other's half-done state (how much depends on the isolation level); D: once committed it survives a crash, thanks to the WAL. Example: a transfer that debits account A and credits account B must succeed as a whole." }
    rubric:
      - { vi: "Định nghĩa đúng COMMIT/ROLLBACK nguyên khối", en: "Defines all-or-nothing COMMIT/ROLLBACK correctly" }
      - { vi: "Giải thích đủ bốn chữ, nhắc WAL cho D", en: "Explains all four letters, mentions WAL for D" }
      - { vi: "Ví dụ thực tế đúng", en: "Gives a correct real example" }
    doc: https://www.postgresql.org/docs/18/tutorial-transactions.html
  - id: e-iv-pg-junior-03
    engine: postgres
    band: junior
    kind: concept
    q: { vi: "So sánh `DELETE FROM t`, `TRUNCATE t` và `DROP TABLE t`.", en: "Compare `DELETE FROM t`, `TRUNCATE t` and `DROP TABLE t`." }
    answer: { vi: "`DELETE` xóa từng dòng, lọc được bằng WHERE, chạy trigger dòng, để lại tuple chết chờ VACUUM. `TRUNCATE` bỏ cả tệp dữ liệu một lần, rất nhanh, giải phóng chỗ ngay, cần khóa ACCESS EXCLUSIVE, không lọc được, và vẫn rollback được trong transaction. `DROP TABLE` xóa luôn định nghĩa bảng, chỉ mục và quyền.", en: "`DELETE` removes rows one by one, can filter with WHERE, fires row triggers and leaves dead tuples for VACUUM. `TRUNCATE` drops the data files in one go, is very fast, frees space at once, takes an ACCESS EXCLUSIVE lock, cannot filter, and can still be rolled back inside a transaction. `DROP TABLE` removes the table definition, its indexes and grants too." }
    rubric:
      - { vi: "DELETE: từng dòng, có WHERE, để tuple chết", en: "DELETE: row by row, WHERE, leaves dead tuples" }
      - { vi: "TRUNCATE: nhanh, khóa mạnh, vẫn rollback được", en: "TRUNCATE: fast, strong lock, still transactional" }
      - { vi: "DROP: mất cả cấu trúc", en: "DROP: the structure is gone too" }
    doc: https://www.postgresql.org/docs/18/sql-truncate.html
  - id: e-iv-pg-junior-04
    engine: postgres
    band: junior
    kind: concept
    q: { vi: "Trong Postgres, `varchar(255)` có nhanh hơn `text` không? Khi nào nên giới hạn độ dài?", en: "In Postgres, is `varchar(255)` faster than `text`? When should you limit the length?" }
    answer: { vi: "Không. `text`, `varchar` và `varchar(n)` dùng cùng cách lưu; `varchar(n)` chỉ thêm một phép kiểm độ dài. Giới hạn độ dài là luật nghiệp vụ, nên đặt khi có lý do thật (ví dụ mã quốc gia 2 ký tự), và có thể dùng `CHECK` để đổi luật sau mà không đổi kiểu cột. Không dùng `char(n)`: nó đệm khoảng trắng.", en: "No. `text`, `varchar` and `varchar(n)` share the same storage; `varchar(n)` only adds a length check. A length limit is a business rule, so set it when there is a real reason (for example a 2-letter country code), and a `CHECK` lets you change the rule later without changing the column type. Avoid `char(n)`: it pads with spaces." }
    rubric:
      - { vi: "Nói không có khác biệt hiệu năng", en: "Says there is no performance difference" }
      - { vi: "Coi độ dài là luật nghiệp vụ, biết CHECK", en: "Treats length as a business rule, knows CHECK" }
      - { vi: "Cảnh báo char(n)", en: "Warns about char(n)" }
    doc: https://www.postgresql.org/docs/18/datatype-character.html
  - id: e-iv-pg-junior-05
    engine: postgres
    band: junior
    kind: concept
    q: { vi: "Chỉ mục là gì và nó tốn gì? Vì sao không tạo chỉ mục cho mọi cột?", en: "What is an index and what does it cost? Why not index every column?" }
    answer: { vi: "Chỉ mục (mặc định B-tree) là cấu trúc riêng giữ khóa đã sắp xếp kèm vị trí dòng, giúp tìm theo bằng, theo khoảng và sắp xếp mà không đọc cả bảng. Cái giá: mỗi INSERT/UPDATE/DELETE phải cập nhật thêm mọi chỉ mục, tốn chỗ đĩa và bộ nhớ đệm, và một UPDATE chạm cột có chỉ mục không còn là HOT. Chỉ tạo chỉ mục cho truy vấn thật, đo bằng EXPLAIN.", en: "An index (B-tree by default) is a separate structure holding sorted keys with row locations, so equality, range and ordering need not read the whole table. The cost: every INSERT/UPDATE/DELETE must also maintain every index, it uses disk and cache, and an UPDATE touching an indexed column can no longer be HOT. Index for real queries and check with EXPLAIN." }
    rubric:
      - { vi: "Mô tả đúng chỉ mục là cấu trúc sắp xếp riêng", en: "Describes the index as a separate sorted structure" }
      - { vi: "Nêu chi phí ghi và dung lượng", en: "Names the write and space cost" }
      - { vi: "Gắn việc tạo chỉ mục với truy vấn thật", en: "Ties indexing to real queries" }
    doc: https://www.postgresql.org/docs/18/indexes-intro.html
  - id: e-iv-pg-junior-06
    engine: postgres
    band: junior
    kind: concept
    q: { vi: "Vì sao `WHERE manager_id = NULL` không trả dòng nào? Và vì sao `NOT IN (subquery)` có thể ra rỗng bất ngờ?", en: "Why does `WHERE manager_id = NULL` return no rows? And why can `NOT IN (subquery)` return nothing unexpectedly?" }
    answer: { vi: "NULL nghĩa là chưa biết, nên mọi so sánh với NULL cho ra NULL (không phải true): dùng `IS NULL`. Với `x NOT IN (a, b, NULL)`, Postgres tính `x <> a AND x <> b AND x <> NULL`, vế cuối là NULL nên cả biểu thức không bao giờ true. Khi subquery có thể chứa NULL, dùng `NOT EXISTS`.", en: "NULL means unknown, so any comparison with NULL yields NULL (not true): use `IS NULL`. For `x NOT IN (a, b, NULL)` Postgres evaluates `x <> a AND x <> b AND x <> NULL`; the last part is NULL, so the whole expression is never true. When the subquery can contain NULL, use `NOT EXISTS`." }
    rubric:
      - { vi: "Giải thích logic ba giá trị", en: "Explains three-valued logic" }
      - { vi: "Chỉ đúng bẫy NOT IN có NULL", en: "Pinpoints the NOT IN with NULL trap" }
      - { vi: "Đưa cách sửa IS NULL / NOT EXISTS", en: "Gives the IS NULL / NOT EXISTS fix" }
    doc: https://www.postgresql.org/docs/18/functions-subquery.html
  - id: e-iv-pg-junior-07
    engine: postgres
    band: junior
    kind: concept
    q: { vi: "Khóa ngoại làm gì, và các lựa chọn `ON DELETE` là gì? Postgres có tự tạo chỉ mục cho cột khóa ngoại không?", en: "What does a foreign key do, and what are the `ON DELETE` options? Does Postgres index the foreign-key column for you?" }
    answer: { vi: "Khóa ngoại bảo đảm giá trị ở bảng con có trong bảng cha. `ON DELETE`: `NO ACTION`/`RESTRICT` (chặn), `CASCADE` (xóa theo), `SET NULL`, `SET DEFAULT`. Postgres **không** tự tạo chỉ mục trên cột khóa ngoại phía con: thiếu nó thì mỗi lần xóa/sửa dòng cha phải quét bảng con và JOIN cũng chậm. Thường nên tạo.", en: "A foreign key guarantees that a child value exists in the parent table. `ON DELETE`: `NO ACTION`/`RESTRICT` (block), `CASCADE` (delete along), `SET NULL`, `SET DEFAULT`. Postgres does **not** index the child-side foreign-key column: without one, every parent delete/update scans the child table and joins are slower too. Usually create it." }
    rubric:
      - { vi: "Định nghĩa toàn vẹn tham chiếu", en: "Defines referential integrity" }
      - { vi: "Kể đúng các hành động ON DELETE", en: "Lists the ON DELETE actions correctly" }
      - { vi: "Biết cột khóa ngoại không tự có chỉ mục và hệ quả", en: "Knows the FK column is not indexed automatically and why it matters" }
    doc: https://www.postgresql.org/docs/18/ddl-constraints.html
  - id: e-iv-pg-junior-08
    engine: postgres
    band: junior
    kind: concept
    q: { vi: "`EXPLAIN` và `EXPLAIN ANALYZE` khác nhau thế nào? Dùng `EXPLAIN ANALYZE` cho một câu `DELETE` cần cẩn thận gì?", en: "How does `EXPLAIN` differ from `EXPLAIN ANALYZE`? What care do you need when using `EXPLAIN ANALYZE` on a `DELETE`?" }
    answer: { vi: "`EXPLAIN` chỉ in kế hoạch với số dòng và chi phí **ước lượng**. `EXPLAIN ANALYZE` **chạy thật** câu lệnh và thêm số dòng, số vòng và thời gian thật, nên so được ước lượng với thực tế. Vì nó chạy thật, `DELETE`/`UPDATE` sẽ đổi dữ liệu: bọc trong `BEGIN; … ROLLBACK;`.", en: "`EXPLAIN` prints only the plan with **estimated** rows and cost. `EXPLAIN ANALYZE` **really runs** the statement and adds actual rows, loops and time, so estimates can be compared with reality. Because it runs, a `DELETE`/`UPDATE` will change data: wrap it in `BEGIN; … ROLLBACK;`." }
    rubric:
      - { vi: "Ước lượng vs chạy thật", en: "Estimate vs real execution" }
      - { vi: "Biết so số dòng ước lượng với thật", en: "Knows to compare estimated and actual rows" }
      - { vi: "Bọc DML trong transaction rồi rollback", en: "Wraps DML in a transaction and rolls back" }
    doc: https://www.postgresql.org/docs/18/sql-explain.html
  - id: e-iv-pg-junior-09
    engine: postgres
    band: junior
    kind: concept
    q: { vi: "`timestamp` và `timestamptz` khác nhau ra sao? Bạn chọn kiểu nào cho thời điểm một đơn hàng được tạo?", en: "How do `timestamp` and `timestamptz` differ? Which would you pick for when an order was created?" }
    answer: { vi: "`timestamptz` lưu một thời điểm tuyệt đối (nội bộ là UTC) và hiển thị theo `TimeZone` của phiên; `timestamp` chỉ là ngày giờ \"trên đồng hồ treo tường\", không biết múi giờ. Cả hai đều 8 byte. Thời điểm xảy ra sự kiện như tạo đơn nên dùng `timestamptz`; `timestamp` hợp cho lịch lặp theo giờ địa phương (ví dụ mở cửa 08:00).", en: "`timestamptz` stores an absolute instant (UTC internally) and displays it in the session `TimeZone`; `timestamp` is just a wall-clock date and time with no zone. Both take 8 bytes. An event instant like order creation should be `timestamptz`; `timestamp` fits local recurring times (for example opening at 08:00)." }
    rubric:
      - { vi: "Thời điểm tuyệt đối vs giờ treo tường", en: "Absolute instant vs wall clock" }
      - { vi: "Biết timestamptz không lưu múi giờ, chỉ đổi khi hiển thị", en: "Knows timestamptz does not store the zone, only converts on display" }
      - { vi: "Chọn timestamptz cho sự kiện, có lý do", en: "Picks timestamptz for events, with a reason" }
    doc: https://www.postgresql.org/docs/18/datatype-datetime.html
  - id: e-iv-pg-junior-10
    engine: postgres
    band: junior
    kind: concept
    q: { vi: "Khóa chính kiểu số tự tăng (`GENERATED ALWAYS AS IDENTITY`) và `uuid`: ưu nhược điểm?", en: "An auto-increment numeric primary key (`GENERATED ALWAYS AS IDENTITY`) versus `uuid`: pros and cons?" }
    answer: { vi: "Số tự tăng: 4–8 byte, chèn vào cuối B-tree nên chỉ mục gọn, dễ đọc; nhưng lộ số lượng và phải có cơ sở dữ liệu cấp số. `uuid`: 16 byte, tạo được ở bất cứ đâu (ứng dụng, nhiều node), không đoán được; nhưng UUID v4 ngẫu nhiên chèn rải khắp B-tree (nhiều page split, cache kém). UUID theo thời gian (v7, có `uuidv7()` từ PG18) giảm vấn đề này. Ưu tiên IDENTITY hơn `serial` cũ.", en: "Auto-increment: 4–8 bytes, inserts go to the end of the B-tree so the index stays compact, easy to read; but it leaks counts and needs the database to hand out numbers. `uuid`: 16 bytes, can be generated anywhere (app, many nodes), not guessable; but random v4 UUIDs insert all over the B-tree (more page splits, worse cache). Time-ordered UUIDs (v7, `uuidv7()` since PG18) reduce this. Prefer IDENTITY over the old `serial`." }
    rubric:
      - { vi: "So kích thước và vị trí chèn trong B-tree", en: "Compares size and insert position in the B-tree" }
      - { vi: "Nêu lợi ích tạo phân tán của uuid", en: "Names uuid's distributed generation benefit" }
      - { vi: "Biết UUID v7 / IDENTITY hơn serial", en: "Knows UUID v7 / IDENTITY over serial" }
    doc: https://www.postgresql.org/docs/18/datatype-uuid.html
  - id: e-iv-pg-junior-11
    engine: postgres
    band: junior
    kind: diagnose
    q: { vi: "Trang \"Đơn của tôi\" chậm. Đọc kế hoạch dưới đây: vấn đề là gì và bạn sửa thế nào?", en: "The \"My orders\" page is slow. Read the plan below: what is the problem and how do you fix it?" }
    exhibits:
      - label: { vi: "Kế hoạch hiện tại", en: "Current plan" }
        source: pglite-0.5.16
        fixture: pg-shop
        setup: ""
        sql: "EXPLAIN (ANALYZE, COSTS OFF, BUFFERS OFF, TIMING OFF, SUMMARY OFF) SELECT * FROM orders WHERE customer_id = 42"
        shown: |-
          Seq Scan on orders (actual rows=10.00 loops=1)
            Filter: (customer_id = 42)
            Rows Removed by Filter: 19990
    answer: { vi: "Postgres đọc cả bảng (`Seq Scan`) để lấy 10 dòng và bỏ 19.990 dòng (`Rows Removed by Filter`). Cột `customer_id` là khóa ngoại nhưng không có chỉ mục. Sửa: `CREATE INDEX ON orders (customer_id)` (trên hệ thống thật dùng `CONCURRENTLY`), rồi chạy lại EXPLAIN: kế hoạch thành Index Scan hoặc Bitmap Index Scan, đọc khoảng 10 dòng.", en: "Postgres reads the whole table (`Seq Scan`) to get 10 rows and throws away 19,990 (`Rows Removed by Filter`). `customer_id` is a foreign key but has no index. Fix: `CREATE INDEX ON orders (customer_id)` (on a live system use `CONCURRENTLY`), then rerun EXPLAIN: the plan becomes an Index Scan or Bitmap Index Scan reading about 10 rows." }
    rubric:
      - { vi: "Đọc được tỉ lệ 10 giữ / 19.990 bỏ", en: "Reads the 10 kept / 19,990 removed ratio" }
      - { vi: "Đề xuất chỉ mục trên customer_id", en: "Proposes an index on customer_id" }
      - { vi: "Kiểm lại bằng EXPLAIN, nhắc CONCURRENTLY", en: "Re-checks with EXPLAIN, mentions CONCURRENTLY" }
    doc: https://www.postgresql.org/docs/18/using-explain.html
  - id: e-iv-pg-junior-12
    engine: postgres
    band: junior
    kind: diagnose
    q: { vi: "Bảng `customers` đã có chỉ mục trên `email`, nhưng màn đăng nhập vẫn quét cả bảng. Vì sao?", en: "`customers` already has an index on `email`, but the login screen still scans the whole table. Why?" }
    exhibits:
      - label: { vi: "Kế hoạch (có chỉ mục trên email)", en: "Plan (with an index on email)" }
        source: pglite-0.5.16
        fixture: pg-shop
        setup: "CREATE INDEX ON customers (email); ANALYZE customers;"
        sql: "EXPLAIN (ANALYZE, COSTS OFF, BUFFERS OFF, TIMING OFF, SUMMARY OFF) SELECT id FROM customers WHERE lower(email) = 'user42@example.com'"
        shown: |-
          Seq Scan on customers (actual rows=1.00 loops=1)
            Filter: (lower(email) = 'user42@example.com'::text)
            Rows Removed by Filter: 1999
    answer: { vi: "Chỉ mục lưu giá trị `email`, còn điều kiện so `lower(email)`: một biểu thức khác, nên chỉ mục không dùng được. Sửa: tạo chỉ mục biểu thức `CREATE INDEX ON customers (lower(email))` (và tốt hơn là `UNIQUE` để chặn trùng email khác hoa thường), hoặc chuẩn hóa email về chữ thường khi ghi rồi so trực tiếp. Kiểu `citext` cũng là một lựa chọn.", en: "The index stores `email`, but the filter compares `lower(email)`: a different expression, so the index cannot be used. Fix: an expression index `CREATE INDEX ON customers (lower(email))` (better `UNIQUE`, blocking duplicates that differ by case), or lower-case emails on write and compare directly. The `citext` type is another option." }
    rubric:
      - { vi: "Nhận ra hàm trên cột làm chỉ mục vô dụng", en: "Sees that a function on the column defeats the index" }
      - { vi: "Đề xuất chỉ mục biểu thức", en: "Proposes an expression index" }
      - { vi: "Nhắc UNIQUE / chuẩn hóa khi ghi", en: "Mentions UNIQUE / normalising on write" }
    doc: https://www.postgresql.org/docs/18/indexes-expressional.html
  - id: e-iv-pg-junior-13
    engine: postgres
    band: junior
    kind: diagnose
    q: { vi: "Đồng nghiệp tạo chỉ mục trên `status` nhưng Postgres \"không chịu dùng\". Có phải lỗi không?", en: "A colleague created an index on `status` but Postgres \"refuses to use it\". Is that a bug?" }
    exhibits:
      - label: { vi: "Kế hoạch (có chỉ mục trên status)", en: "Plan (with an index on status)" }
        source: pglite-0.5.16
        fixture: pg-shop
        setup: "CREATE INDEX ON orders (status); ANALYZE orders;"
        sql: "EXPLAIN (ANALYZE, COSTS OFF, BUFFERS OFF, TIMING OFF, SUMMARY OFF) SELECT count(*) FROM orders WHERE status = 'PAID'"
        shown: |-
          Aggregate (actual rows=1.00 loops=1)
            ->  Seq Scan on orders (actual rows=18000.00 loops=1)
                  Filter: (status = 'PAID'::text)
                  Rows Removed by Filter: 2000
    answer: { vi: "Không phải lỗi. 18.000 trên 20.000 dòng (90%) khớp, nên đọc tuần tự cả bảng rẻ hơn nhảy qua chỉ mục rồi đọc gần hết các page. Planner chọn theo thống kê: chỉ mục trên cột ít giá trị chỉ có ích cho giá trị hiếm (ví dụ `REFUNDED`, 1%). Nếu chỉ truy vấn giá trị hiếm, chỉ mục một phần `WHERE status = 'REFUNDED'` nhỏ hơn nhiều.", en: "Not a bug. 18,000 of 20,000 rows (90%) match, so reading the table sequentially is cheaper than walking the index and then reading almost every page anyway. The planner decides from statistics: an index on a low-cardinality column only helps for rare values (for example `REFUNDED`, 1%). If only rare values are queried, a partial index `WHERE status = 'REFUNDED'` is much smaller." }
    rubric:
      - { vi: "Đọc được 90% dòng khớp", en: "Reads that 90% of rows match" }
      - { vi: "Giải thích vì sao seq scan rẻ hơn", en: "Explains why the seq scan is cheaper" }
      - { vi: "Đề xuất chỉ mục một phần cho giá trị hiếm", en: "Suggests a partial index for rare values" }
    doc: https://www.postgresql.org/docs/18/indexes-partial.html
  - id: e-iv-pg-junior-14
    engine: postgres
    band: junior
    kind: diagnose
    q: { vi: "Widget \"10 đơn mới nhất\" đọc kế hoạch này. Postgres đang làm gì, và một chỉ mục sẽ đổi gì?", en: "The \"10 latest orders\" widget runs this plan. What is Postgres doing, and what would an index change?" }
    exhibits:
      - label: { vi: "Kế hoạch hiện tại", en: "Current plan" }
        source: pglite-0.5.16
        fixture: pg-shop
        setup: ""
        sql: "EXPLAIN (ANALYZE, COSTS OFF, BUFFERS OFF, TIMING OFF, SUMMARY OFF) SELECT id, total FROM orders ORDER BY created_at DESC LIMIT 10"
        shown: |-
          Limit (actual rows=10.00 loops=1)
            ->  Sort (actual rows=10.00 loops=1)
                  Sort Key: created_at DESC
                  Sort Method: top-N heapsort  Memory: 17kB
                  ->  Seq Scan on orders (actual rows=20000.00 loops=1)
    answer: { vi: "Đọc cả 20.000 dòng rồi giữ 10 dòng lớn nhất bằng heap (`top-N heapsort`, ít bộ nhớ). Chi phí vẫn tăng theo kích thước bảng. Với `CREATE INDEX ON orders (created_at)`, Postgres đọc chỉ mục theo chiều ngược (`Index Scan Backward`) và dừng sau 10 dòng, không cần Sort. Nên thêm cột phá hòa (ví dụ `id`) vào cả ORDER BY và chỉ mục để thứ tự ổn định.", en: "It reads all 20,000 rows and keeps the 10 largest with a heap (`top-N heapsort`, little memory). The cost still grows with the table. With `CREATE INDEX ON orders (created_at)`, Postgres reads the index backwards (`Index Scan Backward`) and stops after 10 rows, no Sort. Add a tiebreaker (for example `id`) to both the ORDER BY and the index for a stable order." }
    rubric:
      - { vi: "Đọc đúng Seq Scan + top-N heapsort", en: "Reads the Seq Scan + top-N heapsort correctly" }
      - { vi: "Biết chỉ mục cho thứ tự sẵn, dừng sớm với LIMIT", en: "Knows an index gives the order and LIMIT stops early" }
      - { vi: "Nhắc cột phá hòa", en: "Mentions a tiebreaker" }
    doc: https://www.postgresql.org/docs/18/indexes-ordering.html
  - id: e-iv-pg-junior-15
    engine: postgres
    band: junior
    kind: design
    q: { vi: "Thiết kế bảng cho một cửa hàng nhỏ: khách hàng, đơn hàng, các món trong đơn. Một bạn đề xuất lưu danh sách món thành chuỗi `\"1,4,9\"` trong `orders`. Bạn phản hồi thế nào?", en: "Design tables for a small shop: customers, orders, the items in an order. Someone proposes storing the item list as a string `\"1,4,9\"` in `orders`. How do you respond?" }
    answer: { vi: "`customers(id PK, email UNIQUE NOT NULL, …)`, `products(id PK, name, price)`, `orders(id PK, customer_id FK, created_at timestamptz, status)`, `order_items(order_id FK, product_id FK, qty CHECK > 0, unit_price, PRIMARY KEY (order_id, product_id))`. Giá lưu lại ở dòng hàng vì giá sản phẩm đổi theo thời gian. Chuỗi `\"1,4,9\"` mất khóa ngoại, không lưu được số lượng/giá, không có chỉ mục, và mọi báo cáo phải tách chuỗi.", en: "`customers(id PK, email UNIQUE NOT NULL, …)`, `products(id PK, name, price)`, `orders(id PK, customer_id FK, created_at timestamptz, status)`, `order_items(order_id FK, product_id FK, qty CHECK > 0, unit_price, PRIMARY KEY (order_id, product_id))`. The price is copied onto the line because product prices change over time. The `\"1,4,9\"` string loses foreign keys, cannot hold quantity/price, cannot be indexed, and every report must split strings." }
    tradeoffs:
      - { vi: "Bảng nối `order_items` thêm một JOIN nhưng giữ toàn vẹn và báo cáo dễ.", en: "The `order_items` join table adds a JOIN but keeps integrity and easy reporting." }
      - { vi: "Chép giá vào dòng hàng là trùng lặp có chủ đích: đúng lịch sử, tốn thêm chỗ.", en: "Copying the price onto the line is deliberate duplication: correct history, a little more space." }
    rubric:
      - { vi: "Có bảng nối với khóa kép và khóa ngoại", en: "Has a join table with a composite key and foreign keys" }
      - { vi: "Lưu giá tại thời điểm bán", en: "Stores the price at sale time" }
      - { vi: "Nêu ít nhất hai lý do bác chuỗi phân cách", en: "Gives at least two reasons against the delimited string" }
    doc: https://www.postgresql.org/docs/18/ddl-constraints.html

  # ---------------- PostgreSQL · mid
  - id: e-iv-pg-mid-01
    engine: postgres
    band: mid
    kind: concept
    q: { vi: "MVCC trong Postgres hoạt động thế nào ở mức một dòng? Vì sao \"người đọc không chặn người ghi\"?", en: "How does MVCC work in Postgres at the level of one row? Why do \"readers not block writers\"?" }
    answer: { vi: "Mỗi phiên bản dòng (tuple) mang `xmin` (transaction tạo ra nó) và `xmax` (transaction xóa/thay nó). UPDATE không ghi đè: nó đánh dấu tuple cũ và chèn tuple mới. Mỗi câu lệnh đọc theo một snapshot và chỉ thấy tuple hợp lệ với snapshot đó, nên không cần khóa để đọc. Cái giá là tuple chết tích lại, phải dọn bằng VACUUM.", en: "Each row version (tuple) carries `xmin` (the transaction that created it) and `xmax` (the one that deleted/replaced it). UPDATE does not overwrite: it marks the old tuple and inserts a new one. Each statement reads through a snapshot and sees only tuples visible to it, so reading needs no lock. The price is that dead tuples pile up and VACUUM must clean them." }
    rubric:
      - { vi: "Nêu xmin/xmax và UPDATE = tuple mới", en: "Mentions xmin/xmax and UPDATE = new tuple" }
      - { vi: "Giải thích snapshot cho việc đọc", en: "Explains snapshots for reads" }
      - { vi: "Nối tới tuple chết và VACUUM", en: "Connects to dead tuples and VACUUM" }
    doc: https://www.postgresql.org/docs/18/mvcc-intro.html
  - id: e-iv-pg-mid-02
    engine: postgres
    band: mid
    kind: concept
    q: { vi: "Kể các mức isolation Postgres thật sự có và mỗi mức chặn được hiện tượng gì.", en: "List the isolation levels Postgres actually provides and what each one prevents." }
    answer: { vi: "Mặc định `READ COMMITTED`: mỗi câu lệnh lấy snapshot mới, nên hai lần đọc trong cùng transaction có thể khác nhau. `REPEATABLE READ`: một snapshot cho cả transaction; ở Postgres nó chặn cả phantom read, nhưng vẫn có write skew; ghi đụng dòng đã bị transaction khác sửa thì lỗi serialization. `SERIALIZABLE`: SSI phát hiện mọi bất thường và hủy một bên. `READ UNCOMMITTED` chạy như `READ COMMITTED`: Postgres không bao giờ cho đọc bẩn. Ở hai mức cao, ứng dụng phải sẵn sàng thử lại.", en: "Default `READ COMMITTED`: each statement takes a new snapshot, so two reads in one transaction can differ. `REPEATABLE READ`: one snapshot for the whole transaction; in Postgres it also prevents phantom reads but still allows write skew; writing a row another transaction changed raises a serialization error. `SERIALIZABLE`: SSI detects every anomaly and aborts one side. `READ UNCOMMITTED` behaves as `READ COMMITTED`: Postgres never allows dirty reads. At the two higher levels the application must be ready to retry." }
    rubric:
      - { vi: "Đúng mặc định và snapshot theo câu lệnh", en: "Correct default and per-statement snapshot" }
      - { vi: "Biết RR của Postgres chặn phantom nhưng còn write skew", en: "Knows Postgres RR blocks phantoms but allows write skew" }
      - { vi: "Biết SSI và nhu cầu retry", en: "Knows SSI and the need to retry" }
      - { vi: "Biết không có dirty read", en: "Knows there are no dirty reads" }
    doc: https://www.postgresql.org/docs/18/transaction-iso.html
  - id: e-iv-pg-mid-03
    engine: postgres
    band: mid
    kind: concept
    q: { vi: "`VACUUM`, autovacuum và `VACUUM FULL` khác nhau thế nào? Khi nào dùng `VACUUM FULL`?", en: "How do `VACUUM`, autovacuum and `VACUUM FULL` differ? When would you use `VACUUM FULL`?" }
    answer: { vi: "`VACUUM` đánh dấu chỗ của tuple chết là dùng lại được, cập nhật visibility map và freeze; chạy song song với đọc/ghi, thường không trả đĩa cho hệ điều hành. Autovacuum chạy nó tự động theo ngưỡng số dòng chết (và ANALYZE theo số dòng đổi). `VACUUM FULL` viết lại cả bảng thành tệp mới, trả lại đĩa, nhưng giữ khóa ACCESS EXCLUSIVE suốt thời gian chạy: chỉ dùng khi bảng phình nặng và chấp nhận dừng; trên production thường dùng công cụ viết lại trực tuyến hoặc chia nhỏ.", en: "`VACUUM` marks dead-tuple space reusable, updates the visibility map and freezes; it runs alongside reads/writes and usually does not give disk back to the OS. Autovacuum runs it automatically by dead-row thresholds (and ANALYZE by changed rows). `VACUUM FULL` rewrites the whole table into a new file and returns disk, but holds an ACCESS EXCLUSIVE lock for the whole run: only for heavy bloat when downtime is acceptable; in production people usually use an online rewrite tool or split the work." }
    rubric:
      - { vi: "VACUUM dùng lại chỗ, không khóa chặn", en: "VACUUM makes space reusable without blocking" }
      - { vi: "Autovacuum theo ngưỡng", en: "Autovacuum is threshold-driven" }
      - { vi: "VACUUM FULL viết lại + khóa độc quyền", en: "VACUUM FULL rewrites + exclusive lock" }
    doc: https://www.postgresql.org/docs/18/routine-vacuuming.html
  - id: e-iv-pg-mid-04
    engine: postgres
    band: mid
    kind: concept
    q: { vi: "Có chỉ mục `(a, b)`. Những điều kiện nào dùng tốt chỉ mục này: `a = 1`, `b = 2`, `a = 1 AND b > 5`, `a > 1 AND b = 2`, `ORDER BY a, b`?", en: "There is an index on `(a, b)`. Which of these use it well: `a = 1`, `b = 2`, `a = 1 AND b > 5`, `a > 1 AND b = 2`, `ORDER BY a, b`?" }
    answer: { vi: "Tốt: `a = 1`, `a = 1 AND b > 5` (bằng ở cột đầu rồi khoảng ở cột sau), `ORDER BY a, b` (thứ tự sẵn). `a > 1 AND b = 2`: khoảng trên cột đầu, nên `b` chỉ được lọc trong đoạn chỉ mục đã quét, kém hơn chỉ mục `(b, a)`. `b = 2` một mình: trước PG18 thường không dùng được; PG18 có skip scan, dùng được khi `a` có ít giá trị. Luật chung: cột so bằng đứng trước, cột khoảng đứng sau.", en: "Good: `a = 1`, `a = 1 AND b > 5` (equality on the first column, range on the next), `ORDER BY a, b` (order for free). `a > 1 AND b = 2`: a range on the first column, so `b` is only filtered inside the scanned slice, worse than an index on `(b, a)`. `b = 2` alone: before PG18 usually unusable; PG18 skip scan can use it when `a` has few values. Rule: equality columns first, range columns after." }
    rubric:
      - { vi: "Phân loại đúng cả năm trường hợp", en: "Classifies all five cases correctly" }
      - { vi: "Nêu luật bằng trước, khoảng sau", en: "States equality first, range after" }
      - { vi: "Biết skip scan PG18 (điểm cộng)", en: "Knows PG18 skip scan (bonus)" }
    doc: https://www.postgresql.org/docs/18/indexes-multicolumn.html
  - id: e-iv-pg-mid-05
    engine: postgres
    band: mid
    kind: concept
    q: { vi: "Chỉ mục một phần và chỉ mục biểu thức là gì? Cho mỗi loại một ví dụ thực tế.", en: "What are partial and expression indexes? Give a real example of each." }
    answer: { vi: "Chỉ mục một phần chỉ chứa các dòng thỏa một `WHERE`: nhỏ hơn và rẻ hơn khi ghi; truy vấn phải có điều kiện suy ra được điều kiện đó. Ví dụ hàng đợi việc: `CREATE INDEX ON jobs (run_at) WHERE done = false`. Nó cũng tạo được luật duy nhất có điều kiện: `CREATE UNIQUE INDEX ON carts (user_id) WHERE status = 'OPEN'`. Chỉ mục biểu thức lưu kết quả một biểu thức: `CREATE INDEX ON users (lower(email))`; truy vấn phải viết đúng biểu thức đó.", en: "A partial index holds only rows matching a `WHERE`: smaller and cheaper to write; the query's condition must imply the index predicate. Job queue example: `CREATE INDEX ON jobs (run_at) WHERE done = false`. It can also enforce conditional uniqueness: `CREATE UNIQUE INDEX ON carts (user_id) WHERE status = 'OPEN'`. An expression index stores the result of an expression: `CREATE INDEX ON users (lower(email))`; the query must use that same expression." }
    rubric:
      - { vi: "Định nghĩa đúng cả hai", en: "Defines both correctly" }
      - { vi: "Biết điều kiện truy vấn phải khớp", en: "Knows the query condition must match" }
      - { vi: "Ví dụ unique có điều kiện hoặc tương đương", en: "Gives conditional uniqueness or an equivalent example" }
    doc: https://www.postgresql.org/docs/18/indexes-partial.html
  - id: e-iv-pg-mid-06
    engine: postgres
    band: mid
    kind: concept
    q: { vi: "CTE (`WITH`) có làm một \"hàng rào tối ưu\" không?", en: "Is a CTE (`WITH`) an \"optimisation fence\"?" }
    answer: { vi: "Từ PG12 thì thường không: một CTE không đệ quy, không có tác dụng phụ và chỉ được dùng một lần sẽ được gộp vào truy vấn ngoài, nên điều kiện được đẩy xuống. CTE được dùng từ hai lần trở lên thì mặc định được tính một lần (materialize). Có thể ép bằng `AS MATERIALIZED` (giữ hàng rào, ví dụ để tính một lần) hoặc `AS NOT MATERIALIZED`. CTE có INSERT/UPDATE/DELETE luôn chạy đúng một lần.", en: "Since PG12 usually not: a non-recursive, side-effect-free CTE referenced once is inlined into the outer query, so predicates get pushed down. A CTE referenced two or more times is computed once (materialised) by default. You can force `AS MATERIALIZED` (keep the fence, e.g. to compute once) or `AS NOT MATERIALIZED`. A CTE with INSERT/UPDATE/DELETE always runs exactly once." }
    rubric:
      - { vi: "Biết thay đổi từ PG12", en: "Knows the PG12 change" }
      - { vi: "Biết luật dùng một lần / nhiều lần", en: "Knows the referenced-once / many rule" }
      - { vi: "Biết MATERIALIZED / NOT MATERIALIZED", en: "Knows MATERIALIZED / NOT MATERIALIZED" }
    doc: https://www.postgresql.org/docs/18/queries-with.html
  - id: e-iv-pg-mid-07
    engine: postgres
    band: mid
    kind: concept
    q: { vi: "`json` và `jsonb` khác nhau thế nào? Khi nào đặt dữ liệu vào cột `jsonb` là hợp lý?", en: "How do `json` and `jsonb` differ? When is putting data in a `jsonb` column reasonable?" }
    answer: { vi: "`json` lưu nguyên văn bản (giữ khoảng trắng, thứ tự khóa, khóa trùng) và phải parse lại mỗi lần đọc. `jsonb` lưu dạng nhị phân đã parse: bỏ khóa trùng, đọc nhanh hơn, có toán tử như `@>` và chỉ mục GIN. Hợp lý cho thuộc tính thưa, thay đổi theo loại, hoặc payload từ bên ngoài. Không hợp lý cho trường được lọc, nối, ràng buộc thường xuyên: những trường đó nên là cột thật có kiểu và khóa ngoại.", en: "`json` stores the raw text (whitespace, key order, duplicate keys) and is reparsed on every read. `jsonb` stores a parsed binary form: drops duplicate keys, faster to read, supports operators like `@>` and GIN indexes. Reasonable for sparse attributes that vary by type, or external payloads. Not for fields that are filtered, joined or constrained all the time: those should be real typed columns with foreign keys." }
    rubric:
      - { vi: "Nêu khác biệt lưu trữ", en: "States the storage difference" }
      - { vi: "Biết jsonb có GIN và @>", en: "Knows jsonb has GIN and @>" }
      - { vi: "Ranh giới rõ khi nào nên dùng cột thật", en: "Draws a clear line for when to use real columns" }
    doc: https://www.postgresql.org/docs/18/datatype-json.html
  - id: e-iv-pg-mid-08
    engine: postgres
    band: mid
    kind: concept
    q: { vi: "Vì sao ứng dụng mở 2.000 kết nối thẳng tới Postgres là ý tồi? Pooler ở chế độ transaction có giới hạn gì?", en: "Why is an app opening 2,000 direct connections to Postgres a bad idea? What does a pooler in transaction mode limit?" }
    answer: { vi: "Mỗi kết nối là một tiến trình backend với bộ nhớ riêng; nhiều kết nối nhàn rỗi vẫn tốn RAM, và nhiều kết nối hoạt động cùng lúc làm tranh chấp CPU/khóa, thông lượng giảm. Dùng pooler (ví dụ PgBouncer) để vài chục kết nối thật phục vụ hàng nghìn client. Ở chế độ transaction, mỗi transaction có thể sang backend khác, nên trạng thái phiên không giữ được giữa các transaction: `SET` ngoài transaction, advisory lock cấp phiên, `LISTEN`, bảng tạm; prepared statement chỉ ổn khi pooler hỗ trợ.", en: "Every connection is a backend process with its own memory; idle ones still use RAM, and many active ones contend for CPU/locks so throughput drops. Use a pooler (for example PgBouncer) so a few dozen real connections serve thousands of clients. In transaction mode each transaction may land on a different backend, so session state does not survive between transactions: `SET` outside a transaction, session advisory locks, `LISTEN`, temp tables; prepared statements only work if the pooler supports them." }
    rubric:
      - { vi: "Tiến trình mỗi kết nối và chi phí", en: "Process per connection and its cost" }
      - { vi: "Pooler giải quyết thế nào", en: "How a pooler solves it" }
      - { vi: "Kể ít nhất hai trạng thái phiên bị mất ở chế độ transaction", en: "Names at least two kinds of session state lost in transaction mode" }
    doc: https://www.postgresql.org/docs/18/runtime-config-connection.html
  - id: e-iv-pg-mid-09
    engine: postgres
    band: mid
    kind: concept
    q: { vi: "Viết \"chèn hoặc cập nhật\" một dòng tồn kho an toàn khi nhiều request song song. Vì sao không dùng SELECT rồi INSERT?", en: "Write an \"insert or update\" for a stock row that is safe under parallel requests. Why not SELECT then INSERT?" }
    answer: { vi: "`INSERT INTO stock (sku, qty) VALUES ('A1', 5) ON CONFLICT (sku) DO UPDATE SET qty = stock.qty + EXCLUDED.qty`. Cần một ràng buộc duy nhất trên `sku`. SELECT rồi INSERT có cửa sổ tranh chấp: hai request cùng không thấy dòng và cùng chèn, một cái lỗi trùng khóa (hoặc trùng dữ liệu nếu không có ràng buộc). `ON CONFLICT` xử lý nguyên tử nhờ chỉ mục duy nhất. `MERGE` cũng có, nhưng không thay được `ON CONFLICT` khi chèn đồng thời.", en: "`INSERT INTO stock (sku, qty) VALUES ('A1', 5) ON CONFLICT (sku) DO UPDATE SET qty = stock.qty + EXCLUDED.qty`. It needs a unique constraint on `sku`. SELECT then INSERT has a race window: two requests both see no row and both insert, one fails with a duplicate key (or duplicates data without a constraint). `ON CONFLICT` resolves it atomically through the unique index. `MERGE` exists too, but does not replace `ON CONFLICT` for concurrent inserts." }
    rubric:
      - { vi: "Câu ON CONFLICT đúng, dùng EXCLUDED", en: "Correct ON CONFLICT using EXCLUDED" }
      - { vi: "Biết cần ràng buộc duy nhất", en: "Knows a unique constraint is required" }
      - { vi: "Giải thích cửa sổ tranh chấp", en: "Explains the race window" }
    doc: https://www.postgresql.org/docs/18/sql-insert.html
  - id: e-iv-pg-mid-10
    engine: postgres
    band: mid
    kind: diagnose
    q: { vi: "Màn hỗ trợ tìm \"đơn của khách 42 hoặc mọi đơn hoàn tiền\". Có chỉ mục trên `customer_id` nhưng vẫn quét cả bảng. Sau khi thêm một chỉ mục nữa thì kế hoạch đổi. Giải thích cả hai.", en: "A support screen finds \"orders of customer 42 or any refunded order\". There is an index on `customer_id` but the table is still fully scanned. After one more index the plan changes. Explain both." }
    exhibits:
      - label: { vi: "Chỉ có chỉ mục customer_id", en: "Only the customer_id index" }
        source: pglite-0.5.16
        fixture: pg-shop
        setup: "CREATE INDEX ON orders (customer_id); ANALYZE orders;"
        sql: "EXPLAIN (ANALYZE, COSTS OFF, BUFFERS OFF, TIMING OFF, SUMMARY OFF) SELECT * FROM orders WHERE customer_id = 42 OR status = 'REFUNDED'"
        shown: |-
          Seq Scan on orders (actual rows=210.00 loops=1)
            Filter: ((customer_id = 42) OR (status = 'REFUNDED'::text))
            Rows Removed by Filter: 19790
      - label: { vi: "Thêm chỉ mục status", en: "With a status index too" }
        source: pglite-0.5.16
        fixture: pg-shop
        setup: "CREATE INDEX ON orders (customer_id); CREATE INDEX ON orders (status); ANALYZE orders;"
        sql: "EXPLAIN (ANALYZE, COSTS OFF, BUFFERS OFF, TIMING OFF, SUMMARY OFF) SELECT * FROM orders WHERE customer_id = 42 OR status = 'REFUNDED'"
        shown: |-
          Bitmap Heap Scan on orders (actual rows=210.00 loops=1)
            Recheck Cond: ((customer_id = 42) OR (status = 'REFUNDED'::text))
            Heap Blocks: exact=202
            ->  BitmapOr (actual rows=0.00 loops=1)
                  ->  Bitmap Index Scan on orders_customer_id_idx (actual rows=10.00 loops=1)
                        Index Cond: (customer_id = 42)
                        Index Searches: 1
                  ->  Bitmap Index Scan on orders_status_idx (actual rows=200.00 loops=1)
                        Index Cond: (status = 'REFUNDED'::text)
                        Index Searches: 1
    answer: { vi: "Với OR, mỗi vế phải có đường đi bằng chỉ mục; vế `status` không có, nên cách duy nhất là quét cả bảng. Khi cả hai vế có chỉ mục, Postgres quét từng chỉ mục thành bitmap, gộp bằng `BitmapOr` (10 + 200 vị trí), rồi đọc 202 page một lần theo thứ tự vật lý. `actual rows=0` ở BitmapOr là bình thường: nút bitmap không đếm dòng. Cách khác: viết lại thành `UNION` của hai truy vấn.", en: "With OR, each branch needs an index path; the `status` branch has none, so the only option is a full scan. Once both branches have indexes, Postgres scans each into a bitmap, combines them with `BitmapOr` (10 + 200 locations), then reads 202 pages once in physical order. `actual rows=0` on BitmapOr is normal: bitmap nodes do not count rows. Alternative: rewrite as a `UNION` of two queries." }
    rubric:
      - { vi: "Giải thích OR cần chỉ mục cho mọi vế", en: "Explains OR needs an index for every branch" }
      - { vi: "Đọc được BitmapOr và Heap Blocks", en: "Reads BitmapOr and Heap Blocks" }
      - { vi: "Biết rows=0 của nút bitmap không phải lỗi", en: "Knows rows=0 on a bitmap node is not a bug" }
    doc: https://www.postgresql.org/docs/18/indexes-bitmap-scans.html
  - id: e-iv-pg-mid-11
    engine: postgres
    band: mid
    kind: diagnose
    q: { vi: "Bản xuất CSV toàn bộ đơn theo giá trị chậm bất thường trên một máy chủ cấu hình nhỏ. Kế hoạch nói gì?", en: "A CSV export of all orders by value is unusually slow on a small server. What does the plan say?" }
    exhibits:
      - label: { vi: "Kế hoạch với work_mem = 64kB", en: "Plan with work_mem = 64kB" }
        source: pglite-0.5.16
        fixture: pg-shop
        setup: "SET work_mem = '64kB';"
        sql: "EXPLAIN (ANALYZE, COSTS OFF, BUFFERS OFF, TIMING OFF, SUMMARY OFF) SELECT * FROM orders ORDER BY total, id"
        shown: |-
          Sort (actual rows=20000.00 loops=1)
            Sort Key: total, id
            Sort Method: external merge  Disk: 1408kB
            ->  Seq Scan on orders (actual rows=20000.00 loops=1)
    answer: { vi: "`external merge  Disk: 1408kB`: dữ liệu cần sắp xếp không vừa `work_mem` (64kB), nên Postgres ghi các đoạn ra tệp tạm rồi trộn. Cách sửa: tăng `work_mem` cho riêng phiên/câu này (`SET LOCAL work_mem = '8MB'`), không tăng toàn cục bừa vì mỗi nút sort/hash của mỗi kết nối đều có thể dùng tới mức đó; hoặc tạo chỉ mục `(total, id)` để lấy thứ tự sẵn, nhất là khi chỉ cần một phần đầu.", en: "`external merge  Disk: 1408kB`: the data to sort does not fit in `work_mem` (64kB), so Postgres writes runs to temp files and merges them. Fix: raise `work_mem` for that session/statement only (`SET LOCAL work_mem = '8MB'`), not globally on a whim, since every sort/hash node of every connection may use that much; or add an index on `(total, id)` to get the order for free, especially when only the first part is needed." }
    rubric:
      - { vi: "Đọc được sort tràn đĩa", en: "Reads the on-disk sort" }
      - { vi: "Nối với work_mem và rủi ro tăng toàn cục", en: "Connects it to work_mem and the risk of raising it globally" }
      - { vi: "Đề xuất SET LOCAL hoặc chỉ mục", en: "Suggests SET LOCAL or an index" }
    doc: https://www.postgresql.org/docs/18/runtime-config-resource.html
  - id: e-iv-pg-mid-12
    engine: postgres
    band: mid
    kind: diagnose
    q: { vi: "Đã tạo chỉ mục `(customer_id, total)` để có index-only scan, nhưng kế hoạch đầu tiên không phải vậy. Sau một lệnh bảo trì thì có. Lệnh nào, và vì sao?", en: "An index on `(customer_id, total)` was created to get an index-only scan, but the first plan is not one. After one maintenance command it is. Which command, and why?" }
    exhibits:
      - label: { vi: "Ngay sau khi nạp dữ liệu", en: "Right after loading" }
        source: pglite-0.5.16
        fixture: pg-shop
        setup: "CREATE INDEX ON orders (customer_id, total);"
        sql: "EXPLAIN (ANALYZE, COSTS OFF, BUFFERS OFF, TIMING OFF, SUMMARY OFF) SELECT customer_id, total FROM orders WHERE customer_id BETWEEN 100 AND 120"
        shown: |-
          Bitmap Heap Scan on orders (actual rows=210.00 loops=1)
            Recheck Cond: ((customer_id >= 100) AND (customer_id <= 120))
            Heap Blocks: exact=72
            ->  Bitmap Index Scan on orders_customer_id_total_idx (actual rows=210.00 loops=1)
                  Index Cond: ((customer_id >= 100) AND (customer_id <= 120))
                  Index Searches: 1
      - label: { vi: "Sau lệnh bảo trì", en: "After the maintenance command" }
        source: pglite-0.5.16
        fixture: pg-shop
        setup: "CREATE INDEX ON orders (customer_id, total); VACUUM orders;"
        sql: "EXPLAIN (ANALYZE, COSTS OFF, BUFFERS OFF, TIMING OFF, SUMMARY OFF) SELECT customer_id, total FROM orders WHERE customer_id BETWEEN 100 AND 120"
        shown: |-
          Index Only Scan using orders_customer_id_total_idx on orders (actual rows=210.00 loops=1)
            Index Cond: ((customer_id >= 100) AND (customer_id <= 120))
            Heap Fetches: 0
            Index Searches: 1
    answer: { vi: "`VACUUM orders`. Chỉ mục không lưu thông tin hiển thị theo MVCC, nên index-only scan chỉ bỏ qua bảng khi visibility map đánh dấu page là all-visible. Ngay sau khi nạp, chưa page nào được đánh dấu, nên planner đoán đằng nào cũng phải đọc heap và chọn bitmap (72 page). Sau VACUUM, `Heap Fetches: 0`: không chạm bảng. Bảng ghi nhiều thì Heap Fetches tăng lại cho tới lần vacuum kế.", en: "`VACUUM orders`. Indexes hold no MVCC visibility, so an index-only scan can skip the table only for pages the visibility map marks all-visible. Right after loading none are marked, so the planner expects heap reads anyway and picks a bitmap scan (72 pages). After VACUUM, `Heap Fetches: 0`: the table is not touched. On a write-heavy table Heap Fetches grows again until the next vacuum." }
    rubric:
      - { vi: "Gọi đúng VACUUM", en: "Names VACUUM" }
      - { vi: "Giải thích visibility map", en: "Explains the visibility map" }
      - { vi: "Đọc được Heap Fetches: 0 và ý nghĩa với bảng ghi nhiều", en: "Reads Heap Fetches: 0 and what it means for write-heavy tables" }
    doc: https://www.postgresql.org/docs/18/indexes-index-only-scans.html
  - id: e-iv-pg-mid-13
    engine: postgres
    band: mid
    kind: diagnose
    q: { vi: "Hai cách viết \"khách chưa từng có đơn hoàn tiền\" cho cùng kết quả hôm nay. So hai kế hoạch, và nói vì sao bạn chọn cách thứ hai cho code lâu dài.", en: "Two ways to write \"customers with no refunded order\" give the same result today. Compare the plans and say why you pick the second for long-lived code." }
    exhibits:
      - label: { vi: "Cách 1: NOT IN", en: "Option 1: NOT IN" }
        source: pglite-0.5.16
        fixture: pg-shop
        setup: ""
        sql: "EXPLAIN (ANALYZE, COSTS OFF, BUFFERS OFF, TIMING OFF, SUMMARY OFF) SELECT c.id FROM customers c WHERE c.id NOT IN (SELECT o.customer_id FROM orders o WHERE o.status = 'REFUNDED')"
        shown: |-
          Seq Scan on customers c (actual rows=1980.00 loops=1)
            Filter: (NOT (ANY (id = (hashed SubPlan 1).col1)))
            Rows Removed by Filter: 20
            SubPlan 1
              ->  Seq Scan on orders o (actual rows=200.00 loops=1)
                    Filter: (status = 'REFUNDED'::text)
                    Rows Removed by Filter: 19800
      - label: { vi: "Cách 2: NOT EXISTS", en: "Option 2: NOT EXISTS" }
        source: pglite-0.5.16
        fixture: pg-shop
        setup: ""
        sql: "EXPLAIN (ANALYZE, COSTS OFF, BUFFERS OFF, TIMING OFF, SUMMARY OFF) SELECT c.id FROM customers c WHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id AND o.status = 'REFUNDED')"
        shown: |-
          Hash Right Anti Join (actual rows=1980.00 loops=1)
            Hash Cond: (o.customer_id = c.id)
            ->  Seq Scan on orders o (actual rows=200.00 loops=1)
                  Filter: (status = 'REFUNDED'::text)
                  Rows Removed by Filter: 19800
            ->  Hash (actual rows=2000.00 loops=1)
                  Buckets: 2048  Batches: 1  Memory Usage: 63kB
                  ->  Seq Scan on customers c (actual rows=2000.00 loops=1)
    answer: { vi: "NOT IN thành một `hashed SubPlan`: tốt khi tập con nhỏ, nhưng nếu nó không vừa bộ nhớ thì Postgres phải tìm lại cho từng dòng (rất chậm), và planner không thể biến nó thành anti join vì ngữ nghĩa NULL. NOT EXISTS thành `Hash Right Anti Join`: một phép nối thật, planner được tự chọn chiều và thuật toán khi dữ liệu lớn lên. Quan trọng hơn: nếu `customer_id` một ngày cho phép NULL, NOT IN sẽ trả về rỗng; NOT EXISTS vẫn đúng.", en: "NOT IN becomes a `hashed SubPlan`: fine while the subquery is small, but if it does not fit in memory Postgres must search it per row (very slow), and the planner cannot turn it into an anti join because of NULL semantics. NOT EXISTS becomes a `Hash Right Anti Join`: a real join whose side and algorithm the planner can choose as data grows. More important: if `customer_id` ever allows NULL, NOT IN returns nothing; NOT EXISTS stays correct." }
    rubric:
      - { vi: "Đọc được hashed SubPlan vs Anti Join", en: "Reads hashed SubPlan vs Anti Join" }
      - { vi: "Nêu rủi ro hiệu năng khi tập con lớn", en: "States the performance risk when the subquery grows" }
      - { vi: "Nêu bẫy NULL", en: "States the NULL trap" }
    doc: https://www.postgresql.org/docs/18/functions-subquery.html
  - id: e-iv-pg-mid-14
    engine: postgres
    band: mid
    kind: concept
    q: { vi: "`ANALYZE` (lệnh) làm gì, và điều gì xảy ra nếu bảng vừa được nạp 10 triệu dòng mà chưa ai chạy nó?", en: "What does the `ANALYZE` command do, and what happens if a table just got 10 million rows and nobody ran it?" }
    answer: { vi: "`ANALYZE` lấy mẫu bảng và ghi thống kê vào `pg_statistic` (xem qua `pg_stats`): tỉ lệ NULL, số giá trị khác nhau, giá trị phổ biến, histogram. Planner dựa vào đó để ước lượng số dòng và chọn kế hoạch. Thiếu thống kê mới, ước lượng có thể lệch hàng nghìn lần, dẫn tới nested loop sai, hash quá nhỏ… Autovacuum sẽ chạy ANALYZE sau một ngưỡng, nhưng sau một lần nạp lớn nên chạy tay ngay.", en: "`ANALYZE` samples the table and writes statistics into `pg_statistic` (visible through `pg_stats`): null fraction, distinct count, most common values, histogram. The planner estimates row counts and picks plans from these. Without fresh statistics, estimates can be off by thousands of times, leading to a wrong nested loop, an undersized hash… Autovacuum runs ANALYZE after a threshold, but after a big load run it by hand right away." }
    rubric:
      - { vi: "Biết ANALYZE lấy mẫu và lưu thống kê", en: "Knows ANALYZE samples and stores statistics" }
      - { vi: "Nối thống kê với ước lượng và kế hoạch", en: "Ties statistics to estimates and plans" }
      - { vi: "Khuyên chạy sau lần nạp lớn", en: "Advises running it after a big load" }
    doc: https://www.postgresql.org/docs/18/planner-stats.html
  - id: e-iv-pg-mid-15
    engine: postgres
    band: mid
    kind: design
    q: { vi: "Thiết kế giỏ hàng: mỗi người dùng có tối đa một giỏ đang mở, giỏ cũ được giữ lại để phân tích. Luật này đặt ở đâu?", en: "Design a shopping cart: each user has at most one open cart, old carts are kept for analytics. Where does this rule live?" }
    answer: { vi: "`carts(id PK, user_id FK NOT NULL, status text CHECK (status IN ('OPEN','ORDERED','ABANDONED')), created_at timestamptz)` và `CREATE UNIQUE INDEX one_open_cart ON carts (user_id) WHERE status = 'OPEN'`. Luật nằm trong cơ sở dữ liệu nên hai request song song không thể tạo hai giỏ mở; ứng dụng dùng `INSERT … ON CONFLICT DO NOTHING` rồi đọc giỏ mở. Chỉ mục một phần còn giúp tra nhanh giỏ mở của một người.", en: "`carts(id PK, user_id FK NOT NULL, status text CHECK (status IN ('OPEN','ORDERED','ABANDONED')), created_at timestamptz)` and `CREATE UNIQUE INDEX one_open_cart ON carts (user_id) WHERE status = 'OPEN'`. The rule lives in the database, so two parallel requests cannot create two open carts; the app uses `INSERT … ON CONFLICT DO NOTHING` then reads the open cart. The partial index also makes looking up a user's open cart fast." }
    tradeoffs:
      - { vi: "Luật trong DB an toàn với tranh chấp nhưng cần xử lý lỗi trùng ở ứng dụng.", en: "A DB rule is race-safe but the app must handle the duplicate error." }
      - { vi: "Giữ giỏ cũ chung bảng làm bảng lớn dần; có thể chuyển giỏ cũ sang bảng lưu trữ theo lịch.", en: "Keeping old carts in the same table grows it; old carts can be moved to an archive table on a schedule." }
    rubric:
      - { vi: "Dùng unique index một phần", en: "Uses a partial unique index" }
      - { vi: "Giải thích vì sao luật ở ứng dụng không đủ", en: "Explains why an app-only rule is not enough" }
      - { vi: "Nêu cách ứng dụng xử lý xung đột", en: "Says how the app handles the conflict" }
    doc: https://www.postgresql.org/docs/18/indexes-partial.html

  # ---------------- PostgreSQL · senior
  - id: e-iv-pg-senior-01
    engine: postgres
    band: senior
    kind: concept
    q: { vi: "HOT update là gì, điều kiện để có nó, và `fillfactor` liên quan thế nào?", en: "What is a HOT update, when does it happen, and how does `fillfactor` relate?" }
    answer: { vi: "HOT (heap-only tuple): khi UPDATE không đổi cột nào có trong chỉ mục và page hiện tại còn chỗ, tuple mới nằm cùng page và nối chuỗi từ tuple cũ, nên không phải thêm mục vào chỉ mục nào. Tiết kiệm ghi chỉ mục và WAL, và tuple chết được dọn ngay trong page (pruning). Hạ `fillfactor` (ví dụ 80–90) chừa chỗ trống trong page để UPDATE dễ thành HOT hơn. Theo dõi bằng `n_tup_hot_upd` so với `n_tup_upd` trong `pg_stat_user_tables`.", en: "HOT (heap-only tuple): when an UPDATE changes no indexed column and the current page has room, the new tuple stays on the same page chained from the old one, so no index gets a new entry. That saves index writes and WAL, and dead tuples are pruned within the page. Lowering `fillfactor` (for example 80–90) leaves free space on pages so more UPDATEs can be HOT. Track `n_tup_hot_upd` against `n_tup_upd` in `pg_stat_user_tables`." }
    rubric:
      - { vi: "Hai điều kiện: không đổi cột có chỉ mục, còn chỗ cùng page", en: "Both conditions: no indexed column changed, room on the same page" }
      - { vi: "Lợi ích: không ghi chỉ mục, pruning", en: "Benefit: no index writes, pruning" }
      - { vi: "Biết fillfactor và cách đo", en: "Knows fillfactor and how to measure" }
    doc: https://www.postgresql.org/docs/18/storage-hot.html
  - id: e-iv-pg-senior-02
    engine: postgres
    band: senior
    kind: concept
    q: { vi: "Một migration chạy `ALTER TABLE orders ADD COLUMN note text` trên bảng nóng và cả trang web treo vài phút, dù lệnh này vốn rất nhanh. Chuyện gì đã xảy ra và phòng thế nào?", en: "A migration ran `ALTER TABLE orders ADD COLUMN note text` on a hot table and the whole site hung for minutes, although the command itself is fast. What happened and how do you prevent it?" }
    answer: { vi: "Lệnh cần khóa ACCESS EXCLUSIVE. Nó phải chờ một transaction dài đang giữ khóa nhẹ trên bảng (ví dụ một báo cáo đang chạy); trong lúc chờ, nó đứng đầu hàng đợi khóa và mọi SELECT/INSERT mới xếp sau nó, nên trang treo. Phòng: đặt `SET lock_timeout = '2s'` cho migration và thử lại khi hết giờ; giết hoặc tránh transaction dài trước; tách DDL nặng (chỉ mục dùng `CREATE INDEX CONCURRENTLY`, ràng buộc dùng `NOT VALID` rồi `VALIDATE`).", en: "The command needs an ACCESS EXCLUSIVE lock. It waited behind a long transaction holding a weak lock on the table (say a running report); while waiting it sat at the head of the lock queue and every new SELECT/INSERT queued behind it, so the site hung. Prevention: `SET lock_timeout = '2s'` in migrations and retry on timeout; kill or avoid long transactions first; split heavy DDL (indexes via `CREATE INDEX CONCURRENTLY`, constraints via `NOT VALID` then `VALIDATE`)." }
    rubric:
      - { vi: "Giải thích hàng đợi khóa phía sau ACCESS EXCLUSIVE", en: "Explains the lock queue behind ACCESS EXCLUSIVE" }
      - { vi: "Đề xuất lock_timeout + retry", en: "Proposes lock_timeout + retry" }
      - { vi: "Biết CONCURRENTLY / NOT VALID", en: "Knows CONCURRENTLY / NOT VALID" }
    doc: https://www.postgresql.org/docs/18/explicit-locking.html
  - id: e-iv-pg-senior-03
    engine: postgres
    band: senior
    kind: concept
    q: { vi: "Transaction ID wraparound là gì và vì sao một hệ thống có thể ngừng nhận ghi vì nó?", en: "What is transaction ID wraparound and why can a system stop accepting writes because of it?" }
    answer: { vi: "XID là số 32 bit quay vòng; so sánh \"cũ hơn/mới hơn\" chỉ đúng trong cửa sổ khoảng 2 tỉ transaction. VACUUM \"freeze\" tuple cũ để chúng luôn được coi là trong quá khứ. Nếu freeze không theo kịp (autovacuum bị chặn bởi transaction dài, slot nhân bản bỏ quên, bảng quá lớn), `age(datfrozenxid)` tăng dần; gần giới hạn, Postgres cảnh báo rồi từ chối cấp XID mới để tránh mất dữ liệu. Theo dõi `age(datfrozenxid)` và `relfrozenxid`, xử lý thứ chặn vacuum.", en: "XIDs are 32-bit and wrap around; \"older/newer\" comparisons only hold within a window of about 2 billion transactions. VACUUM freezes old tuples so they always count as in the past. If freezing falls behind (autovacuum blocked by long transactions, a forgotten replication slot, a huge table), `age(datfrozenxid)` keeps rising; near the limit Postgres warns and then refuses new XIDs to avoid data loss. Monitor `age(datfrozenxid)` and `relfrozenxid`, and fix whatever blocks vacuum." }
    rubric:
      - { vi: "XID 32 bit và cửa sổ so sánh", en: "32-bit XID and the comparison window" }
      - { vi: "Freeze là lời giải", en: "Freezing is the cure" }
      - { vi: "Nêu nguyên nhân chặn freeze và chỉ số theo dõi", en: "Names what blocks freezing and the metric to watch" }
    doc: https://www.postgresql.org/docs/18/routine-vacuuming.html
  - id: e-iv-pg-senior-04
    engine: postgres
    band: senior
    kind: concept
    q: { vi: "Thiết kế hàng đợi việc trên Postgres để nhiều worker lấy việc song song mà không chặn nhau.", en: "Build a job queue on Postgres so many workers can take jobs in parallel without blocking each other." }
    answer: { vi: "Mỗi worker chạy trong một transaction: `SELECT id FROM jobs WHERE done = false ORDER BY run_at LIMIT 10 FOR UPDATE SKIP LOCKED`, xử lý, rồi đánh dấu xong và COMMIT. `SKIP LOCKED` bỏ qua dòng worker khác đang giữ thay vì chờ. Thêm chỉ mục một phần `(run_at) WHERE done = false`. Lưu ý: transaction giữ khóa trong lúc xử lý, nên việc dài cần cột `locked_until` thay cho giữ transaction mở; và bảng đổi nhiều cần autovacuum mạnh tay.", en: "Each worker runs in one transaction: `SELECT id FROM jobs WHERE done = false ORDER BY run_at LIMIT 10 FOR UPDATE SKIP LOCKED`, processes, marks done and COMMITs. `SKIP LOCKED` skips rows another worker holds instead of waiting. Add a partial index on `(run_at) WHERE done = false`. Caveats: the transaction holds locks while processing, so long jobs need a `locked_until` column instead of an open transaction; and the churn needs aggressive autovacuum." }
    rubric:
      - { vi: "Dùng FOR UPDATE SKIP LOCKED", en: "Uses FOR UPDATE SKIP LOCKED" }
      - { vi: "Chỉ mục một phần cho việc chưa xong", en: "Partial index for pending jobs" }
      - { vi: "Nêu rủi ro transaction dài / bloat", en: "Names the long-transaction / bloat risk" }
    doc: https://www.postgresql.org/docs/18/sql-select.html
  - id: e-iv-pg-senior-05
    engine: postgres
    band: senior
    kind: concept
    q: { vi: "Deadlock xảy ra thế nào trong Postgres, nó bị phát hiện ra sao, và bạn tránh nó trong code chuyển tiền thế nào?", en: "How does a deadlock happen in Postgres, how is it detected, and how do you avoid it in money-transfer code?" }
    answer: { vi: "T1 khóa dòng A rồi chờ B, T2 khóa B rồi chờ A. Sau `deadlock_timeout` (mặc định 1 s) Postgres kiểm đồ thị chờ và hủy một transaction với lỗi `40P01`. Tránh: luôn khóa theo cùng một thứ tự (ví dụ `SELECT … WHERE id IN (a, b) ORDER BY id FOR UPDATE`), giữ transaction ngắn, và retry khi gặp `40P01`.", en: "T1 locks row A then waits for B, T2 locks B then waits for A. After `deadlock_timeout` (1 s by default) Postgres checks the wait graph and aborts one transaction with error `40P01`. Avoid it: always lock in one order (for example `SELECT … WHERE id IN (a, b) ORDER BY id FOR UPDATE`), keep transactions short, and retry on `40P01`." }
    rubric:
      - { vi: "Mô tả đúng vòng chờ", en: "Describes the wait cycle correctly" }
      - { vi: "Biết deadlock_timeout và một bên bị hủy", en: "Knows deadlock_timeout and that one side is aborted" }
      - { vi: "Thứ tự khóa nhất quán + retry", en: "Consistent lock order + retry" }
    doc: https://www.postgresql.org/docs/18/explicit-locking.html
  - id: e-iv-pg-senior-06
    engine: postgres
    band: senior
    kind: concept
    q: { vi: "Đội bạn chuyển sang `SERIALIZABLE` để chặn lỗi trùng lịch trực. Ứng dụng cần đổi gì?", en: "Your team switches to `SERIALIZABLE` to stop double-booking on-call shifts. What must the application change?" }
    answer: { vi: "SSI không chờ khóa mà phát hiện xung đột đọc-ghi và hủy một transaction với `40001` (serialization_failure), có khi lúc COMMIT. Ứng dụng phải bọc cả transaction trong vòng thử lại (có giới hạn và backoff), không làm việc ngoài DB không hoàn tác được bên trong transaction, giữ transaction ngắn, và đánh dấu transaction chỉ đọc là `READ ONLY`. Chỉ mục tốt giúp giảm khóa vị từ ở mức page, ít hủy oan hơn.", en: "SSI does not wait on locks; it detects read-write conflicts and aborts one transaction with `40001` (serialization_failure), sometimes at COMMIT. The app must wrap the whole transaction in a retry loop (bounded, with backoff), avoid irreversible side effects inside it, keep it short, and mark read-only work `READ ONLY`. Good indexes keep predicate locks fine-grained, so fewer false aborts." }
    rubric:
      - { vi: "Biết lỗi 40001 và có thể ở COMMIT", en: "Knows error 40001, possibly at COMMIT" }
      - { vi: "Vòng thử lại toàn transaction", en: "Retry loop around the whole transaction" }
      - { vi: "Không tác dụng phụ bên ngoài trong transaction", en: "No external side effects inside it" }
    doc: https://www.postgresql.org/docs/18/transaction-iso.html
  - id: e-iv-pg-senior-07
    engine: postgres
    band: senior
    kind: concept
    q: { vi: "WAL và checkpoint quan hệ thế nào? Vì sao biểu đồ I/O có \"răng cưa\" theo chu kỳ, và chỉnh gì?", en: "How do WAL and checkpoints relate? Why does the I/O graph show a periodic \"sawtooth\", and what do you tune?" }
    answer: { vi: "Mọi thay đổi ghi vào WAL trước; page dữ liệu bẩn được ghi xuống sau. Checkpoint xả mọi page bẩn để có điểm khôi phục, sau đó lần sửa đầu tiên của mỗi page ghi cả page vào WAL (`full_page_writes`), nên WAL và I/O vọt lên ngay sau checkpoint. Chỉnh: `checkpoint_timeout` và `max_wal_size` lớn hơn (checkpoint thưa hơn, khôi phục lâu hơn), `checkpoint_completion_target` để rải việc ghi. Theo dõi checkpoint do vượt `max_wal_size` so với do hết giờ.", en: "Every change goes to the WAL first; dirty data pages are written later. A checkpoint flushes all dirty pages to set a recovery point; afterwards the first change to each page writes the whole page into the WAL (`full_page_writes`), so WAL and I/O spike right after a checkpoint. Tune: larger `checkpoint_timeout` and `max_wal_size` (rarer checkpoints, longer recovery), and `checkpoint_completion_target` to spread writes. Watch checkpoints forced by `max_wal_size` versus timed ones." }
    rubric:
      - { vi: "Ghi WAL trước, page sau", en: "WAL first, pages later" }
      - { vi: "Full page writes sau checkpoint", en: "Full page writes after a checkpoint" }
      - { vi: "Tham số đúng và đánh đổi thời gian khôi phục", en: "Right parameters and the recovery-time trade-off" }
    doc: https://www.postgresql.org/docs/18/wal-configuration.html
  - id: e-iv-pg-senior-08
    engine: postgres
    band: senior
    kind: diagnose
    q: { vi: "Lọc khách theo thành phố và vùng thì planner đoán 240 dòng, thực tế 400. Sau một lệnh, ước lượng đúng. Vì sao lệch, lệnh gì, và khi nào chuyện này đáng kể?", en: "Filtering customers by city and region, the planner guesses 240 rows, actually 400. After one command the estimate is right. Why the gap, what command, and when does it matter?" }
    exhibits:
      - label: { vi: "Trước", en: "Before" }
        source: pglite-0.5.16
        fixture: pg-shop
        setup: ""
        sql: "EXPLAIN (ANALYZE, BUFFERS OFF, TIMING OFF, SUMMARY OFF) SELECT * FROM customers WHERE city = 'Hue' AND region = 'Central'"
        shown: |-
          Seq Scan on customers  (cost=0.00..47.00 rows=240 width=37) (actual rows=400.00 loops=1)
            Filter: ((city = 'Hue'::text) AND (region = 'Central'::text))
            Rows Removed by Filter: 1600
      - label: { vi: "Sau", en: "After" }
        source: pglite-0.5.16
        fixture: pg-shop
        setup: "CREATE STATISTICS cust_city_region (dependencies) ON city, region FROM customers; ANALYZE customers;"
        sql: "EXPLAIN (ANALYZE, BUFFERS OFF, TIMING OFF, SUMMARY OFF) SELECT * FROM customers WHERE city = 'Hue' AND region = 'Central'"
        shown: |-
          Seq Scan on customers  (cost=0.00..47.00 rows=400 width=37) (actual rows=400.00 loops=1)
            Filter: ((city = 'Hue'::text) AND (region = 'Central'::text))
            Rows Removed by Filter: 1600
    answer: { vi: "Planner coi hai điều kiện độc lập: 20% (Hue) × 60% (Central) = 12% của 2.000 = 240. Nhưng thành phố quyết định vùng (Hue luôn ở Central), nên thực tế 20% = 400. `CREATE STATISTICS … (dependencies) ON city, region` rồi `ANALYZE` cho planner biết sự phụ thuộc này. Ở đây kế hoạch không đổi, nhưng khi bảng này là một vế của JOIN, ước lượng thấp có thể làm planner chọn nested loop hoặc hash quá nhỏ, chậm hàng chục lần.", en: "The planner treats the conditions as independent: 20% (Hue) × 60% (Central) = 12% of 2,000 = 240. But city determines region (Hue is always Central), so the truth is 20% = 400. `CREATE STATISTICS … (dependencies) ON city, region` then `ANALYZE` teaches the planner this dependency. Here the plan does not change, but when the table feeds a JOIN, an underestimate can make the planner pick a nested loop or an undersized hash, tens of times slower." }
    rubric:
      - { vi: "Tính lại 0,2 × 0,6 × 2000 = 240", en: "Recomputes 0.2 × 0.6 × 2000 = 240" }
      - { vi: "Gọi tên giả định độc lập và cột tương quan", en: "Names the independence assumption and correlated columns" }
      - { vi: "Đề xuất CREATE STATISTICS + ANALYZE", en: "Proposes CREATE STATISTICS + ANALYZE" }
      - { vi: "Nói khi nào sai lệch làm hỏng kế hoạch", en: "Says when the error breaks plans" }
    doc: https://www.postgresql.org/docs/18/planner-stats.html
  - id: e-iv-pg-senior-09
    engine: postgres
    band: senior
    kind: diagnose
    q: { vi: "Báo cáo \"số đơn mỗi khách\" chạy trên máy chủ có `work_mem` rất nhỏ. Đọc dòng `Batches` và kết luận.", en: "The \"orders per customer\" report runs on a server with a very small `work_mem`. Read the `Batches` line and conclude." }
    exhibits:
      - label: { vi: "Kế hoạch với work_mem = 64kB", en: "Plan with work_mem = 64kB" }
        source: pglite-0.5.16
        fixture: pg-shop
        setup: "SET work_mem = '64kB';"
        sql: "EXPLAIN (ANALYZE, COSTS OFF, BUFFERS OFF, TIMING OFF, SUMMARY OFF) SELECT customer_id, count(*) FROM orders GROUP BY customer_id"
        shown: |-
          HashAggregate (actual rows=2000.00 loops=1)
            Group Key: customer_id
            Batches: 5  Memory Usage: 129kB  Disk Usage: 256kB
            ->  Seq Scan on orders (actual rows=20000.00 loops=1)
    answer: { vi: "Bảng băm của 2.000 nhóm vượt giới hạn bộ nhớ của hash (`work_mem` × `hash_mem_multiplier`, ở đây 64kB × 2 = 128kB), nên HashAggregate chia 5 đợt và ghi 256kB ra đĩa. Với dữ liệu thật lớn, việc tràn đĩa này làm truy vấn chậm hẳn. Sửa: tăng `work_mem` (hoặc `hash_mem_multiplier`) cho phiên báo cáo; hoặc có chỉ mục trên `customer_id` để planner dùng GroupAggregate trên dữ liệu đã sắp xếp.", en: "The hash table for 2,000 groups exceeds the hash memory limit (`work_mem` × `hash_mem_multiplier`, here 64kB × 2 = 128kB), so HashAggregate splits into 5 batches and writes 256kB to disk. On really large data this spilling makes the query much slower. Fix: raise `work_mem` (or `hash_mem_multiplier`) for the reporting session; or an index on `customer_id` lets the planner use GroupAggregate over sorted input." }
    rubric:
      - { vi: "Đọc Batches > 1 = tràn đĩa", en: "Reads Batches > 1 = spilled" }
      - { vi: "Biết hash_mem_multiplier nhân work_mem", en: "Knows hash_mem_multiplier scales work_mem" }
      - { vi: "Đề xuất chỉnh theo phiên hoặc đường sắp xếp", en: "Proposes per-session tuning or a sorted path" }
    doc: https://www.postgresql.org/docs/18/runtime-config-resource.html
  - id: e-iv-pg-senior-10
    engine: postgres
    band: senior
    kind: diagnose
    q: { vi: "Bảng `events` chia partition theo tháng. Hai cách viết \"đếm sự kiện tháng 10\" cho cùng kết quả. Vì sao một cách đọc cả ba partition?", en: "`events` is partitioned by month. Two ways to write \"count October events\" give the same result. Why does one read all three partitions?" }
    exhibits:
      - label: { vi: "Lọc bằng date_trunc", en: "Filter with date_trunc" }
        source: pglite-0.5.16
        fixture: pg-shop
        setup: "CREATE TABLE events (id int, ts date NOT NULL, kind text) PARTITION BY RANGE (ts); CREATE TABLE events_2026_09 PARTITION OF events FOR VALUES FROM ('2026-09-01') TO ('2026-10-01'); CREATE TABLE events_2026_10 PARTITION OF events FOR VALUES FROM ('2026-10-01') TO ('2026-11-01'); CREATE TABLE events_2026_11 PARTITION OF events FOR VALUES FROM ('2026-11-01') TO ('2026-12-01'); INSERT INTO events SELECT i, date '2026-09-01' + i % 91, 'view' FROM generate_series(1, 9100) i; ANALYZE events;"
        sql: "EXPLAIN (ANALYZE, COSTS OFF, BUFFERS OFF, TIMING OFF, SUMMARY OFF) SELECT count(*) FROM events WHERE date_trunc('month', ts) = '2026-10-01'"
        shown: |-
          Aggregate (actual rows=1.00 loops=1)
            ->  Append (actual rows=3100.00 loops=1)
                  ->  Seq Scan on events_2026_09 events_1 (actual rows=0.00 loops=1)
                        Filter: (date_trunc('month'::text, (ts)::timestamp with time zone) = '2026-10-01 00:00:00+00'::timestamp with time zone)
                        Rows Removed by Filter: 3000
                  ->  Seq Scan on events_2026_10 events_2 (actual rows=3100.00 loops=1)
                        Filter: (date_trunc('month'::text, (ts)::timestamp with time zone) = '2026-10-01 00:00:00+00'::timestamp with time zone)
                  ->  Seq Scan on events_2026_11 events_3 (actual rows=0.00 loops=1)
                        Filter: (date_trunc('month'::text, (ts)::timestamp with time zone) = '2026-10-01 00:00:00+00'::timestamp with time zone)
                        Rows Removed by Filter: 3000
      - label: { vi: "Lọc bằng khoảng trên cột khóa", en: "Range filter on the key column" }
        source: pglite-0.5.16
        fixture: pg-shop
        setup: "CREATE TABLE events (id int, ts date NOT NULL, kind text) PARTITION BY RANGE (ts); CREATE TABLE events_2026_09 PARTITION OF events FOR VALUES FROM ('2026-09-01') TO ('2026-10-01'); CREATE TABLE events_2026_10 PARTITION OF events FOR VALUES FROM ('2026-10-01') TO ('2026-11-01'); CREATE TABLE events_2026_11 PARTITION OF events FOR VALUES FROM ('2026-11-01') TO ('2026-12-01'); INSERT INTO events SELECT i, date '2026-09-01' + i % 91, 'view' FROM generate_series(1, 9100) i; ANALYZE events;"
        sql: "EXPLAIN (ANALYZE, COSTS OFF, BUFFERS OFF, TIMING OFF, SUMMARY OFF) SELECT count(*) FROM events WHERE ts >= '2026-10-01' AND ts < '2026-11-01'"
        shown: |-
          Aggregate (actual rows=1.00 loops=1)
            ->  Seq Scan on events_2026_10 events (actual rows=3100.00 loops=1)
                  Filter: ((ts >= '2026-10-01'::date) AND (ts < '2026-11-01'::date))
    answer: { vi: "Partition pruning chỉ hiểu điều kiện trực tiếp trên khóa partition (`ts`) so với hằng/tham số. `date_trunc('month', ts)` là một biểu thức (lại còn ép sang `timestamptz`), planner không suy ra được nó chỉ khớp một partition, nên `Append` quét cả ba. Viết lại thành khoảng nửa mở `ts >= … AND ts < …` thì chỉ còn `events_2026_10`. Đây là lỗi hay gặp nhất khi bảng partition \"không nhanh hơn\".", en: "Partition pruning only understands conditions directly on the partition key (`ts`) against constants/parameters. `date_trunc('month', ts)` is an expression (also cast to `timestamptz`), so the planner cannot infer it matches one partition, and `Append` scans all three. Rewriting as a half-open range `ts >= … AND ts < …` leaves only `events_2026_10`. This is the most common reason a partitioned table is \"not faster\"." }
    rubric:
      - { vi: "Đọc được Append quét ba partition", en: "Reads that Append scans three partitions" }
      - { vi: "Giải thích pruning cần điều kiện trên cột khóa", en: "Explains pruning needs conditions on the key column" }
      - { vi: "Viết lại thành khoảng nửa mở", en: "Rewrites as a half-open range" }
    doc: https://www.postgresql.org/docs/18/ddl-partitioning.html
  - id: e-iv-pg-senior-11
    engine: postgres
    band: senior
    kind: diagnose
    q: { vi: "API danh sách đơn phân trang bằng OFFSET. Trang cuối chậm hơn trang đầu rất nhiều. So hai kế hoạch và đề xuất.", en: "The orders list API paginates with OFFSET. The last pages are much slower than the first. Compare the plans and propose a fix." }
    exhibits:
      - label: { vi: "Phân trang OFFSET 15000", en: "Paging with OFFSET 15000" }
        source: pglite-0.5.16
        fixture: pg-shop
        setup: "CREATE INDEX ON orders (created_at, id);"
        sql: "EXPLAIN (ANALYZE, COSTS OFF, BUFFERS OFF, TIMING OFF, SUMMARY OFF) SELECT id, total FROM orders ORDER BY created_at, id OFFSET 15000 LIMIT 20"
        shown: |-
          Limit (actual rows=20.00 loops=1)
            ->  Index Scan using orders_created_at_id_idx on orders (actual rows=15020.00 loops=1)
                  Index Searches: 1
      - label: { vi: "Keyset (sau dòng cuối của trang trước)", en: "Keyset (after the previous page's last row)" }
        source: pglite-0.5.16
        fixture: pg-shop
        setup: "CREATE INDEX ON orders (created_at, id);"
        sql: "EXPLAIN (ANALYZE, COSTS OFF, BUFFERS OFF, TIMING OFF, SUMMARY OFF) SELECT id, total FROM orders WHERE (created_at, id) > ('2026-08-03', 15000) ORDER BY created_at, id LIMIT 20"
        shown: |-
          Limit (actual rows=20.00 loops=1)
            ->  Index Scan using orders_created_at_id_idx on orders (actual rows=20.00 loops=1)
                  Index Cond: (ROW(created_at, id) > ROW('2026-08-03'::date, 15000))
                  Index Searches: 1
    answer: { vi: "Với OFFSET, Postgres vẫn phải đọc và bỏ 15.000 dòng (`actual rows=15020`) trước khi trả 20: chi phí tăng theo số trang. Keyset pagination nhớ khóa của dòng cuối trang trước và nhảy thẳng tới đó qua chỉ mục bằng so sánh hàng `(created_at, id) > (…)`: chỉ đọc 20 dòng, trang nào cũng nhanh như nhau. Đổi lại không nhảy được tới \"trang 750\" tùy ý, và cần khóa sắp xếp duy nhất (thêm `id`).", en: "With OFFSET, Postgres still reads and discards 15,000 rows (`actual rows=15020`) before returning 20: cost grows with the page number. Keyset pagination remembers the previous page's last key and jumps there through the index with a row comparison `(created_at, id) > (…)`: it reads 20 rows, every page equally fast. The cost: no jumping to an arbitrary \"page 750\", and the sort key must be unique (add `id`)." }
    rubric:
      - { vi: "Đọc actual rows=15020 dưới Limit", en: "Reads actual rows=15020 under Limit" }
      - { vi: "Đề xuất keyset với so sánh hàng", en: "Proposes keyset with a row comparison" }
      - { vi: "Nêu đánh đổi và khóa duy nhất", en: "States the trade-off and the unique key" }
    doc: https://www.postgresql.org/docs/18/queries-limit.html
  - id: e-iv-pg-senior-12
    engine: postgres
    band: senior
    kind: concept
    q: { vi: "Chỉ mục phình to theo thời gian. Bạn phát hiện và xử lý thế nào trên hệ thống đang chạy?", en: "An index has bloated over time. How do you detect and fix it on a live system?" }
    answer: { vi: "Phát hiện: so kích thước `pg_relation_size` của chỉ mục với ước lượng từ số dòng, theo dõi tăng trưởng, hoặc dùng `pgstattuple`/`pgstatindex` để xem mật độ lá. Nguyên nhân thường là xóa/cập nhật hàng loạt hoặc vacuum chậm. Xử lý: `REINDEX INDEX CONCURRENTLY` (không chặn ghi, cần thêm chỗ đĩa, có thể để lại chỉ mục INVALID nếu thất bại: phải dọn). Sau đó sửa gốc: autovacuum cho bảng đó mạnh hơn, tránh transaction dài.", en: "Detect: compare the index's `pg_relation_size` against what the row count suggests, track growth, or use `pgstattuple`/`pgstatindex` for leaf density. Causes are usually mass deletes/updates or vacuum lagging. Fix: `REINDEX INDEX CONCURRENTLY` (does not block writes, needs extra disk, may leave an INVALID index on failure that must be cleaned up). Then fix the root cause: more aggressive autovacuum for that table, avoid long transactions." }
    rubric:
      - { vi: "Có cách đo cụ thể", en: "Has a concrete way to measure" }
      - { vi: "REINDEX CONCURRENTLY và rủi ro INVALID", en: "REINDEX CONCURRENTLY and the INVALID risk" }
      - { vi: "Sửa nguyên nhân gốc", en: "Fixes the root cause" }
    doc: https://www.postgresql.org/docs/18/sql-reindex.html
  - id: e-iv-pg-senior-13
    engine: postgres
    band: senior
    kind: design
    q: { vi: "SaaS nhiều khách hàng (tenant) trên một Postgres: so sánh \"cột tenant_id + RLS\", \"schema riêng mỗi tenant\" và \"database riêng\". Bạn chọn gì cho 5.000 tenant nhỏ?", en: "A multi-tenant SaaS on one Postgres: compare \"tenant_id column + RLS\", \"schema per tenant\" and \"database per tenant\". What do you pick for 5,000 small tenants?" }
    answer: { vi: "5.000 tenant nhỏ: cột `tenant_id` trên mọi bảng, nằm đầu mọi khóa chính/chỉ mục, cộng Row Level Security: `CREATE POLICY p ON orders USING (tenant_id = current_setting('app.tenant')::int)`, ứng dụng đặt `app.tenant` mỗi transaction và kết nối bằng role không phải chủ bảng (chủ bảng bỏ qua RLS trừ khi `FORCE ROW LEVEL SECURITY`). Schema riêng: 5.000 × số bảng làm catalog phình, migration phải chạy 5.000 lần. Database riêng: cách ly tốt nhất nhưng tốn kết nối, khó báo cáo chung; hợp cho vài tenant lớn hoặc có yêu cầu pháp lý.", en: "5,000 small tenants: a `tenant_id` column on every table, leading every primary key/index, plus Row Level Security: `CREATE POLICY p ON orders USING (tenant_id = current_setting('app.tenant')::int)`; the app sets `app.tenant` per transaction and connects with a role that does not own the tables (owners bypass RLS unless `FORCE ROW LEVEL SECURITY`). Schema per tenant: 5,000 × tables bloats the catalog and migrations run 5,000 times. Database per tenant: best isolation but costly in connections and hard to report across; fits a few large or regulated tenants." }
    tradeoffs:
      - { vi: "RLS: rẻ, một lần migration, nhưng một bug quên đặt tenant là rò dữ liệu nếu không có RLS chặn; tenant ồn ảnh hưởng nhau.", en: "RLS: cheap, one migration, but a bug that forgets the tenant leaks data unless RLS blocks it; noisy tenants affect each other." }
      - { vi: "Mô hình lai: tenant lớn tách DB riêng, phần còn lại dùng chung.", en: "Hybrid: big tenants get their own DB, the rest share." }
    rubric:
      - { vi: "Chọn cột + RLS có lý do cho quy mô này", en: "Picks column + RLS with a reason for this scale" }
      - { vi: "Biết bẫy chủ bảng bỏ qua RLS", en: "Knows the owner-bypasses-RLS trap" }
      - { vi: "So được chi phí catalog/migration/kết nối", en: "Compares catalog/migration/connection costs" }
    doc: https://www.postgresql.org/docs/18/ddl-rowsecurity.html
  - id: e-iv-pg-senior-14
    engine: postgres
    band: senior
    kind: design
    q: { vi: "Bảng sự kiện nhận 50 triệu dòng mỗi ngày, chỉ giữ 90 ngày, truy vấn gần như luôn lọc theo thời gian. Thiết kế lưu trữ và dọn dữ liệu.", en: "An events table gets 50 million rows a day, keeps only 90 days, and queries almost always filter by time. Design storage and cleanup." }
    answer: { vi: "Partition theo khoảng ngày (`PARTITION BY RANGE (ts)`, một partition mỗi ngày), tạo trước vài ngày tới bằng job định kỳ. Dọn: `DETACH PARTITION … CONCURRENTLY` rồi `DROP TABLE` partition cũ: tức thì, không tạo tuple chết như `DELETE`. Chỉ mục khai báo ở bảng cha được tạo trên mọi partition; BRIN trên `ts` rất nhỏ nếu dữ liệu vào theo thứ tự thời gian. Truy vấn phải lọc trực tiếp trên `ts` để pruning. Khóa chính phải chứa cột partition.", en: "Partition by day (`PARTITION BY RANGE (ts)`, one partition per day), created a few days ahead by a scheduled job. Cleanup: `DETACH PARTITION … CONCURRENTLY` then `DROP TABLE` the old partition: instant, no dead tuples unlike `DELETE`. Indexes declared on the parent are created on every partition; a BRIN on `ts` is tiny when data arrives in time order. Queries must filter directly on `ts` for pruning. The primary key must include the partition column." }
    tradeoffs:
      - { vi: "Partition theo ngày: dọn rẻ, nhưng 90+ partition tăng thời gian lập kế hoạch nếu truy vấn không pruning.", en: "Daily partitions: cheap cleanup, but 90+ partitions add planning time when queries do not prune." }
      - { vi: "Khóa chính phải chứa `ts`, nên không có ràng buộc duy nhất toàn cục chỉ trên `id`.", en: "The primary key must include `ts`, so no global uniqueness on `id` alone." }
    rubric:
      - { vi: "Partition theo thời gian + tạo trước", en: "Time partitions + pre-creation" }
      - { vi: "Dọn bằng DETACH/DROP thay DELETE", en: "Cleanup via DETACH/DROP instead of DELETE" }
      - { vi: "Nêu giới hạn khóa chính và pruning", en: "States the primary-key and pruning limits" }
    doc: https://www.postgresql.org/docs/18/ddl-partitioning.html
  - id: e-iv-pg-senior-15
    engine: postgres
    band: senior
    kind: concept
    q: { vi: "Truy vấn nhanh trong psql nhưng chậm khi gọi qua ORM dùng prepared statement. Một nguyên nhân phổ biến là gì?", en: "A query is fast in psql but slow through an ORM that uses prepared statements. What is a common cause?" }
    answer: { vi: "Prepared statement: 5 lần đầu Postgres lập kế hoạch riêng theo giá trị tham số (custom plan); sau đó nếu kế hoạch chung (generic plan, không biết giá trị) không đắt hơn đáng kể theo ước lượng, nó dùng kế hoạch chung mãi. Với dữ liệu lệch (một giá trị chiếm 90%), kế hoạch chung có thể rất tệ cho một số giá trị. Kiểm bằng `EXPLAIN EXECUTE` sau vài lần chạy; xử lý bằng `plan_cache_mode = force_custom_plan` cho phiên/role đó, hoặc tách truy vấn theo trường hợp.", en: "Prepared statements: for the first 5 executions Postgres plans with the actual parameter values (custom plans); after that, if the generic plan (values unknown) is not estimated much costlier, it keeps the generic plan. With skewed data (one value is 90%), the generic plan can be very bad for some values. Check with `EXPLAIN EXECUTE` after a few runs; fix with `plan_cache_mode = force_custom_plan` for that session/role, or split the query by case." }
    rubric:
      - { vi: "Custom vs generic plan, mốc 5 lần", en: "Custom vs generic plan, the 5-execution mark" }
      - { vi: "Nối với dữ liệu lệch", en: "Connects it to skewed data" }
      - { vi: "Biết plan_cache_mode", en: "Knows plan_cache_mode" }
    doc: https://www.postgresql.org/docs/18/sql-prepare.html

  # ---------------- PostgreSQL · staff
  - id: e-iv-pg-staff-01
    engine: postgres
    band: staff
    kind: concept
    q: { vi: "Nhân bản streaming đồng bộ và bất đồng bộ: mỗi giá trị `synchronous_commit` hứa gì về mất dữ liệu (RPO) và độ trễ?", en: "Synchronous vs asynchronous streaming replication: what does each `synchronous_commit` value promise about data loss (RPO) and latency?" }
    answer: { vi: "Bất đồng bộ: primary trả COMMIT khi WAL đã xuống đĩa của nó; mất primary có thể mất vài giây giao dịch cuối. Với `synchronous_standby_names` đặt: `remote_write` chờ standby nhận và ghi vào OS; `on` chờ standby flush WAL (không mất khi một máy sập); `remote_apply` chờ standby áp dụng xong, nên đọc ngay trên standby thấy dữ liệu. `local`/`off` không chờ standby (`off` còn không chờ đĩa cục bộ: có thể mất giao dịch mới nhất nhưng không hỏng dữ liệu). Mức càng chặt, độ trễ COMMIT càng cộng thêm một vòng mạng; nên dùng quorum (`ANY 1 (a, b)`) để một standby chết không làm treo ghi.", en: "Async: the primary acknowledges COMMIT when WAL is on its own disk; losing the primary can lose the last seconds of transactions. With `synchronous_standby_names` set: `remote_write` waits for the standby to receive and hand it to the OS; `on` waits for the standby to flush WAL (no loss on a single machine failure); `remote_apply` waits until the standby has applied it, so reads on the standby see it. `local`/`off` do not wait for standbys (`off` does not even wait for the local disk: the newest transactions can be lost but data is not corrupted). Stricter levels add a network round trip to every COMMIT; use a quorum (`ANY 1 (a, b)`) so one dead standby does not stall writes." }
    rubric:
      - { vi: "Phân biệt đúng các mức theo điểm chờ", en: "Distinguishes the levels by what they wait for" }
      - { vi: "Nối với RPO và độ trễ", en: "Ties them to RPO and latency" }
      - { vi: "Biết quorum để tránh treo ghi", en: "Knows quorum to avoid stalled writes" }
    doc: https://www.postgresql.org/docs/18/warm-standby.html
  - id: e-iv-pg-staff-02
    engine: postgres
    band: staff
    kind: concept
    q: { vi: "Nhân bản logic khác nhân bản vật lý thế nào, và bạn dùng nó cho việc gì? Có bẫy gì?", en: "How does logical replication differ from physical, and what do you use it for? What are the traps?" }
    answer: { vi: "Vật lý gửi WAL từng byte: bản sao giống hệt cả cụm, cùng phiên bản lớn, chỉ đọc. Logical giải mã WAL thành thay đổi dòng theo publication/subscription: chọn bảng, khác phiên bản lớn, bên nhận ghi được. Dùng cho nâng cấp phiên bản ít dừng, tách dữ liệu, đẩy sang hệ thống khác (CDC). Bẫy: không nhân bản DDL và giá trị sequence; bảng cần replica identity (thường là khóa chính) để UPDATE/DELETE; slot không ai đọc giữ WAL mãi làm đầy đĩa; cần `wal_level = logical`.", en: "Physical ships WAL byte for byte: an identical read-only copy of the whole cluster, same major version. Logical decodes WAL into row changes through publications/subscriptions: per table, across major versions, the target stays writable. Used for low-downtime major upgrades, splitting data, feeding other systems (CDC). Traps: DDL and sequence values are not replicated; tables need a replica identity (usually the primary key) for UPDATE/DELETE; an unread slot retains WAL forever and fills the disk; needs `wal_level = logical`." }
    rubric:
      - { vi: "So đúng phạm vi và tính ghi được", en: "Compares scope and writability correctly" }
      - { vi: "Ít nhất hai trường hợp dùng", en: "At least two use cases" }
      - { vi: "Ít nhất hai bẫy (DDL, sequence, slot, replica identity)", en: "At least two traps (DDL, sequences, slots, replica identity)" }
    doc: https://www.postgresql.org/docs/18/logicaldecoding-explanation.html
  - id: e-iv-pg-staff-03
    engine: postgres
    band: staff
    kind: design
    q: { vi: "Cần thêm ràng buộc `NOT NULL` và một khóa ngoại mới cho bảng 2 tỉ dòng đang nhận ghi liên tục, không được dừng. Lên kế hoạch.", en: "You must add a `NOT NULL` and a new foreign key to a 2-billion-row table under constant writes, with no downtime. Plan it." }
    answer: { vi: "Kiểu expand/contract. (1) Thêm cột cho phép NULL (chỉ sửa catalog). (2) Ứng dụng ghi cả cột mới; backfill theo lô nhỏ có nghỉ, theo dõi độ trễ nhân bản. (3) `ADD CONSTRAINT … CHECK (col IS NOT NULL) NOT VALID` (khóa rất ngắn), rồi `VALIDATE CONSTRAINT` (quét bảng nhưng chỉ khóa SHARE UPDATE EXCLUSIVE, không chặn ghi). (4) `SET NOT NULL`: từ PG12 dùng CHECK đã validate để bỏ qua việc quét. (5) Khóa ngoại tương tự: `NOT VALID` rồi `VALIDATE`, nhớ tạo chỉ mục `CONCURRENTLY` trên cột trước. Mọi bước có `lock_timeout` và retry.", en: "Expand/contract. (1) Add the column as nullable (catalog only). (2) The app writes the new column; backfill in small throttled batches, watching replication lag. (3) `ADD CONSTRAINT … CHECK (col IS NOT NULL) NOT VALID` (very short lock), then `VALIDATE CONSTRAINT` (scans but takes only SHARE UPDATE EXCLUSIVE, writes continue). (4) `SET NOT NULL`: since PG12 a validated CHECK lets it skip the scan. (5) Same for the foreign key: `NOT VALID` then `VALIDATE`, after creating the column's index `CONCURRENTLY`. Every step uses `lock_timeout` and retries." }
    tradeoffs:
      - { vi: "Nhiều bước và nhiều lần deploy hơn, đổi lại không có khóa dài.", en: "More steps and deploys, in exchange for no long locks." }
      - { vi: "Backfill tạo nhiều WAL và tuple chết: cần nhịp chậm và vacuum theo sau.", en: "Backfill generates lots of WAL and dead tuples: needs throttling and vacuum behind it." }
    rubric:
      - { vi: "Dùng NOT VALID + VALIDATE", en: "Uses NOT VALID + VALIDATE" }
      - { vi: "Backfill theo lô có kiểm soát", en: "Controlled batched backfill" }
      - { vi: "Biết SET NOT NULL dùng được CHECK đã validate", en: "Knows SET NOT NULL can use a validated CHECK" }
      - { vi: "lock_timeout và chỉ mục CONCURRENTLY", en: "lock_timeout and a CONCURRENTLY index" }
    doc: https://www.postgresql.org/docs/18/sql-altertable.html
  - id: e-iv-pg-staff-04
    engine: postgres
    band: staff
    kind: concept
    q: { vi: "Khi nào parallel query và JIT giúp, khi nào hại? (Lưu ý: PGlite trong trình duyệt không có cả hai, nên câu này chỉ trả lời bằng lý thuyết.)", en: "When do parallel query and JIT help, and when do they hurt? (Note: PGlite in the browser has neither, so answer from theory.)" }
    answer: { vi: "Parallel: tốt cho quét/gom lớn chạy lâu trên máy nhiều lõi (nút `Gather` với worker); vô ích hoặc hại cho truy vấn OLTP ngắn (chi phí khởi động worker), và lấy CPU của truy vấn khác; giới hạn bởi `max_parallel_workers_per_gather` và tổng worker. JIT: biên dịch biểu thức cho truy vấn phân tích rất tốn CPU; với truy vấn ước lượng đắt nhưng thực tế ngắn, thời gian biên dịch có thể lớn hơn thời gian chạy: đó là lý do nhiều hệ OLTP tắt `jit` hoặc nâng `jit_above_cost`.", en: "Parallel: good for big long scans/aggregations on many-core machines (a `Gather` node with workers); useless or harmful for short OLTP queries (worker startup cost), and it takes CPU from other queries; bounded by `max_parallel_workers_per_gather` and the total worker pool. JIT: compiles expressions for CPU-heavy analytic queries; for queries that are estimated expensive but actually short, compile time can exceed run time: that is why many OLTP systems turn `jit` off or raise `jit_above_cost`." }
    rubric:
      - { vi: "Khi parallel có lợi / có hại", en: "When parallel helps / hurts" }
      - { vi: "Chi phí biên dịch JIT so với thời gian chạy", en: "JIT compile cost vs run time" }
      - { vi: "Kể tham số điều khiển", en: "Names the controlling settings" }
    doc: https://www.postgresql.org/docs/18/jit-decision.html
  - id: e-iv-pg-staff-05
    engine: postgres
    band: staff
    kind: design
    q: { vi: "Đặt chiến lược sao lưu cho cụm Postgres với yêu cầu RPO ≤ 1 phút, RTO ≤ 1 giờ, và khôi phục được về thời điểm trước một lệnh xóa nhầm.", en: "Set a backup strategy for a Postgres cluster with RPO ≤ 1 minute, RTO ≤ 1 hour, and the ability to restore to just before an accidental delete." }
    answer: { vi: "Base backup vật lý định kỳ (ví dụ hằng đêm) + lưu trữ WAL liên tục (`archive_command`/`archive_library`, hoặc nhận WAL streaming) sang kho khác vùng: cho PITR tới bất kỳ thời điểm nào bằng `recovery_target_time`. `archive_timeout` ≤ 60 s để RPO ≤ 1 phút khi tải thấp. Standby nóng cho hỏng máy (RTO vài phút), nhưng standby nhân bản cả lệnh xóa nhầm, nên PITR mới là lưới an toàn cho lỗi người. Đo RTO bằng diễn tập khôi phục định kỳ: thời gian phát lại WAL từ base backup gần nhất phải < 1 giờ. `pg_dump` chỉ là bản logic bổ sung, không cho PITR.", en: "Periodic physical base backups (say nightly) + continuous WAL archiving (`archive_command`/`archive_library`, or streaming WAL receipt) to storage in another region: this allows PITR to any moment with `recovery_target_time`. `archive_timeout` ≤ 60 s keeps RPO ≤ 1 minute under low load. A hot standby covers machine failure (RTO minutes), but it replays the accidental delete too, so PITR is the safety net for human error. Prove RTO with regular restore drills: replaying WAL from the latest base backup must take < 1 hour. `pg_dump` is only a logical extra, it gives no PITR." }
    tradeoffs:
      - { vi: "Base backup thưa thì rẻ kho nhưng phát lại WAL lâu hơn (RTO tăng).", en: "Rare base backups save storage but WAL replay takes longer (higher RTO)." }
      - { vi: "Standby trễ có chủ đích (`recovery_min_apply_delay`) cho lối thoát nhanh khi xóa nhầm, đổi lại một máy nữa.", en: "A deliberately delayed standby (`recovery_min_apply_delay`) gives a fast escape from accidental deletes, at the cost of another machine." }
    rubric:
      - { vi: "Base backup + lưu trữ WAL = PITR", en: "Base backup + WAL archive = PITR" }
      - { vi: "Phân biệt standby (phần cứng) và PITR (lỗi người)", en: "Separates standby (hardware) from PITR (human error)" }
      - { vi: "Nối thông số với RPO/RTO và diễn tập", en: "Ties settings to RPO/RTO and drills" }
    doc: https://www.postgresql.org/docs/18/continuous-archiving.html
  - id: e-iv-pg-staff-06
    engine: postgres
    band: staff
    kind: concept
    q: { vi: "Một phiên `idle in transaction` mở từ 6 giờ trước. Liệt kê các hậu quả trên toàn cụm.", en: "A session has been `idle in transaction` for 6 hours. List the cluster-wide consequences." }
    answer: { vi: "Snapshot của nó giữ \"xmin horizon\": VACUUM ở mọi bảng không dọn được tuple chết mới hơn nó, nên bảng và chỉ mục phình, index-only scan mất hiệu quả (visibility map không được đặt), freeze bị chặn (nguy cơ wraparound về lâu dài). Nếu nó giữ khóa, DDL bị treo và kéo theo hàng đợi khóa. Với `hot_standby_feedback`, truy vấn dài trên standby gây hiệu ứng tương tự trên primary. Phòng: `idle_in_transaction_session_timeout`, theo dõi `pg_stat_activity.xact_start`.", en: "Its snapshot pins the \"xmin horizon\": VACUUM on every table cannot remove dead tuples newer than it, so tables and indexes bloat, index-only scans degrade (visibility map not set), and freezing is blocked (wraparound risk in the long run). If it holds locks, DDL hangs and builds a lock queue. With `hot_standby_feedback`, long queries on a standby have the same effect on the primary. Prevent: `idle_in_transaction_session_timeout`, monitor `pg_stat_activity.xact_start`." }
    rubric:
      - { vi: "Giải thích xmin horizon chặn vacuum toàn cụm", en: "Explains the xmin horizon blocking vacuum cluster-wide" }
      - { vi: "Ít nhất ba hậu quả", en: "At least three consequences" }
      - { vi: "Nêu timeout và cách giám sát", en: "Names the timeout and how to monitor" }
    doc: https://www.postgresql.org/docs/18/routine-vacuuming.html
  - id: e-iv-pg-staff-07
    engine: postgres
    band: staff
    kind: concept
    q: { vi: "Chọn loại chỉ mục cho từng nhu cầu: khoảng thời gian trên bảng log chỉ chèn thêm; tìm `jsonb` chứa cặp khóa-giá trị; tìm điểm gần nhất; tìm chuỗi con bất kỳ; tra bằng đúng một giá trị băm dài.", en: "Pick an index type for each need: a time range on an append-only log; `jsonb` containing a key-value pair; nearest point; arbitrary substring search; exact lookup of a long hash value." }
    answer: { vi: "Log chỉ chèn: BRIN (tóm tắt min/max mỗi khối page, cực nhỏ, cần dữ liệu tương quan với vị trí vật lý). `jsonb` chứa: GIN (`jsonb_path_ops` nếu chỉ cần `@>`). Gần nhất: GiST với toán tử `<->` (KNN). Chuỗi con: GIN hoặc GiST với `pg_trgm`. Tra bằng giá trị dài: Hash (chỉ hỗ trợ `=`, nhỏ hơn B-tree với khóa dài) hoặc B-tree trên giá trị đó; B-tree vẫn là mặc định an toàn vì hỗ trợ sắp xếp và duy nhất.", en: "Append-only log: BRIN (min/max per block range, tiny, needs data correlated with physical order). `jsonb` containment: GIN (`jsonb_path_ops` if only `@>` is needed). Nearest: GiST with the `<->` operator (KNN). Substring: GIN or GiST with `pg_trgm`. Lookup of a long value: Hash (only `=`, smaller than a B-tree for long keys) or a B-tree on it; B-tree stays the safe default since it supports ordering and uniqueness." }
    rubric:
      - { vi: "Đúng ít nhất 4/5 lựa chọn", en: "At least 4 of 5 choices right" }
      - { vi: "Nêu điều kiện của BRIN (tương quan)", en: "States BRIN's correlation requirement" }
      - { vi: "Biết pg_trgm cho chuỗi con", en: "Knows pg_trgm for substrings" }
    doc: https://www.postgresql.org/docs/18/indexes-types.html
  - id: e-iv-pg-staff-08
    engine: postgres
    band: staff
    kind: diagnose
    q: { vi: "Cùng một prepared statement đếm đơn theo trạng thái, chạy với `'PAID'`, nhưng hai chế độ `plan_cache_mode` cho hai kế hoạch khác nhau. Giải thích từng kế hoạch, và nói kế hoạch nào nguy hiểm khi bảng lớn lên.", en: "The same prepared statement counting orders by status, run with `'PAID'`, gives two plans under two `plan_cache_mode` settings. Explain each, and say which is dangerous as the table grows." }
    exhibits:
      - label: { vi: "Chế độ force_generic_plan", en: "Mode force_generic_plan" }
        source: pglite-0.5.16
        fixture: pg-shop
        setup: "CREATE INDEX ON orders (status); ANALYZE orders; SET plan_cache_mode = force_generic_plan; PREPARE by_status(text) AS SELECT count(*) FROM orders WHERE status = $1;"
        sql: "EXPLAIN (ANALYZE, COSTS OFF, BUFFERS OFF, TIMING OFF, SUMMARY OFF) EXECUTE by_status('PAID')"
        shown: |-
          Aggregate (actual rows=1.00 loops=1)
            ->  Bitmap Heap Scan on orders (actual rows=18000.00 loops=1)
                  Recheck Cond: (status = $1)
                  Heap Blocks: exact=228
                  ->  Bitmap Index Scan on orders_status_idx (actual rows=18000.00 loops=1)
                        Index Cond: (status = $1)
                        Index Searches: 1
      - label: { vi: "Chế độ force_custom_plan", en: "Mode force_custom_plan" }
        source: pglite-0.5.16
        fixture: pg-shop
        setup: "CREATE INDEX ON orders (status); ANALYZE orders; SET plan_cache_mode = force_custom_plan; PREPARE by_status(text) AS SELECT count(*) FROM orders WHERE status = $1;"
        sql: "EXPLAIN (ANALYZE, COSTS OFF, BUFFERS OFF, TIMING OFF, SUMMARY OFF) EXECUTE by_status('PAID')"
        shown: |-
          Aggregate (actual rows=1.00 loops=1)
            ->  Seq Scan on orders (actual rows=18000.00 loops=1)
                  Filter: (status = 'PAID'::text)
                  Rows Removed by Filter: 2000
    answer: { vi: "Generic plan thấy `$1`, không biết giá trị, nên ước lượng theo trung bình (khoảng 1/3 bảng với 3 giá trị) và chọn bitmap qua chỉ mục, rồi thực tế phải đọc 18.000 dòng trên mọi 228 page: thêm việc đọc chỉ mục mà không bỏ được page nào. Custom plan thấy `'PAID'` = 90% nên quét tuần tự, đúng. Generic plan nguy hiểm vì một kế hoạch phục vụ mọi giá trị: với dữ liệu lệch nặng nó tốt cho giá trị hiếm và tệ cho giá trị phổ biến (hoặc ngược lại), và khi bảng lớn, sai lệch thành chênh hàng chục lần. Mặc định `auto` chuyển sang generic sau 5 lần chạy nếu ước lượng chi phí trung bình không tệ hơn.", en: "The generic plan sees `$1`, not the value, so it estimates an average (about 1/3 of the table with 3 values) and picks a bitmap through the index; in reality it reads 18,000 rows across all 228 pages: extra index work that skips no page. The custom plan sees `'PAID'` = 90% and scans sequentially, correctly. The generic plan is the dangerous one because one plan serves every value: with heavy skew it suits rare values and hurts common ones (or the reverse), and as the table grows the error becomes tens of times. The default `auto` switches to generic after 5 runs if its estimated cost is not worse than the custom average." }
    rubric:
      - { vi: "Đọc $1 trong generic vs hằng trong custom", en: "Reads $1 in generic vs the constant in custom" }
      - { vi: "Giải thích ước lượng trung bình vs giá trị thật", en: "Explains average estimate vs the real value" }
      - { vi: "Biết luật 5 lần của auto", en: "Knows auto's 5-run rule" }
    doc: https://www.postgresql.org/docs/18/runtime-config-query.html
  - id: e-iv-pg-staff-09
    engine: postgres
    band: staff
    kind: diagnose
    q: { vi: "Chỉ mục BRIN trên `created_at` (4 page mỗi khoảng) trả lời truy vấn một ngày. Đọc `lossy` và `Rows Removed by Index Recheck`: chỉ mục này tốt hay xấu, và khi nào nó hỏng?", en: "A BRIN index on `created_at` (4 pages per range) answers a one-day query. Read `lossy` and `Rows Removed by Index Recheck`: is this index good or bad, and when does it break?" }
    exhibits:
      - label: { vi: "Kế hoạch với BRIN (seq scan bị tắt để xem chỉ mục)", en: "Plan with BRIN (seq scan disabled to show the index)" }
        source: pglite-0.5.16
        fixture: pg-shop
        setup: "CREATE INDEX orders_created_brin ON orders USING brin (created_at) WITH (pages_per_range = 4); ANALYZE orders; SET enable_seqscan = off;"
        sql: "EXPLAIN (ANALYZE, COSTS OFF, BUFFERS OFF, TIMING OFF, SUMMARY OFF) SELECT count(*) FROM orders WHERE created_at = '2026-05-01'"
        shown: |-
          Aggregate (actual rows=1.00 loops=1)
            ->  Bitmap Heap Scan on orders (actual rows=70.00 loops=1)
                  Recheck Cond: (created_at = '2026-05-01'::date)
                  Rows Removed by Index Recheck: 634
                  Heap Blocks: lossy=8
                  ->  Bitmap Index Scan on orders_created_brin (actual rows=80.00 loops=1)
                        Index Cond: (created_at = '2026-05-01'::date)
                        Index Searches: 1
    answer: { vi: "BRIN chỉ biết min/max của mỗi khoảng 4 page, nên trả về cả khối page (`lossy=8`: 2 khoảng) và Postgres kiểm lại từng dòng: giữ 70, bỏ 634. Đọc 8 page thay vì 228 là tốt, và chỉ mục chỉ vài page. Nó tốt vì `created_at` tăng cùng thứ tự chèn (tương quan vật lý gần 1). Nó hỏng khi tương quan mất: cập nhật/xóa rồi chèn lấp chỗ trống, nạp dữ liệu lộn xộn, `CLUSTER` theo cột khác; khi đó mỗi khoảng phủ gần như mọi ngày và BRIN đọc cả bảng. Kiểm bằng `pg_stats.correlation`. Lưu ý `enable_seqscan = off` chỉ để minh họa.", en: "BRIN only knows min/max per 4-page range, so it returns whole page blocks (`lossy=8`: 2 ranges) and Postgres rechecks every row: keeps 70, drops 634. Reading 8 pages instead of 228 is good, and the index is a few pages. It works because `created_at` grows with insert order (physical correlation near 1). It breaks when correlation is lost: updates/deletes then inserts filling the holes, out-of-order loads, `CLUSTER` on another column; then every range covers almost every day and BRIN reads the whole table. Check `pg_stats.correlation`. Note `enable_seqscan = off` is only for illustration." }
    rubric:
      - { vi: "Hiểu lossy và recheck", en: "Understands lossy and recheck" }
      - { vi: "Tính được 8 page / 228", en: "Gets 8 pages out of 228" }
      - { vi: "Nêu điều kiện tương quan và cách kiểm", en: "States the correlation condition and how to check" }
    doc: https://www.postgresql.org/docs/18/brin.html
  - id: e-iv-pg-staff-10
    engine: postgres
    band: staff
    kind: diagnose
    q: { vi: "Truy vấn \"đơn có quà tặng\" trên cột `jsonb` dùng chỉ mục GIN `jsonb_path_ops`. Đọc kế hoạch: chỉ mục có thật sự giúp không? Bạn sẽ hỏi thêm gì trước khi giữ nó?", en: "A \"gift orders\" query on a `jsonb` column uses a GIN `jsonb_path_ops` index. Read the plan: does the index really help? What would you ask before keeping it?" }
    exhibits:
      - label: { vi: "Kế hoạch với GIN", en: "Plan with GIN" }
        source: pglite-0.5.16
        fixture: pg-shop
        setup: "CREATE INDEX ON orders USING gin (attrs jsonb_path_ops); ANALYZE orders;"
        sql: "EXPLAIN (ANALYZE, COSTS OFF, BUFFERS OFF, TIMING OFF, SUMMARY OFF) SELECT count(*) FROM orders WHERE attrs @> '{\"gift\": true}'"
        shown: |-
          Aggregate (actual rows=1.00 loops=1)
            ->  Bitmap Heap Scan on orders (actual rows=400.00 loops=1)
                  Recheck Cond: (attrs @> '{"gift": true}'::jsonb)
                  Heap Blocks: exact=228
                  ->  Bitmap Index Scan on orders_attrs_idx (actual rows=400.00 loops=1)
                        Index Cond: (attrs @> '{"gift": true}'::jsonb)
                        Index Searches: 1
    answer: { vi: "Chỉ mục tìm đúng 400 dòng (2%), nhưng `Heap Blocks: exact=228` = mọi page của bảng: 400 dòng rải đều (mỗi đơn thứ 50), nên vẫn phải đọc cả bảng, cộng thêm việc đọc chỉ mục. Ở đây nó gần như không giúp. Trước khi giữ: dữ liệu thật có gom cụm không, tỉ lệ khớp bao nhiêu, truy vấn có chỉ đếm không (nếu chỉ cần một cờ, cột boolean thật + chỉ mục một phần `WHERE gift` nhỏ và rẻ hơn), và chi phí ghi của GIN (danh sách chờ `fastupdate`, `gin_pending_list_limit`) trên bảng ghi nhiều.", en: "The index finds exactly 400 rows (2%), but `Heap Blocks: exact=228` is every page of the table: the 400 rows are spread evenly (every 50th order), so the whole table is read anyway, plus the index. Here it barely helps. Before keeping it: is real data clustered, what is the match rate, is the query only counting (if one flag is all you need, a real boolean column + a partial index `WHERE gift` is smaller and cheaper), and what does GIN cost on writes (the `fastupdate` pending list, `gin_pending_list_limit`) on a write-heavy table." }
    rubric:
      - { vi: "Nhận ra Heap Blocks = toàn bảng", en: "Spots Heap Blocks = the whole table" }
      - { vi: "Phân biệt độ chọn lọc dòng và độ chọn lọc page", en: "Separates row selectivity from page selectivity" }
      - { vi: "Đề xuất cột thật + chỉ mục một phần hoặc hỏi về chi phí ghi GIN", en: "Proposes a real column + partial index or asks about GIN write cost" }
    doc: https://www.postgresql.org/docs/18/gin.html
  - id: e-iv-pg-staff-11
    engine: postgres
    band: staff
    kind: diagnose
    q: { vi: "Chỉ có chỉ mục `(status, created_at)`, truy vấn chỉ lọc `created_at`. Trên PG18 kế hoạch vẫn dùng chỉ mục. Dòng nào cho thấy cơ chế, và vì sao bạn vẫn có thể muốn một chỉ mục khác?", en: "Only an index on `(status, created_at)` exists, and the query filters only `created_at`. On PG18 the plan still uses the index. Which line shows the mechanism, and why might you still want another index?" }
    exhibits:
      - label: { vi: "Kế hoạch trên PostgreSQL 18.6", en: "Plan on PostgreSQL 18.6" }
        source: pglite-0.5.16
        fixture: pg-shop
        setup: "CREATE INDEX ON orders (status, created_at); ANALYZE orders;"
        sql: "EXPLAIN (ANALYZE, COSTS OFF, BUFFERS OFF, TIMING OFF, SUMMARY OFF) SELECT id FROM orders WHERE created_at = '2026-03-01'"
        shown: |-
          Bitmap Heap Scan on orders (actual rows=70.00 loops=1)
            Recheck Cond: (created_at = '2026-03-01'::date)
            Heap Blocks: exact=2
            ->  Bitmap Index Scan on orders_status_created_at_idx (actual rows=70.00 loops=1)
                  Index Cond: (created_at = '2026-03-01'::date)
                  Index Searches: 5
    answer: { vi: "`Index Searches: 5`: B-tree skip scan (mới ở PG18) đi xuống chỉ mục nhiều lần, một lần cho mỗi giá trị của cột đầu `status` (3 giá trị) cộng vài lần dò, thay vì quét cả chỉ mục. Rẻ vì `status` ít giá trị. Vẫn có thể cần chỉ mục `(created_at)` riêng khi cột đầu có nhiều giá trị (mỗi giá trị là một lần đi xuống), khi truy vấn là khoảng dài hay cần thứ tự theo `created_at`, hoặc khi phải chạy trên phiên bản cũ hơn 18. Chỉ số này cũng là cách theo dõi skip scan trên production.", en: "`Index Searches: 5`: B-tree skip scan (new in PG18) descends the index several times, once per value of the leading `status` column (3 values) plus a few probes, instead of scanning the whole index. Cheap because `status` has few values. A separate `(created_at)` index may still be needed when the leading column has many values (each is a descent), when the query is a long range or needs `created_at` order, or when you must run on versions before 18. This counter is also how you watch skip scan in production." }
    rubric:
      - { vi: "Gọi tên skip scan PG18 từ Index Searches > 1", en: "Names PG18 skip scan from Index Searches > 1" }
      - { vi: "Nối chi phí với số giá trị cột đầu", en: "Ties cost to leading-column cardinality" }
      - { vi: "Nêu khi nào vẫn cần chỉ mục riêng", en: "Says when a dedicated index is still needed" }
    doc: https://www.postgresql.org/docs/18/indexes-multicolumn.html
  - id: e-iv-pg-staff-12
    engine: postgres
    band: staff
    kind: design
    q: { vi: "Ghi vào một Postgres primary đã chạm trần (CPU, WAL) dù đã tối ưu truy vấn. Bạn cân nhắc những hướng mở rộng nào, theo thứ tự nào?", en: "Writes to a single Postgres primary have hit the ceiling (CPU, WAL) even after query tuning. Which scaling paths do you consider, in what order?" }
    answer: { vi: "(1) Giảm việc ghi: bỏ chỉ mục thừa, gom ghi theo lô, HOT bằng fillfactor, chuyển dữ liệu nóng tạm (phiên, bộ đếm) sang chỗ khác, `synchronous_commit = off` cho dữ liệu chấp nhận mất vài trăm ms. (2) Nâng máy (dọc): rẻ nhất về độ phức tạp. (3) Tách theo chức năng: các miền ít JOIN với nhau sang cụm riêng. (4) Shard theo khóa (ví dụ `tenant_id`): ở tầng ứng dụng hoặc bằng extension phân tán; giá phải trả là truy vấn và transaction xuyên shard, đổi khóa shard, vận hành nhiều cụm. Chỉ đi bước sau khi bước trước không đủ, có số đo.", en: "(1) Reduce writes: drop unused indexes, batch writes, HOT via fillfactor, move hot ephemeral data (sessions, counters) elsewhere, `synchronous_commit = off` where losing a few hundred ms is acceptable. (2) Scale up: the cheapest in complexity. (3) Split by function: domains that rarely join move to separate clusters. (4) Shard by key (for example `tenant_id`): in the app or with a distributed extension; the price is cross-shard queries and transactions, resharding, running many clusters. Move to the next step only when the previous one is measured to be insufficient." }
    tradeoffs:
      - { vi: "Mỗi bước sau tăng độ phức tạp vận hành nhiều hơn bước trước.", en: "Each later step adds more operational complexity than the one before." }
      - { vi: "Shard sai khóa thì mọi truy vấn quan trọng thành scatter-gather.", en: "Sharding on the wrong key turns every important query into scatter-gather." }
    rubric:
      - { vi: "Bắt đầu bằng giảm việc ghi, có ví dụ", en: "Starts by reducing writes, with examples" }
      - { vi: "Thứ tự tăng dần độ phức tạp", en: "Ordered by rising complexity" }
      - { vi: "Nêu cái giá của shard", en: "States the cost of sharding" }
    doc: https://www.postgresql.org/docs/18/wal-configuration.html
  - id: e-iv-pg-staff-13
    engine: postgres
    band: staff
    kind: design
    q: { vi: "Dịch vụ đơn hàng phải ghi đơn vào Postgres và phát sự kiện \"đơn đã tạo\" cho hệ khác, không bao giờ mất hoặc phát sự kiện cho đơn không tồn tại. Thiết kế.", en: "The order service must write an order to Postgres and publish an \"order created\" event to other systems, never losing an event or publishing one for an order that does not exist. Design it." }
    answer: { vi: "Transactional outbox: trong cùng transaction với INSERT đơn, chèn một dòng vào bảng `outbox(id, aggregate_id, type, payload jsonb, created_at)`. Một relay đọc outbox (polling với `FOR UPDATE SKIP LOCKED`, hoặc logical decoding/CDC) và đẩy lên broker, rồi đánh dấu/xóa dòng. Kết quả: giao hàng ít nhất một lần, nên người nhận phải idempotent theo `id` sự kiện. Thứ tự theo `aggregate_id` giữ được nếu relay gửi tuần tự theo khóa đó. Tránh \"dual write\" (ghi DB rồi gọi broker) vì có thể thành công một nửa.", en: "Transactional outbox: in the same transaction as the order INSERT, insert a row into `outbox(id, aggregate_id, type, payload jsonb, created_at)`. A relay reads the outbox (polling with `FOR UPDATE SKIP LOCKED`, or logical decoding/CDC), pushes to the broker, then marks/deletes the row. Result: at-least-once delivery, so consumers must be idempotent on the event `id`. Per-`aggregate_id` order holds if the relay sends sequentially per key. Avoid \"dual write\" (write the DB then call the broker) since it can half-succeed." }
    tradeoffs:
      - { vi: "Polling đơn giản nhưng thêm độ trễ và tải; CDC nhanh hơn nhưng cần `wal_level = logical` và quản lý slot.", en: "Polling is simple but adds latency and load; CDC is faster but needs `wal_level = logical` and slot management." }
      - { vi: "Bảng outbox đổi liên tục: cần dọn và vacuum.", en: "The outbox churns: it needs cleanup and vacuum." }
    rubric:
      - { vi: "Outbox trong cùng transaction", en: "Outbox in the same transaction" }
      - { vi: "Ít nhất một lần + người nhận idempotent", en: "At-least-once + idempotent consumers" }
      - { vi: "Giải thích vì sao dual write hỏng", en: "Explains why dual write fails" }
    doc: https://www.postgresql.org/docs/18/logicaldecoding-explanation.html
  - id: e-iv-pg-staff-14
    engine: postgres
    band: staff
    kind: concept
    q: { vi: "Đặt `work_mem = 256MB` toàn cụm có an toàn với 400 kết nối không? Tính trường hợp xấu và đề xuất.", en: "Is `work_mem = 256MB` cluster-wide safe with 400 connections? Work out the bad case and propose something." }
    answer: { vi: "`work_mem` là giới hạn cho **mỗi** nút sort/hash, không phải mỗi kết nối; hash còn được nhân `hash_mem_multiplier` (mặc định 2). Một truy vấn có 3 nút hash = tới 3 × 512MB; 400 kết nối như vậy là hàng trăm GB, máy bị OOM killer giết tiến trình và cả cụm khởi động lại. Đề xuất: mặc định nhỏ (vài MB), tăng theo role hoặc phiên cho báo cáo (`ALTER ROLE reporting SET work_mem = '256MB'`), giới hạn kết nối bằng pooler, theo dõi `temp_files`/`log_temp_files`.", en: "`work_mem` limits **each** sort/hash node, not each connection; hashes are also multiplied by `hash_mem_multiplier` (2 by default). One query with 3 hash nodes = up to 3 × 512MB; 400 such connections is hundreds of GB, the OOM killer kills a backend and the whole cluster restarts. Proposal: a small default (a few MB), raised per role or session for reporting (`ALTER ROLE reporting SET work_mem = '256MB'`), cap connections with a pooler, watch `temp_files`/`log_temp_files`." }
    rubric:
      - { vi: "Biết work_mem là mỗi nút, có hash_mem_multiplier", en: "Knows work_mem is per node, with hash_mem_multiplier" }
      - { vi: "Tính được bậc độ lớn trường hợp xấu", en: "Works out the order of magnitude of the bad case" }
      - { vi: "Đề xuất theo role/phiên + giám sát", en: "Proposes per role/session + monitoring" }
    doc: https://www.postgresql.org/docs/18/runtime-config-resource.html
  - id: e-iv-pg-staff-15
    engine: postgres
    band: staff
    kind: design
    q: { vi: "Sau một lần deploy, p99 của API tăng gấp 5 nhưng không có lỗi. Mô tả cách bạn điều tra phía Postgres và cách ngăn tái diễn.", en: "After a deploy, API p99 rose 5× with no errors. Describe how you investigate the Postgres side and prevent a repeat." }
    answer: { vi: "(1) `pg_stat_statements`: so `total_exec_time`, `mean`, `calls`, `shared_blks_read` trước/sau deploy để tìm truy vấn mới hoặc đổi. (2) Lấy kế hoạch thật: `auto_explain` với `log_min_duration` và `log_analyze` cho truy vấn chậm, hoặc chạy `EXPLAIN (ANALYZE, BUFFERS)` với tham số thật; so ước lượng vs thực tế. (3) Loại các nguyên nhân khác: chờ khóa (`pg_stat_activity.wait_event`, `pg_locks`), autovacuum/checkpoint trùng giờ, số kết nối. (4) Sửa (chỉ mục, viết lại, thống kê) và đo lại. Ngăn tái diễn: chạy EXPLAIN trên dữ liệu giống production trong CI cho truy vấn quan trọng, dashboard pg_stat_statements theo deploy, rollback nhanh.", en: "(1) `pg_stat_statements`: compare `total_exec_time`, `mean`, `calls`, `shared_blks_read` before/after the deploy to find new or changed queries. (2) Get real plans: `auto_explain` with `log_min_duration` and `log_analyze` for slow queries, or `EXPLAIN (ANALYZE, BUFFERS)` with real parameters; compare estimates vs actuals. (3) Rule out other causes: lock waits (`pg_stat_activity.wait_event`, `pg_locks`), autovacuum/checkpoints at the same time, connection counts. (4) Fix (index, rewrite, statistics) and measure again. Prevent: EXPLAIN key queries on production-like data in CI, a pg_stat_statements dashboard annotated with deploys, fast rollback." }
    tradeoffs:
      - { vi: "auto_explain với log_analyze tốn chi phí đo trên mọi truy vấn; dùng ngưỡng và lấy mẫu.", en: "auto_explain with log_analyze adds timing overhead to every query; use a threshold and sampling." }
      - { vi: "Kiểm kế hoạch trong CI cần dữ liệu giống production, khó với dữ liệu nhạy cảm.", en: "Plan checks in CI need production-like data, which is hard with sensitive data." }
    rubric:
      - { vi: "Dùng pg_stat_statements so trước/sau", en: "Uses pg_stat_statements before/after" }
      - { vi: "Lấy kế hoạch thật với tham số thật", en: "Gets real plans with real parameters" }
      - { vi: "Loại trừ khóa và bảo trì nền", en: "Rules out locks and background maintenance" }
      - { vi: "Có biện pháp phòng ngừa cụ thể", en: "Has concrete prevention" }
    doc: https://www.postgresql.org/docs/18/pgstatstatements.html

  # ---------------- MongoDB · junior
  - id: e-iv-mg-junior-01
    engine: mongodb
    band: junior
    kind: concept
    q: { vi: "Một tài liệu MongoDB khác một dòng SQL ở điểm nào? `_id` có gì đặc biệt?", en: "How does a MongoDB document differ from an SQL row? What is special about `_id`?" }
    answer: { vi: "Tài liệu là BSON (JSON nhị phân có thêm kiểu như Date, ObjectId, Decimal128), có thể lồng object và mảng, và hai tài liệu trong một collection không bắt buộc cùng trường. Mọi tài liệu có `_id` duy nhất trong collection, có chỉ mục duy nhất tự động không xóa được; không đưa thì driver tạo một ObjectId. `_id` không đổi được sau khi chèn.", en: "A document is BSON (binary JSON with extra types such as Date, ObjectId, Decimal128), can nest objects and arrays, and two documents in one collection need not share fields. Every document has an `_id` unique within the collection, backed by an automatic unique index that cannot be dropped; if omitted, the driver generates an ObjectId. `_id` cannot be changed after insert." }
    rubric:
      - { vi: "BSON, lồng nhau, schema linh hoạt", en: "BSON, nesting, flexible schema" }
      - { vi: "_id duy nhất, có chỉ mục, tự sinh ObjectId", en: "_id unique, indexed, ObjectId generated" }
      - { vi: "Biết _id bất biến", en: "Knows _id is immutable" }
    doc: https://www.mongodb.com/docs/manual/core/document/
  - id: e-iv-mg-junior-02
    engine: mongodb
    band: junior
    kind: concept
    q: { vi: "Giới hạn kích thước một tài liệu là bao nhiêu và nó ảnh hưởng thiết kế thế nào?", en: "What is the size limit of one document and how does it affect design?" }
    answer: { vi: "16 MiB mỗi tài liệu BSON, tối đa 100 tầng lồng. Hệ quả: không nhúng mảng tăng không giới hạn (bình luận, log) vào một tài liệu; dữ liệu lớn như tệp thì dùng GridFS hoặc kho đối tượng. Nhưng thường vấn đề hiệu năng đến trước giới hạn: tài liệu lớn tốn băng thông và bộ nhớ mỗi lần đọc/ghi.", en: "16 MiB per BSON document, at most 100 levels of nesting. Consequence: never embed arrays that grow without bound (comments, logs) in one document; large blobs such as files go to GridFS or object storage. Performance problems usually come before the limit: big documents cost bandwidth and memory on every read/write." }
    rubric:
      - { vi: "Đúng 16 MiB", en: "Correct 16 MiB" }
      - { vi: "Cảnh báo mảng không giới hạn", en: "Warns about unbounded arrays" }
      - { vi: "Nêu GridFS / kho ngoài và chi phí tài liệu lớn", en: "Mentions GridFS / external storage and the cost of big documents" }
    doc: https://www.mongodb.com/docs/manual/reference/limits/
  - id: e-iv-mg-junior-03
    engine: mongodb
    band: junior
    kind: concept
    q: { vi: "`{ phone: null }`, `{ phone: { $exists: false } }` và `{ phone: { $type: 'null' } }` khớp những tài liệu nào?", en: "Which documents do `{ phone: null }`, `{ phone: { $exists: false } }` and `{ phone: { $type: 'null' } }` match?" }
    answer: { vi: "`{ phone: null }` khớp cả tài liệu có `phone` bằng null **và** tài liệu không có trường `phone`. `$exists: false` chỉ khớp tài liệu thiếu trường. `$type: 'null'` chỉ khớp tài liệu có trường mang giá trị null. Bẫy hay gặp: đếm \"chưa có số điện thoại\" bằng `null` gộp hai trường hợp mà người hỏi có thể muốn tách.", en: "`{ phone: null }` matches documents where `phone` is null **and** documents without a `phone` field. `$exists: false` matches only missing fields. `$type: 'null'` matches only fields holding null. Common trap: counting \"no phone yet\" with `null` merges two cases the asker may want separately." }
    rubric:
      - { vi: "Đúng cả ba", en: "All three right" }
      - { vi: "Nêu bẫy gộp hai trường hợp", en: "States the merged-cases trap" }
      - { vi: "Ví dụ cụ thể", en: "Gives a concrete example" }
    doc: https://www.mongodb.com/docs/manual/tutorial/query-for-null-fields/
  - id: e-iv-mg-junior-04
    engine: mongodb
    band: junior
    kind: concept
    q: { vi: "Đồng nghiệp viết `db.users.replaceOne({ _id: id }, { email: 'a@b.vn' })` để đổi email, và mọi trường khác biến mất. Vì sao, và nên viết gì?", en: "A colleague wrote `db.users.replaceOne({ _id: id }, { email: 'a@b.vn' })` to change an email and every other field vanished. Why, and what should it be?" }
    answer: { vi: "`replaceOne` thay **cả** tài liệu bằng tài liệu mới (chỉ giữ `_id`). Muốn sửa một trường thì dùng toán tử cập nhật: `db.users.updateOne({ _id: id }, { $set: { email: 'a@b.vn' } })`. `updateOne` với tài liệu không có toán tử sẽ báo lỗi, nên an toàn hơn. Các toán tử khác: `$inc`, `$unset`, `$push`, `$addToSet`, `$pull`.", en: "`replaceOne` replaces the **whole** document with the new one (keeping only `_id`). To change one field use an update operator: `db.users.updateOne({ _id: id }, { $set: { email: 'a@b.vn' } })`. `updateOne` with an operator-free document raises an error, so it is safer. Other operators: `$inc`, `$unset`, `$push`, `$addToSet`, `$pull`." }
    rubric:
      - { vi: "Giải thích replace thay cả tài liệu", en: "Explains replace swaps the whole document" }
      - { vi: "Đưa câu $set đúng", en: "Gives the correct $set" }
      - { vi: "Kể thêm toán tử cập nhật", en: "Names more update operators" }
    doc: https://www.mongodb.com/docs/manual/reference/method/db.collection.updateone/
  - id: e-iv-mg-junior-05
    engine: mongodb
    band: junior
    kind: concept
    q: { vi: "Tài liệu có `items: [{ sku: 'A', qty: 1 }, { sku: 'B', qty: 5 }]`. Vì sao `{ 'items.sku': 'A', 'items.qty': { $gte: 5 } }` khớp nó, và viết sao cho đúng ý \"có món A với số lượng ≥ 5\"?", en: "A document has `items: [{ sku: 'A', qty: 1 }, { sku: 'B', qty: 5 }]`. Why does `{ 'items.sku': 'A', 'items.qty': { $gte: 5 } }` match it, and how do you express \"has item A with quantity ≥ 5\"?" }
    answer: { vi: "Mỗi điều kiện trên đường dẫn mảng được thỏa bởi **bất kỳ** phần tử nào, không nhất thiết cùng một phần tử: `sku: 'A'` ở phần tử đầu, `qty ≥ 5` ở phần tử thứ hai. Muốn mọi điều kiện trên cùng một phần tử thì dùng `$elemMatch`: `{ items: { $elemMatch: { sku: 'A', qty: { $gte: 5 } } } }`.", en: "Each condition on an array path is satisfied by **any** element, not necessarily the same one: `sku: 'A'` by the first, `qty ≥ 5` by the second. To require every condition on one element use `$elemMatch`: `{ items: { $elemMatch: { sku: 'A', qty: { $gte: 5 } } } }`." }
    rubric:
      - { vi: "Giải thích \"bất kỳ phần tử\"", en: "Explains \"any element\"" }
      - { vi: "Viết đúng $elemMatch", en: "Writes $elemMatch correctly" }
      - { vi: "Biết đây là bẫy dữ liệu sai lặng lẽ", en: "Knows this is a silent wrong-data trap" }
    doc: https://www.mongodb.com/docs/manual/reference/operator/query/elemmatch/
  - id: e-iv-mg-junior-06
    engine: mongodb
    band: junior
    kind: concept
    q: { vi: "Upsert là gì? Khi upsert theo email từ hai request song song, làm sao không tạo hai tài liệu?", en: "What is an upsert? When upserting by email from two parallel requests, how do you avoid two documents?" }
    answer: { vi: "`updateOne(filter, update, { upsert: true })` cập nhật tài liệu khớp, hoặc chèn mới nếu không có (tài liệu mới lấy các trường bằng từ filter cộng `$set`/`$setOnInsert`). Hai upsert song song có thể cùng không thấy gì và cùng chèn; chỉ một chỉ mục duy nhất trên `email` chặn được: một bên lỗi trùng khóa và có thể thử lại thành cập nhật.", en: "`updateOne(filter, update, { upsert: true })` updates the matching document, or inserts one if none exists (the new document takes equality fields from the filter plus `$set`/`$setOnInsert`). Two parallel upserts can both find nothing and both insert; only a unique index on `email` prevents it: one side gets a duplicate key error and can retry as an update." }
    rubric:
      - { vi: "Định nghĩa upsert và $setOnInsert", en: "Defines upsert and $setOnInsert" }
      - { vi: "Thấy được tranh chấp", en: "Sees the race" }
      - { vi: "Chỉ mục duy nhất + retry", en: "Unique index + retry" }
    doc: https://www.mongodb.com/docs/manual/reference/method/db.collection.updateone/
  - id: e-iv-mg-junior-07
    engine: mongodb
    band: junior
    kind: concept
    q: { vi: "Thao tác nào trong MongoDB là nguyên tử mà không cần transaction?", en: "Which MongoDB operations are atomic without a transaction?" }
    answer: { vi: "Mọi thao tác ghi trên **một** tài liệu là nguyên tử, kể cả khi sửa nhiều trường và mảng lồng bên trong. Một `updateMany` thì nguyên tử theo từng tài liệu, không nguyên tử cho cả tập. Vì vậy dữ liệu cần đổi cùng nhau nên nằm trong một tài liệu khi hợp lý; còn lại mới cần transaction nhiều tài liệu.", en: "Every write to a **single** document is atomic, even when it changes several fields and nested arrays. An `updateMany` is atomic per document, not for the whole set. So data that must change together should live in one document when sensible; only the rest needs a multi-document transaction." }
    rubric:
      - { vi: "Nguyên tử ở mức một tài liệu", en: "Atomic at the single-document level" }
      - { vi: "updateMany không nguyên tử cho cả tập", en: "updateMany is not atomic as a whole" }
      - { vi: "Hệ quả cho thiết kế", en: "The design consequence" }
    doc: https://www.mongodb.com/docs/manual/core/write-operations-atomicity/
  - id: e-iv-mg-junior-08
    engine: mongodb
    band: junior
    kind: concept
    q: { vi: "`countDocuments()` và `estimatedDocumentCount()` khác nhau thế nào?", en: "How do `countDocuments()` and `estimatedDocumentCount()` differ?" }
    answer: { vi: "`countDocuments(filter)` đếm thật theo bộ lọc (chạy như một aggregation), đúng nhưng tốn công với tập lớn; nên có chỉ mục hỗ trợ bộ lọc. `estimatedDocumentCount()` đọc số đếm trong metadata của collection: rất nhanh, không nhận bộ lọc, và có thể lệch sau tắt máy không sạch hoặc với tài liệu mồ côi trong cụm shard.", en: "`countDocuments(filter)` really counts with a filter (runs as an aggregation): correct but costly on large sets; give the filter an index. `estimatedDocumentCount()` reads the collection metadata count: very fast, takes no filter, and can be off after an unclean shutdown or with orphaned documents in a sharded cluster." }
    rubric:
      - { vi: "Đếm thật vs metadata", en: "Real count vs metadata" }
      - { vi: "Biết estimated không nhận filter", en: "Knows estimated takes no filter" }
      - { vi: "Nêu khi nào có thể lệch", en: "States when it can be wrong" }
    doc: https://www.mongodb.com/docs/manual/reference/method/db.collection.countdocuments/
  - id: e-iv-mg-junior-09
    engine: mongodb
    band: junior
    kind: concept
    q: { vi: "Nhúng (embed) hay tham chiếu (reference)? Cho luật ngón tay cái và một ví dụ mỗi bên.", en: "Embed or reference? Give a rule of thumb and one example of each." }
    answer: { vi: "Nhúng khi dữ liệu được đọc cùng nhau, thuộc về cha, và số lượng có giới hạn: địa chỉ giao hàng trong đơn, các dòng hàng trong một đơn. Tham chiếu khi dữ liệu dùng chung bởi nhiều cha, đổi độc lập, hoặc tăng không giới hạn: sản phẩm (đơn chỉ giữ `product_id` và bản chụp giá/tên), bình luận của một bài viết nổi tiếng. Thiết kế theo cách ứng dụng đọc, không theo bảng chuẩn hóa.", en: "Embed when data is read together, belongs to the parent, and is bounded: the shipping address in an order, the lines of an order. Reference when data is shared by many parents, changes independently, or grows without bound: products (the order keeps `product_id` plus a snapshot of price/name), comments on a popular post. Design for how the app reads, not for normalised tables." }
    rubric:
      - { vi: "Luật: đọc cùng + có giới hạn → nhúng", en: "Rule: read together + bounded → embed" }
      - { vi: "Ví dụ đúng mỗi bên", en: "A correct example each way" }
      - { vi: "Nhắc bản chụp dữ liệu hoặc thiết kế theo truy cập", en: "Mentions snapshots or access-driven design" }
    doc: https://www.mongodb.com/docs/manual/data-modeling/
  - id: e-iv-mg-junior-10
    engine: mongodb
    band: junior
    kind: concept
    q: { vi: "Phân trang bằng `.skip(n).limit(20)` có vấn đề gì khi `n` lớn? Cách khác?", en: "What goes wrong with `.skip(n).limit(20)` pagination when `n` is large? Alternative?" }
    answer: { vi: "Server vẫn phải đi qua `n` tài liệu (hoặc khóa chỉ mục) rồi bỏ đi, nên trang càng sâu càng chậm; và khi có chèn/xóa giữa hai lần gọi, trang có thể lặp hoặc sót. Cách khác: phân trang theo khóa, nhớ giá trị cuối của trang trước và lọc `{ created: { $lt: last } }` với sort trên trường có chỉ mục (thêm `_id` để phá hòa).", en: "The server still walks `n` documents (or index keys) and discards them, so deeper pages get slower; and inserts/deletes between calls can repeat or skip items. Alternative: range-based paging, remember the last value of the previous page and filter `{ created: { $lt: last } }` with a sort on an indexed field (add `_id` as a tiebreaker)." }
    rubric:
      - { vi: "Skip vẫn duyệt n mục", en: "Skip still walks n items" }
      - { vi: "Nêu lặp/sót khi dữ liệu đổi", en: "Mentions repeats/gaps when data changes" }
      - { vi: "Phân trang theo khóa có phá hòa", en: "Range paging with a tiebreaker" }
    doc: https://www.mongodb.com/docs/manual/reference/method/cursor.skip/
  - id: e-iv-mg-junior-11
    engine: mongodb
    band: junior
    kind: diagnose
    q: { vi: "Đọc kết quả explain của truy vấn phim từ năm 2000 đến 2005. Vấn đề là gì và bạn làm gì?", en: "Read the explain output for a query on films from 2000 to 2005. What is the problem and what do you do?" }
    exhibits:
      - label: { vi: "db.movies.find({ year: { $gte: 2000, $lte: 2005 } }).explain('executionStats')", en: "db.movies.find({ year: { $gte: 2000, $lte: 2005 } }).explain('executionStats')" }
        source: mongodb-docs
        url: https://www.mongodb.com/docs/manual/tutorial/analyze-query-plan/
        shown: |-
          {
            queryPlanner: {
              namespace: 'sample_mflix.movies',
              winningPlan: { stage: 'COLLSCAN', '...': '...' },
              '...': '...'
            },
            executionStats: {
              executionSuccess: true,
              nReturned: 3809,
              totalKeysExamined: 0,
              totalDocsExamined: 21349,
              executionStages: { stage: 'COLLSCAN', '...': '...' },
              '...': '...'
            },
            '...': '...'
          }
    answer: { vi: "`COLLSCAN` và `totalKeysExamined: 0`: không dùng chỉ mục nào, đọc cả 21.349 tài liệu để trả 3.809 (khoảng 5,6 tài liệu đọc cho mỗi tài liệu trả về). Tạo `db.movies.createIndex({ year: 1 })` rồi chạy lại explain: kỳ vọng `IXSCAN` dưới `FETCH` và cả ba số `nReturned`, `totalKeysExamined`, `totalDocsExamined` gần bằng nhau (3.809).", en: "`COLLSCAN` and `totalKeysExamined: 0`: no index used, all 21,349 documents read to return 3,809 (about 5.6 documents read per document returned). Create `db.movies.createIndex({ year: 1 })` and rerun explain: expect `IXSCAN` under `FETCH` with `nReturned`, `totalKeysExamined` and `totalDocsExamined` all close (3,809)." }
    rubric:
      - { vi: "Đọc COLLSCAN và tỉ lệ docs đọc/trả", en: "Reads COLLSCAN and the examined/returned ratio" }
      - { vi: "Đề xuất chỉ mục year", en: "Proposes an index on year" }
      - { vi: "Nói kết quả mong đợi sau khi sửa", en: "States the expected result after the fix" }
    doc: https://www.mongodb.com/docs/manual/reference/explain-results/
  - id: e-iv-mg-junior-12
    engine: mongodb
    band: junior
    kind: diagnose
    q: { vi: "Sau khi tạo chỉ mục `{ year: 1 }`, explain cho ra kết quả dưới đây. Đây có phải truy vấn \"phủ\" (covered) không? Vì sao vẫn có `FETCH`?", en: "After creating the `{ year: 1 }` index, explain gives the output below. Is this a covered query? Why is there still a `FETCH`?" }
    exhibits:
      - label: { vi: "Cùng truy vấn, có chỉ mục year", en: "Same query, with the year index" }
        source: mongodb-docs
        url: https://www.mongodb.com/docs/manual/tutorial/analyze-query-plan/
        shown: |-
          {
            queryPlanner: {
              namespace: 'sample_mflix.movies',
              winningPlan: {
                stage: 'FETCH',
                inputStage: { stage: 'IXSCAN', keyPattern: { year: 1 }, '...': '...' },
                '...': '...'
              },
              '...': '...'
            },
            executionStats: {
              executionSuccess: true,
              nReturned: 3809,
              totalKeysExamined: 3809,
              totalDocsExamined: 3809,
              '...': '...'
            },
            '...': '...'
          }
    answer: { vi: "Không phủ: `IXSCAN` nằm dưới `FETCH`, và `totalDocsExamined: 3809` nghĩa là mỗi khóa tìm được dẫn tới một lần đọc tài liệu. Có `FETCH` vì truy vấn trả cả tài liệu (không projection). Truy vấn này vẫn hiệu quả: khóa đọc = tài liệu đọc = tài liệu trả. Muốn phủ thì projection chỉ lấy trường trong chỉ mục và bỏ `_id`: `find({ year: … }, { _id: 0, year: 1 })`.", en: "Not covered: `IXSCAN` sits under `FETCH`, and `totalDocsExamined: 3809` means every key found leads to a document read. The `FETCH` is there because the query returns whole documents (no projection). The query is still efficient: keys examined = documents examined = documents returned. To cover it, project only indexed fields and drop `_id`: `find({ year: … }, { _id: 0, year: 1 })`." }
    rubric:
      - { vi: "Biết covered = IXSCAN không dưới FETCH", en: "Knows covered = IXSCAN not under FETCH" }
      - { vi: "Đọc ba số bằng nhau là hiệu quả", en: "Reads the three equal counts as efficient" }
      - { vi: "Biết bỏ _id trong projection để phủ", en: "Knows to exclude _id in the projection to cover" }
    doc: https://www.mongodb.com/docs/manual/reference/explain-results/
  - id: e-iv-mg-junior-13
    engine: mongodb
    band: junior
    kind: diagnose
    q: { vi: "Có chỉ mục `{ city: 1 }` nhưng truy vấn khách theo thành phố vẫn quét cả collection. Đọc đoạn minh họa và tìm lỗi.", en: "There is an index on `{ city: 1 }` but the customers-by-city query still scans the collection. Read the illustration and find the bug." }
    exhibits:
      - label: { vi: "db.customers.find({ 'address.city': 'Hue' }).explain('executionStats')", en: "db.customers.find({ 'address.city': 'Hue' }).explain('executionStats')" }
        source: illustrative
        shown: |-
          {
            queryPlanner: {
              winningPlan: { stage: 'COLLSCAN', filter: { 'address.city': { '$eq': 'Hue' } } },
              rejectedPlans: []
            },
            executionStats: { nReturned: 412, totalKeysExamined: 0, totalDocsExamined: 50000 }
          }
    answer: { vi: "Chỉ mục nằm trên trường `city` ở gốc, còn dữ liệu (và truy vấn) dùng trường lồng `address.city`: hai đường dẫn khác nhau, nên không có kế hoạch nào dùng chỉ mục (`rejectedPlans: []`). Sửa: `createIndex({ 'address.city': 1 })` và xóa chỉ mục vô dụng (nó vẫn tốn công khi ghi). Kiểm bằng `getIndexes()` trước khi đoán.", en: "The index is on a top-level `city` field, while the data (and the query) use the nested `address.city`: different paths, so no plan can use the index (`rejectedPlans: []`). Fix: `createIndex({ 'address.city': 1 })` and drop the useless index (it still costs on writes). Check `getIndexes()` before guessing." }
    rubric:
      - { vi: "Nhận ra sai đường dẫn trường", en: "Spots the field-path mismatch" }
      - { vi: "Đọc rejectedPlans rỗng", en: "Reads the empty rejectedPlans" }
      - { vi: "Tạo đúng chỉ mục, bỏ chỉ mục thừa", en: "Creates the right index, drops the useless one" }
    doc: https://www.mongodb.com/docs/manual/reference/explain-results/
  - id: e-iv-mg-junior-14
    engine: mongodb
    band: junior
    kind: concept
    q: { vi: "ObjectId chứa gì? Có thể sắp xếp theo `_id` để có thứ tự tạo chính xác không?", en: "What does an ObjectId contain? Can sorting by `_id` give the exact creation order?" }
    answer: { vi: "12 byte: 4 byte thời gian (giây, Unix), 5 byte ngẫu nhiên theo tiến trình, 3 byte bộ đếm. Sắp theo `_id` cho thứ tự gần đúng theo giây, nhưng trong cùng một giây giữa nhiều máy/tiến trình thì không bảo đảm, và đồng hồ máy khách có thể lệch. Cần thứ tự chính xác thì lưu trường thời gian riêng (và một khóa phá hòa).", en: "12 bytes: a 4-byte timestamp (Unix seconds), 5 random bytes per process, a 3-byte counter. Sorting by `_id` gives roughly second-level order, but within the same second across machines/processes it is not guaranteed, and client clocks can drift. For exact ordering store a separate time field (and a tiebreaker)." }
    rubric:
      - { vi: "Cấu trúc 4 + 5 + 3 byte", en: "The 4 + 5 + 3 byte layout" }
      - { vi: "Chỉ đơn điệu gần đúng", en: "Only roughly monotonic" }
      - { vi: "Đề xuất trường thời gian riêng", en: "Suggests a separate time field" }
    doc: https://www.mongodb.com/docs/manual/reference/bson-types/
  - id: e-iv-mg-junior-15
    engine: mongodb
    band: junior
    kind: design
    q: { vi: "Thiết kế collection cho blog: bài viết, tác giả, bình luận. Một số bài có hàng chục nghìn bình luận.", en: "Design collections for a blog: posts, authors, comments. Some posts get tens of thousands of comments." }
    answer: { vi: "`authors` riêng (dùng chung cho nhiều bài). `posts` giữ `author_id` cùng bản chụp `author_name` để hiện danh sách không cần `$lookup`, cộng `comment_count` và vài bình luận mới nhất nhúng sẵn (`recent_comments`, giới hạn 3–5 bằng `$push` với `$slice`). `comments` là collection riêng `{ post_id, created_at, author_id, text }` với chỉ mục `{ post_id: 1, created_at: -1 }` để phân trang. Không nhúng toàn bộ bình luận: mảng không giới hạn, tiến tới 16 MiB và làm mọi lần đọc bài nặng.", en: "Separate `authors` (shared by many posts). `posts` keeps `author_id` plus an `author_name` snapshot so lists need no `$lookup`, plus `comment_count` and a few newest comments embedded (`recent_comments`, capped at 3–5 with `$push` and `$slice`). `comments` is its own collection `{ post_id, created_at, author_id, text }` with an index on `{ post_id: 1, created_at: -1 }` for paging. Do not embed all comments: unbounded array, heading to 16 MiB and making every post read heavy." }
    tradeoffs:
      - { vi: "Bản chụp tên tác giả nhanh khi đọc nhưng phải cập nhật lan khi tác giả đổi tên (hoặc chấp nhận cũ).", en: "The author-name snapshot is fast to read but must be propagated on rename (or accepted as stale)." }
      - { vi: "Bình luận gần nhất nhúng là dữ liệu trùng: mỗi bình luận mới ghi hai chỗ.", en: "Embedded recent comments duplicate data: every new comment writes two places." }
    rubric:
      - { vi: "Bình luận tách collection có chỉ mục phân trang", en: "Comments in their own collection with a paging index" }
      - { vi: "Dùng mẫu subset (vài bình luận mới nhúng)", en: "Uses the subset pattern (a few recent comments embedded)" }
      - { vi: "Nêu chi phí của dữ liệu trùng", en: "States the cost of duplication" }
    doc: https://www.mongodb.com/docs/manual/data-modeling/design-patterns/

  # ---------------- MongoDB · mid
  - id: e-iv-mg-mid-01
    engine: mongodb
    band: mid
    kind: concept
    q: { vi: "Trong aggregation pipeline, vì sao đặt `$match` sớm quan trọng? Những stage đầu nào dùng được chỉ mục?", en: "In an aggregation pipeline, why does putting `$match` early matter? Which leading stages can use an index?" }
    answer: { vi: "`$match` (và `$sort`) ở **đầu** pipeline được đẩy xuống tầng truy vấn nên dùng được chỉ mục, và giảm số tài liệu mọi stage sau phải xử lý. Sau `$group`, `$unwind` hay `$project` tạo trường mới thì không còn chỉ mục. Bộ tối ưu tự dời một số `$match` lên trước khi an toàn (ví dụ qua `$sort`, hoặc phần lọc không dựa vào trường vừa tạo), nhưng đừng trông vào đó: viết `$match` ngay đầu và kiểm bằng `explain`.", en: "A `$match` (and `$sort`) at the **start** of the pipeline is pushed into the query layer so it can use an index, and it shrinks the documents every later stage handles. After `$group`, `$unwind` or a `$project` creating new fields, indexes are no longer usable. The optimizer moves some `$match` stages earlier when safe (for example past a `$sort`, or the parts not depending on computed fields), but do not rely on it: put `$match` first and check with `explain`." }
    rubric:
      - { vi: "Chỉ stage đầu dùng được chỉ mục", en: "Only leading stages can use indexes" }
      - { vi: "Giảm khối lượng cho stage sau", en: "Reduces work for later stages" }
      - { vi: "Biết bộ tối ưu tự dời nhưng vẫn kiểm explain", en: "Knows the optimizer reorders but still checks explain" }
    doc: https://www.mongodb.com/docs/manual/core/aggregation-pipeline-optimization/
  - id: e-iv-mg-mid-02
    engine: mongodb
    band: mid
    kind: concept
    q: { vi: "`$lookup` từ `orders` sang `customers` chậm khi `orders` lớn. Kiểm tra gì trước?", en: "A `$lookup` from `orders` to `customers` is slow when `orders` is large. What do you check first?" }
    answer: { vi: "(1) Trường `foreignField` ở collection đích có chỉ mục chưa (với `customers` là `_id` thì có sẵn; nếu là trường khác thì phải tạo). (2) `$match` lọc `orders` trước `$lookup` để ít lần tra hơn. (3) Chỉ lấy trường cần thiết ở bên đích (pipeline con với `$project`). (4) Nếu luôn cần tên khách khi đọc đơn, cân nhắc nhúng bản chụp tên vào đơn để bỏ `$lookup`.", en: "(1) Whether the target's `foreignField` is indexed (for `customers` on `_id` it is; any other field needs an index). (2) A `$match` filtering `orders` before the `$lookup` so there are fewer lookups. (3) Fetch only needed fields from the target (a sub-pipeline with `$project`). (4) If orders always need the customer name, consider embedding a name snapshot in the order and dropping the `$lookup`." }
    rubric:
      - { vi: "Chỉ mục trên foreignField", en: "Index on foreignField" }
      - { vi: "Lọc trước lookup", en: "Filter before the lookup" }
      - { vi: "Giảm trường hoặc cân nhắc nhúng", en: "Trim fields or consider embedding" }
    doc: https://www.mongodb.com/docs/manual/reference/operator/aggregation/lookup/
  - id: e-iv-mg-mid-03
    engine: mongodb
    band: mid
    kind: concept
    q: { vi: "Phát biểu luật ESR và áp dụng cho `find({ status: 'A', qty: { $gt: 10 } }).sort({ created: -1 })`.", en: "State the ESR rule and apply it to `find({ status: 'A', qty: { $gt: 10 } }).sort({ created: -1 })`." }
    answer: { vi: "Equality → Sort → Range: trường so bằng trước, rồi trường sắp xếp, cuối cùng trường khoảng. Chỉ mục: `{ status: 1, created: -1, qty: 1 }`. Với `status` cố định, khóa đã theo thứ tự `created`, nên không cần `SORT` trong bộ nhớ; `qty` được lọc trong lúc quét khóa. Nếu đặt `qty` trước `created`, khoảng trên `qty` làm mất thứ tự sắp xếp và phải sort trong bộ nhớ. Lưu ý `$ne`, `$nin`, `$regex` cũng tính là khoảng.", en: "Equality → Sort → Range: equality fields first, then sort fields, then range fields. Index: `{ status: 1, created: -1, qty: 1 }`. With `status` fixed the keys are already in `created` order, so no in-memory `SORT`; `qty` is filtered while scanning keys. Putting `qty` before `created` means the range on `qty` breaks the sort order and forces an in-memory sort. Note `$ne`, `$nin`, `$regex` count as ranges too." }
    rubric:
      - { vi: "Phát biểu đúng ESR", en: "States ESR correctly" }
      - { vi: "Đưa đúng chỉ mục", en: "Gives the right index" }
      - { vi: "Giải thích vì sao khoảng trước sort gây SORT", en: "Explains why range-before-sort causes SORT" }
    doc: https://www.mongodb.com/docs/manual/tutorial/equality-sort-range-guideline/
  - id: e-iv-mg-mid-04
    engine: mongodb
    band: mid
    kind: concept
    q: { vi: "Chỉ mục multikey là gì? Vì sao không tạo được chỉ mục ghép `{ tags: 1, sizes: 1 }` khi cả hai là mảng?", en: "What is a multikey index? Why can you not build a compound `{ tags: 1, sizes: 1 }` index when both are arrays?" }
    answer: { vi: "Khi trường được đánh chỉ mục là mảng, MongoDB tạo một khóa cho mỗi phần tử: đó là multikey, tự động. Một chỉ mục ghép chỉ cho phép tối đa **một** trường mảng trong mỗi tài liệu, vì hai mảng sẽ cho tích Descartes số khóa (m × n mỗi tài liệu). Chèn tài liệu có cả hai trường là mảng vào collection có chỉ mục đó sẽ bị từ chối. Multikey cũng hạn chế truy vấn phủ.", en: "When an indexed field is an array, MongoDB creates one key per element: that is a multikey index, automatically. A compound index allows at most **one** array field per document, because two arrays would produce a Cartesian product of keys (m × n per document). Inserting a document where both fields are arrays into a collection with that index is rejected. Multikey also limits covered queries." }
    rubric:
      - { vi: "Một khóa mỗi phần tử", en: "One key per element" }
      - { vi: "Luật một mảng mỗi tài liệu và lý do tích Descartes", en: "One-array-per-document rule and the Cartesian reason" }
      - { vi: "Biết ảnh hưởng tới truy vấn phủ", en: "Knows the effect on covered queries" }
    doc: https://www.mongodb.com/docs/manual/core/indexes/index-types/index-multikey/
  - id: e-iv-mg-mid-05
    engine: mongodb
    band: mid
    kind: concept
    q: { vi: "Chỉ mục một phần (partial) và chỉ mục thưa (sparse) khác nhau thế nào? Làm sao để email duy nhất nhưng cho phép nhiều tài liệu không có email?", en: "How do partial and sparse indexes differ? How do you make email unique while allowing many documents without one?" }
    answer: { vi: "Sparse bỏ qua tài liệu thiếu trường được đánh chỉ mục. Partial dùng `partialFilterExpression` bất kỳ (tập con toán tử như `$exists`, `$gt`, `$eq`, `$type`), linh hoạt hơn và được khuyên dùng thay sparse. Truy vấn phải chứa điều kiện bao hàm bộ lọc thì planner mới dùng. Email duy nhất có thể vắng: `createIndex({ email: 1 }, { unique: true, partialFilterExpression: { email: { $exists: true } } })`; ràng buộc duy nhất chỉ áp lên tài liệu nằm trong chỉ mục.", en: "Sparse skips documents missing the indexed field. Partial uses any `partialFilterExpression` (a subset of operators such as `$exists`, `$gt`, `$eq`, `$type`), is more flexible and recommended over sparse. The query's condition must imply the filter (be a subset of it) for the planner to use the index. Unique optional email: `createIndex({ email: 1 }, { unique: true, partialFilterExpression: { email: { $exists: true } } })`; uniqueness applies only to documents in the index." }
    rubric:
      - { vi: "Phân biệt sparse/partial", en: "Distinguishes sparse/partial" }
      - { vi: "Truy vấn phải khớp bộ lọc", en: "Query must match the filter" }
      - { vi: "Câu unique + partial đúng", en: "Correct unique + partial index" }
    doc: https://www.mongodb.com/docs/manual/core/index-partial/
  - id: e-iv-mg-mid-06
    engine: mongodb
    band: mid
    kind: concept
    q: { vi: "Dùng TTL index để xóa phiên đăng nhập sau 30 phút. Viết lệnh và nêu các giới hạn.", en: "Use a TTL index to delete login sessions after 30 minutes. Write the command and state the limits." }
    answer: { vi: "`db.sessions.createIndex({ lastSeen: 1 }, { expireAfterSeconds: 1800 })`. Trường phải là Date (hoặc mảng Date: dùng giá trị sớm nhất); tài liệu không có trường đó không bao giờ bị xóa. Luồng nền chạy khoảng 60 giây một lần, nên tài liệu có thể sống quá hạn một lúc: ứng dụng vẫn phải kiểm hạn khi đọc. TTL chỉ cho chỉ mục một trường, không dùng trên `_id`.", en: "`db.sessions.createIndex({ lastSeen: 1 }, { expireAfterSeconds: 1800 })`. The field must be a Date (or an array of Dates: the earliest counts); documents without it never expire. The background task runs about every 60 seconds, so documents can outlive their expiry a while: the app must still check expiry on read. TTL works only on single-field indexes, not on `_id`." }
    rubric:
      - { vi: "Lệnh đúng với expireAfterSeconds", en: "Correct command with expireAfterSeconds" }
      - { vi: "Biết luồng 60 s và xóa trễ", en: "Knows the 60 s task and late deletion" }
      - { vi: "Kể giới hạn kiểu Date / một trường", en: "Names the Date / single-field limits" }
    doc: https://www.mongodb.com/docs/manual/core/index-ttl/
  - id: e-iv-mg-mid-07
    engine: mongodb
    band: mid
    kind: concept
    q: { vi: "Collection đã có dữ liệu bẩn. Bạn thêm `$jsonSchema` validation thế nào mà không làm hỏng ghi hiện có?", en: "A collection already holds dirty data. How do you add `$jsonSchema` validation without breaking existing writes?" }
    answer: { vi: "Dùng `collMod` với `validator: { $jsonSchema: … }`. Bắt đầu bằng `validationAction: 'warn'` (ghi log, không chặn) và `validationLevel: 'moderate'` (chỉ kiểm khi chèn mới và khi sửa tài liệu vốn đã hợp lệ). Tìm tài liệu sai bằng `find({ $nor: [ { $jsonSchema: … } ] })`, sửa dần, rồi chuyển sang `error` và `strict`. Mặc định là `error` + `strict`.", en: "Use `collMod` with `validator: { $jsonSchema: … }`. Start with `validationAction: 'warn'` (log, do not block) and `validationLevel: 'moderate'` (check inserts and updates to documents that were already valid). Find bad documents with `find({ $nor: [ { $jsonSchema: … } ] })`, fix them gradually, then switch to `error` and `strict`. The defaults are `error` + `strict`." }
    rubric:
      - { vi: "Dùng collMod + $jsonSchema", en: "collMod + $jsonSchema" }
      - { vi: "warn/moderate trước, rồi error/strict", en: "warn/moderate first, then error/strict" }
      - { vi: "Cách tìm tài liệu không hợp lệ", en: "How to find invalid documents" }
    doc: https://www.mongodb.com/docs/manual/core/schema-validation/
  - id: e-iv-mg-mid-08
    engine: mongodb
    band: mid
    kind: concept
    q: { vi: "Ứng dụng ghi với `w: 1` và đọc từ secondary. Người dùng lưu hồ sơ rồi tải lại trang và thấy dữ liệu cũ. Giải thích và sửa.", en: "The app writes with `w: 1` and reads from secondaries. A user saves a profile, reloads, and sees old data. Explain and fix." }
    answer: { vi: "Đọc từ secondary có độ trễ nhân bản: lần đọc tới trước khi thay đổi đến nơi. Thêm nữa, `w: 1` chỉ chờ primary, nên nếu primary sập trước khi nhân bản, thay đổi có thể bị rollback. Sửa: đọc ngay sau khi ghi từ primary (read preference `primary` cho luồng đó), hoặc dùng causal consistency session với `readConcern: 'majority'` + `writeConcern: { w: 'majority' }`; mặc định ngầm từ 5.0 là `w: 'majority'` trong đa số cấu hình.", en: "Secondary reads lag replication: the read arrived before the change did. Also `w: 1` only waits for the primary, so if it crashes before replicating, the change can be rolled back. Fix: read-your-writes from the primary (read preference `primary` for that flow), or a causally consistent session with `readConcern: 'majority'` + `writeConcern: { w: 'majority' }`; since 5.0 the implicit default is `w: 'majority'` in most deployments." }
    rubric:
      - { vi: "Độ trễ nhân bản của secondary", en: "Secondary replication lag" }
      - { vi: "Rủi ro rollback với w:1", en: "Rollback risk with w:1" }
      - { vi: "Sửa bằng primary hoặc causal session + majority", en: "Fix via primary or causal session + majority" }
    doc: https://www.mongodb.com/docs/manual/core/causal-consistency-read-write-concerns/
  - id: e-iv-mg-mid-09
    engine: mongodb
    band: mid
    kind: diagnose
    q: { vi: "Hai chỉ mục ghép được thử bằng `hint` cho truy vấn phim năm 2000–2005, xếp hạng `PG` (235 kết quả). Chỉ mục nào tốt hơn, vì sao, và luật nào giải thích?", en: "Two compound indexes are tried with `hint` for films from 2000–2005 rated `PG` (235 results). Which is better, why, and which rule explains it?" }
    exhibits:
      - label: { vi: "hint({ year: 1, rated: 1 })", en: "hint({ year: 1, rated: 1 })" }
        source: mongodb-docs
        url: https://www.mongodb.com/docs/manual/tutorial/analyze-query-plan/
        shown: |-
          winningPlan: { stage: 'FETCH', inputStage: { stage: 'IXSCAN', keyPattern: { year: 1, rated: 1 }, '...': '...' } }
          executionStats: { executionSuccess: true, nReturned: 235, totalKeysExamined: 246, totalDocsExamined: 235, '...': '...' }
      - label: { vi: "hint({ rated: 1, year: 1 })", en: "hint({ rated: 1, year: 1 })" }
        source: mongodb-docs
        url: https://www.mongodb.com/docs/manual/tutorial/analyze-query-plan/
        shown: |-
          winningPlan: { stage: 'FETCH', inputStage: { stage: 'IXSCAN', keyPattern: { rated: 1, year: 1 }, '...': '...' } }
          executionStats: { executionSuccess: true, nReturned: 235, totalKeysExamined: 235, totalDocsExamined: 235, '...': '...' }
    answer: { vi: "`{ rated: 1, year: 1 }` tốt hơn: 235 khóa cho 235 kết quả, không khóa thừa. Với `{ year: 1, rated: 1 }`, khoảng trên `year` đứng trước nên trong mỗi năm phải bước qua cả các xếp hạng khác: 246 khóa (11 thừa). Đó là ESR: trường so bằng (`rated`) trước trường khoảng (`year`). Ở đây chênh nhỏ, nhưng với dữ liệu lệch có thể là gấp hàng trăm lần.", en: "`{ rated: 1, year: 1 }` is better: 235 keys for 235 results, none wasted. With `{ year: 1, rated: 1 }`, the range on `year` comes first, so within each year the scan steps over other ratings: 246 keys (11 wasted). That is ESR: the equality field (`rated`) before the range field (`year`). The gap is small here, but with skewed data it can be hundreds of times." }
    rubric:
      - { vi: "So totalKeysExamined với nReturned", en: "Compares totalKeysExamined with nReturned" }
      - { vi: "Chọn đúng chỉ mục", en: "Picks the right index" }
      - { vi: "Gọi tên luật bằng trước khoảng", en: "Names the equality-before-range rule" }
    doc: https://www.mongodb.com/docs/manual/tutorial/equality-sort-range-guideline/
  - id: e-iv-mg-mid-10
    engine: mongodb
    band: mid
    kind: diagnose
    q: { vi: "Danh sách \"đơn đang xử lý mới nhất\" thỉnh thoảng lỗi khi dữ liệu lớn. Đọc đoạn minh họa và đề xuất chỉ mục.", en: "The \"newest processing orders\" list sometimes fails on large data. Read the illustration and propose an index." }
    exhibits:
      - label: { vi: "db.orders.find({ status: 'PROCESSING' }).sort({ created: -1 }).limit(50), chỉ mục { status: 1 }", en: "db.orders.find({ status: 'PROCESSING' }).sort({ created: -1 }).limit(50), index { status: 1 }" }
        source: illustrative
        shown: |-
          winningPlan: {
            stage: 'SORT', sortPattern: { created: -1 }, memLimit: 104857600, limitAmount: 50, type: 'simple',
            inputStage: { stage: 'FETCH', inputStage: { stage: 'IXSCAN', keyPattern: { status: 1 } } }
          }
          executionStats: { nReturned: 50, totalKeysExamined: 180000, totalDocsExamined: 180000 }
    answer: { vi: "Có stage `SORT` nghĩa là sắp xếp trong bộ nhớ: chỉ mục `{ status: 1 }` tìm được 180.000 đơn đang xử lý nhưng không cho thứ tự `created`, nên phải đọc hết rồi sắp, để lấy 50. Khi tập lớn, sort có thể vượt giới hạn bộ nhớ (cần tràn đĩa hoặc lỗi). Chỉ mục `{ status: 1, created: -1 }` (E rồi S) cho thứ tự sẵn: không `SORT`, đọc khoảng 50 khóa.", en: "A `SORT` stage means an in-memory sort: the `{ status: 1 }` index finds 180,000 processing orders but not in `created` order, so all are read and sorted to get 50. On large sets the sort can exceed the memory limit (spill to disk or fail). An index on `{ status: 1, created: -1 }` (E then S) gives the order: no `SORT`, about 50 keys read." }
    rubric:
      - { vi: "Đọc SORT = sắp trong bộ nhớ", en: "Reads SORT = in-memory sort" }
      - { vi: "So 180.000 khóa với 50 kết quả", en: "Compares 180,000 keys with 50 results" }
      - { vi: "Đề xuất chỉ mục status + created", en: "Proposes the status + created index" }
    doc: https://www.mongodb.com/docs/manual/reference/explain-results/
  - id: e-iv-mg-mid-11
    engine: mongodb
    band: mid
    kind: diagnose
    q: { vi: "Màn \"tra SKU\" được kỳ vọng là truy vấn phủ nhưng explain vẫn có FETCH. Tìm nguyên nhân.", en: "The \"SKU lookup\" screen was meant to be a covered query but explain still shows FETCH. Find the cause." }
    exhibits:
      - label: { vi: "db.products.find({ sku: 'X-1' }, { sku: 1, price: 1 }), chỉ mục { sku: 1, price: 1 }", en: "db.products.find({ sku: 'X-1' }, { sku: 1, price: 1 }), index { sku: 1, price: 1 }" }
        source: illustrative
        shown: |-
          winningPlan: {
            stage: 'PROJECTION_SIMPLE', transformBy: { sku: 1, price: 1 },
            inputStage: { stage: 'FETCH', inputStage: { stage: 'IXSCAN', keyPattern: { sku: 1, price: 1 } } }
          }
          executionStats: { nReturned: 1, totalKeysExamined: 1, totalDocsExamined: 1 }
    answer: { vi: "Projection không loại `_id`, nên kết quả cần `_id` mà chỉ mục không có, MongoDB phải đọc tài liệu (`FETCH`, `totalDocsExamined: 1`). Sửa projection thành `{ _id: 0, sku: 1, price: 1 }` thì `IXSCAN` không còn dưới `FETCH` và `totalDocsExamined: 0`. Nếu `price` là mảng (multikey) thì vẫn không phủ được.", en: "The projection does not exclude `_id`, so the result needs `_id`, which the index lacks, and MongoDB must read the document (`FETCH`, `totalDocsExamined: 1`). Change the projection to `{ _id: 0, sku: 1, price: 1 }`: `IXSCAN` is no longer under `FETCH` and `totalDocsExamined: 0`. If `price` were an array (multikey) it still could not be covered." }
    rubric:
      - { vi: "Nhận ra _id mặc định trong projection", en: "Spots the default _id in the projection" }
      - { vi: "Nói kết quả explain mong đợi sau sửa", en: "States the expected explain after the fix" }
      - { vi: "Biết giới hạn multikey", en: "Knows the multikey limit" }
    doc: https://www.mongodb.com/docs/manual/reference/explain-results/
  - id: e-iv-mg-mid-12
    engine: mongodb
    band: mid
    kind: concept
    q: { vi: "Write concern `{ w: 'majority', j: true }` hứa gì? Đổi lại tốn gì?", en: "What does write concern `{ w: 'majority', j: true }` promise? What does it cost?" }
    answer: { vi: "Lệnh ghi chỉ được xác nhận khi đa số thành viên có phiếu đã ghi nó (và vào journal trên đĩa). Khi primary sập, thay đổi đó không bị rollback vì primary mới chắc chắn có nó. Cái giá là độ trễ thêm ít nhất một vòng mạng tới secondary, và nếu mất đa số thì ghi treo tới `wtimeout`. `w: 1` nhanh hơn nhưng có thể mất dữ liệu đã xác nhận khi failover.", en: "The write is acknowledged only once a majority of voting members have it (and in the on-disk journal). If the primary fails, the change is not rolled back because the new primary surely has it. The price is at least one extra network round trip to secondaries, and if a majority is unavailable the write waits until `wtimeout`. `w: 1` is faster but can lose acknowledged writes on failover." }
    rubric:
      - { vi: "Đa số + journal", en: "Majority + journal" }
      - { vi: "Không rollback khi failover", en: "No rollback on failover" }
      - { vi: "Độ trễ và wtimeout", en: "Latency and wtimeout" }
    doc: https://www.mongodb.com/docs/manual/reference/write-concern/
  - id: e-iv-mg-mid-13
    engine: mongodb
    band: mid
    kind: concept
    q: { vi: "Các mức read concern `local`, `majority`, `snapshot` khác nhau thế nào?", en: "How do read concerns `local`, `majority` and `snapshot` differ?" }
    answer: { vi: "`local` (mặc định): dữ liệu mới nhất của nút được đọc, có thể bị rollback sau đó. `majority`: chỉ dữ liệu đã được đa số ghi nhận, nên không bao giờ bị rollback, có thể hơi cũ hơn. `snapshot`: dùng trong transaction đa tài liệu (và một số lệnh đọc), mọi lần đọc thấy cùng một thời điểm đã majority-commit. `linearizable` mạnh nhất, chỉ trên primary, chậm.", en: "`local` (default): the node's newest data, which may later be rolled back. `majority`: only data acknowledged by a majority, so never rolled back, possibly slightly older. `snapshot`: used in multi-document transactions (and some reads), every read sees one majority-committed point in time. `linearizable` is the strongest, primary only, slow." }
    rubric:
      - { vi: "Đúng local và rủi ro rollback", en: "Right about local and rollback risk" }
      - { vi: "Đúng majority", en: "Right about majority" }
      - { vi: "Đúng snapshot trong transaction", en: "Right about snapshot in transactions" }
    doc: https://www.mongodb.com/docs/manual/reference/read-concern/
  - id: e-iv-mg-mid-14
    engine: mongodb
    band: mid
    kind: concept
    q: { vi: "Một aggregation báo lỗi vượt giới hạn bộ nhớ ở `$group`. Có những cách nào?", en: "An aggregation fails with a memory limit error at `$group`. What are the options?" }
    answer: { vi: "Mỗi stage chặn (như `$group`, `$sort`) có giới hạn 100 MB bộ nhớ. Cách: (1) `$match`/`$project` sớm để giảm tài liệu và trường đi vào `$group`; (2) cho phép tràn đĩa với `allowDiskUse: true` (từ 6.0 tham số `allowDiskUseByDefault` mặc định là true, nên lỗi này thường là do nó bị tắt hoặc server cũ hơn), chấp nhận chậm hơn; (3) tính trước: mẫu Computed hoặc collection tổng hợp cập nhật dần bằng `$merge`; (4) chia nhỏ theo khoảng thời gian.", en: "Each blocking stage (like `$group`, `$sort`) has a 100 MB memory limit. Options: (1) an early `$match`/`$project` to shrink documents and fields entering `$group`; (2) allow spilling with `allowDiskUse: true` (since 6.0 the `allowDiskUseByDefault` parameter defaults to true, so this error usually means it was turned off or the server is older), accepting slower runs; (3) precompute: the Computed pattern or a summary collection updated incrementally with `$merge`; (4) split by time range." }
    rubric:
      - { vi: "Biết giới hạn 100 MB mỗi stage", en: "Knows the 100 MB per-stage limit" }
      - { vi: "allowDiskUse và cái giá", en: "allowDiskUse and its price" }
      - { vi: "Giảm dữ liệu sớm hoặc tính trước", en: "Shrink early or precompute" }
    doc: https://www.mongodb.com/docs/manual/core/aggregation-pipeline-limits/
  - id: e-iv-mg-mid-15
    engine: mongodb
    band: mid
    kind: design
    q: { vi: "Danh mục sản phẩm: áo có size/màu, điện thoại có RAM/dung lượng, sách có ISBN. Người dùng lọc theo bất kỳ thuộc tính nào. Thiết kế tài liệu và chỉ mục.", en: "A product catalog: shirts have size/colour, phones have RAM/storage, books have ISBN. Users filter by any attribute. Design documents and indexes." }
    answer: { vi: "Mẫu Attribute: trường chung ở gốc (`name`, `category`, `price`), thuộc tính riêng thành mảng cặp `attrs: [{ k: 'ram_gb', v: 8 }, { k: 'color', v: 'blue' }]`, một chỉ mục `{ 'attrs.k': 1, 'attrs.v': 1 }` phục vụ mọi thuộc tính; truy vấn dùng `$elemMatch` để k và v cùng một phần tử. Thêm `{ category: 1, price: 1 }` cho duyệt danh mục. Lựa chọn khác: wildcard index `{ 'specs.$**': 1 }` trên object thuộc tính, viết truy vấn tự nhiên hơn nhưng mỗi truy vấn chỉ dùng được một trường của nó.", en: "Attribute pattern: common fields at the top (`name`, `category`, `price`), specific attributes as an array of pairs `attrs: [{ k: 'ram_gb', v: 8 }, { k: 'color', v: 'blue' }]`, one index `{ 'attrs.k': 1, 'attrs.v': 1 }` serves every attribute; queries use `$elemMatch` so k and v match one element. Add `{ category: 1, price: 1 }` for browsing. Alternative: a wildcard index `{ 'specs.$**': 1 }` on an attributes object, more natural queries but each query can use it for only one field." }
    tradeoffs:
      - { vi: "Mẫu Attribute: một chỉ mục cho tất cả, nhưng giá trị khác kiểu trong `v` và truy vấn dài hơn.", en: "Attribute pattern: one index for everything, but mixed types in `v` and longer queries." }
      - { vi: "Wildcard: dễ viết, nhưng chỉ mục lớn và không ghép được với trường khác như chỉ mục ghép thường.", en: "Wildcard: easy to write, but a large index that does not combine with other fields like a normal compound index." }
    rubric:
      - { vi: "Đưa mẫu Attribute với chỉ mục k/v", en: "Gives the Attribute pattern with a k/v index" }
      - { vi: "Dùng $elemMatch đúng chỗ", en: "Uses $elemMatch where needed" }
      - { vi: "So với wildcard index", en: "Compares with a wildcard index" }
    doc: https://www.mongodb.com/docs/manual/core/indexes/index-types/index-wildcard/

  # ---------------- MongoDB · senior
  - id: e-iv-mg-senior-01
    engine: mongodb
    band: senior
    kind: concept
    q: { vi: "Khi nào bạn dùng transaction đa tài liệu trong MongoDB, và cái giá của nó là gì?", en: "When do you use multi-document transactions in MongoDB, and what do they cost?" }
    answer: { vi: "Khi một thay đổi nghiệp vụ buộc phải chạm nhiều tài liệu/collection cùng lúc mà không thiết kế lại được thành một tài liệu (ví dụ chuyển tiền giữa hai ví). Cần replica set (hoặc cụm shard). Cái giá: giữ snapshot và khóa tài liệu đến khi commit, xung đột ghi làm transaction bị hủy và phải thử lại (lỗi có nhãn `TransientTransactionError`), giới hạn thời gian mặc định 60 s, và chậm hơn ghi một tài liệu. Ưu tiên thiết kế để ghi một tài liệu là đủ; transaction là ngoại lệ.", en: "When one business change must touch several documents/collections together and cannot be redesigned into one document (for example a transfer between two wallets). Requires a replica set (or sharded cluster). Cost: the snapshot and document locks are held until commit, write conflicts abort and need retries (errors labelled `TransientTransactionError`), a 60 s default lifetime, and slower than a single-document write. Prefer designs where one document write suffices; transactions are the exception." }
    rubric:
      - { vi: "Ví dụ đúng khi nào cần", en: "A correct example of when needed" }
      - { vi: "Biết cần replica set và retry theo nhãn lỗi", en: "Knows replica set requirement and label-based retry" }
      - { vi: "Nêu giới hạn 60 s và ưu tiên mô hình một tài liệu", en: "States the 60 s limit and prefers single-document modelling" }
    doc: https://www.mongodb.com/docs/manual/core/transactions/
  - id: e-iv-mg-senior-02
    engine: mongodb
    band: senior
    kind: concept
    q: { vi: "Dùng change stream để đồng bộ sang hệ tìm kiếm. Làm sao để dịch vụ khởi động lại mà không mất sự kiện?", en: "You use a change stream to sync into a search system. How does the service restart without losing events?" }
    answer: { vi: "Mỗi sự kiện có `_id` là resume token. Lưu token sau khi xử lý xong (bền, cùng nơi với trạng thái đích nếu được), khi khởi động lại mở stream với `resumeAfter` (hoặc `startAfter` nếu stream trước bị invalidate). Điều kiện: token vẫn còn trong oplog; dịch vụ dừng lâu hơn cửa sổ oplog thì phải đồng bộ lại toàn bộ. Change stream chỉ phát thay đổi đã majority-commit và cần replica set. Xử lý phải idempotent vì có thể nhận lại sự kiện sau token cuối đã lưu.", en: "Every event's `_id` is a resume token. Store the token after processing (durably, alongside the target state if possible), and on restart open the stream with `resumeAfter` (or `startAfter` if the previous stream was invalidated). Condition: the token must still be in the oplog; downtime longer than the oplog window forces a full resync. Change streams only emit majority-committed changes and need a replica set. Processing must be idempotent since events after the last stored token may be redelivered." }
    rubric:
      - { vi: "Lưu resume token + resumeAfter/startAfter", en: "Resume token + resumeAfter/startAfter" }
      - { vi: "Giới hạn cửa sổ oplog", en: "The oplog window limit" }
      - { vi: "Xử lý idempotent", en: "Idempotent processing" }
    doc: https://www.mongodb.com/docs/manual/changestreams/
  - id: e-iv-mg-senior-03
    engine: mongodb
    band: senior
    kind: concept
    q: { vi: "Kể và giải thích ngắn ba mẫu thiết kế schema MongoDB chính thức bạn đã dùng, mỗi mẫu một tình huống.", en: "Name and briefly explain three official MongoDB schema design patterns you have used, one situation each." }
    answer: { vi: "Ví dụ: Computed: lưu sẵn giá trị tính (tổng doanh thu, số đánh giá) cập nhật khi ghi, để đọc không phải gom. Group Data (bucket): gom nhiều điểm đo vào một tài liệu theo khoảng thời gian, giảm số tài liệu và chỉ mục. Schema Versioning: thêm `schema_version`, ứng dụng đọc được cả bản cũ và mới, nâng cấp dần thay vì migration một lần. Còn có Polymorphic (nhiều hình dạng trong một collection), Archive (chuyển dữ liệu cũ ra chỗ khác), Single Collection (nhiều loại thực thể chung collection để đọc một lần).", en: "For example: Computed: store precomputed values (revenue totals, rating counts) updated on write, so reads need no aggregation. Group Data (bucket): group many measurements into one document per time span, fewer documents and index entries. Schema Versioning: add `schema_version`, the app reads old and new shapes, upgrade gradually instead of a one-shot migration. Others: Polymorphic (several shapes in one collection), Archive (move old data elsewhere), Single Collection (several entity types together, read in one go)." }
    rubric:
      - { vi: "Ba mẫu đúng tên và nội dung", en: "Three patterns with correct names and meaning" }
      - { vi: "Mỗi mẫu một tình huống hợp lý", en: "A sensible situation for each" }
      - { vi: "Nêu cái giá của ít nhất một mẫu", en: "States the cost of at least one" }
    doc: https://www.mongodb.com/docs/manual/data-modeling/design-patterns/
  - id: e-iv-mg-senior-04
    engine: mongodb
    band: senior
    kind: concept
    q: { vi: "Query planner của MongoDB chọn kế hoạch thế nào, và vì sao một truy vấn có thể đột ngột chậm dù không ai đổi code?", en: "How does MongoDB's query planner pick a plan, and why can a query suddenly slow down with no code change?" }
    answer: { vi: "Với một \"hình dạng\" truy vấn có nhiều chỉ mục ứng viên, planner cho các kế hoạch chạy thử song song một lượng việc nhỏ và chọn cái trả kết quả hiệu quả nhất, rồi lưu vào plan cache theo hình dạng đó. Các lần sau dùng lại kế hoạch đã lưu và chỉ lập lại khi hiệu năng của nó tệ đi rõ, khi chỉ mục đổi hoặc server khởi động lại. Chậm đột ngột: kế hoạch được chọn với giá trị tham số \"dễ\" nhưng tệ với giá trị khác, hoặc dữ liệu đổi phân bố. Xử lý: chỉ mục tốt hơn để chỉ có một lựa chọn rõ ràng; `hint`; hoặc `setQuerySettings` để ghim chỉ mục cho một hình dạng truy vấn.", en: "For a query shape with several candidate indexes, the planner runs the candidate plans side by side for a small amount of work and picks the most efficient, then stores it in the plan cache for that shape. Later runs reuse it and only replan when its performance clearly degrades, indexes change or the server restarts. Sudden slowness: the plan was chosen with \"easy\" parameter values but is bad for others, or the data distribution shifted. Fixes: a better index so there is one clear choice; `hint`; or `setQuerySettings` to pin an index for a query shape." }
    rubric:
      - { vi: "Chạy thử cạnh tranh + plan cache theo hình dạng", en: "Trial race + plan cache per shape" }
      - { vi: "Giải thích vì sao kế hoạch cache có thể sai", en: "Explains why a cached plan can be wrong" }
      - { vi: "Ít nhất hai cách xử lý", en: "At least two remedies" }
    doc: https://www.mongodb.com/docs/manual/core/query-plans/
  - id: e-iv-mg-senior-05
    engine: mongodb
    band: senior
    kind: concept
    q: { vi: "Replica set ba nút: primary mất mạng. Mô tả chuyện gì xảy ra trong khoảng 15 giây tiếp theo với ghi và đọc của ứng dụng.", en: "A three-node replica set: the primary loses its network. Describe what happens to app writes and reads in the next 15 seconds." }
    answer: { vi: "Secondary không nhận heartbeat (2 s một lần) trong `electionTimeoutMillis` (mặc định 10 s) thì tổ chức bầu cử; nút có dữ liệu mới nhất và đủ phiếu đa số (2/3) thành primary mới, thường trong khoảng 12 giây. Primary cũ thấy mình mất đa số thì tự xuống secondary. Trong lúc đó ghi lỗi hoặc chờ; driver hiện đại có retryable writes nên tự thử lại một lần khi thấy primary mới. Đọc với read preference `primary` cũng gián đoạn; `primaryPreferred`/`secondary` vẫn đọc được. Ghi `w: 1` chưa nhân bản trên primary cũ sẽ bị rollback khi nó quay lại.", en: "Secondaries miss heartbeats (every 2 s) for `electionTimeoutMillis` (10 s by default) and call an election; the most up-to-date node with a majority of votes (2 of 3) becomes primary, typically within about 12 seconds. The old primary, seeing it lost the majority, steps down. Meanwhile writes fail or wait; modern drivers use retryable writes and retry once when they find the new primary. Reads with `primary` preference also pause; `primaryPreferred`/`secondary` keep reading. `w: 1` writes not yet replicated from the old primary are rolled back when it rejoins." }
    rubric:
      - { vi: "Heartbeat, timeout 10 s, bầu theo đa số", en: "Heartbeats, 10 s timeout, majority election" }
      - { vi: "Primary cũ tự xuống", en: "The old primary steps down" }
      - { vi: "Retryable writes và hành vi đọc", en: "Retryable writes and read behaviour" }
      - { vi: "Rollback của ghi w:1", en: "Rollback of w:1 writes" }
    doc: https://www.mongodb.com/docs/manual/core/replica-set-elections/
  - id: e-iv-mg-senior-06
    engine: mongodb
    band: senior
    kind: concept
    q: { vi: "Retryable writes giải quyết vấn đề gì, và thao tác nào **không** an toàn để tự thử lại?", en: "What problem do retryable writes solve, and which operations are **not** safe to retry blindly?" }
    answer: { vi: "Khi mạng hoặc failover làm mất phản hồi, client không biết lệnh ghi đã chạy chưa. Retryable writes gắn id phiên + số thứ tự, nên server nhận diện lần thử lại của cùng một lệnh và không chạy hai lần (cho insert, update/delete một tài liệu, findAndModify, bulk có thứ tự…). `updateMany`/`deleteMany` (multi: true) không thuộc diện retryable. Thao tác không idempotent ở tầng ứng dụng (ví dụ gọi API thanh toán rồi ghi) cần khóa idempotency riêng.", en: "When the network or a failover loses the reply, the client cannot know whether the write ran. Retryable writes attach a session id + sequence number, so the server recognises a retry of the same operation and does not run it twice (for inserts, single-document updates/deletes, findAndModify, ordered bulk…). `updateMany`/`deleteMany` (multi: true) are not retryable. Non-idempotent app-level steps (for example calling a payment API then writing) need their own idempotency key." }
    rubric:
      - { vi: "Mô tả vấn đề phản hồi bị mất", en: "Describes the lost-reply problem" }
      - { vi: "Cơ chế id phiên + số thứ tự", en: "Session id + sequence mechanism" }
      - { vi: "Biết updateMany/deleteMany không retryable", en: "Knows updateMany/deleteMany are not retryable" }
    doc: https://www.mongodb.com/docs/manual/core/retryable-writes/
  - id: e-iv-mg-senior-07
    engine: mongodb
    band: senior
    kind: concept
    q: { vi: "Xóa một chỉ mục \"có vẻ không dùng\" trên production an toàn thế nào?", en: "How do you safely drop an index that \"looks unused\" in production?" }
    answer: { vi: "(1) Xem `$indexStats` trên **mọi** nút (thống kê theo từng nút và reset khi khởi động lại), qua một chu kỳ nghiệp vụ đủ dài (cả báo cáo cuối tháng). (2) Ẩn chỉ mục: `db.coll.hideIndex(name)`: planner bỏ qua nó nhưng nó vẫn được duy trì, nên bật lại tức thì nếu có truy vấn chậm. (3) Theo dõi slow log một thời gian rồi mới `dropIndex`. Chỉ mục `_id` không xóa/ẩn được.", en: "(1) Check `$indexStats` on **every** node (stats are per node and reset on restart), across a long enough business cycle (including month-end reports). (2) Hide it: `db.coll.hideIndex(name)`: the planner ignores it but it is still maintained, so unhiding is instant if something slows down. (3) Watch the slow log for a while, then `dropIndex`. The `_id` index cannot be dropped or hidden." }
    rubric:
      - { vi: "$indexStats trên mọi nút, chu kỳ đủ dài", en: "$indexStats on all nodes, a long enough cycle" }
      - { vi: "Ẩn trước khi xóa", en: "Hide before drop" }
      - { vi: "Theo dõi rồi mới xóa", en: "Monitor, then drop" }
    doc: https://www.mongodb.com/docs/manual/core/index-hidden/
  - id: e-iv-mg-senior-08
    engine: mongodb
    band: senior
    kind: diagnose
    q: { vi: "Ô tìm kiếm sản phẩm dùng regex. Đọc đoạn minh họa: vì sao có chỉ mục mà vẫn chậm, và bạn đề xuất gì?", en: "The product search box uses a regex. Read the illustration: why is it slow despite an index, and what do you propose?" }
    exhibits:
      - label: { vi: "db.products.find({ name: /phone/i }), chỉ mục { name: 1 }", en: "db.products.find({ name: /phone/i }), index { name: 1 }" }
        source: illustrative
        shown: |-
          winningPlan: {
            stage: 'FETCH',
            inputStage: { stage: 'IXSCAN', keyPattern: { name: 1 }, filter: { name: { '$regex': 'phone', '$options': 'i' } },
                          indexBounds: { name: [ '["", {})', '[/phone/i, /phone/i]' ] } }
          }
          executionStats: { nReturned: 120, totalKeysExamined: 100000, totalDocsExamined: 120 }
    answer: { vi: "Regex không neo đầu chuỗi (và không phân biệt hoa thường) không thu hẹp được khoảng chỉ mục: `indexBounds` là toàn bộ chuỗi, nên phải duyệt 100.000 khóa để lấy 120. Chỉ mục chỉ đỡ việc đọc tài liệu. Regex neo đầu và phân biệt hoa thường (`/^phone/`) mới thành khoảng hẹp. Cho tìm kiếm thật (chuỗi con, không dấu, xếp hạng) nên dùng công cụ tìm kiếm toàn văn (MongoDB Search hoặc text index) thay vì regex.", en: "An unanchored (and case-insensitive) regex cannot narrow the index range: `indexBounds` cover every string, so 100,000 keys are walked to get 120. The index only saves document reads. Only an anchored, case-sensitive regex (`/^phone/`) becomes a tight range. For real search (substrings, accents, ranking) use a full-text engine (MongoDB Search or a text index) instead of regex." }
    rubric:
      - { vi: "Đọc indexBounds toàn bộ và 100.000/120", en: "Reads full indexBounds and 100,000/120" }
      - { vi: "Biết điều kiện regex neo + phân biệt hoa thường", en: "Knows the anchored + case-sensitive condition" }
      - { vi: "Đề xuất tìm kiếm toàn văn", en: "Proposes full-text search" }
    doc: https://www.mongodb.com/docs/manual/reference/operator/query/regex/
  - id: e-iv-mg-senior-09
    engine: mongodb
    band: senior
    kind: diagnose
    q: { vi: "Báo cáo doanh thu theo khách chạy ngày càng lâu. Đọc phần explain của aggregation (minh họa) và đề xuất.", en: "The revenue-per-customer report runs longer every day. Read the aggregation explain excerpt (illustrative) and propose a fix." }
    exhibits:
      - label: { vi: "db.orders.aggregate([{ $group: { _id: '$customer_id', total: { $sum: '$amount' } } }, { $sort: { total: -1 } }]).explain('executionStats')", en: "db.orders.aggregate([{ $group: { _id: '$customer_id', total: { $sum: '$amount' } } }, { $sort: { total: -1 } }]).explain('executionStats')" }
        source: illustrative
        shown: |-
          stages: [
            { '$cursor': { queryPlanner: { winningPlan: { stage: 'PROJECTION_SIMPLE', inputStage: { stage: 'COLLSCAN' } } },
                           executionStats: { nReturned: 8000000, totalDocsExamined: 8000000 } } },
            { '$group': { _id: '$customer_id', total: { '$sum': '$amount' } }, nReturned: 950000, usedDisk: true, spills: 14 },
            { '$sort': { sortKey: { total: -1 } }, nReturned: 950000, usedDisk: true }
          ]
    answer: { vi: "Không có `$match`: quét cả 8 triệu đơn mỗi lần, `$group` 950.000 nhóm tràn đĩa (`usedDisk: true`, 14 lần), rồi `$sort` cũng tràn. Thời gian tăng theo toàn bộ lịch sử. Sửa: (1) giới hạn khoảng thời gian bằng `$match` đầu pipeline có chỉ mục; (2) nếu cần tổng toàn thời gian, tính dần: collection tổng hợp theo ngày/khách cập nhật bằng `$merge` mỗi đêm (hoặc mẫu Computed khi ghi đơn), báo cáo chỉ đọc bảng tổng; (3) nếu chỉ cần top N, thêm `$limit` sau `$sort` để sort chỉ giữ N phần tử.", en: "No `$match`: every run scans all 8 million orders, `$group` with 950,000 groups spills to disk (`usedDisk: true`, 14 spills), and `$sort` spills too. Runtime grows with all history. Fix: (1) bound the time range with a leading indexed `$match`; (2) if all-time totals are needed, compute incrementally: a per-day/per-customer summary collection updated by a nightly `$merge` (or the Computed pattern at order write), and the report reads the summary; (3) if only the top N matter, add `$limit` after `$sort` so the sort keeps just N items." }
    rubric:
      - { vi: "Đọc COLLSCAN toàn bộ và usedDisk", en: "Reads the full COLLSCAN and usedDisk" }
      - { vi: "Đề xuất $match có chỉ mục", en: "Proposes an indexed $match" }
      - { vi: "Đề xuất tính dần ($merge / Computed)", en: "Proposes incremental computation ($merge / Computed)" }
      - { vi: "Biết $sort + $limit gộp lại", en: "Knows $sort + $limit coalesce" }
    doc: https://www.mongodb.com/docs/manual/core/aggregation-pipeline-optimization/
  - id: e-iv-mg-senior-10
    engine: mongodb
    band: senior
    kind: diagnose
    q: { vi: "Truy vấn đơn theo cửa hàng và khoảng ngày trả về đúng nhưng chậm. Explain (minh họa) cho thấy kế hoạch được lấy từ cache. Chẩn đoán.", en: "An orders-by-store-and-date-range query is correct but slow. The explain (illustrative) shows a cached plan. Diagnose." }
    exhibits:
      - label: { vi: "find({ store: 7, created: { $gte: d1, $lt: d2 } }), chỉ mục { created: 1 } và { store: 1 }", en: "find({ store: 7, created: { $gte: d1, $lt: d2 } }), indexes { created: 1 } and { store: 1 }" }
        source: illustrative
        shown: |-
          queryPlanner: {
            winningPlan: { isCached: true, stage: 'FETCH', filter: { store: { '$eq': 7 } },
                           inputStage: { stage: 'IXSCAN', keyPattern: { created: 1 } } },
            rejectedPlans: [ { stage: 'FETCH', inputStage: { stage: 'IXSCAN', keyPattern: { store: 1 } } } ]
          }
          executionStats: { nReturned: 300, totalKeysExamined: 240000, totalDocsExamined: 240000 }
    answer: { vi: "Kế hoạch trong cache chọn chỉ mục `created` (có lẽ được chọn khi khoảng ngày rất hẹp), giờ khoảng dài nên đọc 240.000 tài liệu rồi lọc `store` để giữ 300. Hai chỉ mục một trường đều không khớp hình dạng truy vấn. Sửa gốc: chỉ mục ghép `{ store: 1, created: 1 }` (E rồi R) cho khoảng chính xác ~300 khóa và loại bỏ sự lưỡng lự của planner. Tạm thời: `PlanCache.clear()` hoặc `hint`.", en: "The cached plan uses the `created` index (probably chosen when the date range was narrow); now the range is wide, so 240,000 documents are read and filtered on `store` to keep 300. Neither single-field index fits the query shape. Root fix: a compound `{ store: 1, created: 1 }` index (E then R) gives an exact ~300-key range and removes the planner's indecision. Short term: `PlanCache.clear()` or `hint`." }
    rubric:
      - { vi: "Đọc isCached và tỉ lệ 240.000/300", en: "Reads isCached and the 240,000/300 ratio" }
      - { vi: "Giải thích kế hoạch cache theo tham số cũ", en: "Explains a plan cached for old parameters" }
      - { vi: "Đề xuất chỉ mục ghép theo ESR", en: "Proposes an ESR compound index" }
    doc: https://www.mongodb.com/docs/manual/core/query-plans/
  - id: e-iv-mg-senior-11
    engine: mongodb
    band: senior
    kind: design
    q: { vi: "Lưu số đo nhiệt độ mỗi 10 giây từ 20.000 cảm biến, giữ 1 năm, truy vấn theo cảm biến và khoảng thời gian. Thiết kế.", en: "Store temperature readings every 10 seconds from 20,000 sensors, keep 1 year, query by sensor and time range. Design it." }
    answer: { vi: "Time series collection: `createCollection('readings', { timeseries: { timeField: 'ts', metaField: 'sensor', granularity: 'seconds' }, expireAfterSeconds: 31536000 })`. MongoDB tự gom các điểm cùng `sensor` thành bucket dạng cột nén, giảm mạnh dung lượng và chỉ mục; `expireAfterSeconds` xóa dữ liệu cũ. Thêm chỉ mục `{ sensor: 1, ts: 1 }` nếu chưa có (bản mới tự tạo trên meta + time). `metaField` chỉ chứa thứ ít đổi (id, vị trí), không chứa số đo. Truy vấn thô dài hạn nên đi qua collection tổng hợp theo giờ.", en: "A time series collection: `createCollection('readings', { timeseries: { timeField: 'ts', metaField: 'sensor', granularity: 'seconds' }, expireAfterSeconds: 31536000 })`. MongoDB groups points with the same `sensor` into compressed columnar buckets, sharply cutting storage and index size; `expireAfterSeconds` drops old data. Add a `{ sensor: 1, ts: 1 }` index if missing (newer versions create one on meta + time). `metaField` holds only slow-changing data (id, location), never measurements. Long-range raw queries should go through an hourly rollup collection." }
    tradeoffs:
      - { vi: "Time series: nén và đọc theo khoảng rất tốt, nhưng cập nhật/xóa từng điểm bị giới hạn.", en: "Time series: great compression and range reads, but per-point updates/deletes are limited." }
      - { vi: "Bucket pattern tự làm cho toàn quyền kiểm soát nhưng phải tự viết logic gom và TTL.", en: "A hand-made bucket pattern gives full control but you write the grouping and TTL logic yourself." }
    rubric:
      - { vi: "Chọn time series với timeField/metaField đúng", en: "Chooses time series with the right timeField/metaField" }
      - { vi: "Giữ dữ liệu 1 năm bằng expireAfterSeconds", en: "1-year retention via expireAfterSeconds" }
      - { vi: "Nêu giới hạn cập nhật hoặc bảng tổng hợp", en: "Mentions update limits or rollups" }
    doc: https://www.mongodb.com/docs/manual/core/timeseries-collections/
  - id: e-iv-mg-senior-12
    engine: mongodb
    band: senior
    kind: design
    q: { vi: "Bán vé sự kiện: nhiều người cùng mua chỗ cuối cùng. Thiết kế để không bán quá số vé, ưu tiên không dùng transaction.", en: "Event ticketing: many people buy the last seats at once. Design it to never oversell, preferably without transactions." }
    answer: { vi: "Một tài liệu sự kiện giữ `remaining`. Mua bằng một lệnh nguyên tử có điều kiện: `updateOne({ _id: ev, remaining: { $gte: n } }, { $inc: { remaining: -n }, $push: { holds: { order: o, n, at: now } } })`. `modifiedCount = 0` nghĩa là hết vé. Vì thao tác trên một tài liệu là nguyên tử, không thể bán quá. Giữ chỗ hết hạn được trả lại bằng job dọn (`$inc` dương + `$pull`). Nếu mảng `holds` lớn, tách giữ chỗ ra collection riêng và khi đó việc giữ chỗ + trừ số cần transaction hoặc chấp nhận dọn bù.", en: "One event document holds `remaining`. Buy with one atomic conditional update: `updateOne({ _id: ev, remaining: { $gte: n } }, { $inc: { remaining: -n }, $push: { holds: { order: o, n, at: now } } })`. `modifiedCount = 0` means sold out. Since a single-document operation is atomic, overselling is impossible. Expired holds are returned by a cleanup job (positive `$inc` + `$pull`). If `holds` grows large, move holds to their own collection, and then hold + decrement needs a transaction or compensating cleanup." }
    tradeoffs:
      - { vi: "Một tài liệu nóng: mọi lần mua tranh chấp cùng tài liệu, giới hạn thông lượng cho sự kiện rất hot.", en: "One hot document: every purchase contends on it, capping throughput for very hot events." }
      - { vi: "Chia vé thành nhiều tài liệu theo khu (bucket) tăng thông lượng nhưng phải chọn khu còn vé.", en: "Splitting seats into per-section documents raises throughput but buyers must pick a section with stock." }
    rubric:
      - { vi: "Cập nhật có điều kiện + $inc nguyên tử", en: "Conditional update + atomic $inc" }
      - { vi: "Đọc modifiedCount để biết thất bại", en: "Reads modifiedCount to detect failure" }
      - { vi: "Xử lý giữ chỗ hết hạn và tài liệu nóng", en: "Handles expired holds and the hot document" }
    doc: https://www.mongodb.com/docs/manual/core/write-operations-atomicity/
  - id: e-iv-mg-senior-13
    engine: mongodb
    band: senior
    kind: concept
    q: { vi: "Tạo chỉ mục mới trên collection 500 GB đang phục vụ production: ảnh hưởng gì và làm thế nào cho an toàn?", en: "Building a new index on a 500 GB collection serving production: what is the impact and how do you do it safely?" }
    answer: { vi: "Từ 4.2, việc tạo chỉ mục chỉ giữ khóa độc quyền ngắn ở đầu và cuối, đọc/ghi vẫn chạy, nhưng nó tốn CPU, I/O và bộ nhớ (giới hạn `maxIndexBuildMemoryUsageMegabytes`), và chạy đồng thời trên mọi thành viên replica set; mặc định (`commitQuorum: 'votingMembers'`) chỉ commit khi mọi thành viên có phiếu mang dữ liệu đã xong, nên một nút chậm làm cả việc tạo chỉ mục chờ. Làm an toàn: giờ thấp điểm, kiểm dung lượng đĩa, theo dõi độ trễ nhân bản; với tải rất nặng, dùng rolling build: tách từng nút khỏi replica set, tạo chỉ mục, đưa lại, cuối cùng stepDown primary.", en: "Since 4.2 an index build holds an exclusive lock only briefly at start and end, reads/writes continue, but it consumes CPU, I/O and memory (bounded by `maxIndexBuildMemoryUsageMegabytes`), and runs simultaneously on all replica set members; by default (`commitQuorum: 'votingMembers'`) it commits only when every data-bearing voting member has finished, so one slow member holds the whole build. Safely: off-peak, check disk space, watch replication lag; for very heavy load, a rolling build: take each member out, build, rejoin, finally step down the primary." }
    rubric:
      - { vi: "Biết khóa ngắn từ 4.2 nhưng tốn tài nguyên", en: "Knows the brief locks since 4.2 but resource cost" }
      - { vi: "Chạy đồng thời trên replica set, commitQuorum mặc định là mọi nút có phiếu", en: "Runs on all members, default commitQuorum is all voting members" }
      - { vi: "Biện pháp an toàn / rolling build", en: "Safety measures / rolling build" }
    doc: https://www.mongodb.com/docs/manual/core/index-creation/
  - id: e-iv-mg-senior-14
    engine: mongodb
    band: senior
    kind: concept
    q: { vi: "\"Working set phải vừa RAM\": nghĩa là gì với WiredTiger, và bạn đo thế nào?", en: "\"The working set must fit in RAM\": what does it mean for WiredTiger, and how do you measure it?" }
    answer: { vi: "Working set = dữ liệu và chỉ mục được truy cập thường xuyên. WiredTiger cache mặc định là phần lớn hơn giữa 50% (RAM − 1 GB) và 256 MB; phần còn lại cho cache hệ điều hành (dữ liệu nén). Nếu working set (nhất là chỉ mục) vượt cache, các page bị đẩy ra rồi đọc lại liên tục: độ trễ tăng vọt. Đo: `db.serverStatus().wiredTiger.cache` (bytes in cache, pages read into cache, tỉ lệ dirty), kích thước chỉ mục `totalIndexSize()`, và độ trễ đọc đĩa.", en: "Working set = data and indexes accessed frequently. The WiredTiger cache defaults to the larger of 50% of (RAM − 1 GB) and 256 MB; the rest serves the OS file cache (compressed data). If the working set (indexes above all) exceeds the cache, pages get evicted and re-read constantly: latency jumps. Measure: `db.serverStatus().wiredTiger.cache` (bytes in cache, pages read into cache, dirty ratio), index sizes via `totalIndexSize()`, and disk read latency." }
    rubric:
      - { vi: "Định nghĩa working set", en: "Defines the working set" }
      - { vi: "Đúng công thức cache mặc định", en: "Correct default cache formula" }
      - { vi: "Chỉ số đo cụ thể", en: "Concrete metrics" }
    doc: https://www.mongodb.com/docs/manual/core/wiredtiger/
  - id: e-iv-mg-senior-15
    engine: mongodb
    band: senior
    kind: design
    q: { vi: "Ứng dụng đã chạy 3 năm, collection `users` có ba \"đời\" hình dạng tài liệu khác nhau. Lên kế hoạch thống nhất mà không dừng dịch vụ.", en: "An app has run for 3 years and `users` holds three \"generations\" of document shapes. Plan to unify them without downtime." }
    answer: { vi: "Mẫu Schema Versioning: thêm `schema_version` (tài liệu thiếu = đời 1). Bước 1: code đọc được cả ba đời và ghi luôn đời mới nhất (nâng cấp khi chạm vào). Bước 2: job nền nâng cấp theo lô nhỏ các tài liệu đời cũ, bằng update pipeline có điều kiện `schema_version` để idempotent, giới hạn tốc độ theo độ trễ nhân bản. Bước 3: khi còn 0 tài liệu cũ, bỏ code đọc đời cũ và bật `$jsonSchema` validation cho đời mới.", en: "Schema Versioning pattern: add `schema_version` (missing = generation 1). Step 1: code reads all three generations and always writes the newest (upgrade on touch). Step 2: a background job upgrades old documents in small batches with a pipeline update conditioned on `schema_version` so it is idempotent, throttled by replication lag. Step 3: once zero old documents remain, remove the old read paths and enable `$jsonSchema` validation for the new shape." }
    tradeoffs:
      - { vi: "Nâng cấp khi chạm: không dừng, nhưng code phải sống với nhiều đời trong một thời gian.", en: "Upgrade on touch: no downtime, but code carries several generations for a while." }
      - { vi: "Backfill nền tạo tải ghi và oplog: phải giới hạn tốc độ.", en: "Background backfill adds write and oplog load: it must be throttled." }
    rubric:
      - { vi: "Dùng trường phiên bản + đọc nhiều đời", en: "Version field + multi-generation reads" }
      - { vi: "Backfill idempotent, có giới hạn tốc độ", en: "Idempotent, throttled backfill" }
      - { vi: "Kết thúc bằng validation và bỏ code cũ", en: "Ends with validation and removing old code" }
    doc: https://www.mongodb.com/docs/manual/data-modeling/design-patterns/

  # ---------------- MongoDB · staff
  - id: e-iv-mg-staff-01
    engine: mongodb
    band: staff
    kind: concept
    q: { vi: "Tiêu chí chọn shard key là gì? Đánh giá ba ứng viên cho collection `orders`: `_id` (ObjectId), `customer_id`, `{ customer_id, created }`.", en: "What are the criteria for a shard key? Evaluate three candidates for `orders`: `_id` (ObjectId), `customer_id`, `{ customer_id, created }`." }
    answer: { vi: "Tiêu chí: cardinality cao, tần suất đều (không có giá trị chiếm phần lớn), không tăng đơn điệu (nếu dùng range), và khớp truy vấn chính để truy vấn đi đúng một shard. `_id` ObjectId tăng theo thời gian: mọi lần chèn dồn vào chunk cuối (một shard nóng); hashed `_id` chia đều ghi nhưng mọi truy vấn theo khách thành scatter-gather. `customer_id`: truy vấn theo khách đi một shard, nhưng khách lớn tạo chunk không chia được (jumbo). `{ customer_id, created }`: giữ tính định tuyến theo khách mà vẫn chia được dữ liệu của khách lớn theo thời gian: thường là lựa chọn tốt nhất ở đây.", en: "Criteria: high cardinality, even frequency (no value dominating), not monotonically increasing (for ranged keys), and matching the main queries so they target one shard. ObjectId `_id` grows with time: all inserts hit the last chunk (one hot shard); hashed `_id` spreads writes but every per-customer query becomes scatter-gather. `customer_id`: per-customer queries hit one shard, but a huge customer creates an unsplittable (jumbo) chunk. `{ customer_id, created }`: keeps per-customer targeting while still splitting a big customer's data by time: usually the best choice here." }
    rubric:
      - { vi: "Kể đủ bốn tiêu chí", en: "Names all four criteria" }
      - { vi: "Đánh giá đúng từng ứng viên", en: "Evaluates each candidate correctly" }
      - { vi: "Chọn khóa ghép có lý do", en: "Picks the compound key with a reason" }
    doc: https://www.mongodb.com/docs/manual/core/sharding-choose-a-shard-key/
  - id: e-iv-mg-staff-02
    engine: mongodb
    band: staff
    kind: concept
    q: { vi: "Hashed sharding và ranged sharding: mỗi loại tốt cho gì và hại gì?", en: "Hashed vs ranged sharding: what is each good and bad for?" }
    answer: { vi: "Hashed: băm giá trị khóa nên ghi phân bố đều kể cả khi khóa tăng đơn điệu; nhưng truy vấn theo khoảng trên khóa không định tuyến được (đi mọi shard), và chỉ mục hashed không hỗ trợ mảng, không unique. Ranged: các giá trị gần nhau nằm cùng chunk nên truy vấn khoảng đi ít shard, cho phép zone theo khoảng (ví dụ theo vùng địa lý); nhưng khóa đơn điệu tạo điểm nóng ghi ở chunk cuối.", en: "Hashed: hashes the key so writes spread evenly even for monotonic keys; but range queries on the key cannot be targeted (go to every shard), and hashed indexes do not support arrays or uniqueness. Ranged: nearby values share chunks so range queries hit few shards, and zones by range are possible (for example by region); but a monotonic key creates a write hot spot on the last chunk." }
    rubric:
      - { vi: "Ưu/nhược hashed", en: "Hashed pros/cons" }
      - { vi: "Ưu/nhược ranged, nhắc khóa đơn điệu", en: "Ranged pros/cons, mentions monotonic keys" }
      - { vi: "Ví dụ khi nào chọn mỗi loại", en: "An example of when to pick each" }
    doc: https://www.mongodb.com/docs/manual/core/indexes/index-types/index-hashed/
  - id: e-iv-mg-staff-03
    engine: mongodb
    band: staff
    kind: concept
    q: { vi: "Shard key đã chọn sai hai năm trước. Bạn có những lựa chọn nào bây giờ, và mỗi lựa chọn tốn gì?", en: "The shard key was chosen badly two years ago. What options do you have now, and what does each cost?" }
    answer: { vi: "(1) `refineCollectionShardKey` (4.4+): thêm trường hậu tố vào khóa hiện có để tăng cardinality và chia được chunk lớn; rẻ, không di chuyển dữ liệu ngay, nhưng không đổi được tiền tố. (2) `reshardCollection` (5.0+): đổi hẳn khóa; MongoDB sao chép dữ liệu sang phân bố mới trong khi vẫn phục vụ ghi, chỉ chặn ghi ngắn ở cuối; cần dư dung lượng đĩa đáng kể, tải I/O cao trong nhiều giờ, ứng dụng phải chịu được ghi bị chặn ngắn. (3) Trước khi làm: `analyzeShardKey` (7.0+) để đo khóa mới trên tải thật. (4) Cách cũ: dump/restore sang collection mới, thường cần dừng.", en: "(1) `refineCollectionShardKey` (4.4+): append suffix fields to the existing key to raise cardinality and split big chunks; cheap, no immediate data movement, but the prefix cannot change. (2) `reshardCollection` (5.0+): change the key entirely; MongoDB copies data into the new distribution while serving writes, blocking writes only briefly at the end; needs substantial spare disk, heavy I/O for hours, and the app must tolerate a short write block. (3) Before either: `analyzeShardKey` (7.0+) to measure a candidate on real traffic. (4) The old way: dump/restore into a new collection, usually with downtime." }
    rubric:
      - { vi: "Biết refine (chỉ thêm hậu tố)", en: "Knows refine (suffix only)" }
      - { vi: "Biết reshard và chi phí đĩa/I/O/khóa ngắn", en: "Knows reshard and its disk/I/O/brief-block cost" }
      - { vi: "Đo trước bằng analyzeShardKey", en: "Measures first with analyzeShardKey" }
    doc: https://www.mongodb.com/docs/manual/core/sharding-reshard-a-collection/
  - id: e-iv-mg-staff-04
    engine: mongodb
    band: staff
    kind: design
    q: { vi: "Dịch vụ hồ sơ người dùng toàn cầu, luật yêu cầu dữ liệu người dùng châu Âu nằm ở châu Âu, người dùng châu Á ở châu Á, nhưng ứng dụng muốn một collection logic duy nhất. Thiết kế.", en: "A global user-profile service; regulation requires EU users' data to stay in the EU and Asian users' in Asia, but the app wants one logical collection. Design it." }
    answer: { vi: "Zone sharding: shard key bắt đầu bằng `region` (ví dụ `{ region: 1, user_id: 1 }`), gán shard đặt ở EU vào zone `EU`, shard ở châu Á vào zone `ASIA`, rồi `updateZoneKeyRange` cho khoảng `region: 'EU'` → zone `EU`. Balancer giữ chunk trong đúng zone. Truy vấn luôn kèm `region` để định tuyến một shard; mongos đặt gần người dùng. Mỗi shard là replica set mà mọi nút nằm trong vùng đó (secondary khác vùng sẽ phá luật cư trú). Đổi vùng của một người = cập nhật giá trị shard key (được từ 4.2) và dữ liệu chuyển zone.", en: "Zone sharding: a shard key starting with `region` (for example `{ region: 1, user_id: 1 }`), assign EU-located shards to zone `EU` and Asian ones to `ASIA`, then `updateZoneKeyRange` mapping `region: 'EU'` → zone `EU`. The balancer keeps chunks in their zone. Queries always include `region` to target one shard; mongos runs near users. Each shard is a replica set with every member inside that region (an out-of-region secondary breaks residency). Moving a user = updating the shard key value (allowed since 4.2) and the data changes zone." }
    tradeoffs:
      - { vi: "Truy vấn toàn cầu (báo cáo) thành scatter-gather qua nhiều vùng, chậm.", en: "Global queries (reports) become cross-region scatter-gather, slow." }
      - { vi: "Mỗi vùng cần đủ nút cho tính sẵn sàng riêng, tăng chi phí.", en: "Each region needs enough members for its own availability, raising cost." }
    rubric:
      - { vi: "Zone sharding với region đứng đầu shard key", en: "Zone sharding with region leading the shard key" }
      - { vi: "Mọi thành viên replica set trong vùng", en: "All replica set members in-region" }
      - { vi: "Nêu chi phí truy vấn toàn cầu", en: "States the global-query cost" }
    doc: https://www.mongodb.com/docs/manual/core/zone-sharding/
  - id: e-iv-mg-staff-05
    engine: mongodb
    band: staff
    kind: concept
    q: { vi: "Replica set trải ba vùng (2 nút vùng A, 2 nút vùng B, 1 nút vùng C). Với `w: 'majority'`, độ trễ ghi và khả năng chịu mất một vùng thế nào?", en: "A replica set spans three regions (2 members in A, 2 in B, 1 in C). With `w: 'majority'`, what about write latency and surviving a region loss?" }
    answer: { vi: "5 nút có phiếu, đa số = 3. Primary ở A cần thêm 2 xác nhận: nút còn lại ở A (nhanh) và ít nhất một nút ở B hoặc C, nên mỗi lần ghi cộng một vòng mạng liên vùng tới vùng gần nhất. Mất cả vùng A còn 3/5: vẫn bầu được primary và ghi majority tiếp. Mất A hoặc B đều sống; mất hai vùng thì không. Đặt priority để primary ưu tiên vùng gần ứng dụng; vùng C chỉ cần một nút (có thể là nút dữ liệu ưu tiên thấp) để phá hòa.", en: "5 voting members, majority = 3. A primary in A needs 2 more acks: the other A member (fast) and at least one in B or C, so every write adds an inter-region round trip to the nearest region. Losing all of A leaves 3/5: a primary can still be elected and majority writes continue. Losing A or B is survivable; losing two regions is not. Set priorities so the primary prefers the region near the app; region C needs just one member (possibly a low-priority data node) as a tiebreaker." }
    rubric:
      - { vi: "Tính đúng đa số 3/5", en: "Computes the 3/5 majority" }
      - { vi: "Độ trễ = một vòng liên vùng", en: "Latency = one inter-region round trip" }
      - { vi: "Phân tích mất một / hai vùng", en: "Analyses losing one / two regions" }
    doc: https://www.mongodb.com/docs/manual/core/replica-set-elections/
  - id: e-iv-mg-staff-06
    engine: mongodb
    band: staff
    kind: concept
    q: { vi: "Rollback trong replica set là gì, khi nào xảy ra, và dữ liệu bị rollback đi đâu?", en: "What is a replica set rollback, when does it happen, and where does rolled-back data go?" }
    answer: { vi: "Khi primary cũ đã nhận những ghi chưa được đa số nhân bản rồi mất vai trò, primary mới không có các ghi đó. Khi nút cũ quay lại, nó phải hoàn tác các ghi ấy để khớp lịch sử mới: đó là rollback. Dữ liệu bị hoàn tác được ghi ra tệp BSON trong thư mục `rollback` để người vận hành xem và áp lại bằng tay nếu cần. Tránh bằng `w: 'majority'`: ghi đã được xác nhận theo đa số không bị rollback.", en: "When an old primary accepted writes not yet replicated to a majority and then lost its role, the new primary lacks them. When the old node returns, it must undo those writes to match the new history: that is a rollback. Undone data is written as BSON files into a `rollback` directory for operators to inspect and reapply by hand if needed. Avoid it with `w: 'majority'`: majority-acknowledged writes are never rolled back." }
    rubric:
      - { vi: "Điều kiện xảy ra rollback", en: "When rollback happens" }
      - { vi: "Dữ liệu ra tệp rollback", en: "Data goes to rollback files" }
      - { vi: "w: majority để tránh", en: "w: majority to avoid it" }
    doc: https://www.mongodb.com/docs/manual/core/replica-set-rollbacks/
  - id: e-iv-mg-staff-07
    engine: mongodb
    band: staff
    kind: concept
    q: { vi: "WiredTiger xử lý hai thao tác ghi đồng thời vào cùng một tài liệu thế nào? Ảnh hưởng gì tới thiết kế bộ đếm nóng?", en: "How does WiredTiger handle two concurrent writes to the same document? What does that mean for a hot counter design?" }
    answer: { vi: "WiredTiger dùng kiểm soát đồng thời mức tài liệu với cơ chế lạc quan: khi hai thao tác cùng sửa một tài liệu, một bên gặp write conflict và MongoDB tự thử lại nó trong nội bộ. Ghi trên nhiều tài liệu khác nhau chạy song song tốt. Một bộ đếm dùng chung (ví dụ lượt xem toàn trang) bị mọi request sửa cùng tài liệu, nên conflict và retry tăng, thông lượng bị giới hạn. Thiết kế: chia thành N tài liệu con (`counter_shard: rand(0..N-1)`) và cộng khi đọc, hoặc gom ở ứng dụng rồi `$inc` theo lô.", en: "WiredTiger uses document-level concurrency with an optimistic approach: when two operations modify one document, one hits a write conflict and MongoDB retries it internally. Writes to different documents run in parallel well. A shared counter (say site-wide page views) has every request modifying the same document, so conflicts and retries grow and throughput is capped. Design: split into N sub-documents (`counter_shard: rand(0..N-1)`) and sum on read, or aggregate in the app and `$inc` in batches." }
    rubric:
      - { vi: "Mức tài liệu, write conflict + retry nội bộ", en: "Document level, write conflict + internal retry" }
      - { vi: "Hệ quả với tài liệu nóng", en: "The hot-document consequence" }
      - { vi: "Bộ đếm chia nhỏ hoặc gom lô", en: "Sharded counter or batching" }
    doc: https://www.mongodb.com/docs/manual/core/wiredtiger/
  - id: e-iv-mg-staff-08
    engine: mongodb
    band: staff
    kind: diagnose
    q: { vi: "Trên cụm 6 shard, truy vấn đơn của một khách chậm hơn hẳn so với khi chưa shard. Đọc đoạn explain minh họa và chẩn đoán.", en: "On a 6-shard cluster, one customer's orders query is much slower than before sharding. Read the illustrative explain and diagnose." }
    exhibits:
      - label: { vi: "db.orders.find({ customer_id: 42 }), shard key { _id: 'hashed' }", en: "db.orders.find({ customer_id: 42 }), shard key { _id: 'hashed' }" }
        source: illustrative
        shown: |-
          queryPlanner: {
            winningPlan: {
              stage: 'SHARD_MERGE',
              shards: [
                { shardName: 'sh0', winningPlan: { stage: 'FETCH', inputStage: { stage: 'SHARDING_FILTER', inputStage: { stage: 'IXSCAN', keyPattern: { customer_id: 1 } } } } },
                { shardName: 'sh1', '...': '...' }, { shardName: 'sh2', '...': '...' },
                { shardName: 'sh3', '...': '...' }, { shardName: 'sh4', '...': '...' }, { shardName: 'sh5', '...': '...' }
              ]
            }
          }
    answer: { vi: "`SHARD_MERGE` trên cả 6 shard: truy vấn không chứa shard key (`_id` hashed) nên mongos phải gửi tới mọi shard (scatter-gather) rồi trộn kết quả; độ trễ = shard chậm nhất, và tải nhân 6. `SHARDING_FILTER` loại tài liệu mồ côi đang di chuyển chunk. Mỗi shard vẫn dùng chỉ mục `customer_id`, nên không phải lỗi chỉ mục mà lỗi chọn shard key. Sửa: shard key bắt đầu bằng `customer_id` (ví dụ `{ customer_id: 1, created: 1 }` qua `reshardCollection`), hoặc nếu truy vấn này hiếm thì chấp nhận.", en: "`SHARD_MERGE` across all 6 shards: the query lacks the shard key (hashed `_id`), so mongos sends it to every shard (scatter-gather) and merges; latency = the slowest shard, and load ×6. `SHARDING_FILTER` drops orphan documents from chunk migrations. Each shard still uses the `customer_id` index, so it is not an index problem but a shard-key choice. Fix: a shard key led by `customer_id` (for example `{ customer_id: 1, created: 1 }` via `reshardCollection`), or accept it if this query is rare." }
    rubric:
      - { vi: "Đọc SHARD_MERGE = scatter-gather", en: "Reads SHARD_MERGE = scatter-gather" }
      - { vi: "Biết SHARDING_FILTER làm gì", en: "Knows what SHARDING_FILTER does" }
      - { vi: "Kết luận đúng là vấn đề shard key", en: "Concludes it is a shard-key problem" }
    doc: https://www.mongodb.com/docs/manual/reference/explain-results/
  - id: e-iv-mg-staff-09
    engine: mongodb
    band: staff
    kind: diagnose
    q: { vi: "Explain của tra cứu theo `_id` trên MongoDB 8.0 cho stage `EXPRESS_IXSCAN`. Nó nghĩa là gì, và có cần làm gì không?", en: "Explain for a lookup by `_id` on MongoDB 8.0 shows an `EXPRESS_IXSCAN` stage. What does it mean, and is any action needed?" }
    exhibits:
      - label: { vi: "db.users.find({ _id: id }).explain() trên 8.0", en: "db.users.find({ _id: id }).explain() on 8.0" }
        source: illustrative
        shown: |-
          queryPlanner: {
            winningPlan: { isCached: false, stage: 'EXPRESS_IXSCAN', keyPattern: '{ _id: 1 }', indexName: '_id_' },
            rejectedPlans: []
          }
    answer: { vi: "Các stage `EXPRESS_*` (mới ở 8.0, theo trang Explain Results) là đường đi tắt cho truy vấn bằng đơn giản trên một chỉ mục `_id` hoặc chỉ mục duy nhất: bỏ qua bước lập kế hoạch thông thường. Đây là trạng thái tốt nhất có thể, không cần làm gì. Nếu một truy vấn tưởng là \"tra một tài liệu\" lại không ra stage express, kiểm xem có điều kiện thêm, projection phức tạp, hoặc collation khác chỉ mục không.", en: "The `EXPRESS_*` stages (new in 8.0 per the Explain Results page) are a fast path for simple equality queries on the `_id` index or a unique index: they skip normal planning. It is the best possible state, no action needed. If a supposed \"single-document lookup\" does not show an express stage, check for extra predicates, a complex projection, or a collation different from the index." }
    rubric:
      - { vi: "Biết EXPRESS là đường tắt 8.0", en: "Knows EXPRESS is the 8.0 fast path" }
      - { vi: "Kết luận không cần làm gì", en: "Concludes no action is needed" }
      - { vi: "Biết cách điều tra khi không có express", en: "Knows how to investigate when express is absent" }
    doc: https://www.mongodb.com/docs/manual/reference/explain-results/
  - id: e-iv-mg-staff-10
    engine: mongodb
    band: staff
    kind: diagnose
    q: { vi: "Nhật ký truy vấn chậm cho thấy một hình dạng truy vấn lúc nhanh lúc chậm, chu kỳ vài giờ. Hai trích đoạn (minh họa) dưới đây. Chẩn đoán và cách khóa kế hoạch.", en: "The slow query log shows one query shape alternating fast and slow every few hours. Two (illustrative) excerpts below. Diagnose and pin the plan." }
    exhibits:
      - label: { vi: "Lúc nhanh", en: "Fast period" }
        source: illustrative
        shown: |-
          planSummary: 'IXSCAN { tenant: 1, status: 1, created: -1 }', keysExamined: 52, docsExamined: 50, nreturned: 50, planCacheKey: '7A1C...'
      - label: { vi: "Lúc chậm", en: "Slow period" }
        source: illustrative
        shown: |-
          planSummary: 'IXSCAN { created: -1 }', keysExamined: 410233, docsExamined: 410233, nreturned: 50, planCacheKey: '7A1C...', replanned: true
    answer: { vi: "Cùng `planCacheKey` (cùng hình dạng) nhưng hai kế hoạch: khi được lập lại với một tenant nhỏ, chỉ mục `created` thắng trong vòng chạy thử (tìm đủ 50 nhanh), rồi được cache và áp lên tenant lớn: đọc 410.000 tài liệu. `replanned: true` là dấu hiệu. Sửa: ghim chỉ mục cho hình dạng này bằng `setQuerySettings` (8.0+, thay index filter cũ) hoặc `hint` trong code; tốt hơn là xóa chỉ mục `{ created: -1 }` nếu không truy vấn nào khác cần, để planner không còn lựa chọn tồi.", en: "Same `planCacheKey` (same shape) but two plans: when replanned with a small tenant, the `created` index wins the trial (finds 50 quickly), gets cached and is applied to a big tenant: 410,000 documents read. `replanned: true` is the tell. Fix: pin the index for this shape with `setQuerySettings` (8.0+, replacing old index filters) or a `hint` in code; better, drop the `{ created: -1 }` index if nothing else needs it, so the planner has no bad option." }
    rubric:
      - { vi: "Nhận ra cùng planCacheKey, khác kế hoạch", en: "Spots same planCacheKey, different plans" }
      - { vi: "Giải thích vòng chạy thử với tham số không đại diện", en: "Explains the trial with unrepresentative parameters" }
      - { vi: "setQuerySettings / hint / bỏ chỉ mục gây nhiễu", en: "setQuerySettings / hint / drop the distracting index" }
    doc: https://www.mongodb.com/docs/manual/core/query-plans/
  - id: e-iv-mg-staff-11
    engine: mongodb
    band: staff
    kind: design
    q: { vi: "Chuyển một hệ đặt phòng từ Postgres (15 bảng, nhiều JOIN) sang MongoDB. Bạn bắt đầu thế nào và quyết định nhúng/tham chiếu theo gì?", en: "Migrate a booking system from Postgres (15 tables, many JOINs) to MongoDB. How do you start and decide embed vs reference?" }
    answer: { vi: "Không dịch bảng thành collection. (1) Lập danh sách truy cập: mỗi màn/API đọc gì, tần suất, độ trễ yêu cầu, ghi gì cùng nhau. (2) Gom theo \"aggregate\": đặt phòng nhúng khách lưu trú, các đêm, giá đã chốt (đọc cùng nhau, có giới hạn, đổi cùng nhau); khách sạn và phòng tham chiếu vì dùng chung và đổi độc lập, kèm bản chụp tên/giá trong đặt phòng. (3) Mỗi truy vấn chính cần một chỉ mục ESR. (4) Phần cần ràng buộc chéo (không đặt trùng phòng) dùng tài liệu tồn phòng theo ngày + cập nhật có điều kiện. (5) Di chuyển bằng dual-read hoặc CDC, đối soát số liệu, rồi cắt.", en: "Do not translate tables into collections. (1) List access patterns: what each screen/API reads, how often, latency needs, what is written together. (2) Group by aggregate: a booking embeds guests, nights and locked prices (read together, bounded, change together); hotels and rooms are referenced since they are shared and change independently, with name/price snapshots in the booking. (3) Each main query gets an ESR index. (4) Cross-document rules (no double-booking) use per-day room inventory documents + conditional updates. (5) Migrate via dual-read or CDC, reconcile numbers, then cut over." }
    tradeoffs:
      - { vi: "Mô hình theo truy cập: đọc nhanh, nhưng truy vấn mới không lường trước có thể khó/đắt.", en: "Access-driven model: fast reads, but unforeseen new queries can be hard or costly." }
      - { vi: "Bản chụp dữ liệu tránh JOIN nhưng cần chính sách khi nguồn đổi.", en: "Snapshots avoid joins but need a policy when the source changes." }
    rubric:
      - { vi: "Bắt đầu từ danh sách truy cập", en: "Starts from access patterns" }
      - { vi: "Luật nhúng/tham chiếu có lý do", en: "Reasoned embed/reference rules" }
      - { vi: "Xử lý ràng buộc chéo tài liệu", en: "Handles cross-document constraints" }
      - { vi: "Kế hoạch di chuyển có đối soát", en: "Migration plan with reconciliation" }
    doc: https://www.mongodb.com/docs/manual/data-modeling/
  - id: e-iv-mg-staff-12
    engine: mongodb
    band: staff
    kind: design
    q: { vi: "Thiết kế luồng đồng bộ MongoDB → kho dữ liệu phân tích với độ trễ dưới 1 phút, chịu được dịch vụ đồng bộ chết vài giờ.", en: "Design a MongoDB → analytics warehouse sync with under 1 minute lag that survives the sync service being down for hours." }
    answer: { vi: "Change stream ở mức deployment/db, lấy `fullDocument: 'updateLookup'` (hoặc pre/post image từ 6.0) để có trạng thái sau thay đổi. Ghi sự kiện vào log bền (ví dụ hàng đợi có lưu trữ), lưu resume token sau khi log nhận xong. Kho dữ liệu nạp theo lô nhỏ, idempotent theo `_id` + thời điểm cluster. Để chịu vài giờ chết: oplog phải giữ lâu hơn thời gian chết tối đa (đặt `oplogMinRetentionHours` hoặc tăng kích thước oplog) và cảnh báo khi cửa sổ oplog thu hẹp. Nếu token rơi khỏi oplog: chụp lại toàn bộ rồi tiếp từ thời điểm chụp.", en: "A change stream at deployment/db level with `fullDocument: 'updateLookup'` (or pre/post images since 6.0) to get post-change state. Write events to a durable log (for example a retained queue), store the resume token once the log has them. The warehouse loads in small batches, idempotent on `_id` + cluster time. To survive hours of downtime: the oplog must retain longer than the maximum outage (set `oplogMinRetentionHours` or grow the oplog) with alerts when the oplog window shrinks. If the token falls off the oplog: take a full snapshot and continue from the snapshot time." }
    tradeoffs:
      - { vi: "updateLookup đọc lại tài liệu hiện tại, có thể mới hơn thay đổi đang xử lý; pre/post image chính xác hơn nhưng tốn chỗ.", en: "updateLookup rereads the current document, possibly newer than the change being processed; pre/post images are exact but cost storage." }
      - { vi: "Oplog lớn tốn đĩa trên mọi thành viên.", en: "A big oplog costs disk on every member." }
    rubric:
      - { vi: "Change stream + resume token bền", en: "Change stream + durable resume token" }
      - { vi: "Kích thước oplog theo thời gian chết", en: "Oplog sized to the outage" }
      - { vi: "Nạp idempotent và phương án snapshot", en: "Idempotent loads and a snapshot fallback" }
    doc: https://www.mongodb.com/docs/manual/changestreams/
  - id: e-iv-mg-staff-13
    engine: mongodb
    band: staff
    kind: concept
    q: { vi: "\"Cửa sổ oplog\" là gì và vì sao nó là chỉ số sống còn?", en: "What is the \"oplog window\" and why is it a critical metric?" }
    answer: { vi: "Oplog là collection giới hạn kích thước chứa các thao tác đã áp dụng; secondary và change stream đọc từ đó. Cửa sổ = khoảng thời gian giữa mục cũ nhất và mới nhất. Khi ghi tăng đột biến (backfill, nạp lớn), cửa sổ co lại. Nếu secondary tụt lại lâu hơn cửa sổ, nó phải đồng bộ lại từ đầu (initial sync); change stream có token cũ hơn cửa sổ không resume được. Theo dõi `rs.printReplicationInfo()` và độ trễ nhân bản; cấu hình kích thước/thời gian giữ tối thiểu.", en: "The oplog is a capped collection of applied operations; secondaries and change streams read from it. The window = time between its oldest and newest entries. Write bursts (backfills, bulk loads) shrink it. A secondary lagging longer than the window must resync from scratch (initial sync); a change stream with a token older than the window cannot resume. Watch `rs.printReplicationInfo()` and replication lag; configure size / minimum retention." }
    rubric:
      - { vi: "Định nghĩa oplog và cửa sổ", en: "Defines the oplog and the window" }
      - { vi: "Hai hậu quả: initial sync, change stream", en: "Two consequences: initial sync, change streams" }
      - { vi: "Cách theo dõi và cấu hình", en: "How to monitor and configure" }
    doc: https://www.mongodb.com/docs/manual/core/replica-set-oplog/
  - id: e-iv-mg-staff-14
    engine: mongodb
    band: staff
    kind: concept
    q: { vi: "Khi nào bạn khuyên **không** dùng MongoDB cho một hệ mới? Trả lời công bằng.", en: "When would you advise **against** MongoDB for a new system? Answer fairly." }
    answer: { vi: "Khi phần lớn giá trị nằm ở truy vấn ad hoc nối nhiều thực thể không lường trước (phân tích, báo cáo tự do), khi nghiệp vụ cần ràng buộc chéo nhiều thực thể ở mọi thao tác (sổ cái kế toán nhiều bảng), hoặc khi đội đã giỏi SQL và dữ liệu vốn quan hệ, ổn định. MongoDB mạnh khi tài liệu tự nhiên là đơn vị đọc/ghi, schema thay đổi nhanh, cần scale ngang theo khóa. Câu trả lời tốt nêu tiêu chí, không phải sở thích; và nhắc Postgres `jsonb` hay MongoDB transaction làm khoảng cách hẹp lại.", en: "When most value lies in ad hoc queries joining many entities in unforeseen ways (analytics, free-form reporting), when every operation needs cross-entity constraints (a multi-table accounting ledger), or when the team is strong in SQL and the data is relational and stable. MongoDB shines when the document is the natural read/write unit, the schema evolves fast, and horizontal scaling by key is needed. A good answer states criteria, not taste; and notes that Postgres `jsonb` and MongoDB transactions narrow the gap." }
    rubric:
      - { vi: "Ít nhất hai tình huống không hợp có lý do", en: "At least two reasoned unsuitable cases" }
      - { vi: "Nêu cả điểm mạnh để cân bằng", en: "States strengths too, for balance" }
      - { vi: "Dựa trên tiêu chí, không cảm tính", en: "Criteria-based, not taste" }
    doc: https://www.mongodb.com/docs/manual/data-modeling/
  - id: e-iv-mg-staff-15
    engine: mongodb
    band: staff
    kind: design
    q: { vi: "Thiết kế hộp thư chat: 50 triệu người dùng, cuộc trò chuyện 1-1 và nhóm tới 500 người, tải tin nhắn mới nhất nhanh, cuộn lịch sử.", en: "Design chat storage: 50 million users, 1-1 and group conversations up to 500 people, fast latest messages, history scrolling." }
    answer: { vi: "`messages`: `{ conv_id, ts, sender, body }`, chỉ mục `{ conv_id: 1, ts: -1 }`, có thể gom bucket theo khoảng thời gian (mẫu Group Data, ví dụ 100 tin mỗi tài liệu) để giảm số tài liệu. Shard key `{ conv_id: 1, ts: 1 }` (hoặc hashed `conv_id` nếu không cần chia cuộc trò chuyện lớn): mọi đọc một cuộc trò chuyện đi một shard. `conversations`: thành viên, tin cuối (bản chụp để hiện danh sách). `inbox` theo người: `{ user_id, conv_id, last_ts, unread }`, shard theo `user_id`, chỉ mục `{ user_id: 1, last_ts: -1 }` cho danh sách hộp thư. Gửi tin = chèn tin + cập nhật `inbox` của các thành viên (fan-out khi ghi, chấp nhận cho nhóm ≤ 500).", en: "`messages`: `{ conv_id, ts, sender, body }`, index `{ conv_id: 1, ts: -1 }`, optionally bucketed by time (Group Data pattern, say 100 messages per document) to cut document count. Shard key `{ conv_id: 1, ts: 1 }` (or hashed `conv_id` if big conversations need no splitting): reading one conversation hits one shard. `conversations`: members, last message (snapshot for listing). Per-user `inbox`: `{ user_id, conv_id, last_ts, unread }`, sharded by `user_id`, index `{ user_id: 1, last_ts: -1 }` for the inbox list. Sending = insert the message + update members' `inbox` rows (fan-out on write, acceptable for groups ≤ 500)." }
    tradeoffs:
      - { vi: "Fan-out khi ghi: đọc hộp thư rẻ, ghi nhóm 500 người tốn 500 cập nhật.", en: "Fan-out on write: cheap inbox reads, a 500-person group costs 500 updates per message." }
      - { vi: "Bucket tin nhắn giảm tài liệu nhưng sửa/xóa một tin phức tạp hơn.", en: "Message buckets cut documents but editing/deleting one message is more complex." }
    rubric:
      - { vi: "Shard key theo cuộc trò chuyện cho tin nhắn", en: "Conversation-based shard key for messages" }
      - { vi: "Hộp thư theo người với chỉ mục sắp xếp", en: "Per-user inbox with a sort index" }
      - { vi: "Nêu fan-out và giới hạn nhóm", en: "States fan-out and the group-size limit" }
    doc: https://www.mongodb.com/docs/manual/core/sharding-choose-a-shard-key/

  # ---------------- DynamoDB · junior
  - id: e-iv-dy-junior-01
    engine: dynamodb
    band: junior
    kind: concept
    q: { vi: "Khóa chính đơn (chỉ partition key) và khóa chính kép (partition key + sort key) khác nhau thế nào? Item collection là gì?", en: "How does a simple primary key (partition key only) differ from a composite one (partition key + sort key)? What is an item collection?" }
    answer: { vi: "Khóa đơn: mỗi giá trị partition key là đúng một item, chỉ tra được bằng GetItem theo khóa đầy đủ. Khóa kép: nhiều item chung partition key, phân biệt và **được sắp xếp** theo sort key; DynamoDB băm partition key để chọn partition vật lý. Các item chung partition key là một item collection: `Query` đọc cả nhóm hoặc một khoảng sort key trong nhóm (`begins_with`, `BETWEEN`, `>`) theo thứ tự, rất rẻ.", en: "Simple key: each partition key value is exactly one item, reachable by GetItem with the full key. Composite key: many items share a partition key, distinguished and **sorted** by the sort key; DynamoDB hashes the partition key to pick the physical partition. Items sharing a partition key form an item collection: a `Query` reads the whole group or a sort-key range within it (`begins_with`, `BETWEEN`, `>`) in order, cheaply." }
    rubric:
      - { vi: "Phân biệt đúng hai loại khóa", en: "Distinguishes the two key types" }
      - { vi: "Băm partition key, sắp theo sort key", en: "Partition key hashed, sort key ordered" }
      - { vi: "Định nghĩa item collection và Query trên nó", en: "Defines item collections and Query over them" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.Partitions.html
  - id: e-iv-dy-junior-02
    engine: dynamodb
    band: junior
    kind: concept
    q: { vi: "`Query` và `Scan` khác nhau thế nào? Khi nào `Scan` chấp nhận được?", en: "How do `Query` and `Scan` differ? When is a `Scan` acceptable?" }
    answer: { vi: "`Query` cần một giá trị partition key (và tùy chọn điều kiện sort key), chỉ đọc item trong một item collection. `Scan` đọc mọi item của bảng/chỉ mục, tốn dung lượng đọc theo kích thước toàn bảng, trang 1 MB mỗi lần. Scan chấp nhận được cho bảng rất nhỏ, job nền không gấp (có giới hạn tốc độ), hoặc xuất dữ liệu; còn đường đi chính của ứng dụng phải là Query/GetItem. Muốn phân tích toàn bảng thì dùng export sang S3.", en: "`Query` needs one partition key value (and optionally a sort key condition) and reads only items in one item collection. `Scan` reads every item of the table/index, costing read capacity for the whole table size, 1 MB per page. A scan is acceptable for very small tables, non-urgent background jobs (rate limited), or exports; the app's main paths must be Query/GetItem. For full-table analytics, export to S3." }
    rubric:
      - { vi: "Query một partition vs Scan toàn bảng", en: "Query one partition vs Scan all" }
      - { vi: "Chi phí Scan theo kích thước bảng", en: "Scan cost by table size" }
      - { vi: "Trường hợp hợp lệ cho Scan", en: "Valid cases for Scan" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-query-scan.html
  - id: e-iv-dy-junior-03
    engine: dynamodb
    band: junior
    kind: concept
    q: { vi: "Kích thước tối đa một item là bao nhiêu? Vì sao tên thuộc tính dài cũng tốn tiền?", en: "What is the maximum item size? Why do long attribute names cost money too?" }
    answer: { vi: "400 KB mỗi item, tính cả độ dài tên thuộc tính lẫn giá trị (UTF-8). Vì mỗi item lưu kèm tên thuộc tính của nó, tên dài làm item to hơn: tốn lưu trữ và tốn RCU/WCU (làm tròn theo 4 KB khi đọc, 1 KB khi ghi). Với bảng hàng tỉ item, đặt tên ngắn nhưng vẫn đọc được là đáng. Dữ liệu lớn (ảnh, tài liệu) để trên S3 và lưu đường dẫn.", en: "400 KB per item, counting both attribute name lengths and values (UTF-8). Since every item stores its own attribute names, long names make items bigger: more storage and more RCU/WCU (rounded to 4 KB for reads, 1 KB for writes). On tables with billions of items, short but readable names pay off. Large blobs (images, documents) go to S3 with a pointer stored." }
    rubric:
      - { vi: "Đúng 400 KB, tính cả tên", en: "Correct 400 KB, names included" }
      - { vi: "Nối với RCU/WCU và lưu trữ", en: "Ties it to RCU/WCU and storage" }
      - { vi: "Biết để dữ liệu lớn trên S3", en: "Knows to keep large data in S3" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Constraints.html
  - id: e-iv-dy-junior-04
    engine: dynamodb
    band: junior
    kind: concept
    q: { vi: "Đọc eventually consistent và strongly consistent khác nhau thế nào? Chỉ mục nào không cho đọc strongly consistent?", en: "How do eventually consistent and strongly consistent reads differ? Which indexes do not allow strongly consistent reads?" }
    answer: { vi: "Eventually consistent (mặc định): có thể chưa thấy ghi vừa xong, tốn nửa RCU. Strongly consistent (`ConsistentRead: true`): thấy mọi ghi đã thành công trước đó, tốn 1 RCU mỗi 4 KB, có thể lỗi khi mạng gián đoạn. GSI chỉ cho eventually consistent (được cập nhật bất đồng bộ); LSI và bảng gốc cho cả hai. Global tables giữa các vùng cũng là eventual.", en: "Eventually consistent (default): may not yet reflect a just-finished write, costs half an RCU. Strongly consistent (`ConsistentRead: true`): reflects every prior successful write, costs 1 RCU per 4 KB, may fail during network trouble. GSIs only allow eventually consistent reads (they are updated asynchronously); LSIs and the base table allow both. Cross-region global tables are eventual as well." }
    rubric:
      - { vi: "Khác biệt về dữ liệu thấy được", en: "Difference in what is visible" }
      - { vi: "Khác biệt chi phí 0,5 vs 1", en: "Cost difference 0.5 vs 1" }
      - { vi: "GSI chỉ eventual", en: "GSI is eventual only" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.ReadConsistency.html
  - id: e-iv-dy-junior-05
    engine: dynamodb
    band: junior
    kind: concept
    q: { vi: "Giải thích RCU và WCU với quy tắc làm tròn.", en: "Explain RCU and WCU with their rounding rules." }
    answer: { vi: "1 RCU = một lần đọc strongly consistent mỗi giây cho item tới 4 KB (eventual: hai lần; transactional: cần 2 RCU). 1 WCU = một lần ghi mỗi giây cho item tới 1 KB (transactional: 2 WCU). Kích thước làm tròn lên: item 4,1 KB đọc strong tốn 2 RCU; item 1,1 KB ghi tốn 2 WCU. Với `Query`/`Scan`, kích thước cộng dồn mọi item đã đọc rồi mới làm tròn lên 4 KB; với `BatchGetItem` thì làm tròn từng item.", en: "1 RCU = one strongly consistent read per second of an item up to 4 KB (eventual: two reads; transactional: needs 2 RCU). 1 WCU = one write per second of an item up to 1 KB (transactional: 2 WCU). Sizes round up: a 4.1 KB item costs 2 RCU strongly consistent; a 1.1 KB write costs 2 WCU. For `Query`/`Scan`, the sizes of all items read are summed and then rounded up to 4 KB; `BatchGetItem` rounds each item." }
    rubric:
      - { vi: "Đúng đơn vị 4 KB / 1 KB", en: "Correct 4 KB / 1 KB units" }
      - { vi: "Hệ số eventual/transactional", en: "Eventual/transactional factors" }
      - { vi: "Làm tròn từng item vs cộng dồn với Query", en: "Per-item rounding vs summed for Query" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/CapacityUnitCalculations.html
  - id: e-iv-dy-junior-06
    engine: dynamodb
    band: junior
    kind: concept
    q: { vi: "Đăng ký người dùng: làm sao để `PutItem` không ghi đè người dùng đã tồn tại?", en: "User sign-up: how do you make `PutItem` not overwrite an existing user?" }
    answer: { vi: "Thêm điều kiện: `ConditionExpression: 'attribute_not_exists(pk)'`. Nếu item với khóa đó đã có, DynamoDB từ chối với `ConditionalCheckFailedException` (lần thử thất bại vẫn tốn WCU). Mặc định `PutItem` ghi đè toàn bộ item cùng khóa mà không báo gì. Cùng cách này dùng cho khóa lạc quan (`version = :v`) và chặn số dư âm.", en: "Add a condition: `ConditionExpression: 'attribute_not_exists(pk)'`. If an item with that key exists, DynamoDB rejects it with `ConditionalCheckFailedException` (the failed attempt still consumes WCU). By default `PutItem` silently replaces any item with the same key. The same technique drives optimistic locking (`version = :v`) and preventing negative balances." }
    rubric:
      - { vi: "attribute_not_exists trên khóa", en: "attribute_not_exists on the key" }
      - { vi: "Biết Put mặc định ghi đè", en: "Knows Put overwrites by default" }
      - { vi: "Biết lỗi trả về và vẫn tốn WCU", en: "Knows the error and that WCU is still consumed" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/WorkingWithItems.html
  - id: e-iv-dy-junior-07
    engine: dynamodb
    band: junior
    kind: concept
    q: { vi: "Vì sao với DynamoDB người ta nói \"liệt kê access pattern trước, thiết kế khóa sau\"?", en: "Why do people say \"list access patterns first, design keys later\" for DynamoDB?" }
    answer: { vi: "DynamoDB không có JOIN và không có truy vấn ad hoc rẻ: chỉ đọc hiệu quả được theo khóa chính hoặc khóa của chỉ mục phụ. Nếu thiết kế bảng trước rồi mới nghĩ truy vấn, truy vấn mới thường thành Scan. Vì vậy liệt kê mọi câu hỏi ứng dụng sẽ hỏi (\"đơn của khách X theo ngày\", \"đơn đang giao của kho Y\"), tần suất và độ trễ, rồi chọn partition key/sort key/GSI để mỗi câu là một Query hoặc GetItem.", en: "DynamoDB has no JOINs and no cheap ad hoc queries: efficient reads go only through the primary key or a secondary index key. Design the table first and new queries usually end up as Scans. So list every question the app will ask (\"orders of customer X by date\", \"in-transit orders of warehouse Y\"), with frequency and latency, then choose partition key/sort key/GSIs so each one is a Query or GetItem." }
    rubric:
      - { vi: "Không JOIN, chỉ đọc theo khóa", en: "No JOINs, reads only by key" }
      - { vi: "Hệ quả: truy vấn không lường trước thành Scan", en: "Consequence: unplanned queries become Scans" }
      - { vi: "Ví dụ access pattern cụ thể", en: "Concrete access pattern examples" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-general-nosql-design.html
  - id: e-iv-dy-junior-08
    engine: dynamodb
    band: junior
    kind: concept
    q: { vi: "On-demand và provisioned capacity: chọn thế nào cho một sản phẩm mới chưa biết tải?", en: "On-demand vs provisioned capacity: which for a new product with unknown traffic?" }
    answer: { vi: "On-demand: trả theo từng request, tự co giãn, không cần dự báo; hợp với tải chưa biết, có đỉnh nhọn, hoặc thường xuyên nhàn rỗi. Provisioned: đặt trước RCU/WCU (có thể auto scaling), rẻ hơn khi tải đều và dự báo được, nhưng thiếu thì bị throttle. Sản phẩm mới: bắt đầu on-demand, đo tải thật vài tuần, rồi chuyển provisioned nếu tải ổn định và tiết kiệm đáng kể (có giới hạn số lần đổi chế độ).", en: "On-demand: pay per request, scales automatically, no forecasting; fits unknown, spiky or often idle traffic. Provisioned: reserve RCU/WCU (optionally with auto scaling), cheaper for steady, predictable traffic, but under-provisioning throttles. New product: start on-demand, measure real traffic for a few weeks, then switch to provisioned if traffic is steady and the saving is significant (mode switches are limited in frequency)." }
    rubric:
      - { vi: "Đặc điểm từng chế độ", en: "Characteristics of each mode" }
      - { vi: "Chọn on-demand cho tải chưa biết", en: "Picks on-demand for unknown traffic" }
      - { vi: "Biết chuyển sau khi đo", en: "Knows to switch after measuring" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/capacity-mode.html
  - id: e-iv-dy-junior-09
    engine: dynamodb
    band: junior
    kind: diagnose
    q: { vi: "Một `GetItem` đọc hồ sơ 6 KB. Tính RCU cho ba kiểu đọc: eventually consistent, strongly consistent, và trong transaction.", en: "A `GetItem` reads a 6 KB profile. Compute RCU for three read types: eventually consistent, strongly consistent, and transactional." }
    exhibits:
      - label: { vi: "Đầu vào", en: "Input" }
        source: aws-rules
        shown: "GetItem, item size = 6 KB; 1 RCU = 1 strongly consistent read of up to 4 KB"
        calc:
          - { expr: "Math.ceil(6 / 4) * 0.5", expect: 1 }
          - { expr: "Math.ceil(6 / 4) * 1", expect: 2 }
          - { expr: "Math.ceil(6 / 4) * 2", expect: 4 }
    answer: { vi: "6 KB làm tròn lên 2 khối 4 KB. Eventually consistent: 2 × 0,5 = 1 RCU. Strongly consistent: 2 RCU. Transactional (`TransactGetItems`): 2 × 2 = 4 RCU. Nếu hồ sơ giảm xuống ≤ 4 KB (ví dụ bỏ trường ít dùng sang item khác), chi phí mỗi lần đọc giảm một nửa.", en: "6 KB rounds up to 2 blocks of 4 KB. Eventually consistent: 2 × 0.5 = 1 RCU. Strongly consistent: 2 RCU. Transactional (`TransactGetItems`): 2 × 2 = 4 RCU. If the profile shrank to ≤ 4 KB (say by moving rarely used fields to another item), every read would cost half." }
    rubric:
      - { vi: "Làm tròn 6 KB → 2 khối", en: "Rounds 6 KB → 2 blocks" }
      - { vi: "Đúng cả ba con số 1 / 2 / 4", en: "All three numbers 1 / 2 / 4 right" }
      - { vi: "Gợi ý giảm kích thước item", en: "Suggests shrinking the item" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/CapacityUnitCalculations.html
  - id: e-iv-dy-junior-10
    engine: dynamodb
    band: junior
    kind: diagnose
    q: { vi: "Mỗi lần ghi một bản ghi nhật ký 2,5 KB. Ứng dụng ghi 200 bản ghi mỗi giây. Cần bao nhiêu WCU (provisioned), và nếu bọc trong transaction thì sao?", en: "Each log record write is 2.5 KB. The app writes 200 records per second. How many WCU (provisioned) are needed, and what if each is wrapped in a transaction?" }
    exhibits:
      - label: { vi: "Đầu vào", en: "Input" }
        source: aws-rules
        shown: "PutItem, item size = 2.5 KB, 200 writes/s; 1 WCU = 1 write/s of up to 1 KB"
        calc:
          - { expr: "Math.ceil(2.5 / 1)", expect: 3 }
          - { expr: "Math.ceil(2.5 / 1) * 200", expect: 600 }
          - { expr: "Math.ceil(2.5 / 1) * 2 * 200", expect: 1200 }
    answer: { vi: "2,5 KB làm tròn lên 3 KB = 3 WCU mỗi lần ghi; 200 lần/giây = 600 WCU. Trong transaction mỗi lần ghi tốn gấp đôi: 1.200 WCU. Gợi ý: nén hoặc rút gọn bản ghi xuống ≤ 2 KB tiết kiệm một phần ba; nhật ký thường không cần transaction.", en: "2.5 KB rounds up to 3 KB = 3 WCU per write; 200 per second = 600 WCU. In a transaction each write costs double: 1,200 WCU. Hint: compressing or trimming records to ≤ 2 KB saves a third; logs rarely need transactions." }
    rubric:
      - { vi: "Làm tròn lên 3 WCU", en: "Rounds up to 3 WCU" }
      - { vi: "600 và 1.200 đúng", en: "600 and 1,200 correct" }
      - { vi: "Gợi ý tối ưu hợp lý", en: "A sensible optimisation" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/CapacityUnitCalculations.html
  - id: e-iv-dy-junior-11
    engine: dynamodb
    band: junior
    kind: diagnose
    q: { vi: "API \"đơn bị hủy\" dùng `Scan` với `FilterExpression` và trả về `Count: 10, ScannedCount: 5000`. Item trung bình 0,8 KB, đọc eventually consistent. Tính chi phí và giải thích vì sao bộ lọc không giúp.", en: "The \"cancelled orders\" API uses a `Scan` with a `FilterExpression` and returns `Count: 10, ScannedCount: 5000`. Items average 0.8 KB, eventually consistent. Compute the cost and explain why the filter does not help." }
    exhibits:
      - label: { vi: "Tổng của các trang Scan (cộng từ các phản hồi)", en: "Totals across the Scan pages (summed from the responses)" }
        source: aws-rules
        shown: |-
          summed over all pages: Count 10, ScannedCount 5000, ConsumedCapacity 500
          item size ~ 0.8 KB; eventually consistent; 1 MB page limit
        calc:
          - { expr: "5000 * 0.8", expect: 4000 }
          - { expr: "Math.ceil(5000 * 0.8 / 4) * 0.5", expect: 500 }
          - { expr: "Math.ceil(5000 * 0.8 / 1024)", expect: 4 }
    answer: { vi: "Cộng qua các trang, Scan đọc 5.000 item × 0,8 KB = 4.000 KB → 1.000 khối 4 KB × 0,5 = 500 RCU, rồi mới lọc giữ 10. `FilterExpression` chạy **sau** khi đọc, nên tính tiền theo `ScannedCount`, không theo `Count`. 4.000 KB cũng vượt trang 1 MB, nên thực tế cần ít nhất 4 lượt gọi với `LastEvaluatedKey`. Sửa: GSI thưa có khóa chỉ được đặt trên đơn bị hủy (ví dụ `cancelled_at`), Query trên nó chỉ đọc 10 item.", en: "Summed over its pages, the scan reads 5,000 items × 0.8 KB = 4,000 KB → 1,000 blocks of 4 KB × 0.5 = 500 RCU, then filters down to 10. `FilterExpression` runs **after** reading, so you pay for `ScannedCount`, not `Count`. 4,000 KB also exceeds the 1 MB page, so it really takes at least 4 calls with `LastEvaluatedKey`. Fix: a sparse GSI whose key is set only on cancelled orders (say `cancelled_at`); a Query on it reads just 10 items." }
    rubric:
      - { vi: "Tính đúng 500 RCU", en: "Computes 500 RCU correctly" }
      - { vi: "Bộ lọc chạy sau khi đọc, trả theo ScannedCount", en: "Filter runs after reading, you pay for ScannedCount" }
      - { vi: "Nhắc phân trang 1 MB", en: "Mentions 1 MB paging" }
      - { vi: "Đề xuất GSI thưa", en: "Proposes a sparse GSI" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-query-scan.html
  - id: e-iv-dy-junior-12
    engine: dynamodb
    band: junior
    kind: concept
    q: { vi: "`KeyConditionExpression` và `FilterExpression` khác nhau thế nào?", en: "How do `KeyConditionExpression` and `FilterExpression` differ?" }
    answer: { vi: "`KeyConditionExpression` chọn những item sẽ được đọc: bằng trên partition key và (tùy chọn) một điều kiện trên sort key (`=`, `<`, `BETWEEN`, `begins_with`…). Nó quyết định chi phí. `FilterExpression` loại item **sau** khi đã đọc, trên bất kỳ thuộc tính nào; nó chỉ giảm dữ liệu trả về, không giảm RCU. Trường lọc thường xuyên nên đưa vào sort key hoặc khóa của GSI.", en: "`KeyConditionExpression` selects which items are read: equality on the partition key and (optionally) one sort key condition (`=`, `<`, `BETWEEN`, `begins_with`…). It decides the cost. `FilterExpression` drops items **after** they are read, on any attribute; it only reduces the data returned, not the RCU. Frequently filtered fields belong in the sort key or a GSI key." }
    rubric:
      - { vi: "Key condition quyết định item đọc", en: "Key condition decides items read" }
      - { vi: "Filter chạy sau, không giảm RCU", en: "Filter runs after, saves no RCU" }
      - { vi: "Đưa trường lọc thường xuyên vào khóa", en: "Moves frequent filters into keys" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Query.html
  - id: e-iv-dy-junior-13
    engine: dynamodb
    band: junior
    kind: concept
    q: { vi: "Một `Query` trả về 200 item nhưng tài liệu nói khách đó có 5.000 đơn. Chuyện gì xảy ra?", en: "A `Query` returns 200 items but the customer has 5,000 orders. What happened?" }
    answer: { vi: "Mỗi lần gọi `Query`/`Scan` đọc tối đa 1 MB dữ liệu (trước khi lọc) hoặc tới `Limit`. Nếu còn, phản hồi có `LastEvaluatedKey`; phải gọi lại với `ExclusiveStartKey` bằng giá trị đó cho tới khi không còn `LastEvaluatedKey`. Ứng dụng quên vòng lặp này sẽ lặng lẽ trả thiếu dữ liệu. SDK có paginator làm sẵn.", en: "Each `Query`/`Scan` call reads at most 1 MB of data (before filtering) or up to `Limit`. If more remains, the response carries `LastEvaluatedKey`; call again with `ExclusiveStartKey` set to it until no `LastEvaluatedKey` comes back. An app that forgets this loop silently returns partial data. SDKs offer paginators." }
    rubric:
      - { vi: "Giới hạn 1 MB mỗi lần gọi", en: "1 MB per call limit" }
      - { vi: "Lặp với LastEvaluatedKey / ExclusiveStartKey", en: "LastEvaluatedKey / ExclusiveStartKey" }
      - { vi: "Nêu rủi ro thiếu dữ liệu lặng lẽ", en: "States the silent partial-data risk" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Query.Pagination.html
  - id: e-iv-dy-junior-14
    engine: dynamodb
    band: junior
    kind: concept
    q: { vi: "DynamoDB có những kiểu dữ liệu nào? Khi nào dùng String Set thay vì List?", en: "What data types does DynamoDB have? When would you use a String Set instead of a List?" }
    answer: { vi: "Vô hướng: String, Number (tới 38 chữ số, truyền dạng chuỗi), Binary, Boolean, Null. Tài liệu: Map, List (lồng tới 32 tầng). Tập: String Set, Number Set, Binary Set (phần tử duy nhất, không thứ tự, không rỗng). Dùng Set khi cần tập không trùng và thao tác `ADD`/`DELETE` nguyên tử phần tử (ví dụ thẻ của bài viết); dùng List khi cần thứ tự hoặc trùng lặp. Khóa chính chỉ được là String, Number hoặc Binary.", en: "Scalars: String, Number (up to 38 digits, sent as strings), Binary, Boolean, Null. Documents: Map, List (nested up to 32 levels). Sets: String Set, Number Set, Binary Set (unique, unordered, non-empty). Use a Set when you need no duplicates and atomic element `ADD`/`DELETE` (say a post's tags); use a List when order or duplicates matter. Key attributes can only be String, Number or Binary." }
    rubric:
      - { vi: "Kể đủ ba nhóm kiểu", en: "Names the three type groups" }
      - { vi: "So Set vs List đúng", en: "Compares Set vs List correctly" }
      - { vi: "Biết kiểu được phép cho khóa", en: "Knows the allowed key types" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.NamingRulesDataTypes.html
  - id: e-iv-dy-junior-15
    engine: dynamodb
    band: junior
    kind: design
    q: { vi: "Bảng người dùng có khóa `user_id`. Cần đăng nhập bằng email và email phải duy nhất. DynamoDB không có ràng buộc UNIQUE. Thiết kế.", en: "A users table is keyed by `user_id`. Login must work by email and emails must be unique. DynamoDB has no UNIQUE constraint. Design it." }
    answer: { vi: "Hai item cho mỗi người dùng: `pk = USER#<id>` (hồ sơ) và `pk = EMAIL#<email>` (chỉ chứa `user_id`). Đăng ký bằng `TransactWriteItems` gồm hai `Put`, mỗi cái có `attribute_not_exists(pk)`: email trùng làm cả transaction thất bại. Đăng nhập: `GetItem EMAIL#<email>` rồi `GetItem USER#<id>` (hoặc nhúng các trường cần cho đăng nhập vào item email). Đổi email: transaction xóa item email cũ, tạo item mới có điều kiện, cập nhật hồ sơ. Chuẩn hóa email (chữ thường) trước khi làm khóa.", en: "Two items per user: `pk = USER#<id>` (profile) and `pk = EMAIL#<email>` (holding just `user_id`). Sign-up uses `TransactWriteItems` with two `Put`s, each with `attribute_not_exists(pk)`: a duplicate email fails the whole transaction. Login: `GetItem EMAIL#<email>` then `GetItem USER#<id>` (or copy login fields into the email item). Changing email: a transaction deleting the old email item, conditionally creating the new one, updating the profile. Normalise emails (lower case) before using them as keys." }
    tradeoffs:
      - { vi: "Transaction tốn gấp đôi WCU nhưng là cách duy nhất bảo đảm duy nhất.", en: "The transaction costs double WCU but is the only way to guarantee uniqueness." }
      - { vi: "GSI trên email không chặn được trùng (GSI không có ràng buộc và cập nhật bất đồng bộ).", en: "A GSI on email cannot prevent duplicates (no constraints, updated asynchronously)." }
    rubric:
      - { vi: "Item khóa email riêng", en: "A separate email key item" }
      - { vi: "Dùng transaction + attribute_not_exists", en: "Transaction + attribute_not_exists" }
      - { vi: "Biết GSI không giải quyết duy nhất", en: "Knows a GSI does not solve uniqueness" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/transaction-apis.html

  # ---------------- DynamoDB · mid
  - id: e-iv-dy-mid-01
    engine: dynamodb
    band: mid
    kind: concept
    q: { vi: "So sánh GSI và LSI: khóa, thời điểm tạo, tính nhất quán, giới hạn.", en: "Compare GSI and LSI: keys, when created, consistency, limits." }
    answer: { vi: "LSI: cùng partition key với bảng, sort key khác; chỉ tạo được lúc tạo bảng; cho đọc strongly consistent; dùng chung dung lượng với bảng; item collection (bảng + LSI) giới hạn 10 GB mỗi giá trị partition key; tối đa 5. GSI: partition key và sort key bất kỳ; tạo/xóa bất cứ lúc nào; chỉ eventually consistent; có dung lượng riêng (provisioned); hạn mức mặc định 20 mỗi bảng. Thực tế GSI được dùng nhiều hơn; LSI chỉ khi cần đọc strongly consistent theo thứ tự khác trong cùng partition.", en: "LSI: same partition key as the table, different sort key; only at table creation; allows strongly consistent reads; shares the table's capacity; the item collection (table + LSIs) is limited to 10 GB per partition key value; at most 5. GSI: any partition and sort key; created/deleted anytime; eventually consistent only; its own capacity (provisioned); default quota 20 per table. In practice GSIs are far more common; LSIs only when you need strongly consistent reads in another order within a partition." }
    rubric:
      - { vi: "Khác biệt khóa và thời điểm tạo", en: "Key and creation-time differences" }
      - { vi: "Nhất quán: LSI strong được, GSI không", en: "Consistency: LSI can be strong, GSI cannot" }
      - { vi: "Giới hạn 10 GB của LSI", en: "LSI's 10 GB limit" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/SecondaryIndexes.html
  - id: e-iv-dy-mid-02
    engine: dynamodb
    band: mid
    kind: concept
    q: { vi: "Projection của GSI (`KEYS_ONLY`, `INCLUDE`, `ALL`) ảnh hưởng chi phí thế nào?", en: "How does a GSI projection (`KEYS_ONLY`, `INCLUDE`, `ALL`) affect cost?" }
    answer: { vi: "GSI lưu bản sao các thuộc tính được chiếu. `ALL`: đọc từ GSI là đủ mọi thứ, nhưng lưu trữ gấp đôi và mỗi lần ghi bảng tốn WCU cho GSI theo kích thước item đầy đủ. `KEYS_ONLY`: GSI nhỏ, ghi rẻ, nhưng cần thêm GetItem vào bảng để lấy thuộc tính khác (thêm RCU và độ trễ). `INCLUDE`: chỉ chiếu thuộc tính truy vấn cần, thường là điểm cân bằng tốt. Cũng nhớ: thay đổi thuộc tính không được chiếu và không phải khóa thì không tốn ghi GSI.", en: "A GSI stores copies of projected attributes. `ALL`: reading from the GSI gives everything, but storage doubles and every table write costs GSI WCU for the full item size. `KEYS_ONLY`: small GSI, cheap writes, but other attributes need an extra GetItem on the table (more RCU and latency). `INCLUDE`: project only what the query needs, usually the sweet spot. Also: changing an attribute that is neither projected nor a key costs no GSI write." }
    rubric:
      - { vi: "Ba loại và nội dung", en: "The three types and content" }
      - { vi: "Đánh đổi ghi/lưu trữ vs đọc thêm", en: "Write/storage vs extra-read trade-off" }
      - { vi: "Biết thay đổi thuộc tính không chiếu thì không ghi GSI", en: "Knows unprojected changes skip GSI writes" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GSI.html
  - id: e-iv-dy-mid-03
    engine: dynamodb
    band: mid
    kind: concept
    q: { vi: "\"Chỉ mục thưa\" (sparse index) trong DynamoDB là gì và dùng cho việc gì?", en: "What is a \"sparse index\" in DynamoDB and what is it for?" }
    answer: { vi: "Item chỉ xuất hiện trong GSI khi nó có thuộc tính khóa của GSI. Nếu chỉ đặt thuộc tính đó cho một tập con (ví dụ `open_ticket_at` chỉ có trên vé đang mở, xóa khi đóng), GSI chỉ chứa tập con: Query hoặc thậm chí Scan GSI đó rất rẻ. Dùng cho hàng đợi, \"việc cần xử lý\", cờ hiếm. Bỏ thuộc tính (REMOVE) là cách đưa item ra khỏi chỉ mục.", en: "An item appears in a GSI only if it has the GSI's key attributes. Set that attribute on a subset only (say `open_ticket_at` present on open tickets, removed on close) and the GSI holds just that subset: querying or even scanning it is cheap. Used for queues, \"to-do\" items, rare flags. Removing the attribute (REMOVE) takes the item out of the index." }
    rubric:
      - { vi: "Item thiếu thuộc tính khóa không vào GSI", en: "Items without the key attribute are not in the GSI" }
      - { vi: "Ví dụ cụ thể", en: "Concrete example" }
      - { vi: "Biết cách đưa item ra khỏi chỉ mục", en: "Knows how to remove an item from the index" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-indexes-general-sparse-indexes.html
  - id: e-iv-dy-mid-04
    engine: dynamodb
    band: mid
    kind: concept
    q: { vi: "`BatchWriteItem` trả về thành công nhưng một phần dữ liệu không được ghi. Vì sao, và xử lý thế nào?", en: "`BatchWriteItem` returns success but some data was not written. Why, and how do you handle it?" }
    answer: { vi: "Batch tối đa 25 thao tác Put/Delete (16 MB) và không nguyên tử: mỗi item thành công hoặc thất bại riêng. Khi bị throttle hoặc lỗi nội bộ, các item chưa ghi nằm trong `UnprocessedItems` của phản hồi thành công. Phải gửi lại chúng với exponential backoff (và jitter) cho tới khi rỗng. Batch không có Update và không có điều kiện; cần nguyên tử hoặc điều kiện thì dùng `TransactWriteItems`.", en: "A batch holds at most 25 Put/Delete operations (16 MB) and is not atomic: each item succeeds or fails on its own. Under throttling or internal errors, unwritten items come back in `UnprocessedItems` of a successful response. Resend them with exponential backoff (and jitter) until empty. Batches have no Update and no conditions; for atomicity or conditions use `TransactWriteItems`." }
    rubric:
      - { vi: "Giới hạn 25 và không nguyên tử", en: "25 limit and non-atomic" }
      - { vi: "Gửi lại UnprocessedItems với backoff", en: "UnprocessedItems + backoff" }
      - { vi: "Biết khi nào dùng transaction thay thế", en: "Knows when to use a transaction instead" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/WorkingWithItems.html
  - id: e-iv-dy-mid-05
    engine: dynamodb
    band: mid
    kind: concept
    q: { vi: "`TransactWriteItems`: giới hạn, chi phí và cách làm cho việc gọi lại an toàn.", en: "`TransactWriteItems`: limits, cost, and how to make retries safe." }
    answer: { vi: "Tối đa 100 thao tác (Put, Update, Delete, ConditionCheck) trên các item khác nhau, tổng tối đa 4 MB, trong cùng tài khoản và vùng; tất cả thành công hoặc không gì cả. Chi phí gấp đôi (2 WCU mỗi KB). Xung đột với transaction khác hoặc điều kiện sai làm hủy (`TransactionCanceledException` kèm lý do từng thao tác). Gọi lại an toàn bằng `ClientRequestToken`: cùng token trong 10 phút thì DynamoDB coi là cùng một yêu cầu và không áp dụng lần nữa.", en: "Up to 100 operations (Put, Update, Delete, ConditionCheck) on distinct items, at most 4 MB total, same account and region; all succeed or none do. Costs double (2 WCU per KB). Conflicts with other transactions or failed conditions cancel it (`TransactionCanceledException` with per-operation reasons). Safe retries via `ClientRequestToken`: the same token within 10 minutes is treated as the same request and not applied again." }
    rubric:
      - { vi: "Giới hạn 100 thao tác / 4 MB", en: "100 operations / 4 MB limit" }
      - { vi: "Chi phí gấp đôi", en: "Double cost" }
      - { vi: "ClientRequestToken 10 phút", en: "ClientRequestToken, 10 minutes" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/transaction-apis.html
  - id: e-iv-dy-mid-06
    engine: dynamodb
    band: mid
    kind: concept
    q: { vi: "Đếm lượt xem bằng `UpdateItem` với `ADD views :one`. Có vấn đề gì khi client gọi lại sau timeout?", en: "Counting views with `UpdateItem` using `ADD views :one`. What goes wrong when the client retries after a timeout?" }
    answer: { vi: "Phép cộng nguyên tử trên server, nên nhiều request song song không mất lượt. Nhưng nó không idempotent: nếu request đầu đã áp dụng mà phản hồi bị mất, lần gọi lại cộng thêm lần nữa. Với lượt xem thì sai số nhỏ chấp nhận được. Với số tiền hay tồn kho thì không: dùng điều kiện theo phiên bản (`version = :v`), transaction có `ClientRequestToken`, hoặc ghi một item sự kiện có id duy nhất (`attribute_not_exists`) rồi cộng sau.", en: "The increment is atomic on the server, so parallel requests lose no counts. But it is not idempotent: if the first request was applied and the reply lost, the retry adds again. For view counts the small error is acceptable. For money or stock it is not: use a version condition (`version = :v`), a transaction with `ClientRequestToken`, or write an event item with a unique id (`attribute_not_exists`) and sum later." }
    rubric:
      - { vi: "Nguyên tử nhưng không idempotent", en: "Atomic but not idempotent" }
      - { vi: "Phân biệt dữ liệu chịu được sai số", en: "Separates error-tolerant data" }
      - { vi: "Ít nhất một cách làm idempotent", en: "At least one idempotent approach" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/WorkingWithItems.html
  - id: e-iv-dy-mid-07
    engine: dynamodb
    band: mid
    kind: concept
    q: { vi: "Hai nhân viên cùng mở và sửa một hồ sơ khách. Cài đặt khóa lạc quan trên DynamoDB.", en: "Two staff open and edit the same customer record. Implement optimistic locking on DynamoDB." }
    answer: { vi: "Item có `version` (số). Đọc item cùng `version = 7`. Ghi bằng `UpdateItem … SET …, version = version + :one` với `ConditionExpression: 'version = :seven'`. Người ghi thứ hai gặp `ConditionalCheckFailedException`: đọc lại, gộp hoặc báo người dùng, rồi thử lại. Không khóa gì khi đọc, nên hợp với xung đột hiếm. Có thể yêu cầu trả về item hiện tại khi điều kiện thất bại (`ReturnValuesOnConditionCheckFailure`) để khỏi đọc lại.", en: "The item has a numeric `version`. Read it with `version = 7`. Write with `UpdateItem … SET …, version = version + :one` and `ConditionExpression: 'version = :seven'`. The second writer gets `ConditionalCheckFailedException`: reread, merge or tell the user, retry. Nothing is locked on read, so it suits rare conflicts. You can ask for the current item on condition failure (`ReturnValuesOnConditionCheckFailure`) to skip the reread." }
    rubric:
      - { vi: "Trường version + điều kiện bằng", en: "Version field + equality condition" }
      - { vi: "Xử lý khi điều kiện thất bại", en: "Handles the failed condition" }
      - { vi: "Biết hợp với xung đột hiếm", en: "Knows it suits rare conflicts" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/WorkingWithItems.html
  - id: e-iv-dy-mid-08
    engine: dynamodb
    band: mid
    kind: concept
    q: { vi: "Dùng TTL để xóa phiên sau 24 giờ. Cài đặt thế nào và cần cẩn thận gì?", en: "Use TTL to delete sessions after 24 hours. How do you set it up and what needs care?" }
    answer: { vi: "Bật TTL trên một thuộc tính (ví dụ `expires_at`) chứa thời điểm hết hạn dạng **số giây Unix epoch** (kiểu Number). Xóa do TTL không tốn WCU nhưng không tức thì: AWS chỉ nói thường trong vòng vài ngày. Vì vậy truy vấn phải tự lọc `expires_at > :now`. Xóa do TTL xuất hiện trong Streams (đánh dấu là do dịch vụ xóa), có thể dùng để lưu trữ sang S3. Giá trị sai định dạng (mili giây, chuỗi) thì item không bao giờ bị xóa.", en: "Enable TTL on an attribute (say `expires_at`) holding the expiry as **Unix epoch seconds** (Number type). TTL deletes cost no WCU but are not immediate: AWS only says typically within a few days. So queries must filter `expires_at > :now` themselves. TTL deletes show up in Streams (marked as service deletions), useful for archiving to S3. A wrongly formatted value (milliseconds, strings) means the item never expires." }
    rubric:
      - { vi: "Epoch giây, kiểu Number", en: "Epoch seconds, Number type" }
      - { vi: "Xóa trễ, phải lọc khi đọc", en: "Late deletion, filter on read" }
      - { vi: "Biết TTL vào Streams / không tốn WCU", en: "Knows TTL deletes reach Streams / cost no WCU" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/TTL.html
  - id: e-iv-dy-mid-09
    engine: dynamodb
    band: mid
    kind: diagnose
    q: { vi: "`Query` lấy 120 sự kiện của một đơn, mỗi item 1,5 KB, eventually consistent. Tính RCU.", en: "A `Query` fetches 120 events of one order, 1.5 KB each, eventually consistent. Compute the RCU." }
    exhibits:
      - label: { vi: "Đầu vào", en: "Input" }
        source: aws-rules
        shown: "Query, 120 items x 1.5 KB, eventually consistent; Query sums item sizes, then rounds up to 4 KB"
        calc:
          - { expr: "120 * 1.5", expect: 180 }
          - { expr: "Math.ceil(120 * 1.5 / 4)", expect: 45 }
          - { expr: "Math.ceil(120 * 1.5 / 4) * 0.5", expect: 22.5 }
          - { expr: "120 * Math.ceil(1.5 / 4) * 0.5", expect: 60 }
    answer: { vi: "Query cộng dồn: 120 × 1,5 = 180 KB → 45 khối 4 KB × 0,5 = 22,5 RCU. Nếu thay bằng 120 lần `GetItem` (hoặc BatchGetItem), mỗi item làm tròn riêng lên 4 KB: 120 × 0,5 = 60 RCU, gần gấp ba. Đây là lý do gom dữ liệu đọc cùng nhau vào một item collection rồi Query.", en: "Query sums sizes: 120 × 1.5 = 180 KB → 45 blocks of 4 KB × 0.5 = 22.5 RCU. Replacing it with 120 `GetItem` calls (or BatchGetItem) rounds each item up to 4 KB: 120 × 0.5 = 60 RCU, almost triple. This is why data read together belongs in one item collection read with Query." }
    rubric:
      - { vi: "22,5 RCU đúng", en: "Correct 22.5 RCU" }
      - { vi: "Biết Query cộng dồn trước khi làm tròn", en: "Knows Query sums before rounding" }
      - { vi: "So với GetItem từng cái (60)", en: "Compares with per-item GetItem (60)" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/CapacityUnitCalculations.html
  - id: e-iv-dy-mid-10
    engine: dynamodb
    band: mid
    kind: diagnose
    q: { vi: "Màn chi tiết đơn đọc 10 dòng hàng (mỗi dòng 1 KB, strongly consistent) bằng `BatchGetItem`. Đồng nghiệp đề xuất chuyển sang `Query` trên item collection của đơn. Tính cả hai.", en: "The order detail screen reads 10 line items (1 KB each, strongly consistent) with `BatchGetItem`. A colleague proposes a `Query` on the order's item collection instead. Compute both." }
    exhibits:
      - label: { vi: "Đầu vào", en: "Input" }
        source: aws-rules
        shown: "10 items x 1 KB, strongly consistent; BatchGetItem rounds each item to 4 KB; Query sums then rounds"
        calc:
          - { expr: "10 * Math.ceil(1 / 4)", expect: 10 }
          - { expr: "Math.ceil(10 * 1 / 4)", expect: 3 }
    answer: { vi: "BatchGetItem: mỗi item làm tròn lên 4 KB, 10 × 1 = 10 RCU. Query: 10 KB cộng dồn → 3 khối 4 KB = 3 RCU, và chỉ một round trip, kết quả đã sắp theo sort key. Đề xuất đúng, với điều kiện các dòng hàng cùng partition key (`ORDER#<id>`) và sort key như `LINE#<n>`.", en: "BatchGetItem: each item rounds up to 4 KB, 10 × 1 = 10 RCU. Query: 10 KB summed → 3 blocks of 4 KB = 3 RCU, one round trip, results sorted by the sort key. The proposal is right, provided the lines share the partition key (`ORDER#<id>`) with a sort key like `LINE#<n>`." }
    rubric:
      - { vi: "10 RCU so với 3 RCU", en: "10 RCU vs 3 RCU" }
      - { vi: "Giải thích làm tròn từng item vs cộng dồn", en: "Explains per-item vs summed rounding" }
      - { vi: "Nêu điều kiện thiết kế khóa", en: "States the key-design condition" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/CapacityUnitCalculations.html
  - id: e-iv-dy-mid-11
    engine: dynamodb
    band: mid
    kind: diagnose
    q: { vi: "Bảng có 2 GSI chiếu `ALL`. Ghi một item mới 1,5 KB tốn bao nhiêu WCU tổng? Nếu sau đó một `UpdateItem` đổi thuộc tính khóa của một GSI thì GSI đó tốn bao nhiêu?", en: "A table has 2 GSIs projecting `ALL`. How many WCU in total does writing a new 1.5 KB item cost? If an `UpdateItem` later changes one GSI's key attribute, what does that GSI cost?" }
    exhibits:
      - label: { vi: "Đầu vào", en: "Input" }
        source: aws-rules
        shown: "PutItem 1.5 KB; GSI-1 and GSI-2 project ALL; later UpdateItem changes GSI-1's partition key (item stays 1.5 KB)"
        calc:
          - { expr: "Math.ceil(1.5)", expect: 2 }
          - { expr: "Math.ceil(1.5) * (1 + 2)", expect: 6 }
          - { expr: "2 * Math.ceil(1.5)", expect: 4 }
    answer: { vi: "Bảng 2 WCU + mỗi GSI 2 WCU = 6 WCU cho một lần chèn: gấp ba so với không có chỉ mục. Khi đổi giá trị khóa của GSI-1, GSI đó phải xóa mục cũ và ghi mục mới: 2 thao tác × 2 WCU = 4 WCU (cộng 2 WCU của bảng; GSI-2 tốn thêm 2 nếu thuộc tính được chiếu). Đó là lý do nên chiếu tối thiểu và tránh khóa GSI đổi thường xuyên.", en: "Table 2 WCU + 2 WCU per GSI = 6 WCU per insert: triple the index-free cost. Changing GSI-1's key value makes that GSI delete the old entry and write a new one: 2 operations × 2 WCU = 4 WCU (plus the table's 2 WCU; GSI-2 costs 2 more if projected attributes changed). That is why you project minimally and avoid frequently changing GSI keys." }
    rubric:
      - { vi: "6 WCU cho lần chèn", en: "6 WCU for the insert" }
      - { vi: "Đổi khóa GSI = xóa + ghi = 4 WCU", en: "GSI key change = delete + put = 4 WCU" }
      - { vi: "Rút ra bài học về projection/khóa đổi", en: "Draws the lesson about projections/changing keys" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GSI.html
  - id: e-iv-dy-mid-12
    engine: dynamodb
    band: mid
    kind: concept
    q: { vi: "PartiQL cho phép viết `SELECT * FROM Orders WHERE status = 'OPEN'`. Có bẫy gì?", en: "PartiQL lets you write `SELECT * FROM Orders WHERE status = 'OPEN'`. What is the trap?" }
    answer: { vi: "PartiQL chỉ là cú pháp; nó vẫn chạy bằng GetItem/Query/Scan bên dưới. Câu `SELECT` không có điều kiện bằng trên partition key thành một **Scan** toàn bảng, tốn RCU theo kích thước bảng dù cú pháp trông như SQL có chỉ mục. Luôn đưa partition key (hoặc dùng `FROM \"Orders\".\"index\"`) vào WHERE, và dùng chính sách IAM chặn Scan qua PartiQL nếu cần.", en: "PartiQL is only syntax; it still runs as GetItem/Query/Scan underneath. A `SELECT` without an equality on the partition key becomes a full-table **Scan**, costing RCU for the whole table even though it looks like indexed SQL. Always include the partition key (or query `FROM \"Orders\".\"index\"`) in the WHERE, and use an IAM policy to block PartiQL scans if needed." }
    rubric:
      - { vi: "PartiQL vẫn là API bên dưới", en: "PartiQL is still the underlying API" }
      - { vi: "Thiếu partition key = Scan", en: "No partition key = Scan" }
      - { vi: "Biện pháp phòng (khóa / IAM)", en: "Mitigation (key / IAM)" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ql-reference.html
  - id: e-iv-dy-mid-13
    engine: dynamodb
    band: mid
    kind: concept
    q: { vi: "Thiết kế sort key cho sự kiện của thiết bị để lấy được: mọi sự kiện một ngày, sự kiện mới nhất, sự kiện lỗi trong tháng.", en: "Design a sort key for device events to get: all events of a day, the latest event, error events in a month." }
    answer: { vi: "Partition key `DEVICE#<id>`, sort key `<ISO timestamp>` (ví dụ `2026-10-31T08:15:00Z`): chuỗi ISO sắp theo thời gian. Một ngày: `begins_with(sk, '2026-10-31')`. Mới nhất: `ScanIndexForward: false, Limit: 1`. Lỗi trong tháng: GSI thưa với partition key `DEVICE#<id>#ERROR` (chỉ đặt trên sự kiện lỗi) và sort key timestamp, rồi `begins_with(sk, '2026-10')`; hoặc nếu lỗi hiếm, sort key ghép `ERROR#<ts>` trong item riêng. Sort key ghép theo thứ bậc là kỹ thuật cốt lõi.", en: "Partition key `DEVICE#<id>`, sort key `<ISO timestamp>` (for example `2026-10-31T08:15:00Z`): ISO strings sort chronologically. A day: `begins_with(sk, '2026-10-31')`. Latest: `ScanIndexForward: false, Limit: 1`. Errors in a month: a sparse GSI keyed `DEVICE#<id>#ERROR` (set only on error events) with the timestamp sort key, then `begins_with(sk, '2026-10')`; or, if errors are rare, separate items with a composite sort key `ERROR#<ts>`. Hierarchical composite sort keys are the core technique." }
    rubric:
      - { vi: "Timestamp ISO làm sort key", en: "ISO timestamp as sort key" }
      - { vi: "begins_with và ScanIndexForward", en: "begins_with and ScanIndexForward" }
      - { vi: "Lời giải hợp lý cho lọc lỗi (GSI thưa / khóa ghép)", en: "A sensible error filter (sparse GSI / composite key)" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-sort-keys.html
  - id: e-iv-dy-mid-14
    engine: dynamodb
    band: mid
    kind: concept
    q: { vi: "\"Hot partition\" là gì? Giới hạn thông lượng của một partition là bao nhiêu?", en: "What is a \"hot partition\"? What is one partition's throughput limit?" }
    answer: { vi: "Dữ liệu được chia theo hash của partition key; mỗi partition vật lý chịu tối đa 3.000 RCU và 1.000 WCU mỗi giây (và khoảng 10 GB). Nếu một giá trị partition key (khách lớn, ngày hôm nay, sản phẩm đang hot) nhận quá phần đó, request bị throttle dù tổng dung lượng bảng còn dư. Adaptive capacity giúp dồn dung lượng sang partition nóng, nhưng không vượt giới hạn mỗi partition cho một khóa: phải thiết kế khóa phân tán (write sharding, khóa cardinality cao).", en: "Data is spread by the partition key hash; each physical partition serves at most 3,000 RCU and 1,000 WCU per second (and about 10 GB). If one partition key value (a big customer, today's date, a viral product) gets more than that, requests are throttled even though the table's total capacity has room. Adaptive capacity shifts capacity to hot partitions but cannot exceed the per-partition limit for one key: design spread-out keys (write sharding, high-cardinality keys)." }
    rubric:
      - { vi: "3.000 RCU / 1.000 WCU mỗi partition", en: "3,000 RCU / 1,000 WCU per partition" }
      - { vi: "Throttle dù tổng còn dư", en: "Throttled despite spare total" }
      - { vi: "Adaptive capacity có giới hạn, cần thiết kế khóa", en: "Adaptive capacity is bounded, keys must be designed" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/burst-adaptive-capacity.html
  - id: e-iv-dy-mid-15
    engine: dynamodb
    band: mid
    kind: design
    q: { vi: "Lịch sử đơn hàng: khách xem đơn của mình mới nhất trước và lọc theo trạng thái; kho xem các đơn \"đang đóng gói\" của mình. Thiết kế bảng và GSI.", en: "Order history: customers view their orders newest first and filter by status; warehouses view their \"packing\" orders. Design the table and GSIs." }
    answer: { vi: "Bảng: `pk = CUST#<id>`, `sk = ORDER#<created ISO>#<order_id>`: đơn của khách theo thời gian (`ScanIndexForward: false`). Lọc theo trạng thái cho khách: GSI1 `pk = CUST#<id>#<status>`, `sk = created`; hoặc nếu khách ít đơn, Query rồi `FilterExpression` cũng chấp nhận được. Kho: GSI2 thưa `pk = WH#<warehouse>#PACKING`, `sk = created`, chỉ đặt khi đơn đang đóng gói và REMOVE khi chuyển trạng thái, nên chỉ mục nhỏ. Đổi trạng thái = UpdateItem cập nhật các thuộc tính khóa GSI.", en: "Table: `pk = CUST#<id>`, `sk = ORDER#<created ISO>#<order_id>`: a customer's orders by time (`ScanIndexForward: false`). Status filter for customers: GSI1 `pk = CUST#<id>#<status>`, `sk = created`; or, for customers with few orders, Query plus `FilterExpression` is acceptable. Warehouses: sparse GSI2 `pk = WH#<warehouse>#PACKING`, `sk = created`, set only while packing and REMOVEd on status change, so the index stays small. A status change = an UpdateItem updating the GSI key attributes." }
    tradeoffs:
      - { vi: "GSI theo trạng thái: đọc rẻ, nhưng mỗi lần đổi trạng thái là xóa + ghi trên GSI.", en: "Status GSIs: cheap reads, but every status change is a delete + put on the GSI." }
      - { vi: "Kho lớn có thể thành partition nóng trên GSI2: cân nhắc thêm hậu tố ngày.", en: "A big warehouse can become a hot partition on GSI2: consider a date suffix." }
    rubric:
      - { vi: "Khóa bảng phục vụ đơn theo khách, theo thời gian", en: "Table keys serve per-customer, time-ordered orders" }
      - { vi: "GSI thưa cho đơn đang đóng gói", en: "Sparse GSI for packing orders" }
      - { vi: "Nêu chi phí đổi trạng thái và nguy cơ nóng", en: "States status-change cost and hot-key risk" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-indexes-general-sparse-indexes.html

  # ---------------- DynamoDB · senior
  - id: e-iv-dy-senior-01
    engine: dynamodb
    band: senior
    kind: concept
    q: { vi: "Single-table design là gì? Khi nào nó đáng, khi nào không?", en: "What is single-table design? When is it worth it, and when not?" }
    answer: { vi: "Đặt nhiều loại thực thể (khách, đơn, dòng hàng) vào một bảng với khóa chung chung (`pk`, `sk`, `gsi1pk`…) và tiền tố (`CUST#`, `ORDER#`), sao cho các thực thể đọc cùng nhau nằm chung item collection: một Query lấy được \"khách + 10 đơn mới nhất\", thay cho nhiều lần gọi. Đáng khi access pattern ổn định, cần độ trễ thấp ở quy mô lớn. Không đáng khi access pattern còn thay đổi nhiều, đội chưa quen (khó đọc, khó debug), cần phân tích ad hoc, hoặc các thực thể không bao giờ đọc cùng nhau: khi đó nhiều bảng đơn giản hơn và vẫn ổn.", en: "Put several entity types (customers, orders, lines) into one table with generic keys (`pk`, `sk`, `gsi1pk`…) and prefixes (`CUST#`, `ORDER#`) so entities read together share an item collection: one Query returns \"customer + 10 latest orders\" instead of several calls. Worth it when access patterns are stable and low latency at scale matters. Not worth it when patterns still change a lot, the team is new to it (hard to read and debug), ad hoc analytics is needed, or entities are never read together: then several tables are simpler and fine." }
    rubric:
      - { vi: "Định nghĩa với khóa chung và tiền tố", en: "Defines it with generic keys and prefixes" }
      - { vi: "Lợi ích: một Query lấy nhiều thực thể", en: "Benefit: one Query for several entities" }
      - { vi: "Nêu công bằng khi nào không nên", en: "Fairly states when not to" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-general-nosql-design.html
  - id: e-iv-dy-senior-02
    engine: dynamodb
    band: senior
    kind: concept
    q: { vi: "Mô hình quan hệ nhiều-nhiều (sinh viên – lớp học) trong DynamoDB bằng adjacency list.", en: "Model a many-to-many relationship (students – classes) in DynamoDB with an adjacency list." }
    answer: { vi: "Mỗi quan hệ là một item: `pk = STUDENT#<s>`, `sk = CLASS#<c>` (kèm thuộc tính cần hiện như tên lớp, ngày đăng ký). Query `pk = STUDENT#<s>, begins_with(sk, 'CLASS#')` cho các lớp của một sinh viên. GSI \"đảo ngược\" với `gsi1pk = sk`, `gsi1sk = pk` cho các sinh viên của một lớp. Item thực thể chính (`pk = STUDENT#<s>, sk = PROFILE`) ở cùng item collection. Dữ liệu chép vào item quan hệ (tên lớp) phải được cập nhật khi nguồn đổi.", en: "Each relationship is an item: `pk = STUDENT#<s>`, `sk = CLASS#<c>` (with display attributes like class name, enrolment date). Query `pk = STUDENT#<s>, begins_with(sk, 'CLASS#')` for a student's classes. An \"inverted\" GSI with `gsi1pk = sk`, `gsi1sk = pk` gives a class's students. The entity item itself (`pk = STUDENT#<s>, sk = PROFILE`) sits in the same item collection. Data copied into relationship items (class name) must be updated when the source changes." }
    rubric:
      - { vi: "Item quan hệ với pk/sk đúng", en: "Relationship items with correct pk/sk" }
      - { vi: "GSI đảo ngược cho chiều kia", en: "Inverted GSI for the other direction" }
      - { vi: "Nêu chi phí dữ liệu chép", en: "States the cost of copied data" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-adjacency-graphs.html
  - id: e-iv-dy-senior-03
    engine: dynamodb
    band: senior
    kind: concept
    q: { vi: "Write sharding là gì? Đọc lại dữ liệu đã shard thế nào?", en: "What is write sharding? How do you read sharded data back?" }
    answer: { vi: "Khi một giá trị khóa nhận quá nhiều ghi (ví dụ `DATE#2026-10-31`), thêm hậu tố: `DATE#2026-10-31#<n>` với n từ 0 tới N−1, chọn ngẫu nhiên hoặc tính từ một thuộc tính (hash của `order_id` mod N). Ghi phân tán ra N partition key. Đọc: N lần Query song song rồi gộp ở ứng dụng; nếu hậu tố tính được từ thuộc tính thì đọc một item cụ thể chỉ cần một Query. Đánh đổi: đọc tốn N lần, N phải chọn theo thông lượng đỉnh.", en: "When one key value gets too many writes (say `DATE#2026-10-31`), add a suffix: `DATE#2026-10-31#<n>` with n from 0 to N−1, random or computed from an attribute (hash of `order_id` mod N). Writes spread over N partition keys. Reading: N parallel Queries merged in the app; if the suffix is computable from an attribute, fetching a specific item needs one Query. Trade-off: reads cost N calls, and N must be chosen from peak throughput." }
    rubric:
      - { vi: "Hậu tố ngẫu nhiên hoặc tính được", en: "Random or computed suffix" }
      - { vi: "Đọc bằng N Query song song", en: "Read with N parallel Queries" }
      - { vi: "Đánh đổi và cách chọn N", en: "Trade-off and how to pick N" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-sharding.html
  - id: e-iv-dy-senior-04
    engine: dynamodb
    band: senior
    kind: concept
    q: { vi: "Burst capacity và adaptive capacity khác nhau thế nào? Có nên dựa vào chúng khi thiết kế?", en: "How do burst capacity and adaptive capacity differ? Should a design rely on them?" }
    answer: { vi: "Burst (chế độ provisioned): DynamoDB giữ phần dung lượng không dùng của tối đa 5 phút gần nhất để chịu đỉnh ngắn. Adaptive: tự dồn dung lượng của bảng sang partition đang nóng, và có thể tách partition có item nóng; nhưng một giá trị khóa vẫn bị giới hạn ở mức một partition. Không nên dựa vào: burst có thể đã bị dùng cho việc nền, adaptive không cứu được khóa đơn nóng. Thiết kế khóa phân tán và coi hai cơ chế này là đệm an toàn.", en: "Burst (provisioned mode): DynamoDB keeps up to 5 minutes of unused capacity to absorb short spikes. Adaptive: shifts table capacity to hot partitions automatically, and can split partitions with hot items; but a single key value is still capped at one partition's limits. Do not rely on them: burst may already be spent on background work, and adaptive cannot save a single hot key. Design spread-out keys and treat both as a safety cushion." }
    rubric:
      - { vi: "Burst = 5 phút dung lượng chưa dùng", en: "Burst = up to 5 minutes of unused capacity" }
      - { vi: "Adaptive dồn dung lượng, có giới hạn một khóa", en: "Adaptive shifts capacity, bounded per key" }
      - { vi: "Kết luận không dựa vào khi thiết kế", en: "Concludes not to rely on them" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/burst-adaptive-capacity.html
  - id: e-iv-dy-senior-05
    engine: dynamodb
    band: senior
    kind: concept
    q: { vi: "DynamoDB Streams đảm bảo gì về thứ tự và thời gian giữ? Dùng với Lambda cần chú ý gì?", en: "What do DynamoDB Streams guarantee about ordering and retention? What matters when using them with Lambda?" }
    answer: { vi: "Mỗi thay đổi item xuất hiện đúng một lần trong stream, theo đúng thứ tự thay đổi **của từng item** (không có thứ tự toàn cục), giữ 24 giờ. Chọn view: `KEYS_ONLY`, `NEW_IMAGE`, `OLD_IMAGE`, `NEW_AND_OLD_IMAGES`. Với Lambda: xử lý theo lô theo shard; một bản ghi lỗi làm cả lô thử lại và chặn shard đó, nên cấu hình `BisectBatchOnFunctionError`, giới hạn số lần thử, đích cho bản ghi hỏng; hàm phải idempotent; nếu chậm quá 24 giờ thì mất dữ liệu.", en: "Each item change appears exactly once in the stream, in order **per item** (no global order), retained for 24 hours. Pick a view: `KEYS_ONLY`, `NEW_IMAGE`, `OLD_IMAGE`, `NEW_AND_OLD_IMAGES`. With Lambda: processing is in batches per shard; one failing record retries the whole batch and blocks that shard, so configure `BisectBatchOnFunctionError`, a retry limit and a failure destination; the function must be idempotent; falling behind more than 24 hours loses data." }
    rubric:
      - { vi: "Thứ tự theo item, đúng một lần, 24 giờ", en: "Per-item order, exactly once, 24 hours" }
      - { vi: "Các kiểu view", en: "The view types" }
      - { vi: "Xử lý lỗi lô và idempotent", en: "Batch failure handling and idempotency" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Streams.html
  - id: e-iv-dy-senior-06
    engine: dynamodb
    band: senior
    kind: concept
    q: { vi: "Global tables: hai vùng cùng ghi vào một item gần như cùng lúc. Chuyện gì xảy ra? Thiết kế để tránh vấn đề thế nào?", en: "Global tables: two regions write the same item at almost the same time. What happens? How do you design to avoid trouble?" }
    answer: { vi: "Mặc định (nhất quán eventual giữa vùng) mỗi vùng nhận ghi ngay; khi nhân bản, xung đột được giải bằng \"người ghi cuối thắng\" theo thời điểm, nên một thay đổi bị mất lặng lẽ, và điều kiện (`ConditionExpression`) chỉ kiểm trong vùng nhận ghi. Thiết kế: mỗi item có một vùng \"chủ\" ghi (ví dụ theo vùng người dùng), các vùng khác chỉ đọc hoặc chuyển ghi về vùng chủ; hoặc chỉ dùng thao tác giao hoán (ghi item sự kiện mới thay vì sửa). Transaction không bảo đảm nguyên tử xuyên vùng.", en: "By default (eventually consistent across regions) each region accepts the write at once; on replication, conflicts resolve as \"last writer wins\" by timestamp, so one change is silently lost, and conditions (`ConditionExpression`) are checked only in the receiving region. Design: each item has one \"home\" region for writes (say by user region), others read or forward writes home; or use only commutative operations (append new event items instead of editing). Transactions are not atomic across regions." }
    rubric:
      - { vi: "Last writer wins, mất lặng lẽ", en: "Last writer wins, silent loss" }
      - { vi: "Điều kiện và transaction chỉ trong một vùng", en: "Conditions and transactions are per region" }
      - { vi: "Thiết kế vùng chủ hoặc ghi giao hoán", en: "Home-region or commutative-write design" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GlobalTables.html
  - id: e-iv-dy-senior-07
    engine: dynamodb
    band: senior
    kind: concept
    q: { vi: "Bảng provisioned có đủ WCU nhưng ghi vẫn bị throttle. Biểu đồ cho thấy một GSI bị throttle. Vì sao ghi vào bảng bị ảnh hưởng?", en: "A provisioned table has enough WCU but writes are still throttled. Metrics show one GSI is throttled. Why does that affect table writes?" }
    answer: { vi: "GSI được cập nhật bất đồng bộ nhưng có dung lượng ghi riêng; khi GSI thiếu WCU (hoặc khóa GSI nóng), DynamoDB áp \"back-pressure\": throttle chính các lần ghi vào bảng có ảnh hưởng tới GSI đó, để chỉ mục không tụt quá xa. Sửa: tăng WCU (hoặc auto scaling) cho GSI ít nhất bằng nhu cầu ghi thực tế của nó, kiểm khóa GSI có cardinality thấp không, giảm projection. Chỉ số cần xem: `WriteThrottleEvents` theo từng GSI.", en: "GSIs are updated asynchronously but have their own write capacity; when a GSI lacks WCU (or has a hot key), DynamoDB applies back-pressure: it throttles the table writes that affect that GSI so the index does not fall too far behind. Fix: give the GSI (or its auto scaling) at least its real write demand, check whether the GSI key has low cardinality, trim the projection. Metric to watch: `WriteThrottleEvents` per GSI." }
    rubric:
      - { vi: "Back-pressure từ GSI lên bảng", en: "Back-pressure from the GSI to the table" }
      - { vi: "Nguyên nhân: thiếu WCU hoặc khóa nóng của GSI", en: "Cause: GSI WCU shortage or hot GSI key" }
      - { vi: "Cách sửa và chỉ số theo dõi", en: "Fix and metric" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GSI.html
  - id: e-iv-dy-senior-08
    engine: dynamodb
    band: senior
    kind: diagnose
    q: { vi: "Bảng đếm lượt bình chọn có `pk = POLL#<id>`. Một cuộc bình chọn trên truyền hình nhận 5.000 phiếu/giây, mỗi lần ghi 1 KB. Tính xem có bị throttle không và cần chia thành bao nhiêu shard.", en: "A vote table has `pk = POLL#<id>`. A TV poll gets 5,000 votes/second, each write 1 KB. Work out whether it throttles and how many shards you need." }
    exhibits:
      - label: { vi: "Đầu vào", en: "Input" }
        source: aws-rules
        shown: "5,000 writes/s x 1 KB to one partition key; per-partition limit 1,000 WCU"
        calc:
          - { expr: "5000 * Math.ceil(1 / 1)", expect: 5000 }
          - { expr: "Math.ceil(5000 / 1000)", expect: 5 }
          - { expr: "5000 / 10", expect: 500 }
    answer: { vi: "Cần 5.000 WCU trên một giá trị partition key, gấp 5 giới hạn 1.000 WCU của một partition: chắc chắn throttle dù bảng on-demand. Tối thiểu 5 shard (`POLL#<id>#0..4`); chọn 10 để có dư (mỗi shard ~500 WCU, an toàn khi phân bố không đều). Đọc kết quả = 10 Query rồi cộng; tốt hơn là mỗi shard một item bộ đếm (`ADD`), và một job cộng 10 item theo chu kỳ để màn hình đọc một item tổng.", en: "It needs 5,000 WCU on one partition key value, 5× a partition's 1,000 WCU limit: it will throttle even on-demand. At least 5 shards (`POLL#<id>#0..4`); pick 10 for headroom (~500 WCU each, safe under uneven spread). Reading = 10 Queries summed; better, one counter item per shard (`ADD`), and a periodic job sums the 10 so the screen reads one total item." }
    rubric:
      - { vi: "So 5.000 với 1.000 WCU", en: "Compares 5,000 with 1,000 WCU" }
      - { vi: "Số shard tối thiểu 5 và chọn có dư", en: "Minimum 5 shards, with headroom" }
      - { vi: "Cách đọc tổng hiệu quả", en: "An efficient way to read the total" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-sharding.html
  - id: e-iv-dy-senior-09
    engine: dynamodb
    band: senior
    kind: diagnose
    q: { vi: "Một job đêm Scan toàn bảng 2 GiB, eventually consistent. Tính RCU tổng và số trang. Nếu bảng provisioned 1.000 RCU dành riêng cho job, job chạy tối thiểu bao lâu?", en: "A nightly job scans a whole 2 GiB table, eventually consistent. Compute total RCU and page count. If the table has 1,000 provisioned RCU reserved for the job, how long does it take at minimum?" }
    exhibits:
      - label: { vi: "Đầu vào", en: "Input" }
        source: aws-rules
        shown: "Scan 2 GiB = 2,097,152 KB, eventually consistent, 1 MB pages, 1,000 RCU available"
        calc:
          - { expr: "2 * 1024 * 1024 / 4", expect: 524288 }
          - { expr: "2 * 1024 * 1024 / 4 * 0.5", expect: 262144 }
          - { expr: "2 * 1024", expect: 2048 }
          - { expr: "Math.ceil(262144 / 1000)", expect: 263 }
    answer: { vi: "2 GiB = 2.097.152 KB = 524.288 khối 4 KB × 0,5 = 262.144 RCU; 2.048 trang 1 MB. Với 1.000 RCU/giây: ít nhất 263 giây (khoảng 4,4 phút), chưa kể dung lượng còn phải phục vụ ứng dụng. Cải thiện: parallel scan (`Segment`/`TotalSegments`) chỉ nhanh hơn nếu có dư RCU; nếu job là phân tích thì dùng export sang S3 (không tốn RCU của bảng) thay vì Scan.", en: "2 GiB = 2,097,152 KB = 524,288 blocks of 4 KB × 0.5 = 262,144 RCU; 2,048 pages of 1 MB. At 1,000 RCU/s: at least 263 seconds (about 4.4 minutes), ignoring capacity the app still needs. Improvements: parallel scan (`Segment`/`TotalSegments`) only helps with spare RCU; if the job is analytics, use export to S3 (consumes no table RCU) instead of a Scan." }
    rubric:
      - { vi: "262.144 RCU và 2.048 trang", en: "262,144 RCU and 2,048 pages" }
      - { vi: "Thời gian tối thiểu 263 s", en: "Minimum 263 s" }
      - { vi: "Đề xuất parallel scan có điều kiện / export S3", en: "Suggests conditional parallel scan / S3 export" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/CapacityUnitCalculations.html
  - id: e-iv-dy-senior-10
    engine: dynamodb
    band: senior
    kind: diagnose
    q: { vi: "Chuyển khoản dùng `TransactWriteItems` với 4 thao tác: trừ ví A, cộng ví B, ghi 2 item nhật ký; mỗi item 3 KB. Tính WCU mỗi lần chuyển, và chi phí cho 300 lần chuyển/giây.", en: "A transfer uses `TransactWriteItems` with 4 operations: debit wallet A, credit wallet B, write 2 log items; each item is 3 KB. Compute WCU per transfer and for 300 transfers/second." }
    exhibits:
      - label: { vi: "Đầu vào", en: "Input" }
        source: aws-rules
        shown: "TransactWriteItems, 4 items x 3 KB; transactional write = 2 WCU per 1 KB; 300 transfers/s"
        calc:
          - { expr: "4 * Math.ceil(3 / 1) * 2", expect: 24 }
          - { expr: "4 * Math.ceil(3 / 1) * 2 * 300", expect: 7200 }
          - { expr: "2 * Math.ceil(1 / 1) * 2 + 2 * Math.ceil(3 / 1) * 2", expect: 16 }
    answer: { vi: "4 item × 3 KB × 2 = 24 WCU mỗi lần; 300 lần/giây = 7.200 WCU. Tối ưu: ví chỉ cần số dư và phiên bản, giữ ≤ 1 KB (tách thông tin hồ sơ ra item khác): 2 × 1 × 2 + 2 × 3 × 2 = 16 WCU, giảm một phần ba. Nhật ký không cần nằm trong transaction nếu ghi được từ Stream của ví, nhưng như vậy mất tính \"cùng lúc\". Nhớ dùng `ClientRequestToken` và điều kiện số dư `balance >= :amt`.", en: "4 items × 3 KB × 2 = 24 WCU per transfer; 300/s = 7,200 WCU. Optimise: wallets only need balance and version, keep them ≤ 1 KB (move profile data to another item): 2 × 1 × 2 + 2 × 3 × 2 = 16 WCU, a third less. Logs need not be in the transaction if written from the wallets' Stream, at the cost of not being simultaneous. Use `ClientRequestToken` and a balance condition `balance >= :amt`." }
    rubric:
      - { vi: "24 WCU và 7.200 WCU", en: "24 WCU and 7,200 WCU" }
      - { vi: "Tối ưu kích thước item ví", en: "Optimises wallet item size" }
      - { vi: "Nhắc idempotency và điều kiện số dư", en: "Mentions idempotency and the balance condition" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/transaction-apis.html
  - id: e-iv-dy-senior-11
    engine: dynamodb
    band: senior
    kind: design
    q: { vi: "Bảng xếp hạng điểm toàn cầu cho game 10 triệu người: hiện top 100 và hạng của mỗi người. DynamoDB không có ORDER BY toàn bảng. Thiết kế.", en: "A global score leaderboard for a 10-million-player game: show the top 100 and each player's rank. DynamoDB has no table-wide ORDER BY. Design it." }
    answer: { vi: "Top 100: GSI với partition key cố định bị nóng, nên shard: `gsi1pk = BOARD#<n>` (n = 0..9 theo hash người chơi), `gsi1sk = score` (số, hoặc chuỗi đệm 0). Lấy top 100 = 10 Query `ScanIndexForward: false, Limit: 100` rồi trộn. Hạng chính xác của từng người không làm rẻ được trong DynamoDB: dùng hạng xấp xỉ theo bucket điểm (đếm số người mỗi khoảng điểm, cập nhật qua Stream), hoặc đưa bảng xếp hạng sang một kho chuyên sắp xếp (ví dụ sorted set trong bộ nhớ) cập nhật từ Stream, DynamoDB vẫn là nguồn sự thật.", en: "Top 100: a GSI with a fixed partition key gets hot, so shard it: `gsi1pk = BOARD#<n>` (n = 0..9 by player hash), `gsi1sk = score` (number, or zero-padded string). Top 100 = 10 Queries with `ScanIndexForward: false, Limit: 100`, merged. Exact per-player rank is not cheap in DynamoDB: use approximate rank via score buckets (count players per score range, updated from the Stream), or move the leaderboard to a store built for sorting (for example an in-memory sorted set) fed by the Stream, with DynamoDB as the source of truth." }
    tradeoffs:
      - { vi: "GSI shard: top N rẻ, nhưng mỗi lần đổi điểm là ghi GSI (xóa + ghi).", en: "Sharded GSI: cheap top N, but every score change is a GSI write (delete + put)." }
      - { vi: "Kho sắp xếp ngoài cho hạng chính xác nhưng thêm một hệ thống phải giữ đồng bộ.", en: "An external sorted store gives exact ranks but adds a system to keep in sync." }
    rubric:
      - { vi: "Shard GSI cho top N và trộn", en: "Sharded GSI for top N with merge" }
      - { vi: "Thừa nhận hạng chính xác không rẻ, có phương án", en: "Admits exact rank is not cheap, offers an option" }
      - { vi: "Dùng Stream để cập nhật dữ liệu phụ", en: "Uses the Stream to update derived data" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-sharding.html
  - id: e-iv-dy-senior-12
    engine: dynamodb
    band: senior
    kind: design
    q: { vi: "SaaS nhiều tenant trên DynamoDB: làm sao để code lỗi của tenant A không bao giờ đọc được dữ liệu tenant B, và một tenant ồn không làm chậm người khác?", en: "Multi-tenant SaaS on DynamoDB: how do you ensure buggy code for tenant A can never read tenant B's data, and a noisy tenant does not slow others?" }
    answer: { vi: "Cách ly: partition key bắt đầu bằng `TENANT#<id>#…` và chính sách IAM với điều kiện `dynamodb:LeadingKeys` khớp tenant của phiên (credential tạm cấp theo tenant), nên kể cả code sai cũng bị AWS từ chối khi đọc khóa khác. Ồn: tenant id ở đầu khóa giúp dữ liệu phân tán theo tenant; tenant cực lớn được shard thêm hậu tố; theo dõi tiêu thụ theo tenant ở ứng dụng và giới hạn tốc độ. Tenant lớn hoặc yêu cầu riêng có thể có bảng riêng.", en: "Isolation: partition keys start with `TENANT#<id>#…` and an IAM policy with a `dynamodb:LeadingKeys` condition matching the session's tenant (temporary credentials issued per tenant), so even buggy code is refused by AWS when touching other keys. Noise: the tenant id leading the key spreads data by tenant; very large tenants get suffix sharding; track per-tenant consumption in the app and rate limit. Large or special tenants can get their own table." }
    tradeoffs:
      - { vi: "Bảng chung: rẻ, một lần thay đổi, nhưng cách ly dựa vào IAM và khóa.", en: "Shared table: cheap, one change rollout, but isolation relies on IAM and keys." }
      - { vi: "Bảng riêng mỗi tenant: cách ly mạnh, nhưng hạn mức số bảng và vận hành nhiều.", en: "Table per tenant: strong isolation, but table quotas and more operations." }
    rubric:
      - { vi: "Tenant đứng đầu khóa", en: "Tenant leads the key" }
      - { vi: "IAM LeadingKeys với credential theo tenant", en: "IAM LeadingKeys with per-tenant credentials" }
      - { vi: "Xử lý tenant ồn", en: "Handles noisy tenants" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/specifying-conditions.html
  - id: e-iv-dy-senior-13
    engine: dynamodb
    band: senior
    kind: concept
    q: { vi: "Vì sao LSI có thể làm ghi thất bại khi một khách hàng lớn lên, dù bảng còn nhiều dung lượng?", en: "Why can an LSI make writes fail as one customer grows, even though the table has plenty of capacity?" }
    answer: { vi: "Bảng có LSI giới hạn mỗi item collection (mọi item cùng partition key, cộng các mục LSI của chúng) ở 10 GB. Khi một khách lớn vượt mức đó, ghi thêm vào khóa đó bị từ chối (`ItemCollectionSizeLimitExceededException`). Bảng không có LSI không có giới hạn này. Vì LSI chỉ tạo được lúc tạo bảng và không xóa riêng được, cân nhắc kỹ; thường dùng GSI thay thế.", en: "A table with an LSI caps each item collection (all items sharing a partition key, plus their LSI entries) at 10 GB. When a big customer exceeds it, further writes to that key are rejected (`ItemCollectionSizeLimitExceededException`). Tables without LSIs have no such cap. Since LSIs exist only from table creation and cannot be dropped alone, think twice; GSIs are usually the alternative." }
    rubric:
      - { vi: "Giới hạn 10 GB item collection", en: "10 GB item collection limit" }
      - { vi: "Chỉ áp dụng khi có LSI", en: "Only applies with an LSI" }
      - { vi: "LSI không gỡ được, cân nhắc GSI", en: "LSIs cannot be removed, consider GSIs" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/LSI.html
  - id: e-iv-dy-senior-14
    engine: dynamodb
    band: senior
    kind: concept
    q: { vi: "Một tính năng mới cần truy vấn theo thuộc tính chưa có trong khóa nào, trên bảng 500 triệu item. Thêm GSI có ảnh hưởng gì?", en: "A new feature needs to query by an attribute in no key yet, on a 500-million-item table. What is the impact of adding a GSI?" }
    answer: { vi: "Thêm GSI vào bảng đang có là thao tác trực tuyến: DynamoDB backfill chỉ mục từ dữ liệu hiện có, bảng vẫn phục vụ đọc ghi. Nhưng backfill có thể mất nhiều giờ, tiêu thụ WCU của GSI (provisioned: cần đặt đủ WCU cho GSI trong lúc backfill), và GSI chưa dùng được tới khi trạng thái `ACTIVE`. Từ đó mỗi ghi có liên quan tốn thêm WCU. Item thiếu thuộc tính khóa không vào GSI. Lên kế hoạch giờ thấp điểm và theo dõi `OnlineIndexPercentageProgress`.", en: "Adding a GSI to an existing table is an online operation: DynamoDB backfills the index from existing data while the table keeps serving reads and writes. But backfill can take hours, consumes GSI WCU (provisioned: give the GSI enough WCU during backfill), and the GSI is unusable until `ACTIVE`. Afterwards every relevant write costs extra WCU. Items lacking the key attribute are not indexed. Plan off-peak and watch `OnlineIndexPercentageProgress`." }
    rubric:
      - { vi: "Thao tác trực tuyến có backfill", en: "Online with backfill" }
      - { vi: "Chi phí WCU trong và sau backfill", en: "WCU cost during and after backfill" }
      - { vi: "Theo dõi tiến độ, chỉ dùng khi ACTIVE", en: "Monitors progress, usable only when ACTIVE" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GSI.html
  - id: e-iv-dy-senior-15
    engine: dynamodb
    band: senior
    kind: concept
    q: { vi: "Bạn ước tính hóa đơn: tải 400 ghi/giây và 2.000 đọc/giây khá đều cả ngày. Lập luận chọn on-demand hay provisioned thế nào (không cần giá cụ thể)?", en: "You are estimating the bill: 400 writes/s and 2,000 reads/s, fairly even all day. How do you reason about on-demand vs provisioned (no exact prices needed)?" }
    answer: { vi: "Tính đơn vị cần: WCU = 400 × kích thước làm tròn KB, RCU = 2.000 × khối 4 KB × hệ số nhất quán. Provisioned trả theo giờ cho dung lượng đặt sẵn, kể cả lúc không dùng; on-demand trả theo request. Tải đều, mức dùng thực trên mức đặt cao (ví dụ > 50–60%) thì provisioned (cộng auto scaling, có thể reserved capacity) rẻ hơn rõ rệt; tải nhọn hoặc nhàn rỗi nhiều thì on-demand rẻ hơn. Lấy giá hiện hành của vùng, tính cả hai, cộng phần GSI và Streams; xem lại sau khi có số đo thật.", en: "Compute units: WCU = 400 × rounded KB size, RCU = 2,000 × 4 KB blocks × consistency factor. Provisioned bills hourly for reserved capacity, used or not; on-demand bills per request. Even traffic with high utilisation of the reserved level (say > 50–60%) makes provisioned (with auto scaling, possibly reserved capacity) clearly cheaper; spiky or often idle traffic favours on-demand. Take current regional prices, compute both, include GSIs and Streams; revisit with real measurements." }
    rubric:
      - { vi: "Tính đơn vị từ kích thước và nhất quán", en: "Derives units from size and consistency" }
      - { vi: "Lập luận theo mức sử dụng", en: "Reasons by utilisation" }
      - { vi: "Nhớ GSI/Streams và đo lại", en: "Remembers GSIs/Streams and re-measuring" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/capacity-mode.html

  # ---------------- DynamoDB · staff
  - id: e-iv-dy-staff-01
    engine: dynamodb
    band: staff
    kind: design
    q: { vi: "Đội muốn chuyển một hệ quản lý kho từ Postgres sang DynamoDB để \"scale\". Bạn dẫn dắt quyết định và quá trình thế nào?", en: "A team wants to move a warehouse system from Postgres to DynamoDB \"to scale\". How do you lead the decision and the process?" }
    answer: { vi: "Trước hết hỏi vấn đề thật: số đo tải, chỗ nghẽn, chi phí hiện tại; nhiều khi Postgres còn nhiều đường (chỉ mục, bản đọc, partition). Nếu vẫn chuyển: (1) kiểm kê mọi access pattern từ log truy vấn thật, gắn tần suất và SLA; (2) đánh dấu những gì DynamoDB làm kém (báo cáo ad hoc, JOIN nhiều chiều, ràng buộc chéo) và chọn nơi khác cho chúng (export S3 + công cụ phân tích); (3) thiết kế khóa/GSI, mô phỏng chi phí; (4) chuyển theo từng miền: ghi kép hoặc CDC, đối soát số liệu, chuyển đọc dần, giữ đường lùi.", en: "First ask about the real problem: load numbers, bottlenecks, current cost; Postgres often has paths left (indexes, read replicas, partitioning). If moving anyway: (1) inventory every access pattern from real query logs, with frequency and SLA; (2) flag what DynamoDB does poorly (ad hoc reports, multi-way JOINs, cross-entity constraints) and pick another home for it (S3 export + an analytics engine); (3) design keys/GSIs and model the cost; (4) migrate per domain: dual writes or CDC, reconcile numbers, shift reads gradually, keep a way back." }
    tradeoffs:
      - { vi: "DynamoDB cho độ trễ ổn định khi scale nhưng mất tính linh hoạt truy vấn.", en: "DynamoDB gives steady latency at scale but loses query flexibility." }
      - { vi: "Ghi kép đơn giản nhưng dễ lệch; CDC chính xác hơn nhưng thêm hạ tầng.", en: "Dual writes are simple but drift; CDC is more accurate but adds infrastructure." }
    rubric:
      - { vi: "Thách thức tiền đề bằng số đo", en: "Challenges the premise with measurements" }
      - { vi: "Kiểm kê access pattern từ log thật", en: "Inventories access patterns from real logs" }
      - { vi: "Chỗ cho nhu cầu phân tích", en: "A home for analytics needs" }
      - { vi: "Di chuyển từng phần có đối soát và đường lùi", en: "Incremental migration with reconciliation and rollback" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-relational-modeling.html
  - id: e-iv-dy-staff-02
    engine: dynamodb
    band: staff
    kind: design
    q: { vi: "Bảng single-table 2 tỉ item cần thêm một thuộc tính dẫn xuất vào mọi item `ORDER#` để phục vụ GSI mới. Lên kế hoạch backfill.", en: "A 2-billion-item single table needs a derived attribute on every `ORDER#` item to feed a new GSI. Plan the backfill." }
    answer: { vi: "(1) Code mới ghi thuộc tính cho mọi item mới/sửa trước (ngăn khoảng trống mới). (2) Backfill bằng parallel scan (`TotalSegments` lớn, mỗi worker một segment, lưu `LastEvaluatedKey` để chạy tiếp được), chỉ lấy item `ORDER#` bằng `FilterExpression`, ghi bằng `UpdateItem` có điều kiện `attribute_not_exists(new_attr)` để không đè giá trị code mới vừa ghi và để chạy lại an toàn. (3) Giới hạn tốc độ theo dung lượng dư; hoặc dùng export S3 để tính danh sách khóa ngoài DynamoDB rồi chỉ chạy Update. (4) Tạo GSI khi backfill xong (hoặc trước, chấp nhận GSI backfill song song), kiểm số lượng trước khi bật tính năng.", en: "(1) New code writes the attribute on every new/updated item first (no new gaps). (2) Backfill with a parallel scan (large `TotalSegments`, one worker per segment, saving `LastEvaluatedKey` to resume), taking only `ORDER#` items via `FilterExpression`, writing with `UpdateItem` conditioned on `attribute_not_exists(new_attr)` so it never overwrites what new code wrote and can rerun safely. (3) Rate-limit to spare capacity; or use an S3 export to compute the key list outside DynamoDB and only run the Updates. (4) Create the GSI after the backfill (or before, accepting a parallel GSI backfill), verify counts before enabling the feature." }
    tradeoffs:
      - { vi: "Scan toàn bảng tốn RCU lớn; export S3 tránh RCU nhưng thêm bước xử lý.", en: "A full scan costs a lot of RCU; an S3 export avoids RCU but adds a processing step." }
      - { vi: "Backfill chậm thì an toàn cho tải sản xuất nhưng kéo dài thời gian ra tính năng.", en: "A slow backfill is safe for production load but delays the feature." }
    rubric:
      - { vi: "Chặn khoảng trống mới trước", en: "Stops new gaps first" }
      - { vi: "Parallel scan có thể chạy tiếp", en: "Resumable parallel scan" }
      - { vi: "Update có điều kiện, idempotent", en: "Conditional, idempotent updates" }
      - { vi: "Giới hạn tốc độ / export S3", en: "Rate limiting / S3 export" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Scan.html
  - id: e-iv-dy-staff-03
    engine: dynamodb
    band: staff
    kind: concept
    q: { vi: "Parallel scan hoạt động thế nào và khi nào nó làm hại hệ thống?", en: "How does parallel scan work, and when does it hurt the system?" }
    answer: { vi: "Chia bảng thành `TotalSegments` phần logic; mỗi worker gọi Scan với `Segment` riêng và tự phân trang. Tăng thông lượng gần tuyến tính khi bảng lớn và có dư dung lượng. Có hại khi: dung lượng đọc của bảng dùng chung với ứng dụng (scan song song ăn hết RCU, ứng dụng bị throttle), bảng nhỏ (chi phí điều phối lớn hơn lợi ích), hoặc on-demand (chi phí tăng vọt trong thời gian ngắn). Dùng `Limit` nhỏ, giới hạn tốc độ, hoặc export S3 thay thế.", en: "It splits the table into `TotalSegments` logical parts; each worker scans its own `Segment` and pages independently. Throughput grows nearly linearly on large tables with spare capacity. It hurts when: read capacity is shared with the app (the parallel scan eats RCU and the app throttles), the table is small (coordination costs more than it gains), or on-demand (costs spike in a short window). Use a small `Limit`, rate limits, or an S3 export instead." }
    rubric:
      - { vi: "Chia theo Segment/TotalSegments", en: "Segment/TotalSegments" }
      - { vi: "Ít nhất hai trường hợp gây hại", en: "At least two harmful cases" }
      - { vi: "Biện pháp giảm thiểu", en: "Mitigations" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Scan.html
  - id: e-iv-dy-staff-04
    engine: dynamodb
    band: staff
    kind: concept
    q: { vi: "Hệ CQRS: ghi vào bảng, đọc từ GSI và từ một bản chiếu dựng bằng Streams. Người dùng thấy dữ liệu \"nhảy lùi\". Giải thích các nguồn không nhất quán.", en: "A CQRS system writes to a table and reads from a GSI and from a projection built via Streams. Users see data \"jump backwards\". Explain the sources of inconsistency." }
    answer: { vi: "(1) GSI cập nhật bất đồng bộ: đọc ngay sau ghi có thể thấy giá trị cũ, và hai lần đọc liên tiếp có thể tới hai bản sao khác nhau. (2) Stream giữ thứ tự theo item, không theo toàn cục: bản chiếu gộp nhiều item có thể áp dụng thay đổi của item B trước item A dù A ghi trước. (3) Lambda thử lại lô làm áp dụng lại sự kiện cũ nếu không kiểm phiên bản. Sửa: bản chiếu lưu `version`/thời điểm của nguồn và chỉ ghi khi mới hơn (cập nhật có điều kiện); màn hình ngay sau thao tác đọc thẳng bảng với strong consistency; chấp nhận và thể hiện \"đang cập nhật\" ở chỗ khác.", en: "(1) GSIs update asynchronously: a read right after a write may see the old value, and two consecutive reads may hit different replicas. (2) Streams order per item, not globally: a projection combining items may apply B's change before A's even though A was written first. (3) Lambda batch retries reapply old events unless versions are checked. Fix: the projection stores the source `version`/timestamp and writes only when newer (conditional update); screens right after an action read the table with strong consistency; elsewhere accept and show \"updating\"." }
    rubric:
      - { vi: "GSI bất đồng bộ", en: "Asynchronous GSIs" }
      - { vi: "Stream chỉ có thứ tự theo item", en: "Streams are ordered per item only" }
      - { vi: "Phát lại do retry, sửa bằng ghi có điều kiện theo phiên bản", en: "Retry replays, fixed by version-conditioned writes" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Streams.html
  - id: e-iv-dy-staff-05
    engine: dynamodb
    band: staff
    kind: concept
    q: { vi: "Đội phân tích muốn chạy truy vấn SQL hằng ngày trên dữ liệu DynamoDB. Bạn đề xuất kiến trúc nào và vì sao không Scan?", en: "The analytics team wants daily SQL over DynamoDB data. Which architecture do you propose and why not Scan?" }
    answer: { vi: "Export bảng sang S3 (cần bật point-in-time recovery; full export hoặc incremental export) ở định dạng DynamoDB JSON hoặc Ion, rồi truy vấn bằng công cụ SQL trên S3 hoặc nạp vào kho dữ liệu. Export không tiêu thụ RCU của bảng nên không ảnh hưởng ứng dụng. Scan hằng ngày thì tốn RCU theo toàn bảng, cạnh tranh với ứng dụng, chậm, và vẫn phải tự làm phần SQL. Cần gần thời gian thực thì thêm luồng Streams → kho phân tích.", en: "Export the table to S3 (requires point-in-time recovery; full or incremental export) in DynamoDB JSON or Ion, then query with an SQL engine over S3 or load into a warehouse. Exports consume no table RCU, so the app is unaffected. A daily Scan costs RCU for the whole table, competes with the app, is slow, and you still have to provide SQL yourself. For near real time, add a Streams → analytics pipeline." }
    rubric:
      - { vi: "Export S3 cần PITR, không tốn RCU", en: "S3 export needs PITR, costs no RCU" }
      - { vi: "Lý do không Scan", en: "Why not Scan" }
      - { vi: "Phương án gần thời gian thực qua Streams", en: "Near-real-time option via Streams" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/S3DataExport.HowItWorks.html
  - id: e-iv-dy-staff-06
    engine: dynamodb
    band: staff
    kind: design
    q: { vi: "Ứng dụng thanh toán chạy hai vùng với global tables để chịu mất một vùng. Thiết kế cách ghi để không bao giờ trừ tiền hai lần hay mất giao dịch khi xung đột.", en: "A payments app runs in two regions with global tables to survive a region loss. Design writes so money is never debited twice or lost on conflict." }
    answer: { vi: "Không cho hai vùng cùng sửa một ví: mỗi ví có vùng chủ (thuộc tính `home_region`), mọi ghi ví đi về vùng chủ; vùng kia chỉ đọc hoặc chuyển tiếp. Khi vùng chủ mất hẳn, chuyển vai trò chủ có kiểm soát (quy trình failover, có thể mất vài giây ghi chưa nhân bản: phải đối soát sau). Mọi giao dịch là item sự kiện bất biến có id duy nhất (`attribute_not_exists`), số dư là kết quả cộng dồn từ sự kiện (hoặc cập nhật có điều kiện trong vùng chủ), nên phát lại không trừ hai lần. Từ chối dựa vào last-writer-wins cho tiền. Nếu dịch vụ hỗ trợ chế độ nhất quán mạnh nhiều vùng thì cân nhắc, đổi lại độ trễ ghi cao hơn.", en: "Never let two regions edit one wallet: each wallet has a home region (`home_region` attribute), all wallet writes go there; the other region reads or forwards. If the home region is lost, transfer ownership deliberately (a failover procedure; a few seconds of unreplicated writes may be lost and must be reconciled). Every transaction is an immutable event item with a unique id (`attribute_not_exists`), and the balance is derived from events (or conditionally updated in the home region), so replays never double-debit. Never rely on last-writer-wins for money. If the service offers a multi-region strong consistency mode, consider it, at the cost of higher write latency." }
    tradeoffs:
      - { vi: "Vùng chủ đơn giản và đúng, nhưng người dùng xa vùng chủ chịu độ trễ ghi cao hơn.", en: "Home regions are simple and correct, but users far from home pay higher write latency." }
      - { vi: "Sổ sự kiện bất biến dễ đối soát nhưng đọc số dư cần tổng hợp hoặc bản chụp.", en: "An immutable event ledger reconciles easily but balance reads need aggregation or snapshots." }
    rubric:
      - { vi: "Một vùng ghi cho mỗi ví", en: "One writing region per wallet" }
      - { vi: "Sự kiện bất biến + id duy nhất", en: "Immutable events + unique ids" }
      - { vi: "Quy trình failover và đối soát", en: "Failover procedure and reconciliation" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GlobalTables.html
  - id: e-iv-dy-staff-07
    engine: dynamodb
    band: staff
    kind: concept
    q: { vi: "Một item hồ sơ đã lên 350 KB vì lưu cả lịch sử hoạt động. Liệt kê hậu quả và cách tái cấu trúc.", en: "A profile item has grown to 350 KB because it stores the whole activity history. List the consequences and how to restructure." }
    answer: { vi: "Hậu quả: mỗi GetItem strong tốn 88 RCU (350/4 làm tròn lên); mỗi UpdateItem dù đổi một trường cũng tốn WCU theo kích thước item lớn hơn trước/sau (≥ 350 WCU); sắp chạm trần 400 KB, khi đó ghi lỗi; GSI chiếu `ALL` nhân thêm chi phí. Tái cấu trúc: hồ sơ cốt lõi nhỏ ở `sk = PROFILE`, mỗi hoạt động một item `sk = ACT#<ts>` cùng partition key (Query khi cần, TTL cho hoạt động cũ), dữ liệu lớn hiếm đọc để S3.", en: "Consequences: each strongly consistent GetItem costs 88 RCU (350/4 rounded up); each UpdateItem, even of one field, costs WCU for the larger of the before/after item (≥ 350 WCU); it is close to the 400 KB cap, after which writes fail; GSIs projecting `ALL` multiply the cost. Restructure: a small core profile at `sk = PROFILE`, one item per activity at `sk = ACT#<ts>` under the same partition key (Query when needed, TTL for old activity), rarely read large data in S3." }
    rubric:
      - { vi: "Tính chi phí đọc/ghi theo kích thước", en: "Computes read/write cost by size" }
      - { vi: "Biết Update tính theo cả item", en: "Knows Update is billed on the whole item" }
      - { vi: "Tách thành nhiều item cùng partition", en: "Splits into many items in one partition" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-use-s3-too.html
  - id: e-iv-dy-staff-08
    engine: dynamodb
    band: staff
    kind: diagnose
    q: { vi: "Một GSI có partition key là `status` (3 giá trị, chia đều). Bảng nhận 9.000 ghi/giây (1 KB), mọi item đều có `status`. Tính tải trên mỗi khóa GSI và dự đoán hệ quả.", en: "A GSI's partition key is `status` (3 values, evenly spread). The table takes 9,000 writes/s (1 KB) and every item has `status`. Compute the load per GSI key and predict the consequence." }
    exhibits:
      - label: { vi: "Đầu vào", en: "Input" }
        source: aws-rules
        shown: "9,000 writes/s x 1 KB; GSI pk = status, 3 values evenly spread; per-partition limit 1,000 WCU"
        calc:
          - { expr: "9000 * Math.ceil(1 / 1) / 3", expect: 3000 }
          - { expr: "3000 / 1000", expect: 3 }
    answer: { vi: "Mỗi giá trị `status` nhận 3.000 WCU trên GSI, gấp 3 giới hạn 1.000 WCU của một partition cho một khóa: GSI bị throttle, và qua back-pressure kéo theo ghi vào bảng bị throttle, dù tổng dung lượng còn dư. Khóa cardinality thấp là lỗi thiết kế GSI điển hình. Sửa: thêm hậu tố shard (`status#<0..9>`) và Query song song; hoặc GSI thưa chỉ cho trạng thái hiếm cần tra (ví dụ chỉ đơn `FAILED`), còn trạng thái phổ biến không cần chỉ mục.", en: "Each `status` value receives 3,000 WCU on the GSI, 3× the 1,000 WCU per-partition limit for one key: the GSI throttles and, through back-pressure, table writes throttle too, despite spare total capacity. Low-cardinality keys are the classic GSI design mistake. Fix: add a shard suffix (`status#<0..9>`) with parallel Queries; or a sparse GSI only for the rare status that needs lookup (say only `FAILED` orders), leaving common statuses unindexed." }
    rubric:
      - { vi: "3.000 WCU mỗi khóa, gấp 3 giới hạn", en: "3,000 WCU per key, 3× the limit" }
      - { vi: "Nối với back-pressure lên bảng", en: "Connects to back-pressure on the table" }
      - { vi: "Sửa bằng shard hậu tố hoặc GSI thưa", en: "Fix via suffix sharding or a sparse GSI" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-indexes-general.html
  - id: e-iv-dy-staff-09
    engine: dynamodb
    band: staff
    kind: diagnose
    q: { vi: "API \"đơn chưa thanh toán của khách\" dùng Query theo khách + `FilterExpression` trên trạng thái. Phản hồi điển hình: `ScannedCount: 1000, Count: 50`, item 2 KB, eventual. So chi phí với một GSI thưa chỉ chứa đơn chưa thanh toán.", en: "The \"customer's unpaid orders\" API uses a per-customer Query + a `FilterExpression` on status. A typical response: `ScannedCount: 1000, Count: 50`, 2 KB items, eventual. Compare the cost with a sparse GSI holding only unpaid orders." }
    exhibits:
      - label: { vi: "Đầu vào", en: "Input" }
        source: aws-rules
        shown: |-
          summed over the pages of one API call: Count 50, ScannedCount 1000
          item size 2 KB, eventually consistent; alternative: sparse GSI with only unpaid orders (50 items read)
        calc:
          - { expr: "Math.ceil(1000 * 2 / 4) * 0.5", expect: 250 }
          - { expr: "Math.ceil(50 * 2 / 4) * 0.5", expect: 12.5 }
          - { expr: "250 / 12.5", expect: 20 }
          - { expr: "Math.ceil(1000 * 2 / 1024)", expect: 2 }
    answer: { vi: "Hiện tại: đọc 1.000 × 2 KB = 2.000 KB → 500 khối × 0,5 = 250 RCU mỗi lần gọi, để trả 50 item. GSI thưa (`unpaid_pk = CUST#<id>` chỉ đặt khi chưa thanh toán, REMOVE khi trả xong): 50 × 2 KB = 100 KB → 25 khối × 0,5 = 12,5 RCU, rẻ hơn 20 lần (đổi lại chi phí ghi GSI khi trạng thái đổi). Thêm nữa, 2.000 KB vượt trang 1 MB, nên Query hiện tại đã phải gọi ít nhất 2 trang mới đủ 50 kết quả; GSI thưa chỉ cần một lần gọi.", en: "Today: 1,000 × 2 KB = 2,000 KB read → 500 blocks × 0.5 = 250 RCU per call, to return 50 items. Sparse GSI (`unpaid_pk = CUST#<id>` set only while unpaid, REMOVEd once paid): 50 × 2 KB = 100 KB → 25 blocks × 0.5 = 12.5 RCU, 20× cheaper (in exchange for GSI writes on status changes). Also, 2,000 KB exceeds the 1 MB page, so the current Query already needs at least 2 pages to collect the 50 results; the sparse GSI needs one call." }
    rubric:
      - { vi: "250 RCU vs 12,5 RCU", en: "250 RCU vs 12.5 RCU" }
      - { vi: "Thiết kế GSI thưa đúng (đặt/xóa thuộc tính)", en: "Correct sparse GSI design (set/remove attribute)" }
      - { vi: "Nêu chi phí ghi và vấn đề phân trang", en: "States the write cost and the paging issue" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-indexes-general-sparse-indexes.html
  - id: e-iv-dy-staff-10
    engine: dynamodb
    band: staff
    kind: diagnose
    q: { vi: "Một job cập nhật cờ `last_seen` (vài byte) trên item 380 KB, 100 lần/giây. Hóa đơn ghi cao bất thường. Tính và giải thích.", en: "A job updates a tiny `last_seen` flag on a 380 KB item, 100 times per second. The write bill is unusually high. Compute and explain." }
    exhibits:
      - label: { vi: "Đầu vào", en: "Input" }
        source: aws-rules
        shown: "UpdateItem on a 380 KB item (changes a few bytes); 100 updates/s; UpdateItem bills the larger of the item size before and after"
        calc:
          - { expr: "Math.ceil(380 / 1)", expect: 380 }
          - { expr: "Math.ceil(380 / 1) * 100", expect: 38000 }
          - { expr: "Math.ceil(0.2 / 1) * 100", expect: 100 }
    answer: { vi: "`UpdateItem` tính WCU theo kích thước item lớn hơn giữa trước và sau khi cập nhật, không theo phần thay đổi: 380 WCU mỗi lần, 100 lần/giây = 38.000 WCU, và còn vượt 1.000 WCU/partition nên bị throttle. Tách `last_seen` thành item riêng nhỏ (`sk = SEEN`, ~0,2 KB): 1 WCU mỗi lần, 100 WCU tổng: rẻ hơn 380 lần.", en: "`UpdateItem` bills WCU on the larger of the item before and after the update, not on the changed bytes: 380 WCU each, 100/s = 38,000 WCU, which also exceeds 1,000 WCU per partition, so it throttles. Move `last_seen` into a small separate item (`sk = SEEN`, ~0.2 KB): 1 WCU each, 100 WCU total: 380× cheaper." }
    rubric:
      - { vi: "Biết Update tính theo cả item", en: "Knows Update bills the whole item" }
      - { vi: "38.000 WCU và vượt giới hạn partition", en: "38,000 WCU and over the partition limit" }
      - { vi: "Tách item nhỏ cho dữ liệu đổi thường xuyên", en: "Splits frequently changing data into a small item" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/CapacityUnitCalculations.html
  - id: e-iv-dy-staff-11
    engine: dynamodb
    band: staff
    kind: design
    q: { vi: "Xây rate limiter theo API key (100 request/phút) dùng chung cho 200 máy chủ, lưu trên DynamoDB.", en: "Build a per-API-key rate limiter (100 requests/minute) shared by 200 servers, stored in DynamoDB." }
    answer: { vi: "Cửa sổ cố định: item `pk = RL#<key>#<minute>`, mỗi request `UpdateItem ADD count :one` với `ConditionExpression: 'attribute_not_exists(count) OR count < :limit'`, đặt `expires_at` cho TTL. Điều kiện thất bại = vượt giới hạn (trả 429). Một lệnh nguyên tử, không cần đọc trước. Khóa nóng: một key 100 req/phút thì không sao; key lớn (hàng nghìn req/giây) cần shard hậu tố và chia hạn mức. Nếu cần mượt hơn, token bucket với `tokens` và `updated_at`, cập nhật có điều kiện theo `updated_at` cũ.", en: "Fixed window: an item `pk = RL#<key>#<minute>`, each request does `UpdateItem ADD count :one` with `ConditionExpression: 'attribute_not_exists(count) OR count < :limit'`, setting `expires_at` for TTL. A failed condition = over the limit (return 429). One atomic call, no prior read. Hot keys: a key at 100 req/min is fine; a huge key (thousands of req/s) needs suffix sharding with a split quota. For smoother limits, a token bucket with `tokens` and `updated_at`, conditionally updated against the old `updated_at`." }
    tradeoffs:
      - { vi: "Cửa sổ cố định đơn giản nhưng cho phép dồn gấp đôi ở ranh giới phút.", en: "A fixed window is simple but allows a double burst at the minute boundary." }
      - { vi: "Mỗi request thêm một lần ghi DynamoDB: độ trễ và chi phí; có thể đệm cục bộ để giảm.", en: "Each request adds a DynamoDB write: latency and cost; local buffering can reduce it." }
    rubric:
      - { vi: "ADD + điều kiện trong một lệnh", en: "ADD + condition in one call" }
      - { vi: "TTL cho item cửa sổ cũ", en: "TTL for old window items" }
      - { vi: "Nêu ranh giới cửa sổ và khóa nóng", en: "Mentions window edges and hot keys" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/WorkingWithItems.html
  - id: e-iv-dy-staff-12
    engine: dynamodb
    band: staff
    kind: design
    q: { vi: "Đặt hàng gồm: giữ tồn kho (bảng Inventory), tạo đơn (bảng Orders), thu tiền (dịch vụ ngoài). Thiết kế để không bán quá và không thu tiền đơn không tồn tại.", en: "Placing an order involves: reserving stock (Inventory table), creating the order (Orders table), charging (an external service). Design it to never oversell and never charge for an order that does not exist." }
    answer: { vi: "Bước 1 (nguyên tử trong DynamoDB): `TransactWriteItems` gồm Update tồn kho có điều kiện `available >= :q` và Put đơn trạng thái `PENDING_PAYMENT` có `attribute_not_exists`, với `ClientRequestToken`. Bước 2: Stream của Orders (hoặc hàng đợi) kích hoạt thu tiền với khóa idempotency = id đơn, nên gọi lại không thu hai lần. Bước 3: thành công → cập nhật đơn `PAID` (có điều kiện trạng thái); thất bại hoặc quá hạn → saga bù: transaction trả tồn kho + đơn `CANCELLED`. Job quét đơn `PENDING_PAYMENT` quá hạn qua GSI thưa.", en: "Step 1 (atomic in DynamoDB): `TransactWriteItems` with a stock Update conditioned on `available >= :q` and a Put of the order in `PENDING_PAYMENT` with `attribute_not_exists`, using `ClientRequestToken`. Step 2: the Orders Stream (or a queue) triggers the charge with an idempotency key = order id, so retries never double-charge. Step 3: success → update the order to `PAID` (status-conditioned); failure or timeout → a compensating saga: a transaction returning stock + order `CANCELLED`. A job finds overdue `PENDING_PAYMENT` orders via a sparse GSI." }
    tradeoffs:
      - { vi: "Saga đúng nhưng có trạng thái trung gian người dùng nhìn thấy.", en: "The saga is correct but has intermediate states users can see." }
      - { vi: "Giữ tồn kho trước khi thu tiền có thể khóa hàng của đơn bỏ dở: cần thời hạn giữ.", en: "Reserving before charging can lock stock for abandoned orders: holds need an expiry." }
    rubric:
      - { vi: "Transaction giữ kho + tạo đơn có điều kiện", en: "Transaction reserving stock + conditional order create" }
      - { vi: "Thu tiền idempotent theo id đơn", en: "Idempotent charge by order id" }
      - { vi: "Bù trừ khi thất bại / quá hạn", en: "Compensation on failure / timeout" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/transaction-apis.html
  - id: e-iv-dy-staff-13
    engine: dynamodb
    band: staff
    kind: concept
    q: { vi: "Một sản phẩm được hàng triệu người xem cùng lúc trong flash sale: đọc nóng một item. Bạn có những lựa chọn nào?", en: "One product is viewed by millions at once in a flash sale: a hot item read. What are your options?" }
    answer: { vi: "Một khóa bị giới hạn 3.000 RCU (strong) hoặc 6.000 lần đọc eventual 4 KB mỗi giây. Lựa chọn: (1) cache trước DynamoDB (DAX, write-through, đọc eventual, độ trễ micro giây) hoặc cache ở ứng dụng/CDN với TTL ngắn; (2) nhân bản item đọc nóng thành N bản `PRODUCT#<id>#<n>` và đọc ngẫu nhiên một bản (ghi phải cập nhật cả N); (3) tách phần đổi nhanh (tồn kho) khỏi phần tĩnh (mô tả) để phần tĩnh cache lâu. Đọc eventual giúp gấp đôi so với strong.", en: "One key is capped at 3,000 RCU (strong) or 6,000 eventual 4 KB reads per second. Options: (1) a cache in front (DAX, write-through, eventual reads, microsecond latency) or an app/CDN cache with a short TTL; (2) replicate the hot item into N copies `PRODUCT#<id>#<n>` and read a random one (writes update all N); (3) split fast-changing data (stock) from static data (description) so the static part caches long. Eventual reads double the headroom versus strong." }
    rubric:
      - { vi: "Biết giới hạn đọc của một khóa", en: "Knows one key's read limit" }
      - { vi: "Cache (DAX/ứng dụng) và nhất quán của nó", en: "Caching (DAX/app) and its consistency" }
      - { vi: "Nhân bản item hoặc tách phần nóng", en: "Item replication or splitting hot data" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.html
  - id: e-iv-dy-staff-14
    engine: dynamodb
    band: staff
    kind: concept
    q: { vi: "Kể các giới hạn \"cứng\" của DynamoDB mà thiết kế phải tính trước, mỗi cái một hệ quả.", en: "List DynamoDB's \"hard\" limits that a design must account for, with one consequence each." }
    answer: { vi: "Item 400 KB (dữ liệu lớn ra S3). Query/Scan 1 MB mỗi trang (phải phân trang). Partition 3.000 RCU / 1.000 WCU mỗi khóa (shard khóa nóng). Transaction 100 thao tác, 4 MB (chia nghiệp vụ lớn thành saga). BatchWrite 25 item, BatchGet 100 item (lặp và xử lý Unprocessed). LSI: item collection 10 GB, tạo lúc tạo bảng. Streams giữ 24 giờ (consumer không được chậm quá). Một số hạn mức (số GSI, số bảng) là mặc định có thể xin tăng, khác với giới hạn cứng.", en: "Items 400 KB (big data to S3). Query/Scan 1 MB per page (must paginate). 3,000 RCU / 1,000 WCU per partition key (shard hot keys). Transactions 100 operations, 4 MB (split big flows into sagas). BatchWrite 25 items, BatchGet 100 items (loop and handle Unprocessed). LSI: 10 GB item collections, created with the table. Streams retained 24 hours (consumers must not lag that far). Some quotas (GSI count, table count) are adjustable defaults, unlike hard limits." }
    rubric:
      - { vi: "Ít nhất năm giới hạn đúng số", en: "At least five limits with correct numbers" }
      - { vi: "Mỗi giới hạn có hệ quả thiết kế", en: "A design consequence for each" }
      - { vi: "Phân biệt giới hạn cứng và hạn mức tăng được", en: "Separates hard limits from adjustable quotas" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ServiceQuotas.html
  - id: e-iv-dy-staff-15
    engine: dynamodb
    band: staff
    kind: design
    q: { vi: "Lưu dữ liệu cảm biến IoT: 50.000 thiết bị, mỗi thiết bị 1 bản ghi/10 giây, đọc chủ yếu 24 giờ gần nhất, giữ 13 tháng cho tra cứu hiếm. Thiết kế tối ưu chi phí.", en: "Store IoT sensor data: 50,000 devices, one record per device every 10 seconds, reads mostly the last 24 hours, keep 13 months for rare lookups. Design for cost." }
    answer: { vi: "Tải: 5.000 ghi/giây. Khóa `pk = DEV#<id>#<day>`, `sk = ts`: mỗi thiết bị-ngày một item collection, ghi phân tán theo 50.000 thiết bị. Gom: ghi lô theo phút (6 điểm trong một item) giảm số ghi 6 lần nếu chấp nhận trễ 1 phút. TTL `expires_at` = 30 ngày cho dữ liệu nóng; TTL xóa không tốn WCU và xuất hiện trong Streams: dùng Stream để lưu bản tóm tắt/bản gốc sang S3 (định dạng cột) cho 13 tháng, truy vấn hiếm bằng SQL trên S3. Có thể dùng lớp bảng Standard-IA nếu lưu trữ chiếm phần lớn chi phí.", en: "Load: 5,000 writes/s. Key `pk = DEV#<id>#<day>`, `sk = ts`: one item collection per device-day, writes spread over 50,000 devices. Batching: write per minute (6 points in one item) cuts writes 6× if 1 minute of delay is acceptable. TTL `expires_at` = 30 days for hot data; TTL deletes cost no WCU and appear in Streams: use the Stream to archive rollups/raw data to S3 (columnar format) for 13 months, rare lookups via SQL over S3. The Standard-IA table class may help if storage dominates cost." }
    tradeoffs:
      - { vi: "Gom theo phút rẻ hơn nhiều nhưng dữ liệu xuất hiện trễ và một item lỗi mất nhiều điểm.", en: "Per-minute batching is much cheaper but data appears later and one failed item loses many points." }
      - { vi: "Dữ liệu cũ trên S3 rẻ nhưng tra cứu chậm hơn và cần một công cụ khác.", en: "Old data on S3 is cheap but lookups are slower and need another tool." }
    rubric:
      - { vi: "Tính tải 5.000 ghi/giây và khóa phân tán", en: "Computes 5,000 writes/s and a spread key" }
      - { vi: "TTL + Streams lưu trữ sang S3", en: "TTL + Streams archiving to S3" }
      - { vi: "Ít nhất một tối ưu chi phí khác (gom lô / lớp bảng)", en: "At least one more cost optimisation (batching / table class)" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-time-series.html

takeHomes:
  - id: e-iv-pg-th-1
    engine: postgres
    band: mid
    title: { vi: "Ba truy vấn chậm của trang quản trị", en: "Three slow admin-page queries" }
    brief: { vi: "Trang quản trị cửa hàng chạy ba truy vấn dưới đây trên dữ liệu `pg-shop` (bảng `customers`, `orders`, chưa có chỉ mục phụ). Người quản lý sản phẩm hỏi: \"Làm sao cho trang này nhanh mà không làm chậm việc đặt hàng?\" Hãy đo, đề xuất và chứng minh.", en: "The shop admin page runs the three queries below on the `pg-shop` data (tables `customers`, `orders`, no secondary indexes yet). The product manager asks: \"How do we make this page fast without slowing down ordering?\" Measure, propose and prove it." }
    fixture: pg-shop
    queries:
      - "SELECT id, total FROM orders WHERE customer_id = 42 ORDER BY created_at DESC LIMIT 20"
      - "SELECT count(*) FROM orders WHERE status = 'REFUNDED' AND created_at >= '2026-06-01'"
      - "SELECT c.city, count(*) FROM orders o JOIN customers c ON c.id = o.customer_id WHERE o.created_at >= '2026-09-01' AND o.created_at < '2026-10-01' GROUP BY c.city"
    deliverables:
      - { vi: "Kế hoạch `EXPLAIN (ANALYZE, BUFFERS)` trước và sau cho cả ba truy vấn.", en: "Before and after `EXPLAIN (ANALYZE, BUFFERS)` plans for all three queries." }
      - { vi: "Danh sách chỉ mục đề xuất (tối đa 3), mỗi cái một câu lý do.", en: "A list of proposed indexes (at most 3), one sentence of reasoning each." }
      - { vi: "Một đoạn ≤ 120 chữ cho người quản lý sản phẩm về cái giá phía ghi.", en: "A paragraph ≤ 120 words for the product manager about the write-side cost." }
    model: { vi: "Q1: `(customer_id, created_at DESC)` cho Index Scan dừng sau 20 dòng, không Sort. Q2: chỉ mục một phần `(created_at) WHERE status = 'REFUNDED'`: rất nhỏ (1% dòng), phục vụ đúng truy vấn này. Q3: `(created_at)` (hoặc BRIN nếu bảng chỉ chèn theo thời gian) cho Bitmap/Index Scan một tháng rồi Hash Join với `customers`; có thể dùng `(created_at) INCLUDE (customer_id)` để thành index-only scan sau VACUUM. Phía ghi: mỗi chỉ mục thêm việc cho mỗi INSERT; chỉ mục một phần chỉ tốn khi đơn hoàn tiền. Tổng 3 chỉ mục là chấp nhận được; đo lại thời gian chèn trước/sau.", en: "Q1: `(customer_id, created_at DESC)` gives an Index Scan that stops after 20 rows, no Sort. Q2: a partial index `(created_at) WHERE status = 'REFUNDED'`: tiny (1% of rows), serving exactly this query. Q3: `(created_at)` (or BRIN if the table is append-only by time) gives a one-month Bitmap/Index Scan then a Hash Join with `customers`; `(created_at) INCLUDE (customer_id)` can make it index-only after VACUUM. Write side: each index adds work to every INSERT; the partial one only costs on refunds. Three indexes are acceptable; re-measure insert time before/after." }
    rubric:
      - { vi: "Có số đo trước/sau thật, không chỉ lý thuyết", en: "Real before/after measurements, not just theory" }
      - { vi: "Chỉ mục khớp từng truy vấn (thứ tự cột, một phần, INCLUDE)", en: "Indexes fit each query (column order, partial, INCLUDE)" }
      - { vi: "Nói rõ cái giá phía ghi và cách đo", en: "States the write-side cost and how to measure it" }
      - { vi: "Viết cho người không biết SQL, ≤ 120 chữ", en: "Written for someone who does not know SQL, ≤ 120 words" }
    doc: https://www.postgresql.org/docs/18/using-explain.html
  - id: e-iv-pg-th-2
    engine: postgres
    band: senior
    title: { vi: "Sổ cái ví điện tử chịu tải song song", en: "A wallet ledger under concurrency" }
    brief: { vi: "Thiết kế lược đồ và giao dịch cho ví điện tử: nạp, rút, chuyển giữa hai ví. Yêu cầu: số dư không bao giờ âm, không mất hay nhân đôi tiền khi client gửi lại request, và đối soát được mọi biến động. Viết SQL tạo bảng, hàm hoặc chuỗi lệnh cho \"chuyển tiền\", và một kịch bản kiểm tra với hai phiên chạy xen kẽ.", en: "Design the schema and transactions for an e-wallet: top-up, withdrawal, transfer between two wallets. Requirements: balances never go negative, no money lost or duplicated when a client resends a request, and every movement can be reconciled. Write the CREATE TABLE SQL, a function or statement sequence for \"transfer\", and a test script with two interleaved sessions." }
    deliverables:
      - { vi: "DDL với ràng buộc (`CHECK`, khóa ngoại, duy nhất cho khóa idempotency).", en: "DDL with constraints (`CHECK`, foreign keys, uniqueness for the idempotency key)." }
      - { vi: "SQL chuyển tiền và giải thích mức isolation/khóa đã chọn.", en: "Transfer SQL and an explanation of the chosen isolation/locking." }
      - { vi: "Kịch bản hai phiên chứng minh không có số dư âm và không deadlock.", en: "A two-session script proving no negative balance and no deadlock." }
    model: { vi: "`wallets(id, balance numeric CHECK (balance >= 0), version)`, `ledger(id, wallet_id, amount, transfer_id, created_at)`, `transfers(id, idem_key UNIQUE, from_id, to_id, amount CHECK (amount > 0), status)`. Chuyển tiền trong một transaction ở `READ COMMITTED`: `INSERT INTO transfers … ON CONFLICT (idem_key) DO NOTHING RETURNING id` (không có dòng = đã xử lý, trả kết quả cũ); `SELECT … FROM wallets WHERE id IN (a, b) ORDER BY id FOR UPDATE` (thứ tự khóa cố định chống deadlock); trừ và cộng (`CHECK` chặn số âm, ứng dụng kiểm trước để báo lỗi rõ); chèn hai dòng ledger có tổng bằng 0. Đối soát: `SUM(amount)` theo ví trong ledger = `balance`.", en: "`wallets(id, balance numeric CHECK (balance >= 0), version)`, `ledger(id, wallet_id, amount, transfer_id, created_at)`, `transfers(id, idem_key UNIQUE, from_id, to_id, amount CHECK (amount > 0), status)`. Transfer in one `READ COMMITTED` transaction: `INSERT INTO transfers … ON CONFLICT (idem_key) DO NOTHING RETURNING id` (no row = already processed, return the old result); `SELECT … FROM wallets WHERE id IN (a, b) ORDER BY id FOR UPDATE` (fixed lock order prevents deadlocks); debit and credit (the `CHECK` blocks negatives, the app checks first for a clear error); insert two ledger rows summing to zero. Reconcile: ledger `SUM(amount)` per wallet = `balance`." }
    rubric:
      - { vi: "Ràng buộc trong DB chặn số âm", en: "DB constraints block negatives" }
      - { vi: "Khóa idempotency duy nhất cho request gửi lại", en: "A unique idempotency key for resent requests" }
      - { vi: "Thứ tự khóa cố định / retry, chứng minh bằng hai phiên", en: "Fixed lock order / retry, proven with two sessions" }
      - { vi: "Sổ cái kép đối soát được", en: "A double-entry ledger that reconciles" }
    doc: https://www.postgresql.org/docs/18/explicit-locking.html
  - id: e-iv-mg-th-1
    engine: mongodb
    band: mid
    title: { vi: "Mô hình dữ liệu cho ứng dụng đặt lịch phòng khám", en: "Data model for a clinic booking app" }
    brief: { vi: "Ứng dụng đặt lịch cho 300 phòng khám: bác sĩ, khung giờ trống, lịch hẹn, bệnh nhân, đánh giá sau khám. Màn chính: \"khung trống của một bác sĩ trong 7 ngày tới\", \"lịch hẹn sắp tới của một bệnh nhân\", \"điểm trung bình của bác sĩ\". Hai người không được đặt cùng một khung giờ. Thiết kế collection, tài liệu mẫu, chỉ mục và lệnh đặt lịch.", en: "A booking app for 300 clinics: doctors, free slots, appointments, patients, post-visit reviews. Main screens: \"a doctor's free slots for the next 7 days\", \"a patient's upcoming appointments\", \"a doctor's average rating\". Two people must never book the same slot. Design collections, sample documents, indexes and the booking command." }
    deliverables:
      - { vi: "Danh sách access pattern và collection phục vụ mỗi cái.", en: "The access pattern list and which collection serves each." }
      - { vi: "Tài liệu mẫu JSON và chỉ mục (kèm lý do ESR).", en: "Sample JSON documents and indexes (with ESR reasoning)." }
      - { vi: "Lệnh đặt lịch không thể đặt trùng, và cách cập nhật điểm trung bình.", en: "A booking command that cannot double-book, and how the average rating is kept." }
    model: { vi: "`slots { _id, doctor_id, start, status: 'FREE'|'BOOKED', patient_id? }`, chỉ mục `{ doctor_id: 1, status: 1, start: 1 }` (E, E, R). Đặt: `updateOne({ _id: slot, status: 'FREE' }, { $set: { status: 'BOOKED', patient_id: p } })`: `modifiedCount = 0` là đã có người đặt; một tài liệu nên nguyên tử, không cần transaction. `appointments` có thể chính là slot đã đặt, thêm chỉ mục `{ patient_id: 1, start: 1 }` (partial theo `status: 'BOOKED'`). `doctors` dùng mẫu Computed: `rating_sum`, `rating_count` cập nhật bằng `$inc` khi có đánh giá; `reviews` là collection riêng (không giới hạn).", en: "`slots { _id, doctor_id, start, status: 'FREE'|'BOOKED', patient_id? }`, index `{ doctor_id: 1, status: 1, start: 1 }` (E, E, R). Booking: `updateOne({ _id: slot, status: 'FREE' }, { $set: { status: 'BOOKED', patient_id: p } })`: `modifiedCount = 0` means someone already booked; one document, so atomic, no transaction needed. `appointments` can simply be booked slots, plus an index `{ patient_id: 1, start: 1 }` (partial on `status: 'BOOKED'`). `doctors` use the Computed pattern: `rating_sum`, `rating_count` updated with `$inc` per review; `reviews` is its own (unbounded) collection." }
    rubric:
      - { vi: "Bắt đầu từ access pattern", en: "Starts from access patterns" }
      - { vi: "Chống đặt trùng bằng cập nhật có điều kiện một tài liệu", en: "Prevents double booking with a single-document conditional update" }
      - { vi: "Chỉ mục theo ESR cho từng màn", en: "ESR indexes for each screen" }
      - { vi: "Mẫu Computed cho điểm trung bình, review không nhúng", en: "Computed pattern for ratings, reviews not embedded" }
    doc: https://www.mongodb.com/docs/manual/data-modeling/design-patterns/
  - id: e-iv-mg-th-2
    engine: mongodb
    band: senior
    title: { vi: "Kiểm toán chỉ mục từ nhật ký truy vấn chậm", en: "Index audit from the slow query log" }
    brief: { vi: "Bạn nhận một collection `orders` (40 triệu tài liệu) có 11 chỉ mục và trích đoạn nhật ký truy vấn chậm của một tuần (tự tạo dữ liệu giả lập hoặc dùng bộ dữ liệu mẫu công khai). Viết báo cáo: chỉ mục nào thừa, chỉ mục nào thiếu, thay đổi nào làm trước, và cách triển khai an toàn.", en: "You receive an `orders` collection (40 million documents) with 11 indexes and a week of slow query log excerpts (generate synthetic data or use a public sample dataset). Write a report: which indexes are redundant, which are missing, what to change first, and how to roll out safely." }
    deliverables:
      - { vi: "Bảng: hình dạng truy vấn, tần suất, keysExamined/nReturned, chỉ mục đang dùng.", en: "A table: query shape, frequency, keysExamined/nReturned, index used." }
      - { vi: "Danh sách xóa/thêm chỉ mục với bằng chứng (`$indexStats`, explain).", en: "Index drops/additions with evidence (`$indexStats`, explain)." }
      - { vi: "Kế hoạch triển khai: ẩn trước khi xóa, tạo chỉ mục giờ thấp điểm, theo dõi.", en: "A rollout plan: hide before drop, build off-peak, monitor." }
    model: { vi: "Gom nhật ký theo `queryHash`/hình dạng, xếp theo tổng thời gian. Dấu hiệu thiếu chỉ mục: `keysExamined` hoặc `docsExamined` ≫ `nreturned`, `SORT` trong bộ nhớ, `COLLSCAN`. Dấu hiệu thừa: chỉ mục là tiền tố của chỉ mục khác (`{ a: 1 }` khi đã có `{ a: 1, b: 1 }`), `$indexStats.accesses.ops` gần 0 trên mọi nút qua cả chu kỳ. Ưu tiên thay đổi có lợi lớn nhất trên mỗi đơn vị rủi ro: thêm chỉ mục ESR cho hình dạng nặng nhất trước, rồi ẩn các chỉ mục thừa, xóa sau 1–2 tuần không có hồi quy.", en: "Group the log by `queryHash`/shape, rank by total time. Missing-index signs: `keysExamined` or `docsExamined` ≫ `nreturned`, in-memory `SORT`, `COLLSCAN`. Redundancy signs: an index that is a prefix of another (`{ a: 1 }` beside `{ a: 1, b: 1 }`), `$indexStats.accesses.ops` near 0 on every node over a full cycle. Prioritise by benefit per unit of risk: add an ESR index for the heaviest shape first, then hide redundant indexes, drop them after 1–2 weeks without regressions." }
    rubric:
      - { vi: "Phân tích theo hình dạng truy vấn có số liệu", en: "Shape-based analysis with numbers" }
      - { vi: "Nhận diện đúng chỉ mục tiền tố thừa", en: "Correctly spots redundant prefix indexes" }
      - { vi: "Đề xuất thiếu theo ESR có bằng chứng explain", en: "ESR-based additions with explain evidence" }
      - { vi: "Triển khai an toàn: ẩn, theo dõi, rồi xóa", en: "Safe rollout: hide, monitor, then drop" }
    doc: https://www.mongodb.com/docs/manual/core/index-hidden/
  - id: e-iv-dy-th-1
    engine: dynamodb
    band: mid
    title: { vi: "Thiết kế single-table cho cửa hàng trực tuyến", en: "Single-table design for an online shop" }
    brief: { vi: "Cửa hàng trực tuyến cần: xem hồ sơ khách; đơn của khách mới nhất trước; chi tiết một đơn với các dòng hàng; đơn theo trạng thái cho kho; sản phẩm theo danh mục; đánh giá của một sản phẩm. Thiết kế một bảng DynamoDB (khóa, GSI, item mẫu) và chứng minh mỗi access pattern là một Query hoặc GetItem.", en: "An online shop needs: view a customer profile; a customer's orders newest first; one order's detail with its lines; orders by status for the warehouse; products by category; a product's reviews. Design one DynamoDB table (keys, GSIs, sample items) and show that every access pattern is one Query or GetItem." }
    deliverables:
      - { vi: "Bảng access pattern → thao tác → khóa/chỉ mục.", en: "An access pattern → operation → key/index table." }
      - { vi: "Item mẫu cho mọi loại thực thể với pk/sk/gsi.", en: "Sample items for every entity type with pk/sk/gsi." }
      - { vi: "Ước tính RCU/WCU cho 100 đơn/phút.", en: "An RCU/WCU estimate for 100 orders per minute." }
    model: { vi: "`pk = CUST#<c>`, `sk = PROFILE` | `ORDER#<ts>#<o>` (đơn của khách, Query `begins_with(sk, 'ORDER#')`, `ScanIndexForward: false`). Chi tiết đơn: item collection riêng `pk = ORDER#<o>`, `sk = HEAD` | `LINE#<n>` (một Query). Kho: GSI1 thưa `gsi1pk = STATUS#<s>#<day>`, `gsi1sk = ts` (hậu tố ngày tránh khóa nóng). Sản phẩm: `pk = PROD#<p>`, `sk = META` | `REVIEW#<ts>`; danh mục qua GSI2 `gsi2pk = CAT#<cat>`, `gsi2sk = name`. Ước tính: item tóm tắt dưới khách + đầu đơn (mỗi cái ≤ 1 KB) + 3 dòng 0,5 KB → 5 item, mỗi item làm tròn 1 WCU, cộng GSI1 1 WCU: ~6 WCU/đơn → 100 đơn/phút = 10 WCU/giây.", en: "`pk = CUST#<c>`, `sk = PROFILE` | `ORDER#<ts>#<o>` (a customer's orders, Query `begins_with(sk, 'ORDER#')`, `ScanIndexForward: false`). Order detail: its own item collection `pk = ORDER#<o>`, `sk = HEAD` | `LINE#<n>` (one Query). Warehouse: sparse GSI1 `gsi1pk = STATUS#<s>#<day>`, `gsi1sk = ts` (the day suffix avoids a hot key). Products: `pk = PROD#<p>`, `sk = META` | `REVIEW#<ts>`; categories via GSI2 `gsi2pk = CAT#<cat>`, `gsi2sk = name`. Estimate: a summary item under the customer + the order header (each ≤ 1 KB) + 3 lines of 0.5 KB → 5 items, each rounding to 1 WCU, plus 1 GSI1 WCU: ~6 WCU per order → 100 orders/min = 10 WCU/s." }
    rubric:
      - { vi: "Mọi access pattern là Query/GetItem, không Scan", en: "Every access pattern is Query/GetItem, no Scan" }
      - { vi: "Khóa có tiền tố và sort key có thứ bậc", en: "Prefixed keys and hierarchical sort keys" }
      - { vi: "Tránh khóa GSI nóng (trạng thái)", en: "Avoids a hot GSI key (status)" }
      - { vi: "Ước tính dung lượng đúng quy tắc làm tròn", en: "Capacity estimate with correct rounding" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-general-nosql-design.html
  - id: e-iv-dy-th-2
    engine: dynamodb
    band: senior
    title: { vi: "Rà soát chi phí và throttle của một bảng đang chạy", en: "Cost and throttling review of a live table" }
    brief: { vi: "Một bảng DynamoDB on-demand có hóa đơn tăng gấp 4 trong quý và thỉnh thoảng throttle lúc cao điểm. Bạn có: định nghĩa bảng (2 GSI chiếu `ALL`, một GSI khóa `status`), số liệu CloudWatch giả lập theo giờ (`ConsumedRCU/WCU`, `ThrottledRequests` theo bảng và GSI), và 5 mẫu request kèm `ConsumedCapacity`/`ScannedCount`. Viết báo cáo nguyên nhân và kế hoạch giảm chi phí.", en: "An on-demand DynamoDB table's bill grew 4× this quarter and it occasionally throttles at peak. You have: the table definition (2 GSIs projecting `ALL`, one keyed on `status`), simulated hourly CloudWatch numbers (`ConsumedRCU/WCU`, `ThrottledRequests` per table and GSI), and 5 sample requests with `ConsumedCapacity`/`ScannedCount`. Write a root-cause report and a cost reduction plan." }
    deliverables:
      - { vi: "Bảng phân rã chi phí: bảng vs từng GSI, đọc vs ghi.", en: "A cost breakdown: table vs each GSI, reads vs writes." }
      - { vi: "Nguyên nhân throttle với phép tính theo giới hạn mỗi partition.", en: "Throttling root cause with per-partition limit arithmetic." }
      - { vi: "Kế hoạch có thứ tự, mỗi bước ước tính phần tiết kiệm.", en: "An ordered plan, each step with an estimated saving." }
    model: { vi: "Thứ tự kiểm: (1) request có `ScannedCount` ≫ `Count` (Scan hoặc Filter): thay bằng GSI thưa / khóa tốt hơn; (2) GSI `ALL` làm mỗi ghi tốn gấp 3: đổi sang `INCLUDE`/`KEYS_ONLY` (tạo GSI mới, chuyển đọc, xóa GSI cũ); (3) GSI khóa `status` cardinality thấp: tính WCU mỗi giá trị so với 1.000, shard hậu tố hoặc làm thưa; (4) item lớn bị Update thường xuyên: tách phần đổi nhanh; (5) đọc strong không cần thiết: chuyển eventual; (6) khi tải đã ổn định, so on-demand với provisioned + auto scaling. Mỗi bước ghi phần trăm tiết kiệm từ số đo.", en: "Check order: (1) requests with `ScannedCount` ≫ `Count` (Scan or Filter): replace with a sparse GSI / better keys; (2) `ALL` GSIs make each write cost 3×: switch to `INCLUDE`/`KEYS_ONLY` (create a new GSI, move reads, drop the old); (3) the low-cardinality `status` GSI: compute WCU per value against 1,000, shard with a suffix or make it sparse; (4) large items updated often: split the fast-changing part; (5) unneeded strong reads: switch to eventual; (6) once traffic is steady, compare on-demand with provisioned + auto scaling. Each step states its saving as a percentage from measurements." }
    rubric:
      - { vi: "Phân rã chi phí có số", en: "A numeric cost breakdown" }
      - { vi: "Giải thích throttle bằng giới hạn partition và back-pressure GSI", en: "Explains throttling via partition limits and GSI back-pressure" }
      - { vi: "Kế hoạch có thứ tự theo lợi ích/rủi ro", en: "Plan ordered by benefit/risk" }
      - { vi: "Chuyển đổi GSI không gián đoạn", en: "Non-disruptive GSI migration" }
    doc: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/CapacityUnitCalculations.html
