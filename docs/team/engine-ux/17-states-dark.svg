<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1060" viewBox="0 0 1400 1060" role="img" aria-labelledby="t d">
<title id="t">Trạng thái rỗng, tải, lỗi (tối)</title>
<desc id="d">Mười ô trạng thái của khu Engine: tải chunk, chunk lỗi, đang dựng lab, prepare lỗi, unsupported, thiếu viz, Bên trong rỗng, tải DynamoDB 1,2 MB, quá 5 giây, bài cần máy chủ thật.</desc>
<!-- BoonData Engine UX mockup, theme dark. Hex values = tokens of src/style.css (:root[data-theme=dark]). Purple dashed = spec annotation, not UI. -->
<defs><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d0c5b9"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#62dccb"/></marker><marker id="m-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffc874"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff968a"/></marker><marker id="m-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#86ccff"/></marker><marker id="m-ann" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dcaeff"/></marker><marker id="m-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#74de93"/></marker><marker id="m-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f8f3ed"/></marker>
<pattern id="hatch-bad" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#3d1f1b"/><line x1="0" y1="0" x2="0" y2="6" stroke="#ff968a" stroke-width="1.2"/></pattern>
<pattern id="hatch-free" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#2b2622"/><line x1="0" y1="0" x2="0" y2="8" stroke="#4d443c" stroke-width="1"/></pattern>
<pattern id="dots-info" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#142c39"/><circle cx="3" cy="3" r="0.9" fill="#86ccff"/></pattern>
<filter id="sh1" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#2a2320" flood-opacity="0"/></filter>
</defs>
<rect x="0" y="0" width="1400" height="1060" rx="0" fill="#0b0a09"/>
<text x="40" y="40" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="800" fill="#f8f3ed">17 · Trạng thái rỗng, tải, lỗi</text><text x="40" y="64" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#d0c5b9">Ô nền mềm theo nghĩa (--bad-soft lỗi, --warn-soft cảnh báo, --info-soft thông tin); chữ --text; một hành động mỗi ô.</text><rect x="1110" y="22" width="16" height="12" rx="0" fill="none" stroke="#dcaeff" stroke-width="1.5" stroke-dasharray="4 3"/><text x="1132" y="33" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#dcaeff">tím đứt = chú thích spec, không phải UI</text><rect x="40" y="100" width="320" height="260" rx="20" fill="#201c19" stroke="#7d7166" stroke-width="1" filter="url(#sh1)"/><text x="64" y="136" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#f8f3ed">Tải trang bài (chunk engineui)</text><rect x="64" y="170" width="24" height="24" rx="12" fill="none" stroke="#62dccb" stroke-width="3" stroke-dasharray="30 10"/><text x="100" y="188" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#d0c5b9">Đang tải bài…</text><text x="64" y="240" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#d0c5b9">Dòng cố định thay khung trang;</text><text x="64" y="258" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#d0c5b9">không skeleton nhấp nháy.</text><rect x="376" y="100" width="320" height="260" rx="20" fill="#201c19" stroke="#7d7166" stroke-width="1" filter="url(#sh1)"/><text x="400" y="136" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#f8f3ed">Chunk lỗi (mạng)</text><rect x="400" y="160" width="272" height="90" rx="14" fill="#3d1f1b"/><text x="416" y="186" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#f8f3ed">Không tải được phần Database Engine.</text><text x="416" y="206" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#f8f3ed">Kiểm tra mạng rồi thử lại.</text><rect x="416" y="208" width="89" height="32" rx="16" fill="#201c19" stroke="#7d7166" stroke-width="1"/><text x="432" y="229.04" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8f3ed">Thử lại</text><text x="400" y="278" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#d0c5b9">Không tự thử lại vòng lặp; chỉ khi bấm.</text><rect x="712" y="100" width="320" height="260" rx="20" fill="#201c19" stroke="#7d7166" stroke-width="1" filter="url(#sh1)"/><text x="736" y="136" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#f8f3ed">Lab đang dựng dữ liệu (prepare)</text><rect x="736" y="162" width="24" height="24" rx="12" fill="none" stroke="#62dccb" stroke-width="3" stroke-dasharray="30 10"/><text x="772" y="172" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#d0c5b9">Đang dựng dữ liệu cho bài</text><text x="772" y="190" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#d0c5b9">(bảng notes, 83 dòng)…</text><rect x="736" y="210" width="96" height="34" rx="17" fill="#2b2622" stroke="#7d7166" stroke-width="1"/><text x="752" y="232.04" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#d0c5b9">Chạy</text><rect x="844" y="220" width="14" height="14" rx="3" fill="none" stroke="#d0c5b9" stroke-width="1.4"/><text x="866" y="232" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#d0c5b9">Chờ dữ liệu xong</text><rect x="1048" y="100" width="320" height="260" rx="20" fill="#201c19" stroke="#7d7166" stroke-width="1" filter="url(#sh1)"/><text x="1072" y="136" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#f8f3ed">prepare lỗi (setup ném lỗi)</text><rect x="1072" y="156" width="272" height="120" rx="14" fill="#3d1f1b"/><rect x="1088" y="170" width="55" height="22" rx="11" fill="#3d1f1b"/><text x="1098" y="185.32" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ff968a">42P07</text><text x="1088" y="214" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8f3ed">Không dựng được dữ liệu cho bài này.</text><text x="1088" y="234" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12" fill="#d0c5b9">relation &quot;notes&quot; already exists</text><rect x="1088" y="242" width="88" height="28" rx="14" fill="#201c19" stroke="#7d7166" stroke-width="1"/><text x="1104" y="260.32" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8f3ed">Dựng lại</text><rect x="40" y="400" width="320" height="260" rx="20" fill="#201c19" stroke="#7d7166" stroke-width="1" filter="url(#sh1)"/><text x="64" y="436" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#f8f3ed">Bước &quot;unsupported&quot;</text><rect x="64" y="456" width="272" height="120" rx="14" fill="#142c39"/><text x="80" y="482" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#f8f3ed">Bước này kiểm bằng kế hoạch (plan),</text><text x="80" y="502" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#f8f3ed">bộ chạy hiện có không chấm được.</text><text x="80" y="522" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#f8f3ed">Bạn vẫn chạy và xem kết quả; bước</text><text x="80" y="542" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#f8f3ed">không tính đạt.</text><text x="64" y="600" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#d0c5b9">Test nội dung chặn trước khi phát hành.</text><rect x="376" y="400" width="320" height="260" rx="20" fill="#201c19" stroke="#7d7166" stroke-width="1" filter="url(#sh1)"/><text x="400" y="436" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#f8f3ed">Thiếu tên viz</text><text x="400" y="474" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#f8f3ed">Ý chính…</text><line x1="400" y1="490" x2="672" y2="490" stroke="#dcaeff" stroke-width="1" stroke-dasharray="4 3"/><text x="400" y="512" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#f8f3ed">Ví dụ…</text><text x="400" y="550" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#d0c5b9">Khe sơ đồ biến mất (không khung rỗng).</text><text x="400" y="570" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#d0c5b9">tests: mọi viz có trong danh mục.</text><rect x="712" y="400" width="320" height="260" rx="20" fill="#201c19" stroke="#7d7166" stroke-width="1" filter="url(#sh1)"/><text x="736" y="436" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#f8f3ed">Bên trong trước lần chạy đầu</text><rect x="856" y="462" width="32" height="32" rx="5" fill="#163a35" stroke="#d0c5b9" stroke-width="1.2"/><text x="872" y="524" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#d0c5b9" text-anchor="middle">Chạy câu để vẽ trang heap</text><text x="872" y="542" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#d0c5b9" text-anchor="middle">từ chính kết quả của bạn.</text><rect x="1048" y="400" width="320" height="260" rx="20" fill="#201c19" stroke="#7d7166" stroke-width="1" filter="url(#sh1)"/><text x="1072" y="436" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#f8f3ed">Lần đầu mở lab DynamoDB</text><text x="1072" y="476" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8f3ed">Tải bộ máy DynamoDB</text><rect x="1072" y="490" width="272" height="8" rx="4" fill="#2b2622"/><rect x="1072" y="490" width="90" height="8" rx="4" fill="#62dccb"/><text x="1072" y="520" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="13" fill="#f8f3ed">0,4 / 1,2 MB</text><text x="1072" y="550" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#d0c5b9">Báo trước dung lượng; chỉ tải khi mở bài</text><text x="1072" y="566" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#d0c5b9">DynamoDB đầu tiên (D-E12).</text><rect x="40" y="700" width="320" height="260" rx="20" fill="#201c19" stroke="#7d7166" stroke-width="1" filter="url(#sh1)"/><text x="64" y="736" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#f8f3ed">Câu chạy quá 5 giây</text><rect x="64" y="756" width="272" height="100" rx="14" fill="#3a2c10"/><text x="80" y="782" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#f8f3ed">Câu chạy quá 5 giây nên đã dừng.</text><text x="80" y="802" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#f8f3ed">Dữ liệu lab được dựng lại; nháp</text><text x="80" y="822" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#f8f3ed">của bạn còn nguyên.</text><text x="64" y="890" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#d0c5b9">Dòng của Boon dưới nút (Boon oops).</text><rect x="376" y="700" width="320" height="260" rx="20" fill="#201c19" stroke="#7d7166" stroke-width="1" filter="url(#sh1)"/><text x="400" y="736" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#f8f3ed">Bài cần máy chủ thật (BE)</text><rect x="400" y="762" width="67" height="22" rx="11" fill="#2b2622"/><circle cx="411" cy="773" r="3.5" fill="#d0c5b9"/><text x="422" y="777.32" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#d0c5b9">Sơ đồ</text><text x="400" y="810" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#d0c5b9">Phần chạy thật cần máy chủ thật</text><text x="400" y="827" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#d0c5b9">(nhiều phiên / replica set / AWS). Bài</text><text x="400" y="844" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#d0c5b9">này dùng sơ đồ và kết quả ghi sẵn.</text><text x="400" y="876" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#dcaeff">Không chữ &quot;sắp có&quot;.</text>
</svg>
