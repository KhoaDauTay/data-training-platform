<text x="40" y="40" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="800" fill="#2a2320">14 · Kiểm tra cấp (capstone) · 1280</text><text x="40" y="64" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#6b5f57">Một ca nhiều bước như đánh giá thăng tiến; bước kết luận dùng quiz.</text><rect x="1070" y="22" width="16" height="12" rx="0" fill="none" stroke="#7a2bb0" stroke-width="1.5" stroke-dasharray="4 3"/><text x="1092" y="33" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#7a2bb0">tím đứt = chú thích spec, không phải UI</text><!-- frame 1280 × 800 · #/engine/play/e-pg-l5-16 (capstone, bước 3/5) -->
