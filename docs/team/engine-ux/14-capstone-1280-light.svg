<circle cx="510" cy="130" r="10" fill="#7a2bb0"/><text x="510" y="134" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><circle cx="510" cy="460" r="10" fill="#7a2bb0"/><text x="510" y="464" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><circle cx="1338" cy="450" r="10" fill="#7a2bb0"/><text x="1338" y="454" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="40" y="935" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#7a2bb0">① Thanh bước dính đầu pane đề (nền --panel đặc, vạch dưới); bước xong --good, đang làm --accent; tải lại tiếp từ bossStep.  ② &quot;Chấm bằng&quot; liệt kê từng điều kiện, cập nhật sau mỗi lần Nộp (✓/○, chữ, không chỉ màu).</text><text x="40" y="953" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#7a2bb0">③ Tab Kế hoạch: hai nút kế hoạch cạnh nhau, mũi tên --accent; xong capstone: Lily reo ở dock (không trong sơ đồ).</text>
</svg>
