amily="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#2a2320">Logistics ▾</text><rect x="1162" y="15" width="76" height="24" rx="12" fill="#fcf0dc"/><text x="1172" y="31.32" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#9a4f00">1 240 XP</text><rect x="1236" y="10" width="32" height="32" rx="16" fill="none"/><text x="1252" y="31.04" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f766e">⋯</text><g transform="translate(0,53)"><rect x="0" y="0" width="64" height="747" rx="0" fill="#ffffff"/><line x1="64" y1="0" x2="64" y2="747" stroke="#e8dfd3" stroke-width="1"/><rect x="16" y="12" width="32" height="28" rx="14" fill="none"/><text x="32" y="31.04" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f766e">»</text><rect x="10" y="52" width="44" height="40" rx="10" fill="#dcf2ee"/><rect x="22" y="62" width="20" height="20" rx="5" fill="#dcf2ee" stroke="#0f766e" stroke-width="1.2"/><circle cx="32" cy="108" r="7" fill="#17752f" stroke="#17752f" stroke-width="1.5"/><circle cx="32" cy="138" r="7" fill="#17752f" stroke="#17752f" stroke-width="1.5"/><circle cx="32" cy="168" r="7" fill="#17752f" stroke="#17752f" stroke-width="1.5"/><circle cx="32" cy="198" r="7" fill="#17752f" stroke="#17752f" stroke-width="1.5"/><circle cx="32" cy="228" r="9" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="32" y="232" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">5</text><line x1="14" y1="268" x2="50" y2="268" stroke="#e8dfd3" stroke-width="1"/><rect x="22" y="282" width="20" height="20" rx="5" fill="#dcf2ee" stroke="#6b5f57" stroke-width="1.2"/><rect x="22" y="318" width="20" height="20" rx="5" fill="#dcf2ee" stroke="#6b5f57" stroke-width="1.2"/><rect x="22" y="354" width="20" height="20" rx="5" fill="#dcf2ee" stroke="#6b5f57" stroke-width="1.2"/></g><rect x="64" y="53" width="400" height="747" rx="0" fill="#fbf7f0"/><g transform="translate(64,53)"><rect x="0" y="0" width="400" height="64" rx="0" fill="#ffffff"/><line x1="0" y1="64" x2="400" y2="64" stroke="#e8dfd3" stroke-width="1"/><rect x="16" y="14" width="67.6" height="6" rx="3" fill="#17752f"/><text x="16" y="42" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#17752f">1. Đọc pg_stats</text><rect x="89.6" y="14" width="67.6" height="6" rx="3" fill="#17752f"/><text x="89.6" y="42" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#17752f">2. Đoán kế hoạch</text><rect x="163.2" y="14" width="67.6" height="6" rx="3" fill="#0f766e"/><text x="163.2" y="42" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f766e">3. Tạo index</text><rect x="236.79999999999998" y="14" width="67.6" height="6" rx="3" fill="#f6f0e7"/><text x="236.79999999999998" y="42" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#6b5f57">4. BRIN hay B-tree</text><rect x="310.4" y="14" width="67.6" height="6" rx="3" fill="#f6f0e7"/><text x="310.4" y="42" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#6b5f57">5. Kết luận</text></g><text x="84" y="146" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#6b5f57">PostgreSQL › L5 › Kiểm tra cấp</text><text x="84" y="176" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="800" fill="#2a2320">Bảng sự kiện chậm</text><rect x="84" y="188" width="284" height="22" rx="11" fill="#edf8f0"/><circle cx="95" cy="199" r="3.5" fill="#17752f"/><text x="106" y="203.32" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#17752f">Chạy thật · PostgreSQL 18.6 (PGlite)</text><text x="84" y="238" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#2a2320">Bước 3/5 · Tạo index</text><text x="84" y="264" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#2a2320">Câu báo cáo lọc events theo device_id rồi sắp</text><text x="84" y="285" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#2a2320">theo created_at. Đề xuất một index để câu đó</text><text x="84" y="306" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#2a2320">không còn đọc cả bảng.</text><rect x="84" y="316" width="360" height="112" rx="14" fill="#ffffff" stroke="#e8dfd3" stroke-width="1"/><text x="100" y="340" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#6b5f57">Chấm bằng</text><text x="100" y="364" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#17752f">✓</text><text x="122" y="364" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#2a2320">Đúng một index mới trên events</text><text x="100" y="386" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#17752f">✓</text><text x="122" y="386" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#2a2320">Câu đích đọc events qua index</text><text x="100" y="408" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#6b5f57">○</text><text x="122" y="408" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#2a2320">Kết quả câu đích không đổi</text><text x="84" y="456" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#6b5f57">Đã xong: 1 Đọc pg_stats ✓  2 Đoán kế hoạch ✓</text><rect x="464" y="53" width="4" height="747" rx="0" fill="#e8dfd3"/><rect x="468" y="53" width="812" height="36" rx="0" fill="#f6f0e7"/><text x="484" y="76" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#6b5f57">SQL · PostgreSQL 18.6 (PGlite) · index lab (rollback)</text><text x="1264" y="76" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f766e" text-anchor="end">Bước 3/5</text><rect x="468" y="89" width="812" height="70" rx="0" fill="#ffffff"/><rect x="476" y="93" width="796" height="40" rx="10" fill="#f4eee5"/><text x="490" y="117" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#2a2320">CREATE INDEX ON events (device_id, created_at);</tspan></text><rect x="484" y="167" width="151" height="40" rx="20" fill="#ffffff" stroke="#cfc2b2" stroke-width="1"/><text x="500" y="192.04" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#2a2320">Chạy thử</text><rect x="574.4" y="178" width="49.6" height="18" rx="5" fill="#f6f0e7"/><text x="579.4" y="191" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#6b5f57">Ctrl ↵</text><rect x="1068" y="167" width="180" height="40" rx="20" fill="#0f766e"/><text x="1084" y="192.04" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Nộp bước 3</text><rect x="1174.2" y="178" width="62.800000000000004" height="18" rx="5" fill="#dcf2ee"/><text x="1179.2" y="191" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#2a2320">Ctrl ⇧ ↵</text><rect x="468" y="219" width="812" height="40" rx="0" fill="#ffffff"/><line x1="468" y1="259" x2="1280" y2="259" stroke="#e8dfd3" stroke-width="1"/><text x="484" y="245" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#6b5f57">Kết quả</text><line x1="555.134" y1="231" x2="555.134" y2="247" stroke="#cfc2b2" stroke-width="1"/><text x="569.134" y="245" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f766e">Kế hoạch</text><rect x="565.134" y="256" width="73.296" height="3" rx="1.5" fill="#0f766e"/><text x="662.4300000000001" y="245" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#6b5f57">Bên trong</text><text x="1264" y="245" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#6b5f57" text-anchor="end">5 dòng · 5 cột · 3 ms</text><text x="488" y="290" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#2a2320">Câu đích · trước và sau index của bạn (chi phí planner)</text><rect x="488" y="306" width="360" height="52" rx="10" fill="#ffffff" stroke="#6b5f57" stroke-width="1.5"/><text x="500" y="328" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#2a2320">Seq Scan on events</text><text x="500" y="348" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12" fill="#6b5f57">cost 0.00..2341.00</text><text x="668" y="380" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#6b5f57" text-anchor="middle">Trước</text><line x1="860" y1="332" x2="900" y2="332" stroke="#0f766e" stroke-width="2" marker-end="url(#m-accent)"/><rect x="908" y="306" width="352" height="52" rx="10" fill="#dcf2ee" stroke="#0f766e" stroke-width="2"/><text x="920" y="328" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#2a2320">Index Scan on events</text><text x="920" y="348" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12" fill="#6b5f57">using events_device_id_created_at_idx</text><text x="1084" y="380" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f766e" text-anchor="middle">Sau</text><text x="488" y="420" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="13" fill="#2a2320">cost 0.42..8.44 · rows 37</text><text x="908" y="420" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#17752f">Không còn nút Sort</text><rect x="488" y="444" width="772" height="60" rx="10" fill="#e4f0f7"/><text x="504" y="468" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#2a2320">Index chỉ tồn tại trong lần chạy này: mọi thứ được ROLLBACK. Kế hoạch so bằng chi phí</text><text x="504" y="488" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#2a2320">planner, không bao giờ ms (luật chương 11).</text></svg>
