amily="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8f3ed">Logistics ▾</text><rect x="1162" y="15" width="76" height="24" rx="12" fill="#3a2c10"/><text x="1172" y="31.32" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffc874">1 240 XP</text><rect x="1236" y="10" width="32" height="32" rx="16" fill="none"/><text x="1252" y="31.04" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#62dccb">⋯</text><g transform="translate(0,53)"><rect x="0" y="0" width="64" height="747" rx="0" fill="#201c19"/><line x1="64" y1="0" x2="64" y2="747" stroke="#4d443c" stroke-width="1"/><rect x="16" y="12" width="32" height="28" rx="14" fill="none"/><text x="32" y="31.04" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#62dccb">»</text><rect x="10" y="52" width="44" height="40" rx="10" fill="#163a35"/><rect x="22" y="62" width="20" height="20" rx="5" fill="#163a35" stroke="#62dccb" stroke-width="1.2"/><circle cx="32" cy="108" r="7" fill="#74de93" stroke="#74de93" stroke-width="1.5"/><circle cx="32" cy="138" r="7" fill="#74de93" stroke="#74de93" stroke-width="1.5"/><circle cx="32" cy="168" r="7" fill="#74de93" stroke="#74de93" stroke-width="1.5"/><circle cx="32" cy="198" r="7" fill="#74de93" stroke="#74de93" stroke-width="1.5"/><circle cx="32" cy="228" r="9" fill="#62dccb" stroke="#62dccb" stroke-width="1.5"/><text x="32" y="232" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="800" fill="#082320" text-anchor="middle">5</text><line x1="14" y1="268" x2="50" y2="268" stroke="#4d443c" stroke-width="1"/><rect x="22" y="282" width="20" height="20" rx="5" fill="#163a35" stroke="#d0c5b9" stroke-width="1.2"/><rect x="22" y="318" width="20" height="20" rx="5" fill="#163a35" stroke="#d0c5b9" stroke-width="1.2"/><rect x="22" y="354" width="20" height="20" rx="5" fill="#163a35" stroke="#d0c5b9" stroke-width="1.2"/></g><rect x="64" y="53" width="400" height="747" rx="0" fill="#131110"/><g transform="translate(64,53)"><rect x="0" y="0" width="400" height="64" rx="0" fill="#201c19"/><line x1="0" y1="64" x2="400" y2="64" stroke="#4d443c" stroke-width="1"/><rect x="16" y="14" width="67.6" height="6" rx="3" fill="#74de93"/><text x="16" y="42" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#74de93">1. Đọc pg_stats</text><rect x="89.6" y="14" width="67.6" height="6" rx="3" fill="#74de93"/><text x="89.6" y="42" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#74de93">2. Đoán kế hoạch</text><rect x="163.2" y="14" width="67.6" height="6" rx="3" fill="#62dccb"/><text x="163.2" y="42" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#62dccb">3. Tạo index</text><rect x="236.79999999999998" y="14" width="67.6" height="6" rx="3" fill="#2b2622"/><text x="236.79999999999998" y="42" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#d0c5b9">4. BRIN hay B-tree</text><rect x="310.4" y="14" width="67.6" height="6" rx="3" fill="#2b2622"/><text x="310.4" y="42" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#d0c5b9">5. Kết luận</text></g><text x="84" y="146" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#d0c5b9">PostgreSQL › L5 › Kiểm tra cấp</text><text x="84" y="176" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="800" fill="#f8f3ed">Bảng sự kiện chậm</text><rect x="84" y="188" width="284" height="22" rx="11" fill="#163420"/><circle cx="95" cy="199" r="3.5" fill="#74de93"/><text x="106" y="203.32" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#74de93">Chạy thật · PostgreSQL 18.6 (PGlite)</text><text x="84" y="238" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#f8f3ed">Bước 3/5 · Tạo index</text><text x="84" y="264" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#f8f3ed">Câu báo cáo lọc events theo device_id rồi sắp</text><text x="84" y="285" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#f8f3ed">theo created_at. Đề xuất một index để câu đó</text><text x="84" y="306" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#f8f3ed">không còn đọc cả bảng.</text><rect x="84" y="316" width="360" height="112" rx="14" fill="#201c19" stroke="#4d443c" stroke-width="1"/><text x="100" y="340" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#d0c5b9">Chấm bằng</text><text x="100" y="364" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#74de93">✓</text><text x="122" y="364" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#f8f3ed">Đúng một index mới trên events</text><text x="100" y="386" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#74de93">✓</text><text x="122" y="386" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#f8f3ed">Câu đích đọc events qua index</text><text x="100" y="408" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#d0c5b9">○</text><text x="122" y="408" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#f8f3ed">Kết quả câu đích không đổi</text><text x="84" y="456" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#d0c5b9">Đã xong: 1 Đọc pg_stats ✓  2 Đoán kế hoạch ✓</text><rect x="464" y="53" width="4" height="747" rx="0" fill="#4d443c"/><rect x="468" y="53" width="812" height="36" rx="0" fill="#2b2622"/><text x="484" y="76" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#d0c5b9">SQL · PostgreSQL 18.6 (PGlite) · index lab (rollback)</text><text x="1264" y="76" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#62dccb" text-anchor="end">Bước 3/5</text><rect x="468" y="89" width="812" height="70" rx="0" fill="#201c19"/><rect x="476" y="93" width="796" height="40" rx="10" fill="#2b2622"/><text x="490" y="117" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#f8f3ed">CREATE INDEX ON events (device_id, created_at);</tspan></text><rect x="484" y="167" width="151" height="40" rx="20" fill="#201c19" stroke="#7d7166" stroke-width="1"/><text x="500" y="192.04" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8f3ed">Chạy thử</text><rect x="574.4" y="178" width="49.6" height="18" rx="5" fill="#2b2622"/><text x="579.4" y="191" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#d0c5b9">Ctrl ↵</text><rect x="1068" y="167" width="180" height="40" rx="20" fill="#62dccb"/><text x="1084" y="192.04" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#082320">Nộp bước 3</text><rect x="1174.2" y="178" width="62.800000000000004" height="18" rx="5" fill="#163a35"/><text x="1179.2" y="191" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#f8f3ed">Ctrl ⇧ ↵</text><rect x="468" y="219" width="812" height="40" rx="0" fill="#201c19"/><line x1="468" y1="259" x2="1280" y2="259" stroke="#4d443c" stroke-width="1"/><text x="484" y="245" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#d0c5b9">Kết quả</text><line x1="555.134" y1="231" x2="555.134" y2="247" stroke="#7d7166" stroke-width="1"/><text x="569.134" y="245" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#62dccb">Kế hoạch</text><rect x="565.134" y="256" width="73.296" height="3" rx="1.5" fill="#62dccb"/><text x="662.4300000000001" y="245" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#d0c5b9">Bên trong</text><text x="1264" y="245" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#d0c5b9" text-anchor="end">5 dòng · 5 cột · 3 ms</text><text x="488" y="290" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8f3ed">Câu đích · trước và sau index của bạn (chi phí planner)</text><rect x="488" y="306" width="360" height="52" rx="10" fill="#201c19" stroke="#d0c5b9" stroke-width="1.5"/><text x="500" y="328" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#f8f3ed">Seq Scan on events</text><text x="500" y="348" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12" fill="#d0c5b9">cost 0.00..2341.00</text><text x="668" y="380" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#d0c5b9" text-anchor="middle">Trước</text><line x1="860" y1="332" x2="900" y2="332" stroke="#62dccb" stroke-width="2" marker-end="url(#m-accent)"/><rect x="908" y="306" width="352" height="52" rx="10" fill="#163a35" stroke="#62dccb" stroke-width="2"/><text x="920" y="328" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#f8f3ed">Index Scan on events</text><text x="920" y="348" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12" fill="#d0c5b9">using events_device_id_created_at_idx</text><text x="1084" y="380" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#62dccb" text-anchor="middle">Sau</text><text x="488" y="420" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="13" fill="#f8f3ed">cost 0.42..8.44 · rows 37</text><text x="908" y="420" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#74de93">Không còn nút Sort</text><rect x="488" y="444" width="772" height="60" rx="10" fill="#142c39"/><text x="504" y="468" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#f8f3ed">Index chỉ tồn tại trong lần chạy này: mọi thứ được ROLLBACK. Kế hoạch so bằng chi phí</text><text x="504" y="488" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#f8f3ed">planner, không bao giờ ms (luật chương 11).</text></svg>
<rect x="40" y="100" width="1280" height="800" rx="0" fill="none" stroke="#7d7166" stroke-width="1"/>
<circle cx="510" cy="130" r="10" fill="#dcaeff"/><text x="510" y="134" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#201c19" text-anchor="middle">1</text><circle cx="510" cy="460" r="10" fill="#dcaeff"/><text x="510" y="464" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#201c19" text-anchor="middle">2</text><circle cx="1338" cy="450" r="10" fill="#dcaeff"/><text x="1338" y="454" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#201c19" text-anchor="middle">3</text><text x="40" y="935" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#dcaeff">① Thanh bước dính đầu pane đề (nền --panel đặc, vạch dưới); bước xong --good, đang làm --accent; tải lại tiếp từ bossStep.  ② &quot;Chấm bằng&quot; liệt kê từng điều kiện, cập nhật sau mỗi lần Nộp (✓/○, chữ, không chỉ màu).</text><text x="40" y="953" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#dcaeff">③ Tab Kế hoạch: hai nút kế hoạch cạnh nhau, mũi tên --accent; xong capstone: Lily reo ở dock (không trong sơ đồ).</text>
</svg>
