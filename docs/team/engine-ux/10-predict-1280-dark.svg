end">0/12</text><rect x="28" y="379" width="34" height="22" rx="11" fill="#2b2622"/><text x="38" y="394.32" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#d0c5b9">L4</text><text x="70" y="395" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#d0c5b9">Planner và khóa</text><text x="236" y="395" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#d0c5b9" text-anchor="end">0/14</text><rect x="28" y="413" width="34" height="22" rx="11" fill="#2b2622"/><text x="38" y="428.32" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#d0c5b9">L5</text><text x="70" y="429" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#d0c5b9">Nội tạng, vận hành</text><text x="236" y="429" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#d0c5b9" text-anchor="end">0/16</text><rect x="20" y="456" width="20" height="20" rx="5" fill="#163a35" stroke="#d0c5b9" stroke-width="1.2"/><text x="50" y="471" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#f8f3ed">MongoDB</text><text x="236" y="471" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#d0c5b9" text-anchor="end">3/65</text><rect x="20" y="496" width="20" height="20" rx="5" fill="#163a35" stroke="#d0c5b9" stroke-width="1.2"/><text x="50" y="511" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#f8f3ed">DynamoDB</text><text x="236" y="511" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#d0c5b9" text-anchor="end">0/58</text><line x1="20" y1="532" x2="236" y2="532" stroke="#4d443c" stroke-width="1"/><rect x="20" y="544" width="20" height="20" rx="5" fill="#163a35" stroke="#d0c5b9" stroke-width="1.2"/><text x="50" y="559" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8f3ed">Best Practice</text></g><text x="288" y="85" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#d0c5b9">Database Engine › PostgreSQL › L2 › Index nhiều cột</text><text x="288" y="119" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="800" fill="#f8f3ed">Đoán kế hoạch: INCLUDE</text><rect x="584.172" y="101" width="284" height="22" rx="11" fill="#163420"/><circle cx="595.172" cy="112" r="3.5" fill="#74de93"/><text x="606.172" y="116.32" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#74de93">Chạy thật · PostgreSQL 18.6 (PGlite)</text><text x="288" y="147" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#d0c5b9">Đoán · 5 phút</text><text x="288" y="176" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#f8f3ed">Đang có</text><rect x="288" y="186" width="880" height="40" rx="10" fill="#2b2622"/><text x="302" y="210" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#f8f3ed">CREATE INDEX events_user_created ON events (user_id, created_at) INCLUDE (id);</tspan></text><text x="288" y="256" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#f8f3ed">Câu được hỏi</text><rect x="288" y="266" width="880" height="40" rx="10" fill="#2b2622"/><text x="302" y="290" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#f8f3ed">SELECT id, created_at FROM events WHERE user_id = 42 ORDER BY created_at;</tspan></text><text x="288" y="340" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8f3ed">Postgres sẽ đọc bảng events thế nào?</text><rect x="288" y="356" width="434" height="44" rx="14" fill="#201c19" stroke="#7d7166" stroke-width="1"/><circle cx="310" cy="378" r="8" fill="#201c19" stroke="#7d7166" stroke-width="2"/><text x="328" y="383" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#f8f3ed">Seq Scan rồi Sort</text><rect x="734" y="356" width="434" height="44" rx="14" fill="#201c19" stroke="#7d7166" stroke-width="1"/><circle cx="756" cy="378" r="8" fill="#201c19" stroke="#7d7166" stroke-width="2"/><text x="774" y="383" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#f8f3ed">Bitmap Heap Scan rồi Sort</text><rect x="288" y="410" width="434" height="44" rx="14" fill="#201c19" stroke="#7d7166" stroke-width="1"/><circle cx="310" cy="432" r="8" fill="#201c19" stroke="#7d7166" stroke-width="2"/><text x="328" y="437" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#f8f3ed">Index Scan, không Sort</text><rect x="734" y="410" width="434" height="44" rx="14" fill="#163420" stroke="#74de93" stroke-width="2"/><circle cx="756" cy="432" r="8" fill="#201c19" stroke="#74de93" stroke-width="2"/><circle cx="756" cy="432" r="4" fill="#74de93"/><text x="774" y="437" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#f8f3ed">Index Only Scan, không Sort</text><text x="1154" y="437" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#74de93" text-anchor="end">Đúng</text><rect x="288" y="476" width="114" height="40" rx="20" fill="#2b2622" stroke="#7d7166" stroke-width="1"/><text x="304" y="501.04" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#d0c5b9">Xem thật ▸</text><text x="418" y="500" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#d0c5b9">Đã chạy · đoán lại được</text><rect x="288" y="528" width="880" height="268" rx="20" fill="#201c19" stroke="#7d7166" stroke-width="1" filter="url(#sh1)"/><rect x="312" y="548" width="62" height="22" rx="11" fill="#163420"/><text x="322" y="563.32" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#74de93">✓ Đúng</text><text x="388" y="564" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8f3ed">Kế hoạch thật · chi phí planner, không phải thời gian</text><rect x="312" y="590" width="420" height="52" rx="10" fill="#163a35" stroke="#62dccb" stroke-width="2"/><text x="324" y="612" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#f8f3ed">Index Only Scan</text><text x="324" y="632" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12" fill="#d0c5b9">using events_user_created</text><text x="748" y="612" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="13" fill="#f8f3ed">cost 0.43..8.60</text><text x="748" y="632" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="13" fill="#d0c5b9">rows 12 · width 12</text><text x="312" y="670" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#f8f3ed">Không có nút Sort: index đã xếp theo created_at sau user_id.</text><rect x="312" y="686" width="832" height="64" rx="10" fill="#2b2622"/><text x="328" y="712" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#f8f3ed">Vì sao: cột lọc đứng đầu index, cột sắp xếp đứng ngay sau, id nằm trong INCLUDE</text><text x="328" y="732" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#f8f3ed">nên không phải về heap.</text><rect x="1014" y="744" width="130" height="36" rx="18" fill="#62dccb"/><text x="1030" y="767.04" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#082320">Bài tiếp ›</text></svg>
