<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="t d">
<title id="t">Cùng ngữ pháp hình cho MongoDB và DynamoDB (sáng)</title>
<desc id="d">MongoDB: băng chuyền stage với số tài liệu, dãy khóa ESR với vùng quét; DynamoDB: partition theo hash, khóa nóng, GSI chiếu.</desc>
<!-- BoonData Engine UX mockup, theme light. Hex values = tokens of src/style.css (:root). Purple dashed = spec annotation, not UI. -->
<defs><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b5f57"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="m-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a4f00"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker><marker id="m-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5fa5"/></marker><marker id="m-ann" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a2bb0"/></marker><marker id="m-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17752f"/></marker><marker id="m-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a2320"/></marker>
<pattern id="hatch-bad" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fdecea"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b42318" stroke-width="1.2"/></pattern>
<pattern id="hatch-free" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f6f0e7"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e8dfd3" stroke-width="1"/></pattern>
<pattern id="dots-info" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e4f0f7"/><circle cx="3" cy="3" r="0.9" fill="#0b5fa5"/></pattern>
<filter id="sh1" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#2a2320" flood-opacity="0.08"/></filter>
</defs>
<rect x="0" y="0" width="1400" height="860" rx="0" fill="#efe9df"/>
<text x="40" y="40" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="800" fill="#2a2320">19 · Một ngữ pháp cho MongoDB và DynamoDB</text><text x="40" y="64" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#6b5f57">Số liệu minh họa.</text><rect x="1110" y="22" width="16" height="12" rx="0" fill="none" stroke="#7a2bb0" stroke-width="1.5" stroke-dasharray="4 3"/><text x="1132" y="33" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#7a2bb0">tím đứt = chú thích spec, không phải UI</text><rect x="40" y="100" width="1320" height="220" rx="20" fill="#ffffff" stroke="#e8dfd3" stroke-width="1" filter="url(#sh1)"/><text x="64" y="134" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#2a2320">A · MongoDB · pipeline từng bước (mingo, đếm thật bằng tiền tố pipeline)</text><rect x="64" y="150" width="216" height="70" rx="10" fill="#ffffff" stroke="#6b5f57" stroke-width="1.5"/><rect x="65" y="151" width="214" height="16" rx="9" fill="#f6f0e7"/><text x="72" y="163" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#6b5f57">stage 1</text><text x="76" y="188" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="14" font-weight="800" fill="#2a2320">$match</text><text x="76" y="208" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12" fill="#6b5f57">status: &quot;PAID&quot;</text><rect x="204" y="180" width="52" height="20" rx="10" fill="#dcf2ee"/><text x="214" y="193.96" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f766e">1 204</text><line x1="282" y1="185" x2="318" y2="185" stroke="#6b5f57" stroke-width="1.5" marker-end="url(#m-muted)"/><rect x="320" y="150" width="216" height="70" rx="10" fill="#ffffff" stroke="#6b5f57" stroke-width="1.5"/><rect x="321" y="151" width="214" height="16" rx="9" fill="#f6f0e7"/><text x="328" y="163" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#6b5f57">stage 2</text><text x="332" y="188" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="14" font-weight="800" fill="#2a2320">$unwind</text><text x="332" y="208" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12" fill="#6b5f57">&quot;$lines&quot;</text><rect x="460" y="180" width="52" height="20" rx="10" fill="#dcf2ee"/><text x="470" y="193.96" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f766e">3 870</text><line x1="538" y1="185" x2="574" y2="185" stroke="#6b5f57" stroke-width="1.5" marker-end="url(#m-muted)"/><rect x="576" y="150" width="216" height="70" rx="10" fill="#dcf2ee" stroke="#0f766e" stroke-width="2"/><rect x="577" y="151" width="214" height="16" rx="9" fill="#f6f0e7"/><text x="584" y="163" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#6b5f57">stage 3</text><text x="588" y="188" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="14" font-weight="800" fill="#2a2320">$group</text><text x="588" y="208" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12" fill="#6b5f57">_id: &quot;$lines.sku&quot;</text><rect x="716" y="180" width="39" height="20" rx="10" fill="#dcf2ee"/><text x="726" y="193.96" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f766e">212</text><line x1="794" y1="185" x2="830" y2="185" stroke="#6b5f57" stroke-width="1.5" marker-end="url(#m-muted)"/><rect x="832" y="150" width="216" height="70" rx="10" fill="#ffffff" stroke="#6b5f57" stroke-width="1.5"/><rect x="833" y="151" width="214" height="16" rx="9" fill="#f6f0e7"/><text x="840" y="163" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#6b5f57">stage 4</text><text x="844" y="188" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="14" font-weight="800" fill="#2a2320">$sort</text><text x="844" y="208" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12" fill="#6b5f57">total: -1</text><rect x="972" y="180" width="39" height="20" rx="10" fill="#dcf2ee"/><text x="982" y="193.96" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f766e">212</text><line x1="1050" y1="185" x2="1086" y2="185" stroke="#6b5f57" stroke-width="1.5" marker-end="url(#m-muted)"/><rect x="1088" y="150" width="216" height="70" rx="10" fill="#ffffff" stroke="#6b5f57" stroke-width="1.5"/><rect x="1089" y="151" width="214" height="16" rx="9" fill="#f6f0e7"/><text x="1096" y="163" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#6b5f57">stage 5</text><text x="1100" y="188" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="14" font-weight="800" fill="#2a2320">$limit</text><text x="1100" y="208" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12" fill="#6b5f57">5</text><rect x="1228" y="180" width="26" height="20" rx="10" fill="#dcf2ee"/><text x="1238" y="193.96" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f766e">5</text><text x="64" y="260" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#2a2320">Số trong chip = số tài liệu SAU stage đó (output thật). Stage đang chọn viền --accent; bảng tài liệu của stage hiện dưới (16 · quy tắc).</text><rect x="40" y="340" width="650" height="300" rx="20" fill="#ffffff" stroke="#e8dfd3" stroke-width="1" filter="url(#sh1)"/><text x="64" y="374" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#2a2320">B · MongoDB · dãy khóa index ESR (luật thuần)</text><text x="64" y="398" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12" fill="#6b5f57">index { status: 1, created: 1, total: 1 } · câu: status = PAID, sort created, total &gt; 100</text><rect x="64" y="420" width="80" height="40" rx="4" fill="#ffffff" stroke="#6b5f57" stroke-width="1.2"/><text x="104" y="445" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10" fill="#2a2320" text-anchor="middle">NEW|…</text><rect x="150" y="420" width="80" height="40" rx="4" fill="#dcf2ee" stroke="#0f766e" stroke-width="2"/><text x="190" y="445" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10" fill="#2a2320" text-anchor="middle">PAID|01-02</text><rect x="236" y="420" width="80" height="40" rx="4" fill="#dcf2ee" stroke="#0f766e" stroke-width="2"/><text x="276" y="445" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10" fill="#2a2320" text-anchor="middle">PAID|01-05</text><rect x="322" y="420" width="80" height="40" rx="4" fill="#dcf2ee" stroke="#0f766e" stroke-width="2"/><text x="362" y="445" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10" fill="#2a2320" text-anchor="middle">PAID|01-09</text><rect x="408" y="420" width="80" height="40" rx="4" fill="#dcf2ee" stroke="#0f766e" stroke-width="2"/><text x="448" y="445" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10" fill="#2a2320" text-anchor="middle">PAID|02-11</text><rect x="494" y="420" width="80" height="40" rx="4" fill="#dcf2ee" stroke="#0f766e" stroke-width="2"/><text x="534" y="445" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10" fill="#2a2320" text-anchor="middle">PAID|03-01</text><rect x="580" y="420" width="80" height="40" rx="4" fill="#ffffff" stroke="#6b5f57" stroke-width="1.2"/><text x="620" y="445" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10" fill="#2a2320" text-anchor="middle">SHIP|…</text><rect x="146" y="412" width="432" height="56" rx="8" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="6 3"/><text x="150" y="488" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f766e">vùng quét liên tục: Equality → Sort → Range (tốt)</text><text x="64" y="530" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#6b5f57">Xấu: Range đứng trước Sort → các ô sáng rời rạc + hộp &quot;SORT trong bộ nhớ&quot; --warn.</text><rect x="64" y="550" width="180" height="36" rx="10" fill="#fcf0dc" stroke="#9a4f00" stroke-width="1.5"/><text x="76" y="573" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="800" fill="#9a4f00">SORT trong bộ nhớ</text><rect x="260" y="557" width="279" height="22" rx="11" fill="#e4f0f7"/><text x="270" y="572.32" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#0b5fa5">chấm theo luật ESR, không phải mongod</text><rect x="710" y="340" width="650" height="300" rx="20" fill="#ffffff" stroke="#e8dfd3" stroke-width="1" filter="url(#sh1)"/><text x="734" y="374" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#2a2320">C · DynamoDB · partition và GSI (dynoxide)</text><rect x="734" y="390" width="96" height="120" rx="10" fill="#ffffff" stroke="#6b5f57" stroke-width="1.5"/><rect x="735" y="391" width="94" height="16" rx="9" fill="#f6f0e7"/><text x="742" y="403" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="11" font-weight="800" fill="#6b5f57">P1</text><rect x="744" y="490" width="76" height="8" rx="4" fill="#f6f0e7"/><rect x="744" y="490" width="20" height="8" rx="4" fill="#0f766e"/><text x="782" y="480" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#9a4f00" text-anchor="middle"></text><rect x="844" y="390" width="96" height="120" rx="10" fill="#fcf0dc" stroke="#9a4f00" stroke-width="2.5"/><rect x="845" y="391" width="94" height="16" rx="9" fill="#f6f0e7"/><text x="852" y="403" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="11" font-weight="800" fill="#6b5f57">P2</text><rect x="854" y="490" width="76" height="8" rx="4" fill="#f6f0e7"/><rect x="854" y="490" width="76" height="8" rx="4" fill="#9a4f00"/><text x="892" y="480" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#9a4f00" text-anchor="middle">nóng</text><rect x="954" y="390" width="96" height="120" rx="10" fill="#ffffff" stroke="#6b5f57" stroke-width="1.5"/><rect x="955" y="391" width="94" height="16" rx="9" fill="#f6f0e7"/><text x="962" y="403" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="11" font-weight="800" fill="#6b5f57">P3</text><rect x="964" y="490" width="76" height="8" rx="4" fill="#f6f0e7"/><rect x="964" y="490" width="32" height="8" rx="4" fill="#0f766e"/><text x="1002" y="480" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#9a4f00" text-anchor="middle"></text><rect x="1064" y="390" width="96" height="120" rx="10" fill="#ffffff" stroke="#6b5f57" stroke-width="1.5"/><rect x="1065" y="391" width="94" height="16" rx="9" fill="#f6f0e7"/><text x="1072" y="403" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="11" font-weight="800" fill="#6b5f57">P4</text><rect x="1074" y="490" width="76" height="8" rx="4" fill="#f6f0e7"/><rect x="1074" y="490" width="38" height="8" rx="4" fill="#0f766e"/><text x="1112" y="480" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#9a4f00" text-anchor="middle"></text><text x="734" y="532" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#6b5f57">Thanh = WCU/RCU tiêu thụ so với trần partition (3000 / 1000). Nóng: --warn + chữ &quot;nóng&quot;.</text><rect x="734" y="552" width="420" height="60" rx="10" fill="#ffffff" stroke="#6b5f57" stroke-width="1.5"/><rect x="735" y="553" width="418" height="16" rx="9" fill="#f6f0e7"/><text x="742" y="565" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#6b5f57">GSI1 · khóa GSI1PK / GSI1SK · chiếu KEYS_ONLY</text><text x="746" y="596" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12" fill="#2a2320">STORE#S-07 | 2026-10-31#ORDER#…</text><line x1="790" y1="512" x2="790" y2="550" stroke="#9a4f00" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#m-warn)"/><text x="800" y="545" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#9a4f00">chiếu bất đồng bộ</text><rect x="40" y="660" width="1320" height="170" rx="20" fill="#ffffff" stroke="#e8dfd3" stroke-width="1" filter="url(#sh1)"/><text x="64" y="694" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#2a2320">D · Bảng ánh xạ ngữ pháp</text><text x="64" y="714" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#2a2320">Hộp có đầu xám (--eng-head, chữ mono 10 px) = đơn vị lưu trữ: trang Postgres, nút B-tree, stage Mongo, partition / GSI Dynamo.</text><text x="64" y="740" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#2a2320">Ô trong hộp = phần tử: tuple, khóa, tài liệu, item. Trạng thái = màu + hoa văn + huy hiệu chữ (sống/chết/HOT/băng; nóng; quét).</text><text x="64" y="766" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#2a2320">Mũi tên 4 kiểu (F của 18). Số luôn là chip mono hoặc ô thống kê, nguồn ghi rõ (chạy thật / ghi sẵn).</text><text x="64" y="792" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#2a2320">Không màu riêng cho từng engine: nhận diện engine bằng tên + icon ở đầu trang, không bằng màu sơ đồ (tránh đổi nghĩa màu).</text>
</svg>
