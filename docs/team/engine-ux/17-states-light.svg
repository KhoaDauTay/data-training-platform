<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1060" viewBox="0 0 1400 1060" role="img" aria-labelledby="t d">
<title id="t">Trạng thái rỗng, tải, lỗi (sáng)</title>
<desc id="d">Mười ô trạng thái của khu Engine: tải chunk, chunk lỗi, đang dựng lab, prepare lỗi, unsupported, thiếu viz, Bên trong rỗng, tải DynamoDB 1,2 MB, quá 5 giây, bài cần máy chủ thật.</desc>
<!-- BoonData Engine UX mockup, theme light. Hex values = tokens of src/style.css (:root). Purple dashed = spec annotation, not UI. -->
<defs><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b5f57"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="m-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a4f00"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker><marker id="m-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b5fa5"/></marker><marker id="m-ann" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a2bb0"/></marker><marker id="m-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17752f"/></marker><marker id="m-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a2320"/></marker>
<pattern id="hatch-bad" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fdecea"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b42318" stroke-width="1.2"/></pattern>
<pattern id="hatch-free" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f6f0e7"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e8dfd3" stroke-width="1"/></pattern>
<pattern id="dots-info" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e4f0f7"/><circle cx="3" cy="3" r="0.9" fill="#0b5fa5"/></pattern>
<filter id="sh1" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#2a2320" flood-opacity="0.08"/></filter>
</defs>
<rect x="0" y="0" width="1400" height="1060" rx="0" fill="#efe9df"/>
<text x="40" y="40" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="800" fill="#2a2320">17 · Trạng thái rỗng, tải, lỗi</text><text x="40" y="64" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#6b5f57">Ô nền mềm theo nghĩa (--bad-soft lỗi, --warn-soft cảnh báo, --info-soft thông tin); chữ --text; một hành động mỗi ô.</text><rect x="1110" y="22" width="16" height="12" rx="0" fill="none" stroke="#7a2bb0" stroke-width="1.5" stroke-dasharray="4 3"/><text x="1132" y="33" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#7a2bb0">tím đứt = chú thích spec, không phải UI</text><rect x="40" y="100" width="320" height="260" rx="20" fill="#ffffff" stroke="#e8dfd3" stroke-width="1" filter="url(#sh1)"/><text x="64" y="136" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#2a2320">Tải trang bài (chunk engineui)</text><rect x="64" y="170" width="24" height="24" rx="12" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="30 10"/><text x="100" y="188" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#6b5f57">Đang tải bài…</text><text x="64" y="240" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#6b5f57">Dòng cố định thay khung trang;</text><text x="64" y="258" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#6b5f57">không skeleton nhấp nháy.</text><rect x="376" y="100" width="320" height="260" rx="20" fill="#ffffff" stroke="#e8dfd3" stroke-width="1" filter="url(#sh1)"/><text x="400" y="136" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#2a2320">Chunk lỗi (mạng)</text><rect x="400" y="160" width="272" height="90" rx="14" fill="#fdecea"/><text x="416" y="186" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#2a2320">Không tải được phần Database Engine.</text><text x="416" y="206" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#2a2320">Kiểm tra mạng rồi thử lại.</text><rect x="416" y="208" width="89" height="32" rx="16" fill="#ffffff" stroke="#cfc2b2" stroke-width="1"/><text x="432" y="229.04" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#2a2320">Thử lại</text><text x="400" y="278" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#6b5f57">Không tự thử lại vòng lặp; chỉ khi bấm.</text><rect x="712" y="100" width="320" height="260" rx="20" fill="#ffffff" stroke="#e8dfd3" stroke-width="1" filter="url(#sh1)"/><text x="736" y="136" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#2a2320">Lab đang dựng dữ liệu (prepare)</text><rect x="736" y="162" width="24" height="24" rx="12" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="30 10"/><text x="772" y="172" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#6b5f57">Đang dựng dữ liệu cho bài</text><text x="772" y="190" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#6b5f57">(bảng notes, 83 dòng)…</text><rect x="736" y="210" width="96" height="34" rx="17" fill="#f6f0e7" stroke="#cfc2b2" stroke-width="1"/><text x="752" y="232.04" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#6b5f57">Chạy</text><rect x="844" y="220" width="14" height="14" rx="3" fill="none" stroke="#6b5f57" stroke-width="1.4"/><text x="866" y="232" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#6b5f57">Chờ dữ liệu xong</text><rect x="1048" y="100" width="320" height="260" rx="20" fill="#ffffff" stroke="#e8dfd3" stroke-width="1" filter="url(#sh1)"/><text x="1072" y="136" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#2a2320">prepare lỗi (setup ném lỗi)</text><rect x="1072" y="156" width="272" height="120" rx="14" fill="#fdecea"/><rect x="1088" y="170" width="55" height="22" rx="11" fill="#fdecea"/><text x="1098" y="185.32" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#b42318">42P07</text><text x="1088" y="214" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#2a2320">Không dựng được dữ liệu cho bài này.</text><text x="1088" y="234" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12" fill="#6b5f57">relation &quot;notes&quot; already exists</text><rect x="1088" y="242" width="88" height="28" rx="14" fill="#ffffff" stroke="#cfc2b2" stroke-width="1"/><text x="1104" y="260.32" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#2a2320">Dựng lại</text><rect x="40" y="400" width="320" height="260" rx="20" fill="#ffffff" stroke="#e8dfd3" stroke-width="1" filter="url(#sh1)"/><text x="64" y="436" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#2a2320">Bước &quot;unsupported&quot;</text><rect x="64" y="456" width="272" height="120" rx="14" fill="#e4f0f7"/><text x="80" y="482" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#2a2320">Bước này kiểm bằng kế hoạch (plan),</text><text x="80" y="502" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#2a2320">bộ chạy hiện có không chấm được.</text><text x="80" y="522" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#2a2320">Bạn vẫn chạy và xem kết quả; bước</text><text x="80" y="542" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#2a2320">không tính đạt.</text><text x="64" y="600" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#6b5f57">Test nội dung chặn trước khi phát hành.</text><rect x="376" y="400" width="320" height="260" rx="20" fill="#ffffff" stroke="#e8dfd3" stroke-width="1" filter="url(#sh1)"/><text x="400" y="436" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#2a2320">Thiếu tên viz</text><text x="400" y="474" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#2a2320">Ý chính…</text><line x1="400" y1="490" x2="672" y2="490" stroke="#7a2bb0" stroke-width="1" stroke-dasharray="4 3"/><text x="400" y="512" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#2a2320">Ví dụ…</text><text x="400" y="550" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#6b5f57">Khe sơ đồ biến mất (không khung rỗng).</text><text x="400" y="570" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#6b5f57">tests: mọi viz có trong danh mục.</text><rect x="712" y="400" width="320" height="260" rx="20" fill="#ffffff" stroke="#e8dfd3" stroke-width="1" filter="url(#sh1)"/><text x="736" y="436" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#2a2320">Bên trong trước lần chạy đầu</text><rect x="856" y="462" width="32" height="32" rx="5" fill="#dcf2ee" stroke="#6b5f57" stroke-width="1.2"/><text x="872" y="524" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#6b5f57" text-anchor="middle">Chạy câu để vẽ trang heap</text><text x="872" y="542" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#6b5f57" text-anchor="middle">từ chính kết quả của bạn.</text><rect x="1048" y="400" width="320" height="260" rx="20" fill="#ffffff" stroke="#e8dfd3" stroke-width="1" filter="url(#sh1)"/><text x="1072" y="436" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#2a2320">Lần đầu mở lab DynamoDB</text><text x="1072" y="476" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#2a2320">Tải bộ máy DynamoDB</text><rect x="1072" y="490" width="272" height="8" rx="4" fill="#f6f0e7"/><rect x="1072" y="490" width="90" height="8" rx="4" fill="#0f766e"/><text x="1072" y="520" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="13" fill="#2a2320">0,4 / 1,2 MB</text><text x="1072" y="550" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#6b5f57">Báo trước dung lượng; chỉ tải khi mở bài</text><text x="1072" y="566" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#6b5f57">DynamoDB đầu tiên (D-E12).</text><rect x="40" y="700" width="320" height="260" rx="20" fill="#ffffff" stroke="#e8dfd3" stroke-width="1" filter="url(#sh1)"/><text x="64" y="736" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#2a2320">Câu chạy quá 5 giây</text><rect x="64" y="756" width="272" height="100" rx="14" fill="#fcf0dc"/><text x="80" y="782" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#2a2320">Câu chạy quá 5 giây nên đã dừng.</text><text x="80" y="802" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#2a2320">Dữ liệu lab được dựng lại; nháp</text><text x="80" y="822" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#2a2320">của bạn còn nguyên.</text><text x="64" y="890" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#6b5f57">Dòng của Boon dưới nút (Boon oops).</text><rect x="376" y="700" width="320" height="260" rx="20" fill="#ffffff" stroke="#e8dfd3" stroke-width="1" filter="url(#sh1)"/><text x="400" y="736" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#2a2320">Bài cần máy chủ thật (BE)</text><rect x="400" y="762" width="67" height="22" rx="11" fill="#f6f0e7"/><circle cx="411" cy="773" r="3.5" fill="#6b5f57"/><text x="422" y="777.32" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#6b5f57">Sơ đồ</text><text x="400" y="810" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#6b5f57">Phần chạy thật cần máy chủ thật</text><text x="400" y="827" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#6b5f57">(nhiều phiên / replica set / AWS). Bài</text><text x="400" y="844" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#6b5f57">này dùng sơ đồ và kết quả ghi sẵn.</text><text x="400" y="876" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#7a2bb0">Không chữ &quot;sắp có&quot;.</text>
</svg>
