<text x="40" y="930" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#dcaeff">1 · Thẻ Boon nhắc đặt ngay dưới dòng phản hồi, trên thanh tab; nền --sun như mọi lời Boon. Không gạch chân trong editor (gạch chân chỉ dành cho lỗi SQL).</text>
<text x="40" y="952" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#dcaeff">2 · 375: hai link thành nút cao 36 + vùng chạm 44; nút × 28 px (vùng chạm 44). Không che bảng kết quả.</text>
<text x="40" y="974" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#dcaeff">3 · Ẩn và tắt chỉ ghi pref thiết bị cargo-query/bp-tips; không vào Save. "Bật lại Boon nhắc" ở trang Best Practice.</text>
